<script>
(function () {
  'use strict';

  var state = {
    bootstrap: null,
    inventoryItems: [],
    ordersGroups: [],
    ordersDemoFilter: 'all', // 受注リストの「すべて／デモカーのみ」タブ
    action: null, // { type: 'hold' | 'secondHold' | 'order' | 'orderFromHold' | 'demoOrder', commission }
    staffList: [] // 設定タブで編集中の担当者マスタ（作業用コピー）
  };

  // ===== google.script.run を Promise 化するヘルパー =====
  // サーバー側が応答しない場合にボタンやモーダルが固まって見えないよう、
  // 一定時間で必ずエラーとして解決させるタイムアウトを設ける。
  var GAS_CALL_TIMEOUT_MS = 25000;

  function gasRun(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        reject(new Error('サーバーからの応答がありません。通信環境をご確認のうえ、もう一度お試しください。'));
      }, GAS_CALL_TIMEOUT_MS);

      google.script.run
        .withSuccessHandler(function (result) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(result);
        })
        .withFailureHandler(function (err) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(new Error(err && err.message ? err.message : String(err)));
        })
        [fnName].apply(null, args);
    });
  }

  // ===== ボタンの多重送信防止（処理中はラベルを差し替えて無効化） =====
  function setButtonBusy(btn, busy, busyLabel) {
    if (busy) {
      if (btn.dataset.originalLabel === undefined) btn.dataset.originalLabel = btn.textContent;
      btn.textContent = busyLabel || '処理中...';
      btn.disabled = true;
    } else {
      if (btn.dataset.originalLabel !== undefined) btn.textContent = btn.dataset.originalLabel;
      btn.disabled = false;
    }
  }

  function $(id) { return document.getElementById(id); }

  function showToast(message, isError) {
    var toast = $('toast');
    toast.textContent = message;
    toast.className = 'toast' + (isError ? ' toast--error' : '');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.add('hidden'); }, 3200);
  }

  // ===== Hold登録・2nd Hold登録・受注確定の応援／お祝いポップアップ =====
  var CELEBRATION_CONFIG = {
    hold: { emoji: '🥺', message: '頑張って', tone: 'hold' },
    secondHold: { emoji: '⏳', message: 'もう少し待ってね', tone: 'hold' },
    order: { emoji: '🎈㊗️🎉', message: 'おめでとう', tone: 'order', confetti: true },
    orderFromHold: { emoji: '🎈㊗️🎉', message: 'おめでとう', tone: 'order', confetti: true },
    demoOrder: { emoji: '🎈㊗️🎉', message: 'おめでとう', tone: 'order', confetti: true }
  };

  function showCelebration_(actionType) {
    var config = CELEBRATION_CONFIG[actionType];
    if (!config) return;
    var overlay = $('celebrationOverlay');
    $('celebrationCard').className = 'celebrationCard celebrationCard--' + config.tone;
    $('celebrationEmoji').textContent = config.emoji;
    $('celebrationMessage').textContent = config.message;
    overlay.classList.remove('hidden');
    if (config.confetti) triggerConfetti_();
    clearTimeout(showCelebration_._timer);
    showCelebration_._timer = setTimeout(function () {
      overlay.classList.add('hidden');
    }, config.confetti ? 2800 : 1800);
  }

  $('celebrationOverlay').addEventListener('click', function () {
    clearTimeout(showCelebration_._timer);
    this.classList.add('hidden');
  });

  var CONFETTI_COLORS = ['#1a73e8', '#34a853', '#fbbc05', '#ea4335', '#a142f4', '#00bcd4'];

  function triggerConfetti_() {
    var layer = $('confettiLayer');
    var pieces = [];
    var count = 90;
    for (var i = 0; i < count; i++) {
      var el = document.createElement('div');
      el.className = 'confettiPiece';
      el.style.left = (Math.random() * 100) + 'vw';
      el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      el.style.width = (6 + Math.random() * 6) + 'px';
      el.style.height = (10 + Math.random() * 8) + 'px';
      el.style.borderRadius = Math.random() < .5 ? '50%' : '2px';
      el.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      el.style.animationDelay = (Math.random() * .4) + 's';
      layer.appendChild(el);
      pieces.push(el);
    }
    setTimeout(function () {
      pieces.forEach(function (el) { el.remove(); });
    }, 4200);
  }

  function fillOptions(select, options, includeBlank) {
    select.innerHTML = '';
    if (includeBlank) select.appendChild(new Option('', ''));
    options.forEach(function (o) { select.appendChild(new Option(o, o)); });
  }

  function currentYearMonth() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function formatDateTime(epochMs) {
    if (!epochMs) return '-';
    var d = new Date(epochMs);
    return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') +
      ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function paidOptionsText(item) {
    var keys = (state.bootstrap && state.bootstrap.paidOptionKeys) ||
      ['paidOption1', 'paidOption2', 'paidOption3', 'paidOption4', 'paidOption5', 'paidOption6', 'paidOption7'];
    var values = keys.map(function (k) { return item[k]; }).filter(function (v) { return v; });
    return values.length ? values.join('、') : '-';
  }

  // ===== タブ切替 =====
  document.getElementById('mainTabs').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-tab]');
    if (!btn) return;
    document.querySelectorAll('.tabs__item').forEach(function (t) { t.classList.toggle('is-active', t === btn); });
    document.querySelectorAll('main.view').forEach(function (v) { v.classList.remove('is-active'); });
    $('view-' + btn.dataset.tab).classList.add('is-active');
    // 非表示（display: none）だった間はツールバーの実測高さが0になっているため、
    // 表示状態に切り替わった直後に再計測してスペーサーの高さを補正する。
    syncFixedBars_();
    if (btn.dataset.tab === 'settings') {
      loadDemoAvailableOptions_();
      loadDemoReservedList_();
    }
  });

  // ===== モーダル共通 =====
  document.querySelectorAll('[data-close-modal]').forEach(function (btn) {
    btn.addEventListener('click', function () { closeModal(btn.closest('.modal')); });
  });
  document.querySelectorAll('.modal').forEach(function (modal) {
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(modal); });
  });
  function openModal(modal) { modal.classList.remove('hidden'); }
  function closeModal(modal) { modal.classList.add('hidden'); }

  // ===== 在庫リスト =====
  function loadInventory() {
    var filters = {
      keyword: $('inventoryKeyword').value,
      includeHold: $('inventoryIncludeHold').checked
    };
    return gasRun('api_listInventory', filters).then(function (groups) {
      var items = (groups && groups[0] && groups[0].items) || [];
      populateInventoryMonthFilter_(items);
      var month = $('inventoryMonthFilter').value;
      if (month) {
        items = items.filter(function (v) { return v.registrableMonth === month; });
      }
      state.inventoryItems = items;
      renderInventory();
    }).catch(function (err) { showToast(err.message, true); });
  }

  // 可能月フィルタの選択肢は、現在の検索条件に該当する在庫の可能月から動的に作る
  // （当月は在庫がなくても常に選べるようにする）。
  function populateInventoryMonthFilter_(items) {
    var select = $('inventoryMonthFilter');
    var current = select.value;
    var thisMonth = currentYearMonth();
    var months = [];
    items.forEach(function (v) {
      if (v.registrableMonth && months.indexOf(v.registrableMonth) === -1) months.push(v.registrableMonth);
    });
    if (months.indexOf(thisMonth) === -1) months.push(thisMonth);
    months.sort();
    var options = ['<option value="">可能月：すべて</option>'].concat(months.map(function (m) {
      var label = m + (m === thisMonth ? '（今月）' : '');
      return '<option value="' + escapeHtml(m) + '">' + escapeHtml(label) + '</option>';
    }));
    select.innerHTML = options.join('');
    select.value = months.indexOf(current) !== -1 ? current : '';
  }

  function isRegistrableThisMonth_(v) {
    return !!v.registrableMonth && v.registrableMonth === currentYearMonth();
  }

  function metaRow_(label, value) {
    return '<div><dt>' + label + '</dt><dd>' + escapeHtml(value || '-') + '</dd></div>';
  }

  function vehicleCardHtml(v) {
    var isHold = v.holdStatus === 'hold';
    var badges = isHold
      ? '<span class="badge badge--hold"><span class="badge__dot"></span>Hold中</span>'
      : '<span class="badge badge--available"><span class="badge__dot"></span>在庫あり</span>';
    badges += v.stockDisclosure === '非開示'
      ? '<span class="badge badge--undisclosed">非開示</span>'
      : '<span class="badge badge--disclosed">開示</span>';
    if (isRegistrableThisMonth_(v)) {
      badges += '<span class="badge badge--thisMonth">当月登録可能</span>';
    }

    // 横長カードでも読みやすいよう、メタ情報は2列のミニグリッドで表示する
    // （1列の縦積みだとカードが縦に伸びてしまい、3列レイアウトに向かないため）。
    var meta = '<dl class="card__metaGrid">' +
      metaRow_('MP', v.mp) +
      metaRow_('ステア', v.steering) +
      metaRow_('カラー', (v.exteriorColor || '-') + ' / ' + (v.interiorColor || '-')) +
      metaRow_('有償OP', paidOptionsText(v)) +
      metaRow_('入港予定日', v.arrivalExpectedDate) +
      metaRow_('可能月', v.registrableMonth) +
      metaRow_('VPC', v.vpc) +
      '</dl>';

    // Hold状況の表示エリアは高さ固定（.card__holdArea）。Hold・2nd Holdが増えても
    // エリア内でスクロールするだけで、カード自体の高さは常に一定に保たれる。
    var holdInfoHtml;
    if (isHold) {
      holdInfoHtml = '<div class="card__holdArea">' +
        holdInfoBlockHtml_('1st Hold', v, 'hold', 'first') +
        (v.secondHoldCustomer ? holdInfoBlockHtml_('2nd Hold', v, 'secondHold', 'second') : '') +
        '</div>';
    } else {
      holdInfoHtml = '<div class="card__holdArea card__holdArea--empty">' +
        '<span class="card__holdArea__placeholder">現在Hold登録なし</span>' +
        '</div>';
    }

    var actionsHtml = '<div class="card__actions">';
    if (!isHold) {
      actionsHtml += '<button class="btn" data-hold="' + escapeHtml(v.commission) + '">Hold</button>';
      actionsHtml += '<button class="btn btn--primary" data-order="' + escapeHtml(v.commission) + '">受注</button>';
    } else {
      if (!v.secondHoldCustomer) {
        actionsHtml += '<button class="btn" data-second-hold="' + escapeHtml(v.commission) + '">2nd Hold</button>';
      }
      actionsHtml += '<button class="btn btn--primary" data-order-from-hold="' + escapeHtml(v.commission) + '">受注確定</button>';
    }
    actionsHtml += '</div>';

    return '<div class="card ' + (isHold ? 'card--hold' : 'card--available') + '">' +
      '<div class="card__top"><div><div class="card__model">' + escapeHtml(v.model) + '</div>' +
      '<div class="card__commission">' + escapeHtml(v.commission) + '</div></div>' +
      '<div class="card__badges">' + badges + '</div></div>' +
      '<div class="card__meta">' + meta + '</div>' +
      holdInfoHtml +
      actionsHtml +
      '</div>';
  }

  // Hold詳細ブロックは、常に見えている要約行（顧客・担当者・タイマー）と、
  // 折りたたみ式の詳細（リード番号・登録月・下取車・OSS・保険）に分ける。
  // これにより、2nd Holdが追加されてもカードが縦に伸びすぎず、サイズが揃う。
  function holdInfoBlockHtml_(label, v, prefix, rank) {
    var leadNumber = v[prefix + 'LeadNumber'];
    var staff = v[prefix + 'Staff'];
    var customer = v[prefix + 'Customer'];
    var registeredMonth = v[prefix + 'RegisteredMonth'];
    var tradeIn = v[prefix + 'TradeIn'];
    var oss = v[prefix + 'Oss'];
    var insurance = v[prefix + 'Insurance'];
    var createdAt = v[prefix + 'CreatedAt'];
    var expiresAt = v[prefix + 'ExpiresAt'];
    var cancelRank = rank === 'first' ? '1st' : '2nd';
    return '<div class="card__holdInfo card__holdInfo--' + rank + '">' +
      '<div class="card__holdInfo__head">' +
      '<span class="card__holdInfo__label">' + label + '</span>' +
      '<button class="card__holdInfo__cancel" type="button" data-cancel-hold="' + escapeHtml(v.commission) + '" data-cancel-rank="' + cancelRank + '">解除</button>' +
      '</div>' +
      '<div class="card__holdInfo__row"><b>' + escapeHtml(customer || '-') + '</b>（担当者 ' + escapeHtml(staff || '-') + '）</div>' +
      holdTimerHtml_(createdAt, expiresAt) +
      '<details class="card__holdInfo__details">' +
      '<summary>詳細</summary>' +
      '<div class="card__holdInfo__detailsBody">' +
      'リード番号 ' + escapeHtml(leadNumber || '-') +
      ' / 登録月 ' + escapeHtml(registeredMonth || '-') +
      ' / 下取車 ' + escapeHtml(tradeIn || '-') + ' / OSS ' + escapeHtml(oss || '-') +
      ' / 保険 ' + escapeHtml(insurance || '-') +
      '</div>' +
      '</details>' +
      '</div>';
  }

  // ===== Hold 72時間タイマー（視覚的なカウントダウン・進捗バー） =====
  function holdTimerHtml_(createdAt, expiresAt) {
    return '<div class="holdTimer" data-created-at="' + (createdAt || '') + '" data-expires-at="' + (expiresAt || '') + '">' +
      '<div class="holdTimer__bar"><div class="holdTimer__barFill"></div></div>' +
      '<div class="holdTimer__text">-</div>' +
      '</div>';
  }

  function formatDuration_(ms) {
    var totalSeconds = Math.max(0, Math.floor(ms / 1000));
    var hours = Math.floor(totalSeconds / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;
    return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }

  var HOLD_DURATION_MS_CLIENT = 72 * 60 * 60 * 1000; // サーバー側 HOLD_DURATION_MS と同じ値（表示用フォールバック）

  var expiredRefreshTimer = null;
  function scheduleExpiredRefresh_() {
    if (expiredRefreshTimer) return;
    expiredRefreshTimer = setTimeout(function () {
      expiredRefreshTimer = null;
      loadInventory();
    }, 15000);
  }

  function updateHoldTimers() {
    var now = Date.now();
    var anyExpired = false;
    document.querySelectorAll('.holdTimer').forEach(function (el) {
      var expiresAt = Number(el.dataset.expiresAt);
      if (!expiresAt) return;
      var createdAt = Number(el.dataset.createdAt) || expiresAt - HOLD_DURATION_MS_CLIENT;
      var fill = el.querySelector('.holdTimer__barFill');
      var text = el.querySelector('.holdTimer__text');

      if (now < createdAt) {
        // 2nd Hold: 1st Holdの期間が終わるまでは、まだ自身の72時間は始まっていない
        el.classList.remove('holdTimer--expired');
        el.classList.remove('holdTimer--warning');
        fill.style.width = '0%';
        text.textContent = '1st Hold終了後に開始（あと ' + formatDuration_(createdAt - now) + '）';
        return;
      }

      var total = expiresAt - createdAt;
      var remaining = expiresAt - now;
      if (remaining <= 0) {
        anyExpired = true;
        el.classList.add('holdTimer--expired');
        el.classList.remove('holdTimer--warning');
        fill.style.width = '0%';
        text.textContent = '期限切れ（まもなく自動更新されます）';
      } else {
        var pct = total > 0 ? Math.max(0, Math.min(100, (remaining / total) * 100)) : 0;
        fill.style.width = pct + '%';
        el.classList.toggle('holdTimer--warning', remaining < 6 * 60 * 60 * 1000);
        el.classList.remove('holdTimer--expired');
        text.textContent = '残り ' + formatDuration_(remaining);
      }
    });
    if (anyExpired) scheduleExpiredRefresh_();
  }

  setInterval(updateHoldTimers, 1000);

  function renderInventory() {
    var container = $('inventoryList');
    var items = state.inventoryItems || [];
    $('inventoryEmpty').classList.toggle('hidden', items.length > 0);
    $('inventoryTotalCount').textContent = items.length ? '該当 ' + items.length + ' 台' : '';
    container.innerHTML = '<div class="cardGrid">' + items.map(vehicleCardHtml).join('') + '</div>';
    syncFixedBars_();
  }

  document.getElementById('inventoryList').addEventListener('click', function (e) {
    var target = e.target;
    if (target.dataset.hold) openActionModal('hold', target.dataset.hold);
    else if (target.dataset.secondHold) openActionModal('secondHold', target.dataset.secondHold);
    else if (target.dataset.order) openActionModal('order', target.dataset.order);
    else if (target.dataset.orderFromHold) openActionModal('orderFromHold', target.dataset.orderFromHold);
    else if (target.dataset.cancelHold) openCancelHoldModal(target.dataset.cancelHold, target.dataset.cancelRank);
  });

  ['inventoryKeyword', 'inventoryMonthFilter', 'inventoryIncludeHold'].forEach(function (id) {
    $(id).addEventListener('input', debounce(loadInventory, 250));
    $(id).addEventListener('change', loadInventory);
  });

  $('btnAddInventory').addEventListener('click', function () {
    $('invModel').value = '';
    $('invMp').value = '';
    $('invExteriorColor').value = '';
    $('invInteriorColor').value = '';
    document.querySelectorAll('#invPaidOptions [data-paid-option]').forEach(function (input) { input.value = ''; });
    $('invCommission').value = '';
    $('invArrivalExpectedDate').value = '';
    $('invRegistrableMonth').value = '';
    $('invVpc').value = '';
    $('inventoryModalError').classList.add('hidden');
    setButtonBusy($('btnInventorySubmit'), false);
    openModal($('inventoryModal'));
  });

  $('btnInventorySubmit').addEventListener('click', function () {
    if (this.disabled) return;
    var btn = this;
    var vehicle = {
      model: $('invModel').value.trim(),
      mp: $('invMp').value.trim(),
      steering: $('invSteering').value,
      exteriorColor: $('invExteriorColor').value.trim(),
      interiorColor: $('invInteriorColor').value.trim(),
      commission: $('invCommission').value.trim(),
      arrivalExpectedDate: $('invArrivalExpectedDate').value,
      registrableMonth: $('invRegistrableMonth').value,
      vpc: $('invVpc').value.trim(),
      stockDisclosure: $('invStockDisclosure').value
    };
    document.querySelectorAll('#invPaidOptions [data-paid-option]').forEach(function (input) {
      vehicle['paidOption' + input.dataset.paidOption] = input.value.trim();
    });
    $('inventoryModalError').classList.add('hidden');
    setButtonBusy(btn, true, '登録中...');
    gasRun('api_createInventoryVehicle', vehicle).then(function () {
      setButtonBusy(btn, false);
      closeModal($('inventoryModal'));
      showToast('在庫を登録しました');
      loadInventory();
    }).catch(function (err) {
      setButtonBusy(btn, false);
      var el = $('inventoryModalError');
      el.textContent = err.message;
      el.classList.remove('hidden');
    });
  });

  // ===== Hold / 2nd Hold / 受注 共通モーダル =====
  var ACTION_LABELS = {
    hold: { title: 'Hold登録', button: 'Holdする', busyLabel: 'Hold登録中...', tone: 'hold' },
    secondHold: { title: '2nd Hold登録', button: '2nd Holdする', busyLabel: '登録中...', tone: 'hold' },
    order: { title: '受注確定', button: '受注確定する', busyLabel: '受注確定中...', tone: 'order' },
    orderFromHold: { title: '受注確定', button: '受注確定する', busyLabel: '受注確定中...', tone: 'order' },
    demoOrder: { title: 'デモカー確定', button: 'デモカー確定する', busyLabel: '確定中...', tone: 'order' }
  };
  var ORDER_TYPES = ['order', 'orderFromHold', 'demoOrder'];

  function actionFieldId_(key) {
    return 'action' + key.charAt(0).toUpperCase() + key.slice(1);
  }

  // ===== ログイン中のGoogleアカウントに紐づく担当者 =====
  // 担当者マスタ（設定タブ）にメールアドレスを登録しておくと、ログイン中のGoogleアカウントの
  // メールアドレスから自動的に担当者名が解決される（サーバー側 resolveStaffNameByEmail_ と
  // 同じ照合をAPI側で行い、bootstrap.currentStaffName として渡ってくる）。
  function currentStaffName_() {
    return state.bootstrap && state.bootstrap.currentStaffName;
  }

  function currentUserEmail_() {
    return (state.bootstrap && state.bootstrap.currentUserEmail) || '';
  }

  // 本人確認は表示名ではなく必ずメールアドレスで行う（担当者マスタの表示名は
  // 後から変更され得るため、名前同士の比較だと表示名を変えただけで自分自身の
  // Holdを解除・受注確定できなくなる不具合の原因になる。サーバー側 canCancelHold_ /
  // canConfirmOrder_ も同様にメールアドレスで判定する）。
  function emailsMatch_(a, b) {
    return !!a && !!b && String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
  }

  function staffDisplayHtml_() {
    var name = currentStaffName_();
    var email = currentUserEmail_();
    if (name) {
      return '<b>' + escapeHtml(name) + '</b><span class="staffDisplay__email">' + escapeHtml(email) + '</span>';
    }
    return '<span class="staffDisplay__warn">担当者マスタ未登録（' + escapeHtml(email || '不明') + '）</span>';
  }

  function renderTopbarUser() {
    var name = currentStaffName_();
    var email = currentUserEmail_();
    var el = $('topbarUser');
    if (name) {
      el.innerHTML = '<span class="topbar__userName">' + escapeHtml(name) + '</span>' +
        '<span class="topbar__userEmail">' + escapeHtml(email) + '</span>';
    } else {
      el.innerHTML = '<span class="topbar__userWarn">担当者未登録: ' + escapeHtml(email || '不明') + '</span>';
    }
  }

  function openActionModal(type, commission) {
    var currentStaff = currentStaffName_();
    if (!currentStaff) {
      showToast('担当者マスタに登録されていないため操作できません。設定タブでご自身のメールアドレスを登録してください（' + (currentUserEmail_() || '不明') + '）', true);
      return;
    }

    state.action = { type: type, commission: commission };
    $('actionModalTitle').textContent = ACTION_LABELS[type].title;
    var submitBtn = $('btnActionSubmit');
    submitBtn.textContent = ACTION_LABELS[type].button;
    delete submitBtn.dataset.originalLabel;
    // Hold系（hold/secondHold）はオレンジ、受注系（order/orderFromHold）は青、と
    // 一目で操作の種類が分かるようモーダル全体の差し色を切り替える。
    var panel = document.querySelector('#actionModal .modal__panel');
    panel.classList.remove('modal__panel--hold', 'modal__panel--order');
    panel.classList.add('modal__panel--' + ACTION_LABELS[type].tone);
    submitBtn.disabled = false;
    $('actionModalError').classList.add('hidden');
    $('actionSalesLocationField').classList.toggle('hidden', ORDER_TYPES.indexOf(type) === -1);

    var vehicle = findVehicleByCommission(commission);
    var isOrderFromHold = type === 'orderFromHold' && vehicle;
    var prefill;
    if (isOrderFromHold) {
      prefill = {
        // 入力欄には数字部分のみを表示する（「L-」は固定接頭辞として画面側に表示済み）
        leadNumber: String(vehicle.holdLeadNumber || '').replace(/^L-/i, ''),
        registeredMonth: vehicle.holdRegisteredMonth,
        customer: vehicle.holdCustomer,
        tradeIn: vehicle.holdTradeIn,
        oss: vehicle.holdOss,
        insurance: vehicle.holdInsurance
      };
    } else if (type === 'demoOrder') {
      // デモカー確定は入力の手間を減らすため、よくある値をあらかじめ入れておく（編集可）
      prefill = { leadNumber: '', registeredMonth: currentYearMonth(), customer: 'デモカー', tradeIn: 'なし', oss: '不可', insurance: 'なし' };
    } else {
      prefill = { leadNumber: '', registeredMonth: currentYearMonth(), customer: '', tradeIn: '', oss: '', insurance: '' };
    }

    $('actionStaffDisplay').innerHTML = staffDisplayHtml_();

    // Hold中の車両は、Holdを行った担当者のみ受注確定できる。ログイン中のメールアドレスが
    // Hold担当者のメールアドレスと異なる場合は、送信前に気づけるようここで警告し送信を
    // ブロックする（最終判定はサーバー側 canConfirmOrder_ で行う。表示名ではなく
    // メールアドレスで比較する — emailsMatch_ 参照）。
    var staffMismatch = isOrderFromHold && vehicle.holdStaffEmail && !emailsMatch_(vehicle.holdStaffEmail, currentUserEmail_());
    if (staffMismatch) {
      var errEl = $('actionModalError');
      errEl.textContent = 'このHoldの担当者は「' + vehicle.holdStaff + '」です。ログイン中の担当者（' + currentStaff + '）では受注確定できません。';
      errEl.classList.remove('hidden');
    }
    submitBtn.disabled = !!staffMismatch;

    $('actionSalesLocation').value = '';
    $('actionLeadNumber').value = prefill.leadNumber || '';
    $('actionRegisteredMonth').value = prefill.registeredMonth || currentYearMonth();
    $('actionCustomer').value = prefill.customer || '';
    $('actionTradeIn').value = prefill.tradeIn || '';
    $('actionOss').value = prefill.oss || '';
    $('actionInsurance').value = prefill.insurance || '';

    openModal($('actionModal'));
  }

  // リード番号は「L-」固定接頭辞＋数字のみで扱う。入力欄には数字部分のみを
  // 持たせ、数字以外が入力されてもその場で取り除く。
  $('actionLeadNumber').addEventListener('input', function () {
    var digits = this.value.replace(/[^0-9]/g, '');
    if (this.value !== digits) this.value = digits;
  });

  function findVehicleByCommission(commission) {
    return (state.inventoryItems || []).find(function (v) { return v.commission === commission; }) || null;
  }

  // ===== Hold解除 =====
  // 「解除しようとしているのは誰か」は、ログイン中のGoogleアカウントのメールアドレスと、
  // Hold登録時の担当者のメールアドレスが一致するかで判定する（表示名の比較ではない）。
  var cancelHoldState = null; // { commission, rank }

  function openCancelHoldModal(commission, rank) {
    var currentStaff = currentStaffName_();
    if (!currentStaff) {
      showToast('担当者マスタに登録されていないため操作できません。設定タブでご自身のメールアドレスを登録してください（' + (currentUserEmail_() || '不明') + '）', true);
      return;
    }
    var vehicle = findVehicleByCommission(commission);
    if (!vehicle) return;
    var prefix = rank === '2nd' ? 'secondHold' : 'hold';
    var holdStaff = vehicle[prefix + 'Staff'];
    var holdStaffEmail = vehicle[prefix + 'StaffEmail'];
    var holdCustomer = vehicle[prefix + 'Customer'];

    cancelHoldState = { commission: commission, rank: rank };
    $('cancelHoldModalTitle').textContent = (rank === '2nd' ? '2nd Hold' : '1st Hold') + 'の解除';
    $('cancelHoldModalDesc').textContent =
      'この' + (rank === '2nd' ? '2nd Hold' : '1st Hold') + '（顧客: ' + (holdCustomer || '-') + '）を登録した担当者「' +
      (holdStaff || '-') + '」のみ解除できます。';
    $('cancelHoldStaffDisplay').innerHTML = staffDisplayHtml_();
    $('cancelHoldModalError').classList.add('hidden');

    var submitBtn = $('btnCancelHoldSubmit');
    delete submitBtn.dataset.originalLabel;
    var staffMismatch = holdStaffEmail && !emailsMatch_(holdStaffEmail, currentUserEmail_());
    if (staffMismatch) {
      var errEl = $('cancelHoldModalError');
      errEl.textContent = 'このHoldの担当者は「' + holdStaff + '」です。ログイン中の担当者（' + currentStaff + '）では解除できません。';
      errEl.classList.remove('hidden');
    }
    submitBtn.disabled = !!staffMismatch;
    openModal($('cancelHoldModal'));
  }

  $('btnCancelHoldSubmit').addEventListener('click', function () {
    if (this.disabled || !cancelHoldState) return;
    var btn = this;
    var errEl = $('cancelHoldModalError');
    errEl.classList.add('hidden');
    setButtonBusy(btn, true, '解除中...');
    gasRun('api_cancelHold', cancelHoldState.commission, cancelHoldState.rank).then(function () {
      setButtonBusy(btn, false);
      closeModal($('cancelHoldModal'));
      showToast('Holdを解除しました');
      loadInventory();
    }).catch(function (err) {
      setButtonBusy(btn, false);
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    });
  });

  /**
   * Hold登録・受注確定は全項目の入力が必須。未入力の項目があればラベルを列挙して返す。
   * 担当者（staff）はログイン中のGoogleアカウントから自動設定されるため、
   * ここでの入力必須チェックからは除外する（openActionModalで別途チェック済み）。
   */
  function validateActionForm_(action) {
    var missing = [];
    var columns = (state.bootstrap && state.bootstrap.holdOrderInputColumns) || [];
    columns.forEach(function (c) {
      if (!c.required || c.key === 'staff') return;
      var field = $(actionFieldId_(c.key));
      if (!field || !field.value || !String(field.value).trim()) missing.push(c.label);
    });
    if (ORDER_TYPES.indexOf(action.type) !== -1) {
      var slCol = (state.bootstrap && state.bootstrap.salesLocationColumn) || { label: '販売拠点' };
      if (!$('actionSalesLocation').value.trim()) missing.push(slCol.label);
    }
    return missing;
  }

  $('btnActionSubmit').addEventListener('click', function () {
    if (this.disabled) return;
    var btn = this;
    var action = state.action;

    var missing = validateActionForm_(action);
    if (missing.length) {
      var errEl = $('actionModalError');
      errEl.textContent = '次の項目を入力してください: ' + missing.join('、');
      errEl.classList.remove('hidden');
      return;
    }

    // 1st Holdと同じ担当者は2nd Holdを登録できない（サーバー側でも検証するが、
    // 送信前に気づけるようここでも確認する）。メールアドレスで同一人物かどうかを判定する。
    if (action.type === 'secondHold') {
      var vehicleForCheck = findVehicleByCommission(action.commission);
      if (vehicleForCheck && vehicleForCheck.holdStaffEmail && emailsMatch_(vehicleForCheck.holdStaffEmail, currentUserEmail_())) {
        var staffErrEl = $('actionModalError');
        staffErrEl.textContent = '1st Holdと同じ担当者（' + vehicleForCheck.holdStaff + '）は2nd Holdを登録できません';
        staffErrEl.classList.remove('hidden');
        return;
      }
    }

    var info = {
      salesLocation: $('actionSalesLocation').value.trim(),
      // リード番号は「L-」固定接頭辞＋数字（入力欄には数字のみを持たせている）
      leadNumber: 'L-' + $('actionLeadNumber').value.trim().replace(/[^0-9]/g, ''),
      registeredMonth: $('actionRegisteredMonth').value,
      customer: $('actionCustomer').value.trim(),
      tradeIn: $('actionTradeIn').value,
      oss: $('actionOss').value,
      insurance: $('actionInsurance').value
    };
    var apiCall;
    if (action.type === 'hold') apiCall = gasRun('api_registerHold', action.commission, info);
    else if (action.type === 'secondHold') apiCall = gasRun('api_registerSecondHold', action.commission, info);
    else apiCall = gasRun('api_confirmOrder', action.commission, info);

    $('actionModalError').classList.add('hidden');
    setButtonBusy(btn, true, ACTION_LABELS[action.type].busyLabel);

    apiCall.then(function () {
      setButtonBusy(btn, false);
      closeModal($('actionModal'));
      showCelebration_(action.type);
      loadInventory();
      if (ORDER_TYPES.indexOf(action.type) !== -1) loadOrders();
      if (action.type === 'demoOrder') {
        loadDemoReservedList_();
        loadDemoAvailableOptions_();
      }
    }).catch(function (err) {
      setButtonBusy(btn, false);
      var el = $('actionModalError');
      el.textContent = err.message;
      el.classList.remove('hidden');
    });
  });

  // ----- 簡易XLSXパーサー（ブラウザ標準API・外部ライブラリ非依存） -----
  // .xlsx の実体はZIP。ブラウザ標準の DecompressionStream('deflate-raw') でZIP内の
  // DEFLATE圧縮を展開し、DOMParserで xl/workbook.xml・xl/worksheets/*.xml・
  // xl/sharedStrings.xml を読み取る。ブック内で最初のシート（表示順1番目）の
  // 1行目を見出し行として扱い、取り込みテキストエリアへタブ区切りで流し込む。
  function isXlsxFile_(file) {
    var name = (file && file.name || '').toLowerCase();
    return name.endsWith('.xlsx') ||
      file.type === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  }

  function readFileAsArrayBuffer_(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = function () { reject(new Error('ファイルの読み込みに失敗しました。')); };
      reader.readAsArrayBuffer(file);
    });
  }

  // ZIP中央ディレクトリを解析し、{ パス: {圧縮方式, 圧縮後/展開後サイズ, ローカルヘッダー位置} }を返す。
  function parseZipEntries_(buffer) {
    var view = new DataView(buffer);
    var bytes = new Uint8Array(buffer);
    var len = bytes.length;

    // End Of Central Directory（EOCD）シグネチャ 0x06054b50 をファイル末尾側から探す
    // （コメントが付与されたZIPでも見つけられるよう、末尾の一定範囲を後方から探索する）。
    var eocdOffset = -1;
    var searchStart = Math.max(0, len - 65557);
    for (var i = len - 22; i >= searchStart; i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocdOffset = i; break; }
    }
    if (eocdOffset === -1) {
      throw new Error('ZIP形式として認識できませんでした。.xlsxファイルを選択してください。');
    }

    var entryCount = view.getUint16(eocdOffset + 10, true);
    var centralDirOffset = view.getUint32(eocdOffset + 16, true);

    var entries = {};
    var offset = centralDirOffset;
    var decoder = new TextDecoder('utf-8');
    for (var e = 0; e < entryCount; e++) {
      if (view.getUint32(offset, true) !== 0x02014b50) break;
      var method = view.getUint16(offset + 10, true);
      var compressedSize = view.getUint32(offset + 20, true);
      var nameLen = view.getUint16(offset + 28, true);
      var extraLen = view.getUint16(offset + 30, true);
      var commentLen = view.getUint16(offset + 32, true);
      var localHeaderOffset = view.getUint32(offset + 42, true);
      var name = decoder.decode(bytes.subarray(offset + 46, offset + 46 + nameLen));
      entries[name] = { method: method, compressedSize: compressedSize, localHeaderOffset: localHeaderOffset };
      offset += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  // 指定パスのZIPエントリを展開してテキストとして返す（見つからない場合はnull）。
  function extractZipEntryText_(buffer, entries, path) {
    var info = entries[path];
    if (!info) return Promise.resolve(null);
    var view = new DataView(buffer);
    var bytes = new Uint8Array(buffer);
    var lho = info.localHeaderOffset;
    if (view.getUint32(lho, true) !== 0x04034b50) {
      return Promise.reject(new Error('ZIP内部データの読み取りに失敗しました。'));
    }
    var nameLen = view.getUint16(lho + 26, true);
    var extraLen = view.getUint16(lho + 28, true);
    var dataStart = lho + 30 + nameLen + extraLen;
    var compressed = bytes.slice(dataStart, dataStart + info.compressedSize);

    if (info.method === 0) {
      return Promise.resolve(new TextDecoder('utf-8').decode(compressed));
    }
    if (info.method !== 8) {
      return Promise.reject(new Error('未対応の圧縮形式のxlsxファイルです。'));
    }
    if (typeof DecompressionStream === 'undefined') {
      return Promise.reject(new Error('ご利用のブラウザはxlsxファイルの読み込みに対応していません。CSVとして保存するか、貼り付け欄をご利用ください。'));
    }
    var stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).arrayBuffer().then(function (arrayBuf) {
      return new TextDecoder('utf-8').decode(new Uint8Array(arrayBuf));
    });
  }

  function parseXml_(text) {
    return new DOMParser().parseFromString(text, 'application/xml');
  }

  // <si>や<c>から表示テキストを取り出す（<t>が複数（リッチテキストの<r>単位）ある場合は連結する）。
  function xmlTextContent_(el) {
    var texts = [];
    var tEls = el.getElementsByTagName('t');
    for (var i = 0; i < tEls.length; i++) texts.push(tEls[i].textContent);
    return texts.join('');
  }

  function parseSharedStrings_(xml) {
    if (!xml) return [];
    var siEls = parseXml_(xml).getElementsByTagName('si');
    var strings = [];
    for (var i = 0; i < siEls.length; i++) strings.push(xmlTextContent_(siEls[i]));
    return strings;
  }

  function colLettersToIndex_(letters) {
    var idx = 0;
    for (var i = 0; i < letters.length; i++) idx = idx * 26 + (letters.charCodeAt(i) - 64);
    return idx - 1;
  }

  // ブック内で表示順1番目のシートの実ファイルパス（例: xl/worksheets/sheet2.xml）を、
  // xl/workbook.xml（シート一覧・並び順）と xl/_rels/workbook.xml.rels（rId→実パス）
  // を突き合わせて解決する。シートの削除・並べ替え・リネームがあっても正しく先頭
  // シートを特定するため（単純に sheet1.xml を仮定すると、それらの操作をした
  // ブックで誤ったシートを読んでしまう）。
  function resolveFirstSheetPath_(buffer, entries) {
    return Promise.all([
      extractZipEntryText_(buffer, entries, 'xl/workbook.xml'),
      extractZipEntryText_(buffer, entries, 'xl/_rels/workbook.xml.rels')
    ]).then(function (results) {
      var workbookXml = results[0];
      var relsXml = results[1];
      if (!workbookXml) throw new Error('ブックの構成を読み取れませんでした。');

      var firstSheetEl = parseXml_(workbookXml).getElementsByTagName('sheet')[0];
      if (!firstSheetEl) throw new Error('シートが見つかりませんでした。');
      var rId = firstSheetEl.getAttribute('r:id');

      if (relsXml && rId) {
        var rels = parseXml_(relsXml).getElementsByTagName('Relationship');
        for (var i = 0; i < rels.length; i++) {
          if (rels[i].getAttribute('Id') === rId) {
            var target = rels[i].getAttribute('Target').replace(/^\/?/, '');
            return target.indexOf('xl/') === 0 ? target : 'xl/' + target;
          }
        }
      }
      return 'xl/worksheets/sheet1.xml'; // rels解決に失敗した場合のフォールバック
    });
  }

  function parseWorksheetRows_(sheetXml, sharedStrings) {
    var rowEls = parseXml_(sheetXml).getElementsByTagName('row');
    var rows = [];
    for (var r = 0; r < rowEls.length; r++) {
      var rowEl = rowEls[r];
      var rowIndex = parseInt(rowEl.getAttribute('r'), 10) - 1;
      if (isNaN(rowIndex) || rowIndex < 0) continue;
      var rowArr = rows[rowIndex] || [];
      var cellEls = rowEl.getElementsByTagName('c');
      for (var c = 0; c < cellEls.length; c++) {
        var cellEl = cellEls[c];
        var ref = cellEl.getAttribute('r');
        if (!ref) continue;
        var colIndex = colLettersToIndex_(ref.replace(/[0-9]/g, ''));
        var type = cellEl.getAttribute('t');
        var value = '';
        if (type === 's') {
          var vEl = cellEl.getElementsByTagName('v')[0];
          var idx = vEl ? parseInt(vEl.textContent, 10) : -1;
          value = (idx >= 0 && sharedStrings[idx] !== undefined) ? sharedStrings[idx] : '';
        } else if (type === 'inlineStr') {
          value = xmlTextContent_(cellEl);
        } else {
          var vEl2 = cellEl.getElementsByTagName('v')[0];
          value = vEl2 ? vEl2.textContent : '';
        }
        rowArr[colIndex] = value;
      }
      rows[rowIndex] = rowArr;
    }
    for (var i = 0; i < rows.length; i++) {
      if (!rows[i]) { rows[i] = []; continue; }
      for (var j = 0; j < rows[i].length; j++) {
        if (rows[i][j] === undefined) rows[i][j] = '';
      }
    }
    return rows;
  }

  // xlsxファイル(File)を読み込み、先頭シートの内容を行×列の配列（文字列）で返す。
  function parseXlsxFile_(file) {
    return readFileAsArrayBuffer_(file).then(function (buffer) {
      var entries = parseZipEntries_(buffer);
      return resolveFirstSheetPath_(buffer, entries).then(function (sheetPath) {
        return Promise.all([
          extractZipEntryText_(buffer, entries, sheetPath),
          extractZipEntryText_(buffer, entries, 'xl/sharedStrings.xml')
        ]);
      }).then(function (results) {
        var sheetXml = results[0];
        var sharedStringsXml = results[1];
        if (!sheetXml) throw new Error('シートのデータを読み取れませんでした。');
        return parseWorksheetRows_(sheetXml, parseSharedStrings_(sharedStringsXml));
      });
    });
  }

  // 取り込み欄（タブ区切りテキスト）へ変換する。セルの値にタブ・改行が含まれる
  // ケースは稀なため、単純にタブ区切り・改行区切りで組み立てる。
  function rowsToTsv_(rows) {
    return rows.map(function (row) {
      return row.map(function (cell) { return String(cell == null ? '' : cell).replace(/\t/g, ' '); }).join('\t');
    }).join('\n');
  }

  // ----- 在庫データの一括インポート（設定タブ） -----
  $('btnOpenImport').addEventListener('click', function () {
    $('importFile').value = '';
    $('importText').value = '';
    $('importModalError').classList.add('hidden');
    $('importResult').classList.add('hidden');
    $('importResult').innerHTML = '';
    setButtonBusy($('btnImportSubmit'), false);
    openModal($('importModal'));
  });

  $('importFile').addEventListener('change', function () {
    var file = this.files && this.files[0];
    if (!file) return;
    $('importModalError').classList.add('hidden');

    if (isXlsxFile_(file)) {
      parseXlsxFile_(file).then(function (rows) {
        $('importText').value = rowsToTsv_(rows);
      }).catch(function (err) {
        $('importModalError').textContent = 'xlsxファイルの読み込みに失敗しました: ' + err.message;
        $('importModalError').classList.remove('hidden');
      });
      return;
    }

    var reader = new FileReader();
    reader.onload = function () { $('importText').value = String(reader.result || ''); };
    reader.onerror = function () {
      $('importModalError').textContent = 'ファイルの読み込みに失敗しました。';
      $('importModalError').classList.remove('hidden');
    };
    reader.readAsText(file, 'UTF-8');
  });

  $('btnImportSubmit').addEventListener('click', function () {
    if (this.disabled) return;
    var text = $('importText').value;
    if (!text.trim()) {
      $('importModalError').textContent = '取り込むデータを入力してください。';
      $('importModalError').classList.remove('hidden');
      return;
    }
    var btn = this;
    $('importModalError').classList.add('hidden');
    $('importResult').classList.add('hidden');
    setButtonBusy(btn, true, '取り込み中...');
    gasRun('api_importInventory', text).then(function (result) {
      setButtonBusy(btn, false);
      renderImportResult_(result);
      if (result.importedCount > 0) {
        loadInventory();
        showToast(result.importedCount + '台の在庫を取り込みました');
      }
    }).catch(function (err) {
      setButtonBusy(btn, false);
      $('importModalError').textContent = err.message;
      $('importModalError').classList.remove('hidden');
    });
  });

  function renderImportResult_(result) {
    var parts = [];
    parts.push('<div class="importResult__summary">取り込み ' + result.importedCount + '台 ／ 重複でスキップ ' +
      result.duplicateCount + '台 ／ 不正データでスキップ ' + result.invalidCount + '台</div>');
    if (result.duplicates && result.duplicates.length) {
      parts.push('<div class="importResult__detailTitle">重複（既に在庫リストにあるコミッション）</div>');
      parts.push('<ul class="importResult__list">' + result.duplicates.map(function (d) {
        return '<li>' + d.row + '行目: ' + escapeHtml(d.commission) + '</li>';
      }).join('') + '</ul>');
    }
    if (result.invalids && result.invalids.length) {
      parts.push('<div class="importResult__detailTitle">不正データ</div>');
      parts.push('<ul class="importResult__list">' + result.invalids.map(function (d) {
        return '<li>' + d.row + '行目: ' + escapeHtml(d.reason) + '</li>';
      }).join('') + '</ul>');
    }
    var el = $('importResult');
    el.innerHTML = parts.join('');
    el.classList.remove('hidden');
  }

  // ----- 担当者マスタ（名前・メールアドレスの組。メールアドレスでログイン中の
  //       Googleアカウントと突き合わせ、担当者を自動判定する） -----
  function renderStaffList() {
    var container = $('staffList');
    $('staffListCount').textContent = state.staffList.length;
    if (!state.staffList.length) {
      container.innerHTML = '<div class="staffList__empty">担当者が登録されていません</div>';
    } else {
      container.innerHTML = state.staffList.map(function (entry, i) {
        return '<div class="staffList__row">' +
          '<input type="text" class="input" data-staff-index="' + i + '" data-staff-field="name" placeholder="名前" value="' + escapeHtml(entry.name || '') + '">' +
          '<input type="email" class="input" data-staff-index="' + i + '" data-staff-field="email" placeholder="メールアドレス" value="' + escapeHtml(entry.email || '') + '">' +
          '<button class="btn btn--icon" data-remove-staff="' + i + '" type="button" aria-label="削除">&times;</button>' +
          '</div>';
      }).join('');
    }
    var max = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    $('btnAddStaff').disabled = state.staffList.length >= max;
  }

  $('staffList').addEventListener('input', function (e) {
    var index = e.target.dataset.staffIndex;
    var field = e.target.dataset.staffField;
    if (index === undefined || !field) return;
    state.staffList[Number(index)][field] = e.target.value;
  });

  $('staffList').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-remove-staff]');
    if (!btn) return;
    state.staffList.splice(Number(btn.dataset.removeStaff), 1);
    renderStaffList();
  });

  $('btnAddStaff').addEventListener('click', function () {
    var max = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    if (state.staffList.length >= max) return;
    state.staffList.push({ name: '', email: '' });
    renderStaffList();
    var inputs = document.querySelectorAll('#staffList [data-staff-field="name"]');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  $('btnSaveSettings').addEventListener('click', function () {
    if (this.disabled) return;
    var btn = this;
    var max = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    var cleaned = state.staffList
      .map(function (s) {
        return { name: String((s && s.name) || '').trim(), email: String((s && s.email) || '').trim().toLowerCase() };
      })
      .filter(function (s) { return s.name && s.email; });
    var seenEmails = {};
    var uniqueStaffList = cleaned.filter(function (s) {
      if (seenEmails[s.email]) return false;
      seenEmails[s.email] = true;
      return true;
    });

    $('settingsError').textContent = '';
    if (uniqueStaffList.length > max) {
      $('settingsError').textContent = '担当者マスタは最大' + max + '人までです（現在' + uniqueStaffList.length + '人）';
      return;
    }

    var settings = {
      themeColor: $('settingsThemeColor').value,
      logoUrl: $('settingsLogoUrl').value.trim(),
      notifyHoldMailTo: $('settingsHoldMailTo').value.trim(),
      notifyOrderMailTo: $('settingsOrderMailTo').value.trim(),
      staffList: uniqueStaffList
    };
    setButtonBusy(btn, true, '保存中...');
    gasRun('api_saveSettings', settings).then(function (saved) {
      state.bootstrap.settings = saved;
      // 担当者マスタが変わった可能性があるため、ログイン中のアカウントに対応する
      // 担当者名（currentStaffName）を再取得してトップバー表示等に反映する。
      return gasRun('api_getBootstrapData');
    }).then(function (bootstrap) {
      setButtonBusy(btn, false);
      state.bootstrap = bootstrap;
      renderSettings(bootstrap.settings);
      renderTopbarUser();
      showToast('設定を保存しました');
    }).catch(function (err) {
      setButtonBusy(btn, false);
      $('settingsError').textContent = err.message;
    });
  });

  // ===== ユーティリティ =====
  function debounce(fn, wait) {
    var timer = null;
    return function () {
      clearTimeout(timer);
      var args = arguments;
      timer = setTimeout(function () { fn.apply(null, args); }, wait);
    };
  }

  // ===== ヘッダー・ツールバーの完全固定表示 =====
  // トップバー・ツールバー（検索欄）はどちらも position: fixed で画面上部に固定する
  // （position: stickyだとブラウザによってスクロール中にわずかに追従が遅れる/ずれる
  // ことがあるため、位置計算をブラウザ任せにせず実測値で完全に固定する）。
  // ツールバーは折り返しで高さが変わるため、実測してスペーサー（本来ツールバーが
  // 占めていた場所を確保するダミー要素）の高さをその都度更新する。
  function syncFixedBars_() {
    var topbar = $('topbar');
    if (topbar) {
      document.documentElement.style.setProperty('--topbar-h', topbar.offsetHeight + 'px');
    }
    [['inventoryToolbar', 'inventoryToolbarSpacer'], ['ordersToolbar', 'ordersToolbarSpacer']].forEach(function (pair) {
      var toolbar = $(pair[0]);
      var spacer = $(pair[1]);
      // main.view自身の上余白（16px）が「ヘッダー〜ツールバー間の余白」と同じ幅を
      // 既に確保しているため、スペーサーは「ツールバー自身の高さ＋ツールバー〜
      // カード間の余白（16px）」分だけ確保すればよい（上下の余白が揃う）。
      if (toolbar && spacer) spacer.style.height = (toolbar.offsetHeight + 16) + 'px';
    });
  }
  window.addEventListener('resize', debounce(syncFixedBars_, 100));

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ===== 初期化 =====
  function init() {
    gasRun('api_getBootstrapData').then(function (bootstrap) {
      state.bootstrap = bootstrap;
      fillOptions($('invSteering'), bootstrap.steeringOptions, true);
      fillOptions($('invStockDisclosure'), bootstrap.stockDisclosureOptions, true);
      fillOptions($('actionTradeIn'), bootstrap.yesNoOptions, true);
      fillOptions($('actionOss'), bootstrap.ossOptions, true);
      fillOptions($('actionInsurance'), bootstrap.yesNoOptions, true);
      renderSettings(bootstrap.settings);
      renderTopbarUser();
      return Promise.all([loadInventory(), loadOrders()]);
    }).catch(function (err) { showToast(err.message, true); });
  }

  init();
})();
</script>
