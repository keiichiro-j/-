<script>
(function () {
  'use strict';

  var state = {
    bootstrap: null,
    inventoryGroups: [],
    ordersGroups: [],
    action: null, // { type: 'hold' | 'secondHold' | 'order' | 'orderFromHold', commission }
    staffList: [] // 設定タブで編集中の担当者マスタ（作業用コピー）
  };

  // ===== google.script.run を Promise 化するヘルパー =====
  // サーバー側が応答しない場合にボタンやモーダルが固まって見えないよう、
  // 一定時間で必ずエラーとして解決させるタイムアウトを設ける。
  var GAS_CALL_TIMEOUT_MS = 25000;

  function gasRun(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        reject(new Error('サーバーからの応答がありません。通信環境をご確認のうえ、もう一度お試しください。'));
      }, GAS_CALL_TIMEOUT_MS);

      google.script.run
        .withSuccessHandler(function (result) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(result);
        })
        .withFailureHandler(function (err) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(new Error(err && err.message ? err.message : String(err)));
        })
        [fnName].apply(null, args);
    });
  }

  // ===== ボタンの多重送信防止（処理中はラベルを差し替えて無効化） =====
  function setButtonBusy(btn, busy, busyLabel) {
    if (busy) {
      if (btn.dataset.originalLabel === undefined) btn.dataset.originalLabel = btn.textContent;
      btn.textContent = busyLabel || '処理中...';
      btn.disabled = true;
    } else {
      if (btn.dataset.originalLabel !== undefined) btn.textContent = btn.dataset.originalLabel;
      btn.disabled = false;
    }
  }

  function $(id) { return document.getElementById(id); }

  function showToast(message, isError) {
    var toast = $('toast');
    toast.textContent = message;
    toast.className = 'toast' + (isError ? ' toast--error' : '');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.add('hidden'); }, 3200);
  }

  function fillOptions(select, options, includeBlank) {
    select.innerHTML = '';
    if (includeBlank) select.appendChild(new Option('', ''));
    options.forEach(function (o) { select.appendChild(new Option(o, o)); });
  }

  function currentYearMonth() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function formatDateTime(epochMs) {
    if (!epochMs) return '-';
    var d = new Date(epochMs);
    return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') +
      ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function paidOptionsText(item) {
    var keys = (state.bootstrap && state.bootstrap.paidOptionKeys) ||
      ['paidOption1', 'paidOption2', 'paidOption3', 'paidOption4', 'paidOption5', 'paidOption6', 'paidOption7'];
    var values = keys.map(function (k) { return item[k]; }).filter(function (v) { return v; });
    return values.length ? values.join('、') : '-';
  }

  // ===== タブ切替 =====
  document.getElementById('mainTabs').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-tab]');
    if (!btn) return;
    document.querySelectorAll('.tabs__item').forEach(function (t) { t.classList.toggle('is-active', t === btn); });
    document.querySelectorAll('main.view').forEach(function (v) { v.classList.remove('is-active'); });
    $('view-' + btn.dataset.tab).classList.add('is-active');
  });

  // ===== モーダル共通 =====
  document.querySelectorAll('[data-close-modal]').forEach(function (btn) {
    btn.addEventListener('click', function () { closeModal(btn.closest('.modal')); });
  });
  document.querySelectorAll('.modal').forEach(function (modal) {
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(modal); });
  });
  function openModal(modal) { modal.classList.remove('hidden'); }
  function closeModal(modal) { modal.classList.add('hidden'); }

  // ===== 在庫リスト =====
  function loadInventory() {
    var filters = {
      keyword: $('inventoryKeyword').value,
      includeHold: $('inventoryIncludeHold').checked
    };
    var groupBy = $('inventoryGroupBy').value;
    return gasRun('api_listInventory', filters, groupBy).then(function (groups) {
      state.inventoryGroups = groups || [];
      renderInventory();
    }).catch(function (err) { showToast(err.message, true); });
  }

  function vehicleCardHtml(v) {
    var isHold = v.holdStatus === 'hold';
    var badges = isHold
      ? '<span class="badge badge--hold"><span class="badge__dot"></span>Hold中</span>'
      : '<span class="badge badge--available"><span class="badge__dot"></span>在庫あり</span>';
    badges += v.stockDisclosure === '非開示'
      ? '<span class="badge badge--undisclosed">非開示</span>'
      : '<span class="badge badge--disclosed">開示</span>';

    var meta = [
      'MP: <strong>' + escapeHtml(v.mp || '-') + '</strong>',
      'ステア: <strong>' + escapeHtml(v.steering || '-') + '</strong>',
      'カラー: <strong>' + escapeHtml(v.exteriorColor || '-') + ' / ' + escapeHtml(v.interiorColor || '-') + '</strong>',
      '有償オプション: <strong>' + escapeHtml(paidOptionsText(v)) + '</strong>',
      '入港予定日: <strong>' + escapeHtml(v.arrivalExpectedDate || '-') + '</strong>',
      'VPC: <strong>' + escapeHtml(v.vpc || '-') + '</strong>'
    ].join('<br>');

    var holdInfoHtml = '';
    if (isHold) {
      holdInfoHtml += holdInfoBlockHtml_('1st Hold', v, 'hold', 'first');
      if (v.secondHoldCustomer) {
        holdInfoHtml += holdInfoBlockHtml_('2nd Hold', v, 'secondHold', 'second');
      }
    }

    var actionsHtml = '<div class="card__actions">';
    if (!isHold) {
      actionsHtml += '<button class="btn" data-hold="' + escapeHtml(v.commission) + '">Hold</button>';
      actionsHtml += '<button class="btn btn--primary" data-order="' + escapeHtml(v.commission) + '">受注</button>';
    } else {
      if (!v.secondHoldCustomer) {
        actionsHtml += '<button class="btn" data-second-hold="' + escapeHtml(v.commission) + '">2nd Hold</button>';
      }
      actionsHtml += '<button class="btn btn--primary" data-order-from-hold="' + escapeHtml(v.commission) + '">受注確定</button>';
    }
    actionsHtml += '</div>';

    return '<div class="card ' + (isHold ? 'card--hold' : 'card--available') + '">' +
      '<div class="card__top"><div><div class="card__model">' + escapeHtml(v.carType) + ' ' + escapeHtml(v.model) + '</div>' +
      '<div class="card__commission">' + escapeHtml(v.commission) + '</div></div>' +
      '<div class="card__badges">' + badges + '</div></div>' +
      '<div class="card__meta">' + meta + '</div>' +
      holdInfoHtml +
      actionsHtml +
      '</div>';
  }

  function holdInfoBlockHtml_(label, v, prefix, rank) {
    var leadNumber = v[prefix + 'LeadNumber'];
    var staff = v[prefix + 'Staff'];
    var customer = v[prefix + 'Customer'];
    var registeredMonth = v[prefix + 'RegisteredMonth'];
    var tradeIn = v[prefix + 'TradeIn'];
    var oss = v[prefix + 'Oss'];
    var insurance = v[prefix + 'Insurance'];
    var createdAt = v[prefix + 'CreatedAt'];
    var expiresAt = v[prefix + 'ExpiresAt'];
    return '<div class="card__holdInfo card__holdInfo--' + rank + '">' +
      '<div class="card__holdInfo__label">' + label + '</div>' +
      '<div class="card__holdInfo__row"><b>' + escapeHtml(customer || '-') + '</b>' +
      '（担当者 ' + escapeHtml(staff || '-') + '） / リード番号 ' + escapeHtml(leadNumber || '-') +
      ' / 登録月 ' + escapeHtml(registeredMonth || '-') +
      ' / 下取車 ' + escapeHtml(tradeIn || '-') + ' / OSS ' + escapeHtml(oss || '-') +
      ' / 保険 ' + escapeHtml(insurance || '-') + '</div>' +
      holdTimerHtml_(createdAt, expiresAt) +
      '</div>';
  }

  // ===== Hold 72時間タイマー（視覚的なカウントダウン・進捗バー） =====
  function holdTimerHtml_(createdAt, expiresAt) {
    return '<div class="holdTimer" data-created-at="' + (createdAt || '') + '" data-expires-at="' + (expiresAt || '') + '">' +
      '<div class="holdTimer__bar"><div class="holdTimer__barFill"></div></div>' +
      '<div class="holdTimer__text">-</div>' +
      '</div>';
  }

  function formatDuration_(ms) {
    var totalSeconds = Math.max(0, Math.floor(ms / 1000));
    var hours = Math.floor(totalSeconds / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;
    return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }

  var HOLD_DURATION_MS_CLIENT = 72 * 60 * 60 * 1000; // サーバー側 HOLD_DURATION_MS と同じ値（表示用フォールバック）

  var expiredRefreshTimer = null;
  function scheduleExpiredRefresh_() {
    if (expiredRefreshTimer) return;
    expiredRefreshTimer = setTimeout(function () {
      expiredRefreshTimer = null;
      loadInventory();
    }, 15000);
  }

  function updateHoldTimers() {
    var now = Date.now();
    var anyExpired = false;
    document.querySelectorAll('.holdTimer').forEach(function (el) {
      var expiresAt = Number(el.dataset.expiresAt);
      if (!expiresAt) return;
      var createdAt = Number(el.dataset.createdAt) || expiresAt - HOLD_DURATION_MS_CLIENT;
      var fill = el.querySelector('.holdTimer__barFill');
      var text = el.querySelector('.holdTimer__text');

      if (now < createdAt) {
        // 2nd Hold: 1st Holdの期間が終わるまでは、まだ自身の72時間は始まっていない
        el.classList.remove('holdTimer--expired');
        el.classList.remove('holdTimer--warning');
        fill.style.width = '0%';
        text.textContent = '1st Hold終了後に開始（あと ' + formatDuration_(createdAt - now) + '）';
        return;
      }

      var total = expiresAt - createdAt;
      var remaining = expiresAt - now;
      if (remaining <= 0) {
        anyExpired = true;
        el.classList.add('holdTimer--expired');
        el.classList.remove('holdTimer--warning');
        fill.style.width = '0%';
        text.textContent = '期限切れ（まもなく自動更新されます）';
      } else {
        var pct = total > 0 ? Math.max(0, Math.min(100, (remaining / total) * 100)) : 0;
        fill.style.width = pct + '%';
        el.classList.toggle('holdTimer--warning', remaining < 6 * 60 * 60 * 1000);
        el.classList.remove('holdTimer--expired');
        text.textContent = '残り ' + formatDuration_(remaining);
      }
    });
    if (anyExpired) scheduleExpiredRefresh_();
  }

  setInterval(updateHoldTimers, 1000);

  function renderInventory() {
    var container = $('inventoryGroups');
    var groups = state.inventoryGroups || [];
    var totalItems = groups.reduce(function (n, g) { return n + g.items.length; }, 0);
    $('inventoryEmpty').classList.toggle('hidden', totalItems > 0);
    container.innerHTML = groups.map(function (g) {
      var heading = g.key ? '<h3 class="group__title">' + escapeHtml(g.key) + '</h3>' : '';
      return '<div class="group">' + heading +
        '<div class="cardGrid">' + g.items.map(vehicleCardHtml).join('') + '</div></div>';
    }).join('');
  }

  document.getElementById('inventoryGroups').addEventListener('click', function (e) {
    var target = e.target;
    if (target.dataset.hold) openActionModal('hold', target.dataset.hold);
    else if (target.dataset.secondHold) openActionModal('secondHold', target.dataset.secondHold);
    else if (target.dataset.order) openActionModal('order', target.dataset.order);
    else if (target.dataset.orderFromHold) openActionModal('orderFromHold', target.dataset.orderFromHold);
  });

  ['inventoryKeyword', 'inventoryGroupBy', 'inventoryIncludeHold'].forEach(function (id) {
    $(id).addEventListener('input', debounce(loadInventory, 250));
    $(id).addEventListener('change', loadInventory);
  });

  $('btnAddInventory').addEventListener('click', function () {
    $('invCarType').value = '';
    $('invModel').value = '';
    $('invMp').value = '';
    $('invExteriorColor').value = '';
    $('invInteriorColor').value = '';
    document.querySelectorAll('#invPaidOptions [data-paid-option]').forEach(function (input) { input.value = ''; });
    $('invCommission').value = '';
    $('invArrivalExpectedDate').value = '';
    $('invVpc').value = '';
    $('inventoryModalError').classList.add('hidden');
    setButtonBusy($('btnInventorySubmit'), false);
    openModal($('inventoryModal'));
  });

  $('btnInventorySubmit').addEventListener('click', function () {
    if (this.disabled) return;
    var btn = this;
    var vehicle = {
      carType: $('invCarType').value.trim(),
      model: $('invModel').value.trim(),
      mp: $('invMp').value.trim(),
      steering: $('invSteering').value,
      exteriorColor: $('invExteriorColor').value.trim(),
      interiorColor: $('invInteriorColor').value.trim(),
      commission: $('invCommission').value.trim(),
      arrivalExpectedDate: $('invArrivalExpectedDate').value,
      vpc: $('invVpc').value.trim(),
      stockDisclosure: $('invStockDisclosure').value
    };
    document.querySelectorAll('#invPaidOptions [data-paid-option]').forEach(function (input) {
      vehicle['paidOption' + input.dataset.paidOption] = input.value.trim();
    });
    $('inventoryModalError').classList.add('hidden');
    setButtonBusy(btn, true, '登録中...');
    gasRun('api_createInventoryVehicle', vehicle).then(function () {
      setButtonBusy(btn, false);
      closeModal($('inventoryModal'));
      showToast('在庫を登録しました');
      loadInventory();
    }).catch(function (err) {
      setButtonBusy(btn, false);
      var el = $('inventoryModalError');
      el.textContent = err.message;
      el.classList.remove('hidden');
    });
  });

  // ===== Hold / 2nd Hold / 受注 共通モーダル =====
  var ACTION_LABELS = {
    hold: { title: 'Hold登録', button: 'Holdする', busyLabel: 'Hold登録中...' },
    secondHold: { title: '2nd Hold登録', button: '2nd Holdする', busyLabel: '登録中...' },
    order: { title: '受注確定', button: '受注確定する', busyLabel: '受注確定中...' },
    orderFromHold: { title: '受注確定', button: '受注確定する', busyLabel: '受注確定中...' }
  };
  var ORDER_TYPES = ['order', 'orderFromHold'];

  function actionFieldId_(key) {
    return 'action' + key.charAt(0).toUpperCase() + key.slice(1);
  }

  function staffOptions_() {
    return (state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.staffList) || [];
  }

  function openActionModal(type, commission) {
    state.action = { type: type, commission: commission };
    $('actionModalTitle').textContent = ACTION_LABELS[type].title;
    var submitBtn = $('btnActionSubmit');
    submitBtn.textContent = ACTION_LABELS[type].button;
    delete submitBtn.dataset.originalLabel;
    submitBtn.disabled = false;
    $('actionModalError').classList.add('hidden');
    $('actionSalesLocationField').classList.toggle('hidden', ORDER_TYPES.indexOf(type) === -1);

    var vehicle = findVehicleByCommission(commission);
    var isOrderFromHold = type === 'orderFromHold' && vehicle;
    var prefill = isOrderFromHold ? {
      leadNumber: vehicle.holdLeadNumber,
      registeredMonth: vehicle.holdRegisteredMonth,
      staff: vehicle.holdStaff,
      customer: vehicle.holdCustomer,
      tradeIn: vehicle.holdTradeIn,
      oss: vehicle.holdOss,
      insurance: vehicle.holdInsurance
    } : { leadNumber: '', registeredMonth: currentYearMonth(), staff: '', customer: '', tradeIn: '', oss: '', insurance: '' };

    // Hold中の車両は、Holdを行った担当者のみ受注確定できる。担当者欄をその担当者に固定する。
    fillOptions($('actionStaff'), staffOptions_(), true);
    $('actionStaff').disabled = isOrderFromHold;

    $('actionSalesLocation').value = '';
    $('actionLeadNumber').value = prefill.leadNumber || '';
    $('actionRegisteredMonth').value = prefill.registeredMonth || currentYearMonth();
    $('actionStaff').value = prefill.staff || '';
    $('actionCustomer').value = prefill.customer || '';
    $('actionTradeIn').value = prefill.tradeIn || '';
    $('actionOss').value = prefill.oss || '';
    $('actionInsurance').value = prefill.insurance || '';

    openModal($('actionModal'));
  }

  function findVehicleByCommission(commission) {
    for (var i = 0; i < state.inventoryGroups.length; i++) {
      var found = state.inventoryGroups[i].items.find(function (v) { return v.commission === commission; });
      if (found) return found;
    }
    return null;
  }

  /**
   * Hold登録・受注確定は全項目の入力が必須。未入力の項目があればラベルを列挙して返す。
   */
  function validateActionForm_(action) {
    var missing = [];
    var columns = (state.bootstrap && state.bootstrap.holdOrderInputColumns) || [];
    columns.forEach(function (c) {
      if (!c.required) return;
      var field = $(actionFieldId_(c.key));
      if (!field || !field.value || !String(field.value).trim()) missing.push(c.label);
    });
    if (ORDER_TYPES.indexOf(action.type) !== -1) {
      var slCol = (state.bootstrap && state.bootstrap.salesLocationColumn) || { label: '販売拠点' };
      if (!$('actionSalesLocation').value.trim()) missing.push(slCol.label);
    }
    return missing;
  }

  $('btnActionSubmit').addEventListener('click', function () {
    if (this.disabled) return;
    var btn = this;
    var action = state.action;

    var missing = validateActionForm_(action);
    if (missing.length) {
      var errEl = $('actionModalError');
      errEl.textContent = '次の項目を入力してください: ' + missing.join('、');
      errEl.classList.remove('hidden');
      return;
    }

    // 1st Holdと同じ担当者は2nd Holdを登録できない（サーバー側でも検証するが、
    // 送信前に気づけるようここでも確認する）。
    if (action.type === 'secondHold') {
      var vehicleForCheck = findVehicleByCommission(action.commission);
      var chosenStaff = $('actionStaff').value.trim();
      if (vehicleForCheck && vehicleForCheck.holdStaff && chosenStaff === vehicleForCheck.holdStaff) {
        var staffErrEl = $('actionModalError');
        staffErrEl.textContent = '1st Holdと同じ担当者（' + chosenStaff + '）は2nd Holdを登録できません';
        staffErrEl.classList.remove('hidden');
        return;
      }
    }

    var info = {
      salesLocation: $('actionSalesLocation').value.trim(),
      leadNumber: $('actionLeadNumber').value.trim(),
      registeredMonth: $('actionRegisteredMonth').value,
      staff: $('actionStaff').value.trim(),
      customer: $('actionCustomer').value.trim(),
      tradeIn: $('actionTradeIn').value,
      oss: $('actionOss').value,
      insurance: $('actionInsurance').value
    };
    var apiCall;
    if (action.type === 'hold') apiCall = gasRun('api_registerHold', action.commission, info);
    else if (action.type === 'secondHold') apiCall = gasRun('api_registerSecondHold', action.commission, info);
    else apiCall = gasRun('api_confirmOrder', action.commission, info);

    $('actionModalError').classList.add('hidden');
    setButtonBusy(btn, true, ACTION_LABELS[action.type].busyLabel);

    apiCall.then(function () {
      setButtonBusy(btn, false);
      closeModal($('actionModal'));
      showToast(ACTION_LABELS[action.type].title + 'が完了しました');
      loadInventory();
      if (ORDER_TYPES.indexOf(action.type) !== -1) loadOrders();
    }).catch(function (err) {
      setButtonBusy(btn, false);
      var el = $('actionModalError');
      el.textContent = err.message;
      el.classList.remove('hidden');
    });
  });

  // ===== 受注リスト =====
  function loadOrders() {
    var filters = { keyword: $('ordersKeyword').value };
    var groupBy = $('ordersGroupBy').value;
    return gasRun('api_listOrders', filters, groupBy).then(function (groups) {
      state.ordersGroups = groups || [];
      renderOrders();
    }).catch(function (err) { showToast(err.message, true); });
  }

  function orderCardHtml(o) {
    return '<div class="orderCard"><dl class="orderCard__grid">' +
      '<div><dt>車種/モデル</dt><dd>' + escapeHtml(o.carType) + ' ' + escapeHtml(o.model) + '</dd></div>' +
      '<div><dt>コミッション</dt><dd>' + escapeHtml(o.commission) + '</dd></div>' +
      '<div><dt>MP</dt><dd>' + escapeHtml(o.mp || '-') + '</dd></div>' +
      '<div><dt>VPC</dt><dd>' + escapeHtml(o.vpc || '-') + '</dd></div>' +
      '<div><dt>有償オプション</dt><dd>' + escapeHtml(paidOptionsText(o)) + '</dd></div>' +
      '<div><dt>販売拠点</dt><dd>' + escapeHtml(o.salesLocation || '-') + '</dd></div>' +
      '<div><dt>リード番号</dt><dd>' + escapeHtml(o.leadNumber || '-') + '</dd></div>' +
      '<div><dt>登録月</dt><dd>' + escapeHtml(o.registeredMonth || '-') + '</dd></div>' +
      '<div><dt>担当者</dt><dd>' + escapeHtml(o.staff || '-') + '</dd></div>' +
      '<div><dt>顧客</dt><dd>' + escapeHtml(o.customer || '-') + '</dd></div>' +
      '<div><dt>下取車の有無</dt><dd>' + escapeHtml(o.tradeIn || '-') + '</dd></div>' +
      '<div><dt>OSS登録の可否</dt><dd>' + escapeHtml(o.oss || '-') + '</dd></div>' +
      '<div><dt>保険加入の有無</dt><dd>' + escapeHtml(o.insurance || '-') + '</dd></div>' +
      '<div><dt>受注確定日時</dt><dd>' + formatDateTime(o.orderedAt) + '</dd></div>' +
      '</dl></div>';
  }

  function renderOrders() {
    var container = $('ordersGroups');
    var groups = state.ordersGroups || [];
    var totalItems = groups.reduce(function (n, g) { return n + g.items.length; }, 0);
    $('ordersEmpty').classList.toggle('hidden', totalItems > 0);
    container.innerHTML = groups.map(function (g) {
      var heading = g.key ? '<h3 class="group__title">' + escapeHtml(g.key) + '</h3>' : '';
      return '<div class="group">' + heading + g.items.map(orderCardHtml).join('') + '</div>';
    }).join('');
  }

  ['ordersKeyword', 'ordersGroupBy'].forEach(function (id) {
    $(id).addEventListener('input', debounce(loadOrders, 250));
    $(id).addEventListener('change', loadOrders);
  });

  // ===== 設定 =====
  function renderSettings(settings) {
    $('settingsThemeColor').value = settings.themeColor;
    $('settingsThemeColorLabel').textContent = settings.themeColor;
    $('settingsHoldMailTo').value = settings.notifyHoldMailTo;
    $('settingsOrderMailTo').value = settings.notifyOrderMailTo;
    applyTheme(settings.themeColor);

    state.staffList = (settings.staffList || []).slice();
    $('staffListMax').textContent = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    renderStaffList();
  }

  $('settingsThemeColor').addEventListener('input', function () {
    $('settingsThemeColorLabel').textContent = this.value;
    applyTheme(this.value);
  });

  function applyTheme(color) {
    document.documentElement.style.setProperty('--primary', color);
  }

  // ----- 担当者マスタ -----
  function renderStaffList() {
    var container = $('staffList');
    $('staffListCount').textContent = state.staffList.length;
    if (!state.staffList.length) {
      container.innerHTML = '<div class="staffList__empty">担当者が登録されていません</div>';
    } else {
      container.innerHTML = state.staffList.map(function (name, i) {
        return '<div class="staffList__row">' +
          '<input type="text" class="input" data-staff-index="' + i + '" value="' + escapeHtml(name) + '">' +
          '<button class="btn btn--icon" data-remove-staff="' + i + '" type="button" aria-label="削除">&times;</button>' +
          '</div>';
      }).join('');
    }
    var max = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    $('btnAddStaff').disabled = state.staffList.length >= max;
  }

  $('staffList').addEventListener('input', function (e) {
    var index = e.target.dataset.staffIndex;
    if (index === undefined) return;
    state.staffList[Number(index)] = e.target.value;
  });

  $('staffList').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-remove-staff]');
    if (!btn) return;
    state.staffList.splice(Number(btn.dataset.removeStaff), 1);
    renderStaffList();
  });

  $('btnAddStaff').addEventListener('click', function () {
    var max = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    if (state.staffList.length >= max) return;
    state.staffList.push('');
    renderStaffList();
    var inputs = document.querySelectorAll('#staffList [data-staff-index]');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  $('btnSaveSettings').addEventListener('click', function () {
    if (this.disabled) return;
    var btn = this;
    var max = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    var staffList = state.staffList.map(function (s) { return String(s || '').trim(); }).filter(function (s) { return s; });
    var uniqueStaffList = staffList.filter(function (name, i) { return staffList.indexOf(name) === i; });

    $('settingsError').textContent = '';
    if (uniqueStaffList.length > max) {
      $('settingsError').textContent = '担当者マスタは最大' + max + '人までです（現在' + uniqueStaffList.length + '人）';
      return;
    }

    var settings = {
      themeColor: $('settingsThemeColor').value,
      notifyHoldMailTo: $('settingsHoldMailTo').value.trim(),
      notifyOrderMailTo: $('settingsOrderMailTo').value.trim(),
      staffList: uniqueStaffList
    };
    setButtonBusy(btn, true, '保存中...');
    gasRun('api_saveSettings', settings).then(function (saved) {
      setButtonBusy(btn, false);
      state.bootstrap.settings = saved;
      renderSettings(saved);
      showToast('設定を保存しました');
    }).catch(function (err) {
      setButtonBusy(btn, false);
      $('settingsError').textContent = err.message;
    });
  });

  // ===== ユーティリティ =====
  function debounce(fn, wait) {
    var timer = null;
    return function () {
      clearTimeout(timer);
      var args = arguments;
      timer = setTimeout(function () { fn.apply(null, args); }, wait);
    };
  }

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ===== 初期化 =====
  function init() {
    gasRun('api_getBootstrapData').then(function (bootstrap) {
      state.bootstrap = bootstrap;
      fillOptions($('invSteering'), bootstrap.steeringOptions, true);
      fillOptions($('invStockDisclosure'), bootstrap.stockDisclosureOptions, true);
      fillOptions($('actionTradeIn'), bootstrap.yesNoOptions, true);
      fillOptions($('actionOss'), bootstrap.ossOptions, true);
      fillOptions($('actionInsurance'), bootstrap.yesNoOptions, true);
      renderSettings(bootstrap.settings);
      return Promise.all([loadInventory(), loadOrders()]);
    }).catch(function (err) { showToast(err.message, true); });
  }

  init();
})();
</script>
