<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('html/Stylesheet'); ?>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar__brand">車両受注アプリ</div>
      <nav class="tabs" id="mainTabs" role="tablist" aria-label="画面切替">
        <button class="tabs__item is-active" data-tab="inventory">在庫リスト</button>
        <button class="tabs__item" data-tab="orders">受注リスト</button>
        <button class="tabs__item" data-tab="settings">設定</button>
      </nav>
    </header>

    <!-- 在庫リスト -->
    <main class="view is-active" id="view-inventory">
      <div class="toolbar">
        <input type="search" id="inventoryKeyword" class="input input--search" placeholder="車種・モデル・コミッションで検索">
        <select id="inventoryGroupBy" class="input">
          <option value="">グループ表示なし</option>
          <option value="arrivalExpectedDate">入港予定日ごと</option>
          <option value="model">モデルごと</option>
        </select>
        <label class="checkboxField">
          <input type="checkbox" id="inventoryIncludeHold" checked> Hold済みを含む
        </label>
        <div class="toolbar__spacer"></div>
        <button class="btn" id="btnAddInventory">＋ 在庫追加</button>
      </div>
      <div id="inventoryGroups"></div>
      <div class="emptyState hidden" id="inventoryEmpty">該当する在庫がありません</div>
    </main>

    <!-- 受注リスト -->
    <main class="view" id="view-orders">
      <div class="toolbar">
        <input type="search" id="ordersKeyword" class="input input--search" placeholder="車種・モデル・顧客名・担当で検索">
        <select id="ordersGroupBy" class="input">
          <option value="">グループ表示なし</option>
          <option value="salesLocation">販売拠点ごと</option>
          <option value="model">モデルごと</option>
        </select>
      </div>
      <div id="ordersGroups"></div>
      <div class="emptyState hidden" id="ordersEmpty">該当する受注がありません</div>
    </main>

    <!-- 設定 -->
    <main class="view" id="view-settings">
      <div class="settingsCard">
        <div class="formField">
          <label>テーマ（配色）</label>
          <div class="colorField">
            <input type="color" id="settingsThemeColor">
            <span id="settingsThemeColorLabel"></span>
          </div>
        </div>
        <div class="formField">
          <label>Hold登録時のメール通知先</label>
          <input type="text" id="settingsHoldMailTo" class="input" placeholder="例: staff@example.com, staff2@example.com">
        </div>
        <div class="formField">
          <label>受注確定時のメール通知先</label>
          <input type="text" id="settingsOrderMailTo" class="input" placeholder="例: sales@example.com">
        </div>
        <div class="formField">
          <label>担当者マスタ（最大<span id="staffListMax"></span>人・<span id="staffListCount">0</span>人登録中）</label>
          <div class="staffList" id="staffList"></div>
          <button class="btn" id="btnAddStaff" type="button">＋ 担当者を追加</button>
        </div>
        <div id="settingsError" class="modal__error"></div>
        <button class="btn btn--primary" id="btnSaveSettings">保存</button>
      </div>
    </main>
  </div>

  <!-- Hold / 2nd Hold / 受注 共通入力モーダル -->
  <div class="modal hidden" id="actionModal">
    <div class="modal__panel">
      <div class="modal__header">
        <h2 id="actionModalTitle">Hold登録</h2>
        <button class="btn--icon" data-close-modal>&times;</button>
      </div>
      <div class="modal__body">
        <div class="modal__error hidden" id="actionModalError"></div>
        <div class="formField" id="actionSalesLocationField">
          <label>販売拠点</label>
          <input type="text" id="actionSalesLocation" class="input">
        </div>
        <div class="formField">
          <label>リード番号</label>
          <input type="text" id="actionLeadNumber" class="input">
        </div>
        <div class="formField">
          <label>登録月</label>
          <input type="month" id="actionRegisteredMonth" class="input">
        </div>
        <div class="formField">
          <label>担当者</label>
          <select id="actionStaff" class="input"></select>
        </div>
        <div class="formField">
          <label>顧客</label>
          <input type="text" id="actionCustomer" class="input">
        </div>
        <div class="formField">
          <label>下取車の有無</label>
          <select id="actionTradeIn" class="input"></select>
        </div>
        <div class="formField">
          <label>OSS登録の可否</label>
          <select id="actionOss" class="input"></select>
        </div>
        <div class="formField">
          <label>保険加入の有無</label>
          <select id="actionInsurance" class="input"></select>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn" data-close-modal>キャンセル</button>
        <button class="btn btn--primary" id="btnActionSubmit">登録</button>
      </div>
    </div>
  </div>

  <!-- 在庫追加モーダル -->
  <div class="modal hidden" id="inventoryModal">
    <div class="modal__panel">
      <div class="modal__header">
        <h2>在庫追加</h2>
        <button class="btn--icon" data-close-modal>&times;</button>
      </div>
      <div class="modal__body">
        <div class="modal__error hidden" id="inventoryModalError"></div>
        <div class="formField">
          <label>車種</label>
          <input type="text" id="invCarType" class="input">
        </div>
        <div class="formField">
          <label>モデル</label>
          <input type="text" id="invModel" class="input">
        </div>
        <div class="formField">
          <label>MP</label>
          <input type="text" id="invMp" class="input">
        </div>
        <div class="formField">
          <label>ステア</label>
          <select id="invSteering" class="input"></select>
        </div>
        <div class="formField">
          <label>外装</label>
          <input type="text" id="invExteriorColor" class="input">
        </div>
        <div class="formField">
          <label>内装</label>
          <input type="text" id="invInteriorColor" class="input">
        </div>
        <div class="formField">
          <label>有償オプション</label>
          <div class="optionSlots" id="invPaidOptions">
            <input type="text" class="input" data-paid-option="1" placeholder="1">
            <input type="text" class="input" data-paid-option="2" placeholder="2">
            <input type="text" class="input" data-paid-option="3" placeholder="3">
            <input type="text" class="input" data-paid-option="4" placeholder="4">
            <input type="text" class="input" data-paid-option="5" placeholder="5">
            <input type="text" class="input" data-paid-option="6" placeholder="6">
            <input type="text" class="input" data-paid-option="7" placeholder="7">
          </div>
        </div>
        <div class="formField">
          <label>コミッション</label>
          <input type="text" id="invCommission" class="input">
        </div>
        <div class="formField">
          <label>入港予定日</label>
          <input type="date" id="invArrivalExpectedDate" class="input">
        </div>
        <div class="formField">
          <label>VPC</label>
          <input type="text" id="invVpc" class="input">
        </div>
        <div class="formField">
          <label>在庫開示</label>
          <select id="invStockDisclosure" class="input"></select>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn" data-close-modal>キャンセル</button>
        <button class="btn btn--primary" id="btnInventorySubmit">登録</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <?!= include('html/JavaScript'); ?>
</body>
</html>
