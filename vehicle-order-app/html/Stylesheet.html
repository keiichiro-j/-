      margin: 0;
      font: inherit;
      color: inherit;
    }
    .homeCard__photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* グレードのあるモデルは写真タップで全グレード在庫へ。ホバーで操作がわかるようにする。 */
    .homeCard__photo--allGrades { cursor: pointer; }
    .homeCard__photoHint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 32, .42);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .02em;
      opacity: 0;
      transition: opacity .15s ease;
      pointer-events: none;
    }
    .homeCard__photo--allGrades:hover .homeCard__photoHint,
    .homeCard__photo--allGrades:focus-visible .homeCard__photoHint { opacity: 1; }
    .homeCard__photo--allGrades:hover { box-shadow: inset 0 0 0 2px var(--primary); }
    /* 在庫台数バッジ: タップ・クリックしなくても見える位置（写真右下）に
       常時重ねて表示する（現場の要望「カードごとに在庫台数を表示、タップ
       なしで」）。テーマカラーで塗りつぶし、設定タブでのテーマ変更が
       ひと目でわかるようにする。 */
    .badge--stock {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: var(--primary);
      color: #fff;
      box-shadow: var(--shadow-elevated);
    }
    /* 在庫0台のモデルは、テーマカラーではなく固定の警告色にし、在庫が無い
       ことがテーマ設定に関わらず常にひと目でわかるようにする
       （homeStockCountText_、他の在庫台数表示と同じ考え方）。 */
    .badge--stock--zero { background: var(--danger); }
    .homeCard__body { padding: 14px 16px 16px; }
    .homeCard__headRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .homeCard__model {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.005em;
    }
    .homeCard__type {
      flex: none;
      background: var(--background);
      color: var(--on-surface-variant);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
    }
    /* グレード別在庫数は、3列×2行（グレードが6件までは2行に収まる）で
       カード内に埋め込む（現場の要望「モデルカード内に配置するグレード
       カードは横に3グレード×2列」）。クリックするとそのグレード1件に
       絞り込んだ在庫リストへ遷移する（#homeGridのクリック委譲、
       data-home-grade参照）。 */
    .homeCard__gradeGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    /* テーマカラーの淡い塗り（--primary-bg/--primary-text）にし、設定タブの
       カラーテーマを切り替えるとチップの色味もはっきり変わるようにする。 */
    .homeCard__gradeChip {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 10px 6px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: var(--primary-bg);
      color: var(--primary-text);
      cursor: pointer;
      text-align: center;
      transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease;
    }
    .homeCard__gradeChip:hover { box-shadow: var(--shadow-elevated); border-color: var(--primary); transform: translateY(-2px); }
    .homeCard__gradeName { font-size: 13px; font-weight: 700; }
    .homeCard__gradeCount { font-size: 11.5px; font-variant-numeric: tabular-nums; }
    /* 在庫0台のグレードは、Hold中も無くまとまった在庫の当てがないことがひと目で
       わかるよう、件数を赤文字にする（.homeGradeTab__count--zeroと同じ考え方）。 */
    .homeCard__gradeCount--zero { color: var(--danger); font-weight: 700; }
  }

  /* ===== リード番号入力（「L-」固定接頭辞＋数字。Google×Tesla風の見出し扱いにする） ===== */
  .leadNumberField {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--outline);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .leadNumberField:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg); }
  .leadNumberField__prefix {
    display: flex;
    align-items: center;
    padding: 0 14px;
    background: var(--primary-bg);
    color: var(--primary-text);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .03em;
    border-right: 1px solid var(--outline);
  }
  .leadNumberField__input { border: none; border-radius: 0; flex: 1; min-width: 0; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .leadNumberField .leadNumberField__input:focus { outline: none; }

  /* ===== 担当者表示（ログイン中のアカウントから自動判定・読み取り専用） ===== */
  .staffDisplay {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--background);
    font-size: 14px;
  }
  .staffDisplay__email { font-size: 12px; color: var(--on-surface-variant); }
  .staffDisplay__warn { font-size: 13px; color: var(--danger); }

  /* ===== モーダル =====
     不具合修正（スマホでHold登録・受注確定の入力中に項目がキーボードの裏に
     隠れる問題）: 最初、.modal自身のtop・heightをvisualViewportの実測値に
     ダイレクトに書き換える方式を試したが、iOS Safariではposition: fixed要素の
     位置・高さをJSから動的に書き換えると、キーボード開閉のタイミングによって
     レイアウトが崩れて表示されてしまう（ステップ見出しや他の入力欄が消え、
     ボタンの下に不自然な空白ができる）不具合があった。
     そこで、.modal自身のtop/left/right/bottom（inset: 0）はそのままレイアウト
     ビューポート基準で固定し、代わりに下方向のpaddingにキーボードの高さぶんを
     動的に足す方式に変えた。スマホ幅ではモーダルを画面下端に固定したボトム
     シートにしている（下の@media (max-width: 600px)参照。align-items:
     flex-end）ため、.modal自身の下端パディングが広がるとパネルの下端はその
     パディングの上、つまりキーボードのすぐ上に押し上げられる。.modal自体の
     位置・高さの計算方法は変えないため、position: fixedのレイアウトが崩れる
     心配がない。 */
  .modal {
    position: fixed; inset: 0; background: rgba(32, 33, 36, .5);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    padding: 16px 16px calc(16px + var(--app-keyboard-inset, 0px));
  }
  /* ヘッダー・ステップ進捗・フッターは固定し、modal__bodyだけをスクロール
     させる（display: flex; flex-direction: columnで、modal__bodyのみ
     flex: 1 1 auto; overflow-y: autoにする）。以前はmodal__panel自体を
     スクロールさせていたため、内容が長いモーダルではタイトルや「Hold登録」
     等の見出しごとスクロールして見えなくなっていた。 */
  .modal__panel {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-elevated);
    width: 100%; max-width: 460px;
    /* キーボード表示中はその高さぶんも差し引く（.modalの下方向パディングと
       あわせて、パネルがキーボードの裏まではみ出さないようにする）。 */
    max-height: calc(90vh - var(--app-keyboard-inset, 0px));
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal__panel--wide { max-width: 640px; }
  .modal__header { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--outline); }
  .modal__header h2 { font-size: 17px; font-weight: 500; margin: 0; display: flex; align-items: center; }

  /* Hold登録・2nd Hold登録はオレンジ、受注確定はブルーで、操作の種類が一目で
     分かるようにする（Hold中バッジ＝オレンジ、受注確定ボタン＝ブルー、と既存の
     配色ルールに合わせている）。 */
  .modal__panel--hold { border-top: 4px solid var(--warning); }
  .modal__panel--hold .modal__header { background: var(--warning-bg); }
  .modal__panel--hold .modal__header h2::before { background: var(--warning); }
  .modal__panel--hold #btnActionSubmit { background: var(--warning); border-color: var(--warning); }
  .modal__panel--hold #btnActionSubmit:hover { background: #c98423; border-color: #c98423; }

  .modal__panel--order { border-top: 4px solid var(--primary); }
  .modal__panel--order .modal__header { background: var(--primary-bg); }
  .modal__panel--order .modal__header h2::before { background: var(--primary); }

  .modal__panel--hold .modal__header h2::before,
  .modal__panel--order .modal__header h2::before {
    content: '';
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-right: 9px;
    flex: none;
  }
  .modal__body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  /* 予約（Hold/2nd Hold/受注）入力モーダルは2列グリッドにして、デスクトップでは
     スクロールなしで全項目を入力できるようにする。 */
  .modal__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 20px; }
  .formField--span2 { grid-column: 1 / -1; }

  /* ===== 予約モーダルのステップ進捗（顧客情報→契約内容の2ステップ）=====
     スマホでの入力ミスを減らすため、8項目を一度に出さず2ステップに分ける。
     担当者はログインアカウントから自動判定済みのため、ステップが増えても
     入力の手間自体は増えない。 */
  .modal__stepBar { flex: none; padding: 12px 20px 0; }
  .modal__stepBar__track { height: 4px; border-radius: 999px; background: var(--outline); overflow: hidden; }
  .modal__stepBar__fill { height: 100%; width: 50%; background: var(--primary); border-radius: 999px; transition: width .2s ease; }
  .modal__panel--hold .modal__stepBar__fill { background: var(--warning); }
  .modal__stepBar__label { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); }
  .modal__footer { flex: none; display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--outline); }
  .modal__error { color: var(--danger); font-size: 13px; }
  .modal__desc { margin: 0; font-size: 13px; color: var(--on-surface-variant); line-height: 1.6; }
  .modal__requiredNote { margin: 0 0 4px; font-size: 12px; color: var(--on-surface-variant); }
  .req { color: var(--danger); margin-left: 2px; }
  .modal__hint { margin: 10px 0 0; font-size: 12.5px; color: var(--on-surface-variant); line-height: 1.6; }

  /* ===== Hold種別選択（管理者権限を持つ担当者が「Hold」タップ時のみ表示）=====
     通常のHold／デモカーHOLD／他店HOLDの3択。デモカーHOLD・他店HOLDは専用の
     特別色（--hold-special）でボタンの左罫線を色分けし、選ぶ前から見分けやすくする。 */
  .actionTypePick__intro { margin: 0 0 14px; font-size: 13.5px; color: var(--on-surface-variant); }
  .actionTypePick { display: flex; flex-direction: column; gap: 10px; }
  .actionTypePick__btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    border: 1px solid var(--outline);
    border-left: 4px solid var(--warning);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .actionTypePick__btn:hover { box-shadow: var(--shadow-elevated); transform: translateY(-1px); }
  .actionTypePick__btn--demo,
  .actionTypePick__btn--otherStore { border-left-color: var(--hold-special); }
  .actionTypePick__btnTitle { font-size: 15px; font-weight: 700; }
  .actionTypePick__btnDesc { font-size: 12.5px; color: var(--on-surface-variant); }

  /* ===== トースト ===== */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    /* ネイビーサブ（比較バーのメインネイビーより少し明るく、奥行きを付ける）。 */
    background: #243b53; border: 1px solid var(--dark-ui-outline); color: #fff; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; box-shadow: var(--shadow-elevated); z-index: 200;
  }
  .toast--error { background: var(--danger); }

  /* ===== 受注確定時の紙吹雪演出（文字・カードなし。紙吹雪のみ盛大に降らせる） ===== */
  .confettiLayer { position: fixed; inset: 0; z-index: 310; overflow: hidden; pointer-events: none; }
  /* 受注確定の瞬間だけ、ごく短時間だけ画面中央を明るく光らせる「フラッシュ」を
     重ねる（文字・カードは出さない方針は維持し、あくまで光の演出のみ）。 */
  .confettiLayer::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 60%);
    opacity: 0;
    transition: opacity .5s ease;
  }
  .confettiLayer.is-flashing::before { opacity: 1; }
  .confettiPiece {
    position: absolute;
    top: -24px;
    opacity: .95;
    will-change: transform;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--drift, 0), 112vh) rotate(var(--rot, 720deg)); opacity: .85; }
  }

  /* ===== Hold登録・2nd Hold登録・受注確定 完了時の演出 =====
     showCelebration_（JavaScript.html）が、固定の案内メッセージ（.celebrationBanner）と
     アクションごとに専用のド派手な演出（.celebrationLayerにCSSで描いた図形
     パーツ・発光エフェクトを生成）を組み合わせて表示する。絵文字はフォント・
     OSによって見た目が大きく異なる（機種依存文字の再現性が低い）ため使わず、
     色付きの図形（丸・四角・リボン・星）と発光・拡大・回転などのCSS
     アニメーションのみで演出する（GAS/HTML Serviceのみで完結する）。 */
  .celebrationLayer { position: fixed; inset: 0; z-index: 311; overflow: hidden; pointer-events: none; }
  .celebParticle {
    position: absolute;
    bottom: -60px;
    will-change: transform, opacity;
  }
  .celebParticle--circle { border-radius: 50%; }
  .celebParticle--square { border-radius: 3px; }
  .celebParticle--ribbon {
    border-radius: 2px;
    clip-path: polygon(0 0, 100% 0, 100% 68%, 50% 100%, 0 68%);
  }
  .celebParticle--star {
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .celebParticle--rise { animation: celebRise linear forwards; }
  .celebParticle--fall { top: -60px; bottom: auto; animation: celebFall linear forwards; }
  .celebParticle--burst {
    left: 50%;
    top: 50%;
    bottom: auto;
    animation: celebBurst .9s cubic-bezier(.2, .8, .3, 1) forwards;
  }
  @keyframes celebRise {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translate(var(--drift, 0), -112vh) rotate(var(--rot, 0deg)); opacity: .9; }
  }
  @keyframes celebFall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translate(var(--drift, 0), 112vh) rotate(var(--rot, 0deg)); opacity: .9; }
  }
  @keyframes celebBurst {
    0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx, 0)), calc(-50% + var(--ty, 0))) scale(1); opacity: 0; }
  }
  /* Hold登録の演出: 画面中央を一瞬だけ明るく光らせる「閃光」（打ち上げ花火の
     起点のイメージ）。 */
  .celebFlash {
    position: fixed;
    inset: 0;
    z-index: 313;
    pointer-events: none;
    background: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .95), rgba(255, 199, 60, .55) 45%, rgba(255, 199, 60, 0) 72%);
    opacity: 0;
    animation: celebFlashPulse .6s ease-out forwards;
  }
  @keyframes celebFlashPulse {
    0% { opacity: 0; }
    18% { opacity: 1; }
    100% { opacity: 0; }
  }
  /* Hold登録の演出: 画面中央から発光しながら拡大して消えるリング（衝撃波）。
     打ち上げ花火が開いた瞬間のような「ドン」という手応えを付ける。 */
  .celebShockwave {
    position: fixed;
    top: 50%;
    left: 50%;
    z-index: 311;
    pointer-events: none;
    width: 40px;
    height: 40px;
    margin: -20px 0 0 -20px;
    border-radius: 50%;
    border: 4px solid rgba(255, 199, 60, .9);
    box-shadow: 0 0 30px 8px rgba(255, 199, 60, .5);
    animation: celebShockwaveExpand 1.1s cubic-bezier(.2, .7, .3, 1) forwards;
  }
  @keyframes celebShockwaveExpand {
    0% { transform: scale(0); opacity: 1; }
    65% { opacity: .45; }
    100% { transform: scale(11); opacity: 0; }
  }
  /* 2nd Hold登録の演出: 画面中央で脈動する発光エネルギーコア（回転するリング
     ＋脈動する光る球＋広がるリップル2つ）。「もう少し待ってください」という
     文言に合わせ、力を蓄えているような期待感のある見た目にしている。
     topを62%（画面中央よりやや下）にしているのは、.celebrationBanner（38%、
     画面中央よりやや上）との重なりを避けるため。画面の垂直中央を挟んで上下
     対称に振り分けることで、単体で見ても・組み合わせて見ても「画面中央」に
     まとまって見えるようにしている。%指定のため、スマホ・PCなどビューの
     サイズが変わっても自動的に追従する。 */
  .celebEnergyCore {
    position: fixed;
    top: 62%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 311;
    pointer-events: none;
    width: 140px;
    height: 140px;
  }
  .celebEnergyCore__orb {
    position: absolute;
    inset: 32px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fff, #7dd3fc 42%, #1a73e8 78%);
    box-shadow: 0 0 44px 14px rgba(26, 115, 232, .6);
    animation: celebOrbPulse 1.4s ease-in-out infinite;
  }
  @keyframes celebOrbPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.14); }
  }
  .celebEnergyCore__ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #1a73e8;
    border-right-color: #7dd3fc;
    animation: celebSpin 1.6s linear infinite;
  }
  @keyframes celebSpin { to { transform: rotate(360deg); } }
  .celebEnergyCore__ripple {
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    border: 2px solid rgba(26, 115, 232, .55);
    animation: celebRipplePulse 1.8s ease-out infinite;
  }
  .celebEnergyCore__ripple--delay { animation-delay: .6s; }
  @keyframes celebRipplePulse {
    0% { transform: scale(.5); opacity: .8; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  /* 案内メッセージのバナー。画面中央（やや上寄り、topは.celebEnergyCore参照）に
     大きめの文字で表示し、一定時間で自動的にフェードアウトする
     （showCelebrationBanner_参照）。top・max-widthともに%・vw基準のため、
     PC・タブレット・スマホいずれの画面サイズでも自動的に追従し、中央付近に
     表示される。 */
  .celebrationBanner {
    position: fixed;
    top: 38%;
    left: 50%;
    z-index: 312;
    transform: translate(-50%, calc(-50% - 14px));
    background: var(--surface);
    color: var(--on-surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow-elevated);
    padding: 20px 32px;
    text-align: center;
    max-width: min(90vw, 480px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
  }
  .celebrationBanner.is-active { opacity: 1; transform: translate(-50%, -50%); }
  .celebrationBanner p { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.5; }
  .celebrationBanner p:first-child { font-size: 18px; color: var(--primary-text); }

  /* ===== ノートPC幅（受注・発注リストは4列だと窮屈になるため3列） ===== */
  @media (max-width: 1200px) {
    .orderList,
    .purchaseOrderList { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  /* ===== タブレット ===== */
  @media (max-width: 900px) {
    main.view { padding: 14px; }
