<style>
  /* ===== カラーパレット：コーポレートネイビー =====
     指定されたカラーパレット（メインネイビー#102A43／ダークネイビー#0B1F33／
     ネイビーサブ#243B53／ブランドブルー#2F6FAE／ライトブルー#DCEAF7／ページ背景
     #F4F7FA／カード#FFFFFF／ボーダー#D8E1E8／メイン文字#1F2933／サブ文字#6B7785）
     に基づく配色（旧「ウォームアイボリー」から変更）。--primary / --on-surface は
     テーマ設定（設定タブ）でユーザーが上書きできるため、実際の値はJS
     （applyTheme、JavaScript.html参照）が document.documentElement.style.setProperty
     で書き換える。ここでの値は未設定時の初期表示・THEME_PRESETSのDEFAULT_THEME_KEY
     （Constants.gs、'steel'プリセットをこのパレットのブランドブルーに合わせている）
     と揃えてある。
     --success / --warning / --danger、8種のテーマプリセットの primaryText
     （Constants.gs）は、白背景に対してWCAG AA（コントラスト比4.5:1以上）を
     確保できる明度まで暗く調整し直している（旧配色は暗い背景向けに明るく
     調整されていたため、そのままでは白背景で読みにくくなるため）。各色の
     背景ウォッシュ（--success-bg 等）は元の明るい色調のまま、文字色
     （--success 等）だけを暗くすることで、淡い背景色＋読みやすい濃い文字の
     組み合わせにしている。 */
  :root {
    /* --primary はボタン塗り・境界線・アクセント用（白文字とのコントラスト比
       ≒5.2:1を確保できる明度に調整済み）。リンクやアイコンなど、背景の上に
       「文字として」使う場合は --primary-text（白背景とのコントラスト比≒5.2:1）
       を使うこと（purpose別に分けている理由はJavaScript.htmlのapplyTheme参照）。
       --primary-dark（ホバー時等）はメインネイビー#102A43をそのまま使う。 */
    --primary: #2f6fae;
    --primary-dark: #102a43;
    --primary-text: #2f6fae;
    --on-primary: #ffffff;
    --surface: #ffffff;
    --background: #f4f7fa;
    --on-surface: #1f2933;
    --on-surface-variant: #6b7785;
    --outline: #d8e1e8;
    --success: #188649;
    --success-bg: rgba(61, 220, 132, .16);
    --warning: #a5670b;
    --warning-bg: rgba(242, 169, 60, .16);
    --danger: #ec0000;
    --danger-bg: rgba(255, 107, 107, .16);
    --primary-bg: #dceaf7;
    --shadow: 0 1px 2px rgba(16, 31, 51, .10);
    --shadow-elevated: 0 16px 40px rgba(16, 31, 51, .16);
    /* 公式サイトはカードの角丸をあまり強調しないフラットな見た目のため、
       従来の14pxより控えめな角丸にして「エンジニアリングされた精密さ」を出す。 */
    --radius: 8px;
    /* トップバー・比較バー・トーストは、テーマ設定のテーマカラー／文字色や
       ベース背景色（--background/--surface）に関わらず、常にネイビー基調で
       統一する（ブランドカラーやページのベース色を載せる帯ではなく、アプリの
       「額縁」として固定のネイビーにすることで、どのテーマカラー・ベース配色を
       選んでも重厚なネイビー基調の外観が崩れない）。ダークネイビー（最も暗い＝
       ヘッダー）／メインネイビー（比較バー）／ネイビーサブ（トースト）の順で
       少しずつ明るくし、旧配色（黒／#1a1a1d／#2a2a2e）と同じ奥行きの付け方を
       踏襲している。このネイビー基調のUI自体の文字色・枠線色は、ベース配色が
       白系になっても白文字のまま保てるよう、--on-surface / --outline とは別に
       --on-topbar / --dark-ui-outline を用意している。 */
    --topbar-bg: #0b1f33;
    --on-topbar: #ffffff;
    --dark-ui-outline: rgba(255, 255, 255, .14);
    /* トップバーの実高さ。JS（syncFixedBars_）が実測して上書きする。初期値は
       JS実行前のレイアウトずれを防ぐための目安値。 */
    --topbar-h: 108px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Barlow', 'Roboto', 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: var(--background);
    color: var(--on-surface);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }
  /* モーダル表示中は背景（在庫リスト・受注リスト等）がスクロールされないようにする
   （openModal/closeModal、JavaScript.html参照）。 */
  body.modal-open { overflow: hidden; }

  /* ===== ミニマルな線画アイコン（Google/Tesla調。絵文字アイコンの代わりに使う） ===== */
  .icon {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
    vertical-align: -5px;
  }
  .icon--inline { width: 14px; height: 14px; vertical-align: -2px; }

  /* ===== ヘッダー / タブ =====
     position: fixed で画面上部に完全固定する（position: stickyだとスクロール中に
     わずかに追従が遅れて見えることがあるため、実測値ベースで確実に固定する。
     JavaScript.html の syncFixedBars_ 参照）。 */
  #app { padding-top: var(--topbar-h); }
  .topbar {
    background: var(--topbar-bg);
    color: var(--on-topbar);
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--dark-ui-outline);
    box-shadow: var(--shadow);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
  }
  /* ===== ブランド表記の行 =====
     ロゴ・アプリ名を常に画面中央に配置する。左右の余白（.topbar__brandRow__spacer
     と .topbar__user）を1frずつの等幅にすることで、右側のユーザー情報の有無・幅に
     関わらずブランド表記が常に画面の真ん中に来るようにしている（flexboxの
     margin:auto中央寄せだと、右側の要素の幅の分だけ中心がずれてしまうため）。 */
  .topbar__brandRow {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    padding: 16px 28px 12px;
  }
  .topbar__brand {
    display: flex;
    align-items: center;
    justify-self: center;
    gap: 10px;
    white-space: nowrap;
  }
  /* 「戻る」「更新」ボタン。左側の余白（.topbar__brandRow__spacerと右側の
     .topbar__user）を1frずつの等幅にしているため、ここに実要素を置いても
     中央のブランド表記の位置には影響しない（両者は常に同じ幅になるため）。 */
  .topbar__brandRow__spacer { display: flex; align-items: center; gap: 6px; justify-self: start; }
  .topbar__navBtn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; padding: 0; flex: none;
    background: transparent; border: 1px solid var(--dark-ui-outline); border-radius: 50%;
    color: var(--on-topbar); cursor: pointer;
  }
  .topbar__navBtn:hover { background: rgba(255, 255, 255, .08); }
  .topbar__navBtn:disabled { opacity: .3; cursor: default; }
  .topbar__navBtn:disabled:hover { background: transparent; }
  /* 「更新」ボタンは「戻る」ボタンと見た目を統一し（同じアウトライン円形）、
     読み込み中はアイコンを回転させることだけでフィードバックする。 */
  .topbar__navBtn--refresh.is-spinning .icon { animation: navRefreshSpin .8s linear infinite; }
  @keyframes navRefreshSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .topbar__logo { height: 26px; width: auto; max-width: 120px; object-fit: contain; }
  /* メルセデス・ベンツ公式サイトのワードマークのような、控えめな大文字＋広めの
     トラッキングのブランド表記にする（太字で目立たせるのではなく、余白と
     レタースペーシングで高級感を出す）。 */
  .topbar__brandText {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  /* ===== ナビゲーション =====
     ブランド行の下に、独立した行として中央寄せで配置する。塗りつぶしの
     ピル型タブではなく、公式サイトのグローバルナビのような「テキスト＋
     アクティブ時の下線」のミニマルな水平ナビにする。 */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 0 28px 14px;
    overflow-x: auto;
  }
  .tabs__item {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--on-topbar);
    opacity: .6;
    padding: 6px 1px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .15s ease, border-color .15s ease;
  }
  .tabs__item:hover { opacity: .85; }
  .tabs__item.is-active { opacity: 1; border-bottom-color: var(--primary); }

  .topbar__user {
    justify-self: end;
    text-align: right;
    font-size: 12.5px;
    line-height: 1.5;
    white-space: nowrap;
  }
  .topbar__userName { display: block; font-weight: 500; }
  .topbar__userEmail { display: block; opacity: .8; font-size: 11.5px; }
  .topbar__userWarn { display: block; color: var(--warning); background: rgba(242, 169, 60, .16); padding: 4px 10px; border-radius: 999px; font-size: 11.5px; }

  /* ===== 在庫データ整合性チェックの警告バナー（アプリ起動時、問題があれば表示） =====
     トップバーの子要素として置くことで、表示・非表示による高さの変化を
     syncFixedBars_ の --topbar-h 実測にそのまま反映させる（ツールバーの
     固定位置がずれないようにするため）。 */
  .integrityBanner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--warning);
    color: #fff;
    padding: 9px 20px;
    font-size: 13.5px;
    font-weight: 500;
  }
  .integrityBanner__toggle, .integrityBanner__close {
    background: rgba(255, 255, 255, .18);
    border: none;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  .integrityBanner__toggle { padding: 4px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; flex: none; }
  .integrityBanner__toggle:hover { background: rgba(255, 255, 255, .3); }
  .integrityBanner__close { width: 26px; height: 26px; border-radius: 50%; font-size: 16px; line-height: 1; flex: none; }
  .integrityBanner__close:hover { background: rgba(255, 255, 255, .3); }
  .integrityBanner__list {
    list-style: none;
    margin: 0;
    padding: 10px 20px 12px;
    background: rgba(0, 0, 0, .1);
    color: #fff;
    font-size: 13px;
  }
  .integrityBanner__list li { padding: 3px 0; }

  main.view { max-width: 1680px; margin: 0 auto; padding: 16px; }
  .view { display: none; }
  .view.is-active { display: block; }

  /* ===== ツールバー（検索欄を含む） =====
     トップバーと同様に position: fixed で完全固定する。折り返しで高さが変わるため、
     すぐ下に高さ実測済みのスペーサー（.toolbarSpacer）を置いて、後続コンテンツが
     隠れないようにする（JavaScript.html の syncFixedBars_ 参照）。 */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    padding: 12px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    position: fixed;
    top: calc(var(--topbar-h) + 16px); /* ツールバーの下（次のカードまで）と同じ余白をヘッダーとの間にも確保する */
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 1648px; /* main.view の max-width(1680px) から左右padding(32px)を引いた値 */
    z-index: 25;
  }
  .toolbar__spacer { flex: 1; }

  .input {
    border: 1px solid var(--outline);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    background: var(--surface);
    color: var(--on-surface);
  }
  .input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .input--search { min-width: 220px; flex: 1 1 220px; }
  .input:disabled { background: var(--background); color: var(--on-surface-variant); cursor: not-allowed; }

  .checkboxField { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--on-surface-variant); }

  /* 公式サイトのCTAボタンのような、フル角丸＋大文字＋広めのレタースペーシングの
     ピル型ボタンにする（塗り／アウトラインどちらも同じ形状で統一）。 */
  .btn {
    border: 1px solid var(--outline);
    background: var(--surface);
    color: var(--on-surface);
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  /* アウトラインボタンは、公式サイトのCTAによくある「ホバーで反転（塗りつぶし）」
     の挙動にする。 */
  .btn:hover { background: var(--on-surface); border-color: var(--on-surface); color: var(--background); }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn--primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: var(--on-primary); }
  /* ロゴ削除等の添え書きリンクは、CTAボタンと区別できるよう大文字化・反転させない */
  .btn--text { border: none; background: none; color: var(--primary-text); padding: 8px 10px; text-transform: none; letter-spacing: normal; }
  .btn--text:hover { background: none; color: var(--primary-text); text-decoration: underline; }
  .btn--danger { color: var(--danger); border-color: var(--danger); }
  .btn--danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn--block { width: 100%; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  /* タップ領域は44x44px（モバイルの推奨最小タップサイズ）を確保しつつ、
     見た目上のアイコン自体は従来通り20pxのまま据え置く。 */
  .btn--icon {
    border: none; background: transparent; font-size: 20px; line-height: 1;
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer; color: var(--on-surface-variant);
  }
  .btn--icon:hover { background: rgba(31, 41, 51, .06); }

  /* ===== フォーカスリング（キーボード操作時の視認性確保） =====
     マウス操作時には表示されず、キーボードでのTab移動時のみ表示される
     :focus-visible を使う。ブランドカラー（--primary-text）で統一する。 */
  .btn:focus-visible,
  .tabs__item:focus-visible,
  .viewToggle__item:focus-visible,
  .homeRow:focus-visible,
  .homeGradeTab:focus-visible,
  .themePreset:focus-visible {
    outline: 2px solid var(--primary-text);
    outline-offset: 2px;
  }

  /* ===== グループ見出し ===== */
  .group { margin-bottom: 28px; }
  .group__title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--on-surface-variant);
    margin: 0 0 14px 2px;
  }
  .group__count {
    margin-left: 8px;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--primary-text);
  }
  .toolbar__count { font-size: 13.5px; color: var(--on-surface-variant); font-weight: 600; white-space: nowrap; }

  /* ===== 表示形式切替（カード／表）・在庫リストのツールバーに置くセグメントコントロール ===== */
  .viewToggle { display: flex; gap: 4px; background: var(--background); border-radius: 999px; padding: 3px; flex: none; }
  .viewToggle__item {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--on-surface-variant);
    width: 34px;
    height: 30px;
    border-radius: 999px;
    cursor: pointer;
  }
  .viewToggle__item .icon--inline { margin: 0; }
  .viewToggle__item.is-active { background: var(--surface); color: var(--primary-text); box-shadow: var(--shadow); }

  /* ===== 車両比較（カード・表それぞれに置くピン、下部固定バー、比較モーダル） ===== */
  .card__comparePin {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    color: var(--on-surface-variant);
    cursor: pointer;
    margin-left: auto;
  }
  .card__top .card__comparePin { flex: none; }
  .tableComparePin { display: flex; }

  .compareBar {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    /* テーマ設定の文字色やベース背景色（--on-surface/--background/--surface）に
       関わらず、常にネイビー基調の浮遊バーにする（メインネイビー。枠線も
       --outlineではなく、ネイビー背景でも見える--dark-ui-outlineを使う）。 */
    background: #102a43;
    border: 1px solid var(--dark-ui-outline);
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    box-shadow: var(--shadow-elevated);
    z-index: 40;
    max-width: calc(100% - 32px);
  }
  .compareBar__label { font-size: 13px; font-weight: 700; flex: none; }
  .compareBar__chips { display: flex; gap: 6px; flex-wrap: wrap; overflow-x: auto; max-width: 46vw; }
  .compareBar__spacer { flex: 1; min-width: 8px; }
  .compareChip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, .16);
    padding: 4px 6px 4px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    white-space: nowrap;
  }
  .compareChip button {
    border: none;
    background: rgba(255, 255, 255, .2);
    color: #fff;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .compareBar .btn { padding: 7px 14px; font-size: 13px; flex: none; }
  .compareBar .btn:not(.btn--primary) { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .3); color: #fff; }
  .compareBar .btn:not(.btn--primary):hover { background: rgba(255, 255, 255, .2); }

  .modal__panel.modal__panel--compare { max-width: 900px; }
  .tableScroll { overflow-x: auto; }
  .compareTable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .compareTable th, .compareTable td { padding: 10px 14px; border-bottom: 1px solid var(--outline); text-align: left; white-space: nowrap; }
  .compareTable thead th { color: var(--on-surface-variant); font-size: 12px; font-weight: 700; }
  .compareTable thead th:first-child { background: var(--surface); }
  .compareTable tbody th { font-size: 12.5px; font-weight: 700; color: var(--on-surface-variant); background: var(--background); }
  .compareTable__sub { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .compareTable tr.is-diff td { background: var(--primary-bg); }

  /* ===== 在庫リストの表示形式「表」（多台数を一覧で見比べる商談向けビュー） =====
     素のtableではなく、カードグリッドと同じ「カードタイプUI」（角丸・影・ホバーで
     浮き上がる）を保ったまま、1台=横1行のカードとして並べる。列位置はCSS Gridで
     全行そろえ、表形式ならではの一覧性はそのまま保つ。 */
  /* width: fit-contentにしないと、.rowCardListがブロック要素として.tableScroll
     いっぱいに広がってしまい、列がすべて固定幅になった今は、行（.rowCard）の
     右端（操作ボタン等）とカード自身の枠の間に、画面幅に応じて不要な余白が
     空いてしまう（現場からの指摘「一行を通して均一の余白で」より）。
     fit-contentにすることで、カードは常に列の合計幅ぴったりの大きさになる。 */
  .rowCardList { display: flex; flex-direction: column; gap: 10px; width: fit-content; min-width: 1348px; }
  /* 受注リストの表「行カード」は在庫リストより列数・列幅が少ないため、共通の
     min-width（1348px、在庫リスト向け）をそのまま使うと、行（.rowCard--order）が
     不要に広くstretchされ、固定幅の列だけでは埋まらない分だけ余白が空いてしまう。
     受注リスト自身の列合計に合わせて上書きする（.rowCard.rowCard--order参照）。 */
  .rowCardList--order { min-width: 1716px; }
  .rowCard {
    display: grid;
    /* .rowCardは.rowCardList（display:flex; flex-direction:column;）の子要素で
       あり、既定では横幅（クロス軸）が親の幅にstretchされる。grid-template-columns
       の固定幅列＋gapの合計（1348px）が親の幅より広い場合、明示的にmin-widthを
       指定しないと、グリッドの列（特に最後の状態・操作ボタン列）がカード自身の
       枠（border/background）からはみ出して表示されてしまっていたため
       （現場からの指摘で判明）、列の合計幅と同じ値をmin-widthとして固定する。 */
    min-width: 1348px;
    /* 最後の操作列は auto ではなく固定幅にする。auto だとHold中（ボタン2つ）と
       在庫あり（ボタン2つだが文言が違う）・2nd Hold登録済み（ボタン1つ）で
       操作列の内容幅が行ごとに変わり、他の列がそのぶん伸縮して行同士の列位置が
       ずれてしまっていたため（現場からの指摘で判明）。固定幅にすることで
       在庫あり／Hold中のどちらの行でも同じ列位置に揃う。状態列も「Hold中（2nd有）」
       バッジが収まる幅（150px）を確保し、隣の操作列と重ならないようにする
       （以前は108pxで文字がはみ出し、受注確定ボタンと重なって見えていた）。
       モデル列は以前210px＋左右に1frの空白列（車両情報ブロックを中央寄りに
       見せるため）を置いていたが、モデル列の実際のコンテンツ（比較チェックボックス・
       モデル名・コミッション）は最大でも70px程度しか使っておらず、残りが左詰めの
       文字の右側に無駄な余白として見えてしまい、モデル→MPの間だけ他の列間より
       大きく間延びして見えていた（現場からの指摘で判明）。モデル列を実際の
       コンテンツ幅に合わせて100pxまで縮め、左右の空白列も廃止し、他の列と同じ
       gap（16px）だけで隣り合うようにして、行全体で余白が均一に見えるようにした。 */
    grid-template-columns: 100px 68px 46px 150px 170px 96px 84px 88px 150px 210px;
    /* center ではなく start にする。center だと「Hold中（2nd有）」で解除リンクが
       2本に増えて状態列が縦に伸びた分だけ、1本しか無い操作ボタン（受注確定）が
       行の中央へ引っ張られて下にずれ、状態バッジの高さと揃わなくなっていたため
       （現場からの指摘で判明）。start にして全列を行の上端に揃えることで、
       状態列の行数（解除リンクの本数）に関係なく、バッジ・操作ボタン・他の項目が
       常に同じ高さで揃う。 */
    align-items: start;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-left: 4px solid transparent;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 20px;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  /* border-color: transparent ではなく上・右・下のみ指定する。border-color（4辺一括）だと
     border-left-color（在庫状況を示す色つきの左罫線）まで打ち消してしまい、ホバー時に
     状態の色が消えて見えてしまうため（.rowCard--available 等はこのルールより先に書かれて
     いるが、:hover は詳細度が高く上書きしてしまう）。 */
  .rowCard:hover { box-shadow: var(--shadow-elevated); transform: translateY(-2px); border-top-color: transparent; border-right-color: transparent; border-bottom-color: transparent; }
  .rowCard--available { border-left-color: var(--success); }
  .rowCard--hold { border-left-color: var(--warning); }
  .rowCard--hold2 { border-left-color: var(--danger); }
  /* 横スクロールが必要な列（有償OP等の車両情報・rowCard__status）は画面幅によっては
     スクロールしないと見えないため、行（カード）自体をタップすると、既存のカード表示と
     同じ見た目で車両情報すべてを画面中央のモーダルに表示する
     （openInventoryDetailModal_、JavaScript.html参照）。チェックボックス・操作ボタン
     自体は個別にクリックできるよう、cursor はタップ可能であることを示すのみに留める。 */
  .rowCard { cursor: pointer; }
  /* 比較チェックボックスは、以前は左端の専用列（ピン列）に置いていたが、
     モデル名とコミッションの間に移動した（現場からの指摘で判明）。
     .card__comparePin（カード表示側）と同じ「チェックボックス＋『比較』文字」の
     見た目だが、margin-left: auto は付けず、モデル名の下にそのまま左揃えで置く。 */
  .rowCard__comparePin {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--on-surface-variant);
    cursor: pointer;
  }
  .rowCard__field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  /* MP・VPC等の英数字（Latin書体）とステア・カラー等の日本語（CJK書体）を
     同じ.rowCard__valueで混在表示すると、フォントのフォールバック先が異なり
     行の高さ（line-height）がブラウザの自動計算でわずかに変わってしまい、
     値の上下位置が項目によって数px揃わなくなっていた（現場からの指摘で判明）。
     line-heightを明示的に固定することで、どちらの書体でも同じ高さになる。 */
  .rowCard__label { font-size: 9.5px; line-height: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--on-surface-variant); }
  .rowCard__value {
    font-size: 13.5px; line-height: 17px; font-weight: 600; color: var(--on-surface);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  /* 在庫リストの車両情報（MP・ステア・カラー・有償OP・入港予定日・可能月・VPC）は
     モデル名・コミッションの列（左端の識別列）や状態・操作ボタンの列（右端）とは
     区別して、カード中央の列としてラベル・値ともに中央揃えにする（現場からの
     指摘で判明）。 */
  .rowCard__field--center .rowCard__label,
  .rowCard__field--center .rowCard__value {
    text-align: center;
  }
  .rowCard__model { font-size: 15px; font-weight: 700; letter-spacing: -.005em; }
  .rowCard__commission { font-size: 11px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; margin-top: 1px; }
  /* 高さ固定・内部スクロール（.card__holdArea と同じ考え方）。Hold中はHOLD解除
     リンクが1本、Hold中（2nd有）は2本に増えて縦に伸びる分だけ、状態列だけが
     他の列より高くなり、行（カード）自体の高さが在庫あり／Hold中／Hold中（2nd有）で
     バラバラになっていたため、状態列の高さを常に一定にして吸収する。 */
  .rowCard__status { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 72px; overflow-y: auto; }
  .rowCard__cancelLink {
    border: none; background: none; color: var(--danger); font-size: 11px; font-weight: 700;
    cursor: pointer; padding: 0; text-align: center; width: 100%;
  }
  .rowCard__cancelLink:hover { text-decoration: underline; }
  /* justify-self: stretch + flex-start にすることで、ボタンが1つ（2nd Hold登録済み）
     でも2つ（Hold+受注 等）でも、先頭ボタンの開始位置は常にこの列の左端で揃う。
     justify-self: end だとボタン数で箱の幅が変わり、右端は揃っても開始位置が
     行ごとにずれてしまう。 */
  .rowCard__actions { display: flex; gap: 8px; justify-self: stretch; justify-content: flex-start; }

  /* 受注リストの表示形式「表」: 在庫と項目構成が異なる（比較ピン・操作ボタンが無く、
     顧客・担当者・リード番号などを表示する）ため、専用の列構成にする。顧客・モデルの
     列を`fr`（可変幅）にしていたため、.rowCardの共通min-width（在庫リスト向けに
     1490pxを指定、下記参照）を受け継いだ状態でこの列数の少ない構成に流用すると、
     余った横幅を可変幅の2列だけが吸収してしまい、顧客名〜モデル・モデル〜担当者の
     間に不要な余白が大きく空いてしまっていた（現場からの指摘で判明）。在庫リストと
     同様にすべての列を固定幅にし、min-widthも受注リスト自身の列合計に合わせて
     上書きすることで、余白をなくしスクロールの手間を減らしている。顧客名の列も
     以前210pxにしていたが、実際のコンテンツ（顧客名・コミッション）は最大でも
     60px程度しか使っておらず、左詰めの文字の右側に無駄な余白が生まれ、顧客名→モデルの
     間だけ他の列間より大きく間延びして見えていたため（現場からの指摘で判明）、
     110pxまで縮めている。以前は下取車の有無・OSS登録の可否・保険加入の有無・支払方法・
     MP・VPC・有償OPが表示されておらず、詳細モーダル（orderDetailGridHtml_）を開かないと
     確認できなかったため（現場からの指摘で判明）、これらも列として追加している。 */
  .rowCard.rowCard--order {
    grid-template-columns: 110px 120px 68px 88px 170px 90px 110px 80px 90px 90px 90px 80px 150px 130px;
    min-width: 1716px;
    border-left-color: var(--primary);
  }
  .btn--small { padding: 6px 12px; font-size: 12.5px; }

  /* ===== カードグリッド（PCビューで3列固定。Google Material×Teslaの余白多め・
     高コントラストな見出しでの「カードタイプUI」） ===== */
  .cardGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    /* align-items: stretch（デフォルト）だと、1台だけ「車両スペックを見る」等の
       詳細を開いて縦に伸びたときに、同じグリッド行の他のカードまで背が
       伸びてしまう（グリッド行の高さは行内で最も高いカードに揃うため）。
       start にすることで、各カードは自分自身の内容量ぶんの高さのみを取り、
       他のカードのサイズには影響しないようにする。 */
    align-items: start;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid transparent;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  /* rowCard:hover と同じ理由で、border-left-color（在庫状況の色）はホバー時も維持する。 */
  .card:hover { box-shadow: var(--shadow-elevated); transform: translateY(-3px); border-top-color: transparent; border-right-color: transparent; border-bottom-color: transparent; }
  .card--available { border-left-color: var(--success); }
  .card--hold { border-left-color: var(--warning); }
  /* 1st・2nd Holdの両方が埋まっている車両は、これ以上の受け皿がない分、他より
     目立たせる（現場の声を踏まえ、Hold1件のみとは別の色にする）。 */
  .card--hold2 { border-left-color: var(--danger); }
  /* モデル・コミッション・比較ピンの行と、バッジの行を常に別々の固定行にする。
     以前は1つのflex-wrapコンテナに全部まとめていたため、バッジの個数
     （2個／3個）やモデル名・コミッションの文字数の組み合わせによって折り返し方
     が変わり、在庫あり／Hold中／Hold中（2nd有）でカードの高さが揃わなかった。
     2行に固定することで、組み合わせに関わらず常に同じ高さになる。 */
  .card__top { display: flex; flex-direction: column; gap: 8px; }
  .card__topRow { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card__model { font-size: 21px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
  .card__commission {
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: .03em;
    color: var(--on-surface-variant);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .01em;
    padding: 5px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge__dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .badge--available { background: var(--success-bg); color: var(--success); }
  .badge--hold { background: var(--warning-bg); color: var(--warning); }
  .badge--hold2 { background: var(--danger-bg); color: var(--danger); }
  .badge--disclosed { background: var(--success-bg); color: var(--success); font-weight: 500; }
  .badge--undisclosed { background: rgba(31, 41, 51, .06); color: var(--on-surface-variant); font-weight: 500; }
  .badge--thisMonth { background: var(--primary-bg); color: var(--primary-text); font-weight: 500; }
  .badge--location { background: var(--primary-bg); color: var(--primary-text); font-weight: 500; }
  .card__badges { display: flex; gap: 6px; flex-wrap: wrap; }

  /* 車両スペック・Hold詳細はカード内に表示せず、「詳細を見る」タップで画面中央の
     モーダル（vehicleDetailHtml_）にまとめて表示する。以前はカード内の折りたたみ
     （<details>）だったが、開閉のたびにカードが伸び縮みし、在庫あり／Hold中／
     Hold中（2nd有）で高さが揃わなくなっていたため。 */
  .card__detailLink {
    margin: 0;
    width: 100%;
    padding: 12px 0 0;
    border: none;
    border-top: 1px solid var(--outline);
    border-radius: 0;
    background: none;
    text-align: left;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary-text);
  }
  .card__detailLink:hover { color: var(--primary); }

  /* メタ情報は2列のミニグリッドで表示。ラベルは小さく大文字寄り・トラッキング広め、
     値は大きく太くというメリハリのある「テスラ風」の見出し表現で視認性を高める。 */
  .card__metaGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 16px;
    margin: 0;
    padding: 12px 0 0;
  }
  /* MP・カラーは折りたたまず常に表示するため、card__topのすぐ下に独自の区切り線を持つ */
  .card__metaGrid--quick { border-top: 1px solid var(--outline); padding-top: 14px; }
  .card__metaGrid dt {
    color: var(--on-surface-variant);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .card__metaGrid dd { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--on-surface); line-height: 1.3; }

  /* Hold状況エリアは高さ固定・内部スクロール。Hold/2nd Holdが増えてもここで吸収し、
     カード自体の高さは在庫あり／Hold／2nd Holdのどの状態でも常に一定に保たれる。 */
  .card__holdArea {
    height: 124px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  /* 詳細モーダル（vehicleDetailHtml_）は、カードグリッドの行の高さを揃える
     必要が無いため、高さ固定・内部スクロールにせず内容ぶんそのまま表示する。 */
  .card__holdArea--full { height: auto; overflow: visible; }
  .card__holdArea--empty {
    align-items: center;
    justify-content: center;
  }
  .card__holdArea__placeholder {
    font-size: 12.5px;
    color: var(--on-surface-variant);
    opacity: .7;
  }
  .card__holdInfo {
    flex: none;
    background: var(--background);
    border-radius: 10px;
    border-left: 3px solid var(--outline);
    padding: 10px 12px;
    font-size: 13.5px;
    color: var(--on-surface-variant);
    line-height: 1.6;
  }
  .card__holdInfo b { color: var(--on-surface); }
  .card__holdInfo__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .card__holdInfo__label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  .card__holdInfo--first { border-left-color: var(--warning); }
  .card__holdInfo--first .card__holdInfo__label { color: var(--warning); }
  .card__holdInfo--second { border-left-color: var(--primary); background: var(--primary-bg); }
  .card__holdInfo--second .card__holdInfo__label { color: var(--primary-text); }
  .card__holdInfo__row { margin-bottom: 6px; }
  .card__holdInfo__cancel {
    border: none;
    background: none;
    color: var(--danger);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    flex: none;
  }
  .card__holdInfo__cancel:hover { background: var(--danger-bg); }

  /* 詳細（リード番号・登録月・下取車等）は詳細モーダル（vehicleDetailHtml_）内でのみ
     表示する（card__holdInfo__detailsBody--flat）。カード表示側では表示しない。 */
  .card__holdInfo__detailsBody--flat {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--outline);
  }

  /* ===== Hold 72時間タイマー ===== */
  .holdTimer__bar {
    height: 5px;
    border-radius: 999px;
    background: var(--outline);
    overflow: hidden;
  }
  .holdTimer__barFill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: var(--primary);
    transition: width 1s linear;
  }
  .holdTimer--warning .holdTimer__barFill { background: var(--warning); }
  .holdTimer--expired .holdTimer__barFill { background: var(--danger); width: 0% !important; }
  .holdTimer__text {
    margin-top: 4px;
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--on-surface-variant);
  }
  .holdTimer--warning .holdTimer__text { color: var(--warning); }
  .holdTimer--expired .holdTimer__text { color: var(--danger); }

  .card__actions { display: flex; gap: 10px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
  .card__actions .btn { flex: 1; min-height: 44px; }

  .emptyState {
    text-align: center;
    color: var(--on-surface-variant);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* ===== 受注リスト（在庫リストと揃えたカードタイプUI。PCビューで1行3列） ===== */
  .orderList {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    align-items: start;
  }
  .orderCard {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid var(--primary);
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  /* card:hover と同じ理由で、border-left-color（アクセントカラー）はホバー時も維持する。 */
  .orderCard:hover { box-shadow: var(--shadow-elevated); transform: translateY(-3px); border-top-color: transparent; border-right-color: transparent; border-bottom-color: transparent; }
  .orderCard__top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 10px; }
  .orderCard__top .card__badges { margin-left: auto; }
  .orderCard__top .card__badges .badge { margin-left: 0; }
  .orderCard__model { font-size: 21px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
  .orderCard__staff { font-size: 13.5px; font-weight: 600; color: var(--on-surface-variant); margin-top: 3px; }
  /* 車種は「誰が・何を買ったか」をひと目で確認できるよう、常に表示する
     （契約条件の詳細は下の折りたたみへ）。 */
  .orderCard__vehicle {
    font-size: 14px;
    font-weight: 600;
    color: var(--on-surface);
    margin-top: 4px;
  }
  /* 契約条件（コミッション・MP・VPC・有償OP・登録月・下取車・OSS・保険・支払方法・
     受注確定日時・リード番号）はカード内に表示せず、「詳細を見る」タップで画面中央の
     モーダル（orderDetailHtml_）にまとめて表示する。顧客名・担当者・車種だけで
     対象案件を判断できる（以前はカード内の折りたたみだったが、開閉のたびに
     カードが伸び縮みしていたため。card__detailLinkと同じパターン）。 */
  .orderCard__detailLink {
    margin: 0;
    width: 100%;
    padding: 12px 0 0;
    border: none;
    border-top: 1px solid var(--outline);
    border-radius: 0;
    background: none;
    text-align: left;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary-text);
  }
  .orderCard__detailLink:hover { color: var(--primary); }
  .orderCard__grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 16px;
    margin: 0;
    padding: 12px 0 0;
  }
  .orderCard__grid dt {
    color: var(--on-surface-variant);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .orderCard__grid dd { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--on-surface); line-height: 1.3; }

  /* ===== 設定画面 =====
     項目ごとに独立したカード（島）に分け、Google/Teslaのカードデザインに寄せる
     （角丸・影・余白多め。1つの大きなカードに全項目を詰め込まない）。
     2列の段組み（masonry）レイアウトも試したが、カードの高さがまちまちだと
     列の合計高さがずれてしまい、次のカードとの間隔だけ広がって不揃いに見える
     問題が残るため、確実に隙間が一定になる1列の縦積みに統一している
     （Google/Teslaの設定画面も同様に1列でカードを並べるスタイル）。 */
  /* 設定タブ全体のレイアウト（ナビ＋本体の2カラム）。カード自体は変わらず1列縦積みだが、
     広いPC画面では、760px幅のカード列だけが画面中央にぽつんと浮いて左右・下に
     大きな余白が残り間延びして見えるため、左側にセクションへのジャンプ用ナビを添えて
     画面をより意図的に使う（ヘッダー直下に固定されたトップバーとぶつからないよう
     position: stickyのtopは--topbar-h＋ツールバーと同じ余白ぶんに揃えている）。
     ナビ自体はJavaScript.htmlのrenderSettingsNav_が、実際に表示中のカード
     （管理者以外には隠れているカードは除く）から動的に組み立てる。 */
  .settingsLayout {
    display: flex;
    align-items: flex-start;
    gap: 32px;
    max-width: 1040px;
    margin: 0 auto;
  }
  .settingsNav {
    flex: 0 0 190px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    position: sticky;
    top: calc(var(--topbar-h) + 16px);
  }
  .settingsNav__item {
    display: block;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--on-surface-variant);
    text-decoration: none;
    transition: background-color .15s ease, color .15s ease;
  }
  .settingsNav__item:hover { background: var(--surface); color: var(--on-surface); }
  .settingsWrap {
    flex: 1 1 auto;
    max-width: 760px;
    min-width: 0;
  }
  .settingsGrid {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  /* テーマ・システムマスタ等、設定タブ内の大分類見出し。カードの外側、
     グループの先頭に置く（カード自体の見出し＝settingsSection__titleとは別）。 */
  .settingsGroupTitle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--on-surface-variant);
    margin: 8px 2px -6px;
  }
  .settingsGroupTitle--admin { color: var(--on-surface); }
  .settingsGroupTitle__badge {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: none;
    background: var(--warning-bg);
    color: var(--warning);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .settingsCard {
    background: var(--surface);
    border-radius: 10px;
    box-shadow: var(--shadow);
    border: 1px solid var(--outline);
    padding: 26px 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .settingsSection__title {
    font-size: 15.5px;
    font-weight: 700;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--on-surface);
  }
  .settingsSection__title .icon { color: var(--primary-text); }
  .settingsSection__desc {
    font-size: 12.5px;
    color: var(--on-surface-variant);
    margin: 0 0 14px;
    line-height: 1.6;
  }
  .settingsCard .formField + .formField { margin-top: 14px; }
  .settingsActions {
    background: var(--surface);
    border-radius: 10px;
    box-shadow: var(--shadow);
    border: 1px solid var(--outline);
    padding: 20px 28px;
  }
  .formField { display: flex; flex-direction: column; gap: 6px; }
  .formField label { font-size: 13px; font-weight: 500; color: var(--on-surface-variant); }
  .formField .input { width: 100%; }
  .formField__hint { margin: 0; font-size: 12px; color: var(--on-surface-variant); }
  .formField.hidden { display: none; }

  /* ===== テーマ（着せ替え）プリセット選択 =====
     以前はカラーピッカーで自由に配色を指定できたが、組み合わせによって
     コントラスト比が不足する懸念があったため、視覚的に確認済みの8色から
     選ぶスウォッチ形式に変更した（洋服・スマホケースの色を選ぶイメージ）。 */
  .themePresetGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .themePreset {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 8px;
    background: var(--background);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--on-surface-variant);
    font-size: 12px;
  }
  .themePreset:hover { border-color: var(--swatch); }
  .themePreset.is-selected { border-color: var(--swatch); background: rgba(31, 41, 51, .04); color: var(--on-surface); }
  .themePreset__swatch {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--swatch);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15);
  }
  .themePreset.is-selected .themePreset__swatch {
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15), 0 0 0 3px var(--surface), 0 0 0 5px var(--swatch);
  }
  .themePreset__name { text-align: center; line-height: 1.3; }
  @media (max-width: 480px) {
    .themePresetGrid { grid-template-columns: repeat(3, 1fr); }
  }

  /* ===== ロゴ設定 ===== */
  .logoField { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logoPreview {
    width: 72px; height: 72px; flex: none;
    border: 1px solid var(--outline); border-radius: 8px;
    background: var(--background);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .logoPreview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .logoPreview__placeholder { font-size: 11px; color: var(--on-surface-variant); text-align: center; }
  .logoField__controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ===== 設定タブの各種リスト共通: ドラッグハンドル（担当者・モデル写真・
     メール通知先で共通利用。JavaScript.htmlのmakeReorderable_参照） ===== */
  .dragHandle {
    flex: none;
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 32px;
    color: var(--on-surface-variant);
    font-size: 15px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    border-radius: 4px;
  }
  .dragHandle:hover { background: var(--background); color: var(--on-surface); }
  .dragHandle:active { cursor: grabbing; }
  [data-drag-index].is-dragging { opacity: .4; }
  [data-drag-index].is-drag-over {
    outline: 2px dashed var(--primary);
    outline-offset: 2px;
    border-radius: 8px;
  }

  /* ===== 担当者マスタ ===== */
  .staffList { display: flex; flex-direction: column; gap: 6px; }
  .staffList__row { display: flex; gap: 8px; align-items: center; }
  .staffList__row .input[data-staff-field="name"] { flex: 0 0 22%; min-width: 80px; }
  .staffList__row .input[data-staff-field="email"] { flex: 1 1 40%; min-width: 0; }
  .staffList__row .input[data-staff-field="location"] { flex: 0 0 22%; min-width: 90px; }
  .staffList__empty { font-size: 13px; color: var(--on-surface-variant); }

  /* ===== モデル写真（ホーム画面） ===== */
  .modelPhotoList { display: flex; flex-direction: column; gap: 8px; }
  .modelPhotoList__row { display: flex; gap: 10px; align-items: center; }
  .modelPhotoList__preview {
    width: 44px; height: 44px; flex: none;
    border: 1px solid var(--outline); border-radius: 8px;
    background: var(--background);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .modelPhotoList__preview img { width: 100%; height: 100%; object-fit: cover; }
  .modelPhotoList__row .input[data-photo-field="model"] { flex: 0 0 26%; min-width: 90px; }
  .modelPhotoList__row .input[data-photo-field="photoUrl"] { flex: 1 1 auto; min-width: 0; }
  .modelPhotoList__empty { font-size: 13px; color: var(--on-surface-variant); }

  /* ===== メール通知先（Hold時／受注確定時／システムエラー通知） =====
     以前は「,区切りの1テキスト欄」だったが、担当者マスタ・モデル写真と統一した
     「1行1件・追加/削除/ドラッグ並び替え」のリスト形式に変更した。 */
  .mailList { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .mailList__row { display: flex; gap: 8px; align-items: center; }
  .mailList__row .input { flex: 1 1 auto; min-width: 0; }
  .mailList__empty { font-size: 13px; color: var(--on-surface-variant); margin-bottom: 4px; }

  /* ===== ホーム画面: 在庫サマリー =====
     PC（広い画面）でモデル一覧の上に置く、在庫状況の要約4項目（在庫あり／1st Hold中／
     2nd Hold中／総台数）。ホーム画面がモデルタイルのグリッドだけだと、モデル数が
     少ない・画面が広い場合に上部だけタイルが並び下は余白という間延びした見た目に
     なりやすいため、担当者が朝いちばんに気にする「今どれだけ動かせる在庫があるか」を
     一目で把握できる要約を添えている（内訳の値は、モデルタイルの在庫台数と同じ
     state.allInventoryItems から算出するため、二重に取得し直すことはしない）。
     JavaScript.htmlのrenderHomeStats_参照。 */
  .homeStats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .homeStats__item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-left: 4px solid var(--outline);
    border-radius: var(--radius);
  }
  .homeStats__value { font-size: 26px; font-weight: 700; line-height: 1.1; color: var(--on-surface); }
  .homeStats__label { font-size: 12.5px; color: var(--on-surface-variant); }
  .homeStats__item--available { border-left-color: var(--success); }
  .homeStats__item--available .homeStats__value { color: var(--success); }
  .homeStats__item--hold { border-left-color: var(--warning); }
  .homeStats__item--hold .homeStats__value { color: var(--warning); }
  .homeStats__item--hold2 { border-left-color: var(--danger); }
  .homeStats__item--hold2 .homeStats__value { color: var(--danger); }
  .homeStats__item--total { border-left-color: var(--primary); }
  .homeStats__item--total .homeStats__value { color: var(--primary); }

  /* ===== ホーム画面 =====
     PC（901px以上）はモデル写真を大きく見せる4列グリッドにする。タブレット・
     スマホ幅（900px以下）では、パッと見て在庫状況がわかる情報密度を優先した
     横一列の「リスト」型のままにする（@media (max-width: 900px)で上書き。
     現場の声を踏まえて選んだ元のレイアウトのため、狭い画面では変更しない）。 */
  .homeList {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  .homeRow {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    color: var(--on-surface);
    cursor: pointer;
    text-align: left;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease, background-color .15s ease;
  }
  .homeRow:hover { box-shadow: var(--shadow-elevated); transform: translateY(-3px); border-color: transparent; }
  /* 展開中のタイルは、グリッドの全列ぶんの幅（grid-column: 1 / -1）を使い、
     カードの枠（背景・境界線・余白）を外して、写真を画面中央に大きく
     クローズアップ表示する。写真とモデル名ラベルを同じグリッドセル
     （grid-area: 1 / 1）に重ねて配置することで、写真の実際の表示位置に
     関わらず、ラベルが常に写真の左上にぴったり重なるようにしている
     （position:absoluteで.homeRowを基準にすると、写真が中央寄せで
     ずれた分だけラベルの位置もずれてしまうため）。在庫台数バッジは
     （下のグレードタブで内訳が見えるため）非表示にする。
     order: -1で、どのモデルを選択してもクローズアップ表示が常にグリッドの
     先頭（他のモデルより上）に来るようにしている（現場からの指摘で判明。
     以前はモデル写真の登録順のままDOM順を保っていたため、先頭以外の
     モデルを展開すると、そのモデルが元の位置に留まり、他のモデルが
     上下に分断されて表示されてしまっていた）。 */
  .homeRow.is-expanded {
    grid-column: 1 / -1;
    order: -1;
    display: grid;
    justify-content: center;
    padding: 0;
    background: none;
    border-color: transparent;
  }
  .homeRow.is-expanded:hover { box-shadow: none; transform: none; }
  .homeRow__photo {
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 8px;
    overflow: hidden;
    background: var(--background);
  }
  .homeRow.is-expanded .homeRow__photo {
    grid-area: 1 / 1;
    width: min(480px, 100%);
    aspect-ratio: 1 / 1;
    border-radius: var(--radius);
    z-index: 0;
  }
  .homeRow__photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .homeRow__meta { display: flex; align-items: center; gap: 8px; }
  /* モデル名ラベルは、写真を塗りつぶす濃い背景を敷くのではなく、白文字＋
     テキストシャドウで写真の上に直接重ねる（現場からの指摘で判明。以前は
     半透明の黒背景（rgba(0,0,0,.6)）を敷いていたが、ベース配色を白系
     （コーポレートネイビー）に変えた際に文字色がvar(--on-surface)＝濃い
     チャコールのまま残っており、黒背景にほぼ同化して読めなくなっていた）。 */
  .homeRow.is-expanded .homeRow__meta {
    grid-area: 1 / 1;
    align-self: start;
    justify-self: start;
    margin: 12px;
    padding: 6px 12px;
    z-index: 1;
  }
  .homeRow.is-expanded .homeRow__meta,
  .homeRow.is-expanded .homeRow__meta .homeRow__chevron {
    color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .85), 0 1px 10px rgba(0, 0, 0, .6);
  }
  .homeRow.is-expanded .badge--count { display: none; }
  /* 「他のモデルを見る」ボタン: モデル名ラベルとは逆の右上隅に重ねる。
     押すと展開を解除し、他のモデルが並ぶ通常のグリッド表示に戻る
     （#homeGridのクリック委譲で、.homeRow自体のトグル処理がそのまま効く）。
     ラベルとは異なり操作ボタンのため、タップ可能であることが伝わるよう
     薄い白背景のピル型にしている（写真を大きく塗りつぶすラベル背景とは
     区別し、operationであることを示す最小限の塗りに留める）。 */
  .homeRow__backBtn {
    display: none;
  }
  .homeRow.is-expanded .homeRow__backBtn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    grid-area: 1 / 1;
    align-self: start;
    justify-self: end;
    margin: 12px;
    padding: 6px 14px;
    border: none;
    border-radius: 999px;
    background: rgba(255, 255, 255, .92);
    color: var(--on-surface);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    z-index: 1;
  }
  .homeRow__backBtn:hover { background: #fff; }
  .homeRow__model {
    flex: 1; min-width: 0; font-size: 16px; font-weight: 600; letter-spacing: -.005em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .badge--count { background: var(--primary-bg); color: var(--primary-text); font-weight: 600; flex: none; }
  .homeRow__chevron { flex: none; font-size: 13px; color: var(--on-surface-variant); }

  /* ===== ホームのグレードタブ（グレードが設定されたモデル行を展開すると現れる） =====
     PCの4列グリッドでは、展開したタイルの直下に全列ぶんの幅で表示する
     （grid-column: 1 / -1）。900px以下（リスト型）では、写真幅ぶんインデントし
     左に細い罫線を添えることで「ベースモデル行から派生したタブである」ことを
     視覚的に示す（車両スペック折りたたみ等と同じ、階層関係を罫線で示す考え方。
     @media (max-width: 900px)で上書き）。 */
  .homeGradeTabs {
    grid-column: 1 / -1;
    /* 展開中タイル（.homeRow.is-expanded、order:-1）の直下・他のモデルカードより
       上に表示されるよう、こちらもorder:-1にする（展開タイルとグレードタブは
       常にペアでDOM上に連続して出力されるため、同じorder値でもDOM順で
       タイル→タブの並びが保たれる）。 */
    order: -1;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
  }
  .homeGradeTabs__label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--on-surface-variant);
    margin: 0 0 10px;
  }
  .homeGradeTabs__list { display: flex; flex-wrap: wrap; gap: 8px; }
  .homeGradeTab {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--outline);
    background: var(--surface);
    color: var(--on-surface);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .homeGradeTab:hover { background: rgba(31, 41, 51, .05); border-color: var(--primary); }
  .homeGradeTab__count { color: var(--on-surface-variant); font-weight: 500; font-variant-numeric: tabular-nums; }
  /* 在庫0台のグレードは、Hold中も無くまとまった在庫の当てがないことがひと目で
     わかるよう、件数を赤文字にする。 */
  .homeGradeTab__count--zero { color: var(--danger); font-weight: 700; }

  /* ===== リード番号入力（「L-」固定接頭辞＋数字。Google×Tesla風の見出し扱いにする） ===== */
  .leadNumberField {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--outline);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .leadNumberField:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg); }
  .leadNumberField__prefix {
    display: flex;
    align-items: center;
    padding: 0 14px;
    background: var(--primary-bg);
    color: var(--primary-text);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .03em;
    border-right: 1px solid var(--outline);
  }
  .leadNumberField__input { border: none; border-radius: 0; flex: 1; min-width: 0; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .leadNumberField .leadNumberField__input:focus { outline: none; }

  /* ===== 担当者表示（ログイン中のアカウントから自動判定・読み取り専用） ===== */
  .staffDisplay {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--background);
    font-size: 14px;
  }
  .staffDisplay__email { font-size: 12px; color: var(--on-surface-variant); }
  .staffDisplay__warn { font-size: 13px; color: var(--danger); }

  /* ===== モーダル ===== */
  .modal {
    position: fixed; inset: 0; background: rgba(32, 33, 36, .5);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  /* ヘッダー・ステップ進捗・フッターは固定し、modal__bodyだけをスクロール
     させる（display: flex; flex-direction: columnで、modal__bodyのみ
     flex: 1 1 auto; overflow-y: autoにする）。以前はmodal__panel自体を
     スクロールさせていたため、内容が長いモーダルではタイトルや「Hold登録」
     等の見出しごとスクロールして見えなくなっていた。 */
  .modal__panel {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-elevated);
    width: 100%; max-width: 460px; max-height: 90vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal__panel--wide { max-width: 640px; }
  .modal__header { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--outline); }
  .modal__header h2 { font-size: 17px; font-weight: 500; margin: 0; display: flex; align-items: center; }
