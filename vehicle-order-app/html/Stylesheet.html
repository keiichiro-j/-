<style>
  /* ===== カラーパレット：ラグジュアリーブラック =====
     黒・ダークグレーを基調に、メタリックシルバー（--outline / --on-surface-variant）と
     スチールブルーのアクセント（--primary）を組み合わせた、高級輸入車ディーラーサイト風の
     重厚な配色。--primary / --on-surface はテーマ設定（設定タブ）でユーザーが上書きできる
     ため、実際の値はJS（applyTheme / applyTextColor、JavaScript.html参照）が
     document.documentElement.style.setProperty で書き換える。ここでの値は
     未設定時の初期表示・DEFAULT_THEME_COLOR / DEFAULT_TEXT_COLOR（Constants.gs）と
     揃えてある。 */
  :root {
    /* --primary はボタン塗り・境界線・アクセント用（白文字とのコントラスト比
       ≒5.1:1を確保できる明度に調整済み）。リンクやアイコンなど、暗い背景の
       上に「文字として」使う場合は、より明るい --primary-text
       （背景とのコントラスト比≒4.9:1）を使うこと（WCAG AA対応。
       purpose別に分けている理由はJavaScript.htmlのapplyTheme参照）。 */
    --primary: #3870b0;
    --primary-dark: #2c5789;
    --primary-text: #468cdc;
    --on-primary: #ffffff;
    --surface: #1b1c20;
    --background: #0c0c0e;
    --on-surface: #f2f1ed;
    --on-surface-variant: #9a9ca3;
    --outline: rgba(255, 255, 255, .14);
    --success: #3ddc84;
    --success-bg: rgba(61, 220, 132, .16);
    --warning: #f2a93c;
    --warning-bg: rgba(242, 169, 60, .16);
    --danger: #ff6b6b;
    --danger-bg: rgba(255, 107, 107, .16);
    --primary-bg: rgba(56, 112, 176, .18);
    --shadow: 0 1px 2px rgba(0, 0, 0, .55);
    --shadow-elevated: 0 16px 40px rgba(0, 0, 0, .55);
    /* 公式サイトはカードの角丸をあまり強調しないフラットな見た目のため、
       従来の14pxより控えめな角丸にして「エンジニアリングされた精密さ」を出す。 */
    --radius: 8px;
    /* トップバー・比較バーは、テーマ設定のテーマカラー／文字色に関わらず
       常に黒基調で統一する（ブランドカラーを載せる帯ではなく、アプリの「額縁」として
       固定の黒にすることで、どのテーマカラーを選んでも重厚な黒基調の外観が崩れない）。 */
    --topbar-bg: #000000;
    /* トップバーの実高さ。JS（syncFixedBars_）が実測して上書きする。初期値は
       JS実行前のレイアウトずれを防ぐための目安値。 */
    --topbar-h: 108px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Barlow', 'Roboto', 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: var(--background);
    color: var(--on-surface);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  /* ===== ミニマルな線画アイコン（Google/Tesla調。絵文字アイコンの代わりに使う） ===== */
  .icon {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
    vertical-align: -5px;
  }
  .icon--inline { width: 14px; height: 14px; vertical-align: -2px; }

  /* ===== ヘッダー / タブ =====
     position: fixed で画面上部に完全固定する（position: stickyだとスクロール中に
     わずかに追従が遅れて見えることがあるため、実測値ベースで確実に固定する。
     JavaScript.html の syncFixedBars_ 参照）。 */
  #app { padding-top: var(--topbar-h); }
  .topbar {
    background: var(--topbar-bg);
    color: var(--on-surface);
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--outline);
    box-shadow: var(--shadow);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
  }
  /* ===== ブランド表記の行 =====
     ロゴ・アプリ名を常に画面中央に配置する。左右の余白（.topbar__brandRow__spacer
     と .topbar__user）を1frずつの等幅にすることで、右側のユーザー情報の有無・幅に
     関わらずブランド表記が常に画面の真ん中に来るようにしている（flexboxの
     margin:auto中央寄せだと、右側の要素の幅の分だけ中心がずれてしまうため）。 */
  .topbar__brandRow {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    padding: 16px 28px 12px;
  }
  .topbar__brand {
    display: flex;
    align-items: center;
    justify-self: center;
    gap: 10px;
    white-space: nowrap;
  }
  .topbar__logo { height: 26px; width: auto; max-width: 120px; object-fit: contain; }
  /* メルセデス・ベンツ公式サイトのワードマークのような、控えめな大文字＋広めの
     トラッキングのブランド表記にする（太字で目立たせるのではなく、余白と
     レタースペーシングで高級感を出す）。 */
  .topbar__brandText {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  /* ===== ナビゲーション =====
     ブランド行の下に、独立した行として中央寄せで配置する。塗りつぶしの
     ピル型タブではなく、公式サイトのグローバルナビのような「テキスト＋
     アクティブ時の下線」のミニマルな水平ナビにする。 */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 0 28px 14px;
    overflow-x: auto;
  }
  .tabs__item {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--on-surface);
    opacity: .6;
    padding: 6px 1px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .15s ease, border-color .15s ease;
  }
  .tabs__item:hover { opacity: .85; }
  .tabs__item.is-active { opacity: 1; border-bottom-color: var(--primary); }

  .topbar__user {
    justify-self: end;
    text-align: right;
    font-size: 12.5px;
    line-height: 1.5;
    white-space: nowrap;
  }
  .topbar__userName { display: block; font-weight: 500; }
  .topbar__userEmail { display: block; opacity: .8; font-size: 11.5px; }
  .topbar__userWarn { display: block; color: var(--warning); background: rgba(242, 169, 60, .16); padding: 4px 10px; border-radius: 999px; font-size: 11.5px; }

  /* ===== 在庫データ整合性チェックの警告バナー（アプリ起動時、問題があれば表示） =====
     トップバーの子要素として置くことで、表示・非表示による高さの変化を
     syncFixedBars_ の --topbar-h 実測にそのまま反映させる（ツールバーの
     固定位置がずれないようにするため）。 */
  .integrityBanner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--warning);
    color: #fff;
    padding: 9px 20px;
    font-size: 13.5px;
    font-weight: 500;
  }
  .integrityBanner__toggle, .integrityBanner__close {
    background: rgba(255, 255, 255, .18);
    border: none;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  .integrityBanner__toggle { padding: 4px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; flex: none; }
  .integrityBanner__toggle:hover { background: rgba(255, 255, 255, .3); }
  .integrityBanner__close { width: 26px; height: 26px; border-radius: 50%; font-size: 16px; line-height: 1; flex: none; }
  .integrityBanner__close:hover { background: rgba(255, 255, 255, .3); }
  .integrityBanner__list {
    list-style: none;
    margin: 0;
    padding: 10px 20px 12px;
    background: rgba(0, 0, 0, .1);
    color: #fff;
    font-size: 13px;
  }
  .integrityBanner__list li { padding: 3px 0; }

  main.view { max-width: 1680px; margin: 0 auto; padding: 16px; }
  .view { display: none; }
  .view.is-active { display: block; }

  /* ===== ツールバー（検索欄を含む） =====
     トップバーと同様に position: fixed で完全固定する。折り返しで高さが変わるため、
     すぐ下に高さ実測済みのスペーサー（.toolbarSpacer）を置いて、後続コンテンツが
     隠れないようにする（JavaScript.html の syncFixedBars_ 参照）。 */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    padding: 12px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    position: fixed;
    top: calc(var(--topbar-h) + 16px); /* ツールバーの下（次のカードまで）と同じ余白をヘッダーとの間にも確保する */
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 1648px; /* main.view の max-width(1680px) から左右padding(32px)を引いた値 */
    z-index: 25;
  }
  .toolbar__spacer { flex: 1; }

  .input {
    border: 1px solid var(--outline);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    background: var(--surface);
    color: var(--on-surface);
  }
  .input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .input--search { min-width: 220px; flex: 1 1 220px; }
  .input:disabled { background: var(--background); color: var(--on-surface-variant); cursor: not-allowed; }

  .checkboxField { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--on-surface-variant); }

  /* 公式サイトのCTAボタンのような、フル角丸＋大文字＋広めのレタースペーシングの
     ピル型ボタンにする（塗り／アウトラインどちらも同じ形状で統一）。 */
  .btn {
    border: 1px solid var(--outline);
    background: var(--surface);
    color: var(--on-surface);
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  /* アウトラインボタンは、公式サイトのCTAによくある「ホバーで反転（塗りつぶし）」
     の挙動にする。 */
  .btn:hover { background: var(--on-surface); border-color: var(--on-surface); color: var(--background); }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn--primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: var(--on-primary); }
  /* ロゴ削除等の添え書きリンクは、CTAボタンと区別できるよう大文字化・反転させない */
  .btn--text { border: none; background: none; color: var(--primary-text); padding: 8px 10px; text-transform: none; letter-spacing: normal; }
  .btn--text:hover { background: none; color: var(--primary-text); text-decoration: underline; }
  .btn--danger { color: var(--danger); border-color: var(--danger); }
  .btn--danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn--block { width: 100%; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  /* タップ領域は44x44px（モバイルの推奨最小タップサイズ）を確保しつつ、
     見た目上のアイコン自体は従来通り20pxのまま据え置く。 */
  .btn--icon {
    border: none; background: transparent; font-size: 20px; line-height: 1;
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer; color: var(--on-surface-variant);
  }
  .btn--icon:hover { background: rgba(255, 255, 255, .08); }

  /* ===== フォーカスリング（キーボード操作時の視認性確保） =====
     マウス操作時には表示されず、キーボードでのTab移動時のみ表示される
     :focus-visible を使う。ブランドカラー（--primary-text）で統一する。 */
  .btn:focus-visible,
  .tabs__item:focus-visible,
  .viewToggle__item:focus-visible,
  .homeRow:focus-visible,
  .homeGradeTab:focus-visible,
  .themePreset:focus-visible {
    outline: 2px solid var(--primary-text);
    outline-offset: 2px;
  }

  /* ===== グループ見出し ===== */
  .group { margin-bottom: 28px; }
  .group__title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--on-surface-variant);
    margin: 0 0 14px 2px;
  }
  .group__count {
    margin-left: 8px;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--primary-text);
  }
  .toolbar__count { font-size: 13.5px; color: var(--on-surface-variant); font-weight: 600; white-space: nowrap; }

  /* ===== 表示形式切替（カード／表）・在庫リストのツールバーに置くセグメントコントロール ===== */
  .viewToggle { display: flex; gap: 4px; background: var(--background); border-radius: 999px; padding: 3px; flex: none; }
  .viewToggle__item {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--on-surface-variant);
    width: 34px;
    height: 30px;
    border-radius: 999px;
    cursor: pointer;
  }
  .viewToggle__item .icon--inline { margin: 0; }
  .viewToggle__item.is-active { background: var(--surface); color: var(--primary-text); box-shadow: var(--shadow); }

  /* ===== 車両比較（カード・表それぞれに置くピン、下部固定バー、比較モーダル） ===== */
  .card__comparePin {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    color: var(--on-surface-variant);
    cursor: pointer;
    margin-left: auto;
  }
  .card__top .card__comparePin { flex: none; }
  .tableComparePin { display: flex; }

  .compareBar {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    /* テーマ設定の文字色（--on-surface）に関わらず、常に黒基調の浮遊バーにする
       （--on-surfaceを背景に使うと、ラグジュアリーブラック配色では文字色が
       明るい色になるため、白文字と衝突して見えなくなってしまうため）。 */
    background: #1a1a1d;
    border: 1px solid var(--outline);
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    box-shadow: var(--shadow-elevated);
    z-index: 40;
    max-width: calc(100% - 32px);
  }
  .compareBar__label { font-size: 13px; font-weight: 700; flex: none; }
  .compareBar__chips { display: flex; gap: 6px; flex-wrap: wrap; overflow-x: auto; max-width: 46vw; }
  .compareBar__spacer { flex: 1; min-width: 8px; }
  .compareChip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, .16);
    padding: 4px 6px 4px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    white-space: nowrap;
  }
  .compareChip button {
    border: none;
    background: rgba(255, 255, 255, .2);
    color: #fff;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .compareBar .btn { padding: 7px 14px; font-size: 13px; flex: none; }
  .compareBar .btn:not(.btn--primary) { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .3); color: #fff; }
  .compareBar .btn:not(.btn--primary):hover { background: rgba(255, 255, 255, .2); }

  .modal__panel.modal__panel--compare { max-width: 900px; }
  .tableScroll { overflow-x: auto; }
  .compareTable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .compareTable th, .compareTable td { padding: 10px 14px; border-bottom: 1px solid var(--outline); text-align: left; white-space: nowrap; }
  .compareTable thead th { color: var(--on-surface-variant); font-size: 12px; font-weight: 700; }
  .compareTable thead th:first-child { background: var(--surface); }
  .compareTable tbody th { font-size: 12.5px; font-weight: 700; color: var(--on-surface-variant); background: var(--background); }
  .compareTable__sub { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .compareTable tr.is-diff td { background: var(--primary-bg); }

  /* ===== 在庫リストの表示形式「表」（多台数を一覧で見比べる商談向けビュー） =====
     素のtableではなく、カードグリッドと同じ「カードタイプUI」（角丸・影・ホバーで
     浮き上がる）を保ったまま、1台=横1行のカードとして並べる。列位置はCSS Gridで
     全行そろえ、表形式ならではの一覧性はそのまま保つ。 */
  .rowCardList { display: flex; flex-direction: column; gap: 10px; min-width: 1160px; }
  .rowCard {
    display: grid;
    /* 最後の操作列は auto ではなく固定幅にする。auto だとHold中（ボタン2つ）と
       在庫あり（ボタン2つだが文言が違う）・2nd Hold登録済み（ボタン1つ）で
       操作列の内容幅が行ごとに変わり、他の列がそのぶん伸縮して行同士の列位置が
       ずれてしまっていたため（現場からの指摘で判明）。固定幅にすることで
       在庫あり／Hold中のどちらの行でも同じ列位置に揃う。状態列も「Hold中（2nd有）」
       バッジが収まる幅（150px）を確保し、隣の操作列と重ならないようにする
       （以前は108pxで文字がはみ出し、受注確定ボタンと重なって見えていた）。 */
    grid-template-columns: 30px 1.5fr 68px 46px 1.2fr 1.1fr 96px 84px 88px 150px 210px;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-left: 4px solid transparent;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 20px;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  /* border-color: transparent ではなく上・右・下のみ指定する。border-color（4辺一括）だと
     border-left-color（在庫状況を示す色つきの左罫線）まで打ち消してしまい、ホバー時に
     状態の色が消えて見えてしまうため（.rowCard--available 等はこのルールより先に書かれて
     いるが、:hover は詳細度が高く上書きしてしまう）。 */
  .rowCard:hover { box-shadow: var(--shadow-elevated); transform: translateY(-2px); border-top-color: transparent; border-right-color: transparent; border-bottom-color: transparent; }
  .rowCard--available { border-left-color: var(--success); }
  .rowCard--hold { border-left-color: var(--warning); }
  .rowCard--hold2 { border-left-color: var(--danger); }
  /* 横スクロールが必要な列（有償OP等の車両情報・rowCard__status）は画面幅によっては
     スクロールしないと見えないため、行（カード）自体をタップすると、既存のカード表示と
     同じ見た目で車両情報すべてを画面中央のモーダルに表示する
     （openInventoryDetailModal_、JavaScript.html参照）。チェックボックス・操作ボタン
     自体は個別にクリックできるよう、cursor はタップ可能であることを示すのみに留める。 */
  .rowCard { cursor: pointer; }
  .rowCard__pin { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .rowCard__pinCheckbox { display: flex; justify-content: center; }
  /* 色つきの状態ドット: スクロール不要な左端（ピン列）に常時表示し、横スクロールしなくても
     色でHold状況（在庫あり＝緑／Hold中＝黄／Hold中（2nd有）＝赤）が分かるようにする。 */
  .rowCard__statusDot { display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--success); }
  .rowCard--hold .rowCard__statusDot { background: var(--warning); }
  .rowCard--hold2 .rowCard__statusDot { background: var(--danger); }
  .rowCard__field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .rowCard__label { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--on-surface-variant); }
  .rowCard__value {
    font-size: 13.5px; font-weight: 600; color: var(--on-surface);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .rowCard__model { font-size: 15px; font-weight: 700; letter-spacing: -.005em; }
  .rowCard__commission { font-size: 11px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; margin-top: 1px; }
  .rowCard__status { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .rowCard__cancelLink {
    border: none; background: none; color: var(--danger); font-size: 11px; font-weight: 700;
    cursor: pointer; padding: 0; text-align: left;
  }
  .rowCard__cancelLink:hover { text-decoration: underline; }
  /* justify-self: stretch + flex-start にすることで、ボタンが1つ（2nd Hold登録済み）
     でも2つ（Hold+受注 等）でも、先頭ボタンの開始位置は常にこの列の左端で揃う。
     justify-self: end だとボタン数で箱の幅が変わり、右端は揃っても開始位置が
     行ごとにずれてしまう。 */
  .rowCard__actions { display: flex; gap: 8px; justify-self: stretch; justify-content: flex-start; }

  /* 受注リストの表示形式「表」: 在庫と項目構成が異なる（比較ピン・操作ボタンが無く、
     顧客・担当者・リード番号などを表示する）ため、専用の列構成にする。 */
  .rowCard.rowCard--order {
    grid-template-columns: 1.5fr 1fr 90px 110px 80px 150px 130px;
    border-left-color: var(--primary);
  }
  .btn--small { padding: 6px 12px; font-size: 12.5px; }

  /* ===== カードグリッド（PCビューで3列固定。Google Material×Teslaの余白多め・
     高コントラストな見出しでの「カードタイプUI」） ===== */
  .cardGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    /* align-items: stretch（デフォルト）だと、1台だけ「車両スペックを見る」等の
       詳細を開いて縦に伸びたときに、同じグリッド行の他のカードまで背が
       伸びてしまう（グリッド行の高さは行内で最も高いカードに揃うため）。
       start にすることで、各カードは自分自身の内容量ぶんの高さのみを取り、
       他のカードのサイズには影響しないようにする。 */
    align-items: start;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid transparent;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  /* rowCard:hover と同じ理由で、border-left-color（在庫状況の色）はホバー時も維持する。 */
  .card:hover { box-shadow: var(--shadow-elevated); transform: translateY(-3px); border-top-color: transparent; border-right-color: transparent; border-bottom-color: transparent; }
  .card--available { border-left-color: var(--success); }
  .card--hold { border-left-color: var(--warning); }
  /* 1st・2nd Holdの両方が埋まっている車両は、これ以上の受け皿がない分、他より
     目立たせる（現場の声を踏まえ、Hold1件のみとは別の色にする）。 */
  .card--hold2 { border-left-color: var(--danger); }
  /* バッジが多い場合はタイトルを縮めず、バッジ側を折り返して2行目に逃がす
     （margin-left:autoで、同じ行でも折り返し後の行でも常に右寄せになる）。 */
  .card__top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 10px; }
  .card__model { font-size: 21px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
  .card__commission {
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: .03em;
    color: var(--on-surface-variant);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .01em;
    padding: 5px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge__dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .badge--available { background: var(--success-bg); color: var(--success); }
  .badge--hold { background: var(--warning-bg); color: var(--warning); }
  .badge--hold2 { background: var(--danger-bg); color: var(--danger); }
  .badge--disclosed { background: var(--success-bg); color: var(--success); font-weight: 500; }
  .badge--undisclosed { background: rgba(255, 255, 255, .08); color: var(--on-surface-variant); font-weight: 500; }
  .badge--thisMonth { background: var(--primary-bg); color: var(--primary-text); font-weight: 500; }
  .badge--location { background: var(--primary-bg); color: var(--primary-text); font-weight: 500; }
  .card__badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }

  /* 車両スペックは折りたたみ式にし、一次情報（モデル・コミッション・ステータス）だけで
     対象車両を判断できるようにする（Hold情報の card__holdInfo__details と同じパターン）。 */
  .card__specDetails {
    margin: 0;
    padding-top: 12px;
    border-top: 1px solid var(--outline);
  }
  .card__specDetails summary {
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary-text);
    list-style: none;
  }
  .card__specDetails summary::-webkit-details-marker { display: none; }
  .card__specDetails summary::before { content: '▸ '; }
  .card__specDetails[open] summary::before { content: '▾ '; }

  /* メタ情報は2列のミニグリッドで表示。ラベルは小さく大文字寄り・トラッキング広め、
     値は大きく太くというメリハリのある「テスラ風」の見出し表現で視認性を高める。 */
  .card__metaGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 16px;
    margin: 0;
    padding: 12px 0 0;
  }
  /* MP・カラーは折りたたまず常に表示するため、card__topのすぐ下に独自の区切り線を持つ */
  .card__metaGrid--quick { border-top: 1px solid var(--outline); padding-top: 14px; }
  .card__metaGrid dt {
    color: var(--on-surface-variant);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .card__metaGrid dd { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--on-surface); line-height: 1.3; }

  /* Hold状況エリアは高さ固定・内部スクロール。Hold/2nd Holdが増えてもここで吸収し、
     カード自体の高さは在庫あり／Hold／2nd Holdのどの状態でも常に一定に保たれる。 */
  .card__holdArea {
    height: 124px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  .card__holdArea--empty {
    align-items: center;
    justify-content: center;
  }
  .card__holdArea__placeholder {
    font-size: 12.5px;
    color: var(--on-surface-variant);
    opacity: .7;
  }
  .card__holdInfo {
    flex: none;
    background: var(--background);
    border-radius: 10px;
    border-left: 3px solid var(--outline);
    padding: 10px 12px;
    font-size: 13.5px;
    color: var(--on-surface-variant);
    line-height: 1.6;
  }
  .card__holdInfo b { color: var(--on-surface); }
  .card__holdInfo__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .card__holdInfo__label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  .card__holdInfo--first { border-left-color: var(--warning); }
  .card__holdInfo--first .card__holdInfo__label { color: var(--warning); }
  .card__holdInfo--second { border-left-color: var(--primary); background: var(--primary-bg); }
  .card__holdInfo--second .card__holdInfo__label { color: var(--primary-text); }
  .card__holdInfo__row { margin-bottom: 6px; }
  .card__holdInfo__cancel {
    border: none;
    background: none;
    color: var(--danger);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    flex: none;
  }
  .card__holdInfo__cancel:hover { background: var(--danger-bg); }

  /* 詳細（リード番号・登録月・下取車等）は折りたたみ、カードの縦幅を一定に保つ */
  .card__holdInfo__details { margin-top: 4px; }
  .card__holdInfo__details summary {
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--primary-text);
    list-style: none;
  }
  .card__holdInfo__details summary::-webkit-details-marker { display: none; }
  .card__holdInfo__details summary::before { content: '▸ '; }
  .card__holdInfo__details[open] summary::before { content: '▾ '; }
  .card__holdInfo__detailsBody {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--outline);
  }

  /* ===== Hold 72時間タイマー ===== */
  .holdTimer__bar {
    height: 5px;
    border-radius: 999px;
    background: var(--outline);
    overflow: hidden;
  }
  .holdTimer__barFill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: var(--primary);
    transition: width 1s linear;
  }
  .holdTimer--warning .holdTimer__barFill { background: var(--warning); }
  .holdTimer--expired .holdTimer__barFill { background: var(--danger); width: 0% !important; }
  .holdTimer__text {
    margin-top: 4px;
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--on-surface-variant);
  }
  .holdTimer--warning .holdTimer__text { color: var(--warning); }
  .holdTimer--expired .holdTimer__text { color: var(--danger); }

  .card__actions { display: flex; gap: 10px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
  .card__actions .btn { flex: 1; min-height: 44px; }

  .emptyState {
    text-align: center;
    color: var(--on-surface-variant);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* ===== 受注リスト（在庫リストと揃えたカードタイプUI。PCビューで1列2枚） ===== */
  .orderList {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    /* .cardGridと同じ理由。1台だけ折りたたみ（orderCard__details）を開いて
       縦に伸びても、他の受注カードのサイズには影響しないようにする。 */
    align-items: start;
  }
  .orderCard {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid var(--primary);
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  /* card:hover と同じ理由で、border-left-color（アクセントカラー）はホバー時も維持する。 */
  .orderCard:hover { box-shadow: var(--shadow-elevated); transform: translateY(-3px); border-top-color: transparent; border-right-color: transparent; border-bottom-color: transparent; }
  .orderCard__top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 10px; }
  .orderCard__top .card__badges { margin-left: auto; }
  .orderCard__top .card__badges .badge { margin-left: 0; }
  .orderCard__model { font-size: 21px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
  .orderCard__staff { font-size: 13.5px; font-weight: 600; color: var(--on-surface-variant); margin-top: 3px; }
  /* 車種は「誰が・何を買ったか」をひと目で確認できるよう、常に表示する
     （契約条件の詳細は下の折りたたみへ）。 */
  .orderCard__vehicle {
    font-size: 14px;
    font-weight: 600;
    color: var(--on-surface);
    margin-top: 4px;
  }
  /* 契約条件（コミッション・MP・VPC・有償OP・登録月・下取車・OSS・保険・支払方法・
     受注確定日時・リード番号）は折りたたみ、顧客名・担当者・車種だけで
     対象案件を判断できるようにする（車両スペックの折りたたみと同じパターン）。 */
  .orderCard__details {
    margin: 0;
    padding-top: 12px;
    border-top: 1px solid var(--outline);
  }
  .orderCard__details summary {
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary-text);
    list-style: none;
  }
  .orderCard__details summary::-webkit-details-marker { display: none; }
  .orderCard__details summary::before { content: '▸ '; }
  .orderCard__details[open] summary::before { content: '▾ '; }
  .orderCard__grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 16px;
    margin: 0;
    padding: 12px 0 0;
  }
  .orderCard__grid dt {
    color: var(--on-surface-variant);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .orderCard__grid dd { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--on-surface); line-height: 1.3; }

  /* ===== 設定画面 =====
     項目ごとに独立したカード（島）に分け、Google/Teslaのカードデザインに寄せる
     （角丸・影・余白多め。1つの大きなカードに全項目を詰め込まない）。
     2列の段組み（masonry）レイアウトも試したが、カードの高さがまちまちだと
     列の合計高さがずれてしまい、次のカードとの間隔だけ広がって不揃いに見える
     問題が残るため、確実に隙間が一定になる1列の縦積みに統一している
     （Google/Teslaの設定画面も同様に1列でカードを並べるスタイル）。 */
  .settingsWrap {
    max-width: 760px;
    margin: 0 auto;
  }
  .settingsGrid {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  /* テーマ・システムマスタ等、設定タブ内の大分類見出し。カードの外側、
     グループの先頭に置く（カード自体の見出し＝settingsSection__titleとは別）。 */
  .settingsGroupTitle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--on-surface-variant);
    margin: 8px 2px -6px;
  }
  .settingsGroupTitle--admin { color: var(--on-surface); }
  .settingsGroupTitle__badge {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: none;
    background: var(--warning-bg);
    color: var(--warning);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .settingsCard {
    background: var(--surface);
    border-radius: 10px;
    box-shadow: var(--shadow);
    border: 1px solid var(--outline);
    padding: 26px 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .settingsSection__title {
    font-size: 15.5px;
    font-weight: 700;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--on-surface);
  }
  .settingsSection__title .icon { color: var(--primary-text); }
  .settingsSection__desc {
    font-size: 12.5px;
    color: var(--on-surface-variant);
    margin: 0 0 14px;
    line-height: 1.6;
  }
  .settingsCard .formField + .formField { margin-top: 14px; }
  .settingsActions {
    background: var(--surface);
    border-radius: 10px;
    box-shadow: var(--shadow);
    border: 1px solid var(--outline);
    padding: 20px 28px;
  }
  .formField { display: flex; flex-direction: column; gap: 6px; }
  .formField label { font-size: 13px; font-weight: 500; color: var(--on-surface-variant); }
  .formField .input { width: 100%; }
  .formField__hint { margin: 0; font-size: 12px; color: var(--on-surface-variant); }
  .formField.hidden { display: none; }

  /* ===== テーマ（着せ替え）プリセット選択 =====
     以前はカラーピッカーで自由に配色を指定できたが、組み合わせによって
     コントラスト比が不足する懸念があったため、視覚的に確認済みの8色から
     選ぶスウォッチ形式に変更した（洋服・スマホケースの色を選ぶイメージ）。 */
  .themePresetGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .themePreset {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 8px;
    background: var(--background);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--on-surface-variant);
    font-size: 12px;
  }
  .themePreset:hover { border-color: var(--swatch); }
  .themePreset.is-selected { border-color: var(--swatch); background: rgba(255, 255, 255, .04); color: var(--on-surface); }
  .themePreset__swatch {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--swatch);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15);
  }
  .themePreset.is-selected .themePreset__swatch {
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15), 0 0 0 3px var(--surface), 0 0 0 5px var(--swatch);
  }
  .themePreset__name { text-align: center; line-height: 1.3; }
  @media (max-width: 480px) {
    .themePresetGrid { grid-template-columns: repeat(3, 1fr); }
  }

  /* ===== ロゴ設定 ===== */
  .logoField { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logoPreview {
    width: 72px; height: 72px; flex: none;
    border: 1px solid var(--outline); border-radius: 8px;
    background: var(--background);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .logoPreview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .logoPreview__placeholder { font-size: 11px; color: var(--on-surface-variant); text-align: center; }
  .logoField__controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ===== 担当者マスタ ===== */
  .staffList { display: flex; flex-direction: column; gap: 6px; }
  .staffList__row { display: flex; gap: 8px; align-items: center; }
  .staffList__row .input[data-staff-field="name"] { flex: 0 0 22%; min-width: 80px; }
  .staffList__row .input[data-staff-field="email"] { flex: 1 1 40%; min-width: 0; }
  .staffList__row .input[data-staff-field="location"] { flex: 0 0 22%; min-width: 90px; }
  .staffList__empty { font-size: 13px; color: var(--on-surface-variant); }

  /* ===== モデル写真（ホーム画面） ===== */
  .modelPhotoList { display: flex; flex-direction: column; gap: 8px; }
  .modelPhotoList__row { display: flex; gap: 10px; align-items: center; }
  .modelPhotoList__preview {
    width: 44px; height: 44px; flex: none;
    border: 1px solid var(--outline); border-radius: 8px;
    background: var(--background);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .modelPhotoList__preview img { width: 100%; height: 100%; object-fit: cover; }
  .modelPhotoList__row .input[data-photo-field="model"] { flex: 0 0 26%; min-width: 90px; }
  .modelPhotoList__row .input[data-photo-field="photoUrl"] { flex: 1 1 auto; min-width: 0; }
  .modelPhotoList__empty { font-size: 13px; color: var(--on-surface-variant); }

  /* ===== ホーム画面 =====
     PC（901px以上）はモデル写真を大きく見せる4列グリッドにする。タブレット・
     スマホ幅（900px以下）では、パッと見て在庫状況がわかる情報密度を優先した
     横一列の「リスト」型のままにする（@media (max-width: 900px)で上書き。
     現場の声を踏まえて選んだ元のレイアウトのため、狭い画面では変更しない）。 */
  .homeList {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  .homeRow {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    color: var(--on-surface);
    cursor: pointer;
    text-align: left;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease, background-color .15s ease;
  }
  .homeRow:hover { box-shadow: var(--shadow-elevated); transform: translateY(-3px); border-color: transparent; }
  .homeRow.is-expanded { background: rgba(255, 255, 255, .04); border-color: var(--primary); }
  .homeRow__photo {
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 8px;
    overflow: hidden;
    background: var(--background);
  }
  .homeRow__photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .homeRow__meta { display: flex; align-items: center; gap: 8px; }
  .homeRow__model {
    flex: 1; min-width: 0; font-size: 16px; font-weight: 600; letter-spacing: -.005em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .badge--count { background: var(--primary-bg); color: var(--primary-text); font-weight: 600; flex: none; }
  .homeRow__chevron { flex: none; font-size: 13px; color: var(--on-surface-variant); }

  /* ===== ホームのグレードタブ（グレードが設定されたモデル行を展開すると現れる） =====
     PCの4列グリッドでは、展開したタイルの直下に全列ぶんの幅で表示する
     （grid-column: 1 / -1）。900px以下（リスト型）では、写真幅ぶんインデントし
     左に細い罫線を添えることで「ベースモデル行から派生したタブである」ことを
     視覚的に示す（車両スペック折りたたみ等と同じ、階層関係を罫線で示す考え方。
     @media (max-width: 900px)で上書き）。 */
  .homeGradeTabs {
    grid-column: 1 / -1;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
  }
  .homeGradeTabs__label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--on-surface-variant);
    margin: 0 0 10px;
