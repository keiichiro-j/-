<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #0b57bf;
    --on-primary: #ffffff;
    --surface: #ffffff;
    --background: #f1f3f4;
    --on-surface: #202124;
    --on-surface-variant: #5f6368;
    --outline: #dadce0;
    --success: #188038;
    --success-bg: #e6f4ea;
    --warning: #b06000;
    --warning-bg: #fef7e0;
    --danger: #d93025;
    --primary-bg: #e8f0fe;
    --shadow: 0 1px 2px rgba(32, 33, 36, .06);
    --shadow-elevated: 0 8px 24px rgba(32, 33, 36, .12);
    --radius: 14px;
    /* トップバーの実高さ。JS（syncFixedBars_）が実測して上書きする。初期値は
       JS実行前のレイアウトずれを防ぐための目安値。 */
    --topbar-h: 60px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Roboto', 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: var(--background);
    color: var(--on-surface);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  /* ===== ミニマルな線画アイコン（Google/Tesla調。絵文字アイコンの代わりに使う） ===== */
  .icon {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
    vertical-align: -5px;
  }
  .icon--inline { width: 14px; height: 14px; vertical-align: -2px; }

  /* ===== ヘッダー / タブ =====
     position: fixed で画面上部に完全固定する（position: stickyだとスクロール中に
     わずかに追従が遅れて見えることがあるため、実測値ベースで確実に固定する。
     JavaScript.html の syncFixedBars_ 参照）。 */
  #app { padding-top: var(--topbar-h); }
  .topbar {
    background: var(--primary);
    color: var(--on-primary);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: var(--shadow);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
  }
  .topbar__brand {
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
  }
  .topbar__logo { height: 30px; width: auto; max-width: 120px; object-fit: contain; }
  .topbar__brandText { font-size: 20px; font-weight: 500; white-space: nowrap; }
  .tabs {
    display: flex;
    gap: 4px;
    flex: 1;
    overflow-x: auto;
  }
  .tabs__item {
    background: transparent;
    border: none;
    color: var(--on-primary);
    opacity: .75;
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .tabs__item.is-active { opacity: 1; background: rgba(255, 255, 255, .18); }

  .topbar__user {
    flex: none;
    text-align: right;
    font-size: 12.5px;
    line-height: 1.5;
    white-space: nowrap;
  }
  .topbar__userName { display: block; font-weight: 500; }
  .topbar__userEmail { display: block; opacity: .8; font-size: 11.5px; }
  .topbar__userWarn { display: block; color: #fff; background: rgba(0, 0, 0, .18); padding: 4px 10px; border-radius: 999px; font-size: 11.5px; }

  main.view { max-width: 1680px; margin: 0 auto; padding: 16px; }
  .view { display: none; }
  .view.is-active { display: block; }

  /* ===== ツールバー（検索欄を含む） =====
     トップバーと同様に position: fixed で完全固定する。折り返しで高さが変わるため、
     すぐ下に高さ実測済みのスペーサー（.toolbarSpacer）を置いて、後続コンテンツが
     隠れないようにする（JavaScript.html の syncFixedBars_ 参照）。 */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    padding: 12px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    position: fixed;
    top: calc(var(--topbar-h) + 16px); /* ツールバーの下（次のカードまで）と同じ余白をヘッダーとの間にも確保する */
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 1648px; /* main.view の max-width(1680px) から左右padding(32px)を引いた値 */
    z-index: 25;
  }
  .toolbar__spacer { flex: 1; }

  /* ===== 受注リストの「すべて／デモカーのみ」タブ =====
     ツールバー内の先頭に幅いっぱいの行として置く（ツールバー自体は
     syncFixedBars_ で高さを実測済みのため、ここに含めるだけで
     固定表示・スペーサーの仕組みをそのまま利用できる）。 */
  .subTabs { display: flex; gap: 6px; flex-basis: 100%; }
  .subTabs__item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--outline);
    background: var(--surface);
    color: var(--on-surface-variant);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .subTabs__item.is-active {
    background: var(--primary-bg);
    border-color: var(--primary);
    color: var(--primary);
  }

  .input {
    border: 1px solid var(--outline);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    background: var(--surface);
    color: var(--on-surface);
  }
  .input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .input--search { min-width: 220px; flex: 1 1 220px; }
  .input:disabled { background: var(--background); color: var(--on-surface-variant); cursor: not-allowed; }

  .checkboxField { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--on-surface-variant); }

  .btn {
    border: 1px solid var(--outline);
    background: var(--surface);
    color: var(--on-surface);
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .btn:hover { background: #f8f9fa; }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn--primary:hover { background: var(--primary-dark); }
  .btn--text { border: none; background: none; color: var(--primary); padding: 8px 10px; }
  .btn--danger { color: var(--danger); border-color: var(--danger); }
  .btn--danger:hover { background: var(--danger); color: #fff; }
  .btn--block { width: 100%; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn--icon {
    border: none; background: transparent; font-size: 20px; line-height: 1;
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--on-surface-variant);
  }
  .btn--icon:hover { background: #f1f3f4; }

  /* ===== グループ見出し ===== */
  .group { margin-bottom: 28px; }
  .group__title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--on-surface-variant);
    margin: 0 0 14px 2px;
  }
  .group__count {
    margin-left: 8px;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--primary);
  }
  .toolbar__count { font-size: 13.5px; color: var(--on-surface-variant); font-weight: 600; white-space: nowrap; }

  /* ===== カードグリッド（PCビューで3列固定。Google Material×Teslaの余白多め・
     高コントラストな見出しでの「カードタイプUI」） ===== */
  .cardGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid transparent;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .card:hover { box-shadow: var(--shadow-elevated); transform: translateY(-3px); border-color: transparent; }
  .card--available { border-left-color: var(--success); }
  .card--hold { border-left-color: var(--warning); }
  /* バッジが多い場合はタイトルを縮めず、バッジ側を折り返して2行目に逃がす
     （margin-left:autoで、同じ行でも折り返し後の行でも常に右寄せになる）。 */
  .card__top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 10px; }
  .card__model { font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
  .card__commission {
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: .03em;
    color: var(--on-surface-variant);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .01em;
    padding: 5px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge__dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .badge--available { background: var(--success-bg); color: var(--success); }
  .badge--hold { background: var(--warning-bg); color: var(--warning); }
  .badge--disclosed { background: var(--success-bg); color: var(--success); font-weight: 500; }
  .badge--undisclosed { background: rgba(95, 99, 104, .12); color: var(--on-surface-variant); font-weight: 500; }
  .badge--thisMonth { background: var(--primary-bg); color: var(--primary); font-weight: 500; }
  .badge--location { background: var(--primary-bg); color: var(--primary); font-weight: 500; }
  .card__badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }

  /* メタ情報は2列のミニグリッドで表示。ラベルは小さく大文字寄り・トラッキング広め、
     値は大きく太くというメリハリのある「テスラ風」の見出し表現で視認性を高める。 */
  .card__metaGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 16px;
    margin: 0;
    padding: 14px 0;
    border-top: 1px solid var(--outline);
    border-bottom: 1px solid var(--outline);
  }
  .card__metaGrid dt {
    color: var(--on-surface-variant);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .card__metaGrid dd { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--on-surface); line-height: 1.3; }

  /* Hold状況エリアは高さ固定・内部スクロール。Hold/2nd Holdが増えてもここで吸収し、
     カード自体の高さは在庫あり／Hold／2nd Holdのどの状態でも常に一定に保たれる。 */
  .card__holdArea {
    height: 124px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  .card__holdArea--empty {
    align-items: center;
    justify-content: center;
  }
  .card__holdArea__placeholder {
    font-size: 12.5px;
    color: var(--on-surface-variant);
    opacity: .7;
  }
  .card__holdInfo {
    flex: none;
    background: var(--background);
    border-radius: 10px;
    border-left: 3px solid var(--outline);
    padding: 10px 12px;
    font-size: 13.5px;
    color: var(--on-surface-variant);
    line-height: 1.6;
  }
  .card__holdInfo b { color: var(--on-surface); }
  .card__holdInfo__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .card__holdInfo__label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  .card__holdInfo--first { border-left-color: var(--warning); }
  .card__holdInfo--first .card__holdInfo__label { color: var(--warning); }
  .card__holdInfo--second { border-left-color: var(--primary); background: #eef4fd; }
  .card__holdInfo--second .card__holdInfo__label { color: var(--primary); }
  .card__holdInfo__row { margin-bottom: 6px; }
  .card__holdInfo__cancel {
    border: none;
    background: none;
    color: var(--danger);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    flex: none;
  }
  .card__holdInfo__cancel:hover { background: rgba(217, 48, 37, .1); }

  /* 詳細（リード番号・登録月・下取車等）は折りたたみ、カードの縦幅を一定に保つ */
  .card__holdInfo__details { margin-top: 4px; }
  .card__holdInfo__details summary {
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--primary);
    list-style: none;
  }
  .card__holdInfo__details summary::-webkit-details-marker { display: none; }
  .card__holdInfo__details summary::before { content: '▸ '; }
  .card__holdInfo__details[open] summary::before { content: '▾ '; }
  .card__holdInfo__detailsBody {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--outline);
  }

  /* ===== Hold 72時間タイマー ===== */
  .holdTimer__bar {
    height: 5px;
    border-radius: 999px;
    background: var(--outline);
    overflow: hidden;
  }
  .holdTimer__barFill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: var(--primary);
    transition: width 1s linear;
  }
  .holdTimer--warning .holdTimer__barFill { background: var(--warning); }
  .holdTimer--expired .holdTimer__barFill { background: var(--danger); width: 0% !important; }
  .holdTimer__text {
    margin-top: 4px;
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--on-surface-variant);
  }
  .holdTimer--warning .holdTimer__text { color: var(--warning); }
  .holdTimer--expired .holdTimer__text { color: var(--danger); }

  .card__actions { display: flex; gap: 10px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
  .card__actions .btn { flex: 1; min-height: 44px; }

  .emptyState {
    text-align: center;
    color: var(--on-surface-variant);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* ===== 受注リスト（在庫リストと揃えたカードタイプUI。PCビューで1列2枚） ===== */
  .orderList {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  .orderCard {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid var(--primary);
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .orderCard:hover { box-shadow: var(--shadow-elevated); transform: translateY(-3px); border-color: transparent; }
  .orderCard__top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 10px; }
  .orderCard__top .card__badges { margin-left: auto; }
  .orderCard__top .card__badges .badge { margin-left: 0; }
  .badge--demo { background: var(--primary-bg); color: var(--primary); font-weight: 700; }
  .orderCard__model { font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
  .orderCard__staff { font-size: 13.5px; font-weight: 600; color: var(--on-surface-variant); margin-top: 3px; }
  .orderCard__commission {
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: .03em;
    color: var(--on-surface-variant);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .orderCard__grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 16px;
    margin: 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--outline);
  }
  .orderCard__grid dt {
    color: var(--on-surface-variant);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .orderCard__grid dd { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--on-surface); line-height: 1.3; }

  /* ===== 設定画面 =====
     項目ごとに独立したカード（島）に分け、Google/Teslaのカードデザインに寄せる
     （角丸・影・余白多め。1つの大きなカードに全項目を詰め込まない）。 */
  .settingsWrap {
    max-width: 1160px;
    margin: 0 auto;
  }
  .settingsGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    align-items: start;
  }
  .settingsCard {
    background: var(--surface);
    border-radius: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--outline);
    padding: 26px 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .settingsCard--wide { grid-column: 1 / -1; }
  .settingsSection__title {
    font-size: 15.5px;
    font-weight: 700;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--on-surface);
  }
  .settingsSection__title .icon { color: var(--primary); }
  .settingsSection__desc {
    font-size: 12.5px;
    color: var(--on-surface-variant);
    margin: 0 0 14px;
    line-height: 1.6;
  }
  .settingsCard .formField + .formField { margin-top: 14px; }
  .settingsActions {
    margin-top: 20px;
    background: var(--surface);
    border-radius: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--outline);
    padding: 20px 28px;
  }
  .formField { display: flex; flex-direction: column; gap: 6px; }
  .formField label { font-size: 13px; font-weight: 500; color: var(--on-surface-variant); }
  .formField .input { width: 100%; }
  .formField.hidden { display: none; }
  .colorField { display: flex; align-items: center; gap: 10px; }
  .colorField input[type=color] { width: 44px; height: 36px; border: 1px solid var(--outline); border-radius: 8px; padding: 2px; }
  .optionSlots { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; }
  .optionSlots .input { padding: 8px 6px; text-align: center; }

  /* ===== ロゴ設定 ===== */
  .logoField { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logoPreview {
    width: 72px; height: 72px; flex: none;
    border: 1px solid var(--outline); border-radius: 8px;
    background: var(--background);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .logoPreview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .logoPreview__placeholder { font-size: 11px; color: var(--on-surface-variant); text-align: center; }
  .logoField__controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ===== 在庫データ一括インポート ===== */
  .importTextarea { font-family: 'Courier New', monospace; font-size: 12.5px; resize: vertical; min-height: 160px; }
  .importResult { font-size: 13px; background: var(--background); border-radius: 8px; padding: 12px 14px; }
  .importResult__summary { font-weight: 500; margin-bottom: 6px; }
  .importResult__detailTitle { font-size: 12px; color: var(--on-surface-variant); margin: 8px 0 2px; }
  .importResult__list { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--on-surface-variant); max-height: 120px; overflow-y: auto; }

  /* ===== 担当者マスタ ===== */
  .staffList { display: flex; flex-direction: column; gap: 6px; }
  .staffList__row { display: flex; gap: 8px; align-items: center; }
  .staffList__row .input[data-staff-field="name"] { flex: 0 0 22%; min-width: 80px; }
  .staffList__row .input[data-staff-field="email"] { flex: 1 1 40%; min-width: 0; }
  .staffList__row .input[data-staff-field="location"] { flex: 0 0 22%; min-width: 90px; }
  .staffList__empty { font-size: 13px; color: var(--on-surface-variant); }

  /* ===== デモカー予約 ===== */
  .demoReserveField { display: flex; gap: 10px; }
  .demoReserveField select { flex: 1; min-width: 0; }
  .demoReservedList { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .demoReservedList__empty { font-size: 13px; color: var(--on-surface-variant); }
  .demoReservedList__row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid var(--outline);
    border-radius: 10px;
    background: var(--background);
  }
  .demoReservedList__info { flex: 1; min-width: 0; }
  .demoReservedList__model { font-weight: 700; font-size: 14.5px; }
  .demoReservedList__meta { font-size: 12px; color: var(--on-surface-variant); margin-top: 1px; }
  .demoReservedList__actions { display: flex; gap: 8px; flex: none; }
  .demoReservedList__actions .btn { padding: 8px 14px; font-size: 13px; }

  /* ===== リード番号入力（「L-」固定接頭辞＋数字。Google×Tesla風の見出し扱いにする） ===== */
  .leadNumberField {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--outline);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .leadNumberField:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg); }
  .leadNumberField__prefix {
    display: flex;
    align-items: center;
    padding: 0 14px;
    background: var(--primary-bg);
    color: var(--primary);
