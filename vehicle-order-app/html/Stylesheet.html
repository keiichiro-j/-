<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #0b57bf;
    --on-primary: #ffffff;
    --surface: #ffffff;
    --background: #f1f3f4;
    --on-surface: #202124;
    --on-surface-variant: #5f6368;
    --outline: #dadce0;
    --success: #188038;
    --success-bg: #e6f4ea;
    --warning: #b06000;
    --warning-bg: #fef7e0;
    --danger: #d93025;
    --primary-bg: #e8f0fe;
    --shadow: 0 1px 2px rgba(60, 64, 67, .3), 0 1px 3px 1px rgba(60, 64, 67, .15);
    --shadow-elevated: 0 2px 6px rgba(60, 64, 67, .3), 0 4px 12px 2px rgba(60, 64, 67, .15);
    --radius: 12px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Roboto', 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: var(--background);
    color: var(--on-surface);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  /* ===== ヘッダー / タブ ===== */
  .topbar {
    background: var(--primary);
    color: var(--on-primary);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .topbar__brand { font-size: 20px; font-weight: 500; white-space: nowrap; }
  .tabs {
    display: flex;
    gap: 4px;
    flex: 1;
    overflow-x: auto;
  }
  .tabs__item {
    background: transparent;
    border: none;
    color: var(--on-primary);
    opacity: .75;
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .tabs__item.is-active { opacity: 1; background: rgba(255, 255, 255, .18); }

  .topbar__user {
    flex: none;
    text-align: right;
    font-size: 12.5px;
    line-height: 1.5;
    white-space: nowrap;
  }
  .topbar__userName { display: block; font-weight: 500; }
  .topbar__userEmail { display: block; opacity: .8; font-size: 11.5px; }
  .topbar__userWarn { display: block; color: #fff; background: rgba(0, 0, 0, .18); padding: 4px 10px; border-radius: 999px; font-size: 11.5px; }

  main.view { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .view { display: none; }
  .view.is-active { display: block; }

  /* ===== ツールバー ===== */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    padding: 12px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .toolbar__spacer { flex: 1; }

  .input {
    border: 1px solid var(--outline);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    background: var(--surface);
    color: var(--on-surface);
  }
  .input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .input--search { min-width: 220px; flex: 1 1 220px; }
  .input:disabled { background: var(--background); color: var(--on-surface-variant); cursor: not-allowed; }

  .checkboxField { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--on-surface-variant); }

  .btn {
    border: 1px solid var(--outline);
    background: var(--surface);
    color: var(--on-surface);
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn:hover { background: #f8f9fa; }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn--primary:hover { background: var(--primary-dark); }
  .btn--text { border: none; background: none; color: var(--primary); padding: 8px 10px; }
  .btn--danger { color: var(--danger); border-color: var(--danger); }
  .btn--danger:hover { background: var(--danger); color: #fff; }
  .btn--block { width: 100%; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn--icon {
    border: none; background: transparent; font-size: 20px; line-height: 1;
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--on-surface-variant);
  }
  .btn--icon:hover { background: #f1f3f4; }

  /* ===== グループ見出し ===== */
  .group { margin-bottom: 24px; }
  .group__title {
    font-size: 15px;
    font-weight: 500;
    color: var(--on-surface-variant);
    margin: 0 0 10px 4px;
  }
  .group__count {
    margin-left: 8px;
    font-weight: 400;
    font-size: 12.5px;
    color: var(--on-surface-variant);
  }
  .toolbar__count { font-size: 13px; color: var(--on-surface-variant); font-weight: 500; white-space: nowrap; }

  /* ===== カードグリッド（PCビューで3列固定、横長でスタイリッシュに） ===== */
  .cardGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid transparent;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .card:hover { box-shadow: var(--shadow-elevated); transform: translateY(-2px); }
  .card--available { border-left-color: var(--success); }
  .card--hold { border-left-color: var(--warning); }
  .card__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card__model { font-size: 17px; font-weight: 500; }
  .card__commission { font-size: 12px; color: var(--on-surface-variant); }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge__dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .badge--available { background: var(--success-bg); color: var(--success); }
  .badge--hold { background: var(--warning-bg); color: var(--warning); }
  .badge--disclosed { background: var(--success-bg); color: var(--success); font-weight: 500; }
  .badge--undisclosed { background: rgba(95, 99, 104, .12); color: var(--on-surface-variant); font-weight: 500; }
  .badge--thisMonth { background: var(--primary-bg); color: var(--primary); font-weight: 500; }
  .badge--location { background: var(--primary-bg); color: var(--primary); font-weight: 500; }
  .card__badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  /* メタ情報は2列のミニグリッドで表示（横長カードの幅を活かし、縦幅を抑える） */
  .card__metaGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px 12px;
    margin: 0;
    font-size: 12.5px;
  }
  .card__metaGrid dt { color: var(--on-surface-variant); font-size: 11px; margin-bottom: 1px; }
  .card__metaGrid dd { margin: 0; font-weight: 500; color: var(--on-surface); }

  .card__holdInfo {
    background: var(--background);
    border-radius: 8px;
    border-left: 3px solid var(--outline);
    padding: 8px 10px;
    font-size: 12.5px;
    color: var(--on-surface-variant);
    line-height: 1.6;
  }
  .card__holdInfo b { color: var(--on-surface); }
  .card__holdInfo__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .card__holdInfo__label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  .card__holdInfo--first { border-left-color: var(--warning); }
  .card__holdInfo--first .card__holdInfo__label { color: var(--warning); }
  .card__holdInfo--second { border-left-color: var(--primary); background: #eef4fd; }
  .card__holdInfo--second .card__holdInfo__label { color: var(--primary); }
  .card__holdInfo__row { margin-bottom: 6px; }
  .card__holdInfo__cancel {
    border: none;
    background: none;
    color: var(--danger);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    flex: none;
  }
  .card__holdInfo__cancel:hover { background: rgba(217, 48, 37, .1); }

  /* 詳細（リード番号・登録月・下取車等）は折りたたみ、カードの縦幅を一定に保つ */
  .card__holdInfo__details { margin-top: 4px; }
  .card__holdInfo__details summary {
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--primary);
    list-style: none;
  }
  .card__holdInfo__details summary::-webkit-details-marker { display: none; }
  .card__holdInfo__details summary::before { content: '▸ '; }
  .card__holdInfo__details[open] summary::before { content: '▾ '; }
  .card__holdInfo__detailsBody {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--outline);
  }

  /* ===== Hold 72時間タイマー ===== */
  .holdTimer__bar {
    height: 5px;
    border-radius: 999px;
    background: var(--outline);
    overflow: hidden;
  }
  .holdTimer__barFill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: var(--primary);
    transition: width 1s linear;
  }
  .holdTimer--warning .holdTimer__barFill { background: var(--warning); }
  .holdTimer--expired .holdTimer__barFill { background: var(--danger); width: 0% !important; }
  .holdTimer__text {
    margin-top: 4px;
    font-size: 12px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--on-surface-variant);
  }
  .holdTimer--warning .holdTimer__text { color: var(--warning); }
  .holdTimer--expired .holdTimer__text { color: var(--danger); }

  .card__actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
  .card__actions .btn { flex: 1; }

  .emptyState {
    text-align: center;
    color: var(--on-surface-variant);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* ===== 受注リスト ===== */
  .orderCard {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid var(--primary);
    padding: 16px;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .orderCard:hover { box-shadow: var(--shadow-elevated); transform: translateY(-2px); }
  .orderList { display: flex; flex-direction: column; gap: 10px; }
  .orderCard__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .orderCard__model { font-size: 16px; font-weight: 500; }
  .orderCard__commission { font-size: 12px; color: var(--on-surface-variant); }
  .orderCard__grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px 16px;
    font-size: 13.5px;
    padding-top: 10px;
    border-top: 1px solid var(--outline);
  }
  .orderCard__grid dt { color: var(--on-surface-variant); font-size: 12px; margin-bottom: 2px; }
  .orderCard__grid dd { margin: 0; font-weight: 500; }

  /* ===== 設定画面 ===== */
  .settingsWrap {
    max-width: 680px;
    margin: 0 auto;
  }
  .settingsCard {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .settingsSection { padding: 18px 0; }
  .settingsSection + .settingsSection { border-top: 1px solid var(--outline); }
  .settingsSection:first-child { padding-top: 4px; }
  .settingsSection:last-child { padding-bottom: 4px; }
  .settingsSection__title {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settingsSection__desc {
    font-size: 12.5px;
    color: var(--on-surface-variant);
    margin: 0 0 14px;
    line-height: 1.6;
  }
  .settingsSection .formField + .formField { margin-top: 14px; }
  .formField { display: flex; flex-direction: column; gap: 6px; }
  .formField label { font-size: 13px; font-weight: 500; color: var(--on-surface-variant); }
  .formField .input { width: 100%; }
  .formField.hidden { display: none; }
  .colorField { display: flex; align-items: center; gap: 10px; }
  .colorField input[type=color] { width: 44px; height: 36px; border: 1px solid var(--outline); border-radius: 8px; padding: 2px; }
  .optionSlots { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; }
  .optionSlots .input { padding: 8px 6px; text-align: center; }

  /* ===== 担当者マスタ ===== */
  .staffList { display: flex; flex-direction: column; gap: 6px; }
  .staffList__row { display: flex; gap: 8px; align-items: center; }
  .staffList__row .input[data-staff-field="name"] { flex: 0 0 34%; min-width: 90px; }
  .staffList__row .input[data-staff-field="email"] { flex: 1; min-width: 0; }
  .staffList__empty { font-size: 13px; color: var(--on-surface-variant); }

  /* ===== 担当者表示（ログイン中のアカウントから自動判定・読み取り専用） ===== */
  .staffDisplay {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--background);
    font-size: 14px;
  }
  .staffDisplay__email { font-size: 12px; color: var(--on-surface-variant); }
  .staffDisplay__warn { font-size: 13px; color: var(--danger); }

  /* ===== モーダル ===== */
  .modal {
    position: fixed; inset: 0; background: rgba(32, 33, 36, .5);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal__panel {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-elevated);
    width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
  }
  .modal__header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--outline); }
  .modal__header h2 { font-size: 17px; font-weight: 500; margin: 0; }
  .modal__body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal__footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--outline); }
  .modal__error { color: var(--danger); font-size: 13px; }
  .modal__desc { margin: 0; font-size: 13px; color: var(--on-surface-variant); line-height: 1.6; }

  /* ===== トースト ===== */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #323232; color: #fff; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; box-shadow: var(--shadow-elevated); z-index: 200;
  }
  .toast--error { background: var(--danger); }

  /* ===== タブレット ===== */
  @media (max-width: 900px) {
    main.view { padding: 14px; }
    .cardGrid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .settingsWrap { max-width: 100%; }
    .orderCard__grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  }

  /* ===== スマートフォン ===== */
  @media (max-width: 600px) {
    .topbar { padding: 10px 12px; gap: 10px; }
    .topbar__brand { font-size: 16px; }
    .topbar__user { display: none; }
    .staffList__row { flex-wrap: wrap; }
    .staffList__row .input[data-staff-field="name"],
    .staffList__row .input[data-staff-field="email"] { flex: 1 1 100%; }
    main.view { padding: 10px; }
    .toolbar { padding: 10px; }
    .toolbar .input, .toolbar .checkboxField { flex: 1 1 auto; }
    .cardGrid { grid-template-columns: 1fr; gap: 10px; }
    .settingsCard { padding: 18px 16px; }
    .card { padding: 14px; }
    .card__actions .btn { min-height: 42px; }
    .modal { padding: 0; align-items: flex-end; }
    .modal__panel { max-width: 100%; width: 100%; max-height: 92vh; border-radius: var(--radius) var(--radius) 0 0; }
    .modal__footer .btn { flex: 1; min-height: 44px; }
    .orderCard { padding: 14px; }
    .orderCard__grid { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .holdTimer__barFill { transition: none; }
  }
</style>
