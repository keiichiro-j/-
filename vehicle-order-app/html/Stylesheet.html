<style>
  /* ===== カラーパレット：コーポレートネイビー =====
     指定されたカラーパレット（メインネイビー#102A43／ダークネイビー#0B1F33／
     ネイビーサブ#243B53／ブランドブルー#2F6FAE／ライトブルー#DCEAF7／ページ背景
     #F4F7FA／カード#FFFFFF／ボーダー#D8E1E8／メイン文字#1F2933／サブ文字#6B7785）
     に基づく配色（旧「ウォームアイボリー」から変更）。--primary / --on-surface は
     テーマ設定（設定タブ）でユーザーが上書きできるため、実際の値はJS
     （applyTheme、JavaScript.html参照）が document.documentElement.style.setProperty
     で書き換える。ここでの値は未設定時の初期表示・THEME_PRESETSのDEFAULT_THEME_KEY
     （Constants.gs、'steel'プリセットをこのパレットのブランドブルーに合わせている）
     と揃えてある。
     --success / --warning / --danger、8種のテーマプリセットの primaryText
     （Constants.gs）は、白背景に対してWCAG AA（コントラスト比4.5:1以上）を
     確保できる明度まで暗く調整し直している（旧配色は暗い背景向けに明るく
     調整されていたため、そのままでは白背景で読みにくくなるため）。各色の
     背景ウォッシュ（--success-bg 等）は元の明るい色調のまま、文字色
     （--success 等）だけを暗くすることで、淡い背景色＋読みやすい濃い文字の
     組み合わせにしている。 */
  :root {
    /* --primary はボタン塗り・境界線・アクセント用（白文字とのコントラスト比
       ≒5.2:1を確保できる明度に調整済み）。リンクやアイコンなど、背景の上に
       「文字として」使う場合は --primary-text（白背景とのコントラスト比≒5.2:1）
       を使うこと（purpose別に分けている理由はJavaScript.htmlのapplyTheme参照）。
       --primary-dark（ホバー時等）はメインネイビー#102A43をそのまま使う。 */
    --primary: #2f6fae;
    --primary-dark: #102a43;
    --primary-text: #2f6fae;
    --on-primary: #ffffff;
    --surface: #ffffff;
    --background: #f4f7fa;
    --on-surface: #1f2933;
    --on-surface-variant: #6b7785;
    --outline: #d8e1e8;
    --success: #188649;
    --success-bg: rgba(61, 220, 132, .16);
    --warning: #a5670b;
    --warning-bg: rgba(242, 169, 60, .16);
    --danger: #ec0000;
    --danger-bg: rgba(255, 107, 107, .16);
    --primary-bg: #dceaf7;
    /* ホーム画面のカード（.homeRow、PCビューのみ）専用の背景色。ページ背景
       （--background）ともカード内の写真プレースホルダー（同じく--backgroundを
       使う）とも見分けがつくよう、薄くテーマカラーを帯びた色にする（JavaScript.html
       のapplyThemeが、選択中のテーマのprimaryから毎回computeし直す。初期表示・
       JS実行前の目安値としてDEFAULT_THEME_KEY「steel」のprimary #2f6faeを
       6%の濃さで混ぜた値をここに置いている）。 */
    --card-bg: rgba(47, 111, 174, .06);
    /* 管理者権限を持つ担当者のみ登録できるデモカーHOLD・他店HOLD専用の特別色。
       通常のHold（--warning・アンバー）・2nd Hold（--danger・レッド／--primary・ブルー）
       のどれとも重ならない紫系にし、テーマ設定（着せ替え）の影響を受けない固定色にする
       （デモカーHOLD・他店HOLDである、という見分けやすさを最優先するため）。 */
    --hold-special: #6d28d9;
    --hold-special-bg: rgba(124, 58, 237, .14);
    --shadow: 0 1px 2px rgba(16, 31, 51, .10);
    --shadow-elevated: 0 16px 40px rgba(16, 31, 51, .16);
    /* 公式サイトはカードの角丸をあまり強調しないフラットな見た目のため、
       従来の14pxより控えめな角丸にして「エンジニアリングされた精密さ」を出す。 */
    --radius: 8px;
    /* トップバー・比較バー・トーストは、テーマ設定のテーマカラー／文字色や
       ベース背景色（--background/--surface）に関わらず、常にネイビー基調で
       統一する（ブランドカラーやページのベース色を載せる帯ではなく、アプリの
       「額縁」として固定のネイビーにすることで、どのテーマカラー・ベース配色を
       選んでも重厚なネイビー基調の外観が崩れない）。ダークネイビー（最も暗い＝
       ヘッダー）／メインネイビー（比較バー）／ネイビーサブ（トースト）の順で
       少しずつ明るくし、旧配色（黒／#1a1a1d／#2a2a2e）と同じ奥行きの付け方を
       踏襲している。このネイビー基調のUI自体の文字色・枠線色は、ベース配色が
       白系になっても白文字のまま保てるよう、--on-surface / --outline とは別に
       --on-topbar / --dark-ui-outline を用意している。 */
    --topbar-bg: #0b1f33;
    --on-topbar: #ffffff;
    --dark-ui-outline: rgba(255, 255, 255, .14);
    /* トップバーの実高さ。JS（syncFixedBars_）が実測して上書きする。初期値は
       JS実行前のレイアウトずれを防ぐための目安値。 */
    --topbar-h: 108px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Barlow', 'Roboto', 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: var(--background);
    color: var(--on-surface);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }
  /* モーダル表示中は背景（在庫リスト・受注リスト等）がスクロールされないようにする
   （openModal/closeModal、JavaScript.html参照）。 */
  body.modal-open { overflow: hidden; }

  /* ===== ミニマルな線画アイコン（Google/Tesla調。絵文字アイコンの代わりに使う） ===== */
  .icon {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
    vertical-align: -5px;
  }
  .icon--inline { width: 14px; height: 14px; vertical-align: -2px; }

  /* ===== ヘッダー / タブ =====
     position: fixed で画面上部に完全固定する（position: stickyだとスクロール中に
     わずかに追従が遅れて見えることがあるため、実測値ベースで確実に固定する。
     JavaScript.html の syncFixedBars_ 参照）。 */
  #app { padding-top: var(--topbar-h); }
  .topbar {
    background: var(--topbar-bg);
    color: var(--on-topbar);
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--dark-ui-outline);
    box-shadow: var(--shadow);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
  }

  /* ===== 起動時ローディング画面 =====
     初回データ取得（reloadAll_）が終わるまでの空白時間を埋める全画面オーバーレイ。
     トップバーと同じダークネイビーで統一し、is-hiddenでフェードアウトしてから
     pointer-events: noneにする（フェード中もクリックを奪わないよう、
     visibility: hiddenではなくopacityのみで消す）。 */
  .appLoading {
    position: fixed;
    inset: 0;
    z-index: 400;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--topbar-bg);
    color: #eaf1f8;
    transition: opacity .3s ease;
  }
  .appLoading.is-hidden { opacity: 0; pointer-events: none; }
  .appLoading__spinner {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .16);
    border-top-color: var(--primary);
    animation: navRefreshSpin .8s linear infinite;
  }
  .appLoading__text { margin: 0; font-size: 13px; letter-spacing: .04em; color: rgba(234, 241, 248, .7); }
  @media (prefers-reduced-motion: reduce) { .appLoading__spinner { animation: none; } }

  /* ===== ブランド表記の行 =====
     左側は「戻る」「更新」ボタン、右側はログイン中のユーザー情報。アプリ名
     「販売可能リスト」＋ロゴは、左右のブロックの幅に関わらず常に画面中央に
     来るよう、.topbar__brandRow を position: relative にし、.topbar__brand を
     position: absolute + left: 50% / transform: translate(-50%, -50%) で
     中央配置している（左右を1fr auto 1frのグリッドで揃える方式だと、左右の
     内容量が変わるたびに調整が必要になるため、中央配置専用の要素を絶対配置
     する方式に変更した）。 */
  .topbar__brandRow {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 28px;
  }
  .topbar__left { display: flex; align-items: center; gap: 10px; }
  .topbar__brand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  /* ロゴとテキストが干渉しないよう、テキストのサイズをロゴの高さに近い
     スケールに揃える（PCビュー・タブレット/スマホビューそれぞれの
     .topbar__logoの高さに合わせて、下のmin-width: 901pxブロック内でも
     調整している）。 */
  .topbar__brandText {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--on-topbar);
    white-space: nowrap;
  }
  .topbar__navBtn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; padding: 0; flex: none;
    background: transparent; border: 1px solid var(--dark-ui-outline); border-radius: 50%;
    color: var(--on-topbar); cursor: pointer;
  }
  .topbar__navBtn:hover { background: rgba(255, 255, 255, .08); }
  .topbar__navBtn:disabled { opacity: .3; cursor: default; }
  .topbar__navBtn:disabled:hover { background: transparent; }
  /* 「更新」ボタンは「戻る」ボタンと見た目を統一し（同じアウトライン円形）、
     読み込み中はアイコンを回転させることだけでフィードバックする。 */
  .topbar__navBtn--refresh.is-spinning .icon { animation: navRefreshSpin .8s linear infinite; }
  @keyframes navRefreshSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .topbar__logo { height: 28px; width: auto; max-width: 140px; object-fit: contain; }
  /* PCビュー（901px以上）のみ、ヘッダーを少し大きくする。タブレット・スマホ幅
     （@media max-width:900px / 600px）は従来どおりのコンパクトなサイズのまま
     据え置く。トップバーの実測高さはJS側のsyncFixedBars_が都度反映するため、
     ここでpaddingやボタンサイズを変えるだけで、下に続くツールバー等の
     固定要素の位置も自動的に追従する。 */
  @media (min-width: 901px) {
    .topbar__brandRow { padding: 22px 32px; }
    .topbar__navBtn { width: 44px; height: 44px; }
    .topbar__navBtn .icon { width: 22px; height: 22px; }
    .topbar__logo { height: 34px; max-width: 160px; }
    .topbar__brandText { font-size: 18px; }
    .topbar__user { font-size: 14px; }
    .topbar__userEmail { font-size: 12.5px; }
  }
  /* ===== ナビゲーション =====
     ブランド行の下に、独立した行として中央寄せで配置する。塗りつぶしの
     ピル型タブではなく、公式サイトのグローバルナビのような「テキスト＋
     アクティブ時の下線」のミニマルな水平ナビにする。 */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 0 28px 14px;
    overflow-x: auto;
  }
  .tabs__item {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--on-topbar);
    opacity: .6;
    padding: 6px 1px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .15s ease, border-color .15s ease;
  }
  .tabs__item:hover { opacity: .85; }
  .tabs__item.is-active { opacity: 1; border-bottom-color: var(--primary); }

  .topbar__user {
    flex: none;
    text-align: right;
    font-size: 12.5px;
    line-height: 1.5;
    white-space: nowrap;
  }
  .topbar__userName { display: block; font-weight: 500; }
  .topbar__userEmail { display: block; opacity: .8; font-size: 11.5px; }
  .topbar__userWarn { display: block; color: var(--warning); background: rgba(242, 169, 60, .16); padding: 4px 10px; border-radius: 999px; font-size: 11.5px; }

  /* ===== 在庫データ整合性チェックの警告バナー（アプリ起動時、問題があれば表示） =====
     トップバーの子要素として置くことで、表示・非表示による高さの変化を
     syncFixedBars_ の --topbar-h 実測にそのまま反映させる（ツールバーの
     固定位置がずれないようにするため）。 */
  .integrityBanner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--warning);
    color: #fff;
    padding: 9px 20px;
    font-size: 13.5px;
    font-weight: 500;
  }
  .integrityBanner__toggle, .integrityBanner__close {
    background: rgba(255, 255, 255, .18);
    border: none;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  .integrityBanner__toggle { padding: 4px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; flex: none; }
  .integrityBanner__toggle:hover { background: rgba(255, 255, 255, .3); }
  .integrityBanner__close { width: 26px; height: 26px; border-radius: 50%; font-size: 16px; line-height: 1; flex: none; }
  .integrityBanner__close:hover { background: rgba(255, 255, 255, .3); }
  .integrityBanner__list {
    list-style: none;
    margin: 0;
    padding: 10px 20px 12px;
    background: rgba(0, 0, 0, .1);
    color: #fff;
    font-size: 13px;
  }
  .integrityBanner__list li { padding: 3px 0; }

  main.view { max-width: 1680px; margin: 0 auto; padding: 16px; }
  .view { display: none; }
  /* タブ切替時、瞬間的にコンテンツが入れ替わるだけだと素っ気ないため、
     切替後の画面にごく軽いフェードイン（+わずかな上方向スライド）を付ける。
     display: noneからの復帰にtransitionは効かないため、animationを使う
     （animationは要素が描画された瞬間から再生されるため、display: none明けでも
     機能する）。 */
  .view.is-active { display: block; animation: viewFadeIn .22s ease; }
  @keyframes viewFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== ツールバー（検索欄を含む） =====
     トップバーと同様に position: fixed で完全固定する。折り返しで高さが変わるため、
     すぐ下に高さ実測済みのスペーサー（.toolbarSpacer）を置いて、後続コンテンツが
     隠れないようにする（JavaScript.html の syncFixedBars_ 参照）。 */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    padding: 12px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    position: fixed;
    top: calc(var(--topbar-h) + 16px); /* ツールバーの下（次のカードまで）と同じ余白をヘッダーとの間にも確保する */
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 1648px; /* main.view の max-width(1680px) から左右padding(32px)を引いた値 */
    z-index: 25;
  }
  .toolbar__spacer { flex: 1; }

  .input {
    border: 1px solid var(--outline);
    border-radius: 8px;
    padding: 9px 12px;
    /* 16px未満だとiOS Safari等がフォーカス時に自動でページ全体を拡大表示して
       しまう（入力欄だけでなく画面全体がズームされたように見える不具合の原因）。
       Hold登録・受注確定モーダルに限らず、すべての.input（検索欄・設定画面の
       各種入力欄を含む）が対象になるよう、基準値として16pxにしている。 */
    font-size: 16px;
    background: var(--surface);
    color: var(--on-surface);
  }
  .input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .input--search { min-width: 220px; flex: 1 1 220px; }
  .input:disabled { background: var(--background); color: var(--on-surface-variant); cursor: not-allowed; }

  .checkboxField { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--on-surface-variant); }

  /* 公式サイトのCTAボタンのような、フル角丸＋大文字＋広めのレタースペーシングの
     ピル型ボタンにする（塗り／アウトラインどちらも同じ形状で統一）。 */
  .btn {
    border: 1px solid var(--outline);
    background: var(--surface);
    color: var(--on-surface);
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  /* アウトラインボタンは、公式サイトのCTAによくある「ホバーで反転（塗りつぶし）」
     の挙動にする。 */
  .btn:hover { background: var(--on-surface); border-color: var(--on-surface); color: var(--background); }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn--primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: var(--on-primary); }
  /* ロゴ削除等の添え書きリンクは、CTAボタンと区別できるよう大文字化・反転させない */
  .btn--text { border: none; background: none; color: var(--primary-text); padding: 8px 10px; text-transform: none; letter-spacing: normal; }
  .btn--text:hover { background: none; color: var(--primary-text); text-decoration: underline; }
  .btn--danger { color: var(--danger); border-color: var(--danger); }
  .btn--danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn--block { width: 100%; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  /* タップ領域は44x44px（モバイルの推奨最小タップサイズ）を確保しつつ、
     見た目上のアイコン自体は従来通り20pxのまま据え置く。 */
  .btn--icon {
    border: none; background: transparent; font-size: 20px; line-height: 1;
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer; color: var(--on-surface-variant);
  }
  .btn--icon:hover { background: rgba(31, 41, 51, .06); }

  /* ===== フォーカスリング（キーボード操作時の視認性確保） =====
     マウス操作時には表示されず、キーボードでのTab移動時のみ表示される
     :focus-visible を使う。ブランドカラー（--primary-text）で統一する。 */
  .btn:focus-visible,
  .tabs__item:focus-visible,
  .viewToggle__item:focus-visible,
  .homeRow:focus-visible,
  .homeGradeTab:focus-visible,
  .themePreset:focus-visible {
    outline: 2px solid var(--primary-text);
    outline-offset: 2px;
  }

  /* ===== マイページ: ログイン中の担当者本人がHold中／受注した車両だけの一覧 =====
     カード自体は在庫リスト・受注リストと同じ.cardGrid／.orderListをそのまま
     再利用する（見た目・操作感を統一するため、専用のカードデザインは作らない）。 */
  .myPageSection { margin-bottom: 32px; }
  .myPageSection__title {
    font-size: 15px;
    font-weight: 700;
    color: var(--on-surface);
    margin: 0 0 14px 2px;
  }
  .myPageSection__title span { color: var(--primary-text); font-weight: 700; }

  /* ===== グループ見出し ===== */
  .group { margin-bottom: 28px; }
  .group__title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--on-surface-variant);
    margin: 0 0 14px 2px;
  }
  .group__count {
    margin-left: 8px;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--primary-text);
  }
  .toolbar__count { font-size: 13.5px; color: var(--on-surface-variant); font-weight: 600; white-space: nowrap; }

  /* ===== 表示形式切替（カード／表）・在庫リストのツールバーに置くセグメントコントロール ===== */
  .viewToggle { display: flex; gap: 4px; background: var(--background); border-radius: 999px; padding: 3px; flex: none; }
  .viewToggle__item {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--on-surface-variant);
    width: 34px;
    height: 30px;
    border-radius: 999px;
    cursor: pointer;
  }
  .viewToggle__item .icon--inline { margin: 0; }
  .viewToggle__item.is-active { background: var(--surface); color: var(--primary-text); box-shadow: var(--shadow); }

  /* ===== 車両比較（カード・表それぞれに置くピン、下部固定バー、比較モーダル） ===== */
  .card__comparePin {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    color: var(--on-surface-variant);
    cursor: pointer;
    margin-left: auto;
  }
  .card__top .card__comparePin { flex: none; }
  .tableComparePin { display: flex; }

  .compareBar {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    /* テーマ設定の文字色やベース背景色（--on-surface/--background/--surface）に
       関わらず、常にネイビー基調の浮遊バーにする（メインネイビー。枠線も
       --outlineではなく、ネイビー背景でも見える--dark-ui-outlineを使う）。 */
    background: #102a43;
    border: 1px solid var(--dark-ui-outline);
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    box-shadow: var(--shadow-elevated);
    z-index: 40;
    max-width: calc(100% - 32px);
  }
  .compareBar__label { font-size: 13px; font-weight: 700; flex: none; }
  .compareBar__chips { display: flex; gap: 6px; flex-wrap: wrap; overflow-x: auto; max-width: 46vw; }
  .compareBar__spacer { flex: 1; min-width: 8px; }
  .compareChip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, .16);
    padding: 4px 6px 4px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    white-space: nowrap;
  }
  .compareChip button {
    border: none;
    background: rgba(255, 255, 255, .2);
    color: #fff;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .compareBar .btn { padding: 7px 14px; font-size: 13px; flex: none; }
  .compareBar .btn:not(.btn--primary) { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .3); color: #fff; }
  .compareBar .btn:not(.btn--primary):hover { background: rgba(255, 255, 255, .2); }

  .modal__panel.modal__panel--compare { max-width: 900px; }
  .tableScroll { overflow-x: auto; }
  .compareTable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .compareTable th, .compareTable td { padding: 10px 14px; border-bottom: 1px solid var(--outline); text-align: left; white-space: nowrap; }
  .compareTable thead th { color: var(--on-surface-variant); font-size: 12px; font-weight: 700; }
  .compareTable thead th:first-child { background: var(--surface); }
  .compareTable tbody th { font-size: 12.5px; font-weight: 700; color: var(--on-surface-variant); background: var(--background); }
  .compareTable__sub { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .compareTable tr.is-diff td { background: var(--primary-bg); }

  /* ===== 在庫リストの表示形式「表」（多台数を一覧で見比べる商談向けビュー） =====
     素のtableではなく、カードグリッドと同じ「カードタイプUI」（角丸・影・ホバーで
     浮き上がる）を保ったまま、1台=横1行のカードとして並べる。列位置はCSS Gridで
     全行そろえ、表形式ならではの一覧性はそのまま保つ。 */
  /* width: fit-contentにしないと、.rowCardListがブロック要素として.tableScroll
     いっぱいに広がってしまい、列がすべて固定幅になった今は、行（.rowCard）の
     右端（操作ボタン等）とカード自身の枠の間に、画面幅に応じて不要な余白が
     空いてしまう（現場からの指摘「一行を通して均一の余白で」より）。
     fit-contentにすることで、カードは常に列の合計幅ぴったりの大きさになる。 */
  .rowCardList { display: flex; flex-direction: column; gap: 10px; width: fit-content; min-width: 1348px; }
  /* 受注リストの表「行カード」は在庫リストより列数・列幅が少ないため、共通の
     min-width（1348px、在庫リスト向け）をそのまま使うと、行（.rowCard--order）が
     不要に広くstretchされ、固定幅の列だけでは埋まらない分だけ余白が空いてしまう。
     受注リスト自身の列合計に合わせて上書きする（.rowCard.rowCard--order参照）。 */
  .rowCardList--order { min-width: 1716px; }
  .rowCard {
    display: grid;
    /* .rowCardは.rowCardList（display:flex; flex-direction:column;）の子要素で
       あり、既定では横幅（クロス軸）が親の幅にstretchされる。grid-template-columns
       の固定幅列＋gapの合計（1348px）が親の幅より広い場合、明示的にmin-widthを
       指定しないと、グリッドの列（特に最後の状態・操作ボタン列）がカード自身の
       枠（border/background）からはみ出して表示されてしまっていたため
       （現場からの指摘で判明）、列の合計幅と同じ値をmin-widthとして固定する。 */
    min-width: 1348px;
    /* 最後の操作列は auto ではなく固定幅にする。auto だとHold中（ボタン2つ）と
       在庫あり（ボタン2つだが文言が違う）・2nd Hold登録済み（ボタン1つ）で
       操作列の内容幅が行ごとに変わり、他の列がそのぶん伸縮して行同士の列位置が
       ずれてしまっていたため（現場からの指摘で判明）。固定幅にすることで
       在庫あり／Hold中のどちらの行でも同じ列位置に揃う。状態列も「Hold中（2nd有）」
       バッジが収まる幅（150px）を確保し、隣の操作列と重ならないようにする
       （以前は108pxで文字がはみ出し、受注確定ボタンと重なって見えていた）。
       モデル列は以前210px＋左右に1frの空白列（車両情報ブロックを中央寄りに
       見せるため）を置いていたが、モデル列の実際のコンテンツ（比較チェックボックス・
       モデル名・コミッション）は最大でも70px程度しか使っておらず、残りが左詰めの
       文字の右側に無駄な余白として見えてしまい、モデル→MPの間だけ他の列間より
       大きく間延びして見えていた（現場からの指摘で判明）。モデル列を実際の
       コンテンツ幅に合わせて100pxまで縮め、左右の空白列も廃止し、他の列と同じ
       gap（16px）だけで隣り合うようにして、行全体で余白が均一に見えるようにした。 */
    grid-template-columns: 100px 68px 46px 150px 170px 96px 84px 88px 150px 210px;
    /* center ではなく start にする。center だと「Hold中（2nd有）」で解除リンクが
       2本に増えて状態列が縦に伸びた分だけ、1本しか無い操作ボタン（受注確定）が
       行の中央へ引っ張られて下にずれ、状態バッジの高さと揃わなくなっていたため
       （現場からの指摘で判明）。start にして全列を行の上端に揃えることで、
       状態列の行数（解除リンクの本数）に関係なく、バッジ・操作ボタン・他の項目が
       常に同じ高さで揃う。 */
    align-items: start;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-left: 4px solid transparent;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 20px;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  /* border-color: transparent ではなく上・右・下のみ指定する。border-color（4辺一括）だと
     border-left-color（在庫状況を示す色つきの左罫線）まで打ち消してしまい、ホバー時に
     状態の色が消えて見えてしまうため（.rowCard--available 等はこのルールより先に書かれて
     いるが、:hover は詳細度が高く上書きしてしまう）。 */
  .rowCard:hover { box-shadow: var(--shadow-elevated); transform: translateY(-2px); border-top-color: transparent; border-right-color: transparent; border-bottom-color: transparent; }
  .rowCard--available { border-left-color: var(--success); }
  .rowCard--hold { border-left-color: var(--warning); }
  .rowCard--hold2 { border-left-color: var(--danger); }
  .rowCard--holdSpecial { border-left-color: var(--hold-special); }
  /* 横スクロールが必要な列（有償OP等の車両情報・rowCard__status）は画面幅によっては
     スクロールしないと見えないため、行（カード）自体をタップすると、既存のカード表示と
     同じ見た目で車両情報すべてを画面中央のモーダルに表示する
     （openInventoryDetailModal_、JavaScript.html参照）。チェックボックス・操作ボタン
     自体は個別にクリックできるよう、cursor はタップ可能であることを示すのみに留める。 */
  .rowCard { cursor: pointer; }
  /* 比較チェックボックスは、以前は左端の専用列（ピン列）に置いていたが、
     モデル名とコミッションの間に移動した（現場からの指摘で判明）。
     .card__comparePin（カード表示側）と同じ「チェックボックス＋『比較』文字」の
     見た目だが、margin-left: auto は付けず、モデル名の下にそのまま左揃えで置く。 */
  .rowCard__comparePin {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--on-surface-variant);
    cursor: pointer;
  }
  .rowCard__field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  /* MP・VPC等の英数字（Latin書体）とステア・カラー等の日本語（CJK書体）を
     同じ.rowCard__valueで混在表示すると、フォントのフォールバック先が異なり
     行の高さ（line-height）がブラウザの自動計算でわずかに変わってしまい、
     値の上下位置が項目によって数px揃わなくなっていた（現場からの指摘で判明）。
     line-heightを明示的に固定することで、どちらの書体でも同じ高さになる。 */
  .rowCard__label { font-size: 9.5px; line-height: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--on-surface-variant); }
  .rowCard__value {
    font-size: 13.5px; line-height: 17px; font-weight: 600; color: var(--on-surface);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  /* 在庫リストの車両情報（MP・ステア・カラー・有償OP・入港予定日・可能月・VPC）は
     モデル名・コミッションの列（左端の識別列）や状態・操作ボタンの列（右端）とは
     区別して、カード中央の列としてラベル・値ともに中央揃えにする（現場からの
     指摘で判明）。 */
  .rowCard__field--center .rowCard__label,
  .rowCard__field--center .rowCard__value {
    text-align: center;
  }
  .rowCard__model { font-size: 15px; font-weight: 700; letter-spacing: -.005em; }
  .rowCard__commission { font-size: 11px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; margin-top: 1px; }
  /* 高さ固定・内部スクロール（.card__holdArea と同じ考え方）。Hold中はHOLD解除
     リンクが1本、Hold中（2nd有）は2本に増えて縦に伸びる分だけ、状態列だけが
     他の列より高くなり、行（カード）自体の高さが在庫あり／Hold中／Hold中（2nd有）で
     バラバラになっていたため、状態列の高さを常に一定にして吸収する。 */
  .rowCard__status { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 72px; overflow-y: auto; }
  .rowCard__cancelLink {
    border: none; background: none; color: var(--danger); font-size: 11px; font-weight: 700;
    cursor: pointer; padding: 0; text-align: center; width: 100%;
  }
  .rowCard__cancelLink:hover { text-decoration: underline; }
  /* justify-self: stretch + flex-start にすることで、ボタンが1つ（2nd Hold登録済み）
     でも2つ（Hold+受注 等）でも、先頭ボタンの開始位置は常にこの列の左端で揃う。
     justify-self: end だとボタン数で箱の幅が変わり、右端は揃っても開始位置が
     行ごとにずれてしまう。 */
  .rowCard__actions { display: flex; gap: 8px; justify-self: stretch; justify-content: flex-start; }

  /* 受注リストの表示形式「表」: 在庫と項目構成が異なる（比較ピン・操作ボタンが無く、
     顧客・担当者・リード番号などを表示する）ため、専用の列構成にする。顧客・モデルの
     列を`fr`（可変幅）にしていたため、.rowCardの共通min-width（在庫リスト向けに
     1490pxを指定、下記参照）を受け継いだ状態でこの列数の少ない構成に流用すると、
     余った横幅を可変幅の2列だけが吸収してしまい、顧客名〜モデル・モデル〜担当者の
     間に不要な余白が大きく空いてしまっていた（現場からの指摘で判明）。在庫リストと
     同様にすべての列を固定幅にし、min-widthも受注リスト自身の列合計に合わせて
     上書きすることで、余白をなくしスクロールの手間を減らしている。顧客名の列も
     以前210pxにしていたが、実際のコンテンツ（顧客名・コミッション）は最大でも
     60px程度しか使っておらず、左詰めの文字の右側に無駄な余白が生まれ、顧客名→モデルの
     間だけ他の列間より大きく間延びして見えていたため（現場からの指摘で判明）、
     110pxまで縮めている。以前は下取車の有無・OSS登録の可否・保険加入の有無・支払方法・
     MP・VPC・有償OPが表示されておらず、詳細モーダル（orderDetailGridHtml_）を開かないと
     確認できなかったため（現場からの指摘で判明）、これらも列として追加している。 */
  .rowCard.rowCard--order {
    grid-template-columns: 110px 120px 68px 88px 170px 90px 110px 80px 90px 90px 90px 80px 150px 130px;
    min-width: 1716px;
    border-left-color: var(--primary);
  }
  .btn--small { padding: 6px 12px; font-size: 12.5px; }

  /* ===== カードグリッド（PCビューで3列固定。Google Material×Teslaの余白多め・
     高コントラストな見出しでの「カードタイプUI」） ===== */
  .cardGrid {
    display: grid;
    /* 1frだけだと各トラックの下限が「内容物のmin-content幅」になり、
       カードの内容（コミッション番号やバッジ等）が想定より長い場合に
       グリッド自体がコンテナ幅を超えてページ全体の横スクロールを
       引き起こすことがある。minmax(0, 1fr)にして、必要なときはカードの
       方が縮む（内部でテキストが折り返す）ようにする。 */
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
    /* align-items: stretch（デフォルト）だと、1台だけ「車両スペックを見る」等の
       詳細を開いて縦に伸びたときに、同じグリッド行の他のカードまで背が
       伸びてしまう（グリッド行の高さは行内で最も高いカードに揃うため）。
       start にすることで、各カードは自分自身の内容量ぶんの高さのみを取り、
       他のカードのサイズには影響しないようにする。 */
    align-items: start;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid transparent;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  /* rowCard:hover と同じ理由で、border-left-color（在庫状況の色）はホバー時も維持する。 */
  .card:hover { box-shadow: var(--shadow-elevated); transform: translateY(-3px); border-top-color: transparent; border-right-color: transparent; border-bottom-color: transparent; }
  .card--available { border-left-color: var(--success); }
  .card--hold { border-left-color: var(--warning); }
  /* 1st・2nd Holdの両方が埋まっている車両は、これ以上の受け皿がない分、他より
     目立たせる（現場の声を踏まえ、Hold1件のみとは別の色にする）。 */
  .card--hold2 { border-left-color: var(--danger); }
  /* デモカーHOLD・他店HOLDは、通常のHold・2nd Holdとひと目で見分けられるよう
     専用の特別色にする（管理者権限を持つ担当者のみ登録できる。HOLD_TYPE参照）。 */
  .card--holdSpecial { border-left-color: var(--hold-special); }
  /* モデル・コミッション・比較ピンの行と、バッジの行を常に別々の固定行にする。
     以前は1つのflex-wrapコンテナに全部まとめていたため、バッジの個数
     （2個／3個）やモデル名・コミッションの文字数の組み合わせによって折り返し方
     が変わり、在庫あり／Hold中／Hold中（2nd有）でカードの高さが揃わなかった。
     2行に固定することで、組み合わせに関わらず常に同じ高さになる。 */
  .card__top { display: flex; flex-direction: column; gap: 8px; }
  .card__topRow { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card__model { font-size: 21px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
  .card__commission {
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: .03em;
    color: var(--on-surface-variant);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .01em;
    padding: 5px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge__dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .badge--available { background: var(--success-bg); color: var(--success); }
  .badge--hold { background: var(--warning-bg); color: var(--warning); }
  .badge--hold2 { background: var(--danger-bg); color: var(--danger); }
  .badge--holdSpecial { background: var(--hold-special-bg); color: var(--hold-special); }
  .badge--disclosed { background: var(--success-bg); color: var(--success); font-weight: 500; }
  .badge--undisclosed { background: rgba(31, 41, 51, .06); color: var(--on-surface-variant); font-weight: 500; }
  .badge--thisMonth { background: var(--primary-bg); color: var(--primary-text); font-weight: 500; }
  .badge--location { background: var(--primary-bg); color: var(--primary-text); font-weight: 500; }
  .card__badges { display: flex; gap: 6px; flex-wrap: wrap; }

  /* 車両スペック・Hold詳細はカード内に表示せず、「詳細を見る」タップで画面中央の
     モーダル（vehicleDetailHtml_）にまとめて表示する。以前はカード内の折りたたみ
     （<details>）だったが、開閉のたびにカードが伸び縮みし、在庫あり／Hold中／
     Hold中（2nd有）で高さが揃わなくなっていたため。 */
  .card__detailLink {
    margin: 0;
    width: 100%;
    padding: 12px 0 0;
    border: none;
    border-top: 1px solid var(--outline);
    border-radius: 0;
    background: none;
    text-align: left;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary-text);
  }
  .card__detailLink:hover { color: var(--primary); }

  /* メタ情報は2列のミニグリッドで表示。ラベルは小さく大文字寄り・トラッキング広め、
     値は大きく太くというメリハリのある「テスラ風」の見出し表現で視認性を高める。 */
  .card__metaGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 16px;
    margin: 0;
    padding: 12px 0 0;
  }
  /* MP・カラーは折りたたまず常に表示するため、card__topのすぐ下に独自の区切り線を持つ */
  .card__metaGrid--quick { border-top: 1px solid var(--outline); padding-top: 14px; }
  .card__metaGrid dt {
    color: var(--on-surface-variant);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .card__metaGrid dd { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--on-surface); line-height: 1.3; }

  /* Hold状況エリアは高さ固定・内部スクロール。Hold/2nd Holdが増えてもここで吸収し、
     カード自体の高さは在庫あり／Hold／2nd Holdのどの状態でも常に一定に保たれる。 */
  /* 高さは在庫あり／1st Holdのみ／2nd Holdありのどの状態でも常に同じ150pxに
     固定する（2nd Holdが横並び表示に収まる高さを基準に、在庫あり・1st Holdのみ
     の場合も同じ高さにすることで、カードサイズがHoldの状態によって変わらない
     ようにしている）。想定を超える長さの内容が入った場合の保険として、
     内部スクロールも残す。 */
  .card__holdArea {
    height: 150px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  /* 詳細モーダル（vehicleDetailHtml_）は、カードグリッドの行の高さを揃える
     必要が無いため、高さ固定・内部スクロールにせず内容ぶんそのまま表示する。 */
  .card__holdArea--full { height: auto; overflow: visible; }
  /* 2nd Holdがある場合、1st Hold（左）・2nd Hold（右）を縦積みではなく
     横並びにする（カード表示・詳細モーダル・マイページで共通。アプリ全体で
     統一した見せ方にする）。 */
  .card__holdArea--split { flex-direction: row; align-items: stretch; }
  .card__holdArea--split .card__holdInfo { flex: 1 1 0; min-width: 0; }
  .card__holdArea--empty {
    align-items: center;
    justify-content: center;
  }
  .card__holdArea__placeholder {
    font-size: 12.5px;
    color: var(--on-surface-variant);
    opacity: .7;
  }
  .card__holdInfo {
    flex: none;
    background: var(--background);
    border-radius: 10px;
    border-left: 3px solid var(--outline);
    padding: 10px 12px;
    font-size: 13.5px;
    color: var(--on-surface-variant);
    line-height: 1.6;
  }
  .card__holdInfo b { color: var(--on-surface); }
  .card__holdInfo__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .card__holdInfo__label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  .card__holdInfo--first { border-left-color: var(--warning); }
  .card__holdInfo--first .card__holdInfo__label { color: var(--warning); }
  .card__holdInfo--second { border-left-color: var(--primary); background: var(--primary-bg); }
  .card__holdInfo--second .card__holdInfo__label { color: var(--primary-text); }
  /* デモカーHOLD・他店HOLDは、順番（1st/2nd）に関わらずこの特別色で上書きする
     （--first/--secondと同時に付与されるクラスのため、後に書くことで優先させる）。 */
  .card__holdInfo--special { border-left-color: var(--hold-special); background: var(--hold-special-bg); }
  .card__holdInfo--special .card__holdInfo__label { color: var(--hold-special); }
  .card__holdInfo__row { margin-bottom: 6px; }
  .card__holdInfo__cancel {
    border: none;
    background: none;
    color: var(--danger);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    flex: none;
  }
  .card__holdInfo__cancel:hover { background: var(--danger-bg); }

  /* 詳細（リード番号・登録月・下取車等）は詳細モーダル（vehicleDetailHtml_）内でのみ
     表示する（card__holdInfo__detailsBody--flat）。カード表示側では表示しない。 */
  .card__holdInfo__detailsBody--flat {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--outline);
  }

  /* ===== Hold 72時間タイマー ===== */
  .holdTimer__bar {
    height: 5px;
    border-radius: 999px;
    background: var(--outline);
    overflow: hidden;
  }
  .holdTimer__barFill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: var(--primary);
    transition: width 1s linear;
  }
  .holdTimer--warning .holdTimer__barFill { background: var(--warning); }
  .holdTimer--expired .holdTimer__barFill { background: var(--danger); width: 0% !important; }
  /* デモカーHOLD・他店HOLDはHold期限が無期限のため、進捗バーは出さず「無期限」の
     固定表示のみにする（holdTimerHtml_、JavaScript.html参照）。 */
  .holdTimer--indefinite .holdTimer__text { margin-top: 0; color: var(--hold-special); font-weight: 700; }
  .holdTimer__text {
    margin-top: 4px;
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--on-surface-variant);
  }
  .holdTimer--warning .holdTimer__text { color: var(--warning); }
  .holdTimer--expired .holdTimer__text { color: var(--danger); }

  .card__actions { display: flex; gap: 10px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
  .card__actions .btn { flex: 1; min-height: 44px; }

  .emptyState {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    color: var(--on-surface-variant);
    padding: 60px 20px;
    font-size: 14px;
  }
  .emptyState p { margin: 0; max-width: 46ch; line-height: 1.7; }
  /* 単なる文字だけの寂しい印象にならないよう、既存の線画アイコン一式から
     文脈に合うものを添える（新規アイコンライブラリは追加しない）。 */
  .emptyState__icon {
    width: 34px;
    height: 34px;
    stroke-width: 1.3;
    color: var(--outline);
  }

  /* ===== 受注リスト（在庫リストと揃えたカードタイプUI。PCビューで1行3列） ===== */
  .orderList {
    display: grid;
    /* minmax(0, 1fr)にする理由は.cardGridと同じ（1fr単独だと内容量が多い
       カードがある場合にグリッド自体がコンテナ幅を超えてしまうため）。 */
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    align-items: start;
  }
  .orderCard {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid var(--primary);
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  /* card:hover と同じ理由で、border-left-color（アクセントカラー）はホバー時も維持する。 */
  .orderCard:hover { box-shadow: var(--shadow-elevated); transform: translateY(-3px); border-top-color: transparent; border-right-color: transparent; border-bottom-color: transparent; }
  .orderCard__top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 10px; }
  .orderCard__top .card__badges { margin-left: auto; }
  .orderCard__top .card__badges .badge { margin-left: 0; }
  .orderCard__model { font-size: 21px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
  .orderCard__staff { font-size: 13.5px; font-weight: 600; color: var(--on-surface-variant); margin-top: 3px; }
  /* 車種は「誰が・何を買ったか」をひと目で確認できるよう、常に表示する
     （契約内容の詳細は下の折りたたみへ）。 */
  .orderCard__vehicle {
    font-size: 14px;
    font-weight: 600;
    color: var(--on-surface);
    margin-top: 4px;
  }
  /* 契約内容（コミッション・MP・VPC・有償OP・登録月・下取車・OSS・保険・支払方法・
     受注確定日時・リード番号）はカード内に表示せず、「詳細を見る」タップで画面中央の
     モーダル（orderDetailHtml_）にまとめて表示する。顧客名・担当者・車種だけで
     対象案件を判断できる（以前はカード内の折りたたみだったが、開閉のたびに
     カードが伸び縮みしていたため。card__detailLinkと同じパターン）。 */
  .orderCard__detailLink {
    margin: 0;
    width: 100%;
    padding: 12px 0 0;
    border: none;
    border-top: 1px solid var(--outline);
    border-radius: 0;
    background: none;
    text-align: left;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary-text);
  }
  .orderCard__detailLink:hover { color: var(--primary); }
  .orderCard__grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 16px;
    margin: 0;
    padding: 12px 0 0;
  }
  .orderCard__grid dt {
    color: var(--on-surface-variant);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .orderCard__grid dd { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--on-surface); line-height: 1.3; }

  /* ===== 設定画面 =====
     項目ごとに独立したカード（島）に分け、Google/Teslaのカードデザインに寄せる
     （角丸・影・余白多め。1つの大きなカードに全項目を詰め込まない）。
     2列の段組み（masonry）レイアウトも試したが、カードの高さがまちまちだと
     列の合計高さがずれてしまい、次のカードとの間隔だけ広がって不揃いに見える
     問題が残るため、確実に隙間が一定になる1列の縦積みに統一している
     （Google/Teslaの設定画面も同様に1列でカードを並べるスタイル）。 */
  .settingsWrap {
    max-width: 760px;
    margin: 0 auto;
  }
  .settingsGrid {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  /* テーマ・システムマスタ等、設定タブ内の大分類見出し。カードの外側、
     グループの先頭に置く（カード自体の見出し＝settingsSection__titleとは別）。 */
  .settingsGroupTitle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--on-surface-variant);
    margin: 8px 2px -6px;
  }
  .settingsGroupTitle--admin { color: var(--on-surface); }
  .settingsGroupTitle__badge {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: none;
    background: var(--warning-bg);
    color: var(--warning);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .settingsCard {
    background: var(--surface);
    border-radius: 10px;
    box-shadow: var(--shadow);
    border: 1px solid var(--outline);
    padding: 26px 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .settingsSection__title {
    font-size: 15.5px;
    font-weight: 700;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--on-surface);
  }
  .settingsSection__title .icon { color: var(--primary-text); }
  .settingsSection__desc {
    font-size: 12.5px;
    color: var(--on-surface-variant);
    margin: 0 0 14px;
    line-height: 1.6;
  }
  .settingsCard .formField + .formField { margin-top: 14px; }
  .settingsActions {
    background: var(--surface);
    border-radius: 10px;
    box-shadow: var(--shadow);
    border: 1px solid var(--outline);
    padding: 20px 28px;
  }
  .formField { display: flex; flex-direction: column; gap: 6px; }
  .formField label { font-size: 13px; font-weight: 500; color: var(--on-surface-variant); }
  .formField .input { width: 100%; }
  .formField__hint { margin: 0; font-size: 12px; color: var(--on-surface-variant); }
  .formField.hidden { display: none; }

  /* ===== テーマ（着せ替え）プリセット選択 =====
     以前はカラーピッカーで自由に配色を指定できたが、組み合わせによって
     コントラスト比が不足する懸念があったため、視覚的に確認済みの8色から
     選ぶスウォッチ形式に変更した（洋服・スマホケースの色を選ぶイメージ）。 */
  .themePresetGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .themePreset {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 8px;
    background: var(--background);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--on-surface-variant);
    font-size: 12px;
  }
  .themePreset:hover { border-color: var(--swatch); }
  .themePreset.is-selected { border-color: var(--swatch); background: rgba(31, 41, 51, .04); color: var(--on-surface); }
  .themePreset__swatch {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--swatch);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15);
  }
  .themePreset.is-selected .themePreset__swatch {
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15), 0 0 0 3px var(--surface), 0 0 0 5px var(--swatch);
  }
  .themePreset__name { text-align: center; line-height: 1.3; }
  @media (max-width: 480px) {
    .themePresetGrid { grid-template-columns: repeat(3, 1fr); }
  }

  /* ===== ロゴ設定 ===== */
  .logoField { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logoPreview {
    width: 72px; height: 72px; flex: none;
    border: 1px solid var(--outline); border-radius: 8px;
    background: var(--background);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .logoPreview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .logoPreview__placeholder { font-size: 11px; color: var(--on-surface-variant); text-align: center; }
  .logoField__controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ===== 設定タブの各種リスト共通: ドラッグハンドル（担当者・モデル写真・
     メール通知先で共通利用。JavaScript.htmlのmakeReorderable_参照） ===== */
  .dragHandle {
    flex: none;
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 32px;
    color: var(--on-surface-variant);
    font-size: 15px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    border-radius: 4px;
  }
  .dragHandle:hover { background: var(--background); color: var(--on-surface); }
  .dragHandle:active { cursor: grabbing; }
  [data-drag-index].is-dragging { opacity: .4; }
  [data-drag-index].is-drag-over {
    outline: 2px dashed var(--primary);
    outline-offset: 2px;
    border-radius: 8px;
  }

  /* ===== 担当者マスタ ===== */
  .staffList { display: flex; flex-direction: column; gap: 6px; }
  .staffList__row { display: flex; gap: 8px; align-items: center; }
  .staffList__row .input[data-staff-field="name"] { flex: 0 0 22%; min-width: 80px; }
  .staffList__row .input[data-staff-field="email"] { flex: 1 1 40%; min-width: 0; }
  .staffList__row .input[data-staff-field="location"] { flex: 0 0 22%; min-width: 90px; }
  .staffList__empty { font-size: 13px; color: var(--on-surface-variant); }

  /* ===== モデル写真（ホーム画面） ===== */
  .modelPhotoList { display: flex; flex-direction: column; gap: 8px; }
  .modelPhotoList__row { display: flex; gap: 10px; align-items: center; }
  .modelPhotoList__preview {
    width: 44px; height: 44px; flex: none;
    border: 1px solid var(--outline); border-radius: 8px;
    background: var(--background);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .modelPhotoList__preview img { width: 100%; height: 100%; object-fit: cover; }
  .modelPhotoList__row .input[data-photo-field="model"] { flex: 0 0 16%; min-width: 70px; }
  .modelPhotoList__row .input[data-photo-field="bodyType"] { flex: 0 0 120px; }
  /* 写真URLは長い値が入る欄のため、残り幅をすべて使う。先頭の文字列・対象の文字列は
     「CLA」「T」のような短い文字列しか入らないため、固定幅の小さい欄にする
     （photoUrlと同じ比率で伸縮させると、値が短いのに不自然に幅広くなってしまうため）。 */
  .modelPhotoList__row .input[data-photo-field="photoUrl"] { flex: 1 1 0; min-width: 110px; }
  .modelPhotoList__row .input[data-photo-field="gradePrefix"],
  .modelPhotoList__row .input[data-photo-field="gradeMarker"] { flex: 0 0 96px; min-width: 70px; }
  .modelPhotoList__empty { font-size: 13px; color: var(--on-surface-variant); }

  /* ===== メール通知先（Hold時／受注確定時／システムエラー通知） =====
     以前は「,区切りの1テキスト欄」だったが、担当者マスタ・モデル写真と統一した
     「1行1件・追加/削除/ドラッグ並び替え」のリスト形式に変更した。 */
  .mailList { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .mailList__row { display: flex; gap: 8px; align-items: center; }
  .mailList__row .input { flex: 1 1 auto; min-width: 0; }
  .mailList__empty { font-size: 13px; color: var(--on-surface-variant); margin-bottom: 4px; }

  /* ===== ホーム画面: ボディタイプ（型）のクイックナビ =====
     モデル一覧の上に、設定タブで登録できるボディタイプ（Constants.gsの
     MODEL_BODY_TYPE_OPTIONS参照）をひと並びのボタンで表示し、押すとその型だけに絞り込む
     （どの型が何台あるか、目当ての型のモデルを探しやすくするため）。
     トップバー・ツールバー（検索欄）と同様にposition: fixedで画面上部に
     完全固定し、上下スクロール中も常に押せる状態を保つ（現場からの指摘。
     position: stickyだとブラウザによってスクロール中にわずかに追従が
     遅れる/ずれることがあるため、他の固定要素と同じくJavaScript.htmlの
     syncFixedBars_で実測値を使って完全に固定している）。すぐ下に高さ
     実測済みのスペーサー（.homeTypeNavSpacer）を置き、後続のモデル一覧が
     隠れないようにしている（.toolbar / .toolbarSpacerと同じ仕組み）。
     このため、直後の.homeTypeHeader（型ごとの見出し）との間隔は、この
     要素自身のmargin-bottomではなく、spacerの高さ（syncFixedBars_で
     「この要素の高さ＋20px」を設定）で確保している。 */
  .homeTypeNav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    position: fixed;
    top: calc(var(--topbar-h) + 16px);
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 1648px; /* main.view の max-width(1680px) から左右padding(32px)を引いた値。.toolbarと同じ */
    z-index: 25;
    background: var(--surface);
    padding: 10px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .homeTypeNav__item {
    flex: none;
    padding: 8px 16px;
    border: 1px solid var(--outline);
    border-radius: 999px;
    background: var(--surface);
    color: var(--on-surface-variant);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .homeTypeNav__item:hover { border-color: var(--primary); color: var(--on-surface); }
  .homeTypeNav__item.is-active { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

  /* ===== ホーム画面: 型ごとのグループ見出し =====
     モデル一覧を、設定タブで割り当てたボディタイプごとにグループ化して表示する際、
     各グループの先頭（そのタイプの最初の横スクロール行の直前）に挟む見出し。
     1台もモデル写真にボディタイプが割り当てられていない場合はグループ化自体を
     行わず、この見出しも表示しない（renderHomeGallery_のgroupModelPhotosByBodyType_
     参照。運用を始めたばかりでまだ型を割り振っていない状態でも、従来どおりの
     見た目のまま使える）。
     文字サイズは、カード内のモデル名（.homeRow__model、16px）より一段階
     大きくし、個々のモデルより上位の「見出し」であることが一目でわかる
     ようにしている。見出し自身は下方向のmargin-bottomのみで、直後の
     横スクロール行（.homeTypeRow）との間隔を確保する（次のグループとの間隔は
     .homeTypeRow / .homeGradeTabs側のmargin-bottomで確保しているため、
     見出し側にmargin-topは付けない）。 */
  .homeTypeHeader {
    font-size: 19px;
    font-weight: 700;
    color: var(--on-surface);
    margin: 0 2px 14px;
  }

  /* ===== ホーム画面 =====
     PC（901px以上）は、左に一覧（.homeSplit__list）・右に選択中モデルの詳細
     （.homeSplit__detail、#homeDetail）を並べる2ペイン構成にする（Index.html
     の.homeSplit、下部の@media (min-width: 901px)内の.homeSplit系ルール参照）。
     左の一覧は型ごとに見出し（.homeTypeHeader）＋縦一列に並ぶコンパクトな
     行カード（.homeRow）にする。行をタップすると.is-selectedになり、右の
     詳細ペインにそのモデルの写真とグレード別在庫数を表示する
     （JavaScript.htmlのselectHomeModel_・renderHomeDetail_参照）。
     タブレット・スマホ幅（900px以下）では、詳細ペインは使わず、パッと見て
     在庫状況がわかる情報密度を優先した横一列の「リスト」型のままタップした
     行その場にグレードタブを展開する（@media (max-width: 900px)で上書き。
     現場の声を踏まえて選んだ元のレイアウトのため、狭い画面では変更しない）。 */
  .homeList {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .homeRow {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    gap: 14px;
    padding: 12px;
    /* 薄く色付けした背景（--card-bg）にし、ページ背景（--background）・
       カード内の写真プレースホルダーとも見分けがつくようにする。縁は
       うっすらとした薄い線に留め（区切りというより背景色の変化で
       カード同士を見分けさせる）、カード間の余白（.homeListのgap）
       自体で区切りを表現する。 */
    background: var(--card-bg);
    border: 1px solid rgba(15, 23, 42, .06);
    border-radius: var(--radius);
    color: var(--on-surface);
    cursor: pointer;
    text-align: left;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease, background-color .18s ease;
  }
  .homeRow:hover { box-shadow: var(--shadow-elevated); transform: translateY(-2px); border-color: var(--primary); }
  /* 選択中のモデル（state.homeSelectedModel、PC専用の2ペイン構成）は、右の
     詳細ペイン（#homeDetail）に表示中であることがひと目でわかるよう、枠と
     背景を強調する（JavaScript.htmlのhomeModelTileHtml_・selectHomeModel_
     参照。タブレット・スマホ幅では常にfalseのため付与されない）。 */
  .homeRow.is-selected {
    border-color: var(--primary);
    background: var(--primary-bg);
  }
  /* タブレット・スマホ幅のインライン展開（state.homeExpandedModel）専用。
     PCビューでは常にfalseのため付与されない（@media (max-width: 900px)で
     display・padding・背景などを上書きする）。 */
  .homeRow.is-expanded {
    margin-bottom: 12px;
    /* モデルタップ時にscrollIntoView()でこのタイルまで自動スクロールする際
       （JavaScript.htmlのクリックハンドラ参照）、position: fixedのトップバー・
       型クイックナビの下に隠れてしまわないよう、その高さぶんの余白を確保する
       （--home-scroll-offsetはsyncFixedBars_が実測して更新する）。 */
    scroll-margin-top: calc(var(--home-scroll-offset, 100px) + 16px);
  }
  .homeRow.is-expanded:hover { box-shadow: none; transform: none; }
  .homeRow__photo {
    order: 1;
    width: 64px;
    height: 64px;
    flex: none;
    background: var(--background);
    border-radius: 8px;
    overflow: hidden;
  }
  .homeRow__photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* ヘッダー行: モデル名（左）＋グレード件数タグ／「他のモデルを見る」ボタン（右）。
     写真の右に並べ、フッター行（在庫台数・矢印）と合わせて1行に収める。 */
  .homeRow__header {
    order: 2;
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .homeRow__model {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -.005em;
    line-height: 1.3;
  }
  /* グレードのあるモデルは、通常表示ではヘッダー行にグレード件数タグを添える
     （クローズアップ表示では代わりに「他のモデルを見る」ボタンが同じ位置に入る。
     JavaScript.htmlのgradesTagHtml参照）。 */
  .homeRow__gradesTag {
    flex: none;
    background: var(--primary-bg);
    color: var(--primary-text);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  /* 「他のモデルを見る」ボタン: 押すと展開を解除し、他のモデルが並ぶ通常の
     グリッド表示に戻る（#homeGridのクリック委譲で、.homeRow自体のトグル処理が
     そのまま効く）。ヘッダー行のグレード件数タグと同じ位置に収まる、控えめな
     テキストリンクにする。 */
  .homeRow__backBtn {
    flex: none;
    border: none;
    background: none;
    color: var(--primary-text);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    white-space: nowrap;
  }
  .homeRow__backBtn:hover { text-decoration: underline; }
  /* フッター行: 在庫台数（アクセントカラー）＋矢印。写真・ヘッダー行と同じ
     1行に並べ、右端に置く。 */
  .homeRow__footer {
    order: 3;
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .homeRow__footer .badge--count {
    background: none;
    color: var(--primary-text);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    padding: 0;
  }
  .homeRow__footer .homeRow__chevron {
    display: inline;
    flex: none;
    color: var(--primary-text);
    font-size: 15px;
  }
  .homeRow__chevron--nav { font-size: 16px; }

  /* ===== ホームの型ごとのグループ =====
     JavaScript.htmlのrenderHomeGallery_は型ごとに.homeTypeRowで.homeRowを
     グループ化してDOMを生成するが、見た目上は型をまたいで縦一列の.homeList
     （リスト）として見せるため、display: contentsでこの要素自体の存在を消し、
     中の.homeRowをそのまま.homeList（縦一列のflexコンテナ）の直接の子として
     扱わせる（PC・タブレット/スマホで共通）。 */
  .homeTypeRow { display: contents; }

  /* ===== ホームの2ペイン構成（左:一覧／右:選択中モデルの詳細） =====
     PC専用（901px以上）。タブレット・スマホ幅では#homeDetailを使わず、
     一覧（.homeSplit__list）だけを通常どおり表示するため、既定では
     .homeSplitをブロック要素・#homeDetailを非表示にしておき、下の
     @media (min-width: 901px)でのみ2ペインのレイアウトを組む。 */
  .homeSplit { display: block; }
  /* #homeDetailはIDセレクタのため、下のPC専用メディアクエリ内で単に
     .homeSplit__detail（クラスセレクタ）に display: block を指定しても
     詳細度で負けてしまう。ここでも同じ.homeSplit__detailクラスセレクタで
     揃えておき、メディアクエリ側を後勝ちで上書きさせる。 */
  .homeSplit__detail { display: none; }
  /* アプリ名見出し（.homeSplit__listTitle）は、共通トップバーの見出しを
     ホームタブの間だけ非表示にするPC専用の構成の一部のため、タブレット・
     スマホ幅では表示しない（それらの幅では共通トップバーが従来どおり
     アプリ名を表示するため、二重表示を防ぐ）。 */
  .homeSplit__listTitle { display: none; }

  /* ===== ホームのグレードタブ（グレードが設定されたモデル行を展開すると現れる） =====
     PCでは、展開したタイル（そのモデルの型セクション内）の直下にそのまま表示する
     （renderHomeGallery_がDOM順で展開タイルの直後に並べているため、grid-column・
     orderによる並び替えは不要）。900px以下（リスト型）では、写真幅ぶんインデントし
     左に細い罫線を添えることで「ベースモデル行から派生したタブである」ことを
     視覚的に示す（車両スペック折りたたみ等と同じ、階層関係を罫線で示す考え方。
     @media (max-width: 900px)で上書き）。 */
  .homeGradeTabs {
    margin-bottom: 24px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
  }
  .homeGradeTabs__label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--on-surface-variant);
    margin: 0 0 10px;
  }
  .homeGradeTabs__list { display: flex; flex-wrap: wrap; gap: 8px; }
  .homeGradeTab {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--outline);
    background: var(--surface);
    color: var(--on-surface);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .homeGradeTab:hover { background: rgba(31, 41, 51, .05); border-color: var(--primary); }
  .homeGradeTab__count { color: var(--on-surface-variant); font-weight: 500; font-variant-numeric: tabular-nums; }
  /* 在庫0台のグレードは、Hold中も無くまとまった在庫の当てがないことがひと目で
     わかるよう、件数を赤文字にする。 */
  .homeGradeTab__count--zero { color: var(--danger); font-weight: 700; }

  /* ===== PC専用: 左サイドバーナビゲーション =====
     901px以上でのみ表示する（タブレット・スマホ幅では従来どおりtopbar内の
     .tabsを使う。サイドバー方式は狭い画面では畳む必要が生じ、既存の実務向け
     レイアウトを壊してしまうため、PCビューのみに限定した）。ナビ項目・
     ユーザー情報の実体はIndex.html参照。ロゴ・担当者情報はJavaScript.htmlの
     applyLogo/renderTopbarUserがtopbar側と共通の内容を反映する。
     デフォルトでは非表示にし、下のメディアクエリでのみ表示する。 */
  .sidebar { display: none; }

  @media (min-width: 901px) {
    :root { --sidebar-w: 232px; }

    #app { padding-left: var(--sidebar-w); }

    .sidebar {
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      /* 3列構成（左:項目タブ＝ダークネイビー／中央:モデル一覧＝ホワイト／
         右:車両詳細＝グレー）の一番左のゾーン。トップバー・比較バー・トーストと
         同じ--topbar-bgを使い、テーマ設定に関わらず常にダークネイビーで
         統一する（参照画像の濃色サイドバーに合わせた。--on-topbar・
         --dark-ui-outlineも同じ理由でこのダーク基調UI専用のトークンを流用する）。 */
      background: var(--topbar-bg);
      border-right: 1px solid var(--dark-ui-outline);
      padding: 20px 0;
      z-index: 32;
    }
    .sidebar__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px 18px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--dark-ui-outline);
    }
    .sidebar__logo { height: 28px; width: auto; max-width: 100%; object-fit: contain; }
    .sidebar__brandText {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--on-topbar);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* ロゴを設定した場合は、サイドバーの見出しはロゴ画像だけにする（アプリ名の
       文字表記は中央ヘッダーの.topbar__brandTextに役割を譲るため、ロゴがある
       場合にここで重複表示しない。未設定時はこれまでどおりテキストのみ表示する）。 */
    .sidebar__logo:not(.hidden) ~ .sidebar__brandText { display: none; }

    .sidebarNav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; flex: 1; overflow-y: auto; }
    /* .tabs__itemの大文字・トラッキング広め・下線アクティブ表示は水平タブ用の
       スタイルのため、サイドバーの縦積みリスト用に上書きする
       （border: noneでborder-styleをnoneにするため、.tabs__item.is-activeの
       border-bottom-colorが後から効いても実際には描画されない）。 */
    .sidebarNav__item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: none;
      /* ダークネイビーの地に対して、非選択時は少し抑えた白（.icon・テキスト
         双方に効くcurrentColor）にする。 */
      color: rgba(255, 255, 255, .68);
      opacity: 1;
      font-size: 13.5px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: normal;
      text-align: left;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease;
    }
    .sidebarNav__item .icon { flex: none; }
    .sidebarNav__item:hover { background: rgba(255, 255, 255, .08); color: var(--on-topbar); opacity: 1; }
    /* 選択中の項目は、テーマカラーを帯びた明るいピル（--primary-bg/--primary-text）で
       ダークネイビーの地から浮き上がらせる。 */
    .sidebarNav__item.is-active {
      background: var(--primary-bg);
      color: var(--primary-text);
      border-bottom-color: transparent;
    }

    .sidebarUser {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 0;
      margin-top: 8px;
      border-top: 1px solid var(--dark-ui-outline);
    }
    .sidebarUser__avatar {
      flex: none;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--primary-bg);
      color: var(--primary-text);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }
    .sidebarUser__info { min-width: 0; font-size: 11.5px; line-height: 1.5; }
    .sidebarUser__info .topbar__userName {
      display: block; font-weight: 600; font-size: 12.5px; color: var(--on-topbar);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebarUser__info .topbar__userEmail {
      display: block; color: rgba(255, 255, 255, .68); font-size: 11px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebarUser__info .topbar__userWarn { font-size: 10.5px; padding: 3px 8px; }

    /* トップバー: ナビ・ユーザー情報はサイドバーに移るため、「戻る／更新」ボタンと
       中央のアプリ名見出しだけが残るスリムなヘッダーになる。3列構成の中央
       （.homeSplit__list）・右（.homeSplit__detail）2列ぶんの「ヘッダー」に
       あたるため、アプリ名「販売可能リスト」はここに表示する。ロゴ画像は
       サイドバー側（.sidebar__brand）だけに表示すれば十分なため、ここでは
       文字のみ表示し.topbar__logoは非表示にする（.topbar__brandText参照）。 */
    .topbar {
      left: var(--sidebar-w);
      background: var(--surface);
      color: var(--on-surface);
      border-bottom: 1px solid var(--outline);
      box-shadow: none;
    }
    .topbar__brandRow { padding: 20px 32px; }
    .topbar__logo, .topbar__user, .tabs { display: none; }
    /* .topbar__brandTextの文字色（--on-topbar、白）はモバイル/タブレットの
       ネイビー地のトップバー向けのため、PCのホワイト地トップバーでは
       --on-surface（濃色）に上書きしないと白文字のまま見えなくなる。 */
    .topbar__brandText { color: var(--on-surface); }
    .topbar__navBtn { border-color: var(--outline); color: var(--on-surface-variant); }
    .topbar__navBtn:hover { background: var(--background); }
    .topbar__navBtn:disabled:hover { background: transparent; }
    /* ホームタブの間は、この共通トップバーを非表示にする。アプリ名見出しは
       中央パネル自身のヘッダー（.homeSplit__listHeader）、戻る／更新ボタンは
       右パネル自身のヘッダー（.homeSplit__detailHeader）にそれぞれ役目を譲るため
       （サイドバー／中央パネル／右パネルの3区画だけにする。JavaScript.htmlの
       switchToTab_参照）。非表示になるとoffsetHeightが0になるため、直後の
       syncFixedBars_()が--topbar-hを自動的に0へ更新し、#appの上余白も
       連動して詰まる。 */
    body.is-home-tab .topbar { display: none; }

    /* main.viewは全幅を使い、position: fixedのトップバー・ツールバー同様
       サイドバー幅ぶんのpaddingは#app側で既に確保済みのため、ここでは
       中央寄せ用のmax-width/marginを解除するだけでよい。 */
    main.view { max-width: none; margin: 0; padding: 24px 32px 40px; }

    /* 検索欄（在庫リスト・受注リスト・Gクラス予約リストのツールバー）は
       position: fixedで画面上部に固定しているため（left: 50% +
       transform: translateX(-50%)で全幅中央寄せ）、サイドバーぶん左に
       寄せて、コンテンツ列と同じ横幅に揃える。 */
    .toolbar {
      left: calc(var(--sidebar-w) + 24px);
      right: 24px;
      transform: none;
      width: auto;
      max-width: none;
    }

    /* ホーム中央パネル自身のヘッダー: アプリ名見出し＋ボディタイプ絞り込みナビを
       まとめて、モデル一覧パネル（.homeSplit__list）の内側・カード一覧の直上に
       position: stickyで留める（スクロールしても常に押せる状態を保つ。共通
       トップバーへドッキングしていた以前のバージョンから、中央パネル自身の
       ヘッダーとして「モデルカードの上」に置く構成に変更した）。 */
    .homeSplit__listHeader {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--surface);
      margin: 0 -16px 4px;
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--outline);
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .homeSplit__listTitle {
      display: block;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--on-surface);
      margin-bottom: 14px;
    }
    .homeTypeNav {
      display: flex;
      /* 横スクロールは使わない（PCビューでは横スクロールが必要な画面を作らない
         方針のため）。.homeSplit__listの幅（720px）とこのブレークポイント専用の
         コンパクトな.homeTypeNav__itemサイズを組み合わせれば、通常のPC画面幅
         では8個（「すべて」＋MODEL_BODY_TYPE_OPTIONSの7種類）すべてが1行に
         収まる。ただし.homeSplit__listは狭いウィンドウ幅では最小480pxまで
         縮む（下の.homeSplit__list参照）ため、その場合に備えてflex-wrap: wrap
         にしておく（横スクロールより、必要な時だけ2行に折り返す方を優先する）。 */
      flex-wrap: wrap;
      overflow: visible;
      gap: 6px;
      position: static;
      background: none;
      margin: 0;
      padding: 0;
      border-bottom: none;
      border-radius: 0;
      box-shadow: none;
      transform: none;
      width: auto;
      max-width: none;
    }
    /* タブレット・スマホ幅と共通のピル型サイズ（font-size: 13.5px、
       padding: 8px 16px）のままだと、型の種類数（最大8個＝「すべて」＋
       MODEL_BODY_TYPE_OPTIONSの7種類）を1行に収めるには.homeSplit__listの
       幅を非現実的に広げる必要があるため、PCビューのこのヘッダー内だけ
       一回り小さくする。 */
    .homeTypeNav__item {
      padding: 5px 9px;
      font-size: 11px;
    }
    .homeTypeNavSpacer { display: none; }

    /* ===== ホームの3列構成 =====
       左（サイドバー）＝項目タブ・中央（.homeSplit__list）＝型クイックナビ＋
       モデル一覧・右（.homeSplit__detail、#homeDetail）＝選択中モデルの詳細、
       という3列構成にする。色は左からグレー（サイドバー、--background）・
       ホワイト（中央のモデル一覧パネル、--surface）・グレー（右の詳細パネル、
       --background）の順にし、中央パネルだけが浮き上がって見えるようにする。 */
    /* display: flexではなくgridにしているのは、flexのflex-shrink計算だと
       .homeSplit__detail側のコンテンツ（写真・グレードカード等）の
       最小コンテンツ幅がmin-width: 0を飛び越えてページ全体の横あふれを
       引き起こすことがあったため（flex-basisが0の側に縮小分がすべて
       乗ってしまい、実際のレンダリング幅0pxに対してコンテンツだけが
       はみ出す現象）。grid-template-columnsのminmax()なら、両方の列に
       明示的な下限・上限を持たせたうえで、ウィンドウ幅に応じてなめらかに
       縮められる。 */
    .homeSplit {
      display: grid;
      /* 中央（モデル一覧）: 型クイックナビ8個を1行に収めるのに必要な幅は、
         コンパクト化した.homeTypeNav__itemなら600px前後で足りる（以前は
         720pxにしていたが、その分右の詳細パネル・車両画像を大きく取れる
         よう、タブをさらに小さくして必要幅を縮めた）。上限にしつつ、
         PCビューの最小幅（901px）でも右の詳細パネルと共存できる380pxまでは
         縮められるようにする（縮んだ場合は型クイックナビがflex-wrapで2行に
         折り返す。横スクロールは発生しない）。右（詳細）: 同じくPCビュー
         最小幅でも収まる180pxを下限にし、残り幅をすべて使う。 */
      grid-template-columns: minmax(380px, 640px) minmax(180px, 1fr);
      align-items: start;
      gap: 24px;
      height: calc(100vh - var(--topbar-h) - 24px - 40px);
    }
    .homeSplit__list {
      min-width: 0;
      /* main.viewの上余白（24px）ぶん枠を上に拡張し、トップバーの真下まで
         フレームを伸ばす（下端の位置はheightをその分足すことで変えない）。 */
      margin-top: -24px;
      height: calc(100% + 24px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: var(--radius);
      padding: 0 16px 16px;
    }
    .homeSplit__detail {
      display: flex;
      flex-direction: column;
      min-width: 0;
      /* .homeSplit__listと同様、main.viewの上余白（24px）ぶん枠を上に拡張し、
         トップバーがあった高さの真下（実質トップバー自体を非表示にしているため
         画面最上部）までフレームを伸ばす。 */
      margin-top: -24px;
      height: calc(100% + 24px);
      background: var(--background);
    }
    /* 右パネル自身のヘッダー: 戻る／更新ボタンを配置する（共通トップバー側の
       ボタンと同じ処理を呼ぶ別要素。JavaScript.htmlのhandleNavBackClick_・
       handleRefreshClick_参照）。 */
    .homeSplit__detailHeader {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 28px 0;
    }
    /* パネル自体がグレー（--background）のため、ホバー時の背景（共通の
       .topbar__navBtn:hoverが使う--background）だと同色で見分けがつかない。
       ここだけホワイト（--surface）に上書きする。 */
    .homeSplit__detailHeader .topbar__navBtn:hover { background: var(--surface); }
    .homeSplit__detailBody {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 28px 28px;
    }
    /* 未選択時（state.homeSelectedModel === null）は、選択を促す案内だけを
       中央に表示する（homeDetailEmptyHtml_参照）。 */
    .homeDetail__empty {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--on-surface-variant);
      text-align: center;
    }
    .homeDetail__empty .emptyState__icon { opacity: .5; }
    /* 右パネル自身のヘッダー（.homeSplit__detailHeader）内の静的なボタン
       （Index.html参照）。左の戻る／更新ボタン（タブ間の画面履歴を戻る）とは
       別の操作（モデルの選択解除）のため、margin-left: autoで右側に離して
       混同を防ぐ。表示・非表示はrenderHomeDetail_が切り替える。 */
    .homeDetail__backBtn {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      border: none;
      background: none;
      color: var(--primary-text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }
    .homeDetail__backBtn:hover { text-decoration: underline; }
    .homeDetail__headRow {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .homeDetail__title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.01em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .homeDetail__type {
      flex: none;
      background: var(--background);
      color: var(--on-surface-variant);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .homeDetail__count {
      flex: none;
      text-align: right;
      line-height: 1.2;
    }
    .homeDetail__countNum {
      display: block;
      font-size: 26px;
      font-weight: 700;
      color: var(--primary-text);
      font-variant-numeric: tabular-nums;
    }
    .homeDetail__countLabel {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      color: var(--on-surface-variant);
    }
    .homeDetail__photo {
      position: relative;
      /* 以前は16:9だったが、モデル画像の下に並ぶグレードカード（3列×複数行）が
         スクロールなしで全部見えるよう、写真の高さを抑えるために2:1に変更した。 */
      aspect-ratio: 2 / 1;
      /* 右パネル全体がグレー（--background）になったため、写真の枠は
         ホワイト（--surface）にして「カード」として浮き上がらせる。 */
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .homeDetail__photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* 写真の左右に重ねる◀▶ナビゲーションボタン。現在表示中の型フィルタでの
       表示順（homeVisibleModelsFlat_、JavaScript.html参照）に沿って、前後の
       モデルへ切り替える。先頭・末尾ではdisabledにする（ループしない）。 */
    .homeDetail__navBtn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, .85);
      color: var(--on-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      box-shadow: var(--shadow-elevated);
      transition: background-color .15s ease;
    }
    .homeDetail__navBtn:hover { background: #fff; }
    .homeDetail__navBtn:disabled { opacity: .35; cursor: default; box-shadow: none; }
    .homeDetail__navBtn--prev { left: 12px; }
    .homeDetail__navBtn--next { right: 12px; }
    /* グレード別在庫数は、グレードごとのカードを3列×複数行（グレードが6件までは
       2行に収まる）で並べる。カード自体をクリックすると、既存のグレードタブと
       同じ挙動（そのグレード1件に絞り込んだ在庫リストへ遷移）になるため、
       別途「在庫リストで見る」ボタンは表示しない（homeDetailHtml_参照）。 */
    .homeDetail__gradeLabel {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
      margin: 0 0 10px;
    }
    .homeDetail__gradeGrid {
      display: grid;
      /* minmax(0, 1fr)にする理由は.cardGridと同じ（グレード名が長い場合に
         グリッド自体が右パネル幅を超えてしまうのを防ぐ）。 */
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .homeDetail__gradeCard {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 20px 10px;
      border: 1px solid var(--outline);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--on-surface);
      cursor: pointer;
      text-align: center;
      transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease;
    }
    .homeDetail__gradeCard:hover { box-shadow: var(--shadow-elevated); border-color: var(--primary); transform: translateY(-2px); }
    .homeDetail__gradeCardName { font-size: 15px; font-weight: 700; }
    .homeDetail__gradeCardCount { font-size: 13px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
    /* 在庫0台のグレードは、Hold中も無くまとまった在庫の当てがないことがひと目で
       わかるよう、件数を赤文字にする（.homeGradeTab__count--zeroと同じ考え方）。 */
    .homeDetail__gradeCardCount--zero { color: var(--danger); font-weight: 700; }
    .homeDetail__cta { margin-top: 4px; }
  }

  /* ===== リード番号入力（「L-」固定接頭辞＋数字。Google×Tesla風の見出し扱いにする） ===== */
  .leadNumberField {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--outline);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .leadNumberField:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg); }
  .leadNumberField__prefix {
    display: flex;
    align-items: center;
    padding: 0 14px;
    background: var(--primary-bg);
    color: var(--primary-text);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .03em;
    border-right: 1px solid var(--outline);
  }
  .leadNumberField__input { border: none; border-radius: 0; flex: 1; min-width: 0; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .leadNumberField .leadNumberField__input:focus { outline: none; }

  /* ===== 担当者表示（ログイン中のアカウントから自動判定・読み取り専用） ===== */
  .staffDisplay {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--background);
    font-size: 14px;
  }
  .staffDisplay__email { font-size: 12px; color: var(--on-surface-variant); }
  .staffDisplay__warn { font-size: 13px; color: var(--danger); }

  /* ===== モーダル ===== */
  .modal {
    position: fixed; inset: 0; background: rgba(32, 33, 36, .5);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  /* ヘッダー・ステップ進捗・フッターは固定し、modal__bodyだけをスクロール
     させる（display: flex; flex-direction: columnで、modal__bodyのみ
     flex: 1 1 auto; overflow-y: autoにする）。以前はmodal__panel自体を
     スクロールさせていたため、内容が長いモーダルではタイトルや「Hold登録」
     等の見出しごとスクロールして見えなくなっていた。 */
  .modal__panel {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-elevated);
    width: 100%; max-width: 460px; max-height: 90vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal__panel--wide { max-width: 640px; }
  .modal__header { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--outline); }
  .modal__header h2 { font-size: 17px; font-weight: 500; margin: 0; display: flex; align-items: center; }

  /* Hold登録・2nd Hold登録はオレンジ、受注確定はブルーで、操作の種類が一目で
     分かるようにする（Hold中バッジ＝オレンジ、受注確定ボタン＝ブルー、と既存の
     配色ルールに合わせている）。 */
  .modal__panel--hold { border-top: 4px solid var(--warning); }
  .modal__panel--hold .modal__header { background: var(--warning-bg); }
  .modal__panel--hold .modal__header h2::before { background: var(--warning); }
  .modal__panel--hold #btnActionSubmit { background: var(--warning); border-color: var(--warning); }
  .modal__panel--hold #btnActionSubmit:hover { background: #c98423; border-color: #c98423; }

  .modal__panel--order { border-top: 4px solid var(--primary); }
  .modal__panel--order .modal__header { background: var(--primary-bg); }
  .modal__panel--order .modal__header h2::before { background: var(--primary); }

  .modal__panel--hold .modal__header h2::before,
  .modal__panel--order .modal__header h2::before {
    content: '';
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-right: 9px;
    flex: none;
  }
  .modal__body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  /* 予約（Hold/2nd Hold/受注）入力モーダルは2列グリッドにして、デスクトップでは
     スクロールなしで全項目を入力できるようにする。 */
  .modal__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 20px; }
  .formField--span2 { grid-column: 1 / -1; }

  /* ===== 予約モーダルのステップ進捗（顧客情報→契約内容の2ステップ）=====
     スマホでの入力ミスを減らすため、8項目を一度に出さず2ステップに分ける。
     担当者はログインアカウントから自動判定済みのため、ステップが増えても
     入力の手間自体は増えない。 */
  .modal__stepBar { flex: none; padding: 12px 20px 0; }
  .modal__stepBar__track { height: 4px; border-radius: 999px; background: var(--outline); overflow: hidden; }
  .modal__stepBar__fill { height: 100%; width: 50%; background: var(--primary); border-radius: 999px; transition: width .2s ease; }
  .modal__panel--hold .modal__stepBar__fill { background: var(--warning); }
  .modal__stepBar__label { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); }
  .modal__footer { flex: none; display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--outline); }
  .modal__error { color: var(--danger); font-size: 13px; }
  .modal__desc { margin: 0; font-size: 13px; color: var(--on-surface-variant); line-height: 1.6; }
  .modal__requiredNote { margin: 0 0 4px; font-size: 12px; color: var(--on-surface-variant); }
  .req { color: var(--danger); margin-left: 2px; }
  .modal__hint { margin: 10px 0 0; font-size: 12.5px; color: var(--on-surface-variant); line-height: 1.6; }

  /* ===== Hold種別選択（管理者権限を持つ担当者が「Hold」タップ時のみ表示）=====
     通常のHold／デモカーHOLD／他店HOLDの3択。デモカーHOLD・他店HOLDは専用の
     特別色（--hold-special）でボタンの左罫線を色分けし、選ぶ前から見分けやすくする。 */
  .actionTypePick__intro { margin: 0 0 14px; font-size: 13.5px; color: var(--on-surface-variant); }
  .actionTypePick { display: flex; flex-direction: column; gap: 10px; }
  .actionTypePick__btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    border: 1px solid var(--outline);
    border-left: 4px solid var(--warning);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .actionTypePick__btn:hover { box-shadow: var(--shadow-elevated); transform: translateY(-1px); }
  .actionTypePick__btn--demo,
  .actionTypePick__btn--otherStore { border-left-color: var(--hold-special); }
  .actionTypePick__btnTitle { font-size: 15px; font-weight: 700; }
  .actionTypePick__btnDesc { font-size: 12.5px; color: var(--on-surface-variant); }

  /* ===== トースト ===== */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    /* ネイビーサブ（比較バーのメインネイビーより少し明るく、奥行きを付ける）。 */
    background: #243b53; border: 1px solid var(--dark-ui-outline); color: #fff; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; box-shadow: var(--shadow-elevated); z-index: 200;
  }
  .toast--error { background: var(--danger); }

  /* ===== 受注確定時の紙吹雪演出（文字・カードなし。紙吹雪のみ盛大に降らせる） ===== */
  .confettiLayer { position: fixed; inset: 0; z-index: 310; overflow: hidden; pointer-events: none; }
  /* 受注確定の瞬間だけ、ごく短時間だけ画面中央を明るく光らせる「フラッシュ」を
     重ねる（文字・カードは出さない方針は維持し、あくまで光の演出のみ）。 */
  .confettiLayer::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 60%);
    opacity: 0;
    transition: opacity .5s ease;
  }
  .confettiLayer.is-flashing::before { opacity: 1; }
  .confettiPiece {
    position: absolute;
    top: -24px;
    opacity: .95;
    will-change: transform;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--drift, 0), 112vh) rotate(var(--rot, 720deg)); opacity: .85; }
  }

  /* ===== ノートPC幅（在庫リストは4列だとカードが窮屈になるため3列に落とす。
     受注リストはもともと1行3列のため、このブレークポイントでは変更しない） ===== */
  @media (max-width: 1400px) {
    .cardGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  /* ===== タブレット ===== */
  @media (max-width: 900px) {
    main.view { padding: 14px; }
    .cardGrid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .settingsWrap { max-width: 100%; }
    /* 受注カードは項目数が多いため、タブレット幅では1列にして読みやすさを優先する */
    .orderList { grid-template-columns: 1fr; }

    /* 型のクイックナビ: タブレット・スマホ幅では5種類＋「すべて」を折り返し無しで
       並べると窮屈なため、横スクロールにする（よくあるカテゴリ絞り込みチップの
       パターン。折り返して縦に伸びると、position: fixedで固定した高さぶんだけ
       スペーサーも伸び、その分モデル一覧が下に押し出されてしまうのを避けるため）。 */
    .homeTypeNav { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .homeTypeHeader { margin: 10px 2px 6px; font-size: 17px; }

    /* ホーム画面: PCの5列カードグリッド（写真主体のカードタイプUI）ではなく、
       元の「実務重視リスト型」（横一列・小さめの写真）に戻す。タブレット・
       スマホ幅では情報密度を優先するため（現場の声を踏まえた元のレイアウト）。
       DOM構造（ヘッダー・写真・フッターの3要素）自体はPC・タブレット/スマホで
       共通のまま（JavaScript.htmlのhomeModelTileHtml_参照）、CSSのorderだけで
       横一列に組み替える。 */
    /* PC専用のカード間の余白（gap）を打ち消し、従来どおり罫線だけで隣接する
       行を区切る密なリストに戻す。 */
    .homeList { display: flex; flex-direction: column; max-width: 100%; gap: 0; }
    .homeRow {
      overflow: visible;
      flex-direction: row;
      align-items: center;
      gap: 18px;
      padding: 14px 6px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--outline);
      border-radius: 0;
    }
    .homeRow:first-child { border-top: 1px solid var(--outline); }
    .homeRow:hover { background: rgba(31, 41, 51, .04); box-shadow: none; transform: none; border-color: transparent; }
    /* PC専用の「クローズアップ」展開表示（.homeRow.is-expanded、上部参照）を
       打ち消し、タブレット・スマホ幅では従来の横一列リストのままにする
       （order・「他のモデルを見る」ボタンもすべてPC専用として打ち消す）。 */
    .homeRow.is-expanded {
      grid-column: auto;
      order: 0;
      display: flex;
      justify-content: normal;
      padding: 14px 6px;
      background: rgba(255, 255, 255, .04);
      border-color: transparent;
      border-bottom-color: transparent;
    }
    .homeRow__photo { order: 1; width: 76px; height: 76px; aspect-ratio: auto; flex: none; margin: 0; }
    .homeRow.is-expanded .homeRow__photo { width: 76px; aspect-ratio: auto; }
    .homeRow__header { order: 2; flex: 1; min-width: 0; }
    .homeRow__gradesTag { display: none; }
    .homeRow__model { color: var(--on-surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .homeRow__footer {
      order: 3;
      flex: none;
      border-top: none;
      padding-top: 0;
      margin-top: 0;
      gap: 10px;
    }
    .homeRow__footer .badge--count {
      background: var(--primary-bg);
      color: var(--primary-text);
      padding: 5px 12px;
      border-radius: 999px;
      text-transform: none;
      letter-spacing: normal;
      font-size: 12px;
    }
    .homeRow__footer .homeRow__chevron { color: var(--on-surface-variant); font-size: 13px; }
    .homeRow.is-expanded .homeRow__backBtn { display: none; }
    .homeGradeTabs {
      grid-column: auto;
      order: 0;
      margin: 0 0 0 94px;
      padding: 4px 0 16px 16px;
      background: none;
      border: none;
      border-left: 2px solid var(--outline);
      border-bottom: 1px solid var(--outline);
      border-radius: 0;
    }
  }

  /* ===== スマートフォン ===== */
  @media (max-width: 600px) {
    .topbar__brandRow { padding: 12px; gap: 8px; }
    .tabs { padding: 0 12px 10px; gap: 20px; }
    .integrityBanner { padding: 8px 12px; font-size: 12.5px; flex-wrap: wrap; }
    .integrityBanner__list { padding: 8px 12px 10px; }
    /* メールアドレスの長さ次第では折り返し等で崩れやすいため、ユーザー情報は
       スマホ幅では非表示にする（中央のアプリ名表記はposition: absoluteで
       独立して中央配置されているため、ユーザー情報の表示可否からは影響を
       受けない）。 */
    .topbar__user { display: none; }
    .staffList__row { flex-wrap: wrap; }
    .staffList__row .input[data-staff-field="name"],
    .staffList__row .input[data-staff-field="email"],
    .staffList__row .input[data-staff-field="location"] { flex: 1 1 100%; }
    .modelPhotoList__row { flex-wrap: wrap; }
    .modelPhotoList__row .input[data-photo-field="model"],
    .modelPhotoList__row .input[data-photo-field="bodyType"],
    .modelPhotoList__row .input[data-photo-field="photoUrl"],
    .modelPhotoList__row .input[data-photo-field="gradePrefix"],
    .modelPhotoList__row .input[data-photo-field="gradeMarker"] { flex: 1 1 100%; }
    main.view { padding: 10px; }
    .toolbar { padding: 10px; width: calc(100% - 20px); }
    .toolbar .input, .toolbar .checkboxField { flex: 1 1 auto; }
    .homeTypeNav { padding: 10px; width: calc(100% - 20px); }
    .cardGrid { grid-template-columns: 1fr; gap: 12px; }
    .homeRow { gap: 12px; }
    .homeRow__photo { width: 60px; height: 60px; }
    .homeRow__footer { gap: 8px; }
    .homeGradeTabs { margin-left: 72px; padding-left: 12px; }
    .settingsCard, .settingsActions { padding: 18px 16px; }
    .card { padding: 16px 18px; }
    .modal { padding: 0; align-items: flex-end; }
    .modal__panel { max-width: 100%; width: 100%; max-height: 92vh; border-radius: var(--radius) var(--radius) 0 0; }
