<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #0b57bf;
    --on-primary: #ffffff;
    --surface: #ffffff;
    --background: #f1f3f4;
    --on-surface: #202124;
    --on-surface-variant: #5f6368;
    --outline: #dadce0;
    --success: #188038;
    --success-bg: #e6f4ea;
    --warning: #b06000;
    --warning-bg: #fef7e0;
    --danger: #d93025;
    --shadow: 0 1px 2px rgba(60, 64, 67, .3), 0 1px 3px 1px rgba(60, 64, 67, .15);
    --shadow-elevated: 0 2px 6px rgba(60, 64, 67, .3), 0 4px 12px 2px rgba(60, 64, 67, .15);
    --radius: 12px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Roboto', 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: var(--background);
    color: var(--on-surface);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  /* ===== ヘッダー / タブ ===== */
  .topbar {
    background: var(--primary);
    color: var(--on-primary);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .topbar__brand { font-size: 20px; font-weight: 500; white-space: nowrap; }
  .tabs {
    display: flex;
    gap: 4px;
    flex: 1;
    overflow-x: auto;
  }
  .tabs__item {
    background: transparent;
    border: none;
    color: var(--on-primary);
    opacity: .75;
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .tabs__item.is-active { opacity: 1; background: rgba(255, 255, 255, .18); }

  main.view { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .view { display: none; }
  .view.is-active { display: block; }

  /* ===== ツールバー ===== */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    padding: 12px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .toolbar__spacer { flex: 1; }

  .input {
    border: 1px solid var(--outline);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    background: var(--surface);
    color: var(--on-surface);
  }
  .input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .input--search { min-width: 220px; flex: 1 1 220px; }
  .input:disabled { background: var(--background); color: var(--on-surface-variant); cursor: not-allowed; }

  .checkboxField { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--on-surface-variant); }

  .btn {
    border: 1px solid var(--outline);
    background: var(--surface);
    color: var(--on-surface);
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn:hover { background: #f8f9fa; }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn--primary:hover { background: var(--primary-dark); }
  .btn--text { border: none; background: none; color: var(--primary); padding: 8px 10px; }
  .btn--danger { color: var(--danger); }
  .btn--block { width: 100%; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn--icon {
    border: none; background: transparent; font-size: 20px; line-height: 1;
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--on-surface-variant);
  }
  .btn--icon:hover { background: #f1f3f4; }

  /* ===== グループ見出し ===== */
  .group { margin-bottom: 24px; }
  .group__title {
    font-size: 15px;
    font-weight: 500;
    color: var(--on-surface-variant);
    margin: 0 0 10px 4px;
  }

  /* ===== カードグリッド（3.1 6.） ===== */
  .cardGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card__model { font-size: 17px; font-weight: 500; }
  .card__commission { font-size: 12px; color: var(--on-surface-variant); }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge--available { background: var(--success-bg); color: var(--success); }
  .badge--hold { background: var(--warning-bg); color: var(--warning); }
  .badge--disclosed { background: var(--success-bg); color: var(--success); }
  .badge--undisclosed { background: rgba(95, 99, 104, .12); color: var(--on-surface-variant); }
  .card__badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .card__meta { font-size: 13px; color: var(--on-surface-variant); line-height: 1.6; }
  .card__meta strong { color: var(--on-surface); font-weight: 500; }

  .card__holdInfo {
    background: var(--background);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12.5px;
    color: var(--on-surface-variant);
    line-height: 1.6;
  }
  .card__holdInfo b { color: var(--on-surface); }
  .card__holdInfo__row { margin-bottom: 6px; }

  /* ===== Hold 72時間タイマー ===== */
  .holdTimer__bar {
    height: 5px;
    border-radius: 999px;
    background: var(--outline);
    overflow: hidden;
  }
  .holdTimer__barFill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: var(--primary);
    transition: width 1s linear;
  }
  .holdTimer--warning .holdTimer__barFill { background: var(--warning); }
  .holdTimer--expired .holdTimer__barFill { background: var(--danger); width: 0% !important; }
  .holdTimer__text {
    margin-top: 4px;
    font-size: 12px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--on-surface-variant);
  }
  .holdTimer--warning .holdTimer__text { color: var(--warning); }
  .holdTimer--expired .holdTimer__text { color: var(--danger); }

  .card__actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
  .card__actions .btn { flex: 1; }

  .emptyState {
    text-align: center;
    color: var(--on-surface-variant);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* ===== 受注リスト（テーブル寄りのカード） ===== */
  .orderCard { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .orderCard + .orderCard { margin-top: 10px; }
  .orderCard__grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 6px 16px;
    font-size: 13.5px;
  }
  .orderCard__grid dt { color: var(--on-surface-variant); font-size: 12px; margin-bottom: 2px; }
  .orderCard__grid dd { margin: 0; font-weight: 500; }

  /* ===== 設定画面 ===== */
  .settingsCard {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .formField { display: flex; flex-direction: column; gap: 6px; }
  .formField label { font-size: 13px; font-weight: 500; color: var(--on-surface-variant); }
  .formField .input { width: 100%; }
  .formField.hidden { display: none; }
  .colorField { display: flex; align-items: center; gap: 10px; }
  .colorField input[type=color] { width: 44px; height: 36px; border: 1px solid var(--outline); border-radius: 8px; padding: 2px; }
  .optionSlots { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; }
  .optionSlots .input { padding: 8px 6px; text-align: center; }

  /* ===== 担当者マスタ ===== */
  .staffList { display: flex; flex-direction: column; gap: 6px; }
  .staffList__row { display: flex; gap: 8px; align-items: center; }
  .staffList__row .input { flex: 1; }
  .staffList__empty { font-size: 13px; color: var(--on-surface-variant); }

  /* ===== モーダル ===== */
  .modal {
    position: fixed; inset: 0; background: rgba(32, 33, 36, .5);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal__panel {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-elevated);
    width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
  }
  .modal__header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--outline); }
  .modal__header h2 { font-size: 17px; font-weight: 500; margin: 0; }
  .modal__body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal__footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--outline); }
  .modal__error { color: var(--danger); font-size: 13px; }

  /* ===== トースト ===== */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #323232; color: #fff; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; box-shadow: var(--shadow-elevated); z-index: 200;
  }
  .toast--error { background: var(--danger); }

  @media (max-width: 600px) {
    .topbar { padding: 10px 12px; gap: 10px; }
    .topbar__brand { font-size: 16px; }
    main.view { padding: 10px; }
    .toolbar { padding: 10px; }
    .cardGrid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .holdTimer__barFill { transition: none; }
  }
</style>
