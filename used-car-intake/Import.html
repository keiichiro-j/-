<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; color: #222; margin: 0; padding: 12px 16px; }
    h2 { font-size: 14px; margin: 8px 0; }
    p.hint { color: #666; font-size: 12px; margin: 4px 0 10px; }
    label { display: block; margin: 8px 0 2px; font-weight: bold; }
    textarea, input[type=number] { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #bbb; border-radius: 4px; font-size: 12px; }
    textarea { height: 56px; font-family: monospace; }
    button { padding: 8px 16px; border-radius: 4px; border: 1px solid #1a73e8; background: #1a73e8; color: #fff; font-size: 13px; cursor: pointer; margin-right: 6px; }
    button.secondary { background: #fff; color: #1a73e8; }
    button:disabled { opacity: .5; cursor: default; }
    .bar { height: 8px; background: #e8eaed; border-radius: 4px; overflow: hidden; margin: 12px 0 4px; }
    .bar > div { height: 100%; width: 0; background: #1a73e8; transition: width .3s; }
    #status { font-size: 12px; color: #444; }
    #log { height: 190px; overflow-y: auto; background: #f6f8fa; border-radius: 4px; padding: 6px 8px; font-size: 12px; margin-top: 8px; }
    #log div { padding: 2px 0; border-bottom: 1px dotted #ddd; }
    #log .ng { color: #a50e0e; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 12px; }
    th, td { border: 1px solid #ddd; padding: 4px 6px; text-align: left; }
    th { background: #f1f3f4; }
    td.num { text-align: right; }
    .good { background: #d9ead3; } .bad { background: #f4cccc; } .hand { background: #fff2cc; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="importPane" class="hidden">
    <h2>受付フォルダの書類を取込</h2>
    <p class="hint">受付フォルダのファイルを1件ずつ読み取り、「取込待ち」シートに追加します。マスタには書き込みません（確認・承認後に転記します）。</p>
    <button id="importBtn" onclick="startImport()">取込を開始</button>
    <button class="secondary" onclick="google.script.run.showReviewSidebar()">取込待ちを確認</button>
  </div>

  <div id="testPane" class="hidden">
    <h2>精度テスト</h2>
    <p class="hint">過去のスキャン書類を読ませ、入力済みの管理表を正解として項目ごとの正答率を測ります。本番のマスタへの書き込み・ファイルの移動は一切しません。結果は「精度テスト結果」シートに出力します（前回の結果は消去されます）。</p>
    <label for="folders">対象フォルダ（URLまたはID。複数は改行区切り）</label>
    <textarea id="folders"></textarea>
    <label for="count">件数（新しい順）</label>
    <input type="number" id="count" min="1" max="200" value="40">
    <div style="margin-top:10px">
      <button id="testBtn" onclick="startTest()">精度テストを開始</button>
    </div>
  </div>

  <div class="bar"><div id="progress"></div></div>
  <div id="status"></div>
  <div id="log"></div>
  <div id="summary"></div>

  <script>
    var MODE = '<?= mode ?>';

    function el(id) { return document.getElementById(id); }
    function call(fn) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        runner[fn].apply(runner, args);
      });
    }
    function log(text, ng) {
      var d = document.createElement('div');
      d.textContent = text;
      if (ng) d.className = 'ng';
      el('log').appendChild(d);
      el('log').scrollTop = el('log').scrollHeight;
    }
    function progress(done, total, text) {
      el('progress').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
      el('status').textContent = text;
    }
    function escapeHtml(s) {
      return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    if (MODE === 'test') {
      el('testPane').classList.remove('hidden');
      call('getAccuracyTestDefaults').then(function (d) {
        el('folders').value = d.folderIds;
        el('count').value = d.count;
      });
    } else {
      el('importPane').classList.remove('hidden');
    }

    async function startImport() {
      el('importBtn').disabled = true;
      el('log').innerHTML = '';
      try {
        progress(0, 0, '受付フォルダを確認しています…');
        var files = await call('getInboxFiles');
        if (!files.length) { progress(0, 0, '受付フォルダに書類はありません'); return; }
        var ok = 0;
        for (var i = 0; i < files.length; i++) {
          progress(i, files.length, (i + 1) + ' / ' + files.length + '件目を読み取り中：' + files[i].name);
          try {
            var r = await call('importFileNow', files[i].id);
            if (r.ok) ok++;
            log(r.message, !r.ok && !r.skipped);
            if (r.quota) {
              progress(i, files.length, '中断：Gemini APIの上限に達しました。残り' + (files.length - i) + '件は受付フォルダに残っています（上限が戻れば定期取込または再実行で取り込みます）');
              return;
            }
          } catch (e) {
            log(files[i].name + '：' + e.message, true);
          }
        }
        progress(files.length, files.length, '完了：' + ok + ' / ' + files.length + '件を取込待ちに追加しました');
      } catch (e) {
        progress(0, 0, 'エラー：' + e.message);
      } finally {
        el('importBtn').disabled = false;
      }
    }

    async function startTest() {
      if (!confirm('精度テストを開始します。前回の「精度テスト結果」は消去されます。よろしいですか？')) return;
      el('testBtn').disabled = true;
      el('log').innerHTML = '';
      el('summary').innerHTML = '';
      try {
        progress(0, 0, '対象ファイルを選んでいます…');
        var start = await call('startAccuracyTest', el('folders').value, Number(el('count').value));
        var files = start.files;
        for (var i = 0; i < files.length; i++) {
          progress(i, files.length, (i + 1) + ' / ' + files.length + '件目：' + files[i].name);
          try {
            var r = await call('runAccuracyTestFile', start.runId, files[i].id);
            log(r.message, !r.ok);
            if (r.quota) { log('Gemini APIの上限に達したため、ここまでの' + i + '件で集計します', true); files = files.slice(0, i); break; }
          } catch (e) {
            log(files[i].name + '：' + e.message, true);
          }
        }
        progress(files.length, files.length, '集計しています…');
        var summary = await call('finalizeAccuracyTest', start.runId);
        progress(files.length, files.length, '完了：「精度テスト結果」シートに出力しました');
        renderSummary(summary);
      } catch (e) {
        progress(0, 0, 'エラー：' + e.message);
      } finally {
        el('testBtn').disabled = false;
      }
    }

    function pct(v) { return (v * 100).toFixed(1) + '%'; }

    function renderSummary(rows) {
      if (!rows.length) { el('summary').textContent = '採点できた項目がありません（管理表と照合できる書類がありませんでした）'; return; }
      var html = '<table><tr><th>項目</th><th>種類</th><th>件数</th><th>正答率</th><th>要確認</th><th>見逃し誤り</th><th>判定（案）</th></tr>';
      rows.forEach(function (r) {
        var cls = r.kind === '手書き' ? 'hand' : (r.rate >= 0.98 ? 'good' : 'bad');
        html += '<tr><td>' + escapeHtml(r.label) + '</td><td>' + r.kind + '</td><td class="num">' + r.total +
          '</td><td class="num ' + cls + '">' + pct(r.rate) + '</td><td class="num">' + pct(r.flaggedRate) +
          '</td><td class="num">' + r.silentErrors + '</td><td>' + escapeHtml(r.verdict) + '</td></tr>';
      });
      el('summary').innerHTML = html + '</table>';
    }
  </script>
</body>
</html>
