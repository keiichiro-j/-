<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; color: #222; margin: 0; padding: 12px 16px 70px; }
    p.hint, .hint { color: #666; font-size: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .col { display: flex; flex-direction: column; min-width: 0; }
    .col label { font-weight: bold; margin-bottom: 2px; display: flex; justify-content: space-between; }
    .col label span { font-weight: normal; color: #666; font-size: 11px; }
    textarea { width: 100%; box-sizing: border-box; height: 230px; padding: 6px; border: 1px solid #bbb; border-radius: 4px; font-size: 12px; line-height: 1.5; font-family: inherit; }
    details { margin-top: 14px; }
    summary { cursor: pointer; font-weight: bold; }
    #shareText { height: 90px; font-family: monospace; }
    .actions { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #ddd; padding: 10px 16px; display: flex; gap: 8px; align-items: center; }
    button { padding: 8px 16px; border-radius: 4px; border: 1px solid #1a73e8; background: #1a73e8; color: #fff; font-size: 13px; cursor: pointer; }
    button.secondary { background: #fff; color: #1a73e8; }
    button:disabled { opacity: .5; cursor: default; }
    #msg { font-size: 12px; }
    #msg.error { color: #a50e0e; }
  </style>
</head>
<body>
  <p class="hint">1行に1つずつ入力します。カタカナは保存時に半角カナへ揃えます。メーカーと色は「値: 別名,別名」の形で別名を書くと、入力や読み取りで別名が来たときに自動でその値へ置き換えます（例：<code>MB: メルセデス,ベンツ</code>）。</p>
  <div class="grid" id="grid"></div>

  <details>
    <summary>3社で同じ選択肢を使う（コピー／貼り付け）</summary>
    <p class="hint">この会社の選択肢をコピーし、他社のスプレッドシートで同じ画面を開いて貼り付け、「貼り付けた内容を反映」→「保存」を押してください。</p>
    <textarea id="shareText" aria-label="選択肢の共有テキスト"></textarea>
    <div style="margin-top:6px;display:flex;gap:8px">
      <button class="secondary" type="button" onclick="exportLists()">この会社の選択肢を書き出す</button>
      <button class="secondary" type="button" onclick="importLists()">貼り付けた内容を反映</button>
    </div>
  </details>

  <div class="actions">
    <button id="save" onclick="save()">保存</button>
    <button class="secondary" onclick="google.script.host.close()">閉じる</button>
    <span id="msg"></span>
  </div>

  <script>
    var columns = [];

    function el(id) { return document.getElementById(id); }
    function message(text, isError) { el('msg').textContent = text || ''; el('msg').className = isError ? 'error' : ''; }
    function count(text) { return text.split(/\r?\n/).filter(function (l) { return l.trim(); }).length; }

    google.script.run.withSuccessHandler(function (res) {
      columns = res.columns;
      el('grid').innerHTML = columns.map(function (c) {
        return '<div class="col"><label for="list_' + c.list + '">' + c.label + '<span id="count_' + c.list + '"></span></label>' +
          '<textarea id="list_' + c.list + '" spellcheck="false"></textarea></div>';
      }).join('');
      columns.forEach(function (c) {
        var ta = el('list_' + c.list);
        ta.value = res.lists[c.list] || '';
        var update = function () { el('count_' + c.list).textContent = count(ta.value) + '件'; };
        ta.addEventListener('input', update);
        update();
      });
    }).withFailureHandler(function (e) { message(e.message, true); }).getListsForEdit();

    function collect() {
      var data = {};
      columns.forEach(function (c) { data[c.list] = el('list_' + c.list).value; });
      return data;
    }

    function save() {
      el('save').disabled = true;
      message('保存しています…');
      google.script.run
        .withSuccessHandler(function (res) { el('save').disabled = false; message(res.message); })
        .withFailureHandler(function (e) { el('save').disabled = false; message('エラー：' + e.message, true); })
        .saveLists(collect());
    }

    function exportLists() {
      el('shareText').value = JSON.stringify(collect());
      el('shareText').select();
      message('書き出しました。選択された文字をコピーしてください。');
    }

    function importLists() {
      try {
        var data = JSON.parse(el('shareText').value);
        columns.forEach(function (c) {
          if (typeof data[c.list] === 'string') {
            el('list_' + c.list).value = data[c.list];
            el('list_' + c.list).dispatchEvent(new Event('input'));
          }
        });
        message('反映しました。内容を確認して「保存」を押してください。');
      } catch (e) {
        message('貼り付けた内容を読み取れません。「この会社の選択肢を書き出す」で出した文字をそのまま貼り付けてください。', true);
      }
    }
  </script>
</body>
</html>
