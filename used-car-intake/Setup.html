<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; color: #222; margin: 0; padding: 12px 16px; }
    h2 { font-size: 14px; margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #ddd; }
    label { display: block; margin: 8px 0 2px; font-weight: bold; }
    .hint { color: #666; font-size: 11px; font-weight: normal; }
    input[type=text], input[type=password], input[type=number], select { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #bbb; border-radius: 4px; font-size: 13px; }
    .row { display: flex; gap: 8px; } .row > div { flex: 1; min-width: 0; }
    .check { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-weight: normal; }
    .actions { position: sticky; bottom: 0; background: #fff; padding: 12px 0 4px; display: flex; gap: 8px; }
    button { padding: 8px 16px; border-radius: 4px; border: 1px solid #1a73e8; background: #1a73e8; color: #fff; font-size: 13px; cursor: pointer; }
    button.secondary { background: #fff; color: #1a73e8; }
    button:disabled { opacity: .5; cursor: default; }
    #result { white-space: pre-wrap; background: #f6f8fa; border-radius: 4px; padding: 8px; margin-top: 8px; display: none; }
    #result.error { background: #fdecea; color: #a50e0e; }
  </style>
</head>
<body>
  <div id="sheetName" class="hint"></div>

  <h2>会社</h2>
  <label for="company">会社名 <span class="hint">（AU・C7・MB など）</span></label>
  <input type="text" id="company" list="companyList" placeholder="例：AU">
  <datalist id="companyList"><option value="AU"><option value="C7"><option value="MB"></datalist>

  <h2>自動読み取り（Gemini）</h2>
  <div class="hint">読み取りは補助機能です。1ファイルにつき Gemini は1回だけ呼び、1日の上限を超えた分は翌日に回します。</div>
  <label for="geminiKey">APIキー <span class="hint" id="keyState"></span></label>
  <input type="password" id="geminiKey" autocomplete="off" placeholder="変更する場合のみ入力">
  <div class="hint">スクリプトプロパティに保存され、コードには書き込まれません。漏えいした旧キーは必ず再発行してください。</div>
  <div class="row">
    <div><label for="geminiModel">モデル</label><input type="text" id="geminiModel" placeholder="gemini-2.5-flash"></div>
    <div><label for="dailyLimit">1日の処理上限（件） <span class="hint" id="todayCount"></span></label><input type="number" id="dailyLimit" min="0" max="1000"></div>
  </div>
  <div class="row">
    <div><label for="geminiIntervalSec">呼び出し間隔（秒） <span class="hint">無料枠は7秒以上を推奨</span></label><input type="number" id="geminiIntervalSec" min="0" max="60"></div>
    <div><label for="unknownTarget">輸入車／国産車を判別できない場合の登録先</label><select id="unknownTarget"></select></div>
  </div>
  <label class="check"><input type="checkbox" id="readCert"> 車検証も読み取る <span class="hint">（回数に余裕がある場合。無効の間は査定書だけを読み取ります）</span></label>

  <h2>ドライブのフォルダ</h2>
  <div class="hint">空欄のままにすると「中古車書類_会社名」フォルダの中に自動で作成します。既存のフォルダを使う場合はURLかIDを入力してください。</div>
  <label for="folderRoot">親フォルダ <span class="hint">（自動作成先。任意）</span></label>
  <input type="text" id="folderRoot">
  <div class="row">
    <div><label for="folderInbox">受付</label><input type="text" id="folderInbox"></div>
    <div><label for="folderDone">処理済み</label><input type="text" id="folderDone"></div>
  </div>
  <div class="row">
    <div><label for="folderError">エラー</label><input type="text" id="folderError"></div>
    <div><label for="folderCert">車検証保管 <span class="hint">（ファイル名がOCNならリンクを付与）</span></label><input type="text" id="folderCert"></div>
  </div>

  <h2>定期実行・入力チェック</h2>
  <div class="row">
    <div>
      <label for="triggerMinutes">自動読み取り・車検証リンクの定期実行</label>
      <select id="triggerMinutes">
        <option value="0">なし（メニューから手動）</option>
        <option value="15">15分ごと</option>
        <option value="30">30分ごと</option>
        <option value="60">1時間ごと</option>
        <option value="180">3時間ごと</option>
      </select>
    </div>
    <div><label for="expiryDays">車検満了が近い車両の強調（日前から）</label><input type="number" id="expiryDays" min="0" max="365"></div>
  </div>

  <label class="check"><input type="checkbox" id="backup" checked> 実行前にスプレッドシートのバックアップを作成する</label>

  <div id="result"></div>

  <div class="actions">
    <button id="run" onclick="run()">セットアップを実行</button>
    <button class="secondary" onclick="google.script.host.close()">閉じる</button>
  </div>

  <script>
    var FIELDS = ['company', 'geminiModel', 'dailyLimit', 'geminiIntervalSec', 'folderRoot', 'folderInbox', 'folderDone', 'folderError', 'folderCert', 'triggerMinutes', 'expiryDays'];

    function el(id) { return document.getElementById(id); }

    function showResult(text, isError) {
      var r = el('result');
      r.textContent = text;
      r.className = isError ? 'error' : '';
      r.style.display = 'block';
      r.scrollIntoView({ block: 'nearest' });
    }

    function load(s) {
      FIELDS.forEach(function (k) { if (s[k] !== undefined && s[k] !== null) el(k).value = s[k]; });
      el('readCert').checked = s.readCert;
      el('unknownTarget').innerHTML = s.masterSheets.map(function (n) {
        return '<option' + (n === s.unknownTarget ? ' selected' : '') + '>' + n + '</option>';
      }).join('');
      el('keyState').textContent = s.hasGeminiKey ? '（設定済み）' : '（未設定）';
      el('todayCount').textContent = '本日 ' + s.todayCount + '件読み取り済み';
      el('sheetName').textContent = '対象：' + s.spreadsheetName;
    }

    google.script.run.withSuccessHandler(load)
      .withFailureHandler(function (e) { showResult(e.message, true); })
      .getSetupState();

    function run() {
      var form = {};
      FIELDS.forEach(function (k) { form[k] = el(k).value; });
      form.geminiKey = el('geminiKey').value;
      form.readCert = el('readCert').checked;
      form.unknownTarget = el('unknownTarget').value;
      form.backup = el('backup').checked;
      if (!form.company) { showResult('会社名を入力してください', true); return; }
      el('run').disabled = true;
      showResult('実行中です…（シート・書式・プルダウン・フォルダ・トリガーを準備しています）');
      google.script.run
        .withSuccessHandler(function (res) {
          el('run').disabled = false;
          el('geminiKey').value = '';
          showResult('セットアップが完了しました。\n\n・' + res.report.join('\n・'));
          google.script.run.withSuccessHandler(load).getSetupState();
        })
        .withFailureHandler(function (e) {
          el('run').disabled = false;
          showResult('エラー：' + e.message, true);
        })
        .runSetup(form);
    }
  </script>
</body>
</html>
