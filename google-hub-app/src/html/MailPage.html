<!-- メールタブ専用の2カラム画面（左：件名一覧／右：本文）。
     ホーム画面のメールウィジェット(MailCard.html)とは別の独立したDOMで、
     常に #view-mail の内側に存在するため、右サイドバーの表示/非表示に影響されない。 -->
<section class="card mail-page">
  <div class="mail-page-list-col">
    <div class="mail-page-toolbar">
      <h2 style="margin:0; font-size:15px;">
        <span class="h2-label"><svg class="icon"><use href="#icon-mail"></use></svg>メール</span>
      </h2>
      <span class="card-actions">
        <button type="button" class="icon-only" id="btn-mailpage-compose" aria-label="メールを作成" title="メールを作成"><svg class="icon icon-sm"><use href="#icon-plus"></use></svg></button>
        <button type="button" class="icon-only" id="btn-mailpage-refresh" aria-label="更新" title="更新"><svg class="icon icon-sm"><use href="#icon-refresh"></use></svg></button>
      </span>
    </div>
    <div id="mail-page-list">
      <div class="empty-hint">読み込み中...</div>
    </div>
  </div>

  <div class="mail-page-reader-col" id="mail-page-reader">
    <div class="empty-hint">左の一覧からメールを選択してください</div>
  </div>
</section>

<div class="modal-backdrop" id="mailpage-compose-modal" hidden>
  <div class="modal-box">
    <h3>メールを作成</h3>

    <label for="mailpage-compose-to">宛先</label>
    <input type="text" id="mailpage-compose-to" placeholder="a@example.com">

    <label for="mailpage-compose-subject">件名</label>
    <input type="text" id="mailpage-compose-subject">

    <label for="mailpage-compose-body">本文</label>
    <textarea id="mailpage-compose-body" rows="6"></textarea>

    <div class="modal-footer">
      <button type="button" id="btn-mailpage-compose-cancel">キャンセル</button>
      <button type="button" id="btn-mailpage-compose-send" class="primary">送信</button>
    </div>
  </div>
</div>
