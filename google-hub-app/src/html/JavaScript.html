  function renderAppList(apps) {
    renderAppTagFilterBar(apps);
    var container = qs('app-list');
    if (apps.length === 0) {
      container.innerHTML = '<div class="empty-hint">URLを貼り付けて登録してください</div>';
      return;
    }
    var filtered = state.appLedger.tagFilter
      ? apps.filter(function (app) { return (app.tags || []).indexOf(state.appLedger.tagFilter) !== -1; })
      : apps;
    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-hint">該当するタグの登録がありません</div>';
      return;
    }
    // タグ絞り込み中は一覧が全体の一部だけになるため、ここで並び替えると絞り込みで隠れている
    // 項目の順序を壊してしまう（reorderApps()は渡されたIDリストにない項目を末尾へ寄せるため）。
    // 「すべて」表示中のみドラッグ操作を許可する。
    var reorderable = !state.appLedger.tagFilter;
    container.innerHTML = filtered.map(function (app) {
      var tagsHtml = (app.tags && app.tags.length > 0)
        ? '<div class="tag-list">' + app.tags.map(function (t) { return '<span class="tag-chip">' + escapeHtml(t) + '</span>'; }).join('') + '</div>'
        : '';
      return '<div class="link-row" draggable="' + reorderable + '" data-app-id="' + escapeHtml(app.id) + '">' +
        (reorderable ? '<svg class="icon icon-sm widget-block-drag-handle app-drag-handle" title="ドラッグして並び替え"><use href="#icon-grip"></use></svg>' : '') +
        '<div>' +
        '<div class="name"><a href="' + escapeHtml(app.url) + '" target="_blank" rel="noopener" title="' + escapeHtml(app.url) + '">' + escapeHtml(app.name) + '</a> ' +
        '<span class="status-badge ' + app.status + '">' + statusLabel(app.status) + '</span></div>' +
        tagsHtml +
        '<div class="name-edit-row" hidden>' +
        '<input type="text" class="name-edit-input" placeholder="登録名称">' +
        '<button type="button" class="btn-name-save">保存</button>' +
        '</div>' +
        '<div class="tag-edit-row" hidden>' +
        '<input type="text" class="tag-edit-input" placeholder="タグをカンマ区切りで入力">' +
        '<button type="button" class="btn-tag-save">保存</button>' +
        '</div>' +
        '</div>' +
        '<span>' +
        '<button type="button" class="icon-only btn-app-name-edit" aria-label="名称を変更" title="名称を変更"><svg class="icon icon-sm"><use href="#icon-edit"></use></svg></button>' +
        '<button type="button" class="icon-only btn-app-tag-edit" aria-label="タグを編集" title="タグを編集"><svg class="icon icon-sm"><use href="#icon-tag"></use></svg></button>' +
        '<button type="button" class="icon-only btn-app-delete" aria-label="削除" title="削除"><svg class="icon icon-sm"><use href="#icon-trash"></use></svg></button>' +
        '</span>' +
        '</div>';
    }).join('');

    initAppDragDrop(container, filtered);
    Array.prototype.forEach.call(container.querySelectorAll('.btn-app-delete'), function (btn) {
      btn.addEventListener('click', function () {
        if (!window.confirm('このリンクを台帳から削除しますか？')) return;
        var row = btn.closest('[data-app-id]');
        var id = row.getAttribute('data-app-id');
        gasRun('deleteApp', id).then(function () { removeAppFromState(id); }).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-app-name-edit'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-app-id]');
        var editRow = row.querySelector('.name-edit-row');
        var app = filtered.filter(function (a) { return a.id === row.getAttribute('data-app-id'); })[0];
        editRow.querySelector('.name-edit-input').value = app ? app.name : '';
        editRow.hidden = !editRow.hidden;
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-name-save'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-app-id]');
        var input = row.querySelector('.name-edit-input');
        var name = input.value.trim();
        if (!name) { window.alert('名称を入力してください'); return; }
        gasRun('updateAppName', row.getAttribute('data-app-id'), name).then(replaceAppInState).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-app-tag-edit'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-app-id]');
        var editRow = row.querySelector('.tag-edit-row');
        var app = filtered.filter(function (a) { return a.id === row.getAttribute('data-app-id'); })[0];
        editRow.querySelector('.tag-edit-input').value = app ? app.tags.join(', ') : '';
        editRow.hidden = !editRow.hidden;
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-tag-save'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-app-id]');
        var input = row.querySelector('.tag-edit-input');
        var tags = input.value.split(',').map(function (t) { return t.trim(); }).filter(function (t) { return t.length > 0; });
        gasRun('updateAppTags', row.getAttribute('data-app-id'), tags).then(replaceAppInState).catch(showError);
      });
    });
  }

  // ===================== アプリ台帳: サーバー往復を最小限にするローカル状態更新ヘルパー =====================
  // 名称変更・タグ編集はいずれもサーバー側で更新後の1件分(AppLedgerEntry)を返すため、
  // ホーム全体(Calendar/Gmail/Sheets等)を読み直すloadHome()は不要で、その1件だけを
  // state.home.appsの中で差し替えて一覧を再描画すれば足りる。
  function replaceAppInState(updatedApp) {
    if (!state.home || !updatedApp) return;
    state.home.apps = state.home.apps.map(function (a) { return a.id === updatedApp.id ? updatedApp : a; });
    renderAppList(state.home.apps);
  }

  function removeAppFromState(id) {
    if (!state.home) return;
    state.home.apps = state.home.apps.filter(function (a) { return a.id !== id; });
    renderAppList(state.home.apps);
  }

  function addAppToState(newApp) {
    if (!state.home || !newApp) return;
    state.home.apps = state.home.apps.concat([newApp]);
    renderAppList(state.home.apps);
  }

  // ===================== アプリ台帳: 一覧の並び替え（ドラッグ&ドロップ） =====================
  // カスタムナビ項目の並び替え(initCustomNavDragDrop)と同じ考え方。ホームのコンパクト
  // ウィジェットではドラッグハンドル自体をCSSで非表示にしている(Assets.html)ため、
  // 実際に並び替え操作ができるのはアプリリンク集タブのみ。
  var draggingAppRow = null;

  function appRowInsertionTarget(container, y) {
    var rows = Array.prototype.slice.call(container.querySelectorAll('.link-row[data-app-id]:not(.is-dragging)'));
    var result = null;
    var closestOffset = -Infinity;
    rows.forEach(function (row) {
      var box = row.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closestOffset) {
        closestOffset = offset;
        result = row;
      }
    });
    return result;
  }

  function initAppDragDrop(container, apps) {
    Array.prototype.forEach.call(container.querySelectorAll('.link-row[data-app-id]'), function (row) {
      row.addEventListener('dragstart', function (e) {
        draggingAppRow = row;
        row.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', row.getAttribute('data-app-id')); } catch (err) { /* Firefox以外は不要 */ }
      });
      row.addEventListener('dragend', function () {
        row.classList.remove('is-dragging');
        draggingAppRow = null;
      });
    });

    container.addEventListener('dragover', function (e) {
      if (!draggingAppRow) return;
      e.preventDefault();
      var after = appRowInsertionTarget(container, e.clientY);
      if (after) {
        container.insertBefore(draggingAppRow, after);
      } else {
        container.appendChild(draggingAppRow);
      }
    });

    container.addEventListener('drop', function (e) {
      e.preventDefault();
      if (!draggingAppRow) return;
      var orderedIds = Array.prototype.map.call(container.querySelectorAll('.link-row[data-app-id]'), function (row) {
        return row.getAttribute('data-app-id');
      });
      gasRun('reorderApps', orderedIds).then(function (reordered) {
        state.home.apps = reordered;
        renderAppList(reordered);
      }).catch(showError);
    });
  }

  function initAppLedger() {
    qs('btn-links-title').addEventListener('click', function () { switchView('links'); });
    qs('btn-check-all').addEventListener('click', function (e) {
      withSpinner(e.currentTarget, function () {
        return gasRun('checkAllApps').then(function (apps) {
          state.home.apps = apps;
          renderAppList(apps);
        }).catch(showError);
      });
    });

    qs('btn-app-add-open').addEventListener('click', function () {
      qs('app-add-url').value = '';
      qs('app-add-name').value = '';
      qs('app-add-modal').hidden = false;
      qs('app-add-url').focus();
    });
    qs('btn-app-add-cancel').addEventListener('click', function () { qs('app-add-modal').hidden = true; });
    qs('btn-app-add-save').addEventListener('click', function () {
      var url = qs('app-add-url').value.trim();
      if (!url) { window.alert('URLを入力してください'); return; }
      var name = qs('app-add-name').value.trim();
      gasRun('addApp', url, name).then(function (newApp) {
        qs('app-add-modal').hidden = true;
        addAppToState(newApp);
      }).catch(showError);
    });
    qs('app-add-url').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') qs('btn-app-add-save').click();
    });
    qs('app-add-name').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') qs('btn-app-add-save').click();
    });
  }

  // ===================== ToDoリスト =====================
  var TODO_PRIORITY_LABELS = { low: '低', medium: '中', high: '高' };

  function formatDueDateLabel(dueDate) {
    var parts = dueDate.split('-').map(function (n) { return parseInt(n, 10); });
    return parts[1] + '/' + parts[2];
  }

  function isOverdue(dueDate, done) {
    if (!dueDate || done) return false;
    return dueDate < ymd(new Date());
  }

  // 今日中の件数バッジ（左ナビの「ToDo」タブ）を更新する。メールの未読数バッジと同じ考え方で、
  // 「期限日が今日以前（期限切れを含む）でまだ完了していない」件数を表示する。
  function updateTodoBadge(todos) {
    var navBadge = qs('nav-todo-badge');
    if (!navBadge) return;
    var today = ymd(new Date());
    var dueCount = (todos || []).filter(function (t) { return !t.done && t.dueDate && t.dueDate <= today; }).length;
    navBadge.textContent = dueCount > 9 ? '9+' : String(dueCount);
    navBadge.hidden = dueCount === 0;
  }

  function renderTodoList(todos) {
    var container = qs('todo-list');
    if (!container) return;
    updateTodoBadge(todos);
    if (!todos || todos.length === 0) {
      container.innerHTML = '<div class="empty-hint">やることがありません</div>';
      return;
    }
    // 期限日が近い順（未設定は最後）→ 優先度(高いほど先)の順に並び替える
    var priorityOrder = { high: 0, medium: 1, low: 2 };
    var sorted = todos.slice().sort(function (a, b) {
      if (!!a.dueDate !== !!b.dueDate) return a.dueDate ? -1 : 1;
      if (a.dueDate && a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
      return priorityOrder[a.priority] - priorityOrder[b.priority];
    });
    container.innerHTML = sorted.map(function (t) {
      var overdue = isOverdue(t.dueDate, t.done);
      var dueBadge = t.dueDate ? '<span class="todo-due-badge' + (overdue ? ' overdue' : '') + '">' + formatDueDateLabel(t.dueDate) + '</span>' : '';
      return '<div class="todo-row" data-todo-id="' + escapeHtml(t.id) + '">' +
        '<div class="todo-main">' +
        '<input type="checkbox" class="todo-check"' + (t.done ? ' checked' : '') + '>' +
        '<span class="todo-priority-dot ' + t.priority + '" title="優先度: ' + TODO_PRIORITY_LABELS[t.priority] + '"></span>' +
        '<span class="todo-text' + (t.done ? ' done' : '') + '">' + escapeHtml(t.text) + '</span>' +
        '</div>' +
        dueBadge +
        '<button type="button" class="icon-only todo-delete" aria-label="削除" title="削除"><svg class="icon icon-sm"><use href="#icon-trash"></use></svg></button>' +
        '</div>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.todo-check'), function (cb) {
      cb.addEventListener('change', function () {
        var id = cb.closest('[data-todo-id]').getAttribute('data-todo-id');
        gasRun('toggleTodo', id).then(function (todos) {
          state.home.todos = todos;
          renderTodoList(todos);
          return loadCalendarForCurrentMode();
        }).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.todo-delete'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('[data-todo-id]').getAttribute('data-todo-id');
        gasRun('deleteTodo', id).then(function (todos) {
          state.home.todos = todos;
          renderTodoList(todos);
          return loadCalendarForCurrentMode();
        }).catch(showError);
      });
    });
  }

  function addTodoAndRefresh(text, dueDate, priority) {
    return gasRun('addTodo', text, dueDate, priority).then(function (todos) {
      state.home.todos = todos;
      renderTodoList(todos);
      return loadCalendarForCurrentMode();
    });
  }

  // 期限日(YYYY-MM-DD)2つの差を日数で返す（純粋関数。b - a）
  function daysBetweenYmd(a, b) {
    var da = new Date(a + 'T00:00:00');
    var db = new Date(b + 'T00:00:00');
    return Math.round((db.getTime() - da.getTime()) / 86400000);
  }

  // 期限日から優先度を自動判定する（純粋関数）。手動選択の代わりに、
  // 「今日・明日・明後日まで＝高」「1週間以内＝中」「それ以降＝低」の3段階に振り分ける。
  // 期限切れ(過去の日付)も残り日数が0以下になるため自動的に「高」に含まれる。
  // 期限日が未設定の場合はクイック追加と同じ既定値「中」にする。
  function priorityFromDueDate(dueDate) {
    if (!dueDate) return 'medium';
    var diff = daysBetweenYmd(ymd(new Date()), dueDate);
    if (diff <= 2) return 'high';
    if (diff <= 7) return 'medium';
    return 'low';
  }

  function updateTodoPriorityPreview() {
    var dueDate = qs('todo-modal-due').value || null;
    var priority = priorityFromDueDate(dueDate);
    var reason = !dueDate ? '（期限日未設定のため既定値）' : priority === 'high' ? '（期限まで残りわずか）' : priority === 'medium' ? '（1週間以内）' : '（期限に余裕あり）';
    qs('todo-modal-priority-preview').innerHTML =
      '<span class="todo-priority-dot ' + priority + '"></span>優先度: ' + TODO_PRIORITY_LABELS[priority] + reason;
  }

  function initTodo() {
    qs('btn-todo-title').addEventListener('click', function () { switchView('todo'); });

    // クイック追加: 期限日なし・優先度「中」で即座に追加する（Enterキー1つで完結する速さを優先）。
    qs('btn-todo-add').addEventListener('click', function () {
      var input = qs('todo-input');
      var text = input.value.trim();
      if (!text) { window.alert('内容を入力してください'); return; }
      addTodoAndRefresh(text, null, 'medium').then(function () {
        input.value = '';
      }).catch(showError);
    });
    qs('todo-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') qs('btn-todo-add').click();
    });

    // 期限日を指定して追加: ポップアップ側で入力する。以前はツールバー直下に隠しておいた
    // 入力欄を展開する方式だったが、ホームのコンパクトウィジェットではカードの高さが小さく、
    // 展開すると入力欄自体がカードの外側(overflow:hiddenでクリップされる領域)へはみ出して
    // 操作できなくなってしまっていたため、カードの大きさに左右されないポップアップに変更した。
    // 優先度は手動選択をやめ、期限日から自動的に決まる（priorityFromDueDate()）。
    qs('btn-todo-detail-open').addEventListener('click', function () {
      qs('todo-modal-text').value = qs('todo-input').value.trim();
      qs('todo-modal-due').value = '';
      updateTodoPriorityPreview();
      qs('todo-add-modal').hidden = false;
      qs('todo-modal-text').focus();
    });
    qs('todo-modal-due').addEventListener('change', updateTodoPriorityPreview);
    qs('btn-todo-modal-cancel').addEventListener('click', function () { qs('todo-add-modal').hidden = true; });
    qs('btn-todo-modal-save').addEventListener('click', function () {
      var text = qs('todo-modal-text').value.trim();
      if (!text) { window.alert('内容を入力してください'); return; }
      var dueDate = qs('todo-modal-due').value || null;
      var priority = priorityFromDueDate(dueDate);
      addTodoAndRefresh(text, dueDate, priority).then(function () {
        qs('todo-add-modal').hidden = true;
        qs('todo-input').value = '';
      }).catch(showError);
    });
    qs('todo-modal-text').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') qs('btn-todo-modal-save').click();
    });

    qs('btn-todo-clear-done').addEventListener('click', function (e) {
      withSpinner(e.currentTarget, function () {
        return gasRun('clearDoneTodos').then(function (todos) {
          state.home.todos = todos;
          renderTodoList(todos);
          return loadCalendarForCurrentMode();
        }).catch(showError);
      });
    });
  }

  // ===================== Drive =====================
  // ファイルの種類を分類する。フィルタのUI(#drive-type-filter)の選択肢と対応させる。
  function classifyMimeType(mimeType) {
    if (!mimeType) return 'other';
    if (mimeType === 'application/vnd.google-apps.folder') return 'folder';
    if (mimeType === 'application/vnd.google-apps.document' || mimeType === 'application/msword' ||
      mimeType.indexOf('wordprocessingml') !== -1 || mimeType === 'text/plain') return 'document';
    if (mimeType === 'application/vnd.google-apps.spreadsheet' || mimeType === 'application/vnd.ms-excel' ||
      mimeType.indexOf('spreadsheetml') !== -1 || mimeType === 'text/csv') return 'spreadsheet';
    if (mimeType === 'application/vnd.google-apps.presentation' || mimeType === 'application/vnd.ms-powerpoint' ||
      mimeType.indexOf('presentationml') !== -1) return 'presentation';
    if (mimeType.indexOf('image/') === 0) return 'image';
    if (mimeType === 'application/pdf') return 'pdf';
    return 'other';
  }

  function driveTypeMatches(item, filter) {
    if (filter === 'all') return true;
    if (item.isFolder) return filter === 'folder';
    return classifyMimeType(item.mimeType) === filter;
  }

  function isPinnedFolder(id) {
    var pinned = (state.home && state.home.userSettings.pinnedFolders) || [];
    return pinned.some(function (f) { return f.id === id; });
  }

  // ピン留めの追加/解除。設定は自動保存され、Driveタブ上部のチップ・行/カードのピンアイコンを再描画する。
  function togglePinFolder(id, name, pin) {
    if (!state.home) return Promise.resolve();
    var current = state.home.userSettings.pinnedFolders || [];
    var next = pin
      ? (current.some(function (f) { return f.id === id; }) ? current : current.concat([{ id: id, name: name }]))
      : current.filter(function (f) { return f.id !== id; });
    return gasRun('saveUserSettings', { pinnedFolders: next }).then(function (settings) {
      state.home.userSettings.pinnedFolders = settings.pinnedFolders;
      renderPinnedFolders(settings.pinnedFolders);
      renderDriveList(state.drive.items);
    }).catch(showError);
  }

  function renderPinnedFolders(pinnedFolders) {
    var container = qs('pinned-folder-chips');
    if (!container) return;
    pinnedFolders = pinnedFolders || [];
    if (pinnedFolders.length === 0) {
      container.innerHTML = '';
      return;
    }
    container.innerHTML = pinnedFolders.map(function (f) {
      return '<span class="pinned-folder-chip" data-folder-id="' + escapeHtml(f.id) + '">' +
        '<svg class="icon icon-sm"><use href="#icon-pin"></use></svg>' + escapeHtml(f.name) +
        '<button type="button" class="btn-unpin" data-folder-id="' + escapeHtml(f.id) + '" aria-label="ピン留め解除" title="ピン留め解除">×</button>' +
        '</span>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.pinned-folder-chip'), function (chip) {
      chip.addEventListener('click', function (e) {
        if (e.target.closest('.btn-unpin')) return;
        // ピン留めは階層を辿らない直接ジャンプのため、パンくずはジャンプ先1件だけにリセットする
        // （祖先フォルダの情報をサーバーから取得していないため、経路全体は復元できない）。
        var id = chip.getAttribute('data-folder-id');
        var pinned = (state.home && state.home.userSettings.pinnedFolders || []).filter(function (f) { return f.id === id; })[0];
        jumpToDriveFolder(id, pinned ? pinned.name : '');
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-unpin'), function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        togglePinFolder(btn.getAttribute('data-folder-id'), '', false);
      });
    });
  }

  // サムネイル画像。読み込みに失敗した場合(全ファイルで生成されるとは限らないため)は
  // 種類アイコン(iconUrl)にフォールバックする。
  function driveThumbHtml(item, sizeClass) {
    var primary = item.isFolder ? item.iconUrl : (item.thumbnailUrl || item.iconUrl);
    return '<img class="' + sizeClass + '" src="' + escapeHtml(primary) + '" data-fallback="' + escapeHtml(item.iconUrl) + '" alt="">';
  }

  function bindThumbFallback(container) {
    Array.prototype.forEach.call(container.querySelectorAll('img[data-fallback]'), function (img) {
      img.addEventListener('error', function onErr() {
        var fallback = img.getAttribute('data-fallback');
        if (img.src.indexOf(fallback) === -1) img.src = fallback;
        img.removeEventListener('error', onErr);
      });
    });
  }

  function drivePinButtonHtml(item) {
    if (!item.isFolder) return '';
    return '<button type="button" class="icon-only btn-drive-pin' + (isPinnedFolder(item.id) ? ' is-pinned' : '') + '" aria-label="ピン留め" title="ピン留め">' +
      '<svg class="icon icon-sm"><use href="#icon-pin"></use></svg></button>';
  }

  // iconOnly=true: グリッド(カード)表示用。4つのボタンを1行に収めるため、アイコンのみの丸ボタンにする
  function driveActionButtonsHtml(item, iconOnly) {
    function btn(cls, label, icon) {
      if (iconOnly) {
        return '<button type="button" class="icon-only ' + cls + '" aria-label="' + label + '" title="' + label + '">' +
          '<svg class="icon icon-sm"><use href="#' + icon + '"></use></svg></button>';
      }
      return '<button type="button" class="' + cls + '">' + label + '</button>';
    }
    var primary = item.isFolder ? btn('btn-drive-open', '開く', 'icon-folder') : btn('btn-drive-preview', 'プレビュー', 'icon-eye');
    return primary + btn('btn-drive-rename', '名称変更', 'icon-edit') + btn('btn-drive-share', '共有', 'icon-share') + btn('btn-drive-move', '移動', 'icon-move');
  }

  function driveListRowHtml(item) {
    var sizeLabel = item.isFolder ? '' : formatBytes(item.sizeBytes);
    var nameHtml = item.isFolder
      ? escapeHtml(item.name)
      : '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">' + escapeHtml(item.name) + '</a>';
    return '<div class="drive-row" data-file-id="' + escapeHtml(item.id) + '" data-is-folder="' + item.isFolder + '">' +
      driveThumbHtml(item, 'thumb') +
      '<div class="name">' + nameHtml + '</div>' +
      '<div class="meta">' + sizeLabel + '</div>' +
      '<span>' + drivePinButtonHtml(item) + driveActionButtonsHtml(item, false) + '</span></div>';
  }

  function driveGridItemHtml(item) {
    var sizeLabel = item.isFolder ? '' : formatBytes(item.sizeBytes);
    var nameHtml = item.isFolder
      ? escapeHtml(item.name)
      : '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">' + escapeHtml(item.name) + '</a>';
    return '<div class="drive-grid-item" data-file-id="' + escapeHtml(item.id) + '" data-is-folder="' + item.isFolder + '">' +
      drivePinButtonHtml(item) +
      driveThumbHtml(item, 'thumb') +
      '<div class="name">' + nameHtml + '</div>' +
      '<div class="meta">' + sizeLabel + '</div>' +
      '<div class="grid-actions">' + driveActionButtonsHtml(item, true) + '</div></div>';
  }

  // カード/行のクリック、および「プレビュー」ボタンの両方から呼ばれる共通処理
  function openDrivePreview(fileId) {
    gasRun('getDrivePreviewUrl', fileId).then(function (url) {
      qs('drive-preview-frame').src = url;
      qs('drive-preview-modal').hidden = false;
    }).catch(showError);
  }

  function formatBytes(bytes) {
    if (!bytes) return '';
    var units = ['B', 'KB', 'MB', 'GB'];
    var value = bytes;
    var unitIndex = 0;
    while (value >= 1024 && unitIndex < units.length - 1) {
      value = value / 1024;
      unitIndex++;
    }
    return value.toFixed(unitIndex === 0 ? 0 : 1) + units[unitIndex];
  }

  function renderDriveList(items) {
    var container = qs('drive-list');
    var filtered = items.filter(function (item) { return driveTypeMatches(item, state.drive.typeFilter); });
    container.classList.toggle('drive-grid', state.drive.viewMode === 'grid');
    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-hint">' + (items.length === 0 ? 'ファイルがありません' : '該当する種類のファイルがありません') + '</div>';
      return;
    }
    container.innerHTML = filtered.map(state.drive.viewMode === 'grid' ? driveGridItemHtml : driveListRowHtml).join('');
    bindThumbFallback(container);

    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-pin'), function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var row = btn.closest('[data-file-id]');
        var id = row.getAttribute('data-file-id');
        var item = state.drive.items.filter(function (i) { return i.id === id; })[0];
        if (!item) return;
        togglePinFolder(id, item.name, !isPinnedFolder(id));
      });
    });

    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-open'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        var id = row.getAttribute('data-file-id');
        var item = state.drive.items.filter(function (i) { return i.id === id; })[0];
        var name = item ? item.name : '';
        if (state.drive.searchActive) { jumpToDriveFolder(id, name); } else { openDriveFolder(id, name); }
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-preview'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        openDrivePreview(row.getAttribute('data-file-id'));
      });
    });

    // カード/行のどこをクリックしても既定の操作(ファイルはプレビュー、フォルダは開く)が起きるようにする。
    // ボタンやファイル名リンクのクリックはそれぞれ専用のハンドラに任せるため、ここでは何もしない。
    Array.prototype.forEach.call(container.querySelectorAll('.drive-row, .drive-grid-item'), function (row) {
      row.addEventListener('click', function (e) {
        if (e.target.closest('a, button')) return;
        var fileId = row.getAttribute('data-file-id');
        if (row.getAttribute('data-is-folder') === 'true') {
          var item = state.drive.items.filter(function (i) { return i.id === fileId; })[0];
          var name = item ? item.name : '';
          if (state.drive.searchActive) { jumpToDriveFolder(fileId, name); } else { openDriveFolder(fileId, name); }
        } else {
          openDrivePreview(fileId);
        }
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-rename'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        var item = state.drive.items.filter(function (i) { return i.id === row.getAttribute('data-file-id'); })[0];
        qs('drive-rename-file-id').value = row.getAttribute('data-file-id');
        qs('drive-rename-is-folder').value = row.getAttribute('data-is-folder');
        qs('drive-rename-name').value = item ? item.name : '';
        qs('drive-rename-modal').hidden = false;
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-share'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        qs('drive-share-file-id').value = row.getAttribute('data-file-id');
        qs('drive-share-modal').hidden = false;
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-move'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        qs('drive-move-file-id').value = row.getAttribute('data-file-id');
        qs('drive-move-dest').value = '';
        qs('drive-move-modal').hidden = false;
      });
    });
  }

  function loadDriveFolder(folderId) {
    state.drive.currentFolderId = folderId;
    state.drive.searchActive = false;
    renderDriveBreadcrumb();
    return gasRun('listDriveFiles', folderId, state.drive.driveId, state.drive.sortKey, state.drive.ascending).then(function (items) {
      state.drive.items = items;
      renderDriveList(items);
    }).catch(showError);
  }

  function runDriveSearch() {
    var query = qs('drive-search').value.trim();
    if (!query) { return loadDriveFolder(state.drive.currentFolderId); }
    return gasRun('searchDriveFiles', query, state.drive.driveId).then(function (items) {
      // 検索結果は現在の階層と無関係な場所から集まるため、結果からフォルダを開いた場合は
      // パンくずを経路の続きとして積まず、そのフォルダ単体へのジャンプとして扱う。
      // パンくず自体も、直前にいた場所を誤解させないよう検索中は非表示にする。
      state.drive.searchActive = true;
      state.drive.items = items;
      renderDriveList(items);
      renderDriveBreadcrumb();
    }).catch(showError);
  }

  // 更新ボタン・並び替え(種類/日時・昇順降順)は、検索結果表示中はその検索を条件そのままで
  // 再実行する（以前はここで常にloadDriveFolder()を呼んでいたため、検索中に更新や並び替えを
  // 触ると検索結果が何の予告もなくフォルダ一覧に置き換わってしまっていた）。
  // ただしsearchDriveFiles()自体は関連度順に固定でsort/order引数を受け付けないため、
  // 検索結果表示中は並び替えの見た目上の変化はない（検索モードが途切れないことだけを保証する）。
  function refreshDriveView() {
    if (state.drive.searchActive) {
      return runDriveSearch();
    }
    return loadDriveFolder(state.drive.currentFolderId);
  }

  // ===================== Drive: パンくずリスト（フォルダ階層のナビゲーション） =====================
  // フォルダを開く（一覧上のフォルダをクリック/「開く」ボタン）たびに経路へ積んでいく。
  function openDriveFolder(folderId, folderName) {
    state.drive.folderPath = state.drive.folderPath.concat([{ id: folderId, name: folderName || '' }]);
    return loadDriveFolder(folderId);
  }

  // ピン留めフォルダへのジャンプ・検索結果からのフォルダオープンなど、現在の経路と無関係な
  // 場所へ移動する場合に使う。経路をジャンプ先1件だけにリセットする。
  function jumpToDriveFolder(folderId, folderName) {
    state.drive.folderPath = [{ id: folderId, name: folderName || '' }];
    return loadDriveFolder(folderId);
  }

  // 「上の階層へ」は、以前は常にマイドライブ直下(ルート)へ戻っていたが、実際に辿ってきた
  // 経路から1階層だけ戻る（Google Driveの「戻る」相当の挙動）ようにしたもの。
  function goDriveUp() {
    state.drive.folderPath = state.drive.folderPath.slice(0, -1);
    var parent = state.drive.folderPath[state.drive.folderPath.length - 1];
    return loadDriveFolder(parent ? parent.id : null);
  }

  function goToDriveBreadcrumb(index) {
    if (index < 0) {
      state.drive.folderPath = [];
      return loadDriveFolder(null);
    }
    state.drive.folderPath = state.drive.folderPath.slice(0, index + 1);
    return loadDriveFolder(state.drive.folderPath[index].id);
  }

  function renderDriveBreadcrumb() {
    var container = qs('drive-breadcrumb');
    if (!container) return;
    // 検索結果表示中は、一覧が現在の階層と無関係な場所から集まってくるため、
    // 直前にいたフォルダの経路をそのまま表示すると現在地を誤解させる。検索中は非表示にする。
    // 経路が空(マイドライブ直下)のときも同様にパンくず自体を表示しない。
    if (state.drive.searchActive || state.drive.folderPath.length === 0) {
      container.innerHTML = '';
      return;
    }
    var crumbs = [{ id: null, name: state.drive.driveName }].concat(state.drive.folderPath);
    container.innerHTML = crumbs.map(function (crumb, i) {
      var isCurrent = i === crumbs.length - 1;
      var label = escapeHtml(crumb.name || '(名称不明)');
      var sep = isCurrent ? '' : '<span class="drive-breadcrumb-sep">/</span>';
      return '<button type="button" class="drive-breadcrumb-item' + (isCurrent ? ' is-current' : '') + '" data-index="' + (i - 1) + '"' + (isCurrent ? ' disabled' : '') + '>' + label + '</button>' + sep;
    }).join('');
    Array.prototype.forEach.call(container.querySelectorAll('.drive-breadcrumb-item:not(.is-current)'), function (btn) {
      btn.addEventListener('click', function () { goToDriveBreadcrumb(parseInt(btn.getAttribute('data-index'), 10)); });
    });
  }

  // ===================== Drive: マイドライブ/共有ドライブの切替 =====================
  // 切替先のルートへ移動するため、経路(folderPath)・検索状態をリセットしてから読み込み直す。
  function switchDrive(driveId, driveName) {
    state.drive.driveId = driveId;
    state.drive.driveName = driveName;
    state.drive.folderPath = [];
    state.drive.searchActive = false;
    qs('drive-search').value = '';
    return loadDriveFolder(null);
  }

  function initDriveSelector() {
    var select = qs('drive-selector');
    if (!select) return;
    return gasRun('listSharedDrives').then(function (drives) {
      state.drive.sharedDrives = drives || [];
      var options = ['<option value="">マイドライブ</option>'].concat(
        state.drive.sharedDrives.map(function (d) {
          return '<option value="' + escapeHtml(d.id) + '">' + escapeHtml(d.name) + '</option>';
        })
      );
      select.innerHTML = options.join('');
      select.addEventListener('change', function () {
        var driveId = select.value;
        var driveName = driveId === '' ? 'マイドライブ' :
          (state.drive.sharedDrives.filter(function (d) { return d.id === driveId; })[0] || {}).name || driveId;
        switchDrive(driveId, driveName);
      });
    }).catch(showError);
  }

  // ===================== Drive表示形式(リスト/グリッド)の切替 =====================
  function applyDriveViewModeButtons() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-drive-view]'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-drive-view') === state.drive.viewMode);
    });
  }

  function initDriveViewMode() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-drive-view]'), function (btn) {
      btn.addEventListener('click', function () {
        var mode = btn.getAttribute('data-drive-view');
        if (state.drive.viewMode === mode) return;
        state.drive.viewMode = mode;
        applyDriveViewModeButtons();
        renderDriveList(state.drive.items);
        gasRun('saveUserSettings', { driveViewMode: mode }).then(function () {
          if (state.home) state.home.userSettings.driveViewMode = mode;
        }).catch(showError);
      });
    });
  }

  function initDriveTypeFilter() {
    qs('drive-type-filter').addEventListener('change', function () {
      state.drive.typeFilter = qs('drive-type-filter').value;
      renderDriveList(state.drive.items);
    });
  }

  // ===================== Drive: ドラッグ&ドロップ／ファイル選択によるアップロード =====================
  // FileをGAS側に渡せる形式(base64文字列)に変換する。data:URLの先頭"data:<mime>;base64,"部分は
  // uploadDriveFile()側では不要なため、カンマ以降だけを取り出す。
  function readFileAsBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = String(reader.result || '');
        var commaIndex = result.indexOf(',');
        resolve(commaIndex === -1 ? result : result.slice(commaIndex + 1));
      };
      reader.onerror = function () { reject(reader.error || new Error('ファイルの読み込みに失敗しました')); };
      reader.readAsDataURL(file);
    });
  }

  // 複数ファイルは並列に投げるとgoogle.script.runの同時実行数やDriveのレート制限に当たりやすいため、
  // 1件ずつ順番にアップロードする。1件の失敗が他のファイルの処理を止めないよう、失敗はcatchで
  // 個別に握りつぶして件数だけ記録し、最後にまとめて結果をトーストで表示する。
  function uploadDriveFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (files.length === 0) return Promise.resolve();
    var folderId = state.drive.currentFolderId;
    var driveId = state.drive.driveId;
    var successCount = 0;
    var failCount = 0;

    var failedNames = [];
    var chain = files.reduce(function (promise, file) {
      return promise.then(function () {
        return readFileAsBase64(file)
          .then(function (base64) {
            return gasRun('uploadDriveFile', folderId, driveId, file.name, file.type || 'application/octet-stream', base64);
          })
          .then(function () { successCount++; })
          .catch(function (err) {
            // window.alert(showError)を1件ごとに出すとダイアログが連続してブロックしてしまうため、
            // ここでは個別には通知せず件数だけ記録し、全件処理後にまとめて1回だけ知らせる。
            failCount++;
            failedNames.push(file.name);
            console.error('アップロードに失敗しました: ' + file.name, err);
          });
      });
    }, Promise.resolve());

    return chain.then(function () {
      if (successCount > 0) {
        showToast(successCount + '件アップロードしました' + (failCount > 0 ? '（' + failCount + '件失敗）' : ''));
      }
      if (failCount > 0) {
        window.alert(failCount + '件のアップロードに失敗しました:\n' + failedNames.join('\n'));
      }
      return loadDriveFolder(state.drive.currentFolderId);
    });
  }

  function initDriveUpload() {
    var dropzone = qs('drive-list');
    var fileInput = qs('drive-upload-input');
    var dragCounter = 0;

    qs('btn-drive-upload').addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () {
      withSpinner(qs('btn-drive-upload'), function () { return uploadDriveFiles(fileInput.files); });
      fileInput.value = '';
    });

    // dragenter/dragleaveは子要素への出入りでも発火するため、カウンタで実際にゾーンの外に
    // 出たときだけ is-drag-over を外す（子要素をまたぐたびにチラつくのを防ぐ）。
    dropzone.addEventListener('dragenter', function (e) {
      if (!e.dataTransfer || e.dataTransfer.types.indexOf('Files') === -1) return;
      e.preventDefault();
      dragCounter++;
      dropzone.classList.add('is-drag-over');
    });
    dropzone.addEventListener('dragover', function (e) {
      if (!e.dataTransfer || e.dataTransfer.types.indexOf('Files') === -1) return;
      e.preventDefault();
    });
    dropzone.addEventListener('dragleave', function () {
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter === 0) dropzone.classList.remove('is-drag-over');
    });
    dropzone.addEventListener('drop', function (e) {
      if (!e.dataTransfer || e.dataTransfer.types.indexOf('Files') === -1) return;
      e.preventDefault();
      dragCounter = 0;
      dropzone.classList.remove('is-drag-over');
      uploadDriveFiles(e.dataTransfer.files);
    });
  }

  function initDrive() {
    initDriveUpload();
    initDriveSelector();
    qs('btn-drive-refresh').addEventListener('click', function (e) {
      withSpinner(e.currentTarget, function () { return refreshDriveView(); });
    });
    qs('btn-drive-up').addEventListener('click', function () { goDriveUp(); });

    qs('btn-drive-search').addEventListener('click', function () { runDriveSearch(); });

    qs('drive-sort').addEventListener('change', function () {
      state.drive.sortKey = qs('drive-sort').value;
      refreshDriveView();
    });
    qs('drive-order').addEventListener('change', function () {
      state.drive.ascending = qs('drive-order').value === 'asc';
      refreshDriveView();
    });

    qs('btn-drive-preview-close').addEventListener('click', function () {
      qs('drive-preview-frame').src = 'about:blank';
      qs('drive-preview-modal').hidden = true;
    });

    qs('btn-drive-share-cancel').addEventListener('click', function () { qs('drive-share-modal').hidden = true; });
    qs('btn-drive-share-save').addEventListener('click', function () {
      var fileId = qs('drive-share-file-id').value;
      var access = qs('drive-share-access').value;
      var permission = qs('drive-share-permission').value;
      gasRun('updateDriveSharing', fileId, access, permission).then(function () {
        qs('drive-share-modal').hidden = true;
        return loadDriveFolder(state.drive.currentFolderId);
      }).catch(showError);
    });

    qs('btn-drive-move-cancel').addEventListener('click', function () { qs('drive-move-modal').hidden = true; });
    qs('btn-drive-move-save').addEventListener('click', function () {
      var fileId = qs('drive-move-file-id').value;
      var destination = qs('drive-move-dest').value.trim();
      if (!destination) { window.alert('移動先フォルダIDを入力してください'); return; }
      gasRun('moveDriveFile', fileId, destination).then(function () {
        qs('drive-move-modal').hidden = true;
        return loadDriveFolder(state.drive.currentFolderId);
      }).catch(showError);
    });

    qs('btn-drive-rename-cancel').addEventListener('click', function () { qs('drive-rename-modal').hidden = true; });
    qs('btn-drive-rename-save').addEventListener('click', function () {
      var fileId = qs('drive-rename-file-id').value;
      var isFolder = qs('drive-rename-is-folder').value === 'true';
      var newName = qs('drive-rename-name').value.trim();
      if (!newName) { window.alert('新しい名前を入力してください'); return; }
      gasRun('renameDriveEntry', fileId, newName, isFolder).then(function () {
        qs('drive-rename-modal').hidden = true;
        return loadDriveFolder(state.drive.currentFolderId);
      }).catch(showError);
    });
  }

  // ===================== 設定画面: テーマ配色（11色 + ランダム = 12択） =====================
  function renderThemeSwatches(choices, selectedId) {
    var grid = qs('theme-swatch-grid');
    grid.innerHTML = choices.map(function (choice) {
      var isRandom = choice.hex === null;
      var selected = choice.id === selectedId ? ' selected' : '';
      var swatchInner = isRandom
        ? '<svg class="icon"><use href="#icon-shuffle"></use></svg>'
        : '';
      var swatchStyle = isRandom ? '' : ' style="background:' + choice.hex + ';"';
      return '<button type="button" class="theme-swatch' + selected + '" data-theme-id="' + escapeHtml(choice.id) + '">' +
        '<span class="swatch-color' + (isRandom ? ' is-random' : '') + '"' + swatchStyle + '>' + swatchInner + '</span>' +
        '<span>' + escapeHtml(choice.name) + '</span>' +
        '</button>';
    }).join('');

    Array.prototype.forEach.call(grid.querySelectorAll('.theme-swatch'), function (btn) {
      btn.addEventListener('click', function () {
        var themeId = btn.getAttribute('data-theme-id');
        // saveUserSettings()+loadHome()（Calendar/Gmail/Sheets等ホーム全体の再取得）は配色を
        // 変えるだけの操作には重すぎるため、保存と解決後のテーマをまとめて返す専用の軽量
        // エンドポイントを使う（src/Code.tsのsaveThemeChoice()）。
        gasRun('saveThemeChoice', themeId).then(function (theme) {
          state.home.theme = theme;
          state.home.userSettings.themeChoice = themeId;
          applyTheme(theme);
          renderThemeSwatches(state.themeChoices, themeId);
        }).catch(showError);
      });
    });
  }

  // ===================== 設定画面 =====================
  function populateNotifyHourOptions() {
    var select = qs('setting-notify-hour');
    if (select.options.length > 0) return; // 初回のみ生成（毎回作り直すと選択中の値が一瞬消える）
    var html = '';
    for (var h = 0; h < 24; h++) {
      html += '<option value="' + h + '">' + h + '時</option>';
    }
    select.innerHTML = html;
  }

  function populateSettingsForm(userSettings, globalSettings, calendars, themeChoices) {
    renderThemeSwatches(themeChoices, userSettings.themeChoice);
    renderDarkModeSwitcher(userSettings.darkMode);

    qs('setting-mail-count').value = userSettings.mailCount;
    renderWidgetLayoutEditor(userSettings.widgets);
    renderCustomNavSettingsList(userSettings.customNavItems);

    qs('setting-notify-enabled').checked = globalSettings.notifyEnabled;
    populateNotifyHourOptions();
    qs('setting-notify-hour').value = String(globalSettings.notifyHour);

    // 同期対象カレンダーはログインアカウントに紐づくため選択式にはせず、現在自動的に
    // 同期されるカレンダー名を確認用に一覧表示するのみ（選択UIは持たない）
    var listHtml = calendars.map(function (cal) {
      return '<div class="synced-calendar-row"><svg class="icon icon-sm"><use href="#icon-check"></use></svg>' + escapeHtml(cal.name) + '</div>';
    }).join('');
    qs('sync-calendar-list').innerHTML = listHtml || '<div class="empty-hint">利用可能なカレンダーがありません</div>';
  }

  // ---- ウィジェット（カレンダー/今日の予定/メール/アプリリンク集）の視覚的レイアウトエディタ ----
  // 各列(メインエリア/サイドバー)のドロップゾーンは固定の同じ高さで、中のブロックは実際の
  // ダッシュボードと同じ widget-size-*（flex-grow比率 1:2:3）でその高さを分け合う。そのため
  // ウィジェットの構成に関わらず、メインエリアとサイドバーの合計の高さは常に一致する。
  var WIDGET_SIZE_ORDER = ['small', 'medium', 'large'];
  var WIDGET_RESIZE_STEP_PX = 36; // この距離だけドラッグするたびに大きさが1段階変わる
  var draggingWidgetBlock = null;

  function renderWidgetLayoutEditor(widgets) {
    var mainZone = qs('widget-layout-main');
    var sideZone = qs('widget-layout-side');
    mainZone.innerHTML = '';
    sideZone.innerHTML = '';
    widgets.forEach(function (w) {
      var zone = w.column === 'main' ? mainZone : sideZone;
      zone.appendChild(buildWidgetBlock(w));
    });
  }

  // ---- ウィジェットブロックのサンプルデザイン（レイアウトの見た目を大きさごとに確認できるようにする） ----
  // 実データではなく、そのウィジェットが実際にどう見えるかを示す簡易モックアップ(骨組み)。
  // 大きさ(小/中/大)に応じて行数を増減させ、リサイズ時の見た目の変化も確認できるようにしている。
  function wmockRowCount(size) {
    return size === 'small' ? 2 : size === 'medium' ? 3 : 5;
  }

  function buildCalendarMock(size) {
    var rows = size === 'small' ? 2 : size === 'medium' ? 3 : 4;
    var weekdaysHtml = ['日', '月', '火', '水', '木', '金', '土'].map(function (d) { return '<span>' + d + '</span>'; }).join('');
    var cellsHtml = '';
    for (var i = 0; i < rows * 7; i++) {
      var hasEvent = i % 9 === 3 || i % 11 === 5;
      cellsHtml += '<div class="wmock-cal-cell">' + (hasEvent ? '<span class="wmock-chip"></span>' : '') + '</div>';
    }
    return '<div class="wmock-cal-weekdays">' + weekdaysHtml + '</div>' +
      '<div class="wmock-cal-grid" style="grid-template-rows: repeat(' + rows + ', 1fr);">' + cellsHtml + '</div>';
  }

  function buildTodayMock(size) {
    var rows = wmockRowCount(size);
    var html = '';
    for (var i = 0; i < rows; i++) {
      html += '<div class="wmock-row"><span class="wmock-time"></span><span class="wmock-bar" style="width:' + (46 + (i % 3) * 16) + '%;"></span></div>';
    }
    return '<div class="wmock-list">' + html + '</div>';
  }

  function buildMailMock(size) {
    var rows = wmockRowCount(size);
    var html = '';
    for (var i = 0; i < rows; i++) {
      html += '<div class="wmock-row"><span class="wmock-dot' + (i < 2 ? ' is-unread' : '') + '"></span>' +
        '<span class="wmock-bar" style="width:' + (55 + (i % 3) * 14) + '%;"></span><span class="wmock-bar wmock-bar-sm"></span></div>';
    }
    return '<div class="wmock-list">' + html + '</div>';
  }

  function buildLinksMock(size) {
    var rows = wmockRowCount(size);
    var html = '';
    for (var i = 0; i < rows; i++) {
      html += '<div class="wmock-row"><span class="wmock-icon-dot"></span>' +
        '<span class="wmock-bar" style="width:' + (50 + (i % 3) * 16) + '%;"></span><span class="wmock-badge"></span></div>';
    }
    return '<div class="wmock-list">' + html + '</div>';
  }

  function buildTodoMock(size) {
    var rows = wmockRowCount(size);
    var html = '';
    for (var i = 0; i < rows; i++) {
      var done = i === 1;
      html += '<div class="wmock-row"><span class="wmock-check' + (done ? ' is-checked' : '') + '"></span>' +
        '<span class="wmock-bar' + (done ? ' is-done' : '') + '" style="width:' + (45 + (i % 3) * 18) + '%;"></span></div>';
    }
    return '<div class="wmock-list">' + html + '</div>';
  }

  var WIDGET_MOCK_BUILDERS = {
    calendar: buildCalendarMock,
    today: buildTodayMock,
    mail: buildMailMock,
    links: buildLinksMock,
    todo: buildTodoMock
  };

  function buildWidgetMockHtml(widgetId, size) {
    var builder = WIDGET_MOCK_BUILDERS[widgetId];
    return builder ? builder(size) : '';
  }

  function buildWidgetBlock(w) {
    var block = document.createElement('div');
    block.className = 'widget-block widget-block-size-' + w.size + (w.visible ? '' : ' is-hidden');
    block.draggable = true;
    block.setAttribute('data-widget-id', w.id);
    block.setAttribute('data-size', w.size);
    block.setAttribute('data-visible', w.visible ? 'true' : 'false');

    var head = document.createElement('div');
    head.className = 'widget-block-head';
    head.innerHTML =
      '<svg class="icon icon-sm widget-block-drag-handle"><use href="#icon-grip"></use></svg>' +
      '<span class="widget-block-label">' + WIDGET_LABELS[w.id] + '</span>' +
      '<button type="button" class="widget-block-visibility" aria-label="表示/非表示切替" title="表示/非表示切替">' +
      '<svg class="icon icon-sm"><use href="#' + (w.visible ? 'icon-eye' : 'icon-eye-off') + '"></use></svg>' +
      '</button>';
    block.appendChild(head);

    var mock = document.createElement('div');
    mock.className = 'widget-block-mock';
    mock.innerHTML = buildWidgetMockHtml(w.id, w.size);
    block.appendChild(mock);

    var sizeLabel = document.createElement('div');
    sizeLabel.className = 'widget-block-size-label';
    sizeLabel.textContent = '大きさ: ' + WIDGET_SIZE_LABELS[w.size];
    block.appendChild(sizeLabel);

    var resizeHandle = document.createElement('div');
    resizeHandle.className = 'widget-block-resize-handle';
    resizeHandle.title = 'ドラッグで大きさを変更';
    block.appendChild(resizeHandle);

    head.querySelector('.widget-block-visibility').addEventListener('click', function (e) {
      e.stopPropagation();
      var nowVisible = block.getAttribute('data-visible') !== 'true';
      block.setAttribute('data-visible', nowVisible ? 'true' : 'false');
      block.classList.toggle('is-hidden', !nowVisible);
      e.currentTarget.querySelector('use').setAttribute('href', '#' + (nowVisible ? 'icon-eye' : 'icon-eye-off'));
    });

    initWidgetBlockDrag(block);
    initWidgetBlockResize(block, resizeHandle, sizeLabel);
    return block;
  }

  function initWidgetBlockDrag(block) {
    block.addEventListener('dragstart', function (e) {
      draggingWidgetBlock = block;
      block.classList.add('is-dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', block.getAttribute('data-widget-id')); } catch (err) { /* Firefox以外は不要 */ }
    });
    block.addEventListener('dragend', function () {
      block.classList.remove('is-dragging');
      draggingWidgetBlock = null;
      Array.prototype.forEach.call(document.querySelectorAll('.widget-layout-dropzone'), function (z) {
        z.classList.remove('is-drag-over');
      });
    });
  }

  function widgetLayoutInsertionTarget(zone, y) {
    var blocks = Array.prototype.slice.call(zone.querySelectorAll('.widget-block:not(.is-dragging)'));
    var result = null;
    var closestOffset = -Infinity;
    blocks.forEach(function (child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closestOffset) {
        closestOffset = offset;
        result = child;
      }
    });
    return result;
  }

  function initWidgetLayoutDropzones() {
    Array.prototype.forEach.call(document.querySelectorAll('.widget-layout-dropzone'), function (zone) {
      zone.addEventListener('dragover', function (e) {
        if (!draggingWidgetBlock) return;
        e.preventDefault();
        zone.classList.add('is-drag-over');
        var after = widgetLayoutInsertionTarget(zone, e.clientY);
        if (after) {
          zone.insertBefore(draggingWidgetBlock, after);
        } else {
          zone.appendChild(draggingWidgetBlock);
        }
      });
      zone.addEventListener('dragleave', function (e) {
        if (e.target === zone) zone.classList.remove('is-drag-over');
      });
      zone.addEventListener('drop', function (e) {
        e.preventDefault();
        zone.classList.remove('is-drag-over');
      });
    });
  }

  function applyWidgetBlockSize(block, sizeLabelEl, size) {
    block.className = block.className.replace(/widget-block-size-\w+/, 'widget-block-size-' + size);
    block.setAttribute('data-size', size);
    sizeLabelEl.textContent = '大きさ: ' + WIDGET_SIZE_LABELS[size];
    var mock = block.querySelector('.widget-block-mock');
    if (mock) mock.innerHTML = buildWidgetMockHtml(block.getAttribute('data-widget-id'), size);
  }

  // 列の高さは固定なので、大きさはピクセル指定ではなく「小⇔中⇔大」の段階を動かす形で変更する。
  // 一定距離ドラッグするたびに1段階変わり、他のブロックはflex-growで自動的に伸縮する。
  function initWidgetBlockResize(block, handle, sizeLabelEl) {
    handle.addEventListener('mousedown', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var startY = e.clientY;
      var index = WIDGET_SIZE_ORDER.indexOf(block.getAttribute('data-size'));

      function onMove(ev) {
        var delta = ev.clientY - startY;
        if (delta >= WIDGET_RESIZE_STEP_PX && index < WIDGET_SIZE_ORDER.length - 1) {
          index++;
          startY = ev.clientY;
          applyWidgetBlockSize(block, sizeLabelEl, WIDGET_SIZE_ORDER[index]);
        } else if (delta <= -WIDGET_RESIZE_STEP_PX && index > 0) {
          index--;
          startY = ev.clientY;
          applyWidgetBlockSize(block, sizeLabelEl, WIDGET_SIZE_ORDER[index]);
        }
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }

  function currentWidgetSettings() {
    var result = [];
    Array.prototype.forEach.call(document.querySelectorAll('.widget-layout-dropzone'), function (zone) {
      var column = zone.getAttribute('data-column');
      Array.prototype.forEach.call(zone.querySelectorAll('.widget-block'), function (block) {
        result.push({
          id: block.getAttribute('data-widget-id'),
          column: column,
          size: block.getAttribute('data-size'),
          visible: block.getAttribute('data-visible') === 'true'
        });
      });
    });
    return result;
  }

  // ---- カスタムナビ項目（個人用ショートカット） ----
  // サーバー側(settingsService.tsのVALID_NAV_ICONS)と同じ一覧。アイコン選択のためだけに
  // サーバー往復を発生させないよう、選択肢はクライアント側にも静的に持たせている。
  var NAV_ICON_CHOICES = ['link', 'home', 'folder', 'mail', 'bell', 'check', 'flag', 'tag', 'archive', 'hub', 'share', 'grid'];
  var selectedNavIcon = 'link';

  function renderNavIconPicker() {
    var container = qs('nav-icon-picker');
    if (!container) return;
    container.innerHTML = NAV_ICON_CHOICES.map(function (icon) {
      return '<button type="button" class="nav-icon-swatch' + (icon === selectedNavIcon ? ' selected' : '') + '" data-icon="' + icon + '" aria-label="アイコン: ' + icon + '" title="アイコン: ' + icon + '">' +
        '<svg class="icon icon-sm"><use href="#icon-' + icon + '"></use></svg></button>';
    }).join('');
    Array.prototype.forEach.call(container.querySelectorAll('.nav-icon-swatch'), function (btn) {
      btn.addEventListener('click', function () {
        selectedNavIcon = btn.getAttribute('data-icon');
        renderNavIconPicker();
      });
    });
  }

  function renderCustomNav(items) {
    var list = qs('nav-custom-list');
    qs('nav-custom-divider').hidden = items.length === 0;
    list.innerHTML = items.map(function (item) {
      return '<button type="button" class="nav-item nav-item-custom" data-url="' + escapeHtml(item.url) + '" title="' + escapeHtml(item.url) + '">' +
        '<svg class="icon"><use href="#icon-' + escapeHtml(item.icon || 'link') + '"></use></svg><span>' + escapeHtml(item.label) + '</span>' +
        '</button>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.nav-item-custom'), function (btn) {
      btn.addEventListener('click', function () {
        window.open(btn.getAttribute('data-url'), '_blank', 'noopener');
      });
    });
  }

  function saveCustomNavItems(items) {
    // saveUserSettings()は更新後のUserSettings一式をそのまま返すため、ホーム全体
    // (Calendar/Gmail/Sheets等)を読み直すloadHome()を挟まずに、その場でコントロールパネルの
    // ナビ一覧と設定画面側の一覧の両方を再描画する。
    return gasRun('saveUserSettings', { customNavItems: items }).then(function (saved) {
      state.home.userSettings = saved;
      renderCustomNav(saved.customNavItems);
      renderCustomNavSettingsList(saved.customNavItems);
    });
  }

  function renderCustomNavSettingsList(items) {
    var container = qs('custom-nav-settings-list');
    if (items.length === 0) {
      container.innerHTML = '<div class="empty-hint">まだカスタム項目がありません</div>';
      return;
    }
    container.innerHTML = items.map(function (item, index) {
      return '<div class="link-row nav-item-settings-row" draggable="true" data-nav-item-id="' + escapeHtml(item.id) + '">' +
        '<svg class="icon icon-sm widget-block-drag-handle" style="flex:0 0 auto;"><use href="#icon-grip"></use></svg>' +
        '<svg class="icon icon-sm" style="flex:0 0 auto; color:var(--content-muted);"><use href="#icon-' + escapeHtml(item.icon || 'link') + '"></use></svg>' +
        '<div>' +
        '<div class="name">' + escapeHtml(item.label) + '</div>' +
        '<div class="desc">' + escapeHtml(item.url) + '</div>' +
        '</div>' +
        '<span>' +
        '<button type="button" class="btn-custom-nav-up" ' + (index === 0 ? 'disabled' : '') + '>↑</button> ' +
        '<button type="button" class="btn-custom-nav-down" ' + (index === items.length - 1 ? 'disabled' : '') + '>↓</button> ' +
        '<button type="button" class="icon-only btn-custom-nav-delete" aria-label="削除" title="削除"><svg class="icon icon-sm"><use href="#icon-trash"></use></svg></button>' +
        '</span>' +
        '</div>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.btn-custom-nav-delete'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('[data-nav-item-id]').getAttribute('data-nav-item-id');
        var next = items.filter(function (item) { return item.id !== id; });
        saveCustomNavItems(next).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-custom-nav-up'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('[data-nav-item-id]').getAttribute('data-nav-item-id');
        var idx = items.map(function (i) { return i.id; }).indexOf(id);
        if (idx <= 0) return;
        var next = items.slice();
        var tmp = next[idx - 1]; next[idx - 1] = next[idx]; next[idx] = tmp;
        saveCustomNavItems(next).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-custom-nav-down'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('[data-nav-item-id]').getAttribute('data-nav-item-id');
        var idx = items.map(function (i) { return i.id; }).indexOf(id);
        if (idx === -1 || idx >= items.length - 1) return;
        var next = items.slice();
        var tmp = next[idx + 1]; next[idx + 1] = next[idx]; next[idx] = tmp;
        saveCustomNavItems(next).catch(showError);
      });
    });

    initCustomNavDragDrop(container, items);
  }

  // ↑↓ボタン(キーボード操作・タッチ操作向け)に加えて、行自体をドラッグしても並び替えられるようにする
  var draggingNavRow = null;

  function navRowInsertionTarget(container, y) {
    var rows = Array.prototype.slice.call(container.querySelectorAll('.nav-item-settings-row:not(.is-dragging)'));
    var result = null;
    var closestOffset = -Infinity;
    rows.forEach(function (row) {
      var box = row.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closestOffset) {
        closestOffset = offset;
        result = row;
      }
    });
    return result;
  }

  function initCustomNavDragDrop(container, items) {
    Array.prototype.forEach.call(container.querySelectorAll('.nav-item-settings-row'), function (row) {
      row.addEventListener('dragstart', function (e) {
        draggingNavRow = row;
        row.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', row.getAttribute('data-nav-item-id')); } catch (err) { /* Firefox以外は不要 */ }
      });
      row.addEventListener('dragend', function () {
        row.classList.remove('is-dragging');
        draggingNavRow = null;
      });
    });

    container.addEventListener('dragover', function (e) {
      if (!draggingNavRow) return;
      e.preventDefault();
      var after = navRowInsertionTarget(container, e.clientY);
      if (after) {
        container.insertBefore(draggingNavRow, after);
      } else {
        container.appendChild(draggingNavRow);
      }
    });

    container.addEventListener('drop', function (e) {
      e.preventDefault();
      if (!draggingNavRow) return;
      var byId = {};
      items.forEach(function (item) { byId[item.id] = item; });
      var next = Array.prototype.map.call(container.querySelectorAll('.nav-item-settings-row'), function (row) {
        return byId[row.getAttribute('data-nav-item-id')];
      });
      saveCustomNavItems(next).catch(showError);
    });
  }

  function initCustomNavSettings() {
    renderNavIconPicker();
    qs('btn-custom-nav-add').addEventListener('click', function () {
      var labelInput = qs('custom-nav-label-input');
      var urlInput = qs('custom-nav-url-input');
      var label = labelInput.value.trim();
      var url = urlInput.value.trim();
      if (!label) { window.alert('表示名を入力してください'); return; }
      if (!/^https?:\/\/.+/i.test(url)) { window.alert('http(s)から始まるURLを入力してください'); return; }
      var current = state.home ? state.home.userSettings.customNavItems : [];
      var next = current.concat([{ label: label, url: url, icon: selectedNavIcon }]);
      saveCustomNavItems(next).then(function () {
        labelInput.value = '';
        urlInput.value = '';
        selectedNavIcon = 'link';
        renderNavIconPicker();
      }).catch(showError);
    });
  }

  function initSettings() {
    qs('btn-save-user-settings').addEventListener('click', function () {
      var settings = {
        widgets: currentWidgetSettings(),
        mailCount: parseInt(qs('setting-mail-count').value, 10) || 5
      };
      // saveUserSettings()は更新後のUserSettings一式を返すため、ホーム全体
      // (Calendar/Gmail/Sheets等)を読み直すloadHome()は使わず、ウィジェット配置をその場で
      // 再適用する。mailCountはサーバー側で保存済みの値を使うgetRecentMails()の軽量版
      // (refreshMailData())だけを呼べば反映できる。
      gasRun('saveUserSettings', settings).then(function (saved) {
        state.home.userSettings = saved;
        applyWidgetLayout(saved);
        return refreshMailData();
      }).then(function () {
        showToast('保存しました');
      }).catch(showError);
    });

    qs('btn-save-global-settings').addEventListener('click', function () {
      var settings = {
        notifyEnabled: qs('setting-notify-enabled').checked,
        notifyHour: parseInt(qs('setting-notify-hour').value, 10) || 0
      };
      // 全体設定は設定画面のフォーム自体にしか影響しないため、loadHome()は不要。
      gasRun('saveGlobalSettings', settings).then(function (saved) {
        state.home.globalSettings = saved;
        showToast('保存しました');
      }).catch(showError);
    });

    qs('btn-send-test-notification').addEventListener('click', function (e) {
      withSpinner(e.currentTarget, function () {
        return gasRun('sendTestNotification').then(function () {
          showToast('テスト通知を送信しました');
        }).catch(showError);
      });
    });
  }

  // ===================== 初期化 =====================
  // 各init関数はtry/catchで個別に保護する。手動移行等でHTMLファイルの一部が古い/欠けている
  // ような場合でも、1箇所の初期化失敗が他の機能(更新ボタン等)の初期化まで巻き込んで
  // 止めてしまわないようにするため。
  function safeInit(name, fn) {
    try {
      fn();
    } catch (e) {
      console.error('初期化に失敗しました: ' + name, e);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    safeInit('initGlobalActions', initGlobalActions);
    safeInit('initNav', initNav);
    safeInit('initEventModal', initEventModal);
    safeInit('initCalendarNav', initCalendarNav);
    safeInit('initCalendarViewModeSwitch', initCalendarViewModeSwitch);
    safeInit('initDayDetail', initDayDetail);
    safeInit('initMail', initMail);
    safeInit('initMailPage', initMailPage);
    safeInit('initMailPageResizer', initMailPageResizer);
    safeInit('initMailFolderSelector', initMailFolderSelector);
    safeInit('initMailBulkActions', initMailBulkActions);
    safeInit('initSearch', initSearch);
    safeInit('initAppLedger', initAppLedger);
    safeInit('initTodo', initTodo);
    safeInit('initDrive', initDrive);
    safeInit('initDriveViewMode', initDriveViewMode);
    safeInit('initDriveTypeFilter', initDriveTypeFilter);
    safeInit('initSettings', initSettings);
    safeInit('initCustomNavSettings', initCustomNavSettings);
    safeInit('initWidgetLayoutDropzones', initWidgetLayoutDropzones);
    loadHome();
  });
})();
</script>
