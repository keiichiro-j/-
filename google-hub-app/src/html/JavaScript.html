<script>
(function () {
  'use strict';

  var GAS_CALL_TIMEOUT_MS = 25000;

  // ===== google.script.run を Promise 化するヘルパー =====
  function gasRun(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        reject(new Error('サーバーからの応答がありません。しばらくしてから再度お試しください。'));
      }, GAS_CALL_TIMEOUT_MS);

      google.script.run
        .withSuccessHandler(function (result) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(result);
        })
        .withFailureHandler(function (err) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(new Error(err && err.message ? err.message : String(err)));
        })
        [fnName].apply(null, args);
    });
  }

  function qs(id) { return document.getElementById(id); }
  function escapeHtml(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function showError(err) {
    window.alert(err && err.message ? err.message : String(err));
  }

  var WIDGET_LABELS = { calendar: 'カレンダー', today: '今日の予定', mail: 'メール', links: 'アプリリンク集' };
  var WIDGET_IDS = ['calendar', 'today', 'mail', 'links'];
  var WIDGET_SIZE_LABELS = { small: '小', medium: '中', large: '大' };
  var WIDGET_COLUMN_LABELS = { main: 'メインエリア', side: 'サイドバー' };

  var now0 = new Date();
  var state = {
    home: null, // getHomeData() の結果一式（テーマ・設定・カレンダー・メール・アプリ台帳）
    themeChoices: [],
    eventCategories: [], // 予定の種類一覧（EventCategory.CATEGORIES）
    currentView: 'home', // 'home' | 'drive' | 'settings'
    calendar: {
      year: now0.getFullYear(),
      month: now0.getMonth(), // 0-indexed。表示中の月（前月/次月ボタンで変わる）
      events: [],
      dayInfoByDay: {} // { day: { holidayName, rokuyo } } 表示中の月の祝日名・六曜
    },
    dayDetail: null, // 日付タップ時のポップアップで選択中の日 { year, month, day }
    drive: {
      currentFolderId: null,
      items: [],
      sortKey: 'updated',
      ascending: false
    }
  };

  // ===================== テーマ適用（コントロールパネルのみ） =====================
  function applyTheme(theme) {
    var panel = qs('control-panel');
    panel.style.background = theme.hex;
    panel.style.color = theme.textColor;
    panel.setAttribute('data-text', theme.textColor === '#1a1a1a' ? 'dark' : 'light');
  }

  // ===================== 画面切り替え =====================
  function switchView(view) {
    state.currentView = view;
    qs('view-home').hidden = view !== 'home';
    qs('view-mail').hidden = view !== 'mail';
    qs('view-links').hidden = view !== 'links';
    qs('view-drive').hidden = view !== 'drive';
    qs('view-settings').hidden = view !== 'settings';
    qs('right-sidebar').hidden = view !== 'home';

    placeWidgetsForCurrentView();

    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-view') === view);
    });

    if (view === 'drive' && state.drive.items.length === 0) {
      loadDriveFolder(null);
    }
  }

  function initNav() {
    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (btn) {
      btn.addEventListener('click', function () {
        switchView(btn.getAttribute('data-view'));
      });
    });
  }

  // ===================== ヘッダー（アバター） =====================
  function renderAvatar(email) {
    var badge = qs('avatar-badge');
    badge.textContent = email ? email.charAt(0).toUpperCase() : '?';
    badge.title = email || '未ログイン';
  }

  // ===================== ホーム画面の読み込み =====================
  function loadHome() {
    return Promise.all([gasRun('getHomeData'), gasRun('listThemeChoices'), gasRun('listEventCategories')]).then(function (results) {
      var home = results[0];
      state.home = home;
      state.themeChoices = results[1];
      state.eventCategories = results[2];
      applyTheme(home.theme);
      placeWidgetsForCurrentView();
      renderAvatar(home.currentUserEmail);
      renderMailList(home.mails, home.userSettings.mailCount);
      renderAppList(home.apps);
      renderCustomNav(home.userSettings.customNavItems);
      populateEventCalendarOptions(home.calendars);
      renderCategorySwatchPicker(state.eventCategories, '');
      populateSettingsForm(home.userSettings, home.globalSettings, home.calendars, state.themeChoices);
      renderNotifications(home);

      var t = new Date();
      state.calendar.year = t.getFullYear();
      state.calendar.month = t.getMonth();
      return Promise.all([loadCalendarMonth(state.calendar.year, state.calendar.month), loadTodayEvents()]);
    }).catch(showError);
  }

  // ===================== ウィジェット（カレンダー/今日の予定/メール/アプリリンク集）の配置 =====================
  // 設定画面で選んだ配置先(メイン/サイドバー)・サイズ・表示可否を、実際のDOM配置に反映する。
  function applyWidgetLayout(userSettings) {
    var columnMain = qs('card-stack');
    var columnSide = qs('right-sidebar');
    userSettings.widgets.forEach(function (w) {
      var el = document.querySelector('[data-card="' + w.id + '"]');
      if (!el) return;
      el.classList.remove('widget-size-small', 'widget-size-medium', 'widget-size-large');
      el.classList.add('widget-size-' + w.size);
      el.style.display = w.visible ? '' : 'none';
      var target = w.column === 'main' ? columnMain : columnSide;
      target.appendChild(el);
    });
  }

  // メール／アプリリンクは専用ページ(view-mail/view-links)を持つため、現在の画面に応じて
  // ホーム画面のウィジェット配置を適用した直後に、該当カードだけ専用ページへ移し替える。
  function placeWidgetsForCurrentView() {
    if (!state.home) return;
    applyWidgetLayout(state.home.userSettings);
    if (state.currentView === 'mail') {
      qs('view-mail').appendChild(qs('card-mail'));
    } else if (state.currentView === 'links') {
      qs('view-links').appendChild(qs('card-links'));
    }
  }

  // ===================== カレンダー（メイン・月ナビゲーション対応） =====================
  var WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

  function monthRangeIso(year, month) {
    var start = new Date(year, month, 1, 0, 0, 0, 0);
    var end = new Date(year, month + 1, 1, 0, 0, 0, 0);
    return { startIso: start.toISOString(), endIso: end.toISOString() };
  }

  function loadCalendarMonth(year, month) {
    if (!state.home) return Promise.resolve();
    var range = monthRangeIso(year, month);
    var calendarIds = state.home.globalSettings.syncCalendarIds;
    return Promise.all([
      gasRun('getCalendarEvents', calendarIds, range.startIso, range.endIso),
      gasRun('getCalendarDayInfo', year, month)
    ]).then(function (results) {
      var events = results[0];
      var dayInfoList = results[1];
      var dayInfoByDay = {};
      dayInfoList.forEach(function (info) { dayInfoByDay[info.day] = info; });
      state.calendar.year = year;
      state.calendar.month = month;
      state.calendar.events = events;
      state.calendar.dayInfoByDay = dayInfoByDay;
      renderMiniCalendar(year, month, events, dayInfoByDay);
    }).catch(showError);
  }

  function loadTodayEvents() {
    if (!state.home) return Promise.resolve();
    var t = new Date();
    var start = new Date(t.getFullYear(), t.getMonth(), t.getDate(), 0, 0, 0, 0);
    var end = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1, 0, 0, 0, 0);
    var calendarIds = state.home.globalSettings.syncCalendarIds;
    return gasRun('getCalendarEvents', calendarIds, start.toISOString(), end.toISOString()).then(function (events) {
      renderTodayList(events);
    }).catch(showError);
  }

  // ===================== 予定の種類（カテゴリ）色分け =====================
  function categoryHex(colorId) {
    var found = state.eventCategories.filter(function (c) { return c.id === colorId; })[0];
    return found ? found.hex : '#dadce0';
  }

  function categoryLabel(colorId) {
    var found = state.eventCategories.filter(function (c) { return c.id === colorId; })[0];
    return found ? found.label : '未設定';
  }

  function renderTodayList(events) {
    var container = qs('today-list');
    if (events.length === 0) {
      container.innerHTML = '<div class="empty-hint">今日の予定はありません</div>';
      return;
    }
    var sorted = events.slice().sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
    container.innerHTML = sorted.map(function (ev) {
      var timeLabel = ev.allDay ? '終日' : formatTime(ev.start) + '〜' + formatTime(ev.end);
      return '<div class="today-item">' +
        '<div class="t-time">' + timeLabel + '</div>' +
        '<div><div class="t-title"><span class="category-dot" style="background:' + categoryHex(ev.categoryColorId) + ';"></span>' + escapeHtml(ev.title || '(無題)') + '</div></div>' +
        '</div>';
    }).join('');
  }

  function renderMiniCalendar(year, month, events, dayInfoByDay) {
    dayInfoByDay = dayInfoByDay || {};
    qs('calendar-month-label').textContent = (year + '年' + (month + 1) + '月');

    var now = new Date();
    var firstDay = new Date(year, month, 1);
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var startWeekday = firstDay.getDay();

    var eventsByDay = {};
    events.forEach(function (ev) {
      var d = new Date(ev.start);
      if (d.getFullYear() === year && d.getMonth() === month) {
        var day = d.getDate();
        (eventsByDay[day] = eventsByDay[day] || []).push(ev);
      }
    });

    var weekdaysHtml = WEEKDAY_LABELS.map(function (w) { return '<span>' + w + '</span>'; }).join('');
    qs('mini-calendar').innerHTML =
      '<div class="cal-weekdays">' + weekdaysHtml + '</div>' +
      '<div class="cal-grid" id="cal-grid"></div>';

    var MAX_DOTS = 4;
    var grid = qs('cal-grid');
    var html = '';
    for (var i = 0; i < startWeekday; i++) {
      html += '<div class="cal-cell empty"></div>';
    }
    for (var day = 1; day <= daysInMonth; day++) {
      var dayEvents = eventsByDay[day] || [];
      var isToday = year === now.getFullYear() && month === now.getMonth() && day === now.getDate();
      var info = dayInfoByDay[day];
      var isHoliday = !!(info && info.holidayName);
      var dotsHtml = dayEvents.slice(0, MAX_DOTS).map(function (ev) {
        return '<span class="dot" style="background:' + categoryHex(ev.categoryColorId) + ';" title="' + escapeHtml(ev.title || '') + '"></span>';
      }).join('');
      if (dayEvents.length > MAX_DOTS) {
        dotsHtml += '<span class="dot-more">+' + (dayEvents.length - MAX_DOTS) + '</span>';
      }
      html += '<div class="cal-cell' + (isToday ? ' is-today' : '') + (isHoliday ? ' is-holiday' : '') + '" data-day="' + day + '">' +
        '<div class="day-num">' + day + '</div>' +
        (info ? '<div class="rokuyo-label">' + escapeHtml(info.rokuyo) + '</div>' : '') +
        (isHoliday ? '<div class="holiday-label">' + escapeHtml(info.holidayName) + '</div>' : '') +
        (dayEvents.length > 0 ? '<div class="dots">' + dotsHtml + '</div>' : '') +
        '</div>';
    }
    var totalCells = startWeekday + daysInMonth;
    var trailing = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
    for (var j = 0; j < trailing; j++) {
      html += '<div class="cal-cell empty"></div>';
    }
    grid.innerHTML = html;

    Array.prototype.forEach.call(grid.querySelectorAll('.cal-cell[data-day]'), function (cell) {
      cell.addEventListener('click', function () {
        openDayDetail(parseInt(cell.getAttribute('data-day'), 10));
      });
    });
  }

  // ===================== 日付タップ時のポップアップ（その日の予定一覧・編集） =====================
  function openDayDetail(day) {
    var year = state.calendar.year;
    var month = state.calendar.month;
    state.dayDetail = { year: year, month: month, day: day };

    var dayEvents = state.calendar.events.filter(function (ev) {
      var d = new Date(ev.start);
      return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
    }).sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });

    var dateObj = new Date(year, month, day);
    var info = state.calendar.dayInfoByDay[day];
    var titleSuffix = info ? '・' + info.rokuyo + (info.holidayName ? '・' + info.holidayName : '') : '';
    qs('day-detail-title').textContent = year + '年' + (month + 1) + '月' + day + '日（' + WEEKDAY_LABELS[dateObj.getDay()] + '）' + titleSuffix;

    var list = qs('day-detail-list');
    list.innerHTML = dayEvents.length === 0
      ? '<div class="empty-hint">この日の予定はありません</div>'
      : dayEvents.map(function (ev) {
        var catLabel = ev.categoryColorId ? '<span class="category-badge"><span class="category-dot" style="background:' + categoryHex(ev.categoryColorId) + ';"></span>' + escapeHtml(categoryLabel(ev.categoryColorId)) + '</span>' : '';
        var timeLabel = ev.allDay ? '終日' : formatTime(ev.start) + ' 〜 ' + formatTime(ev.end);
        return '<div class="link-row" data-event-id="' + escapeHtml(ev.id) + '" data-calendar-id="' + escapeHtml(ev.calendarId) + '">' +
          '<div>' +
          '<div class="name"><span class="category-dot" style="background:' + categoryHex(ev.categoryColorId) + ';"></span>' + escapeHtml(ev.title || '(無題)') + catLabel + '</div>' +
          '<div class="desc">' + timeLabel + '</div>' +
          '</div>' +
          '<button type="button" class="btn-edit-event">編集</button>' +
          '</div>';
      }).join('');

    Array.prototype.forEach.call(list.querySelectorAll('.btn-edit-event'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-event-id]');
        qs('day-detail-modal').hidden = true;
        openEventModal(row.getAttribute('data-calendar-id'), row.getAttribute('data-event-id'));
      });
    });

    qs('day-detail-modal').hidden = false;
  }

  function initDayDetail() {
    qs('btn-day-detail-close').addEventListener('click', function () { qs('day-detail-modal').hidden = true; });
    qs('btn-day-add-event').addEventListener('click', function () {
      var d = state.dayDetail;
      qs('day-detail-modal').hidden = true;
      openEventModal(null, null, d ? new Date(d.year, d.month, d.day, 9, 0, 0, 0) : null);
    });
  }

  function formatTime(iso) {
    var d = new Date(iso);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function formatDateTime(iso) {
    var d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + formatTime(iso);
  }

  function populateEventCalendarOptions(calendars) {
    var select = qs('event-calendar');
    select.innerHTML = calendars.map(function (c) {
      return '<option value="' + escapeHtml(c.id) + '">' + escapeHtml(c.name) + '</option>';
    }).join('');
  }

  function initCalendarNav() {
    qs('btn-cal-prev').addEventListener('click', function () {
      var m = state.calendar.month - 1, y = state.calendar.year;
      if (m < 0) { m = 11; y--; }
      loadCalendarMonth(y, m);
    });
    qs('btn-cal-next').addEventListener('click', function () {
      var m = state.calendar.month + 1, y = state.calendar.year;
      if (m > 11) { m = 0; y++; }
      loadCalendarMonth(y, m);
    });
    qs('btn-cal-today').addEventListener('click', function () {
      var t = new Date();
      loadCalendarMonth(t.getFullYear(), t.getMonth());
    });
  }

  function renderCategorySwatchPicker(categories, selectedId) {
    var container = qs('event-category-select');
    container.innerHTML = categories.map(function (cat) {
      var selected = cat.id === selectedId ? ' selected' : '';
      return '<button type="button" class="category-swatch' + selected + '" data-category-id="' + escapeHtml(cat.id) + '">' +
        '<span class="category-dot" style="background:' + cat.hex + ';"></span>' + escapeHtml(cat.label) +
        '</button>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.category-swatch'), function (btn) {
      btn.addEventListener('click', function () {
        qs('event-category').value = btn.getAttribute('data-category-id');
        Array.prototype.forEach.call(container.querySelectorAll('.category-swatch'), function (b) {
          b.classList.toggle('selected', b === btn);
        });
      });
    });
  }

  function openEventModal(calendarId, eventId, presetDate) {
    var modal = qs('event-modal');
    qs('event-id').value = eventId || '';
    qs('event-modal-title').textContent = eventId ? '予定を編集' : '予定を追加';
    qs('btn-event-delete').hidden = !eventId;
    qs('event-allday').checked = false;
    qs('event-guests').value = '';
    qs('event-description').value = '';

    var categoryColorId = '';
    if (eventId) {
      var ev = state.calendar.events.filter(function (e) { return e.id === eventId; })[0];
      if (ev) {
        if (calendarId) qs('event-calendar').value = calendarId;
        qs('event-title').value = ev.title;
        qs('event-allday').checked = ev.allDay;
        qs('event-start').value = toDatetimeLocal(ev.start);
        qs('event-end').value = toDatetimeLocal(ev.end);
        qs('event-guests').value = ev.guests.join(', ');
        categoryColorId = ev.categoryColorId || '';
      }
    } else {
      qs('event-title').value = '';
      var base = presetDate || new Date();
      qs('event-start').value = toDatetimeLocal(base.toISOString());
      qs('event-end').value = toDatetimeLocal(new Date(base.getTime() + 60 * 60 * 1000).toISOString());
      if (calendarId) qs('event-calendar').value = calendarId;
    }
    qs('event-category').value = categoryColorId;
    renderCategorySwatchPicker(state.eventCategories, categoryColorId);
    modal.hidden = false;
  }

  function toDatetimeLocal(iso) {
    var d = new Date(iso);
    var pad = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' +
      pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function refreshCalendarViews() {
    return Promise.all([loadCalendarMonth(state.calendar.year, state.calendar.month), loadTodayEvents()]);
  }

  function initEventModal() {
    qs('btn-new-event').addEventListener('click', function () { openEventModal(null, null); });
    qs('btn-event-cancel').addEventListener('click', function () { qs('event-modal').hidden = true; });

    qs('btn-event-save').addEventListener('click', function () {
      var id = qs('event-id').value;
      var calendarId = qs('event-calendar').value;
      var title = qs('event-title').value.trim();
      if (!title) { window.alert('タイトルを入力してください'); return; }
      var startIso = new Date(qs('event-start').value).toISOString();
      var endIso = new Date(qs('event-end').value).toISOString();
      var allDay = qs('event-allday').checked;
      var guests = qs('event-guests').value;
      var description = qs('event-description').value;
      var categoryColorId = qs('event-category').value;

      var promise = id
        ? gasRun('updateCalendarEvent', calendarId, id, title, startIso, endIso, guests, description, categoryColorId)
        : gasRun('createCalendarEvent', calendarId, title, startIso, endIso, allDay, guests, description, categoryColorId);

      promise.then(function () {
        qs('event-modal').hidden = true;
        return refreshCalendarViews();
      }).catch(showError);
    });

    qs('btn-event-delete').addEventListener('click', function () {
      if (!window.confirm('この予定を削除しますか？')) return;
      var id = qs('event-id').value;
      var calendarId = qs('event-calendar').value;
      gasRun('deleteCalendarEvent', calendarId, id).then(function () {
        qs('event-modal').hidden = true;
        return refreshCalendarViews();
      }).catch(showError);
    });
  }

  // ===================== メール =====================
  function renderMailList(mails, mailCount) {
    qs('mail-count-label').textContent = mailCount;
    var container = qs('mail-list');
    if (mails.length === 0) {
      container.innerHTML = '<div class="empty-hint">新着メールはありません</div>';
      return;
    }
    container.innerHTML = mails.map(function (m) {
      return '<div class="mail-row' + (m.isUnread ? ' unread' : '') + '" data-thread-id="' + escapeHtml(m.threadId) + '">' +
        '<div class="subject">' + escapeHtml(m.subject || '(件名なし)') + '</div>' +
        '<div class="date">' + formatDateTime(m.date) + '</div>' +
        '</div>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.mail-row'), function (row) {
      row.addEventListener('click', function () {
        openMailDetail(row.getAttribute('data-thread-id'));
      });
    });

    var unread = mails.filter(function (m) { return m.isUnread; }).length;
    var unreadLabel = unread > 9 ? '9+' : String(unread);
    var headerBadge = qs('mail-badge');
    headerBadge.textContent = unreadLabel;
    headerBadge.hidden = unread === 0;
    var navBadge = qs('nav-mail-badge');
    navBadge.textContent = unreadLabel;
    navBadge.hidden = unread === 0;
  }

  function openMailDetail(threadId) {
    var modal = qs('mail-detail-modal');
    qs('mail-detail-subject').textContent = '読み込み中...';
    qs('mail-detail-meta').textContent = '';
    qs('mail-detail-body').textContent = '';
    modal.hidden = false;

    gasRun('getMailBody', threadId).then(function (mail) {
      qs('mail-detail-subject').textContent = mail.subject || '(件名なし)';
      qs('mail-detail-meta').textContent = mail.from + ' ・ ' + formatDateTime(mail.date);
      qs('mail-detail-body').textContent = mail.bodyPlain;
    }).catch(function (err) {
      modal.hidden = true;
      showError(err);
    });
  }

  function initMail() {
    qs('btn-mail-refresh').addEventListener('click', function () { loadHome(); });
    qs('btn-mail-shortcut').addEventListener('click', function () { switchView('mail'); });
    qs('btn-mail-viewall').addEventListener('click', function () { switchView('mail'); });
    qs('btn-mail-detail-close').addEventListener('click', function () { qs('mail-detail-modal').hidden = true; });

    qs('btn-mail-compose').addEventListener('click', function () {
      qs('mail-compose-to').value = '';
      qs('mail-compose-subject').value = '';
      qs('mail-compose-body').value = '';
      qs('mail-compose-modal').hidden = false;
    });
    qs('btn-mail-compose-cancel').addEventListener('click', function () { qs('mail-compose-modal').hidden = true; });
    qs('btn-mail-compose-send').addEventListener('click', function () {
      var to = qs('mail-compose-to').value.trim();
      var subject = qs('mail-compose-subject').value.trim();
      var body = qs('mail-compose-body').value;
      if (!to) { window.alert('宛先を入力してください'); return; }
      gasRun('sendMail', to, subject, body).then(function () {
        qs('mail-compose-modal').hidden = true;
        window.alert('メールを送信しました');
      }).catch(showError);
    });
  }

  // ===================== ヘッダー: お知らせ（ベル） =====================
  function renderNotifications(home) {
    var items = [];
    home.mails.filter(function (m) { return m.isUnread; }).forEach(function (m) {
      items.push({ icon: 'icon-mail', title: m.subject || '(件名なし)', sub: m.from, date: m.date });
    });
    home.apps.filter(function (a) { return a.status === 'error'; }).forEach(function (a) {
      items.push({ icon: 'icon-link', title: a.name + ' が応答していません', sub: 'アプリリンク集で確認してください', date: a.lastCheckedAt || a.addedAt });
    });
    items.sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });

    var list = qs('notif-list');
    list.innerHTML = items.length === 0
      ? '<div class="dropdown-empty">新しいお知らせはありません</div>'
      : items.map(function (item) {
        return '<div class="dropdown-item">' +
          '<svg class="icon icon-sm"><use href="#' + item.icon + '"></use></svg>' +
          '<div><div class="d-title">' + escapeHtml(item.title) + '</div><div class="d-sub">' + escapeHtml(item.sub) + '</div></div>' +
          '</div>';
      }).join('');

    var badge = qs('notif-badge');
    badge.textContent = items.length > 9 ? '9+' : String(items.length);
    badge.hidden = items.length === 0;
  }

  function closeAllDropdowns(except) {
    ['notif-panel', 'search-results'].forEach(function (id) {
      if (id !== except) qs(id).hidden = true;
    });
  }

  function initNotifications() {
    qs('btn-notif').addEventListener('click', function (e) {
      e.stopPropagation();
      var panel = qs('notif-panel');
      var willOpen = panel.hidden;
      closeAllDropdowns();
      panel.hidden = !willOpen;
    });
    document.addEventListener('click', function () { closeAllDropdowns(); });
  }

  // ===================== ヘッダー: 横断検索 =====================
  function initSearch() {
    var input = qs('global-search');
    var results = qs('search-results');
    var timer = null;

    input.addEventListener('click', function (e) { e.stopPropagation(); });
    results.addEventListener('click', function (e) { e.stopPropagation(); });

    input.addEventListener('input', function () {
      var query = input.value.trim();
      clearTimeout(timer);
      if (!query) { results.hidden = true; return; }
      timer = setTimeout(function () {
        gasRun('globalSearch', query).then(function (found) {
          renderSearchResults(found);
        }).catch(showError);
      }, 300);
    });
  }

  function renderSearchResults(found) {
    var results = qs('search-results');
    var hasAny = found.apps.length > 0 || found.files.length > 0;
    if (!hasAny) {
      results.innerHTML = '<div class="dropdown-empty">一致する結果がありません</div>';
      results.hidden = false;
      return;
    }
    var html = '';
    if (found.apps.length > 0) {
      html += '<div class="search-group-label">アプリ</div>';
      html += found.apps.map(function (app) {
        return '<div class="search-result-row" data-open="' + escapeHtml(app.url) + '">' +
          '<div class="r-name">' + escapeHtml(app.name) + '</div>' +
          '<div class="r-desc">' + escapeHtml(app.url) + '</div></div>';
      }).join('');
    }
    if (found.files.length > 0) {
      html += '<div class="search-group-label">Drive</div>';
      html += found.files.map(function (f) {
        return '<div class="search-result-row" data-open="' + escapeHtml(f.url) + '">' +
          '<div class="r-name">' + escapeHtml(f.name) + '</div>' +
          '<div class="r-desc">' + escapeHtml(f.mimeType) + '</div></div>';
      }).join('');
    }
    results.innerHTML = html;
    results.hidden = false;
    Array.prototype.forEach.call(results.querySelectorAll('.search-result-row'), function (row) {
      row.addEventListener('click', function () {
        window.open(row.getAttribute('data-open'), '_blank');
        results.hidden = true;
      });
    });
  }

  // ===================== アプリ台帳（リンク集） =====================
  function statusLabel(status) {
    if (status === 'ok') return 'OK';
    if (status === 'error') return 'エラー';
    return '未確認';
  }

  function renderAppList(apps) {
    var container = qs('app-list');
    if (apps.length === 0) {
      container.innerHTML = '<div class="empty-hint">URLを貼り付けて登録してください</div>';
      return;
    }
    container.innerHTML = apps.map(function (app) {
      return '<div class="link-row" data-app-id="' + escapeHtml(app.id) + '">' +
        '<div>' +
        '<div class="name"><a href="' + escapeHtml(app.url) + '" target="_blank" rel="noopener">' + escapeHtml(app.name) + '</a> ' +
        '<span class="status-badge ' + app.status + '">' + statusLabel(app.status) + '</span></div>' +
        '<div class="desc">' + escapeHtml(app.url) + '</div>' +
        '</div>' +
        '<span>' +
        '<button type="button" class="btn-app-check">確認</button>' +
        '<button type="button" class="icon-only btn-app-delete" aria-label="削除" title="削除"><svg class="icon icon-sm"><use href="#icon-trash"></use></svg></button>' +
        '</span>' +
        '</div>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.btn-app-check'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-app-id]');
        gasRun('checkApp', row.getAttribute('data-app-id')).then(function () { return loadHome(); }).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-app-delete'), function (btn) {
      btn.addEventListener('click', function () {
        if (!window.confirm('このリンクを台帳から削除しますか？')) return;
        var row = btn.closest('[data-app-id]');
        gasRun('deleteApp', row.getAttribute('data-app-id')).then(function () { return loadHome(); }).catch(showError);
      });
    });
  }

  function initAppLedger() {
    qs('btn-links-viewall').addEventListener('click', function () { switchView('links'); });
    qs('btn-check-all').addEventListener('click', function () {
      gasRun('checkAllApps').then(function () { return loadHome(); }).catch(showError);
    });

    qs('btn-app-add').addEventListener('click', function () {
      var input = qs('app-url-input');
      var url = input.value.trim();
      if (!url) { window.alert('URLを入力してください'); return; }
      gasRun('addApp', url).then(function () {
        input.value = '';
        return loadHome();
      }).catch(showError);
    });
    qs('app-url-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') qs('btn-app-add').click();
    });
  }

  // ===================== Drive =====================
  function driveIconAndSize(item) {
    var sizeLabel = item.isFolder ? '' : formatBytes(item.sizeBytes);
    return '<img src="' + escapeHtml(item.iconUrl) + '" alt="">' +
      '<div class="name">' + escapeHtml(item.name) + '</div>' +
      '<div class="meta">' + sizeLabel + '</div>';
  }

  function formatBytes(bytes) {
    if (!bytes) return '';
    var units = ['B', 'KB', 'MB', 'GB'];
    var value = bytes;
    var unitIndex = 0;
    while (value >= 1024 && unitIndex < units.length - 1) {
      value = value / 1024;
      unitIndex++;
    }
    return value.toFixed(unitIndex === 0 ? 0 : 1) + units[unitIndex];
  }

  function renderDriveList(items) {
    var container = qs('drive-list');
    if (items.length === 0) {
      container.innerHTML = '<div class="empty-hint">ファイルがありません</div>';
      return;
    }
    container.innerHTML = items.map(function (item) {
      return '<div class="drive-row" data-file-id="' + escapeHtml(item.id) + '" data-is-folder="' + item.isFolder + '">' +
        driveIconAndSize(item) +
        '<span>' +
        (item.isFolder
          ? '<button type="button" class="btn-drive-open">開く</button>'
          : '<button type="button" class="btn-drive-preview">プレビュー</button>') +
        '<button type="button" class="btn-drive-rename">名称変更</button>' +
        '<button type="button" class="btn-drive-share">共有</button>' +
        '<button type="button" class="btn-drive-move">移動</button>' +
        '</span></div>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-open'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        loadDriveFolder(row.getAttribute('data-file-id'));
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-preview'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        gasRun('getDrivePreviewUrl', row.getAttribute('data-file-id')).then(function (url) {
          qs('drive-preview-frame').src = url;
          qs('drive-preview-modal').hidden = false;
        }).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-rename'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        var item = state.drive.items.filter(function (i) { return i.id === row.getAttribute('data-file-id'); })[0];
        qs('drive-rename-file-id').value = row.getAttribute('data-file-id');
        qs('drive-rename-is-folder').value = row.getAttribute('data-is-folder');
        qs('drive-rename-name').value = item ? item.name : '';
        qs('drive-rename-modal').hidden = false;
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-share'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        qs('drive-share-file-id').value = row.getAttribute('data-file-id');
        qs('drive-share-modal').hidden = false;
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-move'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        qs('drive-move-file-id').value = row.getAttribute('data-file-id');
        qs('drive-move-dest').value = '';
        qs('drive-move-modal').hidden = false;
      });
    });
  }

  function loadDriveFolder(folderId) {
    state.drive.currentFolderId = folderId;
    return gasRun('listDriveFiles', folderId, state.drive.sortKey, state.drive.ascending).then(function (items) {
      state.drive.items = items;
      renderDriveList(items);
    }).catch(showError);
  }

  function initDrive() {
    qs('btn-drive-refresh').addEventListener('click', function () { loadDriveFolder(state.drive.currentFolderId); });
    qs('btn-drive-up').addEventListener('click', function () { loadDriveFolder(null); });

    qs('btn-drive-search').addEventListener('click', function () {
      var query = qs('drive-search').value.trim();
      if (!query) { loadDriveFolder(state.drive.currentFolderId); return; }
      gasRun('searchDriveFiles', query).then(function (items) {
        state.drive.items = items;
        renderDriveList(items);
      }).catch(showError);
    });

    qs('drive-sort').addEventListener('change', function () {
      state.drive.sortKey = qs('drive-sort').value;
      loadDriveFolder(state.drive.currentFolderId);
    });
    qs('drive-order').addEventListener('change', function () {
      state.drive.ascending = qs('drive-order').value === 'asc';
      loadDriveFolder(state.drive.currentFolderId);
    });

    qs('btn-drive-preview-close').addEventListener('click', function () {
      qs('drive-preview-frame').src = 'about:blank';
      qs('drive-preview-modal').hidden = true;
    });

    qs('btn-drive-share-cancel').addEventListener('click', function () { qs('drive-share-modal').hidden = true; });
    qs('btn-drive-share-save').addEventListener('click', function () {
      var fileId = qs('drive-share-file-id').value;
      var access = qs('drive-share-access').value;
      var permission = qs('drive-share-permission').value;
      gasRun('updateDriveSharing', fileId, access, permission).then(function () {
        qs('drive-share-modal').hidden = true;
        return loadDriveFolder(state.drive.currentFolderId);
      }).catch(showError);
    });

    qs('btn-drive-move-cancel').addEventListener('click', function () { qs('drive-move-modal').hidden = true; });
    qs('btn-drive-move-save').addEventListener('click', function () {
      var fileId = qs('drive-move-file-id').value;
      var destination = qs('drive-move-dest').value.trim();
      if (!destination) { window.alert('移動先フォルダIDを入力してください'); return; }
      gasRun('moveDriveFile', fileId, destination).then(function () {
        qs('drive-move-modal').hidden = true;
        return loadDriveFolder(state.drive.currentFolderId);
      }).catch(showError);
    });

    qs('btn-drive-rename-cancel').addEventListener('click', function () { qs('drive-rename-modal').hidden = true; });
    qs('btn-drive-rename-save').addEventListener('click', function () {
      var fileId = qs('drive-rename-file-id').value;
      var isFolder = qs('drive-rename-is-folder').value === 'true';
      var newName = qs('drive-rename-name').value.trim();
      if (!newName) { window.alert('新しい名前を入力してください'); return; }
      gasRun('renameDriveEntry', fileId, newName, isFolder).then(function () {
        qs('drive-rename-modal').hidden = true;
        return loadDriveFolder(state.drive.currentFolderId);
      }).catch(showError);
    });
  }

  // ===================== 設定画面: テーマ配色（11色 + ランダム = 12択） =====================
  function renderThemeSwatches(choices, selectedId) {
    var grid = qs('theme-swatch-grid');
    grid.innerHTML = choices.map(function (choice) {
      var isRandom = choice.hex === null;
      var selected = choice.id === selectedId ? ' selected' : '';
      var swatchInner = isRandom
        ? '<svg class="icon"><use href="#icon-shuffle"></use></svg>'
        : '';
      var swatchStyle = isRandom ? '' : ' style="background:' + choice.hex + ';"';
      return '<button type="button" class="theme-swatch' + selected + '" data-theme-id="' + escapeHtml(choice.id) + '">' +
        '<span class="swatch-color' + (isRandom ? ' is-random' : '') + '"' + swatchStyle + '>' + swatchInner + '</span>' +
        '<span>' + escapeHtml(choice.name) + '</span>' +
        '</button>';
    }).join('');

    Array.prototype.forEach.call(grid.querySelectorAll('.theme-swatch'), function (btn) {
      btn.addEventListener('click', function () {
        var themeId = btn.getAttribute('data-theme-id');
        gasRun('saveUserSettings', { themeChoice: themeId }).then(function () {
          return loadHome();
        }).catch(showError);
      });
    });
  }

  // ===================== 設定画面 =====================
  function populateSettingsForm(userSettings, globalSettings, calendars, themeChoices) {
    renderThemeSwatches(themeChoices, userSettings.themeChoice);

    qs('setting-mail-count').value = userSettings.mailCount;
    renderWidgetSettingsList(userSettings.widgets);
    renderCustomNavSettingsList(userSettings.customNavItems);

    qs('setting-mail-label').value = globalSettings.mailLabel;
    qs('setting-notify-enabled').checked = globalSettings.notifyEnabled;

    var syncSet = {};
    globalSettings.syncCalendarIds.forEach(function (id) { syncSet[id] = true; });
    var listHtml = calendars.map(function (cal) {
      var checked = syncSet[cal.id] ? ' checked' : '';
      return '<div class="checkbox-row">' +
        '<input type="checkbox" class="sync-calendar-checkbox" value="' + escapeHtml(cal.id) + '"' + checked + '>' +
        '<label style="margin:0;">' + escapeHtml(cal.name) + '</label></div>';
    }).join('');
    qs('sync-calendar-list').innerHTML = listHtml || '<div class="empty-hint">利用可能なカレンダーがありません</div>';
  }

  // ---- ウィジェット（カレンダー/今日の予定/メール/アプリリンク集）の配置・サイズ設定 ----
  function widgetOptionsHtml(labelMap, selectedValue) {
    return Object.keys(labelMap).map(function (value) {
      return '<option value="' + value + '"' + (value === selectedValue ? ' selected' : '') + '>' + labelMap[value] + '</option>';
    }).join('');
  }

  function renderWidgetSettingsList(widgets) {
    var tbody = qs('widget-settings-list');
    tbody.innerHTML = widgets.map(function (w, index) {
      return '<tr data-widget-id="' + w.id + '">' +
        '<td><input type="checkbox" class="widget-visible"' + (w.visible ? ' checked' : '') + '></td>' +
        '<td>' + WIDGET_LABELS[w.id] + '</td>' +
        '<td><select class="widget-column">' + widgetOptionsHtml(WIDGET_COLUMN_LABELS, w.column) + '</select></td>' +
        '<td><select class="widget-size">' + widgetOptionsHtml(WIDGET_SIZE_LABELS, w.size) + '</select></td>' +
        '<td style="text-align:right; white-space:nowrap;">' +
        '<button type="button" class="btn-order-up" ' + (index === 0 ? 'disabled' : '') + '>↑</button> ' +
        '<button type="button" class="btn-order-down" ' + (index === widgets.length - 1 ? 'disabled' : '') + '>↓</button>' +
        '</td></tr>';
    }).join('');

    Array.prototype.forEach.call(tbody.querySelectorAll('.btn-order-up'), function (btn) {
      btn.addEventListener('click', function () { moveWidgetOrder(btn.closest('tr'), -1); });
    });
    Array.prototype.forEach.call(tbody.querySelectorAll('.btn-order-down'), function (btn) {
      btn.addEventListener('click', function () { moveWidgetOrder(btn.closest('tr'), 1); });
    });
  }

  function moveWidgetOrder(row, direction) {
    var sibling = direction < 0 ? row.previousElementSibling : row.nextElementSibling;
    if (!sibling) return;
    if (direction < 0) row.parentNode.insertBefore(row, sibling);
    else row.parentNode.insertBefore(sibling, row);
    renderWidgetSettingsList(currentWidgetSettings());
  }

  function currentWidgetSettings() {
    return Array.prototype.map.call(qs('widget-settings-list').querySelectorAll('tr'), function (tr) {
      return {
        id: tr.getAttribute('data-widget-id'),
        visible: tr.querySelector('.widget-visible').checked,
        column: tr.querySelector('.widget-column').value,
        size: tr.querySelector('.widget-size').value
      };
    });
  }

  // ---- カスタムナビ項目（個人用ショートカット） ----
  function renderCustomNav(items) {
    var list = qs('nav-custom-list');
    qs('nav-custom-divider').hidden = items.length === 0;
    list.innerHTML = items.map(function (item) {
      return '<button type="button" class="nav-item nav-item-custom" data-url="' + escapeHtml(item.url) + '" title="' + escapeHtml(item.url) + '">' +
        '<svg class="icon"><use href="#icon-link"></use></svg><span>' + escapeHtml(item.label) + '</span>' +
        '</button>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.nav-item-custom'), function (btn) {
      btn.addEventListener('click', function () {
        window.open(btn.getAttribute('data-url'), '_blank', 'noopener');
      });
    });
  }

  function saveCustomNavItems(items) {
    return gasRun('saveUserSettings', { customNavItems: items }).then(function () {
      return loadHome();
    });
  }

  function renderCustomNavSettingsList(items) {
    var container = qs('custom-nav-settings-list');
    if (items.length === 0) {
      container.innerHTML = '<div class="empty-hint">まだカスタム項目がありません</div>';
      return;
    }
    container.innerHTML = items.map(function (item, index) {
      return '<div class="link-row" data-nav-item-id="' + escapeHtml(item.id) + '">' +
        '<div>' +
        '<div class="name">' + escapeHtml(item.label) + '</div>' +
        '<div class="desc">' + escapeHtml(item.url) + '</div>' +
        '</div>' +
        '<span>' +
        '<button type="button" class="btn-custom-nav-up" ' + (index === 0 ? 'disabled' : '') + '>↑</button> ' +
        '<button type="button" class="btn-custom-nav-down" ' + (index === items.length - 1 ? 'disabled' : '') + '>↓</button> ' +
        '<button type="button" class="icon-only btn-custom-nav-delete" aria-label="削除" title="削除"><svg class="icon icon-sm"><use href="#icon-trash"></use></svg></button>' +
        '</span>' +
        '</div>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.btn-custom-nav-delete'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('[data-nav-item-id]').getAttribute('data-nav-item-id');
        var next = items.filter(function (item) { return item.id !== id; });
        saveCustomNavItems(next).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-custom-nav-up'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('[data-nav-item-id]').getAttribute('data-nav-item-id');
        var idx = items.map(function (i) { return i.id; }).indexOf(id);
        if (idx <= 0) return;
        var next = items.slice();
        var tmp = next[idx - 1]; next[idx - 1] = next[idx]; next[idx] = tmp;
        saveCustomNavItems(next).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-custom-nav-down'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('[data-nav-item-id]').getAttribute('data-nav-item-id');
        var idx = items.map(function (i) { return i.id; }).indexOf(id);
        if (idx === -1 || idx >= items.length - 1) return;
        var next = items.slice();
        var tmp = next[idx + 1]; next[idx + 1] = next[idx]; next[idx] = tmp;
        saveCustomNavItems(next).catch(showError);
      });
    });
  }

  function initCustomNavSettings() {
    qs('btn-custom-nav-add').addEventListener('click', function () {
      var labelInput = qs('custom-nav-label-input');
      var urlInput = qs('custom-nav-url-input');
      var label = labelInput.value.trim();
      var url = urlInput.value.trim();
      if (!label) { window.alert('表示名を入力してください'); return; }
      if (!/^https?:\/\/.+/i.test(url)) { window.alert('http(s)から始まるURLを入力してください'); return; }
      var current = state.home ? state.home.userSettings.customNavItems : [];
      var next = current.concat([{ label: label, url: url }]);
      saveCustomNavItems(next).then(function () {
        labelInput.value = '';
        urlInput.value = '';
      }).catch(showError);
    });
  }

  function initSettings() {
    qs('btn-save-user-settings').addEventListener('click', function () {
      var settings = {
        widgets: currentWidgetSettings(),
        mailCount: parseInt(qs('setting-mail-count').value, 10) || 5
      };
      gasRun('saveUserSettings', settings).then(function () {
        return loadHome();
      }).then(function () {
        window.alert('個人設定を保存しました');
      }).catch(showError);
    });

    qs('btn-save-global-settings').addEventListener('click', function () {
      var syncCalendarIds = Array.prototype.map.call(
        document.querySelectorAll('.sync-calendar-checkbox:checked'),
        function (cb) { return cb.value; }
      );
      var settings = {
        syncCalendarIds: syncCalendarIds,
        mailLabel: qs('setting-mail-label').value.trim() || 'INBOX',
        notifyEnabled: qs('setting-notify-enabled').checked
      };
      gasRun('saveGlobalSettings', settings).then(function () {
        return loadHome();
      }).then(function () {
        window.alert('全体設定を保存しました');
      }).catch(showError);
    });
  }

  // ===================== 初期化 =====================
  document.addEventListener('DOMContentLoaded', function () {
    initNav();
    initEventModal();
    initCalendarNav();
    initDayDetail();
    initMail();
    initNotifications();
    initSearch();
    initAppLedger();
    initDrive();
    initSettings();
    initCustomNavSettings();
    loadHome();
  });
})();
</script>
