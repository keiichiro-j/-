<script>
(function () {
  'use strict';

  var GAS_CALL_TIMEOUT_MS = 25000;

  // ===== google.script.run を Promise 化するヘルパー =====
  function gasRun(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        reject(new Error('サーバーからの応答がありません。しばらくしてから再度お試しください。'));
      }, GAS_CALL_TIMEOUT_MS);

      google.script.run
        .withSuccessHandler(function (result) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(result);
        })
        .withFailureHandler(function (err) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(new Error(err && err.message ? err.message : String(err)));
        })
        [fnName].apply(null, args);
    });
  }

  function qs(id) { return document.getElementById(id); }
  function escapeHtml(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function showError(err) {
    window.alert(err && err.message ? err.message : String(err));
  }

  var WIDGET_LABELS = { calendar: 'カレンダー', today: '今日の予定', mail: 'メール', links: 'アプリリンク集', todo: 'ToDoリスト' };
  var WIDGET_IDS = ['calendar', 'today', 'mail', 'links'];
  var WIDGET_SIZE_LABELS = { small: '小', medium: '中', large: '大' };

  var now0 = new Date();
  var state = {
    home: null, // getHomeData() の結果一式（テーマ・設定・カレンダー・メール・アプリ台帳）
    themeChoices: [],
    eventCategories: [], // 予定の種類一覧（EventCategory.CATEGORIES）
    currentView: 'home', // 'home' | 'drive' | 'settings'
    calendar: {
      year: now0.getFullYear(),
      month: now0.getMonth(), // 0-indexed。表示中の月（前月/次月ボタンで変わる）
      events: [],
      dayInfoByDay: {}, // { day: { holidayName, rokuyo } } 表示中の月の祝日名・六曜
      viewMode: 'month', // 'month' | 'week' | 'day'
      refDate: now0 // 週表示/日表示のときの基準日（前/次ボタンで動く）
    },
    dayDetail: null, // 日付タップ時のポップアップで選択中の日 { year, month, day }
    drive: {
      currentFolderId: null,
      items: [],
      sortKey: 'updated',
      ascending: false,
      viewMode: 'list', // 'list' | 'grid'
      typeFilter: 'all'
    },
    mailPage: {
      selectedThreadId: null,
      selectedIds: {} // { threadId: true } 一括操作用の複数選択状態（メールタブのみ）
    },
    appLedger: {
      tagFilter: null // 選択中のタグ（nullは「すべて」）
    },
    mailDetailThreadId: null, // メールウィジェットのポップアップで開いているスレッドID（返信用）
    viewHistory: [] // 「戻る」ボタン用の閲覧履歴（直前に居た画面を積んでいく）
  };

  // ===================== トースト通知（保存完了などの一時メッセージ） =====================
  var toastTimer = null;
  function showToast(message) {
    var el = qs('toast');
    if (!el) { return; }
    clearTimeout(toastTimer);
    el.textContent = message;
    el.classList.add('is-visible');
    toastTimer = setTimeout(function () { el.classList.remove('is-visible'); }, 2400);
  }

  // ===================== 更新ボタンの読み込み演出 =====================
  // アイコンを回転させつつボタンを一時的に無効化する。ローカルのモック等ですぐ終わっても
  // 「読み込んでいる」ことがわかるよう、最低でも一定時間はアニメーションを表示する。
  function withSpinner(button, taskFn) {
    if (!button) return taskFn();
    button.classList.add('is-loading');
    button.disabled = true;
    var startedAt = Date.now();
    var MIN_MS = 400;
    function finish() {
      var wait = Math.max(0, MIN_MS - (Date.now() - startedAt));
      setTimeout(function () {
        button.classList.remove('is-loading');
        button.disabled = false;
      }, wait);
    }
    var result;
    try {
      result = taskFn();
    } catch (e) {
      finish();
      throw e;
    }
    if (result && typeof result.then === 'function') {
      return result.then(function (v) { finish(); return v; }, function (e) { finish(); throw e; });
    }
    finish();
    return result;
  }

  // ===================== テーマ適用（コントロールパネルのみ） =====================
  function applyTheme(theme) {
    var panel = qs('control-panel');
    panel.style.background = theme.hex;
    panel.style.color = theme.textColor;
    panel.setAttribute('data-text', theme.textColor === '#1a1a1a' ? 'dark' : 'light');
  }

  // ===================== 画面切り替え =====================
  // skipHistory: true の場合は履歴に積まない（「戻る」ボタン自身からの遷移で使う）
  function switchView(view, skipHistory) {
    if (!skipHistory && view !== state.currentView) {
      state.viewHistory.push(state.currentView);
    }
    state.currentView = view;
    qs('view-home').hidden = view !== 'home';
    qs('view-mail').hidden = view !== 'mail';
    qs('view-links').hidden = view !== 'links';
    qs('view-todo').hidden = view !== 'todo';
    qs('view-drive').hidden = view !== 'drive';
    qs('view-settings').hidden = view !== 'settings';
    qs('right-sidebar').hidden = view !== 'home';

    placeWidgetsForCurrentView();

    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-view') === view);
    });

    if (view === 'drive') {
      if (state.home) renderPinnedFolders(state.home.userSettings.pinnedFolders);
      applyDriveViewModeButtons();
      if (state.drive.items.length === 0) loadDriveFolder(null);
    }
    if (view === 'mail' && state.home) {
      renderMailPageList(state.home.mails);
    }
  }

  // 現在の画面に応じた「更新」処理を呼び分ける（ヘッダーの共通更新ボタン用）
  function refreshCurrentView() {
    if (state.currentView === 'mail') return refreshMailData();
    if (state.currentView === 'drive') return loadDriveFolder(state.drive.currentFolderId);
    return loadHome();
  }

  function initGlobalActions() {
    qs('btn-global-back').addEventListener('click', function () {
      var previous = state.viewHistory.pop();
      switchView(previous || 'home', true);
    });
    qs('btn-global-refresh').addEventListener('click', function (e) {
      withSpinner(e.currentTarget, refreshCurrentView);
    });
  }

  function initNav() {
    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (btn) {
      btn.addEventListener('click', function () {
        switchView(btn.getAttribute('data-view'));
      });
    });
  }

  // ===================== ヘッダー（アバター） =====================
  function renderAvatar(email) {
    var badge = qs('avatar-badge');
    badge.textContent = email ? email.charAt(0).toUpperCase() : '?';
    badge.title = email || '未ログイン';
  }

  // ===================== ホーム画面の読み込み =====================
  function loadHome() {
    return Promise.all([gasRun('getHomeData'), gasRun('listThemeChoices'), gasRun('listEventCategories')]).then(function (results) {
      var home = results[0];
      state.home = home;
      state.themeChoices = results[1];
      state.eventCategories = results[2];
      applyTheme(home.theme);
      applyDarkMode(home.userSettings.darkMode);
      placeWidgetsForCurrentView();
      renderAvatar(home.currentUserEmail);
      renderMailList(home.mails, home.userSettings.mailCount);
      renderAppList(home.apps);
      renderTodoList(home.todos);
      renderCustomNav(home.userSettings.customNavItems);
      populateEventCalendarOptions(home.calendars);
      renderCategorySwatchPicker(state.eventCategories, '');
      populateSettingsForm(home.userSettings, home.globalSettings, home.calendars, state.themeChoices);
      if (state.currentView === 'mail') {
        renderMailPageList(home.mails);
      }
      if (state.currentView === 'drive') {
        renderPinnedFolders(home.userSettings.pinnedFolders);
      }

      state.drive.viewMode = home.userSettings.driveViewMode || 'list';
      applyDriveViewModeButtons();

      var t = new Date();
      state.calendar.year = t.getFullYear();
      state.calendar.month = t.getMonth();
      state.calendar.refDate = t;
      state.calendar.viewMode = home.userSettings.calendarViewMode || 'month';
      applyCalendarViewModeButtons();
      return Promise.all([loadCalendarForCurrentMode(), loadTodayEvents()]);
    }).catch(showError);
  }

  // ===================== 表示モード（ライト/ダーク/システム） =====================
  function applyDarkMode(mode) {
    document.documentElement.setAttribute('data-dark-mode', mode || 'system');
  }

  function renderDarkModeSwitcher(selected) {
    var container = qs('dark-mode-switcher');
    if (!container) return;
    var options = [
      { id: 'system', label: 'システム', icon: 'icon-monitor' },
      { id: 'light', label: 'ライト', icon: 'icon-sun' },
      { id: 'dark', label: 'ダーク', icon: 'icon-moon' }
    ];
    container.innerHTML = options.map(function (opt) {
      var sel = opt.id === selected ? ' selected' : '';
      return '<button type="button" class="dark-mode-option' + sel + '" data-mode="' + opt.id + '">' +
        '<svg class="icon icon-sm"><use href="#' + opt.icon + '"></use></svg>' + opt.label + '</button>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.dark-mode-option'), function (btn) {
      btn.addEventListener('click', function () {
        var mode = btn.getAttribute('data-mode');
        applyDarkMode(mode);
        Array.prototype.forEach.call(container.querySelectorAll('.dark-mode-option'), function (b) {
          b.classList.toggle('selected', b === btn);
        });
        gasRun('saveUserSettings', { darkMode: mode }).then(function () {
          if (state.home) state.home.userSettings.darkMode = mode;
        }).catch(showError);
      });
    });
  }

  // ===================== ウィジェット（カレンダー/今日の予定/メール/アプリリンク集）の配置 =====================
  // 設定画面で選んだ配置先(メイン/サイドバー)・サイズ・表示可否を、実際のDOM配置に反映する。
  function applyWidgetLayout(userSettings) {
    var columnMain = qs('card-stack');
    var columnSide = qs('right-sidebar');
    userSettings.widgets.forEach(function (w) {
      var el = document.querySelector('[data-card="' + w.id + '"]');
      if (!el) return;
      el.classList.remove('widget-size-small', 'widget-size-medium', 'widget-size-large');
      el.classList.add('widget-size-' + w.size);
      el.style.display = w.visible ? '' : 'none';
      var target = w.column === 'main' ? columnMain : columnSide;
      target.appendChild(el);
    });
  }

  // アプリリンク集・ToDoリストは専用ページ(view-links/view-todo)を持つため、ホーム画面の
  // ウィジェット配置を適用した直後に、そのカードだけ専用ページへ移し替える。メールタブは
  // 独立したページ(Pages.html内のview-mail)を持つため、ホームのメールウィジェット(#card-mail)を
  // 移動する必要はない（右サイドバーごと非表示になっても影響を受けないようにするため、
  // あえて分離している）。
  function placeWidgetsForCurrentView() {
    if (!state.home) return;
    applyWidgetLayout(state.home.userSettings);
    if (state.currentView === 'links') {
      qs('view-links').appendChild(qs('card-links'));
    } else if (state.currentView === 'todo') {
      qs('view-todo').appendChild(qs('card-todo'));
    }
  }

  // ===================== カレンダー（メイン・月ナビゲーション対応） =====================
  var WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

  function monthRangeIso(year, month) {
    var start = new Date(year, month, 1, 0, 0, 0, 0);
    var end = new Date(year, month + 1, 1, 0, 0, 0, 0);
    return { startIso: start.toISOString(), endIso: end.toISOString() };
  }

  function loadCalendarMonth(year, month) {
    if (!state.home) return Promise.resolve();
    var range = monthRangeIso(year, month);
    var calendarIds = state.home.globalSettings.syncCalendarIds;
    return Promise.all([
      gasRun('getCalendarEvents', calendarIds, range.startIso, range.endIso),
      gasRun('getCalendarDayInfo', year, month)
    ]).then(function (results) {
      var events = results[0];
      var dayInfoList = results[1];
      var dayInfoByDay = {};
      dayInfoList.forEach(function (info) { dayInfoByDay[info.day] = info; });
      state.calendar.year = year;
      state.calendar.month = month;
      state.calendar.events = events;
      state.calendar.dayInfoByDay = dayInfoByDay;
      state.calendar.viewMode = 'month';
      state.calendar.refDate = new Date(year, month, 1);
      renderMiniCalendar(year, month, events, dayInfoByDay);
    }).catch(showError);
  }

  // 現在の表示モード(月/週/日)に応じてカレンダーを読み込む
  function loadCalendarForCurrentMode() {
    var anchor = state.calendar.refDate || new Date();
    if (state.calendar.viewMode === 'week') return loadCalendarWeek(anchor);
    if (state.calendar.viewMode === 'day') return loadCalendarDay(anchor);
    return loadCalendarMonth(anchor.getFullYear(), anchor.getMonth());
  }

  function ymd(date) {
    var pad = function (n) { return ('0' + n).slice(-2); };
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
  }

  function startOfWeek(date) {
    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setDate(d.getDate() - d.getDay());
    return d;
  }

  // 指定期間(startDate〜endDateExclusive)にまたがる月ぶんの祝日・六曜情報をまとめて取得し、
  // 'YYYY-MM-DD' をキーにした連想配列にする（週表示が月をまたぐケースに対応するため）
  function loadDayInfoRange(startDate, endDateExclusive) {
    var months = {};
    var cursor = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
    while (cursor < endDateExclusive) {
      var key = cursor.getFullYear() + '-' + cursor.getMonth();
      months[key] = { year: cursor.getFullYear(), month: cursor.getMonth() };
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
    }
    var monthKeys = Object.keys(months);
    return Promise.all(monthKeys.map(function (key) {
      var m = months[key];
      return gasRun('getCalendarDayInfo', m.year, m.month).then(function (list) {
        return { year: m.year, month: m.month, list: list };
      });
    })).then(function (results) {
      var map = {};
      results.forEach(function (r) {
        r.list.forEach(function (info) {
          map[ymd(new Date(r.year, r.month, info.day))] = info;
        });
      });
      return map;
    });
  }

  // カレンダー連携: 指定日が期限日のToDo一覧（ToDoリストウィジェット/タブと共通のstate.home.todosから）
  function todosDueOn(dateKey) {
    return (state.home && state.home.todos ? state.home.todos : []).filter(function (t) { return t.dueDate === dateKey; });
  }

  function buildAgendaDay(date, events, infoMap) {
    var key = ymd(date);
    var dayEvents = events.filter(function (ev) {
      return ymd(new Date(ev.start)) === key;
    }).sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
    return { date: date, key: key, events: dayEvents, todos: todosDueOn(key), info: infoMap[key] || null };
  }

  function renderCalendarLabel(mode, start, end) {
    var label = qs('calendar-month-label');
    if (mode === 'week') {
      var endInclusive = new Date(end);
      endInclusive.setDate(endInclusive.getDate() - 1);
      label.textContent = start.getFullYear() + '年' + (start.getMonth() + 1) + '月' + start.getDate() + '日 〜 ' +
        (endInclusive.getMonth() + 1) + '月' + endInclusive.getDate() + '日';
    } else {
      label.textContent = start.getFullYear() + '年' + (start.getMonth() + 1) + '月' + start.getDate() + '日（' + WEEKDAY_LABELS[start.getDay()] + '）';
    }
  }

  function loadCalendarWeek(anchorDate) {
    if (!state.home) return Promise.resolve();
    var start = startOfWeek(anchorDate);
    var end = new Date(start);
    end.setDate(end.getDate() + 7);
    var calendarIds = state.home.globalSettings.syncCalendarIds;
    return Promise.all([
      gasRun('getCalendarEvents', calendarIds, start.toISOString(), end.toISOString()),
      loadDayInfoRange(start, end)
    ]).then(function (results) {
      var events = results[0];
      var infoMap = results[1];
      state.calendar.viewMode = 'week';
      state.calendar.refDate = anchorDate;
      state.calendar.events = events;
      renderCalendarLabel('week', start, end);
      var days = [];
      for (var i = 0; i < 7; i++) {
        var d = new Date(start);
        d.setDate(d.getDate() + i);
        days.push(buildAgendaDay(d, events, infoMap));
      }
      renderAgendaView(days);
    }).catch(showError);
  }

  function loadCalendarDay(anchorDate) {
    if (!state.home) return Promise.resolve();
    var start = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), anchorDate.getDate());
    var end = new Date(start);
    end.setDate(end.getDate() + 1);
    var calendarIds = state.home.globalSettings.syncCalendarIds;
    return Promise.all([
      gasRun('getCalendarEvents', calendarIds, start.toISOString(), end.toISOString()),
      loadDayInfoRange(start, end)
    ]).then(function (results) {
      var events = results[0];
      var infoMap = results[1];
      state.calendar.viewMode = 'day';
      state.calendar.refDate = anchorDate;
      state.calendar.events = events;
      renderCalendarLabel('day', start, end);
      renderAgendaView([buildAgendaDay(start, events, infoMap)]);
    }).catch(showError);
  }

  // 週表示/日表示: 時刻の位置合わせは行わない簡易アジェンダ形式（1日ぶんを縦一列のリストで表示）
  function renderAgendaView(days) {
    var now = new Date();
    var html = days.map(function (d) {
      var isToday = ymd(now) === d.key;
      var isHoliday = !!(d.info && d.info.holidayName);
      var dateLabel = (d.date.getMonth() + 1) + '/' + d.date.getDate() + '（' + WEEKDAY_LABELS[d.date.getDay()] + '）';
      var eventsHtml = d.events.length === 0
        ? '<div class="empty-hint">予定はありません</div>'
        : d.events.map(function (ev) {
          var catLabel = ev.categoryColorId ? '<span class="category-badge"><span class="category-dot" style="background:' + categoryHex(ev.categoryColorId) + ';"></span>' + escapeHtml(categoryLabel(ev.categoryColorId)) + '</span>' : '';
          var timeLabel = ev.allDay ? '終日' : formatTime(ev.start) + ' 〜 ' + formatTime(ev.end);
          return '<div class="link-row" data-event-id="' + escapeHtml(ev.id) + '" data-calendar-id="' + escapeHtml(ev.calendarId) + '">' +
            '<div>' +
            '<div class="name"><span class="category-dot" style="background:' + categoryHex(ev.categoryColorId) + ';"></span>' + escapeHtml(ev.title || '(無題)') + catLabel + '</div>' +
            '<div class="desc">' + timeLabel + '</div>' +
            '</div>' +
            '<button type="button" class="btn-edit-event">編集</button>' +
            '</div>';
        }).join('');
      var todosHtml = d.todos.length === 0 ? '' : '<div class="agenda-todos">' + d.todos.map(function (t) {
        return '<div class="agenda-todo-row" data-todo-id="' + escapeHtml(t.id) + '">' +
          '<input type="checkbox" class="agenda-todo-check"' + (t.done ? ' checked' : '') + '>' +
          '<span class="todo-priority-dot ' + t.priority + '"></span>' +
          '<span class="todo-text' + (t.done ? ' done' : '') + '">' + escapeHtml(t.text) + '</span>' +
          '</div>';
      }).join('') + '</div>';
      return '<div class="agenda-day' + (isToday ? ' is-today' : '') + '">' +
        '<div class="agenda-day-head">' +
        '<span class="agenda-day-date">' + dateLabel + '</span>' +
        (d.info ? '<span class="agenda-holiday">' + escapeHtml(isHoliday ? d.info.holidayName : d.info.rokuyo) + '</span>' : '') +
        '<button type="button" class="agenda-add-btn" data-date-key="' + d.key + '"><svg class="icon icon-sm"><use href="#icon-plus"></use></svg>予定を追加</button>' +
        '</div>' +
        '<div class="agenda-events">' + eventsHtml + '</div>' +
        todosHtml +
        '</div>';
    }).join('');

    qs('mini-calendar').innerHTML = '<div class="cal-agenda">' + html + '</div>';

    var container = qs('mini-calendar');
    Array.prototype.forEach.call(container.querySelectorAll('.btn-edit-event'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-event-id]');
        openEventModal(row.getAttribute('data-calendar-id'), row.getAttribute('data-event-id'));
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.agenda-add-btn'), function (btn) {
      btn.addEventListener('click', function () {
        var parts = btn.getAttribute('data-date-key').split('-').map(function (n) { return parseInt(n, 10); });
        openEventModal(null, null, new Date(parts[0], parts[1] - 1, parts[2], 9, 0, 0, 0));
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.agenda-todo-check'), function (cb) {
      cb.addEventListener('change', function () {
        var id = cb.closest('[data-todo-id]').getAttribute('data-todo-id');
        gasRun('toggleTodo', id).then(function (todos) {
          state.home.todos = todos;
          renderTodoList(todos);
          return loadCalendarForCurrentMode();
        }).catch(showError);
      });
    });
  }

  // ===================== カレンダー表示形式(月/週/日)の切替 =====================
  function applyCalendarViewModeButtons() {
    Array.prototype.forEach.call(document.querySelectorAll('.cal-view-mode-switch .toggle-btn'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-cal-view') === state.calendar.viewMode);
    });
  }

  function setCalendarViewMode(mode) {
    if (state.calendar.viewMode === mode) return;
    state.calendar.viewMode = mode;
    applyCalendarViewModeButtons();
    gasRun('saveUserSettings', { calendarViewMode: mode }).then(function () {
      if (state.home) state.home.userSettings.calendarViewMode = mode;
    }).catch(showError);
    loadCalendarForCurrentMode();
  }

  function initCalendarViewModeSwitch() {
    Array.prototype.forEach.call(document.querySelectorAll('.cal-view-mode-switch .toggle-btn'), function (btn) {
      btn.addEventListener('click', function () {
        setCalendarViewMode(btn.getAttribute('data-cal-view'));
      });
    });
  }

  // 前へ/次へボタン: 表示モードに応じて月/週/日の単位で移動する
  function calendarStep(delta) {
    if (state.calendar.viewMode === 'week') {
      var d = new Date(state.calendar.refDate);
      d.setDate(d.getDate() + delta * 7);
      loadCalendarWeek(d);
    } else if (state.calendar.viewMode === 'day') {
      var d2 = new Date(state.calendar.refDate);
      d2.setDate(d2.getDate() + delta);
      loadCalendarDay(d2);
    } else {
      var m = state.calendar.month + delta, y = state.calendar.year;
      if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
      loadCalendarMonth(y, m);
    }
  }

  function loadTodayEvents() {
    if (!state.home) return Promise.resolve();
    var t = new Date();
    var start = new Date(t.getFullYear(), t.getMonth(), t.getDate(), 0, 0, 0, 0);
    var end = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1, 0, 0, 0, 0);
    var calendarIds = state.home.globalSettings.syncCalendarIds;
    return gasRun('getCalendarEvents', calendarIds, start.toISOString(), end.toISOString()).then(function (events) {
      renderTodayList(events);
    }).catch(showError);
  }

  // ===================== 予定の種類（カテゴリ）色分け =====================
  function categoryHex(colorId) {
    var found = state.eventCategories.filter(function (c) { return c.id === colorId; })[0];
    return found ? found.hex : '#dadce0';
  }

  function categoryLabel(colorId) {
    var found = state.eventCategories.filter(function (c) { return c.id === colorId; })[0];
    return found ? found.label : '未設定';
  }

  // カレンダー上の予定チップの文字色を、背景色の輝度(YIQ)に応じて自動選択する
  function pickChipTextColor(hex) {
    var normalized = hex.replace('#', '');
    var r = parseInt(normalized.substring(0, 2), 16);
    var g = parseInt(normalized.substring(2, 4), 16);
    var b = parseInt(normalized.substring(4, 6), 16);
    var yiq = (r * 299 + g * 587 + b * 114) / 1000;
    return yiq > 140 ? '#1a1a1a' : '#ffffff';
  }

  function renderTodayList(events) {
    var container = qs('today-list');
    if (events.length === 0) {
      container.innerHTML = '<div class="empty-hint">今日の予定はありません</div>';
      return;
    }
    var sorted = events.slice().sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
    container.innerHTML = sorted.map(function (ev) {
      var timeLabel = ev.allDay ? '終日' : formatTime(ev.start) + '〜' + formatTime(ev.end);
      return '<div class="today-item">' +
        '<div class="t-time">' + timeLabel + '</div>' +
        '<div><div class="t-title"><span class="category-dot" style="background:' + categoryHex(ev.categoryColorId) + ';"></span>' + escapeHtml(ev.title || '(無題)') + '</div></div>' +
        '</div>';
    }).join('');
  }

  function renderMiniCalendar(year, month, events, dayInfoByDay) {
    dayInfoByDay = dayInfoByDay || {};
    qs('calendar-month-label').textContent = (year + '年' + (month + 1) + '月');

    var now = new Date();
    var firstDay = new Date(year, month, 1);
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var startWeekday = firstDay.getDay();

    var eventsByDay = {};
    events.forEach(function (ev) {
      var d = new Date(ev.start);
      if (d.getFullYear() === year && d.getMonth() === month) {
        var day = d.getDate();
        (eventsByDay[day] = eventsByDay[day] || []).push(ev);
      }
    });

    var weekdaysHtml = WEEKDAY_LABELS.map(function (w) { return '<span>' + w + '</span>'; }).join('');
    qs('mini-calendar').innerHTML =
      '<div class="cal-weekdays">' + weekdaysHtml + '</div>' +
      '<div class="cal-grid" id="cal-grid"></div>';

    var MAX_CHIPS = 3;
    var grid = qs('cal-grid');
    var html = '';
    for (var i = 0; i < startWeekday; i++) {
      html += '<div class="cal-cell empty"></div>';
    }
    for (var day = 1; day <= daysInMonth; day++) {
      var dayEvents = eventsByDay[day] || [];
      var isToday = year === now.getFullYear() && month === now.getMonth() && day === now.getDate();
      var info = dayInfoByDay[day];
      var isHoliday = !!(info && info.holidayName);
      var chipsHtml = dayEvents.slice(0, MAX_CHIPS).map(function (ev) {
        var hex = categoryHex(ev.categoryColorId);
        return '<div class="event-chip" style="background:' + hex + ';color:' + pickChipTextColor(hex) + ';" title="' + escapeHtml(ev.title || '') + '">' + escapeHtml(ev.title || '(無題)') + '</div>';
      }).join('');
      if (dayEvents.length > MAX_CHIPS) {
        chipsHtml += '<div class="event-chip-more">他' + (dayEvents.length - MAX_CHIPS) + '件</div>';
      }
      var dueTodoCount = todosDueOn(ymd(new Date(year, month, day))).filter(function (t) { return !t.done; }).length;
      html += '<div class="cal-cell' + (isToday ? ' is-today' : '') + (isHoliday ? ' is-holiday' : '') + '" data-day="' + day + '">' +
        '<div class="day-num">' + day + '</div>' +
        (info ? '<div class="rokuyo-label">' + escapeHtml(info.rokuyo) + '</div>' : '') +
        (isHoliday ? '<div class="holiday-label">' + escapeHtml(info.holidayName) + '</div>' : '') +
        (dayEvents.length > 0 ? '<div class="event-chips">' + chipsHtml + '</div>' : '') +
        (dueTodoCount > 0 ? '<div class="todo-indicator" title="期限のToDo ' + dueTodoCount + '件"><svg class="icon" style="width:10px;height:10px;"><use href="#icon-check"></use></svg>' + dueTodoCount + '</div>' : '') +
        '</div>';
    }
    var totalCells = startWeekday + daysInMonth;
    var trailing = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
    for (var j = 0; j < trailing; j++) {
      html += '<div class="cal-cell empty"></div>';
    }
    grid.innerHTML = html;

    Array.prototype.forEach.call(grid.querySelectorAll('.cal-cell[data-day]'), function (cell) {
      cell.addEventListener('click', function () {
        openDayDetail(parseInt(cell.getAttribute('data-day'), 10));
      });
    });
  }

  // ===================== 日付タップ時のポップアップ（その日の予定一覧・編集） =====================
  function openDayDetail(day) {
    var year = state.calendar.year;
    var month = state.calendar.month;
    state.dayDetail = { year: year, month: month, day: day };

    var dayEvents = state.calendar.events.filter(function (ev) {
      var d = new Date(ev.start);
      return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
    }).sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });

    var dateObj = new Date(year, month, day);
    var info = state.calendar.dayInfoByDay[day];
    var titleSuffix = info ? '・' + info.rokuyo + (info.holidayName ? '・' + info.holidayName : '') : '';
    qs('day-detail-title').textContent = year + '年' + (month + 1) + '月' + day + '日（' + WEEKDAY_LABELS[dateObj.getDay()] + '）' + titleSuffix;

    var list = qs('day-detail-list');
    list.innerHTML = dayEvents.length === 0
      ? '<div class="empty-hint">この日の予定はありません</div>'
      : dayEvents.map(function (ev) {
        var catLabel = ev.categoryColorId ? '<span class="category-badge"><span class="category-dot" style="background:' + categoryHex(ev.categoryColorId) + ';"></span>' + escapeHtml(categoryLabel(ev.categoryColorId)) + '</span>' : '';
        var timeLabel = ev.allDay ? '終日' : formatTime(ev.start) + ' 〜 ' + formatTime(ev.end);
        return '<div class="link-row" data-event-id="' + escapeHtml(ev.id) + '" data-calendar-id="' + escapeHtml(ev.calendarId) + '">' +
          '<div>' +
          '<div class="name"><span class="category-dot" style="background:' + categoryHex(ev.categoryColorId) + ';"></span>' + escapeHtml(ev.title || '(無題)') + catLabel + '</div>' +
          '<div class="desc">' + timeLabel + '</div>' +
          '</div>' +
          '<button type="button" class="btn-edit-event">編集</button>' +
          '</div>';
      }).join('');

    Array.prototype.forEach.call(list.querySelectorAll('.btn-edit-event'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-event-id]');
        qs('day-detail-modal').hidden = true;
        openEventModal(row.getAttribute('data-calendar-id'), row.getAttribute('data-event-id'));
      });
    });

    renderDayDetailTodos(ymd(dateObj));
    qs('day-detail-modal').hidden = false;
  }

  // カレンダー連携: 日付ポップアップにその日が期限のToDoを表示し、その場で完了切替できるようにする
  function renderDayDetailTodos(dateKey) {
    var container = qs('day-detail-todos');
    if (!container) return;
    var todos = todosDueOn(dateKey);
    if (todos.length === 0) {
      container.innerHTML = '';
      return;
    }
    container.innerHTML = '<div class="agenda-todos">' + todos.map(function (t) {
      return '<div class="agenda-todo-row" data-todo-id="' + escapeHtml(t.id) + '">' +
        '<input type="checkbox" class="agenda-todo-check"' + (t.done ? ' checked' : '') + '>' +
        '<span class="todo-priority-dot ' + t.priority + '"></span>' +
        '<span class="todo-text' + (t.done ? ' done' : '') + '">' + escapeHtml(t.text) + '</span>' +
        '</div>';
    }).join('') + '</div>';

    Array.prototype.forEach.call(container.querySelectorAll('.agenda-todo-check'), function (cb) {
      cb.addEventListener('change', function () {
        var id = cb.closest('[data-todo-id]').getAttribute('data-todo-id');
        gasRun('toggleTodo', id).then(function (todos) {
          state.home.todos = todos;
          renderTodoList(todos);
          renderDayDetailTodos(dateKey);
          return loadCalendarForCurrentMode();
        }).catch(showError);
      });

  function initDayDetail() {
    qs('btn-day-detail-close').addEventListener('click', function () { qs('day-detail-modal').hidden = true; });
    qs('btn-day-add-event').addEventListener('click', function () {
      var d = state.dayDetail;
      qs('day-detail-modal').hidden = true;
      openEventModal(null, null, d ? new Date(d.year, d.month, d.day, 9, 0, 0, 0) : null);
    });
  }

  function formatTime(iso) {
    var d = new Date(iso);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function formatDateTime(iso) {
    var d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + formatTime(iso);
  }

  function populateEventCalendarOptions(calendars) {
    var select = qs('event-calendar');
    select.innerHTML = calendars.map(function (c) {
      return '<option value="' + escapeHtml(c.id) + '">' + escapeHtml(c.name) + '</option>';
    }).join('');
  }

  function initCalendarNav() {
    qs('btn-cal-prev').addEventListener('click', function () { calendarStep(-1); });
    qs('btn-cal-next').addEventListener('click', function () { calendarStep(1); });
    qs('btn-cal-today').addEventListener('click', function () {
      var t = new Date();
      if (state.calendar.viewMode === 'week') loadCalendarWeek(t);
      else if (state.calendar.viewMode === 'day') loadCalendarDay(t);
      else loadCalendarMonth(t.getFullYear(), t.getMonth());
    });
  }

  function renderCategorySwatchPicker(categories, selectedId) {
    var container = qs('event-category-select');
    container.innerHTML = categories.map(function (cat) {
      var selected = cat.id === selectedId ? ' selected' : '';
      return '<button type="button" class="category-swatch' + selected + '" data-category-id="' + escapeHtml(cat.id) + '">' +
        '<span class="category-dot" style="background:' + cat.hex + ';"></span>' + escapeHtml(cat.label) +
        '</button>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.category-swatch'), function (btn) {
      btn.addEventListener('click', function () {
        qs('event-category').value = btn.getAttribute('data-category-id');
        Array.prototype.forEach.call(container.querySelectorAll('.category-swatch'), function (b) {
          b.classList.toggle('selected', b === btn);
        });
      });
    });
  }

  function openEventModal(calendarId, eventId, presetDate) {
    var modal = qs('event-modal');
    qs('event-id').value = eventId || '';
    qs('event-modal-title').textContent = eventId ? '予定を編集' : '予定を追加';
    qs('btn-event-delete').hidden = !eventId;
    qs('event-allday').checked = false;
    qs('event-guests').value = '';
    qs('event-description').value = '';

    var categoryColorId = '';
    if (eventId) {
      var ev = state.calendar.events.filter(function (e) { return e.id === eventId; })[0];
      if (ev) {
        if (calendarId) qs('event-calendar').value = calendarId;
        qs('event-title').value = ev.title;
        qs('event-allday').checked = ev.allDay;
        qs('event-start').value = toDatetimeLocal(ev.start);
        qs('event-end').value = toDatetimeLocal(ev.end);
        qs('event-guests').value = ev.guests.join(', ');
        categoryColorId = ev.categoryColorId || '';
      }
    } else {
      qs('event-title').value = '';
      var base = presetDate || new Date();
      qs('event-start').value = toDatetimeLocal(base.toISOString());
      qs('event-end').value = toDatetimeLocal(new Date(base.getTime() + 60 * 60 * 1000).toISOString());
      if (calendarId) qs('event-calendar').value = calendarId;
    }
    qs('event-category').value = categoryColorId;
    renderCategorySwatchPicker(state.eventCategories, categoryColorId);
    modal.hidden = false;
  }

  function toDatetimeLocal(iso) {
    var d = new Date(iso);
    var pad = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' +
      pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function refreshCalendarViews() {
    return Promise.all([loadCalendarForCurrentMode(), loadTodayEvents()]);
  }

  function initEventModal() {
    qs('btn-new-event').addEventListener('click', function () { openEventModal(null, null); });
    qs('btn-event-cancel').addEventListener('click', function () { qs('event-modal').hidden = true; });

    qs('btn-event-save').addEventListener('click', function () {
      var id = qs('event-id').value;
      var calendarId = qs('event-calendar').value;
      var title = qs('event-title').value.trim();
      if (!title) { window.alert('タイトルを入力してください'); return; }
      var startIso = new Date(qs('event-start').value).toISOString();
      var endIso = new Date(qs('event-end').value).toISOString();
      var allDay = qs('event-allday').checked;
      var guests = qs('event-guests').value;
      var description = qs('event-description').value;
      var categoryColorId = qs('event-category').value;

      var promise = id
        ? gasRun('updateCalendarEvent', calendarId, id, title, startIso, endIso, guests, description, categoryColorId)
        : gasRun('createCalendarEvent', calendarId, title, startIso, endIso, allDay, guests, description, categoryColorId);

      promise.then(function () {
        qs('event-modal').hidden = true;
        return refreshCalendarViews();
      }).catch(showError);
    });

    qs('btn-event-delete').addEventListener('click', function () {
      if (!window.confirm('この予定を削除しますか？')) return;
      var id = qs('event-id').value;
      var calendarId = qs('event-calendar').value;
      gasRun('deleteCalendarEvent', calendarId, id).then(function () {
        qs('event-modal').hidden = true;
        return refreshCalendarViews();
      }).catch(showError);
    });
  }

  // ===================== メール =====================
  function renderMailList(mails, mailCount) {
    qs('mail-count-label').textContent = mailCount;
    var container = qs('mail-list');
    if (mails.length === 0) {
      container.innerHTML = '<div class="empty-hint">新着メールはありません</div>';
    } else {
      container.innerHTML = mails.map(function (m) {
        return '<div class="mail-row' + (m.isUnread ? ' unread' : '') + '" data-thread-id="' + escapeHtml(m.threadId) + '">' +
          '<div class="subject">' + escapeHtml(m.subject || '(件名なし)') + '</div>' +
          '<div class="date">' + formatDateTime(m.date) + '</div>' +
          '</div>';
      }).join('');

      Array.prototype.forEach.call(container.querySelectorAll('.mail-row'), function (row) {
        row.addEventListener('click', function () {
          openMailDetail(row.getAttribute('data-thread-id'));
        });
      });
    }
    updateMailBadge(mails);
  }

  // 未読数バッジ（左ナビの「メール」タブ）を更新する
  function updateMailBadge(mails) {
    var unread = mails.filter(function (m) { return m.isUnread; }).length;
    var unreadLabel = unread > 9 ? '9+' : String(unread);
    var navBadge = qs('nav-mail-badge');
    navBadge.textContent = unreadLabel;
    navBadge.hidden = unread === 0;
  }

  // 一度開いたメールを未読から外す（表示上の即時反映 + サーバー側の既読化）
  function markMailReadLocally(threadId) {
    if (!state.home) return;
    var mail = state.home.mails.filter(function (m) { return m.threadId === threadId; })[0];
    if (!mail || !mail.isUnread) return;
    mail.isUnread = false;
    renderMailList(state.home.mails, state.home.userSettings.mailCount);
    if (state.currentView === 'mail') {
      renderMailPageList(state.home.mails);
    }
    gasRun('markMailRead', threadId).catch(function () { /* 既読化に失敗しても表示は既読のままでよい */ });
  }

  function openMailDetail(threadId) {
    var modal = qs('mail-detail-modal');
    qs('mail-detail-subject').textContent = '読み込み中...';
    qs('mail-detail-meta').textContent = '';
    qs('mail-detail-body').textContent = '';
    qs('mail-detail-reply-section').hidden = true;
    qs('mail-detail-reply-body').value = '';
    modal.hidden = false;
    state.mailDetailThreadId = threadId;

    gasRun('getMailBody', threadId).then(function (mail) {
      qs('mail-detail-subject').textContent = mail.subject || '(件名なし)';
      qs('mail-detail-meta').textContent = mail.from + ' ・ ' + formatDateTime(mail.date);
      qs('mail-detail-body').textContent = mail.bodyPlain;
      markMailReadLocally(threadId);
    }).catch(function (err) {
      modal.hidden = true;
      showError(err);
    });
  }

  function initMail() {
    qs('btn-mail-refresh').addEventListener('click', function (e) { withSpinner(e.currentTarget, refreshMailData); });
    qs('btn-mail-viewall').addEventListener('click', function () { switchView('mail'); });
    qs('btn-mail-detail-close').addEventListener('click', function () { qs('mail-detail-modal').hidden = true; });

    qs('btn-mail-detail-reply-toggle').addEventListener('click', function () {
      var section = qs('mail-detail-reply-section');
      section.hidden = !section.hidden;
      if (!section.hidden) qs('mail-detail-reply-body').focus();
    });
    qs('btn-mail-detail-reply-send').addEventListener('click', function (e) {
      var body = qs('mail-detail-reply-body').value;
      if (!body.trim()) { window.alert('返信内容を入力してください'); return; }
      withSpinner(e.currentTarget, function () {
        return gasRun('replyMail', state.mailDetailThreadId, body).then(function () {
          showToast('返信を送信しました');
          qs('mail-detail-reply-body').value = '';
          qs('mail-detail-reply-section').hidden = true;
        }).catch(showError);
      });
    });

    qs('btn-mail-compose').addEventListener('click', function () {
      qs('mail-compose-to').value = '';
      qs('mail-compose-subject').value = '';
      qs('mail-compose-body').value = '';
      qs('mail-compose-modal').hidden = false;
    });
    qs('btn-mail-compose-cancel').addEventListener('click', function () { qs('mail-compose-modal').hidden = true; });
    qs('btn-mail-compose-send').addEventListener('click', function () {
      var to = qs('mail-compose-to').value.trim();
      var subject = qs('mail-compose-subject').value.trim();
      var body = qs('mail-compose-body').value;
      if (!to) { window.alert('宛先を入力してください'); return; }
      gasRun('sendMail', to, subject, body).then(function () {
        qs('mail-compose-modal').hidden = true;
        showToast('メールを送信しました');

  // メール一覧のみを軽量に再取得する（ホーム全体を読み込み直す loadHome() より高速）
  function refreshMailData() {
    return gasRun('getRecentMails').then(function (mails) {
      if (!state.home) return;
      state.home.mails = mails;
      renderMailList(mails, state.home.userSettings.mailCount);
      if (state.currentView === 'mail') {
        renderMailPageList(mails);
      }
    }).catch(showError);
  }

  // ===================== メールタブ（2カラム：左に一覧／右に本文） =====================
  // 複数選択の一括操作(既読化・アーカイブ)はメールタブ専用。ホーム画面のメールウィジェット(コンパクト表示)には持たせない。
  function renderMailPageList(mails) {
    var container = qs('mail-page-list');
    if (!container) return;
    if (mails.length === 0) {
      container.innerHTML = '<div class="empty-hint">新着メールはありません</div>';
      updateMailBulkToolbar();
      return;
    }
    container.innerHTML = mails.map(function (m) {
      var selected = m.threadId === state.mailPage.selectedThreadId ? ' selected' : '';
      var checked = state.mailPage.selectedIds[m.threadId] ? ' checked' : '';
      return '<div class="mail-row' + (m.isUnread ? ' unread' : '') + selected + '" data-thread-id="' + escapeHtml(m.threadId) + '">' +
        '<input type="checkbox" class="mail-row-check" data-thread-id="' + escapeHtml(m.threadId) + '"' + checked + '>' +
        '<div class="subject">' + escapeHtml(m.subject || '(件名なし)') + '</div>' +
        '<div class="date">' + formatDateTime(m.date) + '</div>' +
        '</div>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.mail-row'), function (row) {
      row.addEventListener('click', function (e) {
        if (e.target.closest('.mail-row-check')) return;
        openMailPageThread(row.getAttribute('data-thread-id'));
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.mail-row-check'), function (cb) {
      cb.addEventListener('click', function (e) { e.stopPropagation(); });
      cb.addEventListener('change', function () {
        var id = cb.getAttribute('data-thread-id');
        if (cb.checked) state.mailPage.selectedIds[id] = true;
        else delete state.mailPage.selectedIds[id];
        updateMailBulkToolbar();
      });
    });
    updateMailBulkToolbar();
  }

  function updateMailBulkToolbar() {
    var toolbar = qs('mail-bulk-toolbar');
    if (!toolbar) return;
    var count = Object.keys(state.mailPage.selectedIds).length;
    toolbar.hidden = count === 0;
    qs('mail-bulk-count').textContent = count + '件選択中';
  }

  function initMailBulkActions() {
    qs('btn-mail-bulk-read').addEventListener('click', function (e) {
      var ids = Object.keys(state.mailPage.selectedIds);
      if (ids.length === 0) return;
      withSpinner(e.currentTarget, function () {
        return gasRun('markMailReadBulk', ids).then(function () {
          state.mailPage.selectedIds = {};
          showToast('既読にしました');
          return refreshMailData();
        }).catch(showError);
      });
    });
    qs('btn-mail-bulk-archive').addEventListener('click', function (e) {
      var ids = Object.keys(state.mailPage.selectedIds);
      if (ids.length === 0) return;
      if (!window.confirm(ids.length + '件のメールをアーカイブしますか？')) return;
      withSpinner(e.currentTarget, function () {
        return gasRun('archiveMailBulk', ids).then(function () {
          state.mailPage.selectedIds = {};
          showToast('アーカイブしました');
          return refreshMailData();
        }).catch(showError);
      });
    });
    qs('btn-mail-bulk-clear').addEventListener('click', function () {
      state.mailPage.selectedIds = {};
      if (state.home) renderMailPageList(state.home.mails);

  // ===================== ヘッダー: 横断検索 =====================
  function initSearch() {
    var input = qs('global-search');
    var results = qs('search-results');
    var timer = null;

    input.addEventListener('click', function (e) { e.stopPropagation(); });
    results.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', function () { results.hidden = true; });

    input.addEventListener('input', function () {
      var query = input.value.trim();
      clearTimeout(timer);
      if (!query) { results.hidden = true; return; }
      timer = setTimeout(function () {
        gasRun('globalSearch', query).then(function (found) {
          renderSearchResults(found);
        }).catch(showError);
      }, 300);
    });
  }

  function renderSearchResults(found) {
    var results = qs('search-results');
    var hasAny = found.apps.length > 0 || found.files.length > 0;
    if (!hasAny) {
      results.innerHTML = '<div class="dropdown-empty">一致する結果がありません</div>';
      results.hidden = false;
      return;
    }
    var html = '';
    if (found.apps.length > 0) {
      html += '<div class="search-group-label">アプリ</div>';
      html += found.apps.map(function (app) {
        return '<div class="search-result-row" data-open="' + escapeHtml(app.url) + '">' +
          '<div class="r-name">' + escapeHtml(app.name) + '</div>' +
          '<div class="r-desc">' + escapeHtml(app.url) + '</div></div>';
      }).join('');
    }
    if (found.files.length > 0) {
      html += '<div class="search-group-label">Drive</div>';
      html += found.files.map(function (f) {
        return '<div class="search-result-row" data-open="' + escapeHtml(f.url) + '">' +
          '<div class="r-name">' + escapeHtml(f.name) + '</div>' +
          '<div class="r-desc">' + escapeHtml(f.mimeType) + '</div></div>';
      }).join('');
    }
    results.innerHTML = html;
    results.hidden = false;
    Array.prototype.forEach.call(results.querySelectorAll('.search-result-row'), function (row) {
      row.addEventListener('click', function () {
        window.open(row.getAttribute('data-open'), '_blank');
        results.hidden = true;

  function statusLabel(status) {
    if (status === 'ok') return 'OK';

  }

  // アプリリンク集に登録されている全タグ（重複なし・昇順）を集計する
  function allAppTags(apps) {
    var set = {};
    apps.forEach(function (app) { (app.tags || []).forEach(function (t) { set[t] = true; }); });
    return Object.keys(set).sort();
  }

  function renderAppTagFilterBar(apps) {
    var container = qs('app-tag-filter-bar');
    if (!container) return;

    var chips = '<button type="button" class="tag-filter-chip' + (state.appLedger.tagFilter === null ? ' active' : '') + '" data-tag="">すべて</button>' +
      tags.map(function (t) {
        return '<button type="button" class="tag-filter-chip' + (state.appLedger.tagFilter === t ? ' active' : '') + '" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + '</button>';

  // ===================== ToDoリスト =====================
  var TODO_PRIORITY_LABELS = { low: '低', medium: '中', high: '高' };

  function formatDueDateLabel(dueDate) {
    var parts = dueDate.split('-').map(function (n) { return parseInt(n, 10); });
    return parts[1] + '/' + parts[2];
  }

  function isOverdue(dueDate, done) {
    if (!dueDate || done) return false;
    return dueDate < ymd(new Date());
  }

  function renderTodoList(todos) {
    var container = qs('todo-list');
    if (!container) return;
    if (!todos || todos.length === 0) {
      container.innerHTML = '<div class="empty-hint">やることがありません</div>';
      return;
    }
    // 期限日が近い順（未設定は最後）→ 優先度(高いほど先)の順に並び替える
    var priorityOrder = { high: 0, medium: 1, low: 2 };
    var sorted = todos.slice().sort(function (a, b) {
      if (!!a.dueDate !== !!b.dueDate) return a.dueDate ? -1 : 1;
      if (a.dueDate && a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
      return priorityOrder[a.priority] - priorityOrder[b.priority];
    });
    container.innerHTML = sorted.map(function (t) {
      var overdue = isOverdue(t.dueDate, t.done);
      var dueBadge = t.dueDate ? '<span class="todo-due-badge' + (overdue ? ' overdue' : '') + '">' + formatDueDateLabel(t.dueDate) + '</span>' : '';
      return '<div class="todo-row" data-todo-id="' + escapeHtml(t.id) + '">' +
        '<div class="todo-main">' +
        '<input type="checkbox" class="todo-check"' + (t.done ? ' checked' : '') + '>' +
        '<span class="todo-priority-dot ' + t.priority + '" title="優先度: ' + TODO_PRIORITY_LABELS[t.priority] + '"></span>' +
        '<span class="todo-text' + (t.done ? ' done' : '') + '">' + escapeHtml(t.text) + '</span>' +
        '</div>' +
        dueBadge +
        '<button type="button" class="icon-only todo-delete" aria-label="削除" title="削除"><svg class="icon icon-sm"><use href="#icon-trash"></use></svg></button>' +
        '</div>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.todo-check'), function (cb) {
      cb.addEventListener('change', function () {
        var id = cb.closest('[data-todo-id]').getAttribute('data-todo-id');
        gasRun('toggleTodo', id).then(function (todos) {
          state.home.todos = todos;
          renderTodoList(todos);
          return loadCalendarForCurrentMode();
        }).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.todo-delete'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('[data-todo-id]').getAttribute('data-todo-id');
        gasRun('deleteTodo', id).then(function (todos) {
          state.home.todos = todos;
          renderTodoList(todos);
          return loadCalendarForCurrentMode();
        }).catch(showError);
      });
    });
  }
