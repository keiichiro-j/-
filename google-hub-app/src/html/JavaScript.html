  // ===================== Drive =====================
  // ファイルの種類を分類する。フィルタのUI(#drive-type-filter)の選択肢と対応させる。
  function classifyMimeType(mimeType) {
    if (!mimeType) return 'other';
    if (mimeType === 'application/vnd.google-apps.folder') return 'folder';
    if (mimeType === 'application/vnd.google-apps.document' || mimeType === 'application/msword' ||
      mimeType.indexOf('wordprocessingml') !== -1 || mimeType === 'text/plain') return 'document';
    if (mimeType === 'application/vnd.google-apps.spreadsheet' || mimeType === 'application/vnd.ms-excel' ||
      mimeType.indexOf('spreadsheetml') !== -1 || mimeType === 'text/csv') return 'spreadsheet';
    if (mimeType === 'application/vnd.google-apps.presentation' || mimeType === 'application/vnd.ms-powerpoint' ||
      mimeType.indexOf('presentationml') !== -1) return 'presentation';
    if (mimeType.indexOf('image/') === 0) return 'image';
    if (mimeType === 'application/pdf') return 'pdf';
    return 'other';
  }

  function driveTypeMatches(item, filter) {
    if (filter === 'all') return true;
    if (item.isFolder) return filter === 'folder';
    return classifyMimeType(item.mimeType) === filter;
  }

  function isPinnedFolder(id) {
    var pinned = (state.home && state.home.userSettings.pinnedFolders) || [];
    return pinned.some(function (f) { return f.id === id; });
  }

  // ピン留めの追加/解除。設定は自動保存され、Driveタブ上部のチップ・行/カードのピンアイコンを再描画する。
  function togglePinFolder(id, name, pin) {
    if (!state.home) return Promise.resolve();
    var current = state.home.userSettings.pinnedFolders || [];
    var next = pin
      ? (current.some(function (f) { return f.id === id; }) ? current : current.concat([{ id: id, name: name }]))
      : current.filter(function (f) { return f.id !== id; });
    return gasRun('saveUserSettings', { pinnedFolders: next }).then(function (settings) {
      state.home.userSettings.pinnedFolders = settings.pinnedFolders;
      renderPinnedFolders(settings.pinnedFolders);
      renderDriveList(state.drive.items);
    }).catch(showError);
  }

  function renderPinnedFolders(pinnedFolders) {
    var container = qs('pinned-folder-chips');
    if (!container) return;
    pinnedFolders = pinnedFolders || [];
    if (pinnedFolders.length === 0) {
      container.innerHTML = '';
      return;
    }
    container.innerHTML = pinnedFolders.map(function (f) {
      return '<span class="pinned-folder-chip" data-folder-id="' + escapeHtml(f.id) + '">' +
        '<svg class="icon icon-sm"><use href="#icon-pin"></use></svg>' + escapeHtml(f.name) +
        '<button type="button" class="btn-unpin" data-folder-id="' + escapeHtml(f.id) + '" aria-label="ピン留め解除" title="ピン留め解除">×</button>' +
        '</span>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.pinned-folder-chip'), function (chip) {
      chip.addEventListener('click', function (e) {
        if (e.target.closest('.btn-unpin')) return;
        loadDriveFolder(chip.getAttribute('data-folder-id'));
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-unpin'), function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        togglePinFolder(btn.getAttribute('data-folder-id'), '', false);
      });
    });
  }

  // サムネイル画像。読み込みに失敗した場合(全ファイルで生成されるとは限らないため)は
  // 種類アイコン(iconUrl)にフォールバックする。
  function driveThumbHtml(item, sizeClass) {
    var primary = item.isFolder ? item.iconUrl : (item.thumbnailUrl || item.iconUrl);
    return '<img class="' + sizeClass + '" src="' + escapeHtml(primary) + '" data-fallback="' + escapeHtml(item.iconUrl) + '" alt="">';
  }

  function bindThumbFallback(container) {
    Array.prototype.forEach.call(container.querySelectorAll('img[data-fallback]'), function (img) {
      img.addEventListener('error', function onErr() {
        var fallback = img.getAttribute('data-fallback');
        if (img.src.indexOf(fallback) === -1) img.src = fallback;
        img.removeEventListener('error', onErr);
      });
    });
  }

  function drivePinButtonHtml(item) {
    if (!item.isFolder) return '';
    return '<button type="button" class="icon-only btn-drive-pin' + (isPinnedFolder(item.id) ? ' is-pinned' : '') + '" aria-label="ピン留め" title="ピン留め">' +
      '<svg class="icon icon-sm"><use href="#icon-pin"></use></svg></button>';
  }

  function driveActionButtonsHtml(item) {
    return (item.isFolder
      ? '<button type="button" class="btn-drive-open">開く</button>'
      : '<button type="button" class="btn-drive-preview">プレビュー</button>') +
      '<button type="button" class="btn-drive-rename">名称変更</button>' +
      '<button type="button" class="btn-drive-share">共有</button>' +
      '<button type="button" class="btn-drive-move">移動</button>';
  }

  function driveListRowHtml(item) {
    var sizeLabel = item.isFolder ? '' : formatBytes(item.sizeBytes);
    var nameHtml = item.isFolder
      ? escapeHtml(item.name)
      : '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">' + escapeHtml(item.name) + '</a>';
    return '<div class="drive-row" data-file-id="' + escapeHtml(item.id) + '" data-is-folder="' + item.isFolder + '">' +
      driveThumbHtml(item, 'thumb') +
      '<div class="name">' + nameHtml + '</div>' +
      '<div class="meta">' + sizeLabel + '</div>' +
      '<span>' + drivePinButtonHtml(item) + driveActionButtonsHtml(item) + '</span></div>';
  }

  function driveGridItemHtml(item) {
    var sizeLabel = item.isFolder ? '' : formatBytes(item.sizeBytes);
    var nameHtml = item.isFolder
      ? escapeHtml(item.name)
      : '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">' + escapeHtml(item.name) + '</a>';
    return '<div class="drive-grid-item" data-file-id="' + escapeHtml(item.id) + '" data-is-folder="' + item.isFolder + '">' +
      drivePinButtonHtml(item) +
      driveThumbHtml(item, 'thumb') +
      '<div class="name">' + nameHtml + '</div>' +
      '<div class="meta">' + sizeLabel + '</div>' +
      '<div class="grid-actions">' + driveActionButtonsHtml(item) + '</div></div>';
  }

  function formatBytes(bytes) {
    if (!bytes) return '';
    var units = ['B', 'KB', 'MB', 'GB'];
    var value = bytes;
    var unitIndex = 0;
    while (value >= 1024 && unitIndex < units.length - 1) {
      value = value / 1024;
      unitIndex++;
    }
    return value.toFixed(unitIndex === 0 ? 0 : 1) + units[unitIndex];
  }

  function renderDriveList(items) {
    var container = qs('drive-list');
    var filtered = items.filter(function (item) { return driveTypeMatches(item, state.drive.typeFilter); });
    container.classList.toggle('drive-grid', state.drive.viewMode === 'grid');
    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-hint">' + (items.length === 0 ? 'ファイルがありません' : '該当する種類のファイルがありません') + '</div>';
      return;
    }
    container.innerHTML = filtered.map(state.drive.viewMode === 'grid' ? driveGridItemHtml : driveListRowHtml).join('');
    bindThumbFallback(container);

    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-pin'), function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var row = btn.closest('[data-file-id]');
        var id = row.getAttribute('data-file-id');
        var item = state.drive.items.filter(function (i) { return i.id === id; })[0];
        if (!item) return;
        togglePinFolder(id, item.name, !isPinnedFolder(id));
      });
    });

    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-open'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        loadDriveFolder(row.getAttribute('data-file-id'));
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-preview'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        gasRun('getDrivePreviewUrl', row.getAttribute('data-file-id')).then(function (url) {
          qs('drive-preview-frame').src = url;
          qs('drive-preview-modal').hidden = false;
        }).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-rename'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        var item = state.drive.items.filter(function (i) { return i.id === row.getAttribute('data-file-id'); })[0];
        qs('drive-rename-file-id').value = row.getAttribute('data-file-id');
        qs('drive-rename-is-folder').value = row.getAttribute('data-is-folder');
        qs('drive-rename-name').value = item ? item.name : '';
        qs('drive-rename-modal').hidden = false;
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-share'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        qs('drive-share-file-id').value = row.getAttribute('data-file-id');
        qs('drive-share-modal').hidden = false;
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-drive-move'), function (btn) {
      btn.addEventListener('click', function () {
        var row = btn.closest('[data-file-id]');
        qs('drive-move-file-id').value = row.getAttribute('data-file-id');
        qs('drive-move-dest').value = '';
        qs('drive-move-modal').hidden = false;
      });
    });
  }

  function loadDriveFolder(folderId) {
    state.drive.currentFolderId = folderId;
    return gasRun('listDriveFiles', folderId, state.drive.sortKey, state.drive.ascending).then(function (items) {
      state.drive.items = items;
      renderDriveList(items);
    }).catch(showError);
  }

  // ===================== Drive表示形式(リスト/グリッド)の切替 =====================
  function applyDriveViewModeButtons() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-drive-view]'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-drive-view') === state.drive.viewMode);
    });
  }

  function initDriveViewMode() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-drive-view]'), function (btn) {
      btn.addEventListener('click', function () {
        var mode = btn.getAttribute('data-drive-view');
        if (state.drive.viewMode === mode) return;
        state.drive.viewMode = mode;
        applyDriveViewModeButtons();
        renderDriveList(state.drive.items);
        gasRun('saveUserSettings', { driveViewMode: mode }).then(function () {
          if (state.home) state.home.userSettings.driveViewMode = mode;
        }).catch(showError);
      });
    });
  }

  function initDriveTypeFilter() {
    qs('drive-type-filter').addEventListener('change', function () {
      state.drive.typeFilter = qs('drive-type-filter').value;
      renderDriveList(state.drive.items);
    });
  }

  function initDrive() {
    qs('btn-drive-refresh').addEventListener('click', function (e) {
      withSpinner(e.currentTarget, function () { return loadDriveFolder(state.drive.currentFolderId); });
    });
    qs('btn-drive-up').addEventListener('click', function () { loadDriveFolder(null); });

    qs('btn-drive-search').addEventListener('click', function () {
      var query = qs('drive-search').value.trim();
      if (!query) { loadDriveFolder(state.drive.currentFolderId); return; }
      gasRun('searchDriveFiles', query).then(function (items) {
        state.drive.items = items;
        renderDriveList(items);
      }).catch(showError);
    });

    qs('drive-sort').addEventListener('change', function () {
      state.drive.sortKey = qs('drive-sort').value;
      loadDriveFolder(state.drive.currentFolderId);
    });
    qs('drive-order').addEventListener('change', function () {
      state.drive.ascending = qs('drive-order').value === 'asc';
      loadDriveFolder(state.drive.currentFolderId);
    });

    qs('btn-drive-preview-close').addEventListener('click', function () {
      qs('drive-preview-frame').src = 'about:blank';
      qs('drive-preview-modal').hidden = true;
    });

    qs('btn-drive-share-cancel').addEventListener('click', function () { qs('drive-share-modal').hidden = true; });
    qs('btn-drive-share-save').addEventListener('click', function () {
      var fileId = qs('drive-share-file-id').value;
      var access = qs('drive-share-access').value;
      var permission = qs('drive-share-permission').value;
      gasRun('updateDriveSharing', fileId, access, permission).then(function () {
        qs('drive-share-modal').hidden = true;
        return loadDriveFolder(state.drive.currentFolderId);
      }).catch(showError);
    });

    qs('btn-drive-move-cancel').addEventListener('click', function () { qs('drive-move-modal').hidden = true; });
    qs('btn-drive-move-save').addEventListener('click', function () {
      var fileId = qs('drive-move-file-id').value;
      var destination = qs('drive-move-dest').value.trim();
      if (!destination) { window.alert('移動先フォルダIDを入力してください'); return; }
      gasRun('moveDriveFile', fileId, destination).then(function () {
        qs('drive-move-modal').hidden = true;
        return loadDriveFolder(state.drive.currentFolderId);
      }).catch(showError);
    });

    qs('btn-drive-rename-cancel').addEventListener('click', function () { qs('drive-rename-modal').hidden = true; });
    qs('btn-drive-rename-save').addEventListener('click', function () {
      var fileId = qs('drive-rename-file-id').value;
      var isFolder = qs('drive-rename-is-folder').value === 'true';
      var newName = qs('drive-rename-name').value.trim();
      if (!newName) { window.alert('新しい名前を入力してください'); return; }
      gasRun('renameDriveEntry', fileId, newName, isFolder).then(function () {
        qs('drive-rename-modal').hidden = true;
        return loadDriveFolder(state.drive.currentFolderId);
      }).catch(showError);
    });
  }

  // ===================== 設定画面: テーマ配色（11色 + ランダム = 12択） =====================
  function renderThemeSwatches(choices, selectedId) {
    var grid = qs('theme-swatch-grid');
    grid.innerHTML = choices.map(function (choice) {
      var isRandom = choice.hex === null;
      var selected = choice.id === selectedId ? ' selected' : '';
      var swatchInner = isRandom
        ? '<svg class="icon"><use href="#icon-shuffle"></use></svg>'
        : '';
      var swatchStyle = isRandom ? '' : ' style="background:' + choice.hex + ';"';
      return '<button type="button" class="theme-swatch' + selected + '" data-theme-id="' + escapeHtml(choice.id) + '">' +
        '<span class="swatch-color' + (isRandom ? ' is-random' : '') + '"' + swatchStyle + '>' + swatchInner + '</span>' +
        '<span>' + escapeHtml(choice.name) + '</span>' +
        '</button>';
    }).join('');

    Array.prototype.forEach.call(grid.querySelectorAll('.theme-swatch'), function (btn) {
      btn.addEventListener('click', function () {
        var themeId = btn.getAttribute('data-theme-id');
        gasRun('saveUserSettings', { themeChoice: themeId }).then(function () {
          return loadHome();
        }).catch(showError);
      });
    });
  }

  // ===================== 設定画面 =====================
  function populateSettingsForm(userSettings, globalSettings, calendars, themeChoices) {
    renderThemeSwatches(themeChoices, userSettings.themeChoice);
    renderDarkModeSwitcher(userSettings.darkMode);

    qs('setting-mail-count').value = userSettings.mailCount;
    renderWidgetLayoutEditor(userSettings.widgets);
    renderCustomNavSettingsList(userSettings.customNavItems);

    qs('setting-mail-label').value = globalSettings.mailLabel;
    qs('setting-notify-enabled').checked = globalSettings.notifyEnabled;

    var syncSet = {};
    globalSettings.syncCalendarIds.forEach(function (id) { syncSet[id] = true; });
    var listHtml = calendars.map(function (cal) {
      var checked = syncSet[cal.id] ? ' checked' : '';
      return '<div class="checkbox-row">' +
        '<input type="checkbox" class="sync-calendar-checkbox" value="' + escapeHtml(cal.id) + '"' + checked + '>' +
        '<label style="margin:0;">' + escapeHtml(cal.name) + '</label></div>';
    }).join('');
    qs('sync-calendar-list').innerHTML = listHtml || '<div class="empty-hint">利用可能なカレンダーがありません</div>';
  }

  // ---- ウィジェット（カレンダー/今日の予定/メール/アプリリンク集）の視覚的レイアウトエディタ ----
  // 各列(メインエリア/サイドバー)のドロップゾーンは固定の同じ高さで、中のブロックは実際の
  // ダッシュボードと同じ widget-size-*（flex-grow比率 1:2:3）でその高さを分け合う。そのため
  // ウィジェットの構成に関わらず、メインエリアとサイドバーの合計の高さは常に一致する。
  var WIDGET_SIZE_ORDER = ['small', 'medium', 'large'];
  var WIDGET_RESIZE_STEP_PX = 36; // この距離だけドラッグするたびに大きさが1段階変わる
  var draggingWidgetBlock = null;

  function renderWidgetLayoutEditor(widgets) {
    var mainZone = qs('widget-layout-main');
    var sideZone = qs('widget-layout-side');
    mainZone.innerHTML = '';
    sideZone.innerHTML = '';
    widgets.forEach(function (w) {
      var zone = w.column === 'main' ? mainZone : sideZone;
      zone.appendChild(buildWidgetBlock(w));
    });
  }

  function buildWidgetBlock(w) {
    var block = document.createElement('div');
    block.className = 'widget-block widget-block-size-' + w.size + (w.visible ? '' : ' is-hidden');
    block.draggable = true;
    block.setAttribute('data-widget-id', w.id);
    block.setAttribute('data-size', w.size);
    block.setAttribute('data-visible', w.visible ? 'true' : 'false');

    var head = document.createElement('div');
    head.className = 'widget-block-head';
    head.innerHTML =
      '<svg class="icon icon-sm widget-block-drag-handle"><use href="#icon-grip"></use></svg>' +
      '<span class="widget-block-label">' + WIDGET_LABELS[w.id] + '</span>' +
      '<button type="button" class="widget-block-visibility" aria-label="表示/非表示切替" title="表示/非表示切替">' +
      '<svg class="icon icon-sm"><use href="#' + (w.visible ? 'icon-eye' : 'icon-eye-off') + '"></use></svg>' +
      '</button>';
    block.appendChild(head);

    var sizeLabel = document.createElement('div');
    sizeLabel.className = 'widget-block-size-label';
    sizeLabel.textContent = '大きさ: ' + WIDGET_SIZE_LABELS[w.size];
    block.appendChild(sizeLabel);

    var resizeHandle = document.createElement('div');
    resizeHandle.className = 'widget-block-resize-handle';
    resizeHandle.title = 'ドラッグで大きさを変更';
    block.appendChild(resizeHandle);

    head.querySelector('.widget-block-visibility').addEventListener('click', function (e) {
      e.stopPropagation();
      var nowVisible = block.getAttribute('data-visible') !== 'true';
      block.setAttribute('data-visible', nowVisible ? 'true' : 'false');
      block.classList.toggle('is-hidden', !nowVisible);
      e.currentTarget.querySelector('use').setAttribute('href', '#' + (nowVisible ? 'icon-eye' : 'icon-eye-off'));
    });

    initWidgetBlockDrag(block);
    initWidgetBlockResize(block, resizeHandle, sizeLabel);
    return block;
  }

  function initWidgetBlockDrag(block) {
    block.addEventListener('dragstart', function (e) {
      draggingWidgetBlock = block;
      block.classList.add('is-dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', block.getAttribute('data-widget-id')); } catch (err) { /* Firefox以外は不要 */ }
    });
    block.addEventListener('dragend', function () {
      block.classList.remove('is-dragging');
      draggingWidgetBlock = null;
      Array.prototype.forEach.call(document.querySelectorAll('.widget-layout-dropzone'), function (z) {
        z.classList.remove('is-drag-over');
      });
    });
  }

  function widgetLayoutInsertionTarget(zone, y) {
    var blocks = Array.prototype.slice.call(zone.querySelectorAll('.widget-block:not(.is-dragging)'));
    var result = null;
    var closestOffset = -Infinity;
    blocks.forEach(function (child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closestOffset) {
        closestOffset = offset;
        result = child;
      }
    });
    return result;
  }

  function initWidgetLayoutDropzones() {
    Array.prototype.forEach.call(document.querySelectorAll('.widget-layout-dropzone'), function (zone) {
      zone.addEventListener('dragover', function (e) {
        if (!draggingWidgetBlock) return;
        e.preventDefault();
        zone.classList.add('is-drag-over');
        var after = widgetLayoutInsertionTarget(zone, e.clientY);
        if (after) {
          zone.insertBefore(draggingWidgetBlock, after);
        } else {
          zone.appendChild(draggingWidgetBlock);
        }
      });
      zone.addEventListener('dragleave', function (e) {
        if (e.target === zone) zone.classList.remove('is-drag-over');
      });
      zone.addEventListener('drop', function (e) {
        e.preventDefault();
        zone.classList.remove('is-drag-over');
      });
    });
  }

  function applyWidgetBlockSize(block, sizeLabelEl, size) {
    block.className = block.className.replace(/widget-block-size-\w+/, 'widget-block-size-' + size);
    block.setAttribute('data-size', size);
    sizeLabelEl.textContent = '大きさ: ' + WIDGET_SIZE_LABELS[size];
  }

  // 列の高さは固定なので、大きさはピクセル指定ではなく「小⇔中⇔大」の段階を動かす形で変更する。
  // 一定距離ドラッグするたびに1段階変わり、他のブロックはflex-growで自動的に伸縮する。
  function initWidgetBlockResize(block, handle, sizeLabelEl) {
    handle.addEventListener('mousedown', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var startY = e.clientY;
      var index = WIDGET_SIZE_ORDER.indexOf(block.getAttribute('data-size'));

      function onMove(ev) {
        var delta = ev.clientY - startY;
        if (delta >= WIDGET_RESIZE_STEP_PX && index < WIDGET_SIZE_ORDER.length - 1) {
          index++;
          startY = ev.clientY;
          applyWidgetBlockSize(block, sizeLabelEl, WIDGET_SIZE_ORDER[index]);
        } else if (delta <= -WIDGET_RESIZE_STEP_PX && index > 0) {
          index--;
          startY = ev.clientY;
          applyWidgetBlockSize(block, sizeLabelEl, WIDGET_SIZE_ORDER[index]);
        }
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }

  function currentWidgetSettings() {
    var result = [];
    Array.prototype.forEach.call(document.querySelectorAll('.widget-layout-dropzone'), function (zone) {
      var column = zone.getAttribute('data-column');
      Array.prototype.forEach.call(zone.querySelectorAll('.widget-block'), function (block) {
        result.push({
          id: block.getAttribute('data-widget-id'),
          column: column,
          size: block.getAttribute('data-size'),
          visible: block.getAttribute('data-visible') === 'true'
        });
      });
    });
    return result;
  }

  // ---- カスタムナビ項目（個人用ショートカット） ----
  function renderCustomNav(items) {
    var list = qs('nav-custom-list');
    qs('nav-custom-divider').hidden = items.length === 0;
    list.innerHTML = items.map(function (item) {
      return '<button type="button" class="nav-item nav-item-custom" data-url="' + escapeHtml(item.url) + '" title="' + escapeHtml(item.url) + '">' +
        '<svg class="icon"><use href="#icon-link"></use></svg><span>' + escapeHtml(item.label) + '</span>' +
        '</button>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.nav-item-custom'), function (btn) {
      btn.addEventListener('click', function () {
        window.open(btn.getAttribute('data-url'), '_blank', 'noopener');
      });
    });
  }

  function saveCustomNavItems(items) {
    return gasRun('saveUserSettings', { customNavItems: items }).then(function () {
      return loadHome();
    });
  }

  function renderCustomNavSettingsList(items) {
    var container = qs('custom-nav-settings-list');
    if (items.length === 0) {
      container.innerHTML = '<div class="empty-hint">まだカスタム項目がありません</div>';
      return;
    }
    container.innerHTML = items.map(function (item, index) {
      return '<div class="link-row" data-nav-item-id="' + escapeHtml(item.id) + '">' +
        '<div>' +
        '<div class="name">' + escapeHtml(item.label) + '</div>' +
        '<div class="desc">' + escapeHtml(item.url) + '</div>' +
        '</div>' +
        '<span>' +
        '<button type="button" class="btn-custom-nav-up" ' + (index === 0 ? 'disabled' : '') + '>↑</button> ' +
        '<button type="button" class="btn-custom-nav-down" ' + (index === items.length - 1 ? 'disabled' : '') + '>↓</button> ' +
        '<button type="button" class="icon-only btn-custom-nav-delete" aria-label="削除" title="削除"><svg class="icon icon-sm"><use href="#icon-trash"></use></svg></button>' +
        '</span>' +
        '</div>';
    }).join('');

    Array.prototype.forEach.call(container.querySelectorAll('.btn-custom-nav-delete'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('[data-nav-item-id]').getAttribute('data-nav-item-id');
        var next = items.filter(function (item) { return item.id !== id; });
        saveCustomNavItems(next).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-custom-nav-up'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('[data-nav-item-id]').getAttribute('data-nav-item-id');
        var idx = items.map(function (i) { return i.id; }).indexOf(id);
        if (idx <= 0) return;
        var next = items.slice();
        var tmp = next[idx - 1]; next[idx - 1] = next[idx]; next[idx] = tmp;
        saveCustomNavItems(next).catch(showError);
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll('.btn-custom-nav-down'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.closest('[data-nav-item-id]').getAttribute('data-nav-item-id');
        var idx = items.map(function (i) { return i.id; }).indexOf(id);
        if (idx === -1 || idx >= items.length - 1) return;
        var next = items.slice();
        var tmp = next[idx + 1]; next[idx + 1] = next[idx]; next[idx] = tmp;
        saveCustomNavItems(next).catch(showError);
      });
    });
  }

  function initCustomNavSettings() {
    qs('btn-custom-nav-add').addEventListener('click', function () {
      var labelInput = qs('custom-nav-label-input');
      var urlInput = qs('custom-nav-url-input');
      var label = labelInput.value.trim();
      var url = urlInput.value.trim();
      if (!label) { window.alert('表示名を入力してください'); return; }
      if (!/^https?:\/\/.+/i.test(url)) { window.alert('http(s)から始まるURLを入力してください'); return; }
      var current = state.home ? state.home.userSettings.customNavItems : [];
      var next = current.concat([{ label: label, url: url }]);
      saveCustomNavItems(next).then(function () {
        labelInput.value = '';
        urlInput.value = '';
      }).catch(showError);
    });
  }

  function initSettings() {
    qs('btn-save-user-settings').addEventListener('click', function () {
      var settings = {
        widgets: currentWidgetSettings(),
        mailCount: parseInt(qs('setting-mail-count').value, 10) || 5
      };
      gasRun('saveUserSettings', settings).then(function () {
        return loadHome();
      }).then(function () {
        showToast('保存しました');
      }).catch(showError);
    });

    qs('btn-save-global-settings').addEventListener('click', function () {
      var syncCalendarIds = Array.prototype.map.call(
        document.querySelectorAll('.sync-calendar-checkbox:checked'),
        function (cb) { return cb.value; }
      );
      var settings = {
        syncCalendarIds: syncCalendarIds,
        mailLabel: qs('setting-mail-label').value.trim() || 'INBOX',
        notifyEnabled: qs('setting-notify-enabled').checked
      };
      gasRun('saveGlobalSettings', settings).then(function () {
        return loadHome();
      }).then(function () {
        showToast('保存しました');
      }).catch(showError);
    });
  }

  // ===================== 初期化 =====================
  // 各init関数はtry/catchで個別に保護する。手動移行等でHTMLファイルの一部が古い/欠けている
  // ような場合でも、1箇所の初期化失敗が他の機能(更新ボタン等)の初期化まで巻き込んで
  // 止めてしまわないようにするため。
  function safeInit(name, fn) {
    try {
      fn();
    } catch (e) {
      console.error('初期化に失敗しました: ' + name, e);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    safeInit('initGlobalActions', initGlobalActions);
    safeInit('initNav', initNav);
    safeInit('initEventModal', initEventModal);
    safeInit('initCalendarNav', initCalendarNav);
    safeInit('initCalendarViewModeSwitch', initCalendarViewModeSwitch);
    safeInit('initDayDetail', initDayDetail);
    safeInit('initMail', initMail);
    safeInit('initMailPage', initMailPage);
    safeInit('initMailBulkActions', initMailBulkActions);
    safeInit('initSearch', initSearch);
    safeInit('initAppLedger', initAppLedger);
    safeInit('initTodo', initTodo);
    safeInit('initDrive', initDrive);
    safeInit('initDriveViewMode', initDriveViewMode);
    safeInit('initDriveTypeFilter', initDriveTypeFilter);
    safeInit('initSettings', initSettings);
    safeInit('initCustomNavSettings', initCustomNavSettings);
    safeInit('initWidgetLayoutDropzones', initWidgetLayoutDropzones);
    loadHome();
  });
})();
</script>
