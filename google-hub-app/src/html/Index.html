<!DOCTYPE html>
<html data-dark-mode="system">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <!-- Google製プロダクト（Gmail/Drive/カレンダー等）に共通するUIフォント Roboto と、その
       CJKフォールバックとして Noto Sans JP を読み込む（"Google Sans" 自体は非公開フォントの
       ため利用できない。Robotoは同じくGoogle製で最も近い代替）。フォント読み込み前・失敗時は
       Assets.html側のフォールバックスタック(システムフォント)で表示される。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <?!= include('html/Assets'); ?>

  <div class="app-shell">
    <?!= include('html/TopBar'); ?>

    <div class="shell-body">
      <?!= include('html/ControlPanel'); ?>

      <main class="main-content">
        <div id="view-home">
          <div class="card-stack" id="card-stack">
            <?!= include('html/CalendarCard'); ?>
          </div>
        </div>

        <?!= include('html/Pages'); ?>
      </main>

      <aside class="right-sidebar" id="right-sidebar">
        <?!= include('html/SideWidgets'); ?>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- アプリリンク集・ToDoリスト・メールの各モーダルは、あえて#right-sidebarの外に置いている。
       #card-links/#card-todoはJS側でホームのウィジェット(#right-sidebar内)とそれぞれの専用タブ
       (#view-links/#view-todo)との間で付け替えられ、#card-mailは常に#right-sidebar内に留まる
       （メールタブは別構成の#view-mailを持つため付け替え不要）が、いずれにせよ#right-sidebarは
       ホーム画面以外のタブを表示中は常にhidden([hidden]{display:none!important})になる。
       モーダルを#right-sidebar内に置いたままだと、ホーム画面以外にいる間はモーダルを開いても
       画面上には何も表示されない（ヘッダーの横断検索でメール結果をクリックした場合など、
       ホーム画面にいない状態でこれらのモーダルを開く経路が増えたため、この節で全てまとめて
       #right-sidebarの外＝付け替え・表示状態の影響を受けない場所に置くようにしている）。 -->
  <div class="modal-backdrop" id="app-add-modal" hidden>
    <div class="modal-box">
      <h3>アプリリンクを追加</h3>
      <label for="app-add-url">URL</label>
      <input type="text" id="app-add-url" placeholder="https://...">
      <label for="app-add-name">名称</label>
      <input type="text" id="app-add-name" placeholder="名称（省略時はURL先の<title>を自動取得）">
      <div class="modal-footer">
        <button type="button" id="btn-app-add-cancel">キャンセル</button>
        <button type="button" id="btn-app-add-save" class="primary">追加</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="todo-add-modal" hidden>
    <div class="modal-box">
      <h3>期限日・優先度を指定して追加</h3>
      <label for="todo-modal-text">内容</label>
      <input type="text" id="todo-modal-text" placeholder="やることを入力">
      <label for="todo-modal-due">期限日</label>
      <input type="date" id="todo-modal-due">
      <label for="todo-modal-priority">優先度</label>
      <select id="todo-modal-priority">
        <option value="low">低</option>
        <option value="medium" selected>中</option>
        <option value="high">高</option>
      </select>
      <div class="modal-footer">
        <button type="button" id="btn-todo-modal-cancel">キャンセル</button>
        <button type="button" id="btn-todo-modal-save" class="primary">追加</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="mail-detail-modal" hidden>
    <div class="modal-box" style="width: 480px;">
      <h3 id="mail-detail-subject">件名</h3>
      <div class="empty-hint" id="mail-detail-meta" style="padding-top:0;"></div>
      <div id="mail-detail-body" style="white-space: pre-wrap; font-size: 13px; max-height: 320px; overflow-y: auto; border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 6px;"></div>
      <div id="mail-detail-attachments"></div>

      <div id="mail-detail-reply-section" hidden style="margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px;">
        <label for="mail-detail-reply-body">返信内容</label>
        <textarea id="mail-detail-reply-body" rows="4"></textarea>
        <div class="modal-footer">
          <button type="button" id="btn-mail-detail-reply-send" class="primary">返信を送信</button>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" id="btn-mail-detail-reply-toggle">返信</button>
        <button type="button" id="btn-mail-detail-close">閉じる</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="mail-compose-modal" hidden>
    <div class="modal-box">
      <h3>メールを作成</h3>

      <label for="mail-compose-to">宛先</label>
      <input type="text" id="mail-compose-to">

      <label for="mail-compose-subject">件名</label>
      <input type="text" id="mail-compose-subject">

      <label for="mail-compose-body">本文</label>
      <textarea id="mail-compose-body" rows="6"></textarea>

      <div class="modal-footer">
        <button type="button" id="btn-mail-compose-cancel">キャンセル</button>
        <button type="button" id="btn-mail-compose-send" class="primary">送信</button>
      </div>
    </div>
  </div>

  <?!= include('html/JavaScript'); ?>
</body>
</html>
