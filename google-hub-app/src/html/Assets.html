<!-- 共通アイコンスプライト。シックな単色ラインアイコンのみを使用し、絵文字は使わない。
     使い方: <svg class="icon"><use href="#icon-home"></use></svg>
     （以前は Icons.html / Styles.html の2ファイルに分かれていたが、ファイル数を抑えるため統合した） -->
<svg width="0" height="0" style="position:absolute; overflow:hidden;" aria-hidden="true">
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <path d="M4 11 L12 4 L20 11" />
      <path d="M6 10 V20 H18 V10" />
      <path d="M10 20 V14 H14 V20" />
    </symbol>

    <symbol id="icon-folder" viewBox="0 0 24 24">
      <path d="M4 7a1 1 0 0 1 1-1h4.2l1.6 2H19a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7z" />
    </symbol>

    <symbol id="icon-sliders" viewBox="0 0 24 24">
      <line x1="4" y1="7" x2="20" y2="7" />
      <circle cx="9" cy="7" r="2" />
      <line x1="4" y1="12" x2="20" y2="12" />
      <circle cx="15" cy="12" r="2" />
      <line x1="4" y1="17" x2="20" y2="17" />
      <circle cx="11" cy="17" r="2" />
    </symbol>

    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.2" />
      <line x1="15.2" y1="15.2" x2="20" y2="20" />
    </symbol>

    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path d="M6 16V11a6 6 0 0 1 12 0v5l1.6 2.4H4.4z" />
      <path d="M10 20a2 2 0 0 0 4 0" />
    </symbol>

    <symbol id="icon-mail" viewBox="0 0 24 24">
      <rect x="3.5" y="6" width="17" height="12" rx="1.4" />
      <path d="M4.3 7.4 L12 13 L19.7 7.4" />
    </symbol>

    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="M6 9l6 6 6-6" />
    </symbol>

    <symbol id="icon-shuffle" viewBox="0 0 24 24">
      <path d="M4 7h3.2c1 0 1.7.4 2.3 1.2L15 16c.6.8 1.3 1.2 2.3 1.2H20" />
      <path d="M17 4l3 3-3 3" />
      <path d="M4 17h3.2c1 0 1.7-.4 2.3-1.2" />
      <path d="M17 20l3-3-3-3" />
    </symbol>

    <symbol id="icon-compass" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.2" />
      <path d="M15.2 8.8l-2 4.4-4.4 2 2-4.4z" />
    </symbol>

    <symbol id="icon-arrow-up" viewBox="0 0 24 24">
      <path d="M12 5v14" />
      <path d="M6 11l6-6 6 6" />
    </symbol>

    <symbol id="icon-arrow-left" viewBox="0 0 24 24">
      <path d="M19 12H5" />
      <path d="M11 6l-6 6 6 6" />
    </symbol>

    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.2" />
      <path d="M12 7.5V12l3.2 2" />
    </symbol>

    <symbol id="icon-link" viewBox="0 0 24 24">
      <path d="M9.5 14.5l5-5" />
      <path d="M11 8.5l1-1a3 3 0 0 1 4.2 4.2l-1 1" />
      <path d="M13 15.5l-1 1a3 3 0 0 1-4.2-4.2l1-1" />
    </symbol>

    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3" />
      <path d="M18 4v4h-4" />
      <path d="M6 20v-4h4" />
    </symbol>

    <symbol id="icon-plus" viewBox="0 0 24 24">
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </symbol>

    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M5 7h14" />
      <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
      <path d="M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13" />
    </symbol>

    <symbol id="icon-eye" viewBox="0 0 24 24">
      <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" />
      <circle cx="12" cy="12" r="3" />
    </symbol>

    <symbol id="icon-eye-off" viewBox="0 0 24 24">
      <path d="M3.5 3.5l17 17" />
      <path d="M9.9 5.6C10.6 5.5 11.3 5.5 12 5.5c6 0 9.5 6.5 9.5 6.5a15.6 15.6 0 0 1-3.3 4" />
      <path d="M6.4 7.3C4 9 2.5 12 2.5 12s3.5 6.5 9.5 6.5c1.3 0 2.5-.3 3.6-.8" />
      <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
    </symbol>

    <symbol id="icon-grip" viewBox="0 0 24 24">
      <circle cx="9" cy="6" r="1.3" />
      <circle cx="15" cy="6" r="1.3" />
      <circle cx="9" cy="12" r="1.3" />
      <circle cx="15" cy="12" r="1.3" />
      <circle cx="9" cy="18" r="1.3" />
      <circle cx="15" cy="18" r="1.3" />
    </symbol>

    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M5 12.5l4.5 4.5L19 7" />
    </symbol>
  </defs>
</svg>

<style>
  :root {
    --panel-bg: #757575;
    --panel-text: #ffffff;
    --topbar-bg: #ffffff;
    --content-bg: #f4f4f4;
    --content-text: #1a1a1a;
    --content-muted: #666666;
    --content-faint: #999999;
    --card-bg: #ffffff;
    --border-color: #dcdcdc;
    --border-soft: #ececec;
    --danger: #c62828;
    --icon-color: #5a5a5a;
    --accent: #3949ab;
  }

  * { box-sizing: border-box; }
  /* hidden属性は他のdisplay指定より必ず優先する（button等のdisplay:inline-flexに負けないように） */
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--content-bg);
    color: var(--content-text);
    overflow-x: hidden;
  }

  /* ===== 共通アイコン: シックな単色ラインアイコン（絵文字は使わない） ===== */
  .icon {
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .icon-sm { width: 15px; height: 15px; }
  .icon-lg { width: 22px; height: 22px; }

  /* ===== 上部ヘッダー（全幅・中立色） ===== */
  .topbar {
    height: 60px;
    flex: 0 0 60px;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 20px;
    background: var(--topbar-bg);
    border-bottom: 1px solid var(--border-color);
    position: relative;
    z-index: 20;
  }
  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    font-size: 15px;
    color: var(--content-text);
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .topbar-brand .icon { color: var(--accent); width: 22px; height: 22px; }

  .topbar-search {
    flex: 1 1 auto;
    max-width: 480px;
    position: relative;
  }
  .topbar-search .icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--content-faint);
    pointer-events: none;
  }
  .topbar-search input {
    width: 100%;
    padding: 8px 12px 8px 36px;
    border-radius: 999px;
    border: 1px solid var(--border-color);
    background: var(--content-bg);
    font-size: 13px;
  }
  .topbar-search input:focus { outline: none; border-color: var(--accent); background: #fff; }

  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    max-height: 360px;
    overflow-y: auto;
    z-index: 30;
  }
  .search-group-label {
    font-size: 11px;
    color: var(--content-muted);
    padding: 8px 14px 4px;
  }
  .search-result-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 14px;
    cursor: pointer;
    border-top: 1px solid var(--border-soft);
  }
  .search-result-row:hover { background: var(--content-bg); }
  .search-result-row .r-name { font-size: 13px; font-weight: 600; }
  .search-result-row .r-desc { font-size: 11px; color: var(--content-muted); }

  .topbar-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
  }
  .avatar-badge {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    cursor: default;
    flex: 0 0 auto;
  }

  /* ===== 全体レイアウト: ヘッダー(全幅) + 左ナビ / メイン / 右サイドバー ===== */
  .app-shell {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .shell-body {
    display: flex;
    flex: 1 1 auto;
    align-items: stretch;
    min-height: 0;
  }

  /* ===== トースト通知（設定保存完了などの一時メッセージ） ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 12px);
    background: #1a1a1a;
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

  /* --- 左：コントロールパネル（テーマ色を適用する唯一の領域） --- */
  .control-panel {
    width: 208px;
    flex: 0 0 208px;
    background: var(--panel-bg);
    color: var(--panel-text);
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: inherit;
    background: transparent;
    border: none;
    font-size: 13.5px;
    text-align: left;
    width: 100%;
  }
  .nav-item .icon { color: inherit; opacity: 0.85; }

  .nav-badge {
    margin-left: auto;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    line-height: 16px;
    text-align: center;
    flex: 0 0 auto;
  }

  .nav-item:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .nav-item.active {
    background: rgba(255, 255, 255, 0.25);
    font-weight: 600;
  }
  .nav-item.active .icon { opacity: 1; }

  .control-panel[data-text="dark"] .nav-item:hover { background: rgba(0, 0, 0, 0.1); }
  .control-panel[data-text="dark"] .nav-item.active { background: rgba(0, 0, 0, 0.16); }

  /* --- 個人用カスタムナビ項目（設定画面から自由に追加できるショートカット） --- */
  .nav-divider {
    height: 1px;
    margin: 8px 4px;
    background: rgba(255, 255, 255, 0.25);
  }
  .control-panel[data-text="dark"] .nav-divider { background: rgba(0, 0, 0, 0.16); }
  .nav-item-custom .icon { opacity: 0.7; }

  /* --- 中央：メインコンテンツ（中立色固定） --- */
  .main-content {
    flex: 1 1 auto;
    padding: 22px;
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 0;
  }

  .card-stack {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* --- 右：サイドバー（今日の予定・メール・リンク集・ToDo） --- */
  .right-sidebar {
    width: 300px;
    flex: 0 0 300px;
    padding: 22px 18px 22px 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .right-sidebar .card { padding: 14px 16px; }
  .right-sidebar .card h2 { font-size: 13.5px; }

  /* ===== ウィジェット（カレンダー/今日の予定/メール/アプリリンク集/ToDo）の配置・サイズ =====
     配置先(メイン/サイドバー)・サイズ(小/中/大)は設定画面から変更可能。
     flex-grow の比率のみを指定し、実際の高さ配分はPCビュー側の overflow:hidden な
     コンテナ内で行うため、モバイル(自然な縦積み)では実質無効。 */
  .widget-size-small { flex: 1 1 0; }
  .widget-size-medium { flex: 2 1 0; }
  .widget-size-large { flex: 3 1 0; }

  .today-list { display: flex; flex-direction: column; gap: 10px; }
  .today-item { display: flex; gap: 10px; font-size: 12.5px; }
  .today-item .t-time {
    flex: 0 0 auto;
    width: 46px;
    color: var(--accent);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .today-item .t-title { font-weight: 600; }
  .today-item .t-place { color: var(--content-muted); font-size: 11.5px; }

  /* 予定の種類バッジ（カレンダーの色分け） */
  .category-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: 0 0 auto;
    margin-right: 5px;
    border: 1px solid rgba(0,0,0,0.1);
  }
  .category-badge {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    padding: 1px 7px 1px 5px;
    border-radius: 999px;
    background: var(--content-bg);
    color: var(--content-muted);
    margin-left: 6px;
  }
  .category-swatch-select {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .category-swatch {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1.5px solid var(--border-color);
    background: #fff;
    cursor: pointer;
  }
  .category-swatch.selected { border-color: var(--content-text); background: var(--content-bg); font-weight: 600; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 16px 18px;
  }

  .card h2 {
    margin: 0 0 12px 0;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .card h2 .h2-label { display: flex; align-items: center; gap: 8px; }
  .card h2 .icon { color: var(--content-faint); }

  .card .card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .card .card-actions button {
    margin-left: 0;
  }

  button {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: #fff;
    color: var(--content-text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  button.primary {
    background: #333333;
    border-color: #333333;
    color: #ffffff;
  }

  button.danger {
    color: var(--danger);
    border-color: var(--danger);
  }

  button.icon-only {
    width: 32px;
    height: 32px;
    padding: 0;
    justify-content: center;
    border-radius: 50%;
  }

  button:disabled { opacity: 0.55; cursor: default; }

  /* 更新ボタンのタップ時の読み込み演出（アイコンを回転させる） */
  @keyframes icon-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  button.is-loading .icon { animation: icon-spin 0.7s linear infinite; }

  button.link-button {
    background: none;
    border: none;
    padding: 4px 2px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
  }
  button.link-button:hover { text-decoration: underline; }

  input[type="text"], input[type="datetime-local"], input[type="date"], input[type="number"], select, textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    width: 100%;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--content-muted);
    margin-bottom: 4px;
    margin-top: 10px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border-color); }
  th { color: var(--content-muted); font-weight: normal; }

  /* ミニカレンダーはtableではなくCSS Gridで組み、PCビューで残りの縦幅いっぱいに広がるようにする */
  .mini-calendar { width: 100%; }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    flex: 0 0 auto;
    margin-bottom: 2px;
  }
  .cal-weekdays span {
    text-align: center;
    font-size: 12px;
    color: var(--content-muted);
    padding: 4px 0;
  }
  .cal-weekdays span:first-child { color: #e05a8a; }
  .cal-weekdays span:last-child { color: #3a8fd6; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 64px;
    gap: 1px;
    background: var(--border-color);
    border: 1px solid var(--border-color);
  }
  .cal-cell {
    background: #fff;
    padding: 4px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .cal-cell:hover { background: var(--content-bg); }
  .cal-cell.empty { background: #fafafa; cursor: default; }
  .cal-cell.empty:hover { background: #fafafa; }

  /* 土曜=水色・日曜=ピンク・祝日=ライトグリーン背景（7列グリッドの位置から曜日を判定） */
  .cal-cell:not(.empty):nth-child(7n+1) { background: #e8f3fb; }
  .cal-cell:not(.empty):nth-child(7n) { background: #fbe9f0; }
  .cal-cell:not(.empty):nth-child(7n+1):hover,
  .cal-cell:not(.empty):nth-child(7n):hover { filter: brightness(0.97); }
  .cal-cell.is-holiday { background: #e6f5e6; }
  .cal-cell.is-holiday:hover { filter: brightness(0.97); }

  .cal-cell .day-num { font-size: 11px; color: var(--content-muted); }
  .cal-cell.is-today .day-num { font-weight: bold; color: var(--accent); }
  .cal-cell .rokuyo-label { font-size: 9px; color: var(--content-muted); line-height: 1.3; }
  .cal-cell .holiday-label {
    font-size: 9px;
    color: #2f8a3e;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 予定を追加すると、セル内に見える範囲でタイトルをチップ表示する（詳細はセルタップのポップアップで） */
  .cal-cell .event-chips {
    display: flex;
    flex-direction: column;
    gap: 1.5px;
    margin-top: 2px;
    overflow: hidden;
  }
  .cal-cell .event-chip {
    font-size: 9.5px;
    line-height: 1.5;
    padding: 0 4px;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-cell .event-chip-more {
    font-size: 9px;
    color: var(--content-muted);
    padding: 0 2px;
  }

  .mail-row, .link-row, .todo-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
    gap: 8px;
  }
  .mail-row:last-child, .link-row:last-child, .todo-row:last-child { border-bottom: none; }
  .mail-row { cursor: pointer; }
  .mail-row:hover { background: var(--content-bg); }
  .mail-row .subject { font-weight: bold; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row.unread .subject { color: #1a237e; }
  .mail-row.selected { background: #eef0fb; }
  .mail-row .from { color: var(--content-muted); font-size: 12px; width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row .date { color: var(--content-muted); font-size: 12px; width: 90px; text-align: right; }

  .right-sidebar .mail-row .from { width: auto; max-width: 90px; }

  /* ===== メールタブ専用の2カラム画面（左：件名一覧／右：本文） ===== */
  .mail-page { display: flex; gap: 0; padding: 0; overflow: hidden; }
  .mail-page-list-col {
    width: 340px;
    flex: 0 0 340px;
    border-right: 1px solid var(--border-color);
    padding: 16px 14px;
    min-width: 0;
  }
  .mail-page-toolbar {
