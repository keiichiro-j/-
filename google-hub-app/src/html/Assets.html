<style>
  :root {
    --panel-bg: #757575;
    --panel-text: #ffffff;
    /* --theme-*-light/-dark はJS側(applyThemeBackgrounds())が選択中のテーマ色から計算して
       ここに動的にセットする。JS実行前・テーマ未適用時はフォールバック値（従来の中立色）になる。 */
    --topbar-bg: var(--theme-topbar-bg-light, #ffffff);
    --content-bg: var(--theme-content-bg-light, #f4f4f4);
    --content-text: #1a1a1a;
    --content-muted: #666666;
    --content-faint: #999999;
    --card-bg: #ffffff;
    --border-color: #dcdcdc;
    --border-soft: #ececec;
    --danger: #c62828;
    --icon-color: #5a5a5a;
    --accent: #3949ab;
    --primary-bg: #333333;
    --cal-sun-bg: #fbe9f0;
    --cal-sat-bg: #e8f3fb;
    --cal-holiday-bg: #e6f5e6;
  }

  /* ===== 表示モード（ライト/ダーク/システムに合わせる） =====
     <html data-dark-mode="system|light|dark"> をJSが切り替える。"system"の場合のみ
     prefers-color-schemeメディアクエリと組み合わせて判定する。 */
  @media (prefers-color-scheme: dark) {
    html[data-dark-mode="system"] {
      --content-bg: var(--theme-content-bg-dark, #17181a);
      --content-text: #e8e8ea;
      --content-muted: #9a9a9e;
      --content-faint: #6f6f74;
      --card-bg: #232326;
      --border-color: #3a3a3e;
      --border-soft: #2c2c30;
      --topbar-bg: var(--theme-topbar-bg-dark, #1c1c1f);
      --danger: #ef5350;
      --icon-color: #c7c7ca;
      --accent: #8b97ff;
      --primary-bg: #4b4b52;
      --cal-sun-bg: #241f28;
      --cal-sat-bg: #22242e;
      --cal-holiday-bg: #1c2a20;
    }
  }
  html[data-dark-mode="dark"] {
    --content-bg: var(--theme-content-bg-dark, #17181a);
    --content-text: #e8e8ea;
    --content-muted: #9a9a9e;
    --content-faint: #6f6f74;
    --card-bg: #232326;
    --border-color: #3a3a3e;
    --border-soft: #2c2c30;
    --topbar-bg: var(--theme-topbar-bg-dark, #1c1c1f);
    --danger: #ef5350;
    --icon-color: #c7c7ca;
    --accent: #8b97ff;
    --primary-bg: #4b4b52;
    --cal-sun-bg: #241f28;
    --cal-sat-bg: #22242e;
    --cal-holiday-bg: #1c2a20;
  }

  * { box-sizing: border-box; }
  /* hidden属性は他のdisplay指定より必ず優先する（button等のdisplay:inline-flexに負けないように） */
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--content-bg);
    color: var(--content-text);
    overflow-x: hidden;
  }

  /* ===== 共通アイコン: シックな単色ラインアイコン（絵文字は使わない） ===== */
  .icon {
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .icon-sm { width: 15px; height: 15px; }
  .icon-lg { width: 22px; height: 22px; }

  /* ===== 上部ヘッダー（全幅・中立色） =====
     ロゴを常に画面中央に置くため、左右のブロック(.topbar-side)を同じflex比率(1)で確保し、
     中央の.topbar-brandをその間に挟む3分割構成にしている（左右の中身の幅が違っても中央は揃う）。 */
  .topbar {
    height: 60px;
    flex: 0 0 60px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    background: var(--topbar-bg);
    border-bottom: 1px solid var(--border-color);
    position: relative;
    z-index: 20;
  }
  .topbar-side { flex: 1 1 0; display: flex; align-items: center; min-width: 0; }
  .topbar-side-left { justify-content: flex-start; }
  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    font-size: 15px;
    color: var(--content-text);
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .topbar-brand .icon { color: var(--accent); width: 22px; height: 22px; }

  /* ===== コントロールパネルの横断検索（ホームの直上） =====
     パネルの背景はテーマ色で変わるため、周囲の色に馴染む半透明の「すりガラス」風にし、
     文字色が濃い配色(data-text="dark")の場合は黒みの半透明に切り替えて視認性を保つ。 */
  .control-panel-search { position: relative; margin: 0 2px 10px; }
  .control-panel-search .icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: inherit;
    opacity: 0.75;
    pointer-events: none;
  }
  .control-panel-search input {
    width: 100%;
    padding: 8px 10px 8px 32px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.16);
    color: inherit;
    font-size: 12.5px;
  }
  .control-panel-search input::placeholder { color: inherit; opacity: 0.7; }
  .control-panel-search input:focus {
    outline: none;
    border-color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.24);
  }
  .control-panel[data-text="dark"] .control-panel-search input {
    border-color: rgba(0,0,0,0.22);
    background: rgba(0,0,0,0.08);
  }
  .control-panel[data-text="dark"] .control-panel-search input:focus {
    border-color: rgba(0,0,0,0.4);
    background: rgba(0,0,0,0.14);
  }
  .control-panel-search .search-results { color: var(--content-text); }

  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    max-height: 360px;
    overflow-y: auto;
    z-index: 30;
  }
  .search-group-label {
    font-size: 11px;
    color: var(--content-muted);
    padding: 8px 14px 4px;
  }
  .search-result-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 14px;
    cursor: pointer;
    border-top: 1px solid var(--border-soft);
  }
  .search-result-row:hover { background: var(--content-bg); }
  .search-result-row .r-name { font-size: 13px; font-weight: 600; }
  .search-result-row .r-desc { font-size: 11px; color: var(--content-muted); }

  .topbar-actions {
    justify-content: flex-end;
    gap: 6px;
  }
  .avatar-badge {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    cursor: default;
    flex: 0 0 auto;
  }

  /* ===== 全体レイアウト: ヘッダー(全幅) + 左ナビ / メイン / 右サイドバー ===== */
  .app-shell {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .shell-body {
    display: flex;
    flex: 1 1 auto;
    align-items: stretch;
    min-height: 0;
  }

  /* ===== トースト通知（設定保存完了などの一時メッセージ） ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 12px);
    background: #1a1a1a;
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

  /* --- 左：コントロールパネル（テーマ色を適用する唯一の領域） --- */
  .control-panel {
    width: 208px;
    flex: 0 0 208px;
    background: var(--panel-bg);
    color: var(--panel-text);
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: inherit;
    background: transparent;
    border: none;
    font-size: 13.5px;
    text-align: left;
    width: 100%;
  }
  .nav-item .icon { color: inherit; opacity: 0.85; }

  .nav-badge {
    margin-left: auto;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    line-height: 16px;
    text-align: center;
    flex: 0 0 auto;
  }

  .nav-item:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .nav-item.active {
    background: rgba(255, 255, 255, 0.25);
    font-weight: 600;
  }
  .nav-item.active .icon { opacity: 1; }

  .control-panel[data-text="dark"] .nav-item:hover { background: rgba(0, 0, 0, 0.1); }
  .control-panel[data-text="dark"] .nav-item.active { background: rgba(0, 0, 0, 0.16); }

  /* --- 個人用カスタムナビ項目（設定画面から自由に追加できるショートカット） --- */
  .nav-divider {
    height: 1px;
    margin: 8px 4px;
    background: rgba(255, 255, 255, 0.25);
  }
  .control-panel[data-text="dark"] .nav-divider { background: rgba(0, 0, 0, 0.16); }
  .nav-item-custom .icon { opacity: 0.7; }

  /* --- 中央：メインコンテンツ（中立色固定） --- */
  .main-content {
    flex: 1 1 auto;
    padding: 22px;
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 0;
  }

  .card-stack {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* --- 右：サイドバー（今日の予定・メール・リンク集・ToDo） --- */
  .right-sidebar {
    width: 300px;
    flex: 0 0 300px;
    padding: 22px 18px 22px 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .right-sidebar .card { padding: 14px 16px; }
  .right-sidebar .card h2 { font-size: 13.5px; }

  /* ===== ウィジェット（カレンダー/今日の予定/メール/アプリリンク集/ToDo）の配置・サイズ =====
     配置先(メイン/サイドバー)・サイズ(小/中/大)は設定画面から変更可能。
     flex-grow の比率のみを指定し、実際の高さ配分はPCビュー側の overflow:hidden な
     コンテナ内で行うため、モバイル(自然な縦積み)では実質無効。 */
  .widget-size-small { flex: 1 1 0; }
  .widget-size-medium { flex: 2 1 0; }
  .widget-size-large { flex: 3 1 0; }

  .today-list { display: flex; flex-direction: column; gap: 10px; }
  .today-item { display: flex; gap: 10px; font-size: 12.5px; }
  .today-item .t-time {
    flex: 0 0 auto;
    width: 46px;
    color: var(--accent);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .today-item .t-title { font-weight: 600; }
  .today-item .t-place { color: var(--content-muted); font-size: 11.5px; }

  /* 予定の種類バッジ（カレンダーの色分け） */
  .category-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: 0 0 auto;
    margin-right: 5px;
    border: 1px solid rgba(0,0,0,0.1);
  }
  .category-badge {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    padding: 1px 7px 1px 5px;
    border-radius: 999px;
    background: var(--content-bg);
    color: var(--content-muted);
    margin-left: 6px;
  }
  .category-swatch-select {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .category-swatch {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1.5px solid var(--border-color);
    background: var(--card-bg);
    cursor: pointer;
  }
  .category-swatch.selected { border-color: var(--content-text); background: var(--content-bg); font-weight: 600; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 16px 18px;
  }

  .card h2 {
    margin: 0 0 12px 0;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .card h2 .h2-label { display: flex; align-items: center; gap: 8px; }
  .card h2 .icon { color: var(--content-faint); }

  .card .card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .card .card-actions button {
    margin-left: 0;
  }

  button {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--content-text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: transform 0.08s ease, filter 0.08s ease;
  }

  /* クリック/タップした「押した感触」。全ボタン共通（テーマスウォッチ・ナビ項目・タグチップ等、
     <button>要素として実装されているものすべてに自動的に効く） */
  button:active:not(:disabled) {
    transform: scale(0.96);
    filter: brightness(0.95);
  }

  button.primary {
    background: var(--primary-bg);
    border-color: var(--primary-bg);
    color: #ffffff;
  }

  button.danger {
    color: var(--danger);
    border-color: var(--danger);
  }

  button.icon-only {
    width: 32px;
    height: 32px;
    padding: 0;
    justify-content: center;
    border-radius: 50%;
  }

  button:disabled { opacity: 0.55; cursor: default; }

  /* 更新ボタンのタップ時の読み込み演出（アイコンを回転させる） */
  @keyframes icon-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  button.is-loading .icon { animation: icon-spin 0.7s linear infinite; }

  button.link-button {
    background: none;
    border: none;
    padding: 4px 2px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
  }
  button.link-button:hover { text-decoration: underline; }

  input[type="text"], input[type="datetime-local"], input[type="date"], input[type="number"], select, textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    width: 100%;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--content-muted);
    margin-bottom: 4px;
    margin-top: 10px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border-color); }
  th { color: var(--content-muted); font-weight: normal; }

  /* ミニカレンダーはtableではなくCSS Gridで組み、PCビューで残りの縦幅いっぱいに広がるようにする */
  .mini-calendar { width: 100%; }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    flex: 0 0 auto;
    margin-bottom: 2px;
  }
  .cal-weekdays span {
    text-align: center;
    font-size: 12px;
    color: var(--content-muted);
    padding: 4px 0;
  }
  .cal-weekdays span:first-child { color: #e05a8a; }
  .cal-weekdays span:last-child { color: #3a8fd6; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 64px;
    gap: 1px;
    background: var(--border-color);
    border: 1px solid var(--border-color);
  }
  .cal-cell {
    background: var(--card-bg);
    padding: 4px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .cal-cell:hover { background: var(--content-bg); }
  .cal-cell.empty { background: var(--content-bg); cursor: default; }
  .cal-cell.empty:hover { background: var(--content-bg); }

  /* 土曜=水色・日曜=ピンク・祝日=ライトグリーン背景（7列グリッドの位置から曜日を判定） */
  .cal-cell:not(.empty):nth-child(7n+1) { background: var(--cal-sun-bg); }
  .cal-cell:not(.empty):nth-child(7n) { background: var(--cal-sat-bg); }
  .cal-cell:not(.empty):nth-child(7n+1):hover,
  .cal-cell:not(.empty):nth-child(7n):hover { filter: brightness(0.97); }
  .cal-cell.is-holiday { background: var(--cal-holiday-bg); }
  .cal-cell.is-holiday:hover { filter: brightness(0.97); }

  .cal-cell .day-num { font-size: 11px; color: var(--content-muted); }
  .cal-cell.is-today .day-num { font-weight: bold; color: var(--accent); }
  .cal-cell .rokuyo-label { font-size: 9px; color: var(--content-muted); line-height: 1.3; }
  .cal-cell .holiday-label {
    font-size: 9px;
    color: #2f8a3e;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 予定を追加すると、セル内に見える範囲でタイトルをチップ表示する（詳細はセルタップのポップアップで） */
  .cal-cell .event-chips {
    display: flex;
    flex-direction: column;
    gap: 1.5px;
    margin-top: 2px;
    overflow: hidden;
  }
  .cal-cell .event-chip {
    font-size: 9.5px;
    line-height: 1.5;
    padding: 0 4px;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-cell .event-chip-more {
    font-size: 9px;
    color: var(--content-muted);
    padding: 0 2px;
  }
  /* 月表示: 予定チップをドラッグ&ドロップして日付を変更できる */
  .cal-cell .event-chip[draggable="true"] { cursor: grab; }
  .cal-cell.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; }

  .mail-row, .link-row, .todo-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
    gap: 8px;
  }
  .mail-row:last-child, .link-row:last-child, .todo-row:last-child { border-bottom: none; }
  .mail-row { cursor: pointer; }
  .mail-row:hover { background: var(--content-bg); }
  .mail-row .subject { font-weight: bold; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row.unread .subject { color: #1a237e; }
  .mail-row.selected { background: #eef0fb; }
  .mail-row .from { color: var(--content-muted); font-size: 12px; width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row .date { color: var(--content-muted); font-size: 12px; width: 90px; text-align: right; }

  .right-sidebar .mail-row .from { width: auto; max-width: 90px; }

  /* ===== メールタブ専用の2カラム画面（左：件名一覧／右：本文） ===== */
  .mail-page { display: flex; gap: 0; padding: 0; overflow: hidden; }
  .mail-page-list-col {
    width: 340px;
    flex: 0 0 340px;
    border-right: 1px solid var(--border-color);
    padding: 16px 14px;
    min-width: 0;
  }
  .mail-page-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .mail-page-reader-col {
    flex: 1 1 auto;
    padding: 20px 24px;
    min-width: 0;
  }
  .mail-page-reader-col .subject { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .mail-page-reader-col .meta { color: var(--content-muted); font-size: 12.5px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
  .mail-page-reader-col .body-text { white-space: pre-wrap; font-size: 13.5px; line-height: 1.7; }
  .mail-reply-toolbar { margin-top: 14px; }
  #mailpage-reply-section, #mail-detail-reply-section { margin-top: 8px; }
  #mail-page-list .mail-row .subject { font-weight: 600; }
  @media (max-width: 860px) {
    .mail-page { flex-direction: column; }
    .mail-page-list-col { width: 100%; flex: 1 1 auto; border-right: none; border-bottom: 1px solid var(--border-color); }
  }

  .nav-item-settings-row { cursor: grab; }
  .nav-item-settings-row.is-dragging { opacity: 0.4; }
  .link-row .name { font-weight: bold; }
  .link-row .desc { color: var(--content-muted); font-size: 12px; }
  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    color: #fff;
  }
  .status-badge.ok { background: #2e7d32; }
  .status-badge.error { background: #c62828; }
  .status-badge.unknown { background: #9e9e9e; }

  /* ===== ToDoリスト ===== */
  .todo-row input[type="checkbox"] { width: auto; flex: 0 0 auto; }
  .todo-text { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .todo-text.done { text-decoration: line-through; color: var(--content-muted); }

  .drive-list { display: flex; flex-direction: column; gap: 6px; }
  .drive-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
    cursor: pointer;
  }
  .drive-row:hover { background: var(--content-bg); }
  .drive-grid-item { cursor: pointer; }
  .drive-grid-item:hover { background: var(--content-bg); }
  .drive-row img { width: 18px; height: 18px; }
  .drive-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drive-row .name a { color: inherit; text-decoration: none; }
  .drive-row .name a:hover { text-decoration: underline; }
  .drive-row .meta { color: var(--content-muted); font-size: 12px; width: 140px; text-align: right; }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .toolbar input[type="text"] { flex: 1; min-width: 120px; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-box {
    background: var(--card-bg); border-radius: 10px; padding: 20px; width: 360px; max-width: 90vw;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-box h3 { margin-top: 0; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .empty-hint { color: var(--content-muted); font-size: 13px; padding: 8px 0; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; }
  .checkbox-row label { margin: 0; }

  .settings-section { margin-bottom: 20px; }
  .settings-section h3 { font-size: 14px; margin-bottom: 8px; }
  .synced-calendar-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; padding: 4px 0; color: var(--content-text);
  }
  .synced-calendar-row .icon { color: var(--accent); width: 14px; height: 14px; }

  /* ===== 設定画面: テーマスウォッチ（11色 + ランダムの計12択） ===== */
  .theme-swatch-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 10px;
  }
  .theme-swatch {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px 6px 7px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    font-size: 10.5px;
    color: var(--content-muted);
    text-align: center;
  }
  .theme-swatch:hover { background: var(--content-bg); }
  .theme-swatch.selected { border-color: var(--accent); background: var(--content-bg); color: var(--content-text); font-weight: 600; }
  .theme-swatch .swatch-color {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .theme-swatch .swatch-color.is-random {
    display: flex;
    align-items: center;
    justify-content: center;
    background: repeating-conic-gradient(from 0deg, #e53935 0deg 32.7deg, #fb8c00 32.7deg 65.4deg, #fdd835 65.4deg 98.1deg, #43a047 98.1deg 130.8deg, #00897b 130.8deg 163.5deg, #1e88e5 163.5deg 196.2deg, #3949ab 196.2deg 228.9deg, #8e24aa 228.9deg 261.6deg, #d81b60 261.6deg 294.3deg, #6d4c41 294.3deg 327deg, #757575 327deg 360deg);
    color: #fff;
  }
  .theme-swatch .swatch-color.is-random .icon { color: #fff; width: 16px; height: 16px; }

  /* ===== 設定画面: ホーム画面ウィジェットの視覚的レイアウトエディタ =====
     メインエリア・サイドバーの各ドロップゾーンを同じ固定高さにし、その中でブロックを
     widget-block-size-*(flex-grow 1:2:3)で分け合わせる。実際のダッシュボードと同じ
     「同じ高さの列を、中の各ウィジェットがflex-growで奪い合う」仕組みをそのまま再現するため、
     ウィジェット構成に関わらずメインエリアとサイドバーの合計の高さは常に一致する。 */
  .widget-layout-editor {
    display: flex;
    gap: 16px;
    align-items: stretch;
  }
  .widget-layout-col { flex: 2 1 0; min-width: 0; display: flex; flex-direction: column; }
  .widget-layout-col[data-column="side"] { flex: 1 1 0; }
  .widget-layout-col-label {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--content-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .widget-layout-dropzone {
    display: flex;
    flex-direction: column;
    gap: 8px;
    height: 420px;
    padding: 8px;
    border: 1.5px dashed var(--border-color);
    border-radius: 10px;
    background: var(--content-bg);
  }
  .widget-layout-dropzone.is-drag-over { border-color: var(--accent); background: #eef0fb; }

  .widget-block {
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: grab;
    user-select: none;
    min-height: 0;
    overflow: hidden;
    transition: opacity 0.15s ease;
  }
  .widget-block-size-small { flex: 1 1 0; }
  .widget-block-size-medium { flex: 2 1 0; }
  .widget-block-size-large { flex: 3 1 0; }
  .widget-block.is-dragging { opacity: 0.35; }
  .widget-block.is-hidden { opacity: 0.5; border-style: dashed; background: transparent; }

  .widget-block-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .widget-block-drag-handle { color: var(--content-faint); flex: 0 0 auto; cursor: grab; }
  .widget-block-label { font-size: 13px; font-weight: 600; flex: 1 1 auto; }
  .widget-block-visibility {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    padding: 0;
    justify-content: center;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--content-muted);
  }
  .widget-block-visibility:hover { background: var(--content-bg); }

  /* サンプルデザイン(実データではなく骨組みのモックアップ)。大きさ(小/中/大)に応じて
     行数が変わり、リサイズ時の見た目の変化をその場で確認できる。 */
  .widget-block-mock {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
  }
  .wmock-list { display: flex; flex-direction: column; gap: 5px; }
  .wmock-row { display: flex; align-items: center; gap: 5px; }
  .wmock-bar { height: 6px; border-radius: 3px; background: var(--border-color); flex: 0 0 auto; }
  .wmock-bar-sm { width: 22px !important; margin-left: auto; }
  .wmock-bar.is-done { opacity: 0.45; }
  .wmock-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-color); flex: 0 0 auto; }
  .wmock-dot.is-unread { background: var(--accent); }
  .wmock-time { width: 22px; height: 6px; border-radius: 3px; background: var(--accent); opacity: 0.5; flex: 0 0 auto; }
  .wmock-icon-dot { width: 9px; height: 9px; border-radius: 3px; background: var(--content-faint); flex: 0 0 auto; }
  .wmock-badge { width: 16px; height: 6px; border-radius: 3px; background: var(--content-faint); opacity: 0.6; margin-left: auto; flex: 0 0 auto; }
  .wmock-check { width: 9px; height: 9px; border-radius: 2px; border: 1.5px solid var(--content-faint); flex: 0 0 auto; }
  .wmock-check.is-checked { background: var(--accent); border-color: var(--accent); }

  .wmock-cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 3px; flex: 0 0 auto; }
  .wmock-cal-weekdays span { font-size: 7px; text-align: center; color: var(--content-faint); }
  .wmock-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; flex: 1 1 auto; min-height: 0; }
  .wmock-cal-cell { background: var(--content-bg); border-radius: 2px; display: flex; align-items: flex-end; padding: 1px; min-height: 7px; }
  .wmock-chip { width: 100%; height: 3px; border-radius: 2px; background: var(--accent); opacity: 0.55; }

  .widget-block-size-label {
    font-size: 10.5px;
    color: var(--content-faint);
  }
  .widget-block-resize-handle {
    flex: 0 0 auto;
    height: 10px;
    margin: 4px -2px -2px;
    border-radius: 4px;
    cursor: ns-resize;
    position: relative;
  }
  .widget-block-resize-handle::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 28px;
    height: 3px;
    border-radius: 999px;
    background: var(--border-color);
    transform: translate(-50%, -50%);
  }
  .widget-block-resize-handle:hover::after { background: var(--accent); }

  /* ===== 表示モード切替（設定画面）: システム/ライト/ダーク ===== */
  .dark-mode-switcher { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .dark-mode-option {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 999px;
    border: 1.5px solid var(--border-color); background: var(--card-bg);
    cursor: pointer; font-size: 12.5px; color: var(--content-muted);
  }
  .dark-mode-option.selected { border-color: var(--accent); background: var(--content-bg); color: var(--content-text); font-weight: 600; }

  /* 汎用トグルボタンの選択状態（Drive表示形式・カレンダー表示形式などで共用） */
  button.toggle-btn.active,
  button.icon-only.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  button.toggle-btn.active .icon,
  button.icon-only.active .icon { color: #ffffff; }

  /* ===== Drive: ピン留めフォルダ・表示形式(リスト/グリッド)・種類フィルタ ===== */
  .pinned-folder-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .pinned-folder-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 6px 5px 12px; border-radius: 999px;
    border: 1.5px solid var(--border-color); background: var(--card-bg);
    font-size: 12px; cursor: pointer; color: var(--content-text);
  }
  .pinned-folder-chip:hover { background: var(--content-bg); }
  .pinned-folder-chip .btn-unpin {
    width: 18px; height: 18px; padding: 0; border: none; background: transparent;
    color: var(--content-faint); border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .pinned-folder-chip .btn-unpin:hover { background: var(--border-soft); color: var(--danger); }

  .drive-row .thumb { width: 18px; height: 18px; object-fit: cover; border-radius: 3px; flex: 0 0 auto; }
  .drive-row .btn-drive-pin.is-pinned, .drive-grid-item .btn-drive-pin.is-pinned { color: var(--accent); }

  .drive-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .drive-grid-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 8px; border: 1px solid var(--border-color); border-radius: 10px;
    background: var(--card-bg); text-align: center; position: relative;
  }
  .drive-grid-item .thumb { width: 64px; height: 64px; border-radius: 6px; object-fit: cover; }
  .drive-grid-item .name { font-size: 12px; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drive-grid-item .name a { color: inherit; text-decoration: none; }
  .drive-grid-item .meta { font-size: 10.5px; color: var(--content-muted); }
  .drive-grid-item .btn-drive-pin {
    position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; padding: 0;
    border-radius: 50%; justify-content: center;
  }
  .drive-grid-item .grid-actions { display: flex; flex-wrap: nowrap; gap: 3px; justify-content: center; margin-top: 2px; }
  .drive-grid-item .grid-actions button.icon-only { width: 24px; height: 24px; }
  .drive-grid-item .grid-actions button.icon-only .icon { width: 13px; height: 13px; }
