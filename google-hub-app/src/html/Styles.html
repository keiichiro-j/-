<style>
  :root {
    --panel-bg: #757575;
    --panel-text: #ffffff;
    --content-bg: #f4f4f4;
    --content-text: #1a1a1a;
    --content-muted: #666666;
    --card-bg: #ffffff;
    --border-color: #dcdcdc;
    --danger: #c62828;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--content-bg);
    color: var(--content-text);
    overflow-x: hidden;
  }

  .app-shell {
    display: flex;
    min-height: 100vh;
    align-items: stretch;
  }

  /* --- 左：コントロールパネル（テーマ色を適用する唯一の領域） --- */
  .control-panel {
    width: 220px;
    flex: 0 0 220px;
    background: var(--panel-bg);
    color: var(--panel-text);
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .control-panel .brand {
    font-size: 14px;
    font-weight: bold;
    opacity: 0.9;
    margin-bottom: 16px;
    padding: 0 8px;
    word-break: break-word;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-radius: 8px;
    cursor: pointer;
    color: inherit;
    background: transparent;
    border: none;
    font-size: 14px;
    text-align: left;
    width: 100%;
  }

  .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }

  .nav-item:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .nav-item.active {
    background: rgba(255, 255, 255, 0.28);
    font-weight: bold;
  }

  .control-panel[data-text="dark"] .nav-item:hover { background: rgba(0, 0, 0, 0.1); }
  .control-panel[data-text="dark"] .nav-item.active { background: rgba(0, 0, 0, 0.18); }

  /* --- 右：メインコンテンツ（中立色固定） --- */
  .main-content {
    flex: 1 1 auto;
    padding: 24px;
    overflow-y: auto;
    overflow-x: hidden;
    max-width: 100%;
  }

  .card-stack {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 900px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 16px 18px;
  }

  .card h2 {
    margin: 0 0 12px 0;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .card .card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .card .card-actions button {
    margin-left: 0;
  }

  button {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: #fff;
    color: var(--content-text);
    cursor: pointer;
  }

  button.primary {
    background: #333333;
    border-color: #333333;
    color: #ffffff;
  }

  button.danger {
    color: var(--danger);
    border-color: var(--danger);
  }

  input[type="text"], input[type="datetime-local"], input[type="date"], input[type="number"], select, textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    width: 100%;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--content-muted);
    margin-bottom: 4px;
    margin-top: 10px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border-color); }
  th { color: var(--content-muted); font-weight: normal; }

  .mini-calendar { width: 100%; }
  .mini-calendar table { table-layout: fixed; }
  .mini-calendar th { text-align: center; }
  .mini-calendar td {
    text-align: center;
    vertical-align: top;
    height: 46px;
    border: 1px solid var(--border-color);
    font-size: 12px;
    padding: 4px;
    position: relative;
  }
  .mini-calendar td .day-num { font-size: 11px; color: var(--content-muted); }
  .mini-calendar td.has-event { background: #eef2ff; }
  .mini-calendar td .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #3949AB;
    display: inline-block; margin-top: 2px;
  }
  .mini-calendar td.empty { background: #fafafa; color: #ccc; }

  .mail-row, .link-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
    gap: 8px;
  }
  .mail-row:last-child, .link-row:last-child { border-bottom: none; }
  .mail-row .subject { font-weight: bold; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row.unread .subject { color: #1a237e; }
  .mail-row .from { color: var(--content-muted); font-size: 12px; width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row .date { color: var(--content-muted); font-size: 12px; width: 90px; text-align: right; }

  .link-row .name { font-weight: bold; }
  .link-row .desc { color: var(--content-muted); font-size: 12px; }
  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    color: #fff;
  }
  .status-badge.ok { background: #2e7d32; }
  .status-badge.error { background: #c62828; }
  .status-badge.unknown { background: #9e9e9e; }

  .drive-list { display: flex; flex-direction: column; gap: 6px; }
  .drive-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
  }
  .drive-row img { width: 18px; height: 18px; }
  .drive-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drive-row .meta { color: var(--content-muted); font-size: 12px; width: 140px; text-align: right; }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .toolbar input[type="text"] { flex: 1; min-width: 120px; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal-box {
    background: #fff; border-radius: 10px; padding: 20px; width: 360px; max-width: 90vw;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-box h3 { margin-top: 0; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .empty-hint { color: var(--content-muted); font-size: 13px; padding: 8px 0; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; }
  .checkbox-row label { margin: 0; }

  .settings-section { margin-bottom: 20px; }
  .settings-section h3 { font-size: 14px; margin-bottom: 8px; }

  @media (max-width: 720px) {
    .app-shell { flex-direction: column; }
    .control-panel { width: 100%; flex: 0 0 auto; flex-direction: row; overflow-x: auto; }
    .control-panel .brand { display: none; }
    .nav-item { flex: 0 0 auto; white-space: nowrap; }
    .main-content { padding: 14px; }
  }
</style>
