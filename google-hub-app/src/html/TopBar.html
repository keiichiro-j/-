<!-- 全幅ヘッダー: ロゴ / 横断検索 / 通知・メール・アバター。中立色固定でテーマ色の影響を受けない -->
<header class="topbar">
  <div class="topbar-brand">
    <svg class="icon"><use href="#icon-compass"></use></svg>
    <span>Google Hub</span>
  </div>

  <div class="topbar-search">
    <svg class="icon"><use href="#icon-search"></use></svg>
    <input type="text" id="global-search" placeholder="アプリ・ファイルを検索">
    <div class="search-results" id="search-results" hidden></div>
  </div>

  <div class="topbar-actions">
    <span class="avatar-badge" id="avatar-badge" title="">-</span>
  </div>
</header>
