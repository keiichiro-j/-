<!-- 全幅ヘッダー: ロゴ / 横断検索 / 通知・メール・アバター。中立色固定でテーマ色の影響を受けない -->
<header class="topbar">
  <div class="topbar-brand">
    <svg class="icon"><use href="#icon-compass"></use></svg>
    <span>Google Hub</span>
  </div>

  <div class="topbar-search">
    <svg class="icon"><use href="#icon-search"></use></svg>
    <input type="text" id="global-search" placeholder="アプリ・ファイルを検索">
    <div class="search-results" id="search-results" hidden></div>
  </div>

  <div class="topbar-actions">
    <button type="button" class="icon-btn" id="btn-notif" aria-label="お知らせ">
      <svg class="icon"><use href="#icon-bell"></use></svg>
      <span class="badge-dot" id="notif-badge" hidden></span>
    </button>
    <div class="dropdown-panel" id="notif-panel" hidden>
      <h4>お知らせ</h4>
      <div class="dropdown-list" id="notif-list"></div>
    </div>

    <button type="button" class="icon-btn" id="btn-mail-shortcut" aria-label="メール">
      <svg class="icon"><use href="#icon-mail"></use></svg>
      <span class="badge-dot" id="mail-badge" hidden></span>
    </button>

    <span class="avatar-badge" id="avatar-badge" title="">-</span>
  </div>
</header>
