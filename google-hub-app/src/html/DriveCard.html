<section class="card" id="card-drive">
  <h2>
    <span>Drive</span>
    <span class="card-actions">
      <button type="button" id="btn-drive-up">上の階層へ</button>
      <button type="button" id="btn-drive-refresh">更新</button>
    </span>
  </h2>

  <div class="toolbar">
    <input type="text" id="drive-search" placeholder="ファイル名で検索...">
    <button type="button" id="btn-drive-search">検索</button>
    <select id="drive-sort">
      <option value="updated">更新日時</option>
      <option value="name">名前</option>
      <option value="size">サイズ</option>
    </select>
    <select id="drive-order">
      <option value="desc">降順</option>
      <option value="asc">昇順</option>
    </select>
  </div>

  <div class="drive-list" id="drive-list">
    <div class="empty-hint">読み込み中...</div>
  </div>
</section>

<div class="modal-backdrop" id="drive-preview-modal" hidden>
  <div class="modal-box" style="width: 640px;">
    <h3>プレビュー</h3>
    <iframe id="drive-preview-frame" style="width:100%; height:380px; border:1px solid #ddd;"></iframe>
    <div class="modal-footer">
      <button type="button" id="btn-drive-preview-close">閉じる</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="drive-share-modal" hidden>
  <div class="modal-box">
    <h3>共有設定を変更</h3>
    <input type="hidden" id="drive-share-file-id">

    <label for="drive-share-access">公開範囲</label>
    <select id="drive-share-access">
      <option value="PRIVATE">限定公開（PRIVATE）</option>
      <option value="DOMAIN_WITH_LINK">ドメイン内（リンクを知っている人）</option>
      <option value="DOMAIN">ドメイン内（全員）</option>
      <option value="ANYONE_WITH_LINK">リンクを知っている全員</option>
      <option value="ANYONE">ウェブ上の全員</option>
    </select>

    <label for="drive-share-permission">権限</label>
    <select id="drive-share-permission">
      <option value="VIEW">閲覧のみ</option>
      <option value="COMMENT">コメント可</option>
      <option value="EDIT">編集可</option>
    </select>

    <div class="modal-footer">
      <button type="button" id="btn-drive-share-cancel">キャンセル</button>
      <button type="button" id="btn-drive-share-save" class="primary">適用</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="drive-move-modal" hidden>
  <div class="modal-box">
    <h3>フォルダを移動</h3>
    <input type="hidden" id="drive-move-file-id">
    <label for="drive-move-dest">移動先フォルダID</label>
    <input type="text" id="drive-move-dest" placeholder="フォルダのURLに含まれるID">
    <div class="modal-footer">
      <button type="button" id="btn-drive-move-cancel">キャンセル</button>
      <button type="button" id="btn-drive-move-save" class="primary">移動</button>
    </div>
  </div>
</div>
