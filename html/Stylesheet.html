<style>
  :root {
    --color-bg: #f4f5f7;
    --color-surface: #ffffff;
    --color-border: #dfe3e8;
    --color-primary: #1a56db;
    --color-primary-dark: #123f9e;
    --color-text: #1f2937;
    --color-text-muted: #6b7280;
    --color-danger: #dc2626;
    --color-warn: #b45309;
    --color-warn-bg: #fef3c7;
    --color-success: #059669;
    --color-success-bg: #d1fae5;
    --radius: 6px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
    --shadow-md: 0 8px 24px rgba(15,23,42,0.18);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--color-text);
    background: var(--color-bg);
    font-size: 13px;
  }
  .hidden { display: none !important; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ===== Topbar ===== */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
    color: #fff;
    flex-wrap: wrap;
    box-shadow: var(--shadow-sm);
    position: relative;
    z-index: 5;
  }
  .topbar__brand { font-weight: 700; font-size: 15px; white-space: nowrap; letter-spacing: 0.02em; }
  .topbar__scope { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .topbar__scope button {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    border-radius: var(--radius);
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.15s ease;
  }
  .topbar__scope button:hover { background: rgba(255,255,255,0.22); }
  .topbar__scope button.is-active { background: #fff; color: var(--color-primary); font-weight: 700; }
  .topbar__actions { display: flex; align-items: center; gap: 8px; }

  /* ===== Toolbar ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    flex-wrap: wrap;
    box-shadow: var(--shadow-sm);
    position: relative;
    z-index: 4;
  }
  .toolbar__tabs { display: flex; gap: 4px; margin-right: 8px; }
  .toolbar__tabs button {
    border: 1px solid var(--color-border);
    background: #f0f2f5;
    border-radius: var(--radius);
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .toolbar__tabs button:hover { background: #e4e8ee; }
  .toolbar__tabs button.is-active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

  .input {
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 5px 8px;
    font-size: 12px;
    background: #fff;
  }
  .input--search { min-width: 220px; flex: 1; }

  .btn {
    border: 1px solid var(--color-border);
    background: #fff;
    border-radius: var(--radius);
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.05s ease;
  }
  .btn:hover { background: #f0f2f5; }
  .btn:active { transform: translateY(1px); }
  .btn--primary { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
  .btn--primary:hover { background: var(--color-primary-dark); }
  .btn--danger { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }
  .btn--icon { padding: 4px 8px; font-size: 16px; line-height: 1; }
  .btn--sm { padding: 3px 8px; font-size: 11px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== Dashboard ===== */
  .dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
    padding: 10px 14px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
  }
  .dashboard__tile {
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 8px 10px;
    background: #fafbfc;
    box-shadow: var(--shadow-sm);
  }
  .dashboard__tile .num { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .dashboard__tile .label { font-size: 11px; color: var(--color-text-muted); }
  .dashboard__tile.is-warn { background: var(--color-warn-bg); border-color: #fde68a; }
  .dashboard__tile.is-warn .num { color: var(--color-warn); }

  /* ===== Table ===== */
  .listWrap { flex: 1; overflow: auto; padding: 4px 8px; }
  .vehicleTable { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; box-shadow: var(--shadow-sm); border-radius: var(--radius); overflow: hidden; }
  .vehicleTable thead th {
    position: sticky; top: 0;
    background: #eef1f5;
    border-bottom: 2px solid var(--color-border);
    text-align: left;
    padding: 8px 10px;
    white-space: nowrap;
    z-index: 1;
    font-weight: 700;
    color: #334155;
  }
  .vehicleTable tbody td {
    padding: 6px 10px;
    border-bottom: 1px solid #eef0f2;
    white-space: nowrap;
  }
  .vehicleTable tbody tr { cursor: pointer; transition: background 0.1s ease; }
  .vehicleTable tbody tr:nth-child(even) td { background: #fafbfc; }
  .vehicleTable tbody tr:hover td { background: #eef4ff; }
  .vehicleTable tbody tr.is-expiring td { background: var(--color-warn-bg); }
  .vehicleTable tbody tr.is-expiring:hover td { background: #fde9ae; }
  .vehicleTable tbody tr.row-flash td { animation: rowFlash 1.6s ease; }
  @keyframes rowFlash {
    0% { background: #fef08a; }
    100% { background: transparent; }
  }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; background: #e5e7eb; color: #374151; }
  .badge--status-0 { background: #e5e7eb; color: #374151; }  /* 書類待ち */
  .badge--status-1 { background: #dbeafe; color: #1d4ed8; }  /* 車庫証明申請中 */
  .badge--status-2 { background: #ede9fe; color: #6d28d9; }  /* 名義変更中 */
  .badge--status-3 { background: #cffafe; color: #0e7490; }  /* 名義変更済み */
  .badge--status-4 { background: #fee2e2; color: #b91c1c; }  /* 抹消登録済み */
  .badge--status-5 { background: var(--color-warn-bg); color: var(--color-warn); } /* 保留 */
  .badge--status-6 { background: var(--color-success-bg); color: #065f46; } /* 販売済み */
  .badge--sold { background: var(--color-success-bg); color: #065f46; }

  .emptyState { text-align: center; padding: 40px; color: var(--color-text-muted); }

  /* ===== Modal ===== */
  .modal {
    position: fixed; inset: 0; background: rgba(15,23,42,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; padding: 12px;
    animation: modalFadeIn 0.15s ease;
  }
  @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal__panel {
    background: #fff; border-radius: 10px; width: 100%; max-width: 480px;
    max-height: 92vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .modal__panel--wide { max-width: 820px; }
  .modal__panel--sm { max-width: 380px; }
  .modal__header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--color-border);
  }
  .modal__header h2 { font-size: 15px; margin: 0; font-weight: 700; }
  .modal__body { padding: 14px 16px; overflow-y: auto; flex: 1; }
  .modal__footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-top: 1px solid var(--color-border); gap: 8px; flex-wrap: wrap;
    background: #fafbfc;
  }
  .modal__footerRight { display: flex; gap: 8px; margin-left: auto; }
  .statusActions { display: flex; gap: 6px; flex-wrap: wrap; }
  .statusActions .btn--sm.is-sold { border-color: var(--color-success); color: var(--color-success); font-weight: 700; }

  .formGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 12px; }
  .formField { display: flex; flex-direction: column; gap: 3px; }
  .formField label { font-size: 11px; color: var(--color-text-muted); font-weight: 600; }
  .formField input, .formField select {
    border: 1px solid var(--color-border); border-radius: var(--radius); padding: 7px 8px; font-size: 13px;
    transition: border-color 0.15s ease;
  }
  .formField input:focus, .formField select:focus {
    outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(26,86,219,0.12);
  }
  .formField.formField--required label::after { content: ' *'; color: var(--color-danger); }
  .errorBox { background: #fef2f2; border: 1px solid #fecaca; color: var(--color-danger);
    border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; font-size: 12px; white-space: pre-line;
    line-height: 1.6; }
  .successBox { background: var(--color-success-bg); border: 1px solid #a7f3d0; color: #065f46;
    border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; font-size: 12px; }

  .wizard__steps { display: flex; gap: 4px; padding: 10px 16px 0; }
  .wizard__step { font-size: 11px; padding: 5px 12px; border-radius: 12px; background: #eef1f5; color: var(--color-text-muted); font-weight: 600; }
  .wizard__step.is-active { background: var(--color-primary); color: #fff; }
  .dropzone {
    border: 2px dashed var(--color-border); border-radius: var(--radius);
    padding: 24px; text-align: center; color: var(--color-text-muted); cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone:hover { border-color: var(--color-primary); color: var(--color-primary); background: #f5f8ff; }
  .dropzone.is-busy { border-color: var(--color-primary); background: #f5f8ff; cursor: wait; }

  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid #c7d2fe;
    border-top-color: var(--color-primary); border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ocrSummary {
    margin-top: 10px; padding: 10px 12px; background: #f5f8ff; border: 1px solid #c7d2fe;
    border-radius: var(--radius); font-size: 12px;
  }
  .ocrSummary__title { font-weight: 700; color: var(--color-primary); margin-bottom: 6px; }
  .ocrSummary__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 12px; }
  .ocrSummary__item span { color: var(--color-text-muted); margin-right: 4px; }
  .ocrSummary__empty { color: var(--color-warn); }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 12px; z-index: 100;
    white-space: pre-line; max-width: min(90vw, 420px); text-align: left; line-height: 1.6;
    box-shadow: var(--shadow-md);
  }
  .toast.is-error { background: var(--color-danger); }
  .toast.is-success { background: var(--color-success); }

  /* ===== Responsive: tablet/phone ===== */
  @media (max-width: 860px) {
    body { font-size: 14px; }
    .topbar { flex-direction: column; align-items: stretch; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .input--search { min-width: 0; }
    .vehicleTable thead { display: none; }
    .vehicleTable, .vehicleTable tbody, .vehicleTable tbody tr, .vehicleTable tbody td { display: block; width: 100%; }
    .vehicleTable tbody tr { border: 1px solid var(--color-border); border-radius: 8px; margin: 8px 4px; padding: 6px; box-shadow: var(--shadow-sm); }
    .vehicleTable tbody tr td { background: transparent !important; }
    .vehicleTable tbody td {
      white-space: normal; border-bottom: none; padding: 4px 6px;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .vehicleTable tbody td::before { content: attr(data-label); color: var(--color-text-muted); font-size: 11px; }
    .formGrid { grid-template-columns: 1fr; }
  }
</style>
