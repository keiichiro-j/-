<style>
  :root {
    --color-bg: #f7f7f8;
    --color-surface: #ffffff;
    --color-surface-muted: #fafafa;
    --color-border: #e5e7eb;
    --color-primary: #111827;
    --color-primary-hover: #000000;
    --color-text: #111827;
    --color-text-muted: #8a8f98;
    --color-danger: #dc2626;
    --color-danger-bg: #fef2f2;
    --color-warn: #b45309;
    --color-warn-bg: #fef3c7;
    --color-success: #16a34a;
    --color-success-bg: #dcfce7;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
    --shadow-md: 0 12px 32px rgba(15,23,42,0.14);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--color-text);
    background: var(--color-bg);
    font-size: 13px;
  }
  .hidden { display: none !important; }

  .app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ===== 起動画面（ローディング画面） ===== */
  .loadingScreen {
    position: fixed; inset: 0; background: #ffffff; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }
  .loadingScreen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loadingScreen__inner { display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .loadingScreen__logo { max-height: 90px; max-width: min(70vw, 340px); object-fit: contain; }
  .loadingScreen__logoPlaceholder {
    border: 2px solid var(--color-primary); background: #fef9c3; color: var(--color-primary);
    font-weight: 800; font-size: 26px; letter-spacing: 0.04em; padding: 14px 30px;
  }
  .loadingScreen__text {
    font-family: var(--font-mono); letter-spacing: 0.3em; font-size: 12px; font-weight: 700; color: var(--color-text-muted);
  }
  .spinner--lg { width: 34px; height: 34px; border-width: 3px; margin-right: 0; }

  /* ===== ページヘッダー（アイキャッチラベル＋タイトル＋下線＋サブタイトル） ===== */
  .pageHeader {
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: 22px 24px 18px;
  }
  .pageHeader__row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--color-text-muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .pageHeader__titleRow { display: flex; align-items: center; gap: 12px; }
  .pageHeader__logo { height: 26px; width: auto; object-fit: contain; }
  .pageHeader__title { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .pageHeader__rule { width: 44px; height: 3px; background: var(--color-primary); margin: 10px 0 10px; border-radius: 2px; }
  .pageHeader__subtitle { font-size: 12.5px; color: var(--color-text-muted); margin: 0; }

  /* ===== ステータスバー（ライブ表示・本日の件数・クイック操作） ===== */
  .statusBar {
    margin: 16px 24px 0;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-surface);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .statusBar__left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--color-text-muted); font-size: 12px; }
  .statusBar__left strong { color: var(--color-text); }
  .statusBar__dot { color: var(--color-border); }
  .statusBar__clock { font-family: var(--font-mono); font-weight: 600; color: var(--color-text); letter-spacing: 0.02em; }
  .liveDot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--color-success); box-shadow: 0 0 0 0 rgba(22,163,74,0.5);
    animation: livePulse 1.8s ease-in-out infinite;
  }
  @keyframes livePulse {
    0% { box-shadow: 0 0 0 0 rgba(22,163,74,0.45); }
    70% { box-shadow: 0 0 0 6px rgba(22,163,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); }
  }
  .statusBar__right { display: flex; align-items: center; gap: 8px; }
  .kbdHint {
    font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted);
    background: var(--color-surface-muted); border: 1px solid var(--color-border);
    border-radius: 4px; padding: 1px 5px; margin-left: 6px;
  }

  /* ===== メインナビ（在庫一覧／設定） ===== */
  .mainNav {
    display: flex; align-items: center; gap: 4px;
    margin: 16px 24px 0;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--color-border);
  }
  .mainNav__tab {
    border: none; background: transparent; cursor: pointer;
    font-size: 13px; font-weight: 700; color: var(--color-text-muted);
    padding: 7px 16px; border-radius: 999px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .mainNav__tab:hover { color: var(--color-text); }
  .mainNav__tab.is-active { background: var(--color-primary); color: #fff; }

  .viewBody { padding: 0 24px 24px; flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ===== 拠点タブ（会社別＋横断） ===== */
  .topbar__scope { display: flex; gap: 6px; flex-wrap: wrap; padding: 14px 0 0; }
  .topbar__scope button {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    color: var(--color-text);
    border-radius: 999px;
    padding: 5px 14px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .topbar__scope button:hover { border-color: var(--color-primary); }
  .topbar__scope button.is-active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

  /* ===== ツールバー（区分タブ・検索・フィルタ・出力） ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px 0;
    flex-wrap: wrap;
  }
  .toolbar__tabs { display: flex; gap: 4px; margin-right: 8px; }
  .toolbar__tabs button {
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    border-radius: var(--radius-sm);
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .toolbar__tabs button:hover { background: var(--color-surface-muted); }
  .toolbar__tabs button.is-active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

  .input {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    font-size: 12px;
    background: #fff;
  }
  .input--search { min-width: 220px; flex: 1; }

  .btn {
    border: 1px solid var(--color-border);
    background: #fff;
    border-radius: var(--radius-sm);
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.05s ease, border-color 0.15s ease;
  }
  .btn:hover { background: var(--color-surface-muted); }
  .btn:active { transform: translateY(1px); }
  .btn--primary { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
  .btn--primary:hover { background: var(--color-primary-hover); }
  .btn--danger { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }
  .btn--icon { padding: 5px 9px; font-size: 16px; line-height: 1; }
  .btn--sm { padding: 4px 10px; font-size: 11px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== Dashboard ===== */
  .dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
    padding: 0 0 12px;
  }
  .dashboard__tile {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    background: var(--color-surface);
  }
  .dashboard__tile .num { font-size: 22px; font-weight: 800; line-height: 1.2; }
  .dashboard__tile .label { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }
  .dashboard__tile.is-warn { background: var(--color-warn-bg); border-color: #fde68a; }
  .dashboard__tile.is-warn .num { color: var(--color-warn); }

  /* ===== Table ===== */
  .listWrap { flex: 1; overflow: auto; }
  .vehicleTable { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
  .vehicleTable thead th {
    position: sticky; top: 0;
    background: var(--color-surface-muted);
    border-bottom: 1px solid var(--color-border);
    text-align: left;
    padding: 9px 10px;
    white-space: nowrap;
    z-index: 1;
    font-weight: 700;
    color: var(--color-text);
  }
  .vehicleTable tbody td {
    padding: 7px 10px;
    border-bottom: 1px solid #f1f1f2;
    white-space: nowrap;
  }
  .vehicleTable tbody tr { cursor: pointer; transition: background 0.1s ease; }
  .vehicleTable tbody tr:nth-child(even) td { background: var(--color-surface-muted); }
  .vehicleTable tbody tr:hover td { background: #f0f0f2; }
  .vehicleTable tbody tr.is-expiring td { background: var(--color-warn-bg); }
  .vehicleTable tbody tr.is-expiring:hover td { background: #fde9ae; }
  .vehicleTable tbody tr.row-flash td { animation: rowFlash 1.6s ease; }
  @keyframes rowFlash {
    0% { background: #fef08a; }
    100% { background: transparent; }
  }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; background: #eceef1; color: #374151; }
  .badge--status-0 { background: #eceef1; color: #374151; }  /* 書類待ち */
  .badge--status-1 { background: #dbeafe; color: #1d4ed8; }  /* 車庫証明申請中 */
  .badge--status-2 { background: #ede9fe; color: #6d28d9; }  /* 名義変更中 */
  .badge--status-3 { background: #cffafe; color: #0e7490; }  /* 名義変更済み */
  .badge--status-4 { background: #fee2e2; color: #b91c1c; }  /* 抹消登録済み */
  .badge--status-5 { background: var(--color-warn-bg); color: var(--color-warn); } /* 保留 */
  .badge--status-6 { background: var(--color-success-bg); color: #15803d; } /* 販売済み */
  .badge--sold { background: var(--color-success-bg); color: #15803d; }

  .emptyState { text-align: center; padding: 40px; color: var(--color-text-muted); }

  /* ===== Modal ===== */
  .modal {
    position: fixed; inset: 0; background: rgba(17,24,39,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; padding: 12px;
    animation: modalFadeIn 0.15s ease;
  }
  @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal__panel {
    background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 480px;
    max-height: 92vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .modal__panel--wide { max-width: 820px; }
  .modal__panel--sm { max-width: 380px; }
  .modal__header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--color-border);
  }
  .modal__header h2 { font-size: 15px; margin: 0; font-weight: 800; }
  .modal__body { padding: 16px 18px; overflow-y: auto; flex: 1; }
  .modal__footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; border-top: 1px solid var(--color-border); gap: 8px; flex-wrap: wrap;
    background: var(--color-surface-muted);
  }
  .modal__footerRight { display: flex; gap: 8px; margin-left: auto; }
  .statusActions { display: flex; gap: 6px; flex-wrap: wrap; }
  .statusActions .btn--sm.is-sold { border-color: var(--color-success); color: var(--color-success); font-weight: 700; }

  .formGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 12px; }
  .formField { display: flex; flex-direction: column; gap: 3px; }
  .formField label { font-size: 11px; color: var(--color-text-muted); font-weight: 600; }
  .formField input, .formField select, .formField textarea {
    border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px;
    font-family: var(--font);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .formField input:focus, .formField select:focus, .formField textarea:focus {
    outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(17,24,39,0.08);
  }
  .formField.formField--required label::after { content: ' *'; color: var(--color-danger); }
  .errorBox { background: var(--color-danger-bg); border: 1px solid #fecaca; color: var(--color-danger);
    border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 12px; font-size: 12px; white-space: pre-line;
    line-height: 1.6; }
  .successBox { background: var(--color-success-bg); border: 1px solid #a7f3d0; color: #15803d;
    border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 12px; font-size: 12px; }

  .wizard__steps { display: flex; gap: 4px; padding: 12px 18px 0; flex-wrap: wrap; }
  .wizard__step { font-size: 11px; padding: 6px 13px; border-radius: 999px; background: var(--color-surface-muted); color: var(--color-text-muted); font-weight: 700; }
  .wizard__step.is-active { background: var(--color-primary); color: #fff; }
  .dropzone {
    border: 2px dashed var(--color-border); border-radius: var(--radius-md);
    padding: 24px; text-align: center; color: var(--color-text-muted); cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone:hover { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-surface-muted); }
  .dropzone.is-busy { border-color: var(--color-primary); background: var(--color-surface-muted); cursor: wait; }

  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid #d1d5db;
    border-top-color: var(--color-primary); border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ocrSummary {
    margin-top: 10px; padding: 10px 12px; background: var(--color-surface-muted); border: 1px solid var(--color-border);
    border-radius: var(--radius-sm); font-size: 12px;
  }
  .ocrSummary__title { font-weight: 700; color: var(--color-primary); margin-bottom: 6px; }
  .ocrSummary__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 12px; }
  .ocrSummary__item span { color: var(--color-text-muted); margin-right: 4px; }
  .ocrSummary__empty { color: var(--color-warn); }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 10px 18px; border-radius: var(--radius-md); font-size: 12px; z-index: 100;
    white-space: pre-line; max-width: min(90vw, 420px); text-align: left; line-height: 1.6;
    box-shadow: var(--shadow-md);
  }
  .toast.is-error { background: var(--color-danger); }
  .toast.is-success { background: #15803d; }

  /* ===== 設定画面（同サイズカードの横スクロール） ===== */
  .settingsGrid {
    display: flex;
    gap: 16px;
    padding: 16px 4px 20px;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    scroll-padding-left: 4px;
  }
  .settingsCard {
    flex: 0 0 360px;
    width: 360px;
    height: 480px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    scroll-snap-align: start;
  }
  .settingsCard__title { font-size: 14px; font-weight: 800; margin: 0 0 8px; }
  .settingsCard__rule { width: 28px; height: 2px; background: var(--color-primary); margin-bottom: 10px; border-radius: 1px; flex-shrink: 0; }
  .settingsCard__desc { font-size: 12px; color: var(--color-text-muted); line-height: 1.7; margin: 0 0 14px; flex-shrink: 0; }
  .settingsCard__body { flex: 1; overflow-y: auto; min-height: 0; }
  .settingsCard__footer { margin-top: 14px; flex-shrink: 0; }
  .settingsFieldList { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .settingsFieldList--grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .settingsLabelRow { display: flex; align-items: center; gap: 8px; }
  .settingsLabelRow .label { font-size: 11px; color: var(--color-text-muted); font-weight: 700; min-width: 64px; }
  .settingsPreview {
    margin-top: 10px; padding: 10px 12px; background: var(--color-surface-muted); border: 1px solid var(--color-border);
    border-radius: var(--radius-sm); min-height: 32px; display: flex; align-items: center;
  }
  .settingsPreview img { max-height: 30px; max-width: 100%; object-fit: contain; }
  .companyCard { border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; background: var(--color-surface-muted); }
  .companyCard__title { font-weight: 700; font-size: 12px; margin-bottom: 8px; }
  .tagList { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tagChip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--color-surface-muted);
    border: 1px solid var(--color-border); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 600;
  }
  .tagChip button { border: none; background: none; cursor: pointer; color: var(--color-text-muted); font-size: 12px; line-height: 1; padding: 0; }
  .tagChip button:hover { color: var(--color-danger); }

  .toggle { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle__track {
    width: 40px; height: 22px; background: #e5e7eb; border-radius: 999px; position: relative;
    transition: background 0.15s ease; flex-shrink: 0;
  }
  .toggle__track::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: transform 0.15s ease;
  }
  .toggle input:checked + .toggle__track { background: var(--color-primary); }
  .toggle input:checked + .toggle__track::after { transform: translateX(18px); }
  .toggle__label { font-size: 12px; font-weight: 600; color: var(--color-text-muted); }

  /* ===== Responsive: tablet/phone ===== */
  @media (max-width: 860px) {
    body { font-size: 14px; }
    .pageHeader { padding: 18px 16px 14px; }
    .statusBar { margin: 12px 16px 0; flex-direction: column; align-items: stretch; }
    .mainNav { margin: 12px 16px 0; }
    .viewBody { padding: 0 16px 16px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .input--search { min-width: 0; }
    .vehicleTable thead { display: none; }
    .vehicleTable, .vehicleTable tbody, .vehicleTable tbody tr, .vehicleTable tbody td { display: block; width: 100%; }
    .vehicleTable tbody tr { border: 1px solid var(--color-border); border-radius: 8px; margin: 8px 4px; padding: 6px; box-shadow: var(--shadow-sm); }
    .vehicleTable tbody tr td { background: transparent !important; }
    .vehicleTable tbody td {
      white-space: normal; border-bottom: none; padding: 4px 6px;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .vehicleTable tbody td::before { content: attr(data-label); color: var(--color-text-muted); font-size: 11px; }
    .formGrid { grid-template-columns: 1fr; }
    .settingsCard { flex-basis: 88vw; width: 88vw; height: 440px; }
  }
</style>
