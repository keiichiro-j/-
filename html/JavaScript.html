<script>
(function () {
  'use strict';

  // ===== google.script.run を Promise化する薄いラッパー =====
  function gsRun(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); })
        [fnName].apply(null, args);
    });
  }

  var VIEW_TABS = ['すべて(在庫)', '輸入車', '国産車', '販売済'];

  // ===== 3社統合ビュー（AU/C7/MB 実運用スプレッドシート横断）用の定数 =====
  var INTEGRATED_VIEW_TABS = ['すべて', '輸入車マスタ', '国産車マスタ', '販売済み'];
  var INTEGRATED_FILE_KEYS = ['AU', 'C7', 'MB'];
  var INTEGRATED_LIST_COLUMNS = ['fileKey', 'sheet', 'ocn', 'make', 'model', 'vin', 'expiry', 'type', 'supplier', 'status'];
  var INTEGRATED_LIST_LABELS = {
    fileKey: '拠点', sheet: '区分', ocn: 'OCN', make: 'メーカー', model: 'モデル',
    vin: '車台番号', expiry: '車検満了日', type: '仕入区分', supplier: '仕入先', status: 'ステータス'
  };
  var INTEGRATED_FIELDS = [
    { key: 'make', label: 'メーカー', required: true },
    { key: 'model', label: 'モデル', required: true },
    { key: 'vin', label: '車台番号', required: true },
    { key: 'expiry', label: '車検満了日', type: 'date' },
    { key: 'type', label: '仕入区分' },
    { key: 'supplier', label: '仕入先' },
    { key: 'status', label: 'ステータス' }
  ];

  var state = {
    boot: null,
    scope: { mode: 'single', companyId: null, tabName: null }, // tabName: 表示中のツールバータブ
    vehicles: [],
    integratedVehicles: [],
    selectedVehicle: null,
    selectedIntegrated: null,
    wizard: null,
    saleContext: null,
    flashOcn: null, // 直前に登録/更新した車両のOCN。一覧再描画時に該当行を一瞬ハイライトする
    flashFileKey: null // 3社統合ビューでのフラッシュ対象を拠点キーまで絞り込むため
  };

  // ===== 起動 =====
  document.addEventListener('DOMContentLoaded', function () {
    gsRun('api_getBootstrapData').then(function (boot) {
      state.boot = boot;
      state.scope.companyId = boot.companies[0] && boot.companies[0].id;
      state.scope.tabName = VIEW_TABS[0];
      renderScopeTabs();
      renderToolbarTabs();
      updateToolbarForMode();
      bindGlobalEvents();
      reloadList();
    }).catch(showError);
  });

  // ===== 拠点タブ（会社別 + 横断 + 3社統合ビュー） =====
  function renderScopeTabs() {
    var nav = document.getElementById('scopeTabs');
    nav.innerHTML = '';
    state.boot.companies.forEach(function (c) {
      var btn = document.createElement('button');
      btn.textContent = c.name;
      btn.className = (state.scope.mode === 'single' && state.scope.companyId === c.id) ? 'is-active' : '';
      btn.onclick = function () {
        state.scope.mode = 'single';
        state.scope.companyId = c.id;
        state.scope.tabName = VIEW_TABS[0];
        renderScopeTabs();
        renderToolbarTabs();
        updateToolbarForMode();
        reloadList();
      };
      nav.appendChild(btn);
    });
    var crossBtn = document.createElement('button');
    crossBtn.textContent = '3拠点横断';
    crossBtn.className = state.scope.mode === 'cross' ? 'is-active' : '';
    crossBtn.onclick = function () {
      state.scope.mode = 'cross';
      state.scope.tabName = VIEW_TABS[0];
      renderScopeTabs();
      renderToolbarTabs();
      updateToolbarForMode();
      reloadList();
    };
    nav.appendChild(crossBtn);

    var integratedBtn = document.createElement('button');
    integratedBtn.textContent = '3社統合ビュー（実データ）';
    integratedBtn.className = state.scope.mode === 'integrated' ? 'is-active' : '';
    integratedBtn.onclick = function () {
      state.scope.mode = 'integrated';
      state.scope.tabName = INTEGRATED_VIEW_TABS[0];
      renderScopeTabs();
      renderToolbarTabs();
      updateToolbarForMode();
      reloadList();
    };
    nav.appendChild(integratedBtn);
  }

  function renderToolbarTabs() {
    var wrap = document.getElementById('tabNames');
    wrap.innerHTML = '';
    var tabs = state.scope.mode === 'integrated' ? INTEGRATED_VIEW_TABS : VIEW_TABS;
    tabs.forEach(function (tab) {
      var btn = document.createElement('button');
      btn.textContent = tab;
      btn.className = state.scope.tabName === tab ? 'is-active' : '';
      btn.onclick = function () {
        state.scope.tabName = tab;
        renderToolbarTabs();
        if (state.scope.mode === 'integrated') {
          applyIntegratedFiltersAndRender();
        } else {
          reloadList();
        }
      };
      wrap.appendChild(btn);
    });
  }

  // 3社統合ビューでは PDF帳票出力／PDF同期は対象外（データモデルが異なるため非表示にする）
  function updateToolbarForMode() {
    var isIntegrated = state.scope.mode === 'integrated';
    document.getElementById('btnExportPdf').classList.toggle('hidden', isIntegrated);
    document.getElementById('btnSyncPdf').classList.toggle('hidden', isIntegrated);
  }

  function currentTabNames() {
    if (state.scope.tabName === 'すべて(在庫)') return state.boot.stockTabNames;
    return [state.scope.tabName];
  }

  // ===== 一覧読み込み =====
  function reloadList() {
    if (state.scope.mode === 'integrated') {
      document.getElementById('dashboard').classList.add('hidden');
      gsRun('api_listIntegratedVehicles').then(function (result) {
        if (result.errors && result.errors.length > 0) {
          showToast('一部データの取得に失敗しました（' + result.errors.map(function (e) { return e.fileKey; }).join(', ') + '）', 'error');
        }
        state.integratedVehicles = result.vehicles;
        populateIntegratedFilterOptions(result.vehicles);
        applyIntegratedFiltersAndRender();
      }).catch(showError);
      return;
    }

    var tabNames = currentTabNames();
    var promise;
    if (state.scope.mode === 'cross') {
      document.getElementById('dashboard').classList.remove('hidden');
      loadDashboard();
      promise = gsRun('api_listVehiclesAcross', tabNames);
    } else {
      document.getElementById('dashboard').classList.add('hidden');
      promise = Promise.all(tabNames.map(function (t) {
        return gsRun('api_listVehicles', state.scope.companyId, t);
      })).then(function (lists) { return [].concat.apply([], lists); });
    }
    promise.then(function (vehicles) {
      state.vehicles = vehicles;
      populateFilterOptions(vehicles);
      applyFiltersAndRender();
    }).catch(showError);
  }

  function loadDashboard() {
    gsRun('api_getDashboardSummary').then(function (summary) {
      var el = document.getElementById('dashboard');
      var html = summary.byCompany.map(function (s) {
        return '<div class="dashboard__tile"><div class="num">' + s.stockCount + '</div>' +
          '<div class="label">' + s.companyName + ' 在庫台数（輸入' + s.importedCount + ' / 国産' + s.domesticCount + '）</div></div>' +
          '<div class="dashboard__tile' + (s.expiringSoonCount > 0 ? ' is-warn' : '') + '"><div class="num">' + s.expiringSoonCount + '</div>' +
          '<div class="label">' + s.companyName + ' 車検満了間近（30日以内）</div></div>';
      }).join('');
      html += '<div class="dashboard__tile"><div class="num">' + summary.totalStock + '</div><div class="label">合計在庫台数</div></div>';
      html += '<div class="dashboard__tile' + (summary.totalExpiringSoon > 0 ? ' is-warn' : '') + '"><div class="num">' + summary.totalExpiringSoon + '</div><div class="label">合計 車検満了間近</div></div>';
      el.innerHTML = html;
    }).catch(showError);
  }

  // ===== 検索・絞り込み（10.2） =====
  function populateFilterOptions(vehicles) {
    fillSelect('filterCarType', uniqueValues(vehicles, 'carType'), '車種すべて');
    fillSelect('filterStaff', uniqueValues(vehicles, 'staff'), '担当者すべて');
    fillSelect('filterStatus', state.boot.statusOptions, 'ステータスすべて', true);
  }
  function uniqueValues(list, key) {
    var set = {};
    list.forEach(function (v) { if (v[key]) set[v[key]] = true; });
    return Object.keys(set).sort();
  }
  function fillSelect(id, values, placeholder, keepIfSet) {
    var el = document.getElementById(id);
    var current = el.value;
    el.innerHTML = '<option value="">' + placeholder + '</option>' +
      values.map(function (v) { return '<option value="' + escapeAttr(v) + '">' + escapeHtml(v) + '</option>'; }).join('');
    if (keepIfSet !== undefined || values.indexOf(current) !== -1) el.value = current;
  }

  function currentFilters() {
    return {
      keyword: document.getElementById('keywordInput').value,
      carType: document.getElementById('filterCarType').value,
      status: document.getElementById('filterStatus').value,
      staff: document.getElementById('filterStaff').value
    };
  }

  // ===== 3社統合ビュー：絞り込み・一覧描画・編集/新規登録モーダル =====
  function populateIntegratedFilterOptions(vehicles) {
    fillSelect('filterCarType', uniqueValues(vehicles, 'make'), 'メーカーすべて');
    fillSelect('filterStaff', INTEGRATED_FILE_KEYS, '拠点すべて');
    fillSelect('filterStatus', uniqueValues(vehicles, 'status'), 'ステータスすべて', true);
  }

  function applyIntegratedFiltersAndRender() {
    var kw = (document.getElementById('keywordInput').value || '').trim();
    var make = document.getElementById('filterCarType').value;
    var fileKey = document.getElementById('filterStaff').value;
    var status = document.getElementById('filterStatus').value;
    var sheetFilter = state.scope.tabName;

    var filtered = (state.integratedVehicles || []).filter(function (v) {
      if (sheetFilter && sheetFilter !== 'すべて' && v.sheet !== sheetFilter) return false;
      if (make && v.make !== make) return false;
      if (fileKey && v.fileKey !== fileKey) return false;
      if (status && v.status !== status) return false;
      if (kw) {
        var hay = [v.ocn, v.make, v.model, v.vin, v.supplier, v.fileKey].join(' ');
        if (hay.indexOf(kw) === -1) return false;
      }
      return true;
    });
    renderIntegratedTable(filtered);
  }

  function renderIntegratedTable(vehicles) {
    var head = document.getElementById('vehicleTableHead');
    head.innerHTML = '<tr>' + INTEGRATED_LIST_COLUMNS.map(function (k) {
      return '<th>' + INTEGRATED_LIST_LABELS[k] + '</th>';
    }).join('') + '</tr>';

    var body = document.getElementById('vehicleTableBody');
    body.innerHTML = '';
    vehicles.forEach(function (v) {
      var tr = document.createElement('tr');
      if (state.flashOcn && String(v.ocn) === String(state.flashOcn) && v.fileKey === state.flashFileKey) {
        tr.classList.add('row-flash');
      }
      var cells = '';
      INTEGRATED_LIST_COLUMNS.forEach(function (k) {
        var val = k === 'status' ? '<span class="badge">' + escapeHtml(v[k] || '') + '</span>' : escapeHtml(v[k] || '');
        cells += '<td data-label="' + INTEGRATED_LIST_LABELS[k] + '">' + val + '</td>';
      });
      tr.innerHTML = cells;
      tr.onclick = function () { openIntegratedDetail(v); };
      body.appendChild(tr);
    });
    state.flashOcn = null;

    document.getElementById('emptyState').classList.toggle('hidden', vehicles.length > 0);
    document.getElementById('vehicleTable').classList.toggle('hidden', vehicles.length === 0);
  }

  function buildIntegratedFormGrid(v, isNew) {
    var html = '<div class="formGrid">';
    if (!isNew) {
      html += '<div class="formField"><label>OCN</label><input value="' + escapeAttr(v.ocn) + '" readonly></div>';
      html += '<div class="formField"><label>拠点</label><input value="' + escapeAttr(v.fileKey) + '" readonly></div>';
      html += '<div class="formField"><label>区分</label><input value="' + escapeAttr(v.sheet) + '" readonly></div>';
    } else {
      var fileOptions = INTEGRATED_FILE_KEYS.map(function (f) { return '<option value="' + f + '">' + f + '</option>'; }).join('');
      var sheetOptions = ['輸入車マスタ', '国産車マスタ'].map(function (s) {
        return '<option value="' + s + '">' + s + '</option>';
      }).join('');
      html += '<div class="formField formField--required"><label>拠点</label><select id="newIntegratedFileKey">' + fileOptions + '</select></div>';
      html += '<div class="formField formField--required"><label>区分</label><select id="newIntegratedSheet">' + sheetOptions + '</select></div>';
    }
    INTEGRATED_FIELDS.forEach(function (f) {
      var val = v[f.key] != null ? v[f.key] : '';
      html += '<div class="formField' + (f.required ? ' formField--required' : '') + '">';
      html += '<label>' + f.label + '</label>';
      html += '<input data-key="' + f.key + '" type="' + (f.type === 'date' ? 'date' : 'text') + '" value="' + escapeAttr(val) + '">';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function openIntegratedDetail(v) {
    state.selectedIntegrated = v;
    document.getElementById('integratedError').innerHTML = '';
    document.getElementById('integratedModalTitle').textContent = 'OCN ' + v.ocn + ' 車両詳細（3社統合ビュー）';
    document.getElementById('integratedBody').innerHTML = buildIntegratedFormGrid(v, false);
    document.getElementById('integratedModal').classList.remove('hidden');
  }

  function openIntegratedNew() {
    state.selectedIntegrated = null;
    document.getElementById('integratedError').innerHTML = '';
    document.getElementById('integratedModalTitle').textContent = '新規車両登録（3社統合ビュー）';
    document.getElementById('integratedBody').innerHTML = buildIntegratedFormGrid({}, true);
    document.getElementById('integratedModal').classList.remove('hidden');
  }

  document.getElementById('btnSaveIntegrated').addEventListener('click', function () {
    var body = document.getElementById('integratedBody');
    var patch = collectFormValues(body);
    var errBox = document.getElementById('integratedError');
    errBox.innerHTML = '';
    var payload;
    if (state.selectedIntegrated) {
      payload = Object.assign({}, state.selectedIntegrated, patch);
    } else {
      var fileKeyEl = document.getElementById('newIntegratedFileKey');
      var sheetEl = document.getElementById('newIntegratedSheet');
      payload = Object.assign({ fileKey: fileKeyEl.value, sheet: sheetEl.value }, patch);
    }
    gsRun('api_saveIntegratedVehicle', payload).then(function (res) {
      showToast('保存しました（OCN ' + res.ocn + '）', 'success');
      document.getElementById('integratedModal').classList.add('hidden');
      state.flashOcn = res.ocn;
      state.flashFileKey = payload.fileKey;
      reloadList();
    }).catch(function (err) {
      errBox.innerHTML = '<div class="errorBox">' + escapeHtml(err.message || String(err)) + '</div>';
    });
  });

  function applyFiltersAndRender() {
    if (state.scope.mode === 'integrated') {
      applyIntegratedFiltersAndRender();
      return;
    }
    // クライアント側で軽量フィルタ（サーバー側 searchVehicles と同一ロジックの簡易版）
    var f = currentFilters();
    var kw = (f.keyword || '').trim();
    var filtered = state.vehicles.filter(function (v) {
      if (f.carType && v.carType !== f.carType) return false;
      if (f.status && v.status !== f.status) return false;
      if (f.staff && v.staff !== f.staff) return false;
      if (kw) {
        var hay = [v.carType, v.model, v.chassisNumber, v.ocn, v.supplier,
          v.plateRegion, v.plateClass, v.plateKana, v.plateNumber].join(' ');
        if (hay.indexOf(kw) === -1) return false;
      }
      return true;
    });
    renderTable(filtered);
  }

  // ===== 一覧テーブル描画 =====
  var LIST_COLUMNS = ['ocn', 'carType', 'model', 'chassisNumber', 'inspectionExpiryDate', 'status', 'staff', 'plateFull'];
  var LIST_LABELS = { ocn: 'OCN', carType: '車種', model: 'モデル', chassisNumber: '車台番号', inspectionExpiryDate: '車検満了日', status: 'ステータス', staff: '担当者', plateFull: '登録番号' };

  function renderTable(vehicles) {
    var head = document.getElementById('vehicleTableHead');
    head.innerHTML = '<tr>' + (state.scope.mode === 'cross' ? '<th>拠点</th>' : '') +
      LIST_COLUMNS.map(function (k) { return '<th>' + LIST_LABELS[k] + '</th>'; }).join('') + '</tr>';

    var body = document.getElementById('vehicleTableBody');
    var today = new Date().toISOString().slice(0, 10);
    var soon = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);

    body.innerHTML = '';
    vehicles.forEach(function (v) {
      var tr = document.createElement('tr');
      var expiring = v.inspectionExpiryDate && v.inspectionExpiryDate >= today && v.inspectionExpiryDate <= soon;
      if (expiring) tr.classList.add('is-expiring');
      if (state.flashOcn && String(v.ocn) === String(state.flashOcn)) tr.classList.add('row-flash');
      var cells = '';
      if (state.scope.mode === 'cross') {
        cells += '<td data-label="拠点">' + companyName(v.companyId) + '</td>';
      }
      LIST_COLUMNS.forEach(function (k) {
        var val = k === 'plateFull' ? plateFull(v) : (v[k] || '');
        if (k === 'status') {
          val = '<span class="badge ' + statusBadgeClass(val) + '">' + escapeHtml(val) + '</span>';
        } else {
          val = escapeHtml(val);
        }
        cells += '<td data-label="' + LIST_LABELS[k] + '">' + val + '</td>';
      });
      tr.innerHTML = cells;
      tr.onclick = function () { openDetail(v); };
      body.appendChild(tr);
    });
    state.flashOcn = null; // 一度使ったらクリア

    document.getElementById('emptyState').classList.toggle('hidden', vehicles.length > 0);
    document.getElementById('vehicleTable').classList.toggle('hidden', vehicles.length === 0);
  }

  function statusBadgeClass(status) {
    var idx = state.boot.statusOptions.indexOf(status);
    return idx >= 0 ? 'badge--status-' + idx : '';
  }

  function plateFull(v) {
    return [v.plateRegion, v.plateClass, v.plateKana, v.plateNumber].filter(Boolean).join(' ');
  }
  function companyName(id) {
    var c = state.boot.companies.filter(function (x) { return x.id === id; })[0];
    return c ? c.name : id;
  }

  // ===== 詳細/編集モーダル =====
  function openDetail(vehicle) {
    state.selectedVehicle = vehicle;
    document.getElementById('detailError').innerHTML = '';
    document.getElementById('detailTitle').textContent = 'OCN ' + vehicle.ocn + ' 車両詳細';
    document.getElementById('detailBody').innerHTML = buildFormGrid(vehicle, false);
    renderStatusActions(vehicle);
    document.getElementById('detailModal').classList.remove('hidden');
  }

  function buildFormGrid(vehicle, isNew) {
    var readonlyKeys = { ocn: 1, tradeInLoss: 1, inspectionCertLink: 1, ownCertLink: 1, soldMonth: 1, soldTo: 1 };
    var html = '<div class="formGrid">';
    state.boot.columns.forEach(function (col) {
      if (isNew && (col.key === 'ocn' || col.key === 'inspectionCertLink' || col.key === 'ownCertLink' ||
        col.key === 'soldMonth' || col.key === 'soldTo' || col.key === 'tradeInLoss')) return;
      var val = vehicle[col.key] != null ? vehicle[col.key] : '';
      var readonly = readonlyKeys[col.key];
      html += '<div class="formField' + (col.required ? ' formField--required' : '') + '">';
      html += '<label>' + col.label + '</label>';
      if (col.type === 'link') {
        html += val ? '<a href="' + escapeAttr(val) + '" target="_blank">確認する</a>' : '<span>未登録</span>';
      } else if (col.type === 'select') {
        html += '<select data-key="' + col.key + '"' + (readonly ? ' disabled' : '') + '>' +
          col.options.map(function (o) { return '<option value="' + o + '"' + (o === val ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>';
      } else {
        html += '<input data-key="' + col.key + '" type="' + (col.type === 'date' ? 'date' : (col.type === 'number' ? 'number' : 'text')) +
          '" value="' + escapeAttr(val) + '"' + (readonly ? ' readonly' : '') + '>';
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function collectFormValues(container) {
    var patch = {};
    container.querySelectorAll('[data-key]').forEach(function (el) {
      patch[el.dataset.key] = el.value;
    });
    return patch;
  }

  function renderStatusActions(vehicle) {
    var wrap = document.getElementById('statusActions');
    wrap.innerHTML = '';
    if (vehicle.tabName === state.boot.tabNames.SOLD) return;
    state.boot.statusOptions.forEach(function (status) {
      if (status === vehicle.status) return;
      var isSold = status === '販売済み';
      var btn = document.createElement('button');
      btn.className = 'btn btn--sm' + (isSold ? ' is-sold' : '');
      btn.textContent = (isSold ? '💰 ' : '') + status + 'にする';
      btn.onclick = function () { handleStatusChange(vehicle, status); };
      wrap.appendChild(btn);
    });
  }

  function handleStatusChange(vehicle, newStatus) {
    if (newStatus === '販売済み') {
      openSaleModal(vehicle);
      return;
    }
    if (!confirm('ステータスを「' + newStatus + '」に変更しますか？')) return;
    applyStatusChange(vehicle, newStatus, {});
  }

  function applyStatusChange(vehicle, newStatus, extra) {
    gsRun('api_changeStatus', vehicle.companyId, vehicle.tabName, vehicle.ocn, newStatus, extra)
      .then(function (res) {
        showToast('ステータスを「' + newStatus + '」に更新しました', 'success');
        closeModals();
        state.flashOcn = vehicle.ocn;
        reloadList();
        if (res.requiresOwnCertUpload) {
          setTimeout(function () { promptOwnCertUpload(vehicle); }, 300);
        }
      }).catch(showError);
  }

  // ===== 販売確定モーダル =====
  function openSaleModal(vehicle) {
    state.saleContext = vehicle;
    document.getElementById('saleError').innerHTML = '';
    document.getElementById('saleMonth').value = new Date().toISOString().slice(0, 7);
    document.getElementById('saleTo').value = '';
    document.getElementById('saleModal').classList.remove('hidden');
    document.getElementById('saleTo').focus();
  }

  function closeSaleModal() {
    document.getElementById('saleModal').classList.add('hidden');
  }

  document.getElementById('btnConfirmSale').addEventListener('click', function () {
    var month = document.getElementById('saleMonth').value;
    var to = document.getElementById('saleTo').value.trim();
    var errBox = document.getElementById('saleError');
    errBox.innerHTML = '';
    if (!month || !to) {
      errBox.innerHTML = '<div class="errorBox">販売年月・販売先はどちらも入力してください</div>';
      return;
    }
    applyStatusChange(state.saleContext, '販売済み', { soldMonth: month, soldTo: to });
  });
  document.getElementById('btnCloseSale').addEventListener('click', closeSaleModal);
  document.getElementById('btnCancelSale').addEventListener('click', closeSaleModal);

  function promptOwnCertUpload(vehicle) {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf,image/*';
    input.onchange = function () {
      if (!input.files[0]) return;
      fileToBase64(input.files[0]).then(function (b64) {
        return gsRun('api_uploadOwnCertPdf', vehicle.companyId, vehicle.ocn, b64.data, b64.mimeType, input.files[0].name);
      }).then(function () {
        showToast('自社名義車検証を登録しました', 'success');
      }).catch(showError);
    };
    if (confirm('名義変更が完了しました。自社名義の車検証PDFをアップロードしますか？')) {
      input.click();
    }
  }

  document.getElementById('btnSaveDetail').addEventListener('click', function () {
    var patch = collectFormValues(document.getElementById('detailBody'));
    var v = state.selectedVehicle;
    var errBox = document.getElementById('detailError');
    errBox.innerHTML = '';
    gsRun('api_updateVehicle', v.companyId, v.tabName, v.ocn, patch).then(function () {
      showToast('保存しました', 'success');
      closeModals();
      state.flashOcn = v.ocn;
      reloadList();
    }).catch(function (err) {
      errBox.innerHTML = '<div class="errorBox">' + escapeHtml(err.message || String(err)) + '</div>';
    });
  });

  // ===== 新規登録ウィザード（4.5 → 4.6 → 確認） =====
  function openWizard() {
    state.wizard = {
      step: 1,
      companyId: state.scope.mode === 'single' ? state.scope.companyId : state.boot.companies[0].id,
      tabName: (state.scope.tabName && state.scope.tabName !== 'すべて(在庫)' && state.scope.tabName !== '販売済') ? state.scope.tabName : '輸入車',
      draft: {}
    };
    renderWizard();
    document.getElementById('registerModal').classList.remove('hidden');
  }

  function renderWizard() {
    document.querySelectorAll('.wizard__step').forEach(function (el) {
      el.classList.toggle('is-active', Number(el.dataset.step) === state.wizard.step);
    });
    document.getElementById('btnWizardBack').classList.toggle('hidden', state.wizard.step === 1);
    document.getElementById('btnWizardNext').textContent = state.wizard.step === 3 ? '登録する' : '次へ';

    var body = document.getElementById('registerBody');
    if (state.wizard.step === 1) {
      body.innerHTML = wizardTargetSelectHtml() +
        '<p>査定書PDFをアップロードすると、車種・モデル・車台番号・査定額等を自動読み取りします（任意・スキップ可）。</p>' +
        '<div class="dropzone" id="dz1">📄 クリックしてPDFを選択</div>' +
        '<div id="dz1status"></div>';
      bindDropzone('dz1', function (b64, file) {
        var dz = document.getElementById('dz1');
        var statusEl = document.getElementById('dz1status');
        dz.classList.add('is-busy');
        statusEl.innerHTML = '<span class="spinner"></span>読み取り中: ' + escapeHtml(file.name);
        gsRun('api_uploadAppraisalPdf', state.wizard.companyId, b64.data, b64.mimeType, file.name).then(function (draft) {
          Object.assign(state.wizard.draft, draft);
          dz.classList.remove('is-busy');
          statusEl.innerHTML = '✅ 読み取り完了: ' + escapeHtml(file.name);
          renderOcrSummary(statusEl, [
            { label: '車種', value: draft.carType },
            { label: 'モデル', value: draft.model },
            { label: '車台番号', value: draft.chassisNumber },
            { label: '初年度登録', value: draft.firstRegistrationDate },
            { label: 'カラー', value: draft.color },
            { label: '走行距離', value: draft.mileage },
            { label: '査定額', value: draft.appraisalAmount },
            { label: '買取金額', value: draft.purchaseAmount },
            { label: 'リサイクル金額', value: draft.recycleFee }
          ]);
        }).catch(function (err) {
          dz.classList.remove('is-busy');
          statusEl.innerHTML = '<div class="errorBox">読み取りに失敗しました: ' + escapeHtml(err.message || String(err)) +
            '<br>もう一度アップロードするか、次の画面に進んで手入力してください。</div>';
        });
      });
    } else if (state.wizard.step === 2) {
      body.innerHTML = '<p>購入時（前所有者名義）の車検証PDFをアップロードすると、仕入先（顧客名）・住所を自動反映します（任意・スキップ可）。</p>' +
        '<div class="dropzone" id="dz2">📄 クリックしてPDFを選択</div>' +
        '<div id="dz2status"></div>';
      bindDropzone('dz2', function (b64, file) {
        var dz = document.getElementById('dz2');
        var statusEl = document.getElementById('dz2status');
        dz.classList.add('is-busy');
        statusEl.innerHTML = '<span class="spinner"></span>読み取り中: ' + escapeHtml(file.name);
        gsRun('api_uploadInspectionCertPdf', state.wizard.companyId, b64.data, b64.mimeType, file.name).then(function (draft) {
          state.wizard.draft.inspectionTempFileId = draft.tempFileId;
          if (draft.supplier) state.wizard.draft.supplier = draft.supplier;
          if (draft.address) state.wizard.draft.address = draft.address;
          dz.classList.remove('is-busy');
          statusEl.innerHTML = '✅ 読み取り完了: ' + escapeHtml(file.name);
          renderOcrSummary(statusEl, [
            { label: '仕入先（顧客名）', value: draft.supplier },
            { label: '住所', value: draft.address }
          ]);
        }).catch(function (err) {
          dz.classList.remove('is-busy');
          statusEl.innerHTML = '<div class="errorBox">読み取りに失敗しました: ' + escapeHtml(err.message || String(err)) +
            '<br>もう一度アップロードするか、次の画面に進んで手入力してください。</div>';
        });
      });
    } else {
      body.innerHTML = '<div id="wizardError"></div>' + buildFormGrid(state.wizard.draft, true);
    }
  }

  /**
   * OCR抽出結果のプレビューカードを、指定コンテナの末尾に追記する。
   * 値が1つも取れなかった場合は「抽出できませんでした」という注意書きを表示する。
   */
  function renderOcrSummary(container, fields) {
    var entries = fields.filter(function (f) {
      return f.value !== undefined && f.value !== null && f.value !== '';
    });
    var html;
    if (entries.length === 0) {
      html = '<div class="ocrSummary"><div class="ocrSummary__empty">⚠ 項目を自動抽出できませんでした。次の画面で手入力してください。</div></div>';
    } else {
      html = '<div class="ocrSummary">' +
        '<div class="ocrSummary__title">読み取り結果（次の確認画面で修正できます）</div>' +
        '<div class="ocrSummary__grid">' +
        entries.map(function (f) { return '<div class="ocrSummary__item"><span>' + escapeHtml(f.label) + '</span>' + escapeHtml(f.value) + '</div>'; }).join('') +
        '</div></div>';
    }
    container.insertAdjacentHTML('beforeend', html);
  }

  function wizardTargetSelectHtml() {
    var companyOptions = state.boot.companies.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === state.wizard.companyId ? ' selected' : '') + '>' + c.name + '</option>';
    }).join('');
    var tabOptions = ['輸入車', '国産車'].map(function (t) {
      return '<option value="' + t + '"' + (t === state.wizard.tabName ? ' selected' : '') + '>' + t + '</option>';
    }).join('');
    return '<div class="formGrid" style="margin-bottom:12px;">' +
      '<div class="formField"><label>拠点</label><select id="wzCompany">' + companyOptions + '</select></div>' +
      '<div class="formField"><label>区分</label><select id="wzTab">' + tabOptions + '</select></div>' +
      '</div>';
  }

  function bindDropzone(id, onFile) {
    var el = document.getElementById(id);
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf,image/*';
    input.style.display = 'none';
    input.onchange = function () {
      if (!input.files[0]) return;
      fileToBase64(input.files[0]).then(function (b64) { onFile(b64, input.files[0]); }).catch(showError);
    };
    el.appendChild(input);
    el.onclick = function () { input.click(); };
  }

  document.getElementById('btnWizardNext').addEventListener('click', function () {
    if (state.wizard.step === 1) {
      var wzCompany = document.getElementById('wzCompany');
      var wzTab = document.getElementById('wzTab');
      if (wzCompany) state.wizard.companyId = wzCompany.value;
      if (wzTab) state.wizard.tabName = wzTab.value;
      state.wizard.step = 2;
      renderWizard();
    } else if (state.wizard.step === 2) {
      state.wizard.step = 3;
      renderWizard();
    } else {
      var patch = collectFormValues(document.getElementById('registerBody'));
      Object.assign(state.wizard.draft, patch);
      gsRun('api_registerVehicle', state.wizard.companyId, state.wizard.tabName, state.wizard.draft)
        .then(function (created) {
          showToast('OCN ' + created.ocn + ' を登録しました', 'success');
          closeModals();
          state.flashOcn = created.ocn;
          reloadList();
        }).catch(function (err) {
          var box = document.getElementById('wizardError');
          if (box) { box.innerHTML = '<div class="errorBox">' + escapeHtml(err.message || String(err)) + '</div>'; }
          else showError(err);
        });
    }
  });

  document.getElementById('btnWizardBack').addEventListener('click', function () {
    state.wizard.step = Math.max(1, state.wizard.step - 1);
    renderWizard();
  });

  // ===== PDF帳票出力（10.4） =====
  document.getElementById('btnExportPdf').addEventListener('click', function () {
    var from = prompt('仕入日の開始日（例: 2026-04-01、省略可）', '');
    if (from === null) return;
    var to = prompt('仕入日の終了日（例: 2026-04-30、省略可）', '');
    if (to === null) return;
    var scope = state.scope.mode === 'cross'
      ? { mode: 'cross', tabNames: currentTabNames() }
      : { mode: 'single', companyId: state.scope.companyId, tabName: currentTabNames()[0] };
    showToast('PDFを作成しています...');
    gsRun('api_exportPdf', scope, from, to).then(function (result) {
      showToast('PDFを作成しました', 'success');
      downloadPdf(result.base64, result.fileName);
    }).catch(showError);
  });

  function downloadPdf(base64, fileName) {
    var byteChars = atob(base64);
    var byteNumbers = new Array(byteChars.length);
    for (var i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    var blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/pdf' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  }

  // ===== PDF手動同期（4.1） =====
  document.getElementById('btnSyncPdf').addEventListener('click', function () {
    var companyId = state.scope.mode === 'single' ? state.scope.companyId : null;
    showToast('車検証PDFを同期しています...');
    gsRun('api_syncPdfLinksNow', companyId).then(function () {
      showToast('PDF同期が完了しました', 'success');
      reloadList();
    }).catch(showError);
  });

  // ===== 共通イベント =====
  function bindGlobalEvents() {
    document.getElementById('btnNewVehicle').addEventListener('click', function () {
      if (state.scope.mode === 'integrated') { openIntegratedNew(); return; }
      openWizard();
    });
    document.querySelectorAll('[data-close-modal]').forEach(function (el) {
      el.addEventListener('click', closeModals);
    });
    document.getElementById('keywordInput').addEventListener('input', debounce(applyFiltersAndRender, 200));
    document.getElementById('filterCarType').addEventListener('change', applyFiltersAndRender);
    document.getElementById('filterStatus').addEventListener('change', applyFiltersAndRender);
    document.getElementById('filterStaff').addEventListener('change', applyFiltersAndRender);
  }

  function closeModals() {
    document.getElementById('detailModal').classList.add('hidden');
    document.getElementById('registerModal').classList.add('hidden');
    document.getElementById('integratedModal').classList.add('hidden');
  }

  // ===== ユーティリティ =====
  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result; // "data:<mime>;base64,xxxx"
        var comma = result.indexOf(',');
        resolve({ data: result.slice(comma + 1), mimeType: file.type || 'application/pdf' });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      clearTimeout(t);
      var args = arguments;
      t = setTimeout(function () { fn.apply(null, args); }, wait);
    };
  }

  function showToast(msg, type) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('is-error', 'is-success');
    if (type === 'error') el.classList.add('is-error');
    if (type === 'success') el.classList.add('is-success');
    el.classList.remove('hidden');
    setTimeout(function () { el.classList.add('hidden'); }, 3000);
  }

  function showError(err) {
    console.error(err);
    showToast((err && err.message) || String(err), 'error');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escapeAttr(s) { return escapeHtml(s); }
})();
</script>
