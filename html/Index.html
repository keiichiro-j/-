<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('html/Stylesheet'); ?>
</head>
<body>
  <div id="loadingScreen" class="loadingScreen">
    <div class="loadingScreen__inner">
      <? if (theme.loadingImageUrl) { ?>
        <img class="loadingScreen__logo" src="<?= theme.loadingImageUrl ?>" alt="">
      <? } else { ?>
        <div class="loadingScreen__logoPlaceholder"><?= theme.appTitle ?></div>
      <? } ?>
      <div class="spinner spinner--lg"></div>
      <div class="loadingScreen__text">NOW LOADING</div>
    </div>
  </div>

  <div id="app" class="app">

    <header class="pageHeader">
      <div class="eyebrow">VEHICLE INVENTORY MANAGEMENT</div>
      <div class="pageHeader__titleRow">
        <img id="brandLogo" class="pageHeader__logo hidden" alt="ロゴ">
        <h1 class="pageHeader__title" id="appTitleText">車両在庫管理</h1>
      </div>
      <div class="pageHeader__rule"></div>
      <p class="pageHeader__subtitle" id="appSubtitleText">拠点切替・横断在庫管理、OCRによる入庫データ自動反映</p>
    </header>

    <div class="statusBar">
      <div class="statusBar__left">
        <span>本日もよろしくお願いします</span>
        <span class="statusBar__dot">・</span>
        <span class="liveDot"></span><span>ライブ</span>
        <span id="liveClock" class="statusBar__clock">--:--:--</span>
        <span class="statusBar__dot">・</span>
        <span>本日の登録 <strong id="todayCount">0</strong> 件</span>
      </div>
      <div class="statusBar__right">
        <button class="btn btn--primary" id="btnNewVehicle">＋ 新規登録</button>
      </div>
    </div>

    <nav class="mainNav" id="mainNav">
      <button class="mainNav__tab is-active" data-view="inventory">在庫一覧</button>
      <button class="mainNav__tab" data-view="history">履歴</button>
      <button class="mainNav__tab" data-view="settings">設定</button>
    </nav>

    <div id="inventoryView" class="viewBody">
      <nav class="topbar__scope" id="scopeTabs" role="tablist" aria-label="拠点切替">
        <!-- JS が会社タブ + 横断表示タブを描画 -->
      </nav>

      <div class="toolbar">
        <div class="toolbar__tabs" id="tabNames" role="tablist" aria-label="車両区分">
          <!-- 輸入車/国産車/(販売済) タブ -->
        </div>

        <input type="search" id="keywordInput" class="input input--search"
               placeholder="車種・車台番号・OCN・登録番号などで検索">

        <select id="filterCarType" class="input"><option value="">車種すべて</option></select>
        <select id="filterStatus" class="input"><option value="">ステータスすべて</option></select>
        <select id="filterStaff" class="input"><option value="">担当者すべて</option></select>

        <button class="btn" id="btnExportPdf">帳票出力（PDF）</button>
        <button class="btn" id="btnSyncPdf">車検証PDF同期</button>
      </div>

      <div id="dashboard" class="dashboard hidden"></div>

      <main class="listWrap">
        <table class="vehicleTable" id="vehicleTable">
          <thead id="vehicleTableHead"></thead>
          <tbody id="vehicleTableBody"></tbody>
        </table>
        <div id="emptyState" class="emptyState hidden">該当する車両がありません</div>
      </main>
    </div>

    <div id="historyView" class="viewBody hidden">
      <div class="toolbar">
        <select id="historyCompany" class="input"></select>
        <button class="btn" id="btnRefreshHistory">更新</button>
      </div>
      <main class="listWrap">
        <table class="vehicleTable" id="historyTable">
          <thead>
            <tr>
              <th>日時</th><th>操作者</th><th>種別</th><th>タブ</th><th>OCN</th><th>内容</th><th>備考</th><th></th>
            </tr>
          </thead>
          <tbody id="historyTableBody"></tbody>
        </table>
        <div id="historyEmptyState" class="emptyState hidden">変更履歴がありません</div>
      </main>
    </div>

    <div id="settingsView" class="viewBody hidden">
      <div class="settingsGrid" id="settingsGrid">
        <!-- JS が拠点/通知/OCRラベル/選択肢/テーマ の各設定カードを描画 -->
      </div>
    </div>
  </div>

  <!-- 車両詳細/編集 モーダル -->
  <div id="detailModal" class="modal hidden">
    <div class="modal__panel modal__panel--wide">
      <div class="modal__header">
        <h2 id="detailTitle">車両詳細</h2>
        <button class="btn btn--icon" data-close-modal>×</button>
      </div>
      <div class="modal__body">
        <div id="detailError"></div>
        <div id="detailBody"></div>
      </div>
      <div class="modal__footer">
        <div class="statusActions" id="statusActions"></div>
        <div class="modal__footerRight">
          <button class="btn btn--danger" id="btnDeleteVehicle">削除</button>
          <button class="btn" data-close-modal>閉じる</button>
          <button class="btn btn--primary" id="btnSaveDetail">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 新規登録 ウィザード モーダル -->
  <div id="registerModal" class="modal hidden">
    <div class="modal__panel modal__panel--wide">
      <div class="modal__header">
        <h2>新規仕入登録</h2>
        <button class="btn btn--icon" data-close-modal>×</button>
      </div>
      <div class="wizard__steps" id="wizardSteps">
        <span class="wizard__step is-active" data-step="1">① 注文書</span>
        <span class="wizard__step" data-step="2">② 査定書</span>
        <span class="wizard__step" data-step="3">③ 車検証（任意）</span>
        <span class="wizard__step" data-step="4">④ 確認・登録</span>
      </div>
      <div class="modal__body" id="registerBody"></div>
      <div class="modal__footer">
        <div></div>
        <div class="modal__footerRight">
          <button class="btn hidden" id="btnWizardBack">戻る</button>
          <button class="btn btn--primary" id="btnWizardNext">次へ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 販売確定 モーダル -->
  <div id="saleModal" class="modal hidden">
    <div class="modal__panel modal__panel--sm">
      <div class="modal__header">
        <h2>販売確定</h2>
        <button class="btn btn--icon" id="btnCloseSale">×</button>
      </div>
      <div class="modal__body">
        <div id="saleError"></div>
        <div class="formGrid">
          <div class="formField formField--required">
            <label>販売年月</label>
            <input type="month" id="saleMonth">
          </div>
          <div class="formField formField--required">
            <label>販売先</label>
            <input type="text" id="saleTo" placeholder="例: 株式会社◯◯商会">
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <div></div>
        <div class="modal__footerRight">
          <button class="btn" id="btnCancelSale">キャンセル</button>
          <button class="btn btn--primary" id="btnConfirmSale">販売確定する</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <?!= include('html/JavaScript'); ?>
</body>
</html>
