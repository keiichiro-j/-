<style>
  :root{
    --bg:#f2f2f7;
    --bg-elevated:#ffffff;
    --text:#1c1c1e;
    --text-secondary:#8a8a8e;
    --border:#e5e5ea;
    --accent:#007aff;
    --accent-text:#ffffff;
    --danger:#ff3b30;
    --success:#34c759;
    --warning:#ff9500;
    --fill:#f2f2f7;
    --shadow:0 1px 2px rgba(0,0,0,0.06);
    --radius:14px;
    --radius-sm:9px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }

  [data-theme="dark"]{
    --bg:#000000;
    --bg-elevated:#1c1c1e;
    --text:#f2f2f7;
    --text-secondary:#8e8e93;
    --border:#2c2c2e;
    --accent:#0a84ff;
    --accent-text:#ffffff;
    --danger:#ff453a;
    --success:#30d158;
    --warning:#ff9f0a;
    --fill:#2c2c2e;
    --shadow:0 1px 3px rgba(0,0,0,0.5);
  }

  @media (prefers-color-scheme: dark){
    [data-theme="system"]{
      --bg:#000000;
      --bg-elevated:#1c1c1e;
      --text:#f2f2f7;
      --text-secondary:#8e8e93;
      --border:#2c2c2e;
      --accent:#0a84ff;
      --accent-text:#ffffff;
      --danger:#ff453a;
      --success:#30d158;
      --warning:#ff9f0a;
      --fill:#2c2c2e;
      --shadow:0 1px 3px rgba(0,0,0,0.5);
    }
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .app{ max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  .appHeader{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .appHeader h1{ margin:0; font-size:17px; font-weight:600; flex:1; text-align:center; }
  .appHeader button{ min-width:44px; }
  .appHeader button.hidden{ visibility:hidden; }

  .screens{ flex:1; padding:14px 14px calc(24px + var(--safe-bottom)); }
  .screen{ display:none; }
  .screen.active{ display:block; animation:fadeIn .15s ease-out; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  /* ===== 共通パーツ ===== */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; background:var(--fill); color:var(--text);
    padding:11px 16px; font-size:15px; font-weight:500; border-radius:var(--radius-sm);
    cursor:pointer; font-family:inherit; text-decoration:none;
  }
  .btn:active{ opacity:.7; }
  .btn-primary{ background:var(--accent); color:var(--accent-text); }
  .btn-danger{ color:var(--danger); }
  .btn-block{ display:flex; width:100%; }
  .btn-sm{ padding:7px 12px; font-size:13px; border-radius:8px; }
  .btn.hidden{ display:none; }

  .homeActions{ margin-bottom:18px; }
  .sectionLabel{ font-size:12px; font-weight:600; color:var(--text-secondary); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.02em; }
  .sectionLabel:first-child{ margin-top:0; }
  .note{ font-size:12px; color:var(--text-secondary); }

  .cardList{ display:flex; flex-direction:column; gap:8px; }
  .card{
    background:var(--bg-elevated); border-radius:var(--radius); padding:12px 14px;
    box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; gap:10px;
    cursor:pointer;
  }
  .card:active{ opacity:.75; }
  .card .title{ font-weight:600; font-size:15px; }
  .card .meta{ font-size:12.5px; color:var(--text-secondary); margin-top:3px; }
  .badge{
    display:inline-block; border-radius:12px; padding:4px 11px; font-size:12px; font-weight:600;
    background:var(--fill); color:var(--text); white-space:nowrap;
  }
  .badge.score-high{ background:color-mix(in srgb, var(--success) 20%, transparent); color:var(--success); }
  .badge.score-low{ background:color-mix(in srgb, var(--danger) 18%, transparent); color:var(--danger); }

  .emptyState{ text-align:center; color:var(--text-secondary); font-size:13.5px; padding:40px 20px; line-height:1.7; }
  .emptyState.hidden{ display:none; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-secondary); margin-bottom:5px; font-weight:500; }
  input[type="text"], input[type="number"], select, textarea{
    width:100%; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text);
    padding:11px 12px; font-size:15px; border-radius:var(--radius-sm); font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  .input-sm{ width:auto; padding:8px 10px; font-size:13px; }
  .input-xs{ width:64px; padding:8px 8px; font-size:13px; text-align:center; }

  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .bulkRow select{ flex-shrink:0; }

  .overrideAdd{ background:var(--bg-elevated); border:1px dashed var(--border); border-radius:var(--radius); padding:10px; margin-bottom:10px; }
  .overrideAdd .row{ margin-bottom:8px; }
  .overrideList{ display:flex; flex-direction:column; gap:6px; margin-bottom:4px; }
  .overrideItem{
    display:flex; justify-content:space-between; align-items:center; background:var(--bg-elevated);
    border-radius:var(--radius-sm); padding:8px 10px; font-size:12.5px;
  }
  .overrideItem button{ background:none; border:none; color:var(--danger); font-size:13px; cursor:pointer; padding:2px 6px; }

  .configPreview{ display:flex; flex-direction:column; gap:1px; border-radius:var(--radius); overflow:hidden; }
  .configPreviewRow{
    display:flex; justify-content:space-between; padding:9px 12px; font-size:12.5px;
    background:var(--bg-elevated); border-bottom:1px solid var(--border);
  }
  .configPreviewRow:last-child{ border-bottom:none; }
  .configPreviewRow .t{ color:var(--text-secondary); }

  .stickyBottom{
    position:sticky; bottom:0; background:var(--bg); padding-top:12px; margin-top:16px;
    padding-bottom:var(--safe-bottom);
  }
  .errorText{ color:var(--danger); font-size:12.5px; margin-bottom:8px; text-align:center; }
  .errorText.hidden{ display:none; }

  .progressBar{ height:6px; background:var(--fill); border-radius:4px; overflow:hidden; margin-bottom:6px; }
  .progressBar__fill{ height:100%; background:var(--accent); width:0%; transition:width .25s ease; }
  .saveState{ text-align:right; margin-bottom:8px; min-height:14px; }

  .answerList{ display:flex; flex-direction:column; gap:10px; }
  .answerCard{ background:var(--bg-elevated); border-radius:var(--radius); padding:12px; box-shadow:var(--shadow); }
  .answerCard .qnum{ font-weight:600; font-size:13.5px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .answerCard .qnum .qtype-tag{ font-size:11px; color:var(--text-secondary); font-weight:400; }
  .choiceRow{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .choiceBtn{
    flex:1 1 40px; min-width:40px; border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 0; text-align:center; font-size:14px; background:var(--bg-elevated); color:var(--text);
    cursor:pointer; font-family:inherit;
  }
  .choiceBtn.selected{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .textInput{ margin-bottom:8px; }
  .memoInput{
    width:100%; border:1px dashed var(--border); border-radius:var(--radius-sm); background:var(--fill);
    color:var(--text); padding:8px 10px; font-size:12.5px; min-height:34px; resize:vertical; font-family:inherit;
  }
  .memoInput::placeholder{ color:var(--text-secondary); }

  .resultScore{ text-align:center; padding:22px 0; background:var(--bg-elevated); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:14px; }
  .resultScore__num{ font-size:44px; font-weight:700; }
  .resultScore__num .unit{ font-size:17px; font-weight:500; margin-left:2px; }
  .resultScore__label{ font-size:12.5px; color:var(--text-secondary); margin-top:4px; }

  .filterChips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip{
    display:inline-block; border:1px solid var(--border); border-radius:14px; padding:5px 12px;
    font-size:12px; cursor:pointer; color:var(--text); background:var(--bg-elevated);
  }
  .chip.active{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }

  .resultList{ display:flex; flex-direction:column; gap:8px; }
  .resultCard{ background:var(--bg-elevated); border-radius:var(--radius); padding:11px 12px; box-shadow:var(--shadow); }
  .resultCard .head{ display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:6px; }
  .resultCard .head .qn{ font-weight:600; }
  .mark{ font-weight:700; font-size:14px; }
  .mark-correct{ color:var(--success); }
  .mark-partial{ color:var(--warning); }
  .mark-wrong{ color:var(--danger); }
  .mark-none{ color:var(--text-secondary); font-weight:500; font-size:12px; }
  .resultCard .ansLine{ font-size:12.5px; color:var(--text-secondary); margin-bottom:2px; }
  .resultCard .memoLine{ font-size:12px; color:var(--text); background:var(--fill); border-radius:8px; padding:6px 8px; margin-top:6px; }
  .gradeRow{ display:flex; gap:6px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .gradeRow .gradeLabel{ font-size:11.5px; color:var(--text-secondary); margin-right:2px; }
  .judgeBtn{
    border:1px solid var(--border); border-radius:8px; padding:5px 10px; font-size:12.5px; background:var(--bg-elevated);
    color:var(--text); cursor:pointer; font-family:inherit;
  }
  .judgeBtn.selected-correct{ background:color-mix(in srgb, var(--success) 20%, transparent); border-color:var(--success); color:var(--success); }
  .judgeBtn.selected-partial{ background:color-mix(in srgb, var(--warning) 20%, transparent); border-color:var(--warning); color:var(--warning); }
  .judgeBtn.selected-wrong{ background:color-mix(in srgb, var(--danger) 20%, transparent); border-color:var(--danger); color:var(--danger); }
  .correctInput{ width:96px; padding:6px 8px; font-size:12.5px; }

  .settingsFooter{ margin-top:18px; text-align:center; }

  .toast{
    position:fixed; left:50%; bottom:calc(20px + var(--safe-bottom)); transform:translateX(-50%);
    background:var(--text); color:var(--bg); padding:9px 16px; border-radius:20px; font-size:12.5px;
    box-shadow:0 4px 14px rgba(0,0,0,.2); z-index:100; transition:opacity .2s ease;
  }
  .toast.hidden{ display:none; }
</style>
