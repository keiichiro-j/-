      const carTypeSubNav = `<div class="cp-subnav">${CAR_TYPES.map(t => `<button type="button" class="cp-subnav-item ${currentPage === 'calendar' && carType === t ? 'active' : ''}" data-cartype="${t}">${t}</button>`).join('')}</div>`;
      const appLinks = visibleExternalApps_().map(a => `<a class="cp-nav-item cp-app-link" href="${escapeAttr(a.url)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid ${appIconClass_(a)}"></i><span class="cp-app-name">${escapeHtml(a.name)}</span></a>`).join('');
      return `
        <div class="cp-header">
          <div class="cp-icon-mark ${sidePanelIconUrl ? 'has-image' : ''}">${iconInner}</div>
          <div class="cp-logo">AU NEW CAR</div>
          <div class="cp-logo-sub">登録カレンダー</div>
        </div>
        <div class="cp-nav">
          ${navItem('calendar', 'fa-calendar-days', 'カレンダー')}
          ${carTypeSubNav}
          ${navItem('mypage', 'fa-user', 'マイページ')}
          ${appLinks}
          ${navItem('settings', 'fa-gear', '設定')}
        </div>
        <div class="cp-footer">
          <div class="cp-user">
            <div class="cp-avatar">${(LINKED_NAME || CURRENT_USER_EMAIL || '?')[0]}</div>
            <div><div class="cp-user-name">${escapeHtml(LINKED_NAME || CURRENT_USER_EMAIL || '未ログイン')}</div><div class="cp-user-email">${escapeHtml(CURRENT_USER_EMAIL || '')}</div></div>
          </div>
          <span class="cp-role-badge ${IS_EDITOR ? 'editor' : 'general'}">${IS_EDITOR ? '権限者' : '一般'}</span>
        </div>
      `;
    }

    // ▼ スマホ表示専用のボトムタブバー。コントロールパネルの主要ページナビと同じ
    //   data-page属性を使い、wireEvents()の既存の委譲ハンドラでそのまま動作する。
    //   追加アプリは、1件ならそのままタブに、2件以上なら「アプリ」タブにまとめてメニューで開く
    //   （最大5件をすべてタブにすると、スマホの幅ではタブが押しにくくなるため）。
    function bottomTabBarHTML() {
      const item = (page, icon, label) => `<button type="button" class="cp-nav-item bottom-tab-item ${currentPage === page ? 'active' : ''}" data-page="${page}"><i class="fa-solid ${icon}"></i><span>${label}</span></button>`;
      const apps = visibleExternalApps_();
      const appLink = (a, cls) => `<a class="${cls}" href="${escapeAttr(a.url)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid ${appIconClass_(a)}"></i><span>${escapeHtml(a.name)}</span></a>`;
      let appsTab = '';
      if (apps.length === 1) {
        appsTab = appLink(apps[0], 'cp-nav-item bottom-tab-item');
      } else if (apps.length > 1) {
        appsTab = `<button type="button" class="cp-nav-item bottom-tab-item js-apps-menu-toggle ${appsMenuOpen ? 'active' : ''}"><i class="fa-solid fa-table-cells-large"></i><span>アプリ</span></button>`;
      }
      const appsMenu = (appsMenuOpen && apps.length > 1)
        ? `<div class="apps-menu-backdrop js-apps-menu-close"></div>
           <div class="apps-menu">${apps.map(a => appLink(a, 'apps-menu-item js-apps-menu-close')).join('')}</div>`
        : '';
      return `
        <nav class="bottom-tab-bar">
          ${item('calendar', 'fa-calendar-days', 'カレンダー')}
          ${item('mypage', 'fa-user', 'マイページ')}
          ${appsTab}
          ${item('settings', 'fa-gear', '設定')}
          ${appsMenu}
        </nav>
      `;
    }

    // ▼ 表示してよい追加アプリだけを返す（http/https以外のURLは念のため表示しない）
    function visibleExternalApps_() {
      return externalApps.filter(a => a && a.name && /^https?:\/{2}/i.test(a.url || ''));
    }

    function announceBannerHTML() {
      const currentAnnouncements = announcementsByType[carType] || [];
      if (!currentAnnouncements.length) return '';
      const itemsHtml = currentAnnouncements.map(a => `<span class="announce-item">${a.html || escapeHtml(a.text || '')}</span>`).join('<span class="announce-sep">・</span>');
      return `<div class="announce-bar" id="announceBar">
        <div class="announce-track">${itemsHtml}</div>
      </div>`;
    }

    function pageBody() {
      if (currentPage === 'mypage') return mypagePageHTML();
      if (currentPage === 'settings') return settingsPageHTML();
      return calendarPageHTML();
    }

    function render() {
      document.getElementById('app-root').innerHTML = `
        <div class="app-shell-outer">
          ${announceBannerHTML()}
          <div class="app-shell">
            <div class="app-row">
              <nav class="control-panel">${controlPanelHTML()}</nav>
              <div class="main-col">${pageBody()}</div>
            </div>
          </div>
          ${bottomTabBarHTML()}
        </div>
      `;
      // 設定ページでは、選んだだけ（未保存）のテーマ・鮮やかさをその場で試せるようにする。他のページでは保存済みの設定を使う。
      if (currentPage === 'settings') applyTheme(pendingTheme, pendingSaturation);
      else applyTheme(currentTheme, currentSaturation);
      applyDisplayPrefs_();
      wireEvents();
      scrollTodayToTop();
      if (currentPage === 'mypage' && LINKED_NAME) renderMpResults();
    }

    // 設定ページの一覧(拠点/お知らせ/カレンダー案内/担当者マスタ)で項目を追加・削除すると
    // render()がページ全体を作り直すため、スクロール位置が先頭に戻ってしまう。
    // それを防ぐため、再描画の前後でスクロール位置を保持する。
    function renderKeepingSettingsScroll_() {
      const scroller = document.querySelector('.page-fill-area');
      const prevScrollTop = scroller ? scroller.scrollTop : 0;
      render();
      const newScroller = document.querySelector('.page-fill-area');
      if (newScroller) newScroller.scrollTop = prevScrollTop;
    }

    function scrollTodayToTop() {
      requestAnimationFrame(() => {
        const scroller = document.getElementById('rowScroll');
        if (!scroller) return;
        const todayRow = scroller.querySelector('[data-today="true"]');
        if (todayRow) scroller.scrollTop = todayRow.offsetTop - 4;
      });
    }

    // ▼ 詳細モーダルを開くクリックを、指定したコンテナ内の要素へまとめて割り当てる。
    //   (メインの render() 後だけでなく、検索結果だけを差し替えた後にも呼べるよう分離している)
    function wireRecordClicks_(container) {
      container.querySelectorAll('.js-open-record').forEach(el => {
        el.onclick = () => {
          try { openModal(JSON.parse(el.dataset.record)); } catch (err) { console.warn(err); }
        };
      });
    }

    function markDirtyBtn_(btnId) {
      const btn = document.getElementById(btnId);
      if (btn) btn.disabled = false;
    }

    function wireEvents() {
      const root = document.getElementById('app-root');

      // data-page を持つページ切り替えボタンだけが対象（アプリへのリンクは除外）
      root.querySelectorAll('.cp-nav-item[data-page]').forEach(btn => {
        btn.onclick = () => {
          currentPage = btn.dataset.page;
          sidebarOpen = false;
          appsMenuOpen = false;
          if (currentPage === 'settings') { loadMypageLinksIfNeeded(); loadCalSettingsNotices(); }
          render();
        };
      });
      root.querySelectorAll('[data-cartype]').forEach(btn => {
        if (btn.closest('.cp-subnav')) {
          btn.onclick = () => {
            const t = btn.dataset.cartype;
            if (t === carType && currentPage === 'calendar') return;
            carType = t; currentPage = 'calendar'; sidebarOpen = false;
            syncBranchesForCurrentType_();
            // 拠点フィルターが新しい車両区分では選べない拠点(例: 中古車のデモカー)を
            // 指しているままだと、選択肢が消えて実際の絞り込みと表示がずれるため戻す
            if (listSearch.branch !== 'ALL' && !branchOrderFor(t).includes(listSearch.branch)) listSearch.branch = 'ALL';
            render();
            loadData();
            loadCalendarNotices();
          };
        }
      });

      root.querySelectorAll('.js-apps-menu-toggle').forEach(btn => {
        btn.onclick = () => { appsMenuOpen = !appsMenuOpen; render(); };
      });
      root.querySelectorAll('.js-apps-menu-close').forEach(el => {
        // リンクを別タブで開く既定動作を妨げないよう、メニューを閉じる再描画はクリック処理の後に行う
        el.addEventListener('click', () => { appsMenuOpen = false; setTimeout(render, 0); });
      });

      root.querySelectorAll('[data-viewmode]').forEach(btn => {
        btn.onclick = () => { calendarViewMode = btn.dataset.viewmode; render(); };
      });

      root.querySelectorAll('.js-pending-toggle').forEach(btn => {
        btn.onclick = () => { sidebarOpen = !sidebarOpen; render(); };
      });
      const backdrop = document.getElementById('overlayBackdrop');
      if (backdrop) backdrop.onclick = () => { sidebarOpen = false; render(); };

      const btnToday = document.getElementById('btnToday');
      if (btnToday) btnToday.onclick = () => { const now = new Date(); currentDate = new Date(now.getFullYear(), now.getMonth(), 1); render(); loadCalendarNotices(); };
      const btnPrev = document.getElementById('btnPrevMonth');
      if (btnPrev) btnPrev.onclick = () => { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1); render(); loadCalendarNotices(); };
      const btnNext = document.getElementById('btnNextMonth');
      if (btnNext) btnNext.onclick = () => { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1); render(); loadCalendarNotices(); };

      const HSCROLL_SELECTOR = '.content-col, .kpi-row-top, .kpi-row-bottom, .mp-kpi-row';
      root.querySelectorAll('.slide-hint').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const scroller = btn.closest(HSCROLL_SELECTOR);
          if (scroller) scroller.scrollBy({ left: scroller.clientWidth * 0.8, behavior: 'smooth' });
        };
      });
      // 横スライドで先端まで到達したら、もう先がないことがわかるよう矢印を消す
      root.querySelectorAll(HSCROLL_SELECTOR).forEach(col => {
        const hint = col.querySelector('.slide-hint');
        if (!hint) return;
        const updateHint = () => {
          const atEnd = col.scrollLeft + col.clientWidth >= col.scrollWidth - 2;
          hint.style.display = atEnd ? 'none' : '';
        };
        updateHint();
        col.addEventListener('scroll', updateHint, { passive: true });
      });
      wireRecordClicks_(root);

      // 検索/フィルター(入力中は結果だけ再描画してフォーカスを保つ)
      const searchInput = document.getElementById('listSearchInput');
      if (searchInput) searchInput.oninput = (ev) => { listSearch.keyword = ev.target.value; renderListResultsOnly(); };
      const branchFilter = document.getElementById('listBranchFilter');
      if (branchFilter) branchFilter.onchange = (ev) => { listSearch.branch = ev.target.value; render(); };
      const methodFilter = document.getElementById('listMethodFilter');
      if (methodFilter) methodFilter.onchange = (ev) => { listSearch.method = ev.target.value; render(); };
      const exportBtn = document.getElementById('btnExportCsv');
      if (exportBtn) exportBtn.onclick = downloadCSV;

      const mpPrev = document.getElementById('mpPrev');
      if (mpPrev) mpPrev.onclick = () => { myPageMonthOffset -= 1; render(); };
      const mpNext = document.getElementById('mpNext');
      if (mpNext) mpNext.onclick = () => { myPageMonthOffset += 1; render(); };
      const mpName = document.getElementById('mpSearchName');
      if (mpName) mpName.oninput = (ev) => { mpSearch.name = ev.target.value; renderMpResults(); };
      const mpMethod = document.getElementById('mpSearchMethod');
      if (mpMethod) mpMethod.onchange = (ev) => { mpSearch.method = ev.target.value; renderMpResults(); };

      root.querySelectorAll('.theme-swatch[data-theme]').forEach(btn => {
        btn.onclick = () => { pendingTheme = btn.dataset.theme; themeMessage = ''; renderKeepingSettingsScroll_(); };
      });
      root.querySelectorAll('.theme-sat-btn[data-pref]').forEach(btn => {
        btn.onclick = () => {
          const pref = btn.dataset.pref;
          pendingDisplayPrefs[pref] = pref === 'highlightMine' ? btn.dataset.value === 'true' : btn.dataset.value;
          displayPrefsMsg = { text: '', error: false };
          renderKeepingSettingsScroll_();
        };
      });
      const displayPrefsSaveBtn = document.getElementById('displayPrefsSaveBtn');
      if (displayPrefsSaveBtn) displayPrefsSaveBtn.onclick = () => {
        displayPrefs = { ...pendingDisplayPrefs };
        displayPrefsMsg = { text: '保存しました', error: false };
        renderKeepingSettingsScroll_();
        if (typeof google === 'undefined') return;
        google.script.run
          .withFailureHandler(e => { displayPrefsMsg = { text: '保存に失敗しました: ' + (e && e.message ? e.message : e), error: true }; renderKeepingSettingsScroll_(); })
          .saveUserDisplayPrefs(displayPrefs);
      };
      root.querySelectorAll('.theme-sat-btn[data-saturation]').forEach(btn => {
        btn.onclick = () => { pendingSaturation = btn.dataset.saturation; themeMessage = ''; renderKeepingSettingsScroll_(); };
      });
      const themeSaveBtn = document.getElementById('themeSaveBtn');
      if (themeSaveBtn) themeSaveBtn.onclick = () => {
        currentTheme = pendingTheme;
        currentSaturation = pendingSaturation;
        themeMessage = '保存しました';
        renderKeepingSettingsScroll_();
        if (typeof google !== 'undefined') {
          google.script.run.withFailureHandler(e => console.error(e)).saveUserTheme(currentTheme, currentSaturation);
        }
      };

      const iconFileInput = document.getElementById('iconFileInput');
      // ▼ アイコンはブラウザ側で透明な余白を切り取り、一辺384pxまでに縮小してから保存する。
      //   サーバー側ではGoogleドライブを使わずスクリプトプロパティに保存するため、データ量を
      //   ICON_DATA_MAX_CHARS以内に収める（写真などPNGで収まらない場合はJPEGに切り替える）。
      const ICON_DATA_MAX_CHARS = 90000;
      const setIconMsg_ = (text, color) => {
        iconMsg = { text, color };
        const m = document.getElementById('iconMsg');
        if (m) { m.textContent = text; m.style.color = color; }
      };
      // ▼ 周囲の透明な余白を切り取ったキャンバスを返す。余白が残っているとロゴが枠の中で小さく見えるため。
      //   大きな画像でも処理が重くならないよう、一辺1024pxまで縮小してから透明部分を調べる。
      function trimTransparentMargins_(img) {
        const scale = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const src = document.createElement('canvas');
        src.width = w; src.height = h;
        const ctx = src.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const alpha = ctx.getImageData(0, 0, w, h).data;
        let minX = w, minY = h, maxX = -1, maxY = -1;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (alpha[(y * w + x) * 4 + 3] > 8) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
        if (maxX < 0) return img; // 全体が透明な画像はそのまま
        // 縁のなめらかな部分を削らないよう1pxだけ余裕を持たせ、元の解像度の画像から切り取る（画質を落とさないため）
        minX = Math.max(0, minX - 1); minY = Math.max(0, minY - 1);
        maxX = Math.min(w - 1, maxX + 1); maxY = Math.min(h - 1, maxY + 1);
        if (minX === 0 && minY === 0 && maxX === w - 1 && maxY === h - 1) return img;
        const sx = minX / scale, sy = minY / scale;
        const sw = Math.min(img.naturalWidth - sx, (maxX - minX + 1) / scale);
        const sh = Math.min(img.naturalHeight - sy, (maxY - minY + 1) / scale);
        const out = document.createElement('canvas');
        out.width = Math.max(1, Math.round(sw)); out.height = Math.max(1, Math.round(sh));
        out.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, out.width, out.height);
        return out;
      }
      function encodeIconDataUrl_(img) {
        const source = trimTransparentMargins_(img); // 画像そのもの、または余白を切り取ったキャンバス
        const srcW = source.naturalWidth || source.width, srcH = source.naturalHeight || source.height;
        const draw = (maxDim, type) => {
          const scale = Math.min(1, maxDim / Math.max(srcW, srcH));
          const w = Math.max(1, Math.round(srcW * scale));
          const h = Math.max(1, Math.round(srcH * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          if (type === 'image/jpeg') { ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, h); } // JPEGは透過できないため白で下塗り
          ctx.drawImage(source, 0, 0, w, h);
          return canvas.toDataURL(type, 0.88);
        };
        // 表示は最大184px幅。高解像度の画面でもぼやけないよう、まずは一辺384pxで保存を試みる
        for (const [maxDim, type] of [[384, 'image/png'], [256, 'image/png'], [384, 'image/jpeg'], [256, 'image/jpeg'], [160, 'image/jpeg']]) {
          const dataUrl = draw(maxDim, type);
          if (dataUrl.length <= ICON_DATA_MAX_CHARS) return dataUrl;
        }
        return '';
      }
      // ▼ ファイル選択・ドライブからの取り込みのどちらも、ここで縮小してから保存する
      function resizeAndSaveIcon_(src) {
        const img = new Image();
        img.onload = () => {
          const dataUrl = encodeIconDataUrl_(img);
          if (!dataUrl) { setIconMsg_('画像のデータが大きすぎます。別の画像でお試しください。', 'var(--paper)'); return; }
          setIconMsg_('保存中…', 'var(--muted)');
          if (typeof google === 'undefined') return;
          google.script.run
            .withSuccessHandler(res => {
              if (res && res.success) {
                sidePanelIconUrl = res.url;
                sideIconExternalUrlValue = ''; // 画像として保存したので、URL指定は自動的に無効化される
                iconMsg = { text: '保存しました。アイコンを変更しました。', color: 'var(--oss)' };
                renderKeepingSettingsScroll_();
              } else {
                setIconMsg_(res ? res.message : '保存に失敗しました。', 'var(--paper)');
              }
            })
            .withFailureHandler(e => setIconMsg_('通信エラー: ' + (e && e.message ? e.message : e), 'var(--paper)'))
            .saveSideIconData(dataUrl);
        };
        img.onerror = () => setIconMsg_('画像の読み込みに失敗しました。PNGかJPEGの画像でお試しください。', 'var(--paper)');
        img.src = src;
      }
      if (iconFileInput) iconFileInput.onchange = (ev) => {
        const file = ev.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { setIconMsg_('画像ファイルを選択してください。', 'var(--paper)'); return; }
        if (file.size > 8 * 1024 * 1024) { setIconMsg_('画像サイズが大きすぎます。8MB以内のファイルを選択してください。', 'var(--paper)'); return; }
        setIconMsg_('画像を処理中…', 'var(--muted)');
        const reader = new FileReader();
        reader.onload = () => resizeAndSaveIcon_(String(reader.result));
        reader.onerror = () => setIconMsg_('画像の読み込みに失敗しました。', 'var(--paper)');
        reader.readAsDataURL(file);
      };
      const iconResetBtn = document.getElementById('iconResetBtn');
      if (iconResetBtn) iconResetBtn.onclick = () => {
        if (typeof google === 'undefined') return;
        google.script.run
          .withSuccessHandler(res => {
            if (res && res.success) {
              sidePanelIconUrl = ''; sideIconExternalUrlValue = '';
              iconMsg = { text: '既定のアイコンに戻しました。', color: 'var(--oss)' };
              renderKeepingSettingsScroll_();
            } else if (res) setIconMsg_(res.message, 'var(--paper)');
          })
          .withFailureHandler(e => setIconMsg_('通信エラー: ' + (e && e.message ? e.message : e), 'var(--paper)'))
          .resetSideIcon();
      };
      const saveIconUrlBtn = document.getElementById('saveIconUrlBtn');
      if (saveIconUrlBtn) saveIconUrlBtn.onclick = () => {
        const input = document.getElementById('iconUrlInput');
        const val = input ? input.value.replace(/\s+/g, '') : ''; // 貼り付け時に紛れた改行・空白を除く（URLに空白は含まれない）
        if (typeof google === 'undefined') return;
        // Googleドライブのリンクは画像そのもののURLではないため、そのままでは表示できない。
        // 画像データを取り込み、アップロードと同じ方法で保存する。
        if (/^https:\/{2}(drive|docs)\.google\.com\/(?:)/i.test(val) || /^https:\/{2}lh3\.googleusercontent\.com\/d\/(?:)/i.test(val)) {
          setIconMsg_('ドライブから画像を読み込み中…', 'var(--muted)');
          google.script.run
            .withSuccessHandler(res => {
              if (res && res.success) resizeAndSaveIcon_(`data:${res.mimeType};base64,${res.base64}`);
              else setIconMsg_(res ? res.message : '読み込みに失敗しました。', 'var(--paper)');
            })
            .withFailureHandler(e => setIconMsg_('通信エラー: ' + (e && e.message ? e.message : e), 'var(--paper)'))
            .getDriveImageForIcon(val);
          return;
        }
        setIconMsg_('保存中…', 'var(--muted)');
        google.script.run
          .withSuccessHandler(res => {
            if (res && res.success) {
              sideIconExternalUrlValue = res.url || val;
              sidePanelIconUrl = res.url || val;
              iconMsg = { text: '保存しました。アイコンを変更しました。', color: 'var(--oss)' };
              renderKeepingSettingsScroll_();
            } else {
              setIconMsg_(res ? res.message : '保存に失敗しました。', 'var(--paper)');
            }
          })
          .withFailureHandler(e => setIconMsg_('通信エラー: ' + (e && e.message ? e.message : e), 'var(--paper)'))
          .saveSideIconUrl(val);
      };

      const branchEditCarTypeSel = document.getElementById('branchEditCarType');
      if (branchEditCarTypeSel) branchEditCarTypeSel.onchange = (ev) => {
        branchEditCarType = ev.target.value;
        pendingBranches = branchesByType[branchEditCarType].slice();
        branchesDirty = false; branchesMsg = '';
        render();
      };
      root.querySelectorAll('.js-branch-name').forEach(inp => {
        inp.oninput = (ev) => { pendingBranches[Number(inp.dataset.idx)].name = ev.target.value; branchesDirty = true; branchesMsg = ''; markDirtyBtn_('branchSaveBtn'); };
      });
      root.querySelectorAll('[data-role="branch-color"]').forEach(inp => {
        inp.oninput = (ev) => { pendingBranches[Number(inp.dataset.idx)].color = ev.target.value; branchesDirty = true; branchesMsg = ''; markDirtyBtn_('branchSaveBtn'); };
      });
      root.querySelectorAll('[data-role="branch-remove"]').forEach(btn => {
        btn.onclick = () => { pendingBranches.splice(Number(btn.dataset.idx), 1); branchesDirty = true; branchesMsg = ''; renderKeepingSettingsScroll_(); };
      });
      const addBranchBtn = document.getElementById('addBranchBtn');
      if (addBranchBtn) addBranchBtn.onclick = () => {
        const nameInput = document.getElementById('newBranchName');
        const colorInput = document.getElementById('newBranchColor');
        const name = nameInput.value.trim();
        if (!name || name === FALLBACK_BRANCH.name) return; // 「その他」は既に固定で存在するため追加不可
        pendingBranches.push({ name, color: colorInput ? colorInput.value : '#3B4FD1' });
        branchesDirty = true; branchesMsg = '';
        renderKeepingSettingsScroll_();
      };
      const branchSaveBtn = document.getElementById('branchSaveBtn');
      if (branchSaveBtn) branchSaveBtn.onclick = () => {
        if (typeof google === 'undefined') return;
        google.script.run
          .withSuccessHandler(res => {
            if (res && res.success) {
              branchesByType[branchEditCarType] = pendingBranches.slice();
              branchColorsByType[branchEditCarType] = buildBranchColors_(branchesByType[branchEditCarType]);
              if (branchEditCarType === carType) syncBranchesForCurrentType_();
              branchesDirty = false; branchesMsg = '保存しました。既存のシートには「シート設定 > 全シートにテンプレートを再適用」を実行すると拠点プルダウンが反映されます'; render();
            } else if (res) alert(res.message);
          })
          .withFailureHandler(e => alert('保存に失敗しました: ' + (e && e.message ? e.message : e)))
          .saveBranches(branchEditCarType, pendingBranches);
      };

      const announceCarType = document.getElementById('announceCarType');
      if (announceCarType) announceCarType.onchange = (ev) => {
        announceEditCarType = ev.target.value;
        pendingAnnouncements = announcementsByType[announceEditCarType].slice();
        announceDirty = false; announceMsg = '';
        render();
      };
      const addAnnounceBtn = document.getElementById('addAnnounceBtn');
      if (addAnnounceBtn) addAnnounceBtn.onclick = () => {
        const input = document.getElementById('newAnnounceText');
        const text = input.value.trim();
        if (!text) return;
        pendingAnnouncements.push({ html: escapeHtml(text), text });
        announceDirty = true; announceMsg = '';
        renderKeepingSettingsScroll_();
      };
      root.querySelectorAll('[data-role="announce-remove"]').forEach(btn => {
        btn.onclick = () => { pendingAnnouncements.splice(Number(btn.dataset.idx), 1); announceDirty = true; announceMsg = ''; renderKeepingSettingsScroll_(); };
      });
      root.querySelectorAll('[data-role="announce-html"]').forEach(el => {
        el.addEventListener('mouseup', () => captureRichSelection_(el));
        el.addEventListener('keyup', () => captureRichSelection_(el));
        el.addEventListener('paste', forcePlainTextPaste_);
        el.addEventListener('input', () => {
          const idx = Number(el.dataset.idx);
          pendingAnnouncements[idx].html = sanitizeRichHtmlClient_(el.innerHTML);
          pendingAnnouncements[idx].text = el.textContent;
          announceDirty = true; announceMsg = '';
          markDirtyBtn_('announceSaveBtn');
        });
      });
      root.querySelectorAll('[data-role="announce-bold"]').forEach(btn => {
        btn.onclick = () => {
          const idx = Number(btn.dataset.idx);
          const el = root.querySelector(`[data-role="announce-html"][data-idx="${idx}"]`);
          if (!el) return;
          applyRichFormat_(el, 'b', null, (html) => {
            pendingAnnouncements[idx].html = html;
            pendingAnnouncements[idx].text = el.textContent;
            announceDirty = true; announceMsg = '';
            markDirtyBtn_('announceSaveBtn');
          });
        };
      });
      root.querySelectorAll('[data-role="announce-color"]').forEach(inp => {
        inp.oninput = (ev) => {
          const idx = Number(inp.dataset.idx);
          const el = root.querySelector(`[data-role="announce-html"][data-idx="${idx}"]`);
          if (!el) return;
          applyRichFormat_(el, 'span', `color:${ev.target.value};`, (html) => {
            pendingAnnouncements[idx].html = html;
            pendingAnnouncements[idx].text = el.textContent;
            announceDirty = true; announceMsg = '';
            markDirtyBtn_('announceSaveBtn');
          });
        };
      });
      const announceSaveBtn = document.getElementById('announceSaveBtn');
      if (announceSaveBtn) announceSaveBtn.onclick = () => {
        if (typeof google === 'undefined') return;
        google.script.run
          .withSuccessHandler(res => {
            if (res && res.success) {
              announcementsByType[announceEditCarType] = pendingAnnouncements.slice();
              announceDirty = false; announceMsg = '保存しました'; render();
            } else if (res) alert(res.message);
          })
          .withFailureHandler(e => alert('保存に失敗しました: ' + (e && e.message ? e.message : e)))
          .saveAnnouncements(announceEditCarType, pendingAnnouncements);
      };

      const calSetCarType = document.getElementById('calSetCarType');
      if (calSetCarType) calSetCarType.onchange = (ev) => { calSettingsCarType = ev.target.value; loadCalSettingsNotices(); };
      const calSetYear = document.getElementById('calSetYear');
      if (calSetYear) calSetYear.onchange = (ev) => { calSettingsYear = Number(ev.target.value); loadCalSettingsNotices(); };
      const calSetMonth = document.getElementById('calSetMonth');
      if (calSetMonth) calSetMonth.onchange = (ev) => { calSettingsMonth = Number(ev.target.value); loadCalSettingsNotices(); };
      root.querySelectorAll('.js-cal-notice-date').forEach(inp => {
        inp.oninput = (ev) => { calSettingsNotices[Number(inp.dataset.idx)].date = ev.target.value; calSettingsDirty = true; markDirtyBtn_('calNoticeSaveBtn'); };
      });
      const addCalNoticeBtn = document.getElementById('addCalNoticeBtn');
      if (addCalNoticeBtn) addCalNoticeBtn.onclick = () => {
        if (calSettingsNotices.length >= 10) return;
        calSettingsNotices.push({ date: '', html: '', text: '' });
        calSettingsDirty = true; calSettingsMsg = '';
        renderKeepingSettingsScroll_();
      };
      root.querySelectorAll('[data-role="calnotice-remove"]').forEach(btn => {
        btn.onclick = () => { calSettingsNotices.splice(Number(btn.dataset.idx), 1); calSettingsDirty = true; calSettingsMsg = ''; renderKeepingSettingsScroll_(); };
      });
      root.querySelectorAll('[data-role="calnotice-html"]').forEach(el => {
        el.addEventListener('mouseup', () => captureRichSelection_(el));
        el.addEventListener('keyup', () => captureRichSelection_(el));
        el.addEventListener('paste', forcePlainTextPaste_);
        el.addEventListener('input', () => {
          const idx = Number(el.dataset.idx);
          calSettingsNotices[idx].html = sanitizeRichHtmlClient_(el.innerHTML);
          calSettingsNotices[idx].text = el.textContent;
          calSettingsDirty = true; calSettingsMsg = '';
          markDirtyBtn_('calNoticeSaveBtn');
        });
      });
      root.querySelectorAll('[data-role="calnotice-bold"]').forEach(btn => {
        btn.onclick = () => {
          const idx = Number(btn.dataset.idx);
          const el = root.querySelector(`[data-role="calnotice-html"][data-idx="${idx}"]`);
          if (!el) return;
          applyRichFormat_(el, 'b', null, (html) => {
            calSettingsNotices[idx].html = html;
            calSettingsNotices[idx].text = el.textContent;
            calSettingsDirty = true; calSettingsMsg = '';
            markDirtyBtn_('calNoticeSaveBtn');
          });
        };
      });
      root.querySelectorAll('[data-role="calnotice-color"]').forEach(inp => {
        inp.oninput = (ev) => {
          const idx = Number(inp.dataset.idx);
          const el = root.querySelector(`[data-role="calnotice-html"][data-idx="${idx}"]`);
          if (!el) return;
          applyRichFormat_(el, 'span', `color:${ev.target.value};`, (html) => {
            calSettingsNotices[idx].html = html;
            calSettingsNotices[idx].text = el.textContent;
            calSettingsDirty = true; calSettingsMsg = '';
            markDirtyBtn_('calNoticeSaveBtn');
          });
        };
      });
      const calNoticeSaveBtn = document.getElementById('calNoticeSaveBtn');
      if (calNoticeSaveBtn) calNoticeSaveBtn.onclick = () => {
        if (typeof google === 'undefined') return;
        google.script.run
          .withSuccessHandler(res => {
            if (res && res.success) {
              calSettingsDirty = false; calSettingsMsg = '保存しました';
              if (calSettingsCarType === carType && calSettingsYear === currentDate.getFullYear() && calSettingsMonth === currentDate.getMonth()) {
                loadCalendarNotices();
              }
              render();
            } else if (res) alert(res.message);
          })
          .withFailureHandler(e => alert('保存に失敗しました: ' + (e && e.message ? e.message : e)))
          .saveCalendarNotices(calSettingsCarType, calSettingsYear, calSettingsMonth, calSettingsNotices);
      };

      // ---- アプリリンク設定 ----
      const setAppsDirty_ = () => { appsDirty = true; appsMsg = ''; };
      root.querySelectorAll('.js-app-name').forEach(inp => {
        inp.oninput = (ev) => { pendingApps[Number(inp.dataset.idx)].name = ev.target.value; setAppsDirty_(); markDirtyBtn_('appsSaveBtn'); };
      });
      // アイコンを選んだら、横のプレビューもその場で切り替える
      root.querySelectorAll('.app-icon-select').forEach(sel => {
        sel.onchange = () => {
          const preview = sel.parentElement.querySelector('.app-icon-preview i');
          if (preview) preview.className = 'fa-solid ' + appIconClass_({ icon: sel.value });
          if (sel.dataset.role === 'app-icon') {
            pendingApps[Number(sel.dataset.idx)].icon = sel.value;
            setAppsDirty_();
            markDirtyBtn_('appsSaveBtn');
          }
        };
      });
      root.querySelectorAll('.js-app-url').forEach(inp => {
        inp.oninput = (ev) => { pendingApps[Number(inp.dataset.idx)].url = ev.target.value; setAppsDirty_(); markDirtyBtn_('appsSaveBtn'); };
      });
      const moveApp_ = (idx, dir) => {
        const j = idx + dir;
        if (j < 0 || j >= pendingApps.length) return;
        [pendingApps[idx], pendingApps[j]] = [pendingApps[j], pendingApps[idx]];
        setAppsDirty_();
        renderKeepingSettingsScroll_();
      };
      root.querySelectorAll('[data-role="app-up"]').forEach(btn => { btn.onclick = () => moveApp_(Number(btn.dataset.idx), -1); });
      root.querySelectorAll('[data-role="app-down"]').forEach(btn => { btn.onclick = () => moveApp_(Number(btn.dataset.idx), 1); });
      root.querySelectorAll('[data-role="app-remove"]').forEach(btn => {
        btn.onclick = () => { pendingApps.splice(Number(btn.dataset.idx), 1); setAppsDirty_(); renderKeepingSettingsScroll_(); };
      });
      const addAppBtn = document.getElementById('addAppBtn');
      if (addAppBtn) addAppBtn.onclick = () => {
        const name = document.getElementById('newAppName').value.trim();
        const url = document.getElementById('newAppUrl').value.trim();
        const errEl = document.getElementById('appsErr');
        if (!name || !url) { if (errEl) errEl.textContent = 'アプリ名とURLを入力してください。'; return; }
        if (!/^https?:\/{2}\S+$/i.test(url)) { if (errEl) errEl.textContent = 'URLは http:\/\/ または https:\/\/ から入力してください。'; return; }
        if (pendingApps.length >= EXTERNAL_APPS_MAX) return;
        const iconSel = document.getElementById('newAppIcon');
        pendingApps.push({ name, url, icon: iconSel ? iconSel.value : APP_ICONS[0].cls });
        setAppsDirty_();
        renderKeepingSettingsScroll_();
      };
      const appsSaveBtn = document.getElementById('appsSaveBtn');
      if (appsSaveBtn) appsSaveBtn.onclick = () => {
        if (typeof google === 'undefined') return;
        google.script.run
          .withSuccessHandler(res => {
            if (res && res.success) {
              externalApps = res.apps || [];
              pendingApps = externalApps.map(a => ({ ...a }));
              appsDirty = false; appsMsg = '保存しました';
              renderKeepingSettingsScroll_();
            } else {
              const errEl = document.getElementById('appsErr');
              if (errEl) errEl.textContent = res ? res.message : '保存に失敗しました。';
            }
          })
          .withFailureHandler(e => {
            const errEl = document.getElementById('appsErr');
            if (errEl) errEl.textContent = '通信エラー: ' + (e && e.message ? e.message : e);
          })
          .saveExternalApps(pendingApps);
      };

      const addLinkBtn = document.getElementById('addLinkBtn');
      if (addLinkBtn) addLinkBtn.onclick = () => {
        const name = document.getElementById('newLinkName').value.trim();
        const email = document.getElementById('newLinkEmail').value.trim();
        const branch = document.getElementById('newLinkBranch').value;
        const linkCarType = document.getElementById('newLinkCarType').value;
        const isBranchManager = document.getElementById('newLinkIsBranchManager').checked;
        if (!name || !email) return;
        mypageLinks.push({ name, email, branch, carType: linkCarType, isBranchManager, isEditor: false });
        mypageLinksDirty = true; mypageLinksMsg = '';
        renderKeepingSettingsScroll_();
      };
      root.querySelectorAll('[data-role="link-remove"]').forEach(btn => {
        btn.onclick = () => { mypageLinks.splice(Number(btn.dataset.idx), 1); mypageLinksDirty = true; mypageLinksMsg = ''; renderKeepingSettingsScroll_(); };
      });
      root.querySelectorAll('[data-role="link-branchmanager"]').forEach(inp => {
        inp.onchange = (ev) => { mypageLinks[Number(inp.dataset.idx)].isBranchManager = ev.target.checked; mypageLinksDirty = true; mypageLinksMsg = ''; markDirtyBtn_('linkSaveBtn'); };
      });
      const moveLink_ = (idx, dir) => {
        const j = idx + dir;
        if (j < 0 || j >= mypageLinks.length) return;
        [mypageLinks[idx], mypageLinks[j]] = [mypageLinks[j], mypageLinks[idx]];
        mypageLinksDirty = true; mypageLinksMsg = '';
        renderKeepingSettingsScroll_();
      };
      root.querySelectorAll('[data-role="link-up"]').forEach(btn => { btn.onclick = () => moveLink_(Number(btn.dataset.idx), -1); });
      root.querySelectorAll('[data-role="link-down"]').forEach(btn => { btn.onclick = () => moveLink_(Number(btn.dataset.idx), 1); });
      const linkSaveBtn = document.getElementById('linkSaveBtn');
      if (linkSaveBtn) linkSaveBtn.onclick = () => {
        if (typeof google === 'undefined') return;
        google.script.run
          .withSuccessHandler(res => {
            if (res && res.success) { mypageLinksDirty = false; mypageLinksMsg = '保存しました'; render(); }
            else if (res) alert(res.message);
          })
          .withFailureHandler(e => alert('保存に失敗しました: ' + (e && e.message ? e.message : e)))
          .saveMypageLinks(mypageLinks);
      };
    }

    function renderListResultsOnly() {
      // 検索入力中はフォーカスを保つため、フィルター行より下のテーブル部分のみ再構築
      const card = document.querySelector('.calendar-card .page-fill-area');
      if (!card) { render(); return; }
      const prevScrollTop = card.scrollTop; // 再構築のたびにスクロール位置が先頭に戻らないようにする
      card.innerHTML = listViewHTML();
      card.scrollTop = prevScrollTop;
      wireRecordClicks_(card);
      const exportBtn = document.getElementById('btnExportCsv');
      if (exportBtn) exportBtn.onclick = downloadCSV;
      const branchFilter = document.getElementById('listBranchFilter');
      if (branchFilter) branchFilter.onchange = (ev) => { listSearch.branch = ev.target.value; render(); };
      const methodFilter = document.getElementById('listMethodFilter');
      if (methodFilter) methodFilter.onchange = (ev) => { listSearch.method = ev.target.value; render(); };
      const searchInput = document.getElementById('listSearchInput');
      if (searchInput) {
        searchInput.oninput = (ev) => { listSearch.keyword = ev.target.value; renderListResultsOnly(); };
        searchInput.focus();
        searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
      }
    }

    function loadMypageLinksIfNeeded() {
      if (!IS_EDITOR || typeof google === 'undefined') return;
      google.script.run
        .withSuccessHandler(links => { mypageLinks = links || []; mypageLinksDirty = false; mypageLinksMsg = ''; render(); })
        .withFailureHandler(e => console.error(e))
        .getMypageLinks();
    }

    function loadCalSettingsNotices() {
      if (!IS_EDITOR || typeof google === 'undefined') return;
      google.script.run
        .withSuccessHandler(list => { calSettingsNotices = (list || []).map(migrateRichItem_); calSettingsDirty = false; calSettingsMsg = ''; render(); })
        .withFailureHandler(() => { calSettingsNotices = []; render(); })
        .getCalendarNotices(calSettingsCarType, calSettingsYear, calSettingsMonth);
    }

    // ---- 登録内容の詳細表示（閲覧専用。登録・編集はスプレッドシートで行う） ----
    function detailRow_(label, valueHtml) {
      return `<div class="detail-row"><div class="detail-label">${label}</div><div class="detail-value">${valueHtml}</div></div>`;
    }
    function openModal(record) {
      if (!record) return;
      const recordBranchColors = branchColorsByType[record.車両区分] || branchColors;
      const c = recordBranchColors[record.拠点] || recordBranchColors[FALLBACK_BRANCH.name];
      const body = document.getElementById('recordDetailBody');
      body.innerHTML = [
        detailRow_('顧客名', `${escapeHtml(record.顧客名)} 様`),
        detailRow_('ステータス', `<span class="status-pill">${escapeHtml(record.ステータス || '-')}</span>`),
        detailRow_('登録予定日', record.登録予定日 ? escapeHtml(record.登録予定日) : '<span style="color:var(--muted);">未定</span>'),
        detailRow_('拠点', `<span class="branch-pill" style="background:${c.bg};color:${c.c};">${escapeHtml(record.拠点 || '')}</span>`),
        detailRow_('担当者', escapeHtml(record.担当者 || '-')),
        detailRow_('車種', escapeHtml(record.車種 || '-')),
        detailRow_('登録方法', methodPill(isOssRecord(record))),
        detailRow_('備考', record.備考 ? escapeHtml(record.備考) : '<span style="color:var(--muted);">-</span>'),
      ].join('');
      document.getElementById('recordModal').classList.add('flex');
    }
    function closeModal() { document.getElementById('recordModal').classList.remove('flex'); }

    // ---- CSV出力 ----
    function downloadCSV() {
      if (!IS_EDITOR) return;
      const kw = listSearch.keyword.toLowerCase().trim();
      const rows = allRecords.filter(r => {
        const matchSearch = kw === '' || (r.顧客名 || '').toLowerCase().includes(kw) || (r.車種 || '').toLowerCase().includes(kw);
        const matchBranch = listSearch.branch === 'ALL' || r.拠点 === listSearch.branch;
        let matchMethod = true;
        if (listSearch.method !== 'ALL') matchMethod = listSearch.method === 'OSS' ? isOssRecord(r) : !isOssRecord(r);
        return matchSearch && matchBranch && matchMethod;
      });
      if (rows.length === 0) { alert("出力するデータがありません。"); return; }
      let csvContent = "﻿";
      const headers = ["登録予定日", "ステータス", "顧客名", "OSS区分", "拠点", "担当者", "車種", "備考"];
      csvContent += headers.join(",") + "\n";
      rows.forEach(r => {
        const row = [r.登録予定日 || "未定", r.ステータス || "", `"${(r.顧客名 || "").replace(/"/g, '""')}"`, r.OSS区分 || "", r.拠点 || "", r.担当者 || "", `"${(r.車種 || "").replace(/"/g, '""')}"`, `"${(r.備考 || "").replace(/"/g, '""')}"`];
        csvContent += row.join(",") + "\n";
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
      link.setAttribute("href", url);
      link.setAttribute("download", `registration_data_${carType}_${dateStr}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // ▼ すぐに起動する（以前は window.onload で、外部のアイコン用CSS・フォントの読み込み完了まで待っていたため、
    //   それらが遅い・届かない環境では画面が真っ白のままになっていた）。このスクリプトは body の最後にあるので、
    //   この時点で画面の要素はそろっている。
    try {
      render(); loadData(); loadCalendarNotices(); if (LINKED_NAME) loadMypageData();
    } catch (e) {
      window.__showBootError && window.__showBootError(String(e && e.stack || e));
    }
  </script>
</body>
