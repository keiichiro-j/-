<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登録カレンダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1A1F36; --ink-2: #4B5468; --muted: #8790A3; --border: #D9DEE5;
      --canvas: #F3F4F7; --surface: #FFFFFF; --surface-2: #F7F8FA; --hairline: #E6E8EE;
      --accent: #3B4FD1; --accent-bg: #EEF1FD; --accent-ink: #2E3FB0; --panel-bg: #F7F8FE;
      --oss: #16924F; --oss-bg: #E7F7EE;
      --paper: #D6392E; --paper-bg: #FCEAE8;
      --sat-bg: #E8F0FE; --sat-ink: #2A5BD1;
      --sun-bg: #FCE9F1; --sun-ink: #C93E77;
      --holi-bg: #E7F7EE; --holi-ink: #189255;
      --notice: #C2790E; --notice-bg: #FBEFDD;
      --shadow-sm: 0 1px 2px rgba(26,31,54,0.05), 0 1px 4px rgba(26,31,54,0.04);
      --shadow-md: 0 2px 6px rgba(26,31,54,0.05), 0 10px 24px -10px rgba(26,31,54,0.16);
      --shadow-lg: 0 6px 16px rgba(26,31,54,0.06), 0 20px 48px -16px rgba(26,31,54,0.22);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; background: var(--canvas); color: var(--ink); }
    .font-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums slashed-zero; }

    .app-shell-outer { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .app-shell { flex: 1; min-height: 0; overflow: hidden; }
    .app-row { display: flex; align-items: stretch; height: 100%; }
    .row-scroll { overflow-y: auto; }
    .row-scroll::-webkit-scrollbar { width: 6px; }
    .row-scroll::-webkit-scrollbar-thumb { background: #D7DAE2; border-radius: 10px; }

    /* -- お知らせバナー(左から右へ自動的に流れる) -- */
    .announce-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; background: var(--notice); color: #fff; padding: 8px 16px; font-size: 12px; font-weight: 700; }
    .announce-track { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
    .announce-track-inner { display: inline-flex; white-space: nowrap; animation: announce-marquee 24s linear infinite; }
    .announce-copy { display: inline-flex; align-items: center; padding-right: 48px; }
    @keyframes announce-marquee {
      from { transform: translateX(-50%); }
      to { transform: translateX(0%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .announce-track-inner { animation: none; }
    }
    .announce-item { margin-right: 4px; }
    .announce-sep { opacity: .55; margin: 0 10px; }
    .announce-close { border: none; background: rgba(255,255,255,0.2); color: #fff; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 9px; }

    /* -- コントロールパネル -- */
    .control-panel { width: 212px; flex: 0 0 212px; background: var(--panel-bg); padding: 22px 14px; display: flex; flex-direction: column; box-shadow: 1px 0 0 var(--hairline); position: relative; z-index: 2; height: 100%; overflow-y: auto; }
    .cp-header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 22px; }
    .cp-icon-mark { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; margin-bottom: 8px; overflow: hidden; }
    .cp-icon-mark img { width: 100%; height: 100%; object-fit: cover; }
    .cp-logo { font-size: 13px; font-weight: 800; color: var(--ink); margin-bottom: 2px; letter-spacing: -0.005em; }
    .cp-logo-sub { font-size: 10.5px; color: var(--muted); font-weight: 600; }
    .cp-nav { display: flex; flex-direction: column; gap: 3px; flex: 1; }
    .cp-nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); text-align: left; border: none; background: transparent; cursor: pointer; width: 100%; transition: background .12s ease, color .12s ease; }
    .cp-nav-item i { width: 15px; text-align: center; font-size: 13px; color: var(--muted); }
    .cp-nav-item:hover { background: var(--surface); color: var(--ink); }
    .cp-nav-item.active { background: var(--accent-bg); color: var(--accent-ink); box-shadow: inset 3px 0 0 var(--accent); }
    .cp-nav-item.active i { color: var(--accent-ink); }
    .cp-subnav { position: relative; display: flex; flex-direction: column; gap: 1px; padding: 2px 4px 8px 31px; }
    .cp-subnav::before {
      content: ''; position: absolute; left: 18px; top: -4px; bottom: 21px; width: 1px; background: var(--border);
    }
    .cp-subnav-item { position: relative; border: none; background: transparent; text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 5px 8px; border-radius: 5px; cursor: pointer; transition: background .12s ease, color .12s ease; }
    .cp-subnav-item::before {
      content: ''; position: absolute; left: -13px; top: 50%; width: 9px; height: 1px; background: var(--border);
    }
    .cp-subnav-item:hover { color: var(--ink-2); }
    .cp-subnav-item.active { color: var(--accent-ink); font-weight: 700; background: var(--accent-bg); }
    .cp-subnav-item.active::before { background: var(--accent); }
    .mobile-only-nav { display: none; }
    .cp-footer { padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--hairline); }
    .cp-user { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
    .cp-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: 0 0 28px; }
    .cp-user-name { font-size: 11.5px; font-weight: 700; color: var(--ink); line-height: 1.3; word-break: break-all; }
    .cp-user-email { font-size: 9px; color: var(--muted); line-height: 1.3; word-break: break-all; }
    .cp-role-badge { font-size: 9.5px; font-weight: 700; border-radius: 6px; padding: 5px 9px; display: block; width: 100%; text-align: left; }
    .cp-role-badge.editor { background: var(--oss-bg); color: var(--oss); }
    .cp-role-badge.general { background: #EEF0F3; color: #7C8496; }

    .main-col { flex: 1; min-width: 0; padding: 20px 24px 20px; display: flex; flex-direction: column; height: 100%; overflow: hidden; gap: 12px; }
    .page-fill-area { flex: 1; min-height: 0; overflow-y: auto; }
    .page-title { font-size: 17px; font-weight: 800; color: var(--ink); letter-spacing: -0.005em; }
    .page-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; font-weight: 500; }

    .tabbar { display: inline-flex; gap: 2px; background: var(--surface-2); border-radius: 7px; padding: 3px; border: 1px solid var(--hairline); }
    .tab { font-size: 12px; font-weight: 600; border-radius: 5px; padding: 6px 14px; cursor: pointer; color: var(--muted); border: none; background: transparent; transition: background .12s ease, color .12s ease; }
    .tab:hover { color: var(--ink-2); }
    .tab-active { background: var(--surface); color: var(--accent-ink); font-weight: 700; box-shadow: var(--shadow-sm); }
    .nav-btn { font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--ink-2); cursor: pointer; transition: background .12s ease, border-color .12s ease, color .12s ease; }
    .nav-btn:hover { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-ink); }
    .today-btn { font-size: 11px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 11px; color: var(--ink-2); cursor: pointer; transition: background .12s ease, border-color .12s ease, color .12s ease; }
    .today-btn:hover { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-ink); }
    .action-btn { font-size: 11px; font-weight: 700; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: filter .12s ease; }
    .action-btn:hover { filter: brightness(0.92); }
    .cartype-pill { font-size: 10.5px; font-weight: 800; letter-spacing: .01em; padding: 6px 12px; border-radius: 6px; background: var(--accent); color: #fff; display: inline-flex; align-items: center; gap: 6px; }

    /* -- KPIタイル -- */
    .kpi-section { flex: 0 0 auto; }
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
    .kpi-row-top { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 10px; }
    .kpi-row-bottom { grid-template-columns: repeat(7, 1fr); }
    .kpi-row-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 2px 6px; }
    .kpi-tile { background: var(--surface); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow-sm); }
    .kpi-tile-accent { background: var(--accent-bg); }
    .kpi-label { font-size: 10.5px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .kpi-value { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums slashed-zero; font-size: 20px; font-weight: 700; color: var(--ink); margin-top: 4px; }
    .kpi-unit { font-size: 10.5px; font-weight: 600; color: var(--muted); margin-left: 3px; font-family: 'Noto Sans JP',sans-serif; }

    /* -- カレンダー行 -- */
    .date-row { display: flex; align-items: stretch; min-height: 76px; border-bottom: 1px solid var(--hairline); }
    .date-row.has-notice { min-height: 96px; }
    .date-col { width: 58px; flex: 0 0 58px; display: flex; align-items: center; justify-content: center; }
    .content-col-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .content-col { flex: 1; min-width: 0; padding: 10px 10px; display: flex; align-items: center; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth; }
    .content-col::-webkit-scrollbar { display: none; }
    .day-entries-track { display: flex; gap: 8px; align-items: center; }
    .date-badge { position: relative; text-align: center; border-radius: 8px; padding: 5px 8px; }
    .date-badge .d-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums slashed-zero; font-size: 15.5px; font-weight: 700; line-height: 1; }
    .date-badge .d-dow { font-size: 9px; font-weight: 600; margin-top: 3px; }
    .date-badge .d-tag { font-size: 8px; font-weight: 700; margin-top: 2px; opacity: 0.9; }
    .date-row.is-today { background: var(--accent-bg); }
    .day-notice-banner { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; background: var(--notice-bg); color: var(--notice); font-size: 11px; font-weight: 700; line-height: 1.4; padding: 5px 12px; border-radius: 7px; margin: 8px 10px 0; }
    .day-notice-banner i { flex: 0 0 auto; }

    /* -- 登録カード -- */
    .entry-card { background: var(--surface); border-radius: 7px; padding: 8px 11px; flex: 0 0 178px; width: 178px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; cursor: pointer; scroll-snap-align: start; border: 1px solid var(--hairline); transition: box-shadow .12s ease, border-color .12s ease; }
    .entry-card:hover { box-shadow: var(--shadow-md); border-color: var(--border); }
    .entry-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--bar-color, var(--accent)); }
    .entry-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-left: 5px; }
    .entry-row + .entry-row { margin-top: 4px; }
    .entry-name { font-size: 12.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .entry-sales { font-size: 10.5px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .entry-model { font-size: 10.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; max-width: 76px; }
    .branch-pill { font-size: 9.5px; font-weight: 600; padding: 2px 7px; border-radius: 4px; }
    .method-pill { font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 4px; display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto; }
    .status-pill { font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 4px; display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
    .pdf-icon-btn { color: var(--paper); font-size: 12px; flex: 0 0 auto; cursor: pointer; }
    .slide-hint { position: sticky; right: 2px; flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-md); border: none; color: var(--accent-ink); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; }

    /* -- カレンダーカード / オーバーレイ未定リスト -- */
    .calendar-card { position: relative; background: var(--surface); border-radius: 12px; padding: 16px 18px; overflow: hidden; box-shadow: var(--shadow-md); display: flex; flex-direction: column; flex: 1; min-height: 0; min-width: 0; border: 1px solid var(--hairline); }
    .rowscroll-wrap { position: relative; flex: 1; min-height: 0; display: flex; }
    .cal-overlay-backdrop { position: absolute; inset: 0; background: rgba(26,31,54,0.32); z-index: 5; }
    .cal-overlay-panel { position: absolute; top: 0; right: 0; bottom: 0; width: 216px; background: var(--surface); box-shadow: var(--shadow-lg); z-index: 6; padding: 14px; display: flex; flex-direction: column; border-left: 1px solid var(--hairline); }
    .sales-tag { font-size: 10px; font-weight: 600; color: #9AA1B0; display: flex; align-items: center; gap: 5px; margin: 9px 0 6px; text-transform: uppercase; letter-spacing: .03em; }
    .pending-toggle-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 700;
      padding: 6px 12px; border-radius: 6px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
      cursor: pointer; transition: border-color .12s ease, color .12s ease, background .12s ease;
      margin-left: 8px; position: relative;
    }
    .pending-toggle-btn::before { content: ''; position: absolute; left: -9px; top: 50%; transform: translateY(-50%); width: 1px; height: 16px; background: var(--hairline); }
    .pending-toggle-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
    .pending-toggle-btn.open { color: var(--accent-ink); background: var(--accent-bg); border-color: var(--accent); }
    .pending-toggle-count { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums slashed-zero; font-size: 10.5px; font-weight: 800; background: var(--surface-2); border-radius: 5px; padding: 2px 7px; }
    .pending-toggle-btn.open .pending-toggle-count { background: rgba(255,255,255,0.65); }

    /* -- マイページ -- */
    .mp-list { display: flex; flex-direction: column; gap: 5px; }
    .mp-row { display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: 8px; padding: 10px 14px; box-shadow: var(--shadow-sm); cursor: pointer; border: 1px solid var(--hairline); transition: box-shadow .12s ease, border-color .12s ease; }
    .mp-row:hover { box-shadow: var(--shadow-md); border-color: var(--border); }
    .mp-col { flex: 1; min-width: 0; display: flex; align-items: center; }
    .mp-date-chip { font-size: 10.5px; font-weight: 700; font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums slashed-zero; text-align: center; border-radius: 6px; padding: 5px 10px; }
    .mp-name { font-size: 12.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .mp-model { font-size: 11.5px; color: var(--ink-2); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .mp-pdf-btn { font-size: 10.5px; font-weight: 700; border-radius: 7px; padding: 6px 12px; display: flex; align-items: center; gap: 6px; border: none; white-space: nowrap; }
    .mp-pdf-btn.ready { background: var(--accent-bg); color: var(--accent-ink); }
    .mp-pdf-btn.waiting { background: var(--surface-2); color: #B3B8C2; cursor: default; }
    .mp-thead-row { display: flex; align-items: center; gap: 14px; padding: 4px 14px; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }

    /* -- リスト表示 -- */
    .list-table-wrap { width: 100%; overflow-x: auto; }
    .list-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .list-table thead th { text-align: left; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 8px 12px; border-bottom: 1px solid var(--hairline); position: sticky; top: 0; background: var(--surface); }
    .list-table tbody tr { border-bottom: 1px solid var(--hairline); cursor: pointer; }
    .list-table tbody tr:hover { background: var(--surface-2); }
    .list-table td { padding: 10px 12px; vertical-align: middle; }

    /* -- 設定ページ -- */
    .settings-card { background: var(--surface); border-radius: 12px; padding: 20px 22px; box-shadow: var(--shadow-md); border: 1px solid var(--hairline); }
    .settings-card-title { font-size: 13.5px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .settings-card-title i { color: var(--accent-ink); font-size: 12.5px; }
    .settings-card-desc { font-size: 11.5px; color: var(--muted); line-height: 1.65; margin-bottom: 15px; }
    .settings-group-label { margin-bottom: 6px; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    .settings-list { display: flex; flex-direction: column; gap: 5px; }
    .settings-row { display: flex; align-items: center; gap: 14px; background: var(--surface-2); border-radius: 7px; padding: 9px 13px; }
    .settings-row .s-name { font-size: 12px; font-weight: 700; color: var(--ink); flex: 1; min-width: 0; }
    .settings-row .s-email { font-size: 11.5px; color: var(--muted); font-weight: 500; flex: 1.4; min-width: 0; }
    .settings-row .s-branch { font-size: 11.5px; font-weight: 700; color: var(--ink-2); flex: 0 0 72px; }
    .settings-remove { border: none; background: transparent; color: #B7BDC9; cursor: pointer; font-size: 12px; flex: 0 0 auto; width: 22px; height: 22px; border-radius: 5px; transition: background .12s ease, color .12s ease; }
    .settings-remove:hover { background: var(--paper-bg); color: var(--paper); }
    .settings-add-row { display: flex; gap: 8px; margin-top: 13px; flex-wrap: wrap; }
    .settings-input { font-size: 12px; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 8px 11px; color: var(--ink); font-family: inherit; }
    .settings-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
    .settings-add-btn { font-size: 12px; font-weight: 700; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px 15px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: filter .12s ease; }
    .settings-add-btn:hover { filter: brightness(0.92); }
    .settings-add-btn:disabled { background: #E2E5EB; color: #A6ACB8; cursor: default; filter: none; }
    .settings-subblock { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--hairline); }
    .settings-subblock:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .theme-swatches { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 15px; }
    .theme-swatch { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 7px; padding: 9px 14px; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface); cursor: pointer; transition: border-color .12s ease, background .12s ease; }
    .theme-swatch:hover { border-color: var(--ink-2); }
    .theme-swatch.active { color: var(--accent-ink); background: var(--accent-bg); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .theme-dot { width: 13px; height: 13px; border-radius: 4px; flex: 0 0 auto; }
    .theme-save-row { display: flex; align-items: center; gap: 12px; padding-top: 15px; border-top: 1px solid var(--hairline); flex-wrap: wrap; }
    .theme-save-btn { font-size: 12.5px; font-weight: 700; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 9px 18px; cursor: pointer; transition: filter .12s ease; }
    .theme-save-btn:hover:not(:disabled) { filter: brightness(0.92); }
    .theme-save-btn:disabled { background: #E2E5EB; color: #A6ACB8; cursor: default; }
    .theme-msg { font-size: 11.5px; font-weight: 700; }
    .theme-msg.saved { color: var(--oss); }
    .theme-msg.dirty { color: #B4620D; }
    .btn-secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); padding: 9px 16px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background .12s ease, border-color .12s ease; }
    .btn-secondary:hover { background: var(--surface); border-color: var(--ink-2); }

    /* -- モーダル(詳細表示、お知らせ) -- */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(26,31,54,0.4); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .modal-backdrop.flex { display: flex; }
    .modal-box { background: var(--surface); border-radius: 12px; width: 100%; box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; border-top: 3px solid var(--accent); }
    .modal-head { background: var(--surface-2); padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--hairline); position: sticky; top: 0; }
    .modal-title { font-size: 14px; font-weight: 800; color: var(--ink); }
    .modal-close { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
    .detail-row { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { flex: 0 0 92px; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding-top: 2px; }
    .detail-value { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; color: var(--ink); word-break: break-word; }

    @media (max-width: 860px) {
      .app-shell-outer { height: auto; overflow: visible; }
      .app-shell { height: auto; overflow: visible; }
      .app-row { flex-direction: column; height: auto; }
      .control-panel { width: 100%; flex: 0 0 auto; height: auto; flex-direction: row; align-items: center; padding: 12px 14px; overflow-x: auto; }
      .cp-header { flex-direction: row; margin-bottom: 0; margin-right: 16px; }
      .cp-icon-mark { margin-bottom: 0; margin-right: 8px; width: 32px; height: 32px; font-size: 13px; }
      .cp-logo-sub { display: none; }
      .cp-nav { flex-direction: row; flex: 0 0 auto; }
      .cp-subnav { flex-direction: row; padding: 0 0 0 6px; }
      .cp-subnav::before, .cp-subnav-item::before { display: none; }
      .cp-footer { display: none; }
      .mobile-only-nav { display: flex; }
      .calendar-hero { display: none; }
      .main-col { height: auto; overflow: visible; padding: 16px; }
      .page-fill-area { overflow-y: visible; }
      .calendar-card { flex: 0 0 auto; }
      .rowscroll-wrap { flex: 0 0 auto; }
      #rowScroll { max-height: 60vh; }
      .list-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .list-table { min-width: 640px; }
      .mp-thead-row { display: none; }
      .mp-row { flex-wrap: wrap; gap: 8px 10px; }
      .mp-col { flex: 1 1 45%; min-width: 110px; }
      .mp-col.mp-name, .mp-col.mp-model { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div id="app-root"></div>

  <!-- 登録内容の詳細表示（閲覧専用。登録・編集はスプレッドシートで行います） -->
  <div id="recordModal" class="modal-backdrop">
    <div class="modal-box" style="max-width: 460px;">
      <div class="modal-head">
        <h3 class="modal-title">登録内容</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="recordDetailBody" style="padding: 8px 22px 20px;"></div>
    </div>
  </div>

  <script>
    // ▼ サーバー(Code.gs)がテンプレート変数として埋め込む値
    const IS_EDITOR = <?!= isEditor ? 'true' : 'false' ?>;
    const CURRENT_USER_EMAIL = <?!= JSON.stringify(userEmail || '') ?>;
    const INITIAL_THEME = <?!= JSON.stringify(initialTheme || 'indigo') ?>;
    const INITIAL_SIDE_ICON_URL = <?!= JSON.stringify(initialSideIconUrl || '') ?>;
    const INITIAL_SIDE_ICON_FOLDER_ID = <?!= JSON.stringify(initialSideIconFolderId || '') ?>;
    const LINKED_NAME = <?!= JSON.stringify(linkedName || '') ?>;
    const LINKED_CAR_TYPE = <?!= JSON.stringify(linkedCarType || '') ?>;
    const INITIAL_ANNOUNCEMENTS_NEW = <?!= JSON.stringify(initialAnnouncementsNew || []) ?>;
    const INITIAL_ANNOUNCEMENTS_USED = <?!= JSON.stringify(initialAnnouncementsUsed || []) ?>;
    const INITIAL_PDF_FOLDER_NEW = <?!= JSON.stringify(initialPdfFolderNew || '') ?>;
    const INITIAL_PDF_FOLDER_USED = <?!= JSON.stringify(initialPdfFolderUsed || '') ?>;

    const CAR_TYPES = ['新車', '中古車'];

    const branchColors = {
      '岐阜': { c: '#3B4FD1', bg: '#EEF1FD' }, '大垣': { c: '#16924F', bg: '#E7F7EE' },
      '多治見': { c: '#7C3AED', bg: '#F2ECFC' }, '高山': { c: '#C2790E', bg: '#FBEFDD' },
      'AAA': { c: '#C93E77', bg: '#FBEAF1' }, 'デモカー': { c: '#0C7C8C', bg: '#E6F4F6' }, 'その他': { c: '#66707E', bg: '#EFF1F3' },
    };
    const branchOrder = Object.keys(branchColors);
    function branchOrderFor(type) {
      return type === '中古車' ? branchOrder.filter(b => b !== 'デモカー') : branchOrder;
    }
    const dow = ['日', '月', '火', '水', '木', '金', '土'];

    // ステータス(スプレッドシート側のプルダウンと一致させること)。「登録予定日確定」以外は未定リスト扱い。
    const STATUS_CONFIRMED = '登録予定日確定';
    const LEGACY_CONFIRMED_STATUSES = ['登録日確定']; // 移行期間中の旧ステータス名もカレンダーに表示する
    function isConfirmedStatus(status) {
      return status === STATUS_CONFIRMED || LEGACY_CONFIRMED_STATUSES.indexOf(status) !== -1;
    }

    // panelBg: コントロールパネル全体に敷く、accentBgよりさらに薄いテーマ色の下地。
    // これによりアクティブなナビ項目(accentBg)との2段階の濃淡差が生まれ、パネル全体が
    // テーマカラーで染まって見えるようになる。
    const THEMES = {
      indigo: { name: 'インディゴ', accent: '#3B4FD1', accentBg: '#EEF1FD', accentInk: '#2E3FB0', panelBg: '#F7F8FE' },
      green: { name: 'グリーン', accent: '#16924F', accentBg: '#E7F7EE', accentInk: '#0F7A3D', panelBg: '#F4FBF7' },
      charcoal: { name: 'チャコール', accent: '#33333D', accentBg: '#E9E9EC', accentInk: '#202027', panelBg: '#F6F6F7' },
      amber: { name: 'アンバー', accent: '#C2790E', accentBg: '#FBEFDD', accentInk: '#9C610A', panelBg: '#FDF7EE' },
      rose: { name: 'ローズ', accent: '#C93E77', accentBg: '#FBEAF1', accentInk: '#A62D60', panelBg: '#FDF4F7' },
      teal: { name: 'ティール', accent: '#0C7C8C', accentBg: '#E6F4F6', accentInk: '#0A6672', panelBg: '#F2F9FA' },
      purple: { name: 'パープル', accent: '#7C3AED', accentBg: '#F2ECFC', accentInk: '#6425C7', panelBg: '#F8F5FE' },
      slate: { name: 'スレート', accent: '#4B5468', accentBg: '#EEF0F3', accentInk: '#333A4A', panelBg: '#F6F7F9' },
    };

    let currentTheme = THEMES[INITIAL_THEME] ? INITIAL_THEME : 'indigo';
    let pendingTheme = currentTheme;
    let themeMessage = '';
    let sidePanelIconUrl = INITIAL_SIDE_ICON_URL;
    let sideIconFolderId = INITIAL_SIDE_ICON_FOLDER_ID;

    function applyTheme(key) {
      const t = THEMES[key];
      const root = document.documentElement.style;
      root.setProperty('--accent', t.accent);
      root.setProperty('--accent-bg', t.accentBg);
      root.setProperty('--accent-ink', t.accentInk);
      root.setProperty('--panel-bg', t.panelBg);
    }

    // ---- 日本の祝日判定(固定日＋ハッピーマンデー＋春分/秋分＋振替休日/国民の休日) ----
    function computeJapaneseHolidays(year) {
      const map = {};
      const set = (mo, d, name) => { map[mo + '-' + d] = name; };
      const nthMonday = (mo, n) => {
        let count = 0;
        for (let d = 1; d <= 31; d++) {
          const dt = new Date(year, mo - 1, d);
          if (dt.getMonth() !== mo - 1) break;
          if (dt.getDay() === 1) { count++; if (count === n) return d; }
        }
      };
      const springEq = Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      const autumnEq = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      set(1, 1, '元日'); set(1, nthMonday(1, 2), '成人の日'); set(2, 11, '建国記念の日'); set(2, 23, '天皇誕生日');
      set(3, springEq, '春分の日'); set(4, 29, '昭和の日'); set(5, 3, '憲法記念日'); set(5, 4, 'みどりの日'); set(5, 5, 'こどもの日');
      set(7, nthMonday(7, 3), '海の日'); set(8, 11, '山の日'); set(9, nthMonday(9, 3), '敬老の日'); set(9, autumnEq, '秋分の日');
      set(10, nthMonday(10, 2), 'スポーツの日'); set(11, 3, '文化の日'); set(11, 23, '勤労感謝の日');
      const keyToDate = (key) => { const [mo, d] = key.split('-').map(Number); return new Date(year, mo - 1, d); };
      const dateToKey = (dt) => (dt.getMonth() + 1) + '-' + dt.getDate();
      Object.keys(map).forEach(key => {
        const dt = keyToDate(key);
        const next2 = new Date(dt); next2.setDate(dt.getDate() + 2);
        if (next2.getFullYear() !== year) return;
        const between = new Date(dt); between.setDate(dt.getDate() + 1);
        const betweenKey = dateToKey(between), next2Key = dateToKey(next2);
        if (!map[betweenKey] && map[next2Key] && between.getDay() !== 0) map[betweenKey] = '国民の休日';
      });
      Object.keys(map).slice().forEach(key => {
        const dt = keyToDate(key);
        if (dt.getDay() !== 0) return;
        let cursor = new Date(dt);
        do { cursor.setDate(cursor.getDate() + 1); } while (map[dateToKey(cursor)] && cursor.getFullYear() === year);
        if (cursor.getFullYear() === year) map[dateToKey(cursor)] = '振替休日';
      });
      return map;
    }
    let holidayCache = {};
    function holidayName(year, month, day) {
      if (!holidayCache[year]) holidayCache[year] = computeJapaneseHolidays(year);
      return holidayCache[year][(month + 1) + '-' + day] || null;
    }

    // ---- データ ----
    // 担当者マスタで担当車両区分が紐づいていれば、アプリを開いた瞬間からそのカレンダーを表示する
    let carType = CAR_TYPES.indexOf(LINKED_CAR_TYPE) !== -1 ? LINKED_CAR_TYPE : '新車';
    let allRecords = [];
    let currentDate = new Date();
    let currentPage = 'calendar';
    let calendarViewMode = 'calendar'; // calendar | list
    let sidebarOpen = false; // 未定リストは開いた直後は非表示
    let listSearch = { keyword: '', branch: 'ALL', method: 'ALL' };

    let myPageMonthOffset = 0;
    let mpSearch = { name: '', method: '全て' };
    let mypageRecords = []; // マイページは新車・中古車を横断して表示する

    let mypageLinks = [];
    let mypageLinksDirty = false;
    let mypageLinksMsg = '';

    // お知らせは新車・中古車で別々に保持する。バナーには現在表示中のcarTypeの分だけを出す。
    let announcementsByType = { '新車': INITIAL_ANNOUNCEMENTS_NEW.slice(), '中古車': INITIAL_ANNOUNCEMENTS_USED.slice() };
    let announceBarVisible = true;
    let announceEditCarType = carType; // 設定ページ「お知らせ設定」で編集対象に選んでいる車両区分
    let pendingAnnouncements = announcementsByType[announceEditCarType].slice();
    let announceDirty = false;
    let announceMsg = '';

    let pdfFolderIds = { '新車': INITIAL_PDF_FOLDER_NEW, '中古車': INITIAL_PDF_FOLDER_USED };

    let calendarNotices = []; // 現在表示中のカレンダー(carType×年月)の案内一覧

    let calSettingsCarType = '新車';
    let calSettingsYear = new Date().getFullYear();
    let calSettingsMonth = new Date().getMonth();
    let calSettingsNotices = [];
    let calSettingsDirty = false;
    let calSettingsMsg = '';

    function isOssRecord(r) { return r.OSS区分 === 'OSS'; }
    function hasPdfLink(r) { return !!r.車検証リンク; }
    function methodPill(oss) {
      return `<span class="method-pill" style="background:${oss ? 'var(--oss-bg)' : 'var(--paper-bg)'};color:${oss ? 'var(--oss)' : 'var(--paper)'};"><i class="fa-solid ${oss ? 'fa-bolt' : 'fa-file-lines'}"></i>${oss ? 'OSS' : '紙'}</span>`;
    }
    function parseYMD(str) {
      const [y, m, d] = String(str).split('-').map(Number);
      return { y, m: m - 1, d };
    }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function dateStrOf(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }
    function recordDataAttr(r) { return `data-record="${escapeAttr(JSON.stringify(r))}"`; }

    // ---- データ取得 ----
    function loadData() {
      if (typeof google === 'undefined') return;
      google.script.run
        .withSuccessHandler(function (data) {
          allRecords = data || [];
          render();
        })
        .withFailureHandler(function (error) {
          alert("データの取得に失敗しました: " + (error && error.message ? error.message : error));
        })
        .getRegistrationData(carType);
    }

    // ▼ マイページは新車・中古車を横断して表示するため、カレンダー側のcarType切り替えとは
    //   独立して、両方の車両区分をまとめたデータを一度だけ取得する。
    function loadMypageData() {
      if (typeof google === 'undefined') return;
      google.script.run
        .withSuccessHandler(function (data) {
          mypageRecords = data || [];
          if (currentPage === 'mypage') renderMpResults();
        })
        .withFailureHandler(function (error) {
          console.error("マイページデータの取得に失敗しました: ", error);
        })
        .getAllRegistrationData();
    }

    function loadCalendarNotices() {
      if (typeof google === 'undefined') return;
      const year = currentDate.getFullYear(), month = currentDate.getMonth();
      google.script.run
        .withSuccessHandler(function (list) { calendarNotices = list || []; render(); })
        .withFailureHandler(function () { calendarNotices = []; })
        .getCalendarNotices(carType, year, month);
    }

    // ---- カレンダー用データ組み立て ----
    function buildDayEntries(year, month) {
      const map = {};
      allRecords.forEach(r => {
        if (!isConfirmedStatus(r.ステータス) || !r.登録予定日) return;
        const { y, m, d } = parseYMD(r.登録予定日);
        if (y !== year || m !== month) return;
        map[d] = map[d] || [];
        map[d].push(r);
      });
      return map;
    }
    function pendingRecords() {
      const year = currentDate.getFullYear(), month = currentDate.getMonth();
      return allRecords.filter(r => {
        if (isConfirmedStatus(r.ステータス)) return false;
        if (r._sheetYear == null || r._sheetMonth == null) return true;
        return r._sheetYear === year && r._sheetMonth === month;
      });
    }

    function computeSummaryStats(year, month) {
      const monthData = allRecords.filter(r => {
        if (!r.登録予定日) return false;
        const { y, m } = parseYMD(r.登録予定日);
        return y === year && m === month;
      });
      const undecided = pendingRecords();
      const combined = monthData.concat(undecided);
      const total = combined.length;
      const ossCount = combined.filter(isOssRecord).length;
      const ossRate = total > 0 ? Math.round((ossCount / total) * 100) : 0;
      const perBranch = {};
      branchOrder.forEach(b => { perBranch[b] = 0; });
      combined.forEach(r => { const b = branchColors[r.拠点] ? r.拠点 : 'その他'; perBranch[b] = (perBranch[b] || 0) + 1; });
      return { total, ossCount, ossRate, perBranch };
    }

    function calendarNoticesForDate(dateStr) {
      return calendarNotices.filter(n => n.date === dateStr);
    }

    function entryCard(r) {
      const c = branchColors[r.拠点] || branchColors['その他'];
      const pdfIcon = hasPdfLink(r)
        ? `<span class="js-pdf-link pdf-icon-btn" title="車検証PDFを開く" data-url="${escapeAttr(r.車検証リンク)}"><i class="fa-solid fa-file-pdf"></i></span>` : '';
      return `<div class="entry-card js-open-record" ${recordDataAttr(r)} style="--bar-color:${c.c};">
        <div class="entry-row">
          <span class="entry-name">${escapeHtml(r.顧客名)}</span>
          ${pdfIcon}
          ${methodPill(isOssRecord(r))}
        </div>
        <div class="entry-row">
          <span class="entry-sales"><i class="fa-solid fa-user" style="font-size:8px;margin-right:3px;"></i>${escapeHtml(r.担当者 || '-')}</span>
          <span class="entry-model">${escapeHtml(r.車種 || '')}</span>
        </div>
      </div>`;
    }

    function dateRowHTML(dayEntries, year, month, day) {
      const d = new Date(year, month, day);
      const dowIdx = d.getDay();
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const isToday = d.getTime() === today.getTime();
      const holiday = holidayName(year, month, day);
      const entries = dayEntries[day] || [];
      const hasOverflow = entries.length > 8;
      const dateStr = dateStrOf(year, month, day);
      const notices = calendarNoticesForDate(dateStr);

      let rowBg = '', ink = 'var(--ink-2)', tagText = '', badgeFill = 'transparent', badgeTextColor;
      if (dowIdx === 6) { rowBg = 'var(--sat-bg)'; ink = 'var(--sat-ink)'; }
      if (dowIdx === 0) { rowBg = 'var(--sun-bg)'; ink = 'var(--sun-ink)'; }
      if (holiday) { rowBg = 'var(--holi-bg)'; ink = 'var(--holi-ink)'; tagText = holiday; }
      badgeTextColor = ink;
      let extraClass = '';
      if (isToday) { extraClass = ' is-today'; ink = 'var(--accent-ink)'; badgeFill = 'var(--accent)'; badgeTextColor = '#fff'; rowBg = ''; }

      const hintBtn = hasOverflow ? `<button type="button" class="slide-hint" title="横にスライドしてさらに表示"><i class="fa-solid fa-chevron-right"></i></button>` : '';
      const content = entries.length === 0
        ? ``
        : `<div class="day-entries-track">${entries.map(entryCard).join('')}${hintBtn}</div>`;
      const hasNotice = notices.length > 0;
      const noticeBanner = hasNotice
        ? `<div class="day-notice-banner"><i class="fa-solid fa-clipboard-list"></i><span>${notices.map(n => escapeHtml(n.text)).join('　・　')}</span></div>`
        : '';

      return `<div data-day="${day}" data-today="${isToday}" class="date-row${extraClass}${hasNotice ? ' has-notice' : ''}" style="${rowBg ? `background:${rowBg};` : ''}">
        <div class="date-col">
          <div class="date-badge" style="background:${badgeFill};">
            <div class="d-num" style="color:${badgeTextColor};">${day}</div>
            <div class="d-dow" style="color:${isToday ? 'rgba(255,255,255,0.85)' : ink};">${dow[dowIdx]}</div>
            ${tagText ? `<div class="d-tag" style="color:${isToday ? 'rgba(255,255,255,0.85)' : ink};">祝</div>` : ''}
          </div>
        </div>
        <div class="content-col-wrap">
          ${noticeBanner}
          <div class="content-col">${content}</div>
        </div>
      </div>`;
    }

    function calendarHeaderHTML(showPendingToggle) {
      const year = currentDate.getFullYear(), month = currentDate.getMonth();
      const pendingToggleBtn = showPendingToggle ? `
        <button type="button" class="pending-toggle-btn${sidebarOpen ? ' open' : ''}" id="sideTabToggle" title="未定リストの表示切り替え">
          <i class="fa-solid fa-layer-group"></i>未定リスト
          <span class="pending-toggle-count">${pendingRecords().length}</span>
        </button>
      ` : '';
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span class="cartype-pill"><i class="fa-solid ${carType === '中古車' ? 'fa-car-side' : 'fa-car'}"></i>${carType}</span>
            <div class="tabbar">
              <button type="button" class="tab ${calendarViewMode === 'calendar' ? 'tab-active' : ''}" data-viewmode="calendar">カレンダー</button>
              <button type="button" class="tab ${calendarViewMode === 'list' ? 'tab-active' : ''}" data-viewmode="list">リスト</button>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span class="font-num" style="font-size:18px;font-weight:700;">${month + 1}<span style="font-size:12px;font-weight:600;color:var(--muted);margin:0 6px 0 1px;font-family:'Noto Sans JP',sans-serif;">月</span><span style="font-size:12px;font-weight:600;color:var(--muted);font-family:'Noto Sans JP',sans-serif;">${year}</span></span>
            <button type="button" class="today-btn" id="btnToday">今日</button>
            <button type="button" class="nav-btn" id="btnPrevMonth"><i class="fa-solid fa-chevron-left"></i></button>
            <button type="button" class="nav-btn" id="btnNextMonth"><i class="fa-solid fa-chevron-right"></i></button>
            ${pendingToggleBtn}
          </div>
        </div>
      `;
    }

    function calendarRowsHTML() {
      const year = currentDate.getFullYear(), month = currentDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const dayEntries = buildDayEntries(year, month);
      let rows = '';
      for (let d = 1; d <= daysInMonth; d++) rows += dateRowHTML(dayEntries, year, month, d);
      return rows;
    }

    function heroSummaryHTML() {
      const year = currentDate.getFullYear(), month = currentDate.getMonth();
      const { total, ossCount, ossRate } = computeSummaryStats(year, month);
      return `
        <div class="kpi-section">
          <div class="kpi-row kpi-row-top">
            <div class="kpi-tile kpi-tile-accent">
              <div class="kpi-label">${month + 1}月 総登録台数</div>
              <div class="kpi-value">${total}<span class="kpi-unit">台</span></div>
            </div>
            <div class="kpi-tile">
              <div class="kpi-label">OSS登録台数</div>
              <div class="kpi-value" style="color:var(--oss);">${ossCount}<span class="kpi-unit">台</span></div>
            </div>
            <div class="kpi-tile">
              <div class="kpi-label">OSS登録率</div>
              <div class="kpi-value">${ossRate}<span class="kpi-unit">%</span></div>
            </div>
          </div>
        </div>
      `;
    }

    function branchSummaryHTML() {
      const year = currentDate.getFullYear(), month = currentDate.getMonth();
      const { perBranch } = computeSummaryStats(year, month);
      const branchList = branchOrderFor(carType);
      const branchTiles = branchList.map(b => {
        const c = branchColors[b];
        return `<div class="kpi-tile">
          <div class="kpi-label"><span style="width:7px;height:7px;border-radius:50%;background:${c.c};display:inline-block;"></span>${b}</div>
          <div class="kpi-value" style="color:${c.c};">${perBranch[b]}<span class="kpi-unit">台</span></div>
        </div>`;
      }).join('');
      return `
        <div class="kpi-section">
          <div class="kpi-row-label">拠点別登録台数</div>
          <div class="kpi-row kpi-row-bottom" style="grid-template-columns:repeat(${branchList.length}, 1fr);">${branchTiles}</div>
        </div>
      `;
    }

    function pendingCardHTML(p) {
      const c = branchColors[p.拠点] || branchColors['その他'];
      return `<div class="entry-card js-open-record" ${recordDataAttr(p)} style="--bar-color:${c.c};margin-bottom:8px;">
        <div class="entry-row"><span class="entry-name">${escapeHtml(p.顧客名)}</span>${methodPill(isOssRecord(p))}</div>
        <div class="entry-row"><span class="entry-sales"><i class="fa-solid fa-user" style="font-size:8px;margin-right:3px;"></i>${escapeHtml(p.担当者 || '-')}</span><span class="entry-model">${escapeHtml(p.車種 || '')}</span></div>
      </div>`;
    }

    function pendingPanelHTML() {
      const pending = pendingRecords();
      const grouped = {};
      pending.forEach(p => {
        const branch = branchColors[p.拠点] ? p.拠点 : 'その他';
        const sales = p.担当者 || '担当者未設定';
        grouped[branch] = grouped[branch] || {};
        grouped[branch][sales] = grouped[branch][sales] || [];
        grouped[branch][sales].push(p);
      });
      const orderedBranches = branchOrder.filter(b => grouped[b]);
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;padding-bottom:13px;border-bottom:1px solid var(--hairline);flex:0 0 auto;">
          <span style="font-size:11px;font-weight:600;color:var(--ink-2);"><i class="fa-solid fa-circle-notch" style="color:var(--accent);margin-right:6px;"></i>未定リスト</span>
          <span class="font-num" style="font-size:11px;font-weight:700;background:var(--surface-2);border-radius:6px;padding:4px 10px;color:var(--ink-2);">${pending.length}件</span>
        </div>
        <div class="row-scroll" style="flex:1;min-height:0;">
          ${orderedBranches.length === 0 ? `<p style="font-size:12px;color:var(--muted);padding:12px 2px;">未定の登録はありません。</p>` : orderedBranches.map(branch => {
            const c = branchColors[branch];
            const branchCount = Object.values(grouped[branch]).reduce((s, a) => s + a.length, 0);
            return `
              <div style="display:flex;align-items:center;justify-content:space-between;margin:10px 2px 8px;">
                <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:${c.c};"><span style="width:7px;height:7px;border-radius:50%;background:${c.c};"></span>${branch}</span>
                <span class="font-num" style="font-size:10px;color:var(--muted);font-weight:600;">${branchCount}件</span>
              </div>
              ${Object.keys(grouped[branch]).map(sales => `
                <div class="sales-tag"><i class="fa-solid fa-user" style="font-size:8px;"></i>${escapeHtml(sales)}</div>
                ${grouped[branch][sales].map(pendingCardHTML).join('')}
              `).join('')}
            `;
          }).join('')}
        </div>
      `;
    }

    function calendarPageHTML() {
      if (calendarViewMode === 'list') {
        return `
          <div class="calendar-hero">${heroSummaryHTML()}</div>
          <div class="calendar-card">
            ${calendarHeaderHTML(false)}
            <div class="page-fill-area">${listViewHTML()}</div>
          </div>
        `;
      }
      return `
        <div class="calendar-hero">${heroSummaryHTML()}</div>
        <div class="calendar-card" id="calCard">
          ${calendarHeaderHTML(true)}
          <div class="rowscroll-wrap">
            <div class="row-scroll" id="rowScroll" style="flex:1;min-height:0;display:flex;flex-direction:column;">${calendarRowsHTML()}</div>
            ${sidebarOpen ? `<div class="cal-overlay-backdrop" id="overlayBackdrop"></div><div class="cal-overlay-panel">${pendingPanelHTML()}</div>` : ''}
          </div>
        </div>
      `;
    }

    function listViewHTML() {
      const kw = listSearch.keyword.toLowerCase().trim();
      let rows = allRecords.filter(r => {
        const matchSearch = kw === '' || (r.顧客名 || '').toLowerCase().includes(kw) || (r.車種 || '').toLowerCase().includes(kw);
        const matchBranch = listSearch.branch === 'ALL' || r.拠点 === listSearch.branch;
        let matchMethod = true;
        if (listSearch.method !== 'ALL') {
          matchMethod = listSearch.method === 'OSS' ? isOssRecord(r) : !isOssRecord(r);
        }
        return matchSearch && matchBranch && matchMethod;
      }).sort((a, b) => {
        if (!a.登録予定日 && !b.登録予定日) return 0;
        if (!a.登録予定日) return 1;
        if (!b.登録予定日) return -1;
        return a.登録予定日 < b.登録予定日 ? -1 : (a.登録予定日 > b.登録予定日 ? 1 : 0);
      });

      const body = rows.map(r => {
        const c = branchColors[r.拠点] || branchColors['その他'];
        const pdfIcon = hasPdfLink(r) ? `<span class="js-pdf-link pdf-icon-btn" data-url="${escapeAttr(r.車検証リンク)}"><i class="fa-solid fa-file-pdf"></i></span>` : '';
        const dateDisplay = r.登録予定日 ? r.登録予定日 : `<span class="method-pill" style="background:var(--paper-bg);color:var(--paper);">未定</span>`;
        return `<tr class="js-open-record" ${recordDataAttr(r)}>
          <td class="font-num">${dateDisplay}</td>
          <td>${escapeHtml(r.顧客名)} ${pdfIcon}</td>
          <td>${methodPill(isOssRecord(r))}</td>
          <td><span class="branch-pill" style="background:${c.bg};color:${c.c};">${r.拠点}</span> ${escapeHtml(r.担当者 || '')}</td>
          <td>${escapeHtml(r.車種 || '')}</td>
          <td style="color:var(--muted);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(r.備考 || '-')}</td>
        </tr>`;
      }).join('');

      return `
        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;">
          ${IS_EDITOR ? `<button type="button" class="action-btn" id="btnExportCsv" style="background:var(--oss);"><i class="fa-solid fa-file-csv"></i>CSV出力</button>` : ''}
          <input type="text" id="listSearchInput" class="settings-input" placeholder="顧客・車種で検索" value="${escapeAttr(listSearch.keyword)}" style="flex:1;min-width:160px;">
          <select id="listBranchFilter" class="settings-input">
            <option value="ALL" ${listSearch.branch === 'ALL' ? 'selected' : ''}>拠点: すべて</option>
            ${branchOrder.map(b => `<option value="${b}" ${listSearch.branch === b ? 'selected' : ''}>${b}</option>`).join('')}
          </select>
          <select id="listMethodFilter" class="settings-input">
            <option value="ALL" ${listSearch.method === 'ALL' ? 'selected' : ''}>方法: すべて</option>
            <option value="OSS" ${listSearch.method === 'OSS' ? 'selected' : ''}>OSS</option>
            <option value="PAPER" ${listSearch.method === 'PAPER' ? 'selected' : ''}>紙登録</option>
          </select>
        </div>
        <div class="list-table-wrap">
          <table class="list-table">
            <thead><tr><th>日付</th><th>顧客名</th><th>方法</th><th>拠点/担当者</th><th>車種</th><th>備考</th></tr></thead>
            <tbody>${body || `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px;">該当するデータがありません。</td></tr>`}</tbody>
          </table>
        </div>
      `;
    }

    // ---- マイページ ----
    function mpMonthDate(offset) { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + offset, 1); }
    function mpTheadHTML() {
      const heads = ['日付', '区分', '顧客名', 'モデル', '登録方法', 'ステータス', '車検証'];
      return `<div class="mp-thead-row">${heads.map(h => `<span class="mp-col">${h}</span>`).join('')}</div>`;
    }
    function mpRowHTML(r) {
      const monthLabel = r.登録予定日 ? r.登録予定日.slice(5).replace('-', '/') : null;
      const dateChip = monthLabel
        ? `<span class="mp-date-chip" style="background:var(--surface-2);color:var(--ink-2);">${monthLabel}</span>`
        : `<span class="mp-date-chip" style="background:var(--accent-bg);color:var(--accent-ink);">未定</span>`;
      const isUsed = r.車両区分 === '中古車';
      const typeChip = `<span class="branch-pill" style="background:${isUsed ? 'var(--notice-bg)' : 'var(--accent-bg)'};color:${isUsed ? 'var(--notice)' : 'var(--accent-ink)'};">${escapeHtml(r.車両区分 || '-')}</span>`;
      const pdfBtn = hasPdfLink(r)
        ? `<button type="button" class="mp-pdf-btn ready js-pdf-link" data-url="${escapeAttr(r.車検証リンク)}"><i class="fa-regular fa-file-pdf"></i>車検証PDF</button>`
        : `<button type="button" class="mp-pdf-btn waiting" disabled><i class="fa-regular fa-clock"></i>未アップロード</button>`;
      return `<div class="mp-row js-open-record" ${recordDataAttr(r)}>
        <span class="mp-col">${dateChip}</span>
        <span class="mp-col">${typeChip}</span>
        <span class="mp-col mp-name">${escapeHtml(r.顧客名)} 様</span>
        <span class="mp-col mp-model">${escapeHtml(r.車種 || '')}</span>
        <span class="mp-col">${methodPill(isOssRecord(r))}</span>
        <span class="mp-col"><span class="status-pill">${escapeHtml(r.ステータス || '-')}</span></span>
        <span class="mp-col">${pdfBtn}</span>
      </div>`;
    }
    function myRecordsForOffset(offset) {
      const monthDate = mpMonthDate(offset);
      const y = monthDate.getFullYear(), m = monthDate.getMonth();
      const confirmed = mypageRecords.filter(r => {
        if (r.担当者 !== LINKED_NAME || !r.登録予定日 || !isConfirmedStatus(r.ステータス)) return false;
        const p = parseYMD(r.登録予定日);
        return p.y === y && p.m === m;
      });
      const undecided = offset === 0 ? mypageRecords.filter(r => r.担当者 === LINKED_NAME && !isConfirmedStatus(r.ステータス)) : [];
      return { confirmed, undecided };
    }
    function mpApplyFilters(records) {
      const keyword = mpSearch.name.trim();
      return records.filter(r => {
        if (keyword && !(r.顧客名 || '').includes(keyword)) return false;
        if (mpSearch.method === 'OSS' && !isOssRecord(r)) return false;
        if (mpSearch.method === '紙' && isOssRecord(r)) return false;
        return true;
      });
    }
    function renderMpResults() {
      const box = document.getElementById('mpResults');
      if (!box) return;
      const prevScrollTop = box.scrollTop; // 入力のたびに再構築しても、スクロール位置が先頭に戻らないようにする
      const { confirmed, undecided } = myRecordsForOffset(myPageMonthOffset);
      const records = mpApplyFilters(confirmed.concat(undecided))
        .sort((a, b) => (a.登録予定日 || 'z').localeCompare(b.登録予定日 || 'z'));
      const rowsHtml = records.map(mpRowHTML).join('');
      box.innerHTML = `${mpTheadHTML()}<div class="mp-list">${rowsHtml || `<p style="font-size:12px;color:var(--muted);padding:16px 14px;">該当する登録データがありません。</p>`}</div>`;
      box.scrollTop = prevScrollTop;
      wireRecordClicks_(box);
    }

    function mypagePageHTML() {
      if (!LINKED_NAME) {
        return `
          <div>
            <h1 class="page-title">マイページ</h1>
            <p class="page-sub">${escapeHtml(CURRENT_USER_EMAIL)}</p>
          </div>
          <div class="settings-card">
            <h2 class="settings-card-title"><i class="fa-solid fa-triangle-exclamation"></i>マイページ未連携です</h2>
            <p class="settings-card-desc">このGoogleアカウントは、まだ「担当者マスタ」でフルネームと紐づけられていません。権限者に依頼して、設定画面から氏名とこのアカウントを登録してもらってください。登録データの「担当者」欄には、登録されるフルネームと同じ表記を入力する必要があります。</p>
          </div>
        `;
      }
      const monthDate = mpMonthDate(myPageMonthOffset);
      const monthLabel = `${monthDate.getFullYear()}年${monthDate.getMonth() + 1}月`;
      const { confirmed, undecided } = myRecordsForOffset(myPageMonthOffset);
      const total = confirmed.length + undecided.length;
      const ossRate = total > 0 ? Math.round(confirmed.concat(undecided).filter(isOssRecord).length / total * 100) : 0;

      return `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="cp-avatar" style="width:38px;height:38px;flex:0 0 38px;font-size:14px;">${LINKED_NAME[0] || '?'}</div>
            <div>
              <h1 class="page-title">マイページ</h1>
              <p class="page-sub">${escapeHtml(LINKED_NAME)} さんの受注・登録状況（新車・中古車 合算）</p>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <button type="button" class="nav-btn" id="mpPrev"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="font-num" style="font-size:14px;font-weight:700;min-width:92px;text-align:center;display:inline-block;">${monthLabel}</span>
            <button type="button" class="nav-btn" id="mpNext"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
        <div class="grid grid-cols-4 gap-3 mb-4">
          <div class="kpi-tile"><div class="kpi-label">受注台数</div><div class="kpi-value">${total}<span class="kpi-unit">台</span></div></div>
          <div class="kpi-tile"><div class="kpi-label">登録済み</div><div class="kpi-value" style="color:var(--accent-ink);">${confirmed.length}<span class="kpi-unit">件</span></div></div>
          <div class="kpi-tile"><div class="kpi-label">未定</div><div class="kpi-value" style="color:#B4620D;">${undecided.length}<span class="kpi-unit">件</span></div></div>
          <div class="kpi-tile"><div class="kpi-label">OSS登録率</div><div class="kpi-value">${ossRate}<span class="kpi-unit">%</span></div></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
          <input id="mpSearchName" class="settings-input" placeholder="顧客名で絞り込み" value="${escapeAttr(mpSearch.name)}" style="flex:1;min-width:160px;">
          <select id="mpSearchMethod" class="settings-input">
            <option ${mpSearch.method === '全て' ? 'selected' : ''}>全て</option>
            <option ${mpSearch.method === 'OSS' ? 'selected' : ''}>OSS</option>
            <option ${mpSearch.method === '紙' ? 'selected' : ''}>紙</option>
          </select>
        </div>
        <div id="mpResults" class="page-fill-area"></div>
      `;
    }

    // ---- 設定ページ ----
    function themeSectionHTML() {
      const isDirty = pendingTheme !== currentTheme;
      let msg = '';
      if (isDirty) msg = `<span class="theme-msg dirty"><i class="fa-solid fa-circle-exclamation"></i> 未保存の変更があります</span>`;
      else if (themeMessage) msg = `<span class="theme-msg saved"><i class="fa-solid fa-circle-check"></i> ${themeMessage}</span>`;
      return `
        <div class="settings-card">
          <h2 class="settings-card-title"><i class="fa-solid fa-palette"></i>テーマ設定</h2>
          <p class="settings-card-desc">お好みのアクセントカラーを選び、「保存」を押すと反映されます。選択内容はご自身のアカウントにのみ適用され、他のユーザーには影響しません。</p>
          <div class="theme-swatches">
            ${Object.keys(THEMES).map(key => `
              <button type="button" class="theme-swatch ${pendingTheme === key ? 'active' : ''}" data-theme="${key}">
                <span class="theme-dot" style="background:${THEMES[key].accent};"></span>${THEMES[key].name}
              </button>
            `).join('')}
          </div>
          <div class="theme-save-row">
            <button type="button" class="theme-save-btn" id="themeSaveBtn" ${isDirty ? '' : 'disabled'}>保存</button>
            ${msg}
          </div>
        </div>
      `;
    }
    function iconSectionHTML() {
      if (!IS_EDITOR) return '';
      const previewInner = sidePanelIconUrl
        ? `<img src="${escapeAttr(sidePanelIconUrl)}" alt="">`
        : `<i class="fa-solid fa-car"></i>`;
      return `
        <div class="settings-card">
          <h2 class="settings-card-title"><i class="fa-solid fa-icons"></i>サイドパネルアイコン設定</h2>
          <p class="settings-card-desc">左サイドパネル上部中央に表示するアイコン画像をアップロードできます。大きな画像を選んでも自動的に一定サイズの円形アイコンとして表示されます。全ユーザーの画面に反映されます。この項目は権限者としてログインした場合のみ表示されます。</p>
          <div class="settings-subblock">
            <label style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:block;">画像の保存先 Drive フォルダ ID</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <input type="text" id="iconFolderIdInput" class="settings-input" placeholder="DriveフォルダのURLに含まれるID" value="${escapeAttr(sideIconFolderId)}" style="flex:1;min-width:220px;">
              <button type="button" class="settings-add-btn" id="saveFolderIdBtn">保存</button>
            </div>
            <p id="folderIdMsg" style="font-size:11px;font-weight:600;margin-top:6px;color:var(--muted);">${sideIconFolderId ? '' : 'アップロード前に、保存先のDriveフォルダIDを入力して保存してください。'}</p>
          </div>
          <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
            <div class="cp-icon-mark" style="width:56px;height:56px;font-size:22px;margin-bottom:0;">${previewInner}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <label class="settings-add-btn" style="cursor:pointer;">
                <i class="fa-solid fa-upload"></i>画像をアップロード
                <input type="file" id="iconFileInput" accept="image/*" style="display:none;">
              </label>
              <button type="button" class="btn-secondary" id="iconResetBtn">デフォルトに戻す</button>
            </div>
          </div>
          <p id="iconUploadMsg" style="font-size:11.5px;font-weight:700;margin-top:10px;"></p>
        </div>
      `;
    }
    function pdfFolderSectionHTML() {
      if (!IS_EDITOR) return '';
      return `
        <div class="settings-card">
          <h2 class="settings-card-title"><i class="fa-solid fa-folder-open"></i>車検証ファイル設定</h2>
          <p class="settings-card-desc">車検証PDFを自動でリンクする際に探すDriveフォルダを、新車・中古車それぞれ指定します。指定したフォルダの配下は何階層あっても自動で探索し、「2026.09」や「2026.9」のような年.月フォルダの中から、顧客名が一致するPDFを見つけてリンクします。</p>
          ${CAR_TYPES.map(t => `
            <div class="settings-subblock">
              <label style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:block;">${t}の車検証保管フォルダ ID</label>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <input type="text" class="settings-input js-pdf-folder-input" data-cartype="${t}" placeholder="DriveフォルダのURLに含まれるID" value="${escapeAttr(pdfFolderIds[t] || '')}" style="flex:1;min-width:220px;">
                <button type="button" class="settings-add-btn js-pdf-folder-save" data-cartype="${t}">保存</button>
              </div>
              <p class="js-pdf-folder-msg" data-cartype="${t}" style="font-size:11px;font-weight:600;margin-top:6px;color:var(--muted);"></p>
            </div>
          `).join('')}
        </div>
      `;
    }
    function announcementsSectionHTML() {
      if (!IS_EDITOR) return '';
      let msg = '';
      if (announceMsg) msg = `<span class="theme-msg saved"><i class="fa-solid fa-circle-check"></i> ${announceMsg}</span>`;
      else if (announceDirty) msg = `<span class="theme-msg dirty"><i class="fa-solid fa-circle-exclamation"></i> 未保存の変更があります</span>`;
      return `
        <div class="settings-card">
          <h2 class="settings-card-title"><i class="fa-solid fa-bullhorn"></i>お知らせ設定</h2>
          <p class="settings-card-desc">画面上部のバナーに表示するお知らせを管理します。新車・中古車で別々に設定でき、それぞれのカレンダーを表示しているときだけそのお知らせが表示されます。</p>
          <div style="margin-bottom:14px;">
            <select id="announceCarType" class="settings-input">
              ${CAR_TYPES.map(t => `<option value="${t}" ${announceEditCarType === t ? 'selected' : ''}>${t}のお知らせを編集</option>`).join('')}
            </select>
          </div>
          <div class="settings-list" id="announceList">
            ${pendingAnnouncements.map((a, i) => `
              <div class="settings-row">
                <span class="s-name">${escapeHtml(a.text)}</span>
                <button type="button" class="settings-remove" data-idx="${i}" data-role="announce-remove"><i class="fa-solid fa-xmark"></i></button>
              </div>
            `).join('') || `<p style="font-size:12px;color:var(--muted);padding:8px 2px;">お知らせはありません。</p>`}
          </div>
          <div class="settings-add-row">
            <input id="newAnnounceText" class="settings-input" placeholder="お知らせ内容" style="flex:1;min-width:220px;">
            <button type="button" id="addAnnounceBtn" class="settings-add-btn"><i class="fa-solid fa-plus"></i>追加</button>
          </div>
          <div class="theme-save-row">
            <button type="button" class="theme-save-btn" id="announceSaveBtn" ${announceDirty ? '' : 'disabled'}>保存</button>
            ${msg}
          </div>
        </div>
      `;
    }
    function calendarSettingsSectionHTML() {
      if (!IS_EDITOR) return '';
      let msg = '';
      if (calSettingsMsg) msg = `<span class="theme-msg saved"><i class="fa-solid fa-circle-check"></i> ${calSettingsMsg}</span>`;
      else if (calSettingsDirty) msg = `<span class="theme-msg dirty"><i class="fa-solid fa-circle-exclamation"></i> 未保存の変更があります</span>`;
      const monthOptions = Array.from({ length: 12 }, (_, i) => i);
      return `
        <div class="settings-card">
          <h2 class="settings-card-title"><i class="fa-solid fa-calendar-days"></i>カレンダー設定</h2>
          <p class="settings-card-desc">指定した月のカレンダーに表示する案内（書類提出締切日など）を、日付ごとに最大10件まで設定できます。カレンダー画面では日付の右上に案内アイコンが表示され、タップすると内容を確認できます。</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
            <select id="calSetCarType" class="settings-input">
              ${CAR_TYPES.map(t => `<option value="${t}" ${calSettingsCarType === t ? 'selected' : ''}>${t}</option>`).join('')}
            </select>
            <select id="calSetYear" class="settings-input">
              ${[calSettingsYear - 1, calSettingsYear, calSettingsYear + 1].map(y => `<option value="${y}" ${y === calSettingsYear ? 'selected' : ''}>${y}年</option>`).join('')}
            </select>
            <select id="calSetMonth" class="settings-input">
              ${monthOptions.map(m => `<option value="${m}" ${m === calSettingsMonth ? 'selected' : ''}>${m + 1}月</option>`).join('')}
            </select>
          </div>
          <div class="settings-list" id="calNoticeList">
            ${calSettingsNotices.map((n, i) => `
              <div class="settings-row">
                <input type="date" class="settings-input js-cal-notice-date" data-idx="${i}" value="${escapeAttr(n.date || '')}" style="flex:0 0 150px;">
                <input type="text" class="settings-input js-cal-notice-text" data-idx="${i}" value="${escapeAttr(n.text || '')}" placeholder="案内内容（例：書類提出締切）" style="flex:1;min-width:160px;">
                <button type="button" class="settings-remove" data-idx="${i}" data-role="calnotice-remove"><i class="fa-solid fa-xmark"></i></button>
              </div>
            `).join('') || `<p style="font-size:12px;color:var(--muted);padding:8px 2px;">案内はまだ設定されていません。</p>`}
          </div>
          <div class="settings-add-row">
            <button type="button" id="addCalNoticeBtn" class="settings-add-btn" ${calSettingsNotices.length >= 10 ? 'disabled' : ''}><i class="fa-solid fa-plus"></i>行を追加（${calSettingsNotices.length}/10）</button>
          </div>
          <div class="theme-save-row">
            <button type="button" class="theme-save-btn" id="calNoticeSaveBtn" ${calSettingsDirty ? '' : 'disabled'}>保存</button>
            ${msg}
          </div>
        </div>
      `;
    }
    function mypageLinkSectionHTML() {
      if (!IS_EDITOR) return '';
      const editors = mypageLinks.filter(u => u.isEditor);
      const general = mypageLinks.filter(u => !u.isEditor);
      let msg = '';
      if (mypageLinksMsg) msg = `<span class="theme-msg saved"><i class="fa-solid fa-circle-check"></i> ${mypageLinksMsg}</span>`;
      else if (mypageLinksDirty) msg = `<span class="theme-msg dirty"><i class="fa-solid fa-circle-exclamation"></i> 未保存の変更があります</span>`;
      const rowHtml = (u) => `
        <div class="settings-row">
          <span class="s-name">${escapeHtml(u.name)}</span>
          <span class="s-email">${escapeHtml(u.email)}</span>
          <span class="s-branch">${escapeHtml(u.branch || '-')}</span>
          <span class="s-branch">${escapeHtml(u.carType || '未設定')}</span>
          <button type="button" class="settings-remove" data-idx="${mypageLinks.indexOf(u)}" data-role="link-remove"><i class="fa-solid fa-xmark"></i></button>
        </div>`;
      return `
        <div class="settings-card">
          <h2 class="settings-card-title"><i class="fa-solid fa-user-shield"></i>担当者マスタ</h2>
          <p class="settings-card-desc">Googleアカウントごとにフルネームと拠点を登録します。マイページはこの氏名と、登録データの「担当者」欄(フルネーム入力)を照合して自分の担当案件を表示します。スプレッドシート側でも、ここに登録のない担当者名を入力すると入力セルに警告表示が出ます。「担当車両区分」を設定すると、そのアカウントでアプリを開いたときに新車/中古車どちらのカレンダーを最初に表示するかが自動で切り替わります。<b>編集権限(EDITOR_EMAILS)とは別の設定</b>で、アプリからの編集はできないため、権限者ログインアカウントとそのほかのアカウントに分けて表示しています。この項目は権限者としてログインした場合のみ表示されます。</p>
          <div class="settings-group-label">権限者ログインアカウント</div>
          <div class="settings-list" style="margin-bottom:14px;">
            ${editors.map(rowHtml).join('') || `<p style="font-size:12px;color:var(--muted);padding:4px 2px;">権限者アカウントの登録はまだありません。</p>`}
          </div>
          <div class="settings-group-label">そのほかのアカウント</div>
          <div class="settings-list" id="mypageLinkList">
            ${general.map(rowHtml).join('') || `<p style="font-size:12px;color:var(--muted);padding:4px 2px;">登録はまだありません。</p>`}
          </div>
          <div class="settings-add-row">
            <input id="newLinkName" class="settings-input" placeholder="氏名(フルネーム)" style="flex:1;min-width:120px;">
            <input id="newLinkEmail" class="settings-input" placeholder="Googleアカウント" style="flex:1.6;min-width:180px;">
            <select id="newLinkBranch" class="settings-input">
              <option value="">拠点を選択</option>
              ${branchOrder.map(b => `<option value="${b}">${b}</option>`).join('')}
            </select>
            <select id="newLinkCarType" class="settings-input">
              <option value="">初期カレンダー: 未設定</option>
              ${CAR_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}
            </select>
            <button type="button" id="addLinkBtn" class="settings-add-btn"><i class="fa-solid fa-plus"></i>追加</button>
          </div>
          <div class="theme-save-row">
            <button type="button" class="theme-save-btn" id="linkSaveBtn" ${mypageLinksDirty ? '' : 'disabled'}>保存</button>
            ${msg}
          </div>
        </div>
      `;
    }
    function settingsPageHTML() {
      return `
        <div>
          <h1 class="page-title">設定</h1>
          <p class="page-sub">${IS_EDITOR ? '各種設定を管理します' : 'テーマを設定できます'}</p>
        </div>
        <div class="page-fill-area" style="display:flex;flex-direction:column;gap:16px;">
          ${themeSectionHTML()}
          ${iconSectionHTML()}
          ${pdfFolderSectionHTML()}
          ${announcementsSectionHTML()}
          ${calendarSettingsSectionHTML()}
          ${mypageLinkSectionHTML()}
        </div>
      `;
    }

    // ---- 全体レイアウト ----
    function controlPanelHTML() {
      const navItem = (page, icon, label) => `<button type="button" class="cp-nav-item ${currentPage === page ? 'active' : ''}" data-page="${page}"><i class="fa-solid ${icon}"></i>${label}</button>`;
      const iconInner = sidePanelIconUrl ? `<img src="${escapeAttr(sidePanelIconUrl)}" alt="">` : `<i class="fa-solid fa-car"></i>`;
      const carTypeSubNav = `<div class="cp-subnav">${CAR_TYPES.map(t => `<button type="button" class="cp-subnav-item ${currentPage === 'calendar' && carType === t ? 'active' : ''}" data-cartype="${t}">${t}</button>`).join('')}</div>`;
      return `
        <div class="cp-header">
          <div class="cp-icon-mark">${iconInner}</div>
          <div class="cp-logo">AU NEW CAR</div>
          <div class="cp-logo-sub">登録カレンダー</div>
        </div>
        <div class="cp-nav">
          ${navItem('calendar', 'fa-calendar-days', 'カレンダー')}
          ${carTypeSubNav}
          <button type="button" class="cp-nav-item mobile-only-nav ${currentPage === 'dashboard' ? 'active' : ''}" data-page="dashboard"><i class="fa-solid fa-gauge-high"></i>ダッシュボード</button>
          ${navItem('mypage', 'fa-user', 'マイページ')}
          ${navItem('settings', 'fa-gear', '設定')}
        </div>
        <div class="cp-footer">
          <div class="cp-user">
            <div class="cp-avatar">${(LINKED_NAME || CURRENT_USER_EMAIL || '?')[0]}</div>
            <div><div class="cp-user-name">${escapeHtml(LINKED_NAME || CURRENT_USER_EMAIL || '未ログイン')}</div><div class="cp-user-email">${escapeHtml(CURRENT_USER_EMAIL || '')}</div></div>
          </div>
          <span class="cp-role-badge ${IS_EDITOR ? 'editor' : 'general'}">${IS_EDITOR ? '権限者' : '一般'}</span>
        </div>
      `;
    }

    function announceBannerHTML() {
      const currentAnnouncements = announcementsByType[carType] || [];
      if (!announceBarVisible || !currentAnnouncements.length) return '';
      const itemsHtml = currentAnnouncements.map(a => `<span class="announce-item">${escapeHtml(a.text)}</span>`).join('<span class="announce-sep">・</span>');
      return `<div class="announce-bar" id="announceBar">
        <i class="fa-solid fa-bullhorn" style="flex:0 0 auto;"></i>
        <div class="announce-track"><div class="announce-track-inner"><span class="announce-copy">${itemsHtml}</span><span class="announce-copy">${itemsHtml}</span></div></div>
        <button type="button" class="announce-close" id="announceCloseBtn" title="閉じる"><i class="fa-solid fa-xmark"></i></button>
      </div>`;
    }

    // ---- ダッシュボード（スマホ専用） ----
    // ▼ スマホ表示ではヘッダーのサマリーを非表示にする代わりに、登録台数・拠点別台数・
    //   未定リストをまとめて確認できるページを別途用意する。
    function dashboardPageHTML() {
      return `
        <div>
          <h1 class="page-title">ダッシュボード</h1>
          <p class="page-sub">${carType} ・ ${currentDate.getFullYear()}年${currentDate.getMonth() + 1}月の状況</p>
        </div>
        <div class="page-fill-area" style="display:flex;flex-direction:column;gap:14px;">
          ${heroSummaryHTML()}
          ${branchSummaryHTML()}
          <div class="calendar-card" style="padding:14px;">${pendingPanelHTML()}</div>
        </div>
      `;
    }

    function pageBody() {
      if (currentPage === 'mypage') return mypagePageHTML();
      if (currentPage === 'settings') return settingsPageHTML();
      if (currentPage === 'dashboard') return dashboardPageHTML();
      return calendarPageHTML();
    }

    function render() {
      document.getElementById('app-root').innerHTML = `
        <div class="app-shell-outer">
          ${announceBannerHTML()}
          <div class="app-shell">
            <div class="app-row">
              <nav class="control-panel">${controlPanelHTML()}</nav>
              <div class="main-col">${pageBody()}</div>
            </div>
          </div>
        </div>
      `;
      applyTheme(currentTheme);
      wireEvents();
      scrollTodayToTop();
      if (currentPage === 'mypage' && LINKED_NAME) renderMpResults();
    }

    function scrollTodayToTop() {
      requestAnimationFrame(() => {
        const scroller = document.getElementById('rowScroll');
        if (!scroller) return;
        const todayRow = scroller.querySelector('[data-today="true"]');
        if (todayRow) scroller.scrollTop = todayRow.offsetTop - 4;
      });
    }

    // ▼ 詳細モーダル・PDFボタンのクリックを、指定したコンテナ内の要素へまとめて割り当てる。
    //   (メインの render() 後だけでなく、検索結果だけを差し替えた後にも呼べるよう分離している)
    function wireRecordClicks_(container) {
      container.querySelectorAll('.js-open-record').forEach(el => {
        el.onclick = (e) => {
          if (e.target.closest('.js-pdf-link')) return;
          try { openModal(JSON.parse(el.dataset.record)); } catch (err) { /* ignore */ }
        };
      });
      container.querySelectorAll('.js-pdf-link').forEach(el => {
        el.onclick = (e) => { e.stopPropagation(); window.open(el.dataset.url, '_blank'); };
      });
    }

    function markDirtyBtn_(btnId) {
      const btn = document.getElementById(btnId);
      if (btn) btn.disabled = false;
    }

    function wireEvents() {
      const root = document.getElementById('app-root');

      root.querySelectorAll('.cp-nav-item').forEach(btn => {
        btn.onclick = () => {
          currentPage = btn.dataset.page;
          sidebarOpen = false;
          if (currentPage === 'settings') { loadMypageLinksIfNeeded(); loadCalSettingsNotices(); }
          render();
        };
      });
      root.querySelectorAll('[data-cartype]').forEach(btn => {
        if (btn.closest('.cp-subnav')) {
          btn.onclick = () => {
            const t = btn.dataset.cartype;
            if (t === carType && currentPage === 'calendar') return;
            carType = t; currentPage = 'calendar'; sidebarOpen = false;
            render();
            loadData();
            loadCalendarNotices();
          };
        }
      });

      root.querySelectorAll('[data-viewmode]').forEach(btn => {
        btn.onclick = () => { calendarViewMode = btn.dataset.viewmode; render(); };
      });

      const sideTab = document.getElementById('sideTabToggle');
      if (sideTab) sideTab.onclick = () => { sidebarOpen = !sidebarOpen; render(); };
      const backdrop = document.getElementById('overlayBackdrop');
      if (backdrop) backdrop.onclick = () => { sidebarOpen = false; render(); };

      const btnToday = document.getElementById('btnToday');
      if (btnToday) btnToday.onclick = () => { const now = new Date(); currentDate = new Date(now.getFullYear(), now.getMonth(), 1); render(); loadCalendarNotices(); };
      const btnPrev = document.getElementById('btnPrevMonth');
      if (btnPrev) btnPrev.onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); render(); loadCalendarNotices(); };
      const btnNext = document.getElementById('btnNextMonth');
      if (btnNext) btnNext.onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); render(); loadCalendarNotices(); };

      const announceClose = document.getElementById('announceCloseBtn');
      if (announceClose) announceClose.onclick = () => { announceBarVisible = false; render(); };

      root.querySelectorAll('.slide-hint').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const scroller = btn.closest('.content-col');
          if (scroller) scroller.scrollBy({ left: 360, behavior: 'smooth' });
        };
      });
      // 横スライドで先端まで到達したら、もう先がないことがわかるよう矢印を消す
      root.querySelectorAll('.content-col').forEach(col => {
        const hint = col.querySelector('.slide-hint');
        if (!hint) return;
        const updateHint = () => {
          const atEnd = col.scrollLeft + col.clientWidth >= col.scrollWidth - 2;
          hint.style.display = atEnd ? 'none' : '';
        };
        updateHint();
        col.addEventListener('scroll', updateHint, { passive: true });
      });
      wireRecordClicks_(root);

      // 検索/フィルター(入力中は結果だけ再描画してフォーカスを保つ)
      const searchInput = document.getElementById('listSearchInput');
      if (searchInput) searchInput.oninput = (ev) => { listSearch.keyword = ev.target.value; renderListResultsOnly(); };
      const branchFilter = document.getElementById('listBranchFilter');
      if (branchFilter) branchFilter.onchange = (ev) => { listSearch.branch = ev.target.value; render(); };
      const methodFilter = document.getElementById('listMethodFilter');
      if (methodFilter) methodFilter.onchange = (ev) => { listSearch.method = ev.target.value; render(); };
      const exportBtn = document.getElementById('btnExportCsv');
      if (exportBtn) exportBtn.onclick = downloadCSV;

      const mpPrev = document.getElementById('mpPrev');
      if (mpPrev) mpPrev.onclick = () => { myPageMonthOffset -= 1; render(); };
      const mpNext = document.getElementById('mpNext');
      if (mpNext) mpNext.onclick = () => { myPageMonthOffset += 1; render(); };
      const mpName = document.getElementById('mpSearchName');
      if (mpName) mpName.oninput = (ev) => { mpSearch.name = ev.target.value; renderMpResults(); };
      const mpMethod = document.getElementById('mpSearchMethod');
      if (mpMethod) mpMethod.onchange = (ev) => { mpSearch.method = ev.target.value; renderMpResults(); };

      root.querySelectorAll('.theme-swatch[data-theme]').forEach(btn => {
        btn.onclick = () => { pendingTheme = btn.dataset.theme; themeMessage = ''; render(); };
      });
