<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登録カレンダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      /* iOS Human Interface Guidelines に準拠したフォントスタック。
         AppleデバイスではSan Francisco（-apple-system）＋ヒラギノ角ゴシックで表示され、
         それ以外のOSでも各プラットフォームの標準UIフォントにフォールバックする。 */
      --font-ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium", "Yu Gothic", "Segoe UI", Meiryo, Roboto, sans-serif;
      --ink: #1A1F36; --ink-2: #4B5468; --muted: #8790A3; --border: #D9DEE5;
      --canvas: #F3F4F7; --surface: #FFFFFF; --surface-2: #F7F8FA; --hairline: #E6E8EE; --cal-line: #D6D9E1;
      --accent: #3B4FD1; --accent-bg: #EEF1FD; --accent-ink: #2E3FB0; --panel-bg: #F7F8FE;
      --oss: #16924F; --oss-bg: #E7F7EE;
      --paper: #D6392E; --paper-bg: #FCEAE8;
      --sat-bg: #E8F0FE; --sat-ink: #2A5BD1;
      --sun-bg: #FCE9F1; --sun-ink: #C93E77;
      --holi-bg: #E7F7EE; --holi-ink: #189255;
      --past-bg: #F0F1F5;
      --notice: #C2790E; --notice-bg: #FBEFDD;
      --shadow-sm: 0 1px 2px rgba(26,31,54,0.05), 0 1px 4px rgba(26,31,54,0.04);
      --shadow-md: 0 2px 6px rgba(26,31,54,0.05), 0 10px 24px -10px rgba(26,31,54,0.16);
      --shadow-lg: 0 6px 16px rgba(26,31,54,0.06), 0 20px 48px -16px rgba(26,31,54,0.22);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: var(--font-ios); background: var(--canvas); color: var(--ink); }
    .font-num { font-family: var(--font-ios); font-variant-numeric: tabular-nums slashed-zero; }

    .app-shell-outer { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .app-shell { flex: 1; min-height: 0; overflow: hidden; }
    .app-row { display: flex; align-items: stretch; height: 100%; }
    .row-scroll { overflow-y: auto; }
    .row-scroll::-webkit-scrollbar { width: 6px; }
    .row-scroll::-webkit-scrollbar-thumb { background: #D7DAE2; border-radius: 10px; }

    /* -- お知らせバナー(ヘッダー内に常時・中央固定で表示。個人では閉じられない) -- */
    .announce-bar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--accent); color: var(--announce-ink, #fff); padding: 16px 20px; font-size: 16px; font-weight: 700; line-height: 1.5; text-align: center; }
    .announce-track { flex: 0 1 auto; min-width: 0; }
    .announce-item { margin: 0 4px; }
    .announce-sep { opacity: .55; margin: 0 10px; }

    /* -- コントロールパネル -- */
    .control-panel { width: 212px; flex: 0 0 212px; background: var(--panel-bg); padding: 22px 14px; display: flex; flex-direction: column; box-shadow: 1px 0 0 var(--hairline); position: relative; z-index: 2; height: 100%; overflow-y: auto; }
    .cp-header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 22px; }
    .cp-icon-mark { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; margin-bottom: 8px; overflow: hidden; flex: none; }
    .cp-icon-mark img { width: 100%; height: 100%; object-fit: cover; }
    .cp-logo { font-size: 13px; font-weight: 800; color: var(--ink); margin-bottom: 2px; letter-spacing: -0.005em; }
    .cp-logo-sub { font-size: 10.5px; color: var(--muted); font-weight: 600; }
    .cp-nav { display: flex; flex-direction: column; gap: 3px; flex: 1; }
    .cp-nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); text-align: left; text-decoration: none; border: none; background: transparent; cursor: pointer; width: 100%; box-sizing: border-box; transition: background .12s ease, color .12s ease; }
    .cp-nav-item i { width: 15px; text-align: center; font-size: 13px; color: var(--muted); }
    .cp-nav-item:hover { background: var(--surface); color: var(--ink); }
    .cp-nav-item.active { background: var(--accent-bg); color: var(--accent-ink); box-shadow: inset 3px 0 0 var(--accent); }
    .cp-nav-item.active i { color: var(--accent-ink); }
    .cp-subnav { position: relative; display: flex; flex-direction: column; gap: 1px; padding: 2px 4px 8px 31px; }
    .cp-subnav::before {
      content: ''; position: absolute; left: 18px; top: -4px; bottom: 21px; width: 1px; background: var(--border);
    }
    .cp-subnav-item { position: relative; border: none; background: transparent; text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 5px 8px; border-radius: 5px; cursor: pointer; transition: background .12s ease, color .12s ease; }
    .cp-subnav-item::before {
      content: ''; position: absolute; left: -13px; top: 50%; width: 9px; height: 1px; background: var(--border);
    }
    .cp-subnav-item:hover { color: var(--ink-2); }
    .cp-subnav-item.active { color: var(--accent-ink); font-weight: 700; background: var(--accent-bg); }
    .cp-subnav-item.active::before { background: var(--accent); }
    .cp-footer { padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--hairline); }
    .cp-user { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
    .cp-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: 0 0 28px; }
    .cp-user-name { font-size: 11.5px; font-weight: 700; color: var(--ink); line-height: 1.3; word-break: break-all; }
    .cp-user-email { font-size: 9px; color: var(--muted); line-height: 1.3; word-break: break-all; }
    .cp-role-badge { font-size: 9.5px; font-weight: 700; border-radius: 6px; padding: 5px 9px; display: block; width: 100%; text-align: left; }
    .cp-role-badge.editor { background: var(--oss-bg); color: var(--oss); }
    .cp-role-badge.general { background: #EEF0F3; color: #7C8496; }
    .mobile-account-card { display: none; }

    /* -- ボトムタブバー(スマホ専用) -- */
    .bottom-tab-bar { display: none; }

    .main-col { flex: 1; min-width: 0; padding: 20px 24px 20px; display: flex; flex-direction: column; height: 100%; overflow: hidden; gap: 12px; }
    .page-fill-area { flex: 1; min-height: 0; overflow-y: auto; }
    .page-title { font-size: 17px; font-weight: 800; color: var(--ink); letter-spacing: -0.005em; }
    .page-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; font-weight: 500; }

    .tabbar { display: inline-flex; gap: 2px; background: var(--surface-2); border-radius: 7px; padding: 3px; border: 1px solid var(--hairline); }
    .tab { font-size: 12px; font-weight: 600; border-radius: 5px; padding: 6px 14px; cursor: pointer; color: var(--muted); border: none; background: transparent; transition: background .12s ease, color .12s ease; }
    .tab i { display: none; }
    .tab:hover { color: var(--ink-2); }
    .tab-active { background: var(--surface); color: var(--accent-ink); font-weight: 700; box-shadow: var(--shadow-sm); }
    .nav-btn { font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--ink-2); cursor: pointer; transition: background .12s ease, border-color .12s ease, color .12s ease; }
    .nav-btn:hover { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-ink); }
    .today-btn { font-size: 11px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 11px; color: var(--ink-2); cursor: pointer; transition: background .12s ease, border-color .12s ease, color .12s ease; }
    .today-btn:hover { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-ink); }
    .action-btn { font-size: 11px; font-weight: 700; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: filter .12s ease; }
    .action-btn:hover { filter: brightness(0.92); }
    .cartype-pill { font-size: 10.5px; font-weight: 800; letter-spacing: .01em; padding: 6px 12px; border-radius: 6px; background: var(--accent); color: #fff; display: inline-flex; align-items: center; gap: 6px; }
    .calhead-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .calhead-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .calhead-year-suffix { display: none; }

    /* -- KPIタイル -- */
    .kpi-section { flex: 0 0 auto; }
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
    .kpi-row-top { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 10px; }
    .kpi-row-bottom { grid-template-columns: repeat(7, 1fr); }
    .kpi-tile { background: var(--surface); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow-sm); }
    .kpi-tile-accent { background: var(--accent-bg); }
    .kpi-label { font-size: 10.5px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .kpi-value { font-family: var(--font-ios); font-variant-numeric: tabular-nums slashed-zero; font-size: 20px; font-weight: 700; color: var(--ink); margin-top: 4px; }
    .kpi-unit { font-size: 10.5px; font-weight: 600; color: var(--muted); margin-left: 3px; font-family: var(--font-ios); }

    /* -- カレンダー行 -- */
    .date-row { display: flex; align-items: stretch; min-height: 76px; border-bottom: 1px solid var(--cal-line); }
    .date-row.has-notice { min-height: 96px; }
    .date-col { width: 58px; flex: 0 0 58px; display: flex; align-items: center; justify-content: center; }
    .content-col-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .content-col { flex: 1; min-width: 0; padding: 10px 34px 10px 10px; display: flex; align-items: center; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth; }
    .content-col::-webkit-scrollbar { display: none; }
    .day-entries-track { display: flex; gap: 8px; align-items: center; }
    .date-badge { position: relative; text-align: center; border-radius: 8px; padding: 5px 8px; }
    .date-badge .d-num { font-family: var(--font-ios); font-variant-numeric: tabular-nums slashed-zero; font-size: 15.5px; font-weight: 700; line-height: 1; }
    .date-badge .d-dow { font-size: 9px; font-weight: 600; margin-top: 3px; }
    .date-badge .d-tag { font-size: 8px; font-weight: 700; margin-top: 2px; opacity: 0.9; }
    .date-row.is-today { background: var(--accent-bg); background: color-mix(in srgb, var(--accent) 20%, var(--surface)); box-shadow: inset 0 0 0 1.5px var(--accent); position: relative; z-index: 1; }
    .day-notice-banner { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; background: var(--notice-bg); color: var(--notice); font-size: 11px; font-weight: 700; line-height: 1.4; padding: 5px 12px; border-radius: 7px; margin: 8px 10px 0; }
    .day-notice-banner i { flex: 0 0 auto; }

    /* -- 登録カード -- */
    .entry-card { background: var(--surface); border-radius: 7px; padding: 8px 11px; flex: 0 0 178px; width: 178px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; cursor: pointer; scroll-snap-align: start; border: 1px solid var(--hairline); transition: box-shadow .12s ease, border-color .12s ease; }
    .entry-card:hover { box-shadow: var(--shadow-md); border-color: var(--border); }
    .entry-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--bar-color, var(--accent)); }
    .entry-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-left: 5px; }
    .entry-row + .entry-row { margin-top: 4px; }
    .entry-name { font-size: 12.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .entry-sales { font-size: 10.5px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .entry-model { font-size: 10.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; max-width: 76px; }
    .branch-pill { font-size: 9.5px; font-weight: 600; padding: 2px 7px; border-radius: 4px; }
    .method-pill { font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 4px; display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto; }
    .status-pill { font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 4px; display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
    .slide-hint { position: sticky; right: 2px; flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-md); border: none; color: var(--accent-ink); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; }
    /* KPI行はPC表示ではグリッド(スクロールなし)のため、矢印はスマホ表示のみ有効にする */
    .kpi-row-top .slide-hint, .kpi-row-bottom .slide-hint { display: none; }

    /* -- カレンダーカード / オーバーレイ未定リスト -- */
    .calendar-card { position: relative; background: var(--surface); border-radius: 12px; padding: 16px 18px; overflow: hidden; box-shadow: var(--shadow-md); display: flex; flex-direction: column; flex: 1; min-height: 0; min-width: 0; border: 1px solid var(--hairline); }
    .rowscroll-wrap { position: relative; flex: 1; min-height: 0; display: flex; }
    .cal-overlay-backdrop { position: absolute; inset: 0; background: rgba(26,31,54,0.32); z-index: 5; }
    .cal-overlay-panel { position: absolute; top: 0; right: 0; bottom: 0; width: 216px; background: var(--surface); box-shadow: var(--shadow-lg); z-index: 6; padding: 14px; display: flex; flex-direction: column; border-left: 1px solid var(--hairline); }
    .sales-tag { font-size: 10px; font-weight: 600; color: #9AA1B0; display: flex; align-items: center; gap: 5px; margin: 9px 0 6px; text-transform: uppercase; letter-spacing: .03em; }
    .pending-toggle-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 700;
      padding: 6px 12px; border-radius: 6px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
      cursor: pointer; transition: border-color .12s ease, color .12s ease, background .12s ease;
      margin-left: 8px; position: relative;
    }
    .pending-toggle-btn::before { content: ''; position: absolute; left: -9px; top: 50%; transform: translateY(-50%); width: 1px; height: 16px; background: var(--hairline); }
    .pending-toggle-mobile-slot { display: none; }
    .pending-toggle-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
    .pending-toggle-btn.open { color: var(--accent-ink); background: var(--accent-bg); border-color: var(--accent); }
    .pending-toggle-count { font-family: var(--font-ios); font-variant-numeric: tabular-nums slashed-zero; font-size: 10.5px; font-weight: 800; background: var(--surface-2); border-radius: 5px; padding: 2px 7px; }
    .pending-toggle-btn.open .pending-toggle-count { background: rgba(255,255,255,0.65); }

    /* -- マイページ -- */
    .mp-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .mp-header-id { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mp-header-text { flex: 1; min-width: 0; }
    .mp-header-nav { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
    .mp-kpi-group { margin-bottom: 10px; }
    .mp-kpi-group-label { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }
    .mp-kpi-row { margin-bottom: 0; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); }
    .mp-kpi-row .slide-hint { display: none; }
    .mp-list { display: flex; flex-direction: column; gap: 5px; }
    .mp-row { display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: 8px; padding: 10px 14px; box-shadow: var(--shadow-sm); cursor: pointer; border: 1px solid var(--hairline); transition: box-shadow .12s ease, border-color .12s ease; }
    .mp-row:hover { box-shadow: var(--shadow-md); border-color: var(--border); }
    .mp-col { flex: 1; min-width: 0; display: flex; align-items: center; }
    .mp-date-chip { font-size: 10.5px; font-weight: 700; font-family: var(--font-ios); font-variant-numeric: tabular-nums slashed-zero; text-align: center; border-radius: 6px; padding: 5px 10px; }
    .mp-name { font-size: 12.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .mp-model { font-size: 11.5px; color: var(--ink-2); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .mp-thead-row { display: flex; align-items: center; gap: 14px; padding: 4px 14px; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }

    /* -- リスト表示 -- */
    .list-table-wrap { width: 100%; overflow-x: auto; }
    .list-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .list-table thead th { text-align: left; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 8px 12px; border-bottom: 1px solid var(--hairline); position: sticky; top: 0; background: var(--surface); }
    .list-table tbody tr { border-bottom: 1px solid var(--hairline); cursor: pointer; }
    .list-table tbody tr:hover { background: var(--surface-2); }
    .list-table td { padding: 10px 12px; vertical-align: middle; }
    .list-card-wrap { display: none; flex-direction: column; gap: 8px; }
    .list-card { background: var(--surface); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-sm); border: 1px solid var(--hairline); cursor: pointer; }
    .list-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .list-card-name { font-size: 13.5px; font-weight: 700; color: var(--ink); }
    .list-card-date { font-size: 11px; font-weight: 700; color: var(--ink-2); white-space: nowrap; flex: 0 0 auto; }
    .list-card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .list-card-meta span { font-size: 11.5px; }
    .list-card-note { font-size: 11.5px; color: var(--muted); margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--hairline); }

    /* -- 設定ページ -- */
    .settings-card { background: var(--surface); border-radius: 12px; padding: 20px 22px; box-shadow: var(--shadow-md); border: 1px solid var(--hairline); }
    .settings-card-title { font-size: 13.5px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .settings-card-title i { color: var(--accent-ink); font-size: 12.5px; }
    .settings-card-desc { font-size: 11.5px; color: var(--muted); line-height: 1.65; margin-bottom: 15px; }
    .settings-group-label { margin-bottom: 6px; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    .settings-list { display: flex; flex-direction: column; gap: 5px; }
    .settings-row { display: flex; align-items: center; gap: 14px; background: var(--surface-2); border-radius: 7px; padding: 9px 13px; }
    .settings-row .s-name { font-size: 12px; font-weight: 700; color: var(--ink); flex: 1; min-width: 0; }
    .settings-row .s-email { font-size: 11.5px; color: var(--muted); font-weight: 500; flex: 1.4; min-width: 0; }
    .settings-row .s-branch { font-size: 11.5px; font-weight: 700; color: var(--ink-2); flex: 0 0 72px; }
    .settings-remove { border: none; background: transparent; color: #B7BDC9; cursor: pointer; font-size: 12px; flex: 0 0 auto; width: 22px; height: 22px; border-radius: 5px; transition: background .12s ease, color .12s ease; }
    .settings-remove:hover { background: var(--paper-bg); color: var(--paper); }
    .settings-add-row { display: flex; gap: 8px; margin-top: 13px; flex-wrap: wrap; }
    .settings-checkbox-label { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; cursor: pointer; flex: 0 0 auto; }
    .settings-checkbox-label input { cursor: pointer; }
    .settings-input { font-size: 12px; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 8px 11px; color: var(--ink); font-family: inherit; }
    .settings-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
    .rich-edit-wrap { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 5px; }
    .rich-toolbar { display: flex; align-items: center; gap: 6px; }
    .rich-btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); width: 26px; height: 26px; flex: 0 0 auto; border-radius: 5px; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; transition: background .12s ease, color .12s ease; }
    .rich-btn:hover { background: var(--accent-bg); color: var(--accent-ink); }

    .rich-editable:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

    .settings-add-btn:hover { filter: brightness(0.92); }
    .settings-add-btn:disabled { background: #E2E5EB; color: #A6ACB8; cursor: default; filter: none; }
    .settings-subblock { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--hairline); }

    /* -- モーダル(詳細表示、お知らせ) -- */

    .modal-backdrop.flex { display: flex; }
    .modal-box { background: var(--surface); border-radius: 12px; width: 100%; box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; border-top: 3px solid var(--accent); }
    .modal-head { background: var(--surface-2); padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--hairline); position: sticky; top: 0; }

    .detail-row { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }

    @media (max-width: 860px) {
      .app-row { flex-direction: column; }

      /* -- 上部バー: ロゴ＋車両区分の切り替えのみを表示するアプリ風ヘッダーに簡略化。

      .control-panel { width: 100%; flex: 0 0 auto; height: auto; flex-direction: row; align-items: center; justify-content: space-between; padding: 10px 14px; overflow-x: visible; border-bottom: 1px solid var(--hairline); }

      /* 登録カードは横に2件分だけ表示し、それ以降は横スクロール(→矢印あり)にする */

      /* -- カレンダーヘッダー: 拠点/表示切替と、月移動+未定リストの2段に -- */
      .calhead-row { flex-direction: column; align-items: stretch; }
      .calhead-right { justify-content: center; }
      .today-btn { display: none; } /* ログイン時に自動で今日が最上部に来るため不要 */
      .calhead-monthlabel { order: 2; }
      #btnPrevMonth { order: 1; }
      #btnNextMonth { order: 3; }
      .calhead-year-suffix { display: inline; }
      .pending-toggle-desktop-slot { display: none; } /* PC位置のボタンは隠す */
      .pending-toggle-mobile-slot { display: inline-flex; }
      .pending-toggle-mobile-slot::before { display: none; }

      /* -- リスト表示: テーブルの代わりにカード一覧 -- */
      .list-table-wrap { display: none; }
      .list-card-wrap { display: flex; }

      /* -- マイページヘッダー: 縦積みにして折り返しを防止 -- */
      .mp-header-row { flex-direction: column; align-items: stretch; }
      .mp-header-id { width: 100%; }

      .mp-subtitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

      /* -- マイページKPI: カレンダーのKPIと同じ「統計ストリップ」形式にして折り返し・はみ出しを防止 -- */

      }

      .mp-kpi-row .slide-hint { display: flex; }

      /* -- マイページ: 横長の1行レイアウト。各列は必要最小幅にして折り返しをやめ、

      .mp-thead-row { display: none; }
      .mp-row { flex-wrap: nowrap; gap: 6px; padding: 10px 12px; }
      .mp-col { flex: 0 0 auto; min-width: 0; }
      .mp-name, .mp-model { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
      .mp-name { flex-grow: 1.2; font-size: 12.5px; }
      .mp-model { font-size: 11px; }
      .mp-col-date .mp-date-chip { padding: 4px 7px; font-size: 9.5px; }
      .mp-col-type .branch-pill { padding: 2px 6px; font-size: 9px; white-space: nowrap; }
      .mp-col-status { display: none; } /* 幅優先のため省略。詳細はタップして確認 */
      .mp-col-rep { display: none; } /* 拠点長表示の担当者列も幅優先で省略。詳細はタップして確認 */

      /* -- KPI表示をスマホ向けに変更: 個別タイルの箱・余白をやめ、1枚のカードを
            仕切り線で区切る「統計ストリップ」形式にして折り返し・無駄な空白をなくす -- */
      .kpi-row-top, .kpi-row-bottom {
        display: flex !important; grid-template-columns: none !important;
        background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-sm);
        padding: 8px 34px 8px 2px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none;
      }
      .kpi-row-top::-webkit-scrollbar, .kpi-row-bottom::-webkit-scrollbar { display: none; }
      .kpi-row-top .kpi-tile, .kpi-row-bottom .kpi-tile {
        flex: 1 0 auto; min-width: 84px; background: transparent; box-shadow: none;
        border-radius: 0; padding: 4px 10px; border-right: 1px solid var(--hairline); text-align: center;
      }
      .kpi-row-top .kpi-tile:last-child, .kpi-row-bottom .kpi-tile:last-child { border-right: none; }
      .kpi-row-top .kpi-tile-accent { background: transparent; }
      .kpi-row-top .kpi-label, .kpi-row-bottom .kpi-label {
        justify-content: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 9.5px;
      }
      .kpi-row-top .kpi-value, .kpi-row-bottom .kpi-value { font-size: 17px; white-space: nowrap; }
      .kpi-row-top .slide-hint, .kpi-row-bottom .slide-hint { display: flex; }

      /* -- 設定ページに、非表示になったサイドバーのアカウント情報を移設 -- */
      .mobile-account-card { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--hairline); }

      /* -- テーマ設定は2色×4段のグリッドに -- */
      .theme-swatches { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .theme-swatch { justify-content: center; }

      /* -- 設定ページの管理者向けフォーム行: 横並びだと項目が収まらず横スクロールに
            なってしまうため、折り返し・縦積みにする -- */
      .settings-card { padding: 16px; }
      .settings-row { flex-wrap: wrap; gap: 8px 10px; }
      .js-cal-notice-date { flex: 1 1 130px !important; }
      .rich-row .rich-edit-wrap { flex: 1 1 100%; }
      .settings-row .s-name, .settings-row .s-email {
        flex: 1 1 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .settings-row .s-branch { flex: 0 0 auto; }
      .settings-row .settings-remove { margin-left: auto; }

      /* -- ボトムタブバー(アプリのタブナビゲーション風)。固定シェルの一番下に収まる
            通常のフレックス項目として配置するため、position:fixedは使わない -- */
      .bottom-tab-bar { display: flex; flex: 0 0 auto; background: var(--surface); border-top: 1px solid var(--hairline); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
      .bottom-tab-item { flex: 1; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3px; width: auto; padding: 6px 2px; border-radius: 10px; font-size: 10px; font-weight: 600; color: var(--muted); }
      .bottom-tab-item i { font-size: 17px; width: auto; }
      .bottom-tab-item.active { color: var(--accent-ink); background: var(--accent-bg); box-shadow: none; }
      .bottom-tab-item.active i { color: var(--accent-ink); }

      /* -- カレンダー/リスト切り替えはアイコンのみに -- */
      .tab-label { display: none; }
      .tab i { display: inline-block; font-size: 13px; }

      /* -- ボタン類は余白を詰めてコンパクトに(押しにくくない範囲で最小限のサイズへ) -- */
      .nav-btn { padding: 5px 9px; }
      .tab { padding: 7px 13px; }
      .action-btn { padding: 6px 11px; }
      .pending-toggle-btn { padding: 5px 10px; }
      .settings-input { padding: 6px 9px; }
    }

<body>
  <div id="app-root"></div>

  <!-- 登録内容の詳細表示（閲覧専用。登録・編集はスプレッドシートで行います） -->
  <div id="recordModal" class="modal-backdrop">
    <div class="modal-box" style="max-width: 460px;">
      <div class="modal-head">
        <h3 class="modal-title">登録内容</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="recordDetailBody" style="padding: 8px 22px 20px;"></div>
    </div>
  </div>

  <script>
    // ▼ サーバー(Code.gs)がテンプレート変数として埋め込む値
    const IS_EDITOR = <?!= isEditor ? 'true' : 'false' ?>;
    const CURRENT_USER_EMAIL = <?!= JSON.stringify(userEmail || '') ?>;
    const INITIAL_THEME = <?!= JSON.stringify(initialTheme || 'indigo') ?>;
    const INITIAL_SIDE_ICON_URL = <?!= JSON.stringify(initialSideIconUrl || '') ?>;
    const INITIAL_SIDE_ICON_FOLDER_ID = <?!= JSON.stringify(initialSideIconFolderId || '') ?>;
    const INITIAL_SIDE_ICON_EXTERNAL_URL = <?!= JSON.stringify(initialSideIconExternalUrl || '') ?>;
    const LINKED_NAME = <?!= JSON.stringify(linkedName || '') ?>;
    const LINKED_CAR_TYPE = <?!= JSON.stringify(linkedCarType || '') ?>;
    const LINKED_BRANCH = <?!= JSON.stringify(linkedBranch || '') ?>;
    const LINKED_IS_BRANCH_MANAGER = <?!= linkedIsBranchManager ? 'true' : 'false' ?>;
    const INITIAL_ANNOUNCEMENTS_NEW = <?!= JSON.stringify(initialAnnouncementsNew || []) ?>;
    const INITIAL_ANNOUNCEMENTS_USED = <?!= JSON.stringify(initialAnnouncementsUsed || []) ?>;
    const INITIAL_BRANCHES_NEW = <?!= JSON.stringify(initialBranchesNew || []) ?>;
    const INITIAL_BRANCHES_USED = <?!= JSON.stringify(initialBranchesUsed || []) ?>;

    const CAR_TYPES = ['新車', '中古車'];

    // ▼ 拠点マスタ(設定ページ「拠点設定」で編集可能。新車・中古車それぞれ別に設定できる)。
    //   拠点名や店舗数が異なる別アプリへこのコードを流用する際も、ここを直接書き換える
    //   必要が無いようにするための仕組み。
    const FALLBACK_BRANCH = { name: 'その他', c: '#66707E', bg: '#EFF1F3' }; // 拠点マスタに無い拠点名の受け皿(常に存在する)
    function lightenHex_(hex, amount) {
      const h = String(hex || FALLBACK_BRANCH.c).replace('#', '');
      const r = parseInt(h.substring(0, 2), 16) || 0, g = parseInt(h.substring(2, 4), 16) || 0, b = parseInt(h.substring(4, 6), 16) || 0;
      const mix = (c) => Math.round(c + (255 - c) * amount);
      const toHex = (c) => c.toString(16).padStart(2, '0').toUpperCase();
      return '#' + toHex(mix(r)) + toHex(mix(g)) + toHex(mix(b));
    }
    function buildBranchColors_(list) {
      const map = {};
      list.forEach(b => { map[b.name] = { c: b.color, bg: lightenHex_(b.color, 0.92) }; });
      if (!map[FALLBACK_BRANCH.name]) map[FALLBACK_BRANCH.name] = { c: FALLBACK_BRANCH.c, bg: FALLBACK_BRANCH.bg };
      return map;
    }
    // 「その他」が一覧に含まれていなければ末尾に補う(通常はCode.gs側で保証されるが、保険として)
    function ensureFallbackBranchInList_(list) {
      const has = list.some(b => b && b.name === FALLBACK_BRANCH.name);
      return has ? list : list.concat([{ name: FALLBACK_BRANCH.name, color: FALLBACK_BRANCH.c }]);
    }
    function normalizeBranchList_(list) {
      const base = (list && list.length ? list : [{ name: '岐阜', color: '#3B4FD1' }]).slice();
      return ensureFallbackBranchInList_(base);
    }
    let branchesByType = {
      '新車': normalizeBranchList_(INITIAL_BRANCHES_NEW),
      '中古車': normalizeBranchList_(INITIAL_BRANCHES_USED),
    };
    let branchColorsByType = {
      '新車': buildBranchColors_(branchesByType['新車']),
      '中古車': buildBranchColors_(branchesByType['中古車']),
    };
    // 現在表示中の車両区分(carType)に連動する「今使う」拠点情報。carType切り替え時・
    // 拠点設定の保存時にsyncBranchesForCurrentType_()で更新する（下のcarType宣言直後にも呼ぶ）。
    let branches, branchColors, branchOrder;
    function syncBranchesForCurrentType_() {
      branches = branchesByType[carType];
      branchColors = branchColorsByType[carType];
      branchOrder = branches.map(b => b.name); // 「その他」は既にリスト末尾に含まれている
    }
    // carTypeが「現在表示中」かどうかによらず、指定した車両区分の拠点順を返す
    // （車両区分を切り替える処理の途中など、まだcarTypeが更新される前でも正しい値を返せるようにするため）。
    function branchOrderFor(type) {
      const order = (branchesByType[type] || branches).map(b => b.name);
      return type === '中古車' ? order.filter(b => b !== 'デモカー') : order;
    }
    // 担当者マスタの拠点選択は車両区分に紐づかないため、新車・中古車両方の拠点名をまとめて出す
    function allBranchNamesUnion_() {
      const set = new Set();
      CAR_TYPES.forEach(t => { (branchesByType[t] || []).forEach(b => set.add(b.name)); });
      return Array.from(set);
    }
    const dow = ['日', '月', '火', '水', '木', '金', '土'];

    // ステータス(スプレッドシート側のプルダウンと一致させること)。「登録予定日確定」以外は未定リスト扱い。
    const STATUS_CONFIRMED = '登録予定日確定';
    const LEGACY_CONFIRMED_STATUSES = ['登録日確定']; // 移行期間中の旧ステータス名もカレンダーに表示する
    function isConfirmedStatus(status) {
      return status === STATUS_CONFIRMED || LEGACY_CONFIRMED_STATUSES.indexOf(status) !== -1;
    }

    // panelBg: コントロールパネル全体に敷く、accentBgよりさらに薄いテーマ色の下地。
    // これによりアクティブなナビ項目(accentBg)との2段階の濃淡差が生まれ、パネル全体が
    // テーマカラーで染まって見えるようになる。
    const THEMES = {
      indigo: { name: 'インディゴ', accent: '#3B4FD1', accentBg: '#EEF1FD', accentInk: '#2E3FB0', panelBg: '#F7F8FE' },
      green: { name: 'グリーン', accent: '#16924F', accentBg: '#E7F7EE', accentInk: '#0F7A3D', panelBg: '#F4FBF7' },
      charcoal: { name: 'チャコール', accent: '#33333D', accentBg: '#E9E9EC', accentInk: '#202027', panelBg: '#F6F6F7' },
      amber: { name: 'アンバー', accent: '#C2790E', accentBg: '#FBEFDD', accentInk: '#9C610A', panelBg: '#FDF7EE' },
      rose: { name: 'ローズ', accent: '#C93E77', accentBg: '#FBEAF1', accentInk: '#A62D60', panelBg: '#FDF4F7' },
      teal: { name: 'ティール', accent: '#0C7C8C', accentBg: '#E6F4F6', accentInk: '#0A6672', panelBg: '#F2F9FA' },
      purple: { name: 'パープル', accent: '#7C3AED', accentBg: '#F2ECFC', accentInk: '#6425C7', panelBg: '#F8F5FE' },
      slate: { name: 'スレート', accent: '#4B5468', accentBg: '#EEF0F3', accentInk: '#333A4A', panelBg: '#F6F7F9' },
      navy: { name: 'ネイビー', accent: '#2B4C7E', accentBg: '#EAF0F8', accentInk: '#1F3A63', panelBg: '#F5F8FC' },
      terracotta: { name: 'テラコッタ', accent: '#C1622D', accentBg: '#FCEEE3', accentInk: '#9C4D22', panelBg: '#FDF8F3' },
    };

    let currentTheme = THEMES[INITIAL_THEME] ? INITIAL_THEME : 'indigo';
    let pendingTheme = currentTheme;
    let themeMessage = '';
    let sidePanelIconUrl = INITIAL_SIDE_ICON_URL;
    let sideIconFolderId = INITIAL_SIDE_ICON_FOLDER_ID;
    let sideIconExternalUrlValue = INITIAL_SIDE_ICON_EXTERNAL_URL;

    // ▼ 背景色(hex)に対して、黒文字・白文字のどちらが見やすいかをおおまかな輝度で判定する。
    //   お知らせ帯のテーマ連動色は明るいテーマ色が来る可能性もあるため、白固定にせずここで判定する。
    function readableInkFor_(hex) {
      const h = String(hex || '#000000').replace('#', '');
      const r = parseInt(h.substring(0, 2), 16) || 0, g = parseInt(h.substring(2, 4), 16) || 0, b = parseInt(h.substring(4, 6), 16) || 0;
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.6 ? '#1A1F36' : '#FFFFFF';
    }
    function applyTheme(key) {
      const t = THEMES[key];
      const root = document.documentElement.style;
      root.setProperty('--accent', t.accent);
      root.setProperty('--accent-bg', t.accentBg);

    // ---- 日本の祝日判定(固定日＋ハッピーマンデー＋春分/秋分＋振替休日/国民の休日) ----
    function computeJapaneseHolidays(year) {
      const map = {};
      const set = (mo, d, name) => { map[mo + '-' + d] = name; };
      const nthMonday = (mo, n) => {
        let count = 0;
        for (let d = 1; d <= 31; d++) {
          const dt = new Date(year, mo - 1, d);
          if (dt.getMonth() !== mo - 1) break;
          if (dt.getDay() === 1) { count++; if (count === n) return d; }
        }
      };
      const springEq = Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      const autumnEq = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      set(1, 1, '元日'); set(1, nthMonday(1, 2), '成人の日'); set(2, 11, '建国記念の日'); set(2, 23, '天皇誕生日');
      set(3, springEq, '春分の日'); set(4, 29, '昭和の日'); set(5, 3, '憲法記念日'); set(5, 4, 'みどりの日'); set(5, 5, 'こどもの日');
      set(7, nthMonday(7, 3), '海の日'); set(8, 11, '山の日'); set(9, nthMonday(9, 3), '敬老の日'); set(9, autumnEq, '秋分の日');
      set(10, nthMonday(10, 2), 'スポーツの日'); set(11, 3, '文化の日'); set(11, 23, '勤労感謝の日');
      const keyToDate = (key) => { const [mo, d] = key.split('-').map(Number); return new Date(year, mo - 1, d); };
      const dateToKey = (dt) => (dt.getMonth() + 1) + '-' + dt.getDate();
      Object.keys(map).forEach(key => {
        const dt = keyToDate(key);
        const next2 = new Date(dt); next2.setDate(dt.getDate() + 2);
        if (next2.getFullYear() !== year) return;
        const between = new Date(dt); between.setDate(dt.getDate() + 1);
        const betweenKey = dateToKey(between), next2Key = dateToKey(next2);
        if (!map[betweenKey] && map[next2Key] && between.getDay() !== 0) map[betweenKey] = '国民の休日';
      });
      Object.keys(map).slice().forEach(key => {
        const dt = keyToDate(key);
        if (dt.getDay() !== 0) return;
        let cursor = new Date(dt);
        do { cursor.setDate(cursor.getDate() + 1); } while (map[dateToKey(cursor)] && cursor.getFullYear() === year);
        if (cursor.getFullYear() === year) map[dateToKey(cursor)] = '振替休日';
      });
      return map;
    }
    let holidayCache = {};
    function holidayName(year, month, day) {
      if (!holidayCache[year]) holidayCache[year] = computeJapaneseHolidays(year);
      return holidayCache[year][(month + 1) + '-' + day] || null;
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ---- お知らせ・カレンダー案内の部分書式(太字・文字色)まわり ----
    // 旧仕様（項目全体に1色だけ設定できた{text, color}）のデータを、新仕様の{html, text}に変換する。
    // 既にhtmlを持つ新仕様のデータはそのまま返す。
    function migrateRichItem_(item) {
      if (!item) return item;
      if (item.html != null) return item;
      const text = String(item.text || '');
      const html = item.color ? `<span style="color:${escapeAttr(item.color)};">${escapeHtml(text)}</span>` : escapeHtml(text);
      const migrated = { html: html, text: text };
      if (item.date != null) migrated.date = item.date;
      return migrated;
    }
    // 許可するのは<b>と、色指定だけを持つ<span style="color:#RRGGBB;">のみ。
    // それ以外のタグ・属性は、貼り付け等で紛れ込んでも中身のテキストだけ残して取り除く
    // （保存時にはCode.gs側でも同じ考え方のサニタイズを行っており、こちらは表示側の保険）。
    function sanitizeRichHtmlClient_(html) {
      const container = document.createElement('div');
      container.innerHTML = html;
      const colorStyleRe = /^color:\s*#[0-9A-Fa-f]{6};?$/;
      (function clean(node) {
        Array.prototype.slice.call(node.childNodes).forEach(child => {
          if (child.nodeType === 1) {
            const tag = child.tagName;
            if (tag !== 'B' && tag !== 'SPAN') {
              while (child.firstChild) node.insertBefore(child.firstChild, child);
              node.removeChild(child);
              return;
            }
            Array.prototype.slice.call(child.attributes).forEach(attr => {
              if (!(tag === 'SPAN' && attr.name === 'style' && colorStyleRe.test(attr.value.trim()))) {
                child.removeAttribute(attr.name);
              }
            });
            clean(child);
          } else if (child.nodeType !== 3) {
            node.removeChild(child);
          }
        });
      })(container);
      return container.innerHTML;
    }
    // 選択範囲を保持する（ツールバーのボタン/カラーピッカーをクリックするとcontenteditableの
    // フォーカスが外れて選択が失われうるため、mouseup/keyupのたびに保存しておく）
    let richSavedRange = null;
    function captureRichSelection_(editableEl) {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      if (range.collapsed) return;
      if (!editableEl.contains(range.commonAncestorContainer)) return;
      richSavedRange = range.cloneRange();
    }
    function wrapSelectionInTag_(range, tag, styleAttr) {
      const wrapper = document.createElement(tag);
      if (styleAttr) wrapper.setAttribute('style', styleAttr);
      const frag = range.extractContents();
      wrapper.appendChild(frag);
      range.insertNode(wrapper);
      range.selectNodeContents(wrapper);
    }
    // 保存しておいた選択範囲に対して書式を適用し、変更後のHTMLをonChangeへ渡す
    function applyRichFormat_(editableEl, tag, styleAttr, onChange) {
      if (!richSavedRange || !editableEl.contains(richSavedRange.commonAncestorContainer)) return;
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(richSavedRange);
      wrapSelectionInTag_(richSavedRange, tag, styleAttr);
      captureRichSelection_(editableEl);
      onChange(sanitizeRichHtmlClient_(editableEl.innerHTML));
    }
    // contenteditable内へのペーストは、外部からの書式付きHTMLが紛れ込まないよう常にプレーンテキストにする
    function forcePlainTextPaste_(ev) {
      ev.preventDefault();
      const text = (ev.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    }

    // ---- カレンダー用データ組み立て ----
    function buildDayEntries(year, month) {
      const map = {};
      allRecords.forEach(r => {
        if (!isConfirmedStatus(r.ステータス) || !r.登録予定日) return;
        const { y, m, d } = parseYMD(r.登録予定日);
        if (y !== year || m !== month) return;
        map[d] = map[d] || [];
        map[d].push(r);
      });
      return map;
    }
    function pendingRecords() {
      const year = currentDate.getFullYear(), month = currentDate.getMonth();
      return allRecords.filter(r => {
        if (isConfirmedStatus(r.ステータス)) return false;
        if (r._sheetYear == null || r._sheetMonth == null) return true;
        return r._sheetYear === year && r._sheetMonth === month;
      });
    }

    function computeSummaryStats(year, month) {
      const monthData = allRecords.filter(r => {
        if (!r.登録予定日) return false;
        const { y, m } = parseYMD(r.登録予定日);
        return y === year && m === month;
      });
      const undecided = pendingRecords();
      const combined = monthData.concat(undecided);
      const total = combined.length;
      const ossCount = combined.filter(isOssRecord).length;
      const ossRate = total > 0 ? Math.round((ossCount / total) * 100) : 0;
      const perBranch = {};
      branchOrder.forEach(b => { perBranch[b] = 0; });
      combined.forEach(r => { const b = branchColors[r.拠点] ? r.拠点 : 'その他'; perBranch[b] = (perBranch[b] || 0) + 1; });
      return { total, ossCount, ossRate, perBranch };
    }

    function dateRowHTML(dayEntries, year, month, day) {
      const d = new Date(year, month, day);
      const dowIdx = d.getDay();
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const isToday = d.getTime() === today.getTime();
      const holiday = holidayName(year, month, day);
      const entries = dayEntries[day] || [];
      // 実際にオーバーフローするかは画面幅次第で変わるため、2件以上あれば矢印を
      // 用意しておき、実際に収まっている場合はJS側(updateHint)で自動的に隠す。
      const hasOverflow = entries.length > 1;
      const dateStr = dateStrOf(year, month, day);
      const notices = calendarNoticesForDate(dateStr);

      const isPast = d.getTime() < today.getTime(); // 当日は含まない(過ぎた日のみ)
      let rowBg = '', ink = 'var(--ink-2)', tagText = '', badgeFill = 'transparent', badgeTextColor;
      if (dowIdx === 6) { rowBg = 'var(--sat-bg)'; ink = 'var(--sat-ink)'; }
      if (dowIdx === 0) { rowBg = 'var(--sun-bg)'; ink = 'var(--sun-ink)'; }
      if (holiday) { rowBg = 'var(--holi-bg)'; ink = 'var(--holi-ink)'; tagText = holiday; }
      // 登録状況が一目でわかるよう、登録が終わった(登録予定日が過ぎた)日は背景をグレーにする。
      // 曜日・祝日の色より優先して「終わったこと」を示す。
      if (isPast) { rowBg = 'var(--past-bg)'; }
      badgeTextColor = ink;
      let extraClass = '';
      if (isToday) {
        extraClass = ' is-today';
        ink = 'var(--accent-ink)'; badgeFill = 'var(--accent)'; badgeTextColor = '#fff';
        // 当日18:00以降は、実質その日の受付が終わっていることが多いため背景だけグレーにする。
        // 「今日」を示す枠(is-todayのアクセント縁取り)はそのまま残し、背景色だけ上書きする。
        rowBg = (new Date().getHours() >= 18) ? 'var(--past-bg)' : '';

      const hintBtn = hasOverflow ? `<button type="button" class="slide-hint" title="横にスライドしてさらに表示"><i class="fa-solid fa-chevron-right"></i></button>` : '';

        : '';

      return `<div data-day="${day}" data-today="${isToday}" class="date-row${extraClass}${hasNotice ? ' has-notice' : ''}" style="${rowBg ? `background:${rowBg};` : ''}">
        <div class="date-col">
          <div class="date-badge" style="background:${badgeFill};">
            <div class="d-num" style="color:${badgeTextColor};">${day}</div>
            <div class="d-dow" style="color:${isToday ? 'rgba(255,255,255,0.85)' : ink};">${dow[dowIdx]}</div>
            ${tagText ? `<div class="d-tag" style="color:${isToday ? 'rgba(255,255,255,0.85)' : ink};">祝</div>` : ''}
          </div>
        </div>
        <div class="content-col-wrap">
          ${noticeBanner}
          <div class="content-col">${content}</div>
        </div>
      </div>`;
    }

    function pendingCardHTML(p) {
      const c = branchColors[p.拠点] || branchColors['その他'];
      const rs = remarkCardStyle_(p);
      const inkStyle = rs ? `color:${rs.ink};` : '';
      return `<div class="entry-card js-open-record" ${recordDataAttr(p)} style="--bar-color:${c.c};margin-bottom:8px;${rs ? `background:${rs.bg};` : ''}">
        <div class="entry-row"><span class="entry-name" style="${inkStyle}">${escapeHtml(p.顧客名)}</span>${methodPill(isOssRecord(p))}</div>
        <div class="entry-row"><span class="entry-sales" style="${inkStyle}"><i class="fa-solid fa-user" style="font-size:8px;margin-right:3px;"></i>${escapeHtml(p.担当者 || '-')}</span><span class="entry-model" style="${inkStyle}">${escapeHtml(p.車種 || '')}</span></div>
      </div>`;
    }

    function pendingPanelHTML() {
      const pending = pendingRecords();
      const grouped = {};
      pending.forEach(p => {
        const branch = branchColors[p.拠点] ? p.拠点 : 'その他';
        const sales = p.担当者 || '担当者未設定';
        grouped[branch] = grouped[branch] || {};
        grouped[branch][sales] = grouped[branch][sales] || [];
        grouped[branch][sales].push(p);
      });
      // carTypeに応じた並び順を基本にしつつ、その一覧に含まれない拠点(データ入力の都合で
      // 中古車に「デモカー」が付いている等)のデータも取りこぼさないよう末尾に追加する
      const branchList = branchOrderFor(carType);
      const orderedBranches = branchList.filter(b => grouped[b])
        .concat(Object.keys(grouped).filter(b => !branchList.includes(b)));
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;padding-bottom:13px;border-bottom:1px solid var(--hairline);flex:0 0 auto;">
          <span style="font-size:11px;font-weight:600;color:var(--ink-2);"><i class="fa-solid fa-circle-notch" style="color:var(--accent);margin-right:6px;"></i>未定リスト</span>
          <span class="font-num" style="font-size:11px;font-weight:700;background:var(--surface-2);border-radius:6px;padding:4px 10px;color:var(--ink-2);">${pending.length}件</span>
        </div>
        <div class="row-scroll" style="flex:1;min-height:0;">
          ${orderedBranches.length === 0 ? `<p style="font-size:12px;color:var(--muted);padding:12px 2px;">未定の登録はありません。</p>` : orderedBranches.map(branch => {
            const c = branchColors[branch];
            const branchCount = Object.values(grouped[branch]).reduce((s, a) => s + a.length, 0);
            return `
              <div style="display:flex;align-items:center;justify-content:space-between;margin:10px 2px 8px;">
                <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:${c.c};"><span style="width:7px;height:7px;border-radius:50%;background:${c.c};"></span>${branch}</span>
                <span class="font-num" style="font-size:10px;color:var(--muted);font-weight:600;">${branchCount}件</span>
              </div>
              ${Object.keys(grouped[branch]).map(sales => `
                <div class="sales-tag"><i class="fa-solid fa-user" style="font-size:8px;"></i>${escapeHtml(sales)}</div>
                ${grouped[branch][sales].map(pendingCardHTML).join('')}
              `).join('')}
            `;
          }).join('')}
        </div>
      `;
    }

    function calendarPageHTML() {
      const overlay = sidebarOpen ? `<div class="cal-overlay-backdrop" id="overlayBackdrop"></div><div class="cal-overlay-panel">${pendingPanelHTML()}</div>` : '';
      if (calendarViewMode === 'list') {
        return `
          <div class="calendar-hero">${heroSummaryHTML()}</div>
          <div class="calendar-card">
            ${calendarHeaderHTML()}
            <div class="rowscroll-wrap">
              <div class="page-fill-area">${listViewHTML()}</div>
              ${overlay}
            </div>
          </div>
        `;
      }
      return `
        <div class="calendar-hero">${heroSummaryHTML()}</div>
        <div class="calendar-card" id="calCard">
          ${calendarHeaderHTML()}
          <div class="rowscroll-wrap">
            <div class="row-scroll" id="rowScroll" style="flex:1;min-height:0;display:flex;flex-direction:column;">${calendarRowsHTML()}</div>
            ${overlay}
          </div>
        </div>
      `;
    }

    function listViewHTML() {
      const kw = listSearch.keyword.toLowerCase().trim();
      let rows = allRecords.filter(r => {
        const matchSearch = kw === '' || (r.顧客名 || '').toLowerCase().includes(kw) || (r.車種 || '').toLowerCase().includes(kw);
        const matchBranch = listSearch.branch === 'ALL' || r.拠点 === listSearch.branch;
        let matchMethod = true;
        if (listSearch.method !== 'ALL') {
          matchMethod = listSearch.method === 'OSS' ? isOssRecord(r) : !isOssRecord(r);
        }
        return matchSearch && matchBranch && matchMethod;
      }).sort((a, b) => {
        if (!a.登録予定日 && !b.登録予定日) return 0;
        if (!a.登録予定日) return 1;
        if (!b.登録予定日) return -1;
        return a.登録予定日 < b.登録予定日 ? -1 : (a.登録予定日 > b.登録予定日 ? 1 : 0);
      });

      let tableBody = '', cardBody = '';
      rows.forEach(r => {
        const c = branchColors[r.拠点] || branchColors['その他'];
        const dateDisplay = r.登録予定日 ? r.登録予定日 : `<span class="method-pill" style="background:var(--paper-bg);color:var(--paper);">未定</span>`;
        tableBody += `<tr class="js-open-record" ${recordDataAttr(r)}>
          <td class="font-num">${dateDisplay}</td>
          <td>${escapeHtml(r.顧客名)}</td>
          <td>${methodPill(isOssRecord(r))}</td>
          <td><span class="branch-pill" style="background:${c.bg};color:${c.c};">${r.拠点}</span> ${escapeHtml(r.担当者 || '')}</td>
          <td>${escapeHtml(r.車種 || '')}</td>
          <td style="color:var(--muted);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(r.備考 || '-')}</td>
        </tr>`;
        cardBody += `<div class="list-card js-open-record" ${recordDataAttr(r)}>
          <div class="list-card-top">
            <span class="list-card-name">${escapeHtml(r.顧客名)} 様</span>
            <span class="list-card-date font-num">${dateDisplay}</span>
          </div>
          <div class="list-card-meta">
            ${methodPill(isOssRecord(r))}
            <span class="branch-pill" style="background:${c.bg};color:${c.c};">${r.拠点}</span>
            <span style="color:var(--ink-2);font-weight:600;">${escapeHtml(r.担当者 || '')}</span>
            ${r.車種 ? `<span style="color:var(--ink-2);">${escapeHtml(r.車種)}</span>` : ''}
          </div>
          ${r.備考 ? `<div class="list-card-note">${escapeHtml(r.備考)}</div>` : ''}
        </div>`;
      });
      const emptyMsg = '該当するデータがありません。';

      return `
        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;">
          ${IS_EDITOR ? `<button type="button" class="action-btn" id="btnExportCsv" style="background:var(--oss);"><i class="fa-solid fa-file-csv"></i>CSV出力</button>` : ''}
          <input type="text" id="listSearchInput" class="settings-input" placeholder="顧客・車種で検索" value="${escapeAttr(listSearch.keyword)}" style="flex:1;min-width:160px;">
          <select id="listBranchFilter" class="settings-input">
            <option value="ALL" ${listSearch.branch === 'ALL' ? 'selected' : ''}>拠点: すべて</option>
            ${branchOrderFor(carType).map(b => `<option value="${b}" ${listSearch.branch === b ? 'selected' : ''}>${b}</option>`).join('')}
          </select>
          <select id="listMethodFilter" class="settings-input">
            <option value="ALL" ${listSearch.method === 'ALL' ? 'selected' : ''}>方法: すべて</option>
            <option value="OSS" ${listSearch.method === 'OSS' ? 'selected' : ''}>OSS</option>
            <option value="PAPER" ${listSearch.method === 'PAPER' ? 'selected' : ''}>紙登録</option>
          </select>
        </div>
        <div class="list-table-wrap">
          <table class="list-table">
            <thead><tr><th>日付</th><th>顧客名</th><th>方法</th><th>拠点/担当者</th><th>車種</th><th>備考</th></tr></thead>
            <tbody>${tableBody || `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px;">${emptyMsg}</td></tr>`}</tbody>
          </table>
        </div>
        <div class="list-card-wrap">
          ${cardBody || `<p style="text-align:center;color:var(--muted);padding:24px;font-size:12.5px;">${emptyMsg}</p>`}
        </div>
      `;
    }

    // ---- マイページ ----
    function mpMonthDate(offset) { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + offset, 1); }
    function mpTheadHTML() {
      const heads = LINKED_IS_BRANCH_MANAGER
        ? ['日付', '区分', '顧客名', '担当者', 'モデル', '登録方法', 'ステータス']
        : ['日付', '区分', '顧客名', 'モデル', '登録方法', 'ステータス'];
      return `<div class="mp-thead-row">${heads.map(h => `<span class="mp-col">${h}</span>`).join('')}</div>`;
    }
    function mpRowHTML(r) {
      const monthLabel = r.登録予定日 ? r.登録予定日.slice(5).replace('-', '/') : null;
      const dateChip = monthLabel
        ? `<span class="mp-date-chip" style="background:var(--surface-2);color:var(--ink-2);">${monthLabel}</span>`
        : `<span class="mp-date-chip" style="background:var(--accent-bg);color:var(--accent-ink);">未定</span>`;
      const isUsed = r.車両区分 === '中古車';
      const typeChip = `<span class="branch-pill" style="background:${isUsed ? 'var(--notice-bg)' : 'var(--accent-bg)'};color:${isUsed ? 'var(--notice)' : 'var(--accent-ink)'};">${escapeHtml(r.車両区分 || '-')}</span>`;
      const repCol = LINKED_IS_BRANCH_MANAGER ? `<span class="mp-col mp-col-rep">${escapeHtml(r.担当者 || '-')}</span>` : '';
      return `<div class="mp-row js-open-record" ${recordDataAttr(r)}>
        <span class="mp-col mp-col-date">${dateChip}</span>
        <span class="mp-col mp-col-type">${typeChip}</span>
        <span class="mp-col mp-name">${escapeHtml(r.顧客名)} 様</span>
        ${repCol}
        <span class="mp-col mp-model">${escapeHtml(r.車種 || '')}</span>
        <span class="mp-col mp-col-method">${methodPill(isOssRecord(r))}</span>
        <span class="mp-col mp-col-status"><span class="status-pill">${escapeHtml(r.ステータス || '-')}</span></span>
      </div>`;
    }
    // 拠点長アカウントは自分の担当分だけでなく、自分の拠点の登録状況を丸ごと見られるようにする
    function isMyMpRecord_(r) {
      return LINKED_IS_BRANCH_MANAGER ? r.拠点 === LINKED_BRANCH : r.担当者 === LINKED_NAME;
    }
    function myRecordsForOffset(offset) {
      const monthDate = mpMonthDate(offset);
      const y = monthDate.getFullYear(), m = monthDate.getMonth();
      const confirmed = mypageRecords.filter(r => {
        if (!isMyMpRecord_(r) || !r.登録予定日 || !isConfirmedStatus(r.ステータス)) return false;
        const p = parseYMD(r.登録予定日);
        return p.y === y && p.m === m;
      });
      const undecided = offset === 0 ? mypageRecords.filter(r => isMyMpRecord_(r) && !isConfirmedStatus(r.ステータス)) : [];
      return { confirmed, undecided };
    }
    function mpApplyFilters(records) {
      const keyword = mpSearch.name.trim();
      return records.filter(r => {
        if (keyword && !(r.顧客名 || '').includes(keyword) && !(r.担当者 || '').includes(keyword)) return false;
        if (mpSearch.method === 'OSS' && !isOssRecord(r)) return false;
        if (mpSearch.method === '紙' && isOssRecord(r)) return false;
        return true;
      });
    }
    function renderMpResults() {
      const box = document.getElementById('mpResults');
      if (!box) return;
      const prevScrollTop = box.scrollTop; // 入力のたびに再構築しても、スクロール位置が先頭に戻らないようにする
      const { confirmed, undecided } = myRecordsForOffset(myPageMonthOffset);
      const records = mpApplyFilters(confirmed.concat(undecided))
        .sort((a, b) => (a.登録予定日 || 'z').localeCompare(b.登録予定日 || 'z'));
      const rowsHtml = records.map(mpRowHTML).join('');
      box.innerHTML = `${mpTheadHTML()}<div class="mp-list">${rowsHtml || `<p style="font-size:12px;color:var(--muted);padding:16px 14px;">該当する登録データがありません。</p>`}</div>`;
      box.scrollTop = prevScrollTop;
      wireRecordClicks_(box);
    }

    function mypagePageHTML() {
      if (!LINKED_NAME) {
        return `
          <div>
            <h1 class="page-title">マイページ</h1>
            <p class="page-sub">${escapeHtml(CURRENT_USER_EMAIL)}</p>
          </div>
          <div class="settings-card">
            <h2 class="settings-card-title"><i class="fa-solid fa-triangle-exclamation"></i>マイページ未連携です</h2>
            <p class="settings-card-desc">このGoogleアカウントは、まだ「担当者マスタ」でフルネームと紐づけられていません。権限者に依頼して、設定画面から氏名とこのアカウントを登録してもらってください。登録データの「担当者」欄には、登録されるフルネームと同じ表記を入力する必要があります。</p>
          </div>
        `;
      }
      const monthDate = mpMonthDate(myPageMonthOffset);
      const monthLabel = `${monthDate.getFullYear()}年${monthDate.getMonth() + 1}月`;
      const { confirmed, undecided } = myRecordsForOffset(myPageMonthOffset);
      const mpKpiGroupHTML = (carType) => {
        const c = confirmed.filter(r => r.車両区分 === carType);
        const u = undecided.filter(r => r.車両区分 === carType);
        const total = c.length + u.length;
        const ossRate = total > 0 ? Math.round(c.concat(u).filter(isOssRecord).length / total * 100) : 0;
        return `
          <div class="mp-kpi-group">
            <div class="mp-kpi-group-label">${carType}</div>
            <div class="kpi-row mp-kpi-row">
              <div class="kpi-tile"><div class="kpi-label">受注台数</div><div class="kpi-value">${total}<span class="kpi-unit">台</span></div></div>
              <div class="kpi-tile"><div class="kpi-label">登録済み</div><div class="kpi-value" style="color:var(--accent-ink);">${c.length}<span class="kpi-unit">件</span></div></div>
              <div class="kpi-tile"><div class="kpi-label">未定</div><div class="kpi-value" style="color:#B4620D;">${u.length}<span class="kpi-unit">件</span></div></div>
              <div class="kpi-tile"><div class="kpi-label">OSS登録率</div><div class="kpi-value">${ossRate}<span class="kpi-unit">%</span></div></div>
              <button type="button" class="slide-hint" title="横にスライドしてさらに表示"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
          </div>
        `;
      };

      return `
        <div class="mp-header-row">
          <div class="mp-header-id">
            <div class="cp-avatar" style="width:38px;height:38px;flex:0 0 38px;font-size:14px;">${LINKED_NAME[0] || '?'}</div>
            <div class="mp-header-text">
              <h1 class="page-title">マイページ</h1>
              <p class="page-sub mp-subtitle">${LINKED_IS_BRANCH_MANAGER
                ? `${escapeHtml(LINKED_NAME)} さん（${escapeHtml(LINKED_BRANCH)} 拠点長）の拠点全体の受注・登録状況`
                : `${escapeHtml(LINKED_NAME)} さんの受注・登録状況`}</p>
            </div>
          </div>
          <div class="mp-header-nav">
            <button type="button" class="nav-btn" id="mpPrev"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="font-num" style="font-size:14px;font-weight:700;min-width:92px;text-align:center;display:inline-block;">${monthLabel}</span>
            <button type="button" class="nav-btn" id="mpNext"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
        ${CAR_TYPES.map(mpKpiGroupHTML).join('')}
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
          <input id="mpSearchName" class="settings-input" placeholder="${LINKED_IS_BRANCH_MANAGER ? '顧客名・担当者名で絞り込み' : '顧客名で絞り込み'}" value="${escapeAttr(mpSearch.name)}" style="flex:1;min-width:160px;">
          <select id="mpSearchMethod" class="settings-input">
            <option ${mpSearch.method === '全て' ? 'selected' : ''}>全て</option>
            <option ${mpSearch.method === 'OSS' ? 'selected' : ''}>OSS</option>
            <option ${mpSearch.method === '紙' ? 'selected' : ''}>紙</option>
          </select>
        </div>
        <div id="mpResults" class="page-fill-area"></div>
      `;
    }

    // ---- 設定ページ ----
    function themeSectionHTML() {
      const isDirty = pendingTheme !== currentTheme;
      let msg = '';
      if (isDirty) msg = `<span class="theme-msg dirty"><i class="fa-solid fa-circle-exclamation"></i> 未保存の変更があります</span>`;
      else if (themeMessage) msg = `<span class="theme-msg saved"><i class="fa-solid fa-circle-check"></i> ${themeMessage}</span>`;
      return `
        <div class="settings-card">
          <h2 class="settings-card-title"><i class="fa-solid fa-palette"></i>テーマ設定</h2>
          <p class="settings-card-desc">お好みのアクセントカラーを選び、「保存」を押すと反映されます。選択内容はご自身のアカウントにのみ適用され、他のユーザーには影響しません。</p>
          <div class="theme-swatches">
            ${Object.keys(THEMES).map(key => `
              <button type="button" class="theme-swatch ${pendingTheme === key ? 'active' : ''}" data-theme="${key}">
                <span class="theme-dot" style="background:${THEMES[key].accent};"></span>${THEMES[key].name}
              </button>
            `).join('')}
          </div>
          <div class="theme-save-row">
            <button type="button" class="theme-save-btn" id="themeSaveBtn" ${isDirty ? '' : 'disabled'}>保存</button>
            ${msg}
          </div>
        </div>
      `;
    }
    function iconSectionHTML() {
      if (!IS_EDITOR) return '';
      const previewInner = sidePanelIconUrl
        ? `<img src="${escapeAttr(sidePanelIconUrl)}" alt="">`
        : `<i class="fa-solid fa-car"></i>`;
      return `
        <div class="settings-card">
          <h2 class="settings-card-title"><i class="fa-solid fa-icons"></i>サイドパネルアイコン設定</h2>
          <p class="settings-card-desc">左サイドパネル上部中央に表示するアイコンを、画像のアップロードか、画像URLの直接指定のどちらかで設定できます。大きな画像を選んでも、アップロード時に自動で縮小されるため、常に一定サイズの円形アイコンとして表示されます。全ユーザーの画面に反映されます。この項目は権限者としてログインした場合のみ表示されます。</p>
          <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px;">
            <div class="cp-icon-mark" style="width:84px;height:84px;font-size:32px;margin-bottom:0;">${previewInner}</div>
            <button type="button" class="btn-secondary" id="iconResetBtn">デフォルトに戻す</button>
          </div>
          <div class="settings-subblock">
            <label style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:block;">方法1: 画像をアップロード</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
              <input type="text" id="iconFolderIdInput" class="settings-input" placeholder="保存先 Drive フォルダのURL、またはIDのみ" value="${escapeAttr(sideIconFolderId)}" style="flex:1;min-width:220px;">
              <button type="button" class="settings-add-btn" id="saveFolderIdBtn">フォルダを保存</button>
            </div>
            <p id="folderIdMsg" style="font-size:11px;font-weight:600;margin-top:6px;color:var(--muted);">${sideIconFolderId ? '' : 'アップロード前に、保存先のDriveフォルダを入力して保存してください。'}</p>
            <div style="margin-top:10px;">
              <label class="settings-add-btn" style="cursor:pointer;">
                <i class="fa-solid fa-upload"></i>画像をアップロード
                <input type="file" id="iconFileInput" accept="image/*" style="display:none;">
              </label>
            </div>
            <p id="iconUploadMsg" style="font-size:11.5px;font-weight:700;margin-top:8px;"></p>
          </div>
          <div class="settings-subblock" style="border-bottom:none;padding-bottom:0;margin-bottom:0;">
            <label style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:block;">方法2: 画像URLを直接指定</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <input type="text" id="iconUrlInput" class="settings-input" placeholder="https://..." value="${escapeAttr(sideIconExternalUrlValue)}" style="flex:1;min-width:220px;">
              <button type="button" class="settings-add-btn" id="saveIconUrlBtn">URLを保存</button>
            </div>
            <p class="settings-card-desc" style="margin-top:6px;">既に社内の別システムなどで公開されている画像を、そのままアイコンとして使いたい場合に利用してください。https:// から始まるURLのみ利用できます。</p>
            <p id="iconUrlMsg" style="font-size:11.5px;font-weight:700;margin-top:6px;"></p>
          </div>
        </div>
      `;
    }
    function branchSectionHTML() {
      if (!IS_EDITOR) return '';
      let msg = '';
      if (branchesMsg) msg = `<span class="theme-msg saved"><i class="fa-solid fa-circle-check"></i> ${branchesMsg}</span>`;
      else if (branchesDirty) msg = `<span class="theme-msg dirty"><i class="fa-solid fa-circle-exclamation"></i> 未保存の変更があります</span>`;
      return `
        <div class="settings-card">
          <h2 class="settings-card-title"><i class="fa-solid fa-store"></i>拠点設定</h2>

    // ---- 全体レイアウト ----
    function controlPanelHTML() {
