<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: app bar + tab strip over one working pane; detail opens as a side drawer (full screen on phones) */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E9EEEC; --fg:#17201C; --muted:#5D6A65; --line:#D3DBD8;
  --accent:#1E7550; --accent-fg:#FFFFFF; --accent-soft:#E2F0E9; --silver:#A7B2AE;
  --err:#C0392F; --err-soft:#FBE9E7; --warn:#A86A12; --warn-soft:#FBF1DF; --info:#2E6AA8; --info-soft:#E6EFF8;
  --pend:#6B4FA8; --pend-soft:#EFEAF8;
  --uA:#1E7550; --uB:#2E6AA8; --uAI:#9A5B12;
  --plate-bg:#FFFFFF; --plate-fg:#155F3D; --plate-line:#9FB3AA;
  --weekend:#F4F0EA; --holiday:#F9E8E6;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-data:"BIZ UDGothic","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  --shadow:0 10px 30px rgba(20,40,30,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --sunk:#111915; --fg:#E4EBE8; --muted:#93A29C; --line:#28342F;
  --accent:#4CC28B; --accent-fg:#0B1A13; --accent-soft:#163326; --silver:#6F7C77;
  --err:#F07A70; --err-soft:#3A1C1A; --warn:#E5B252; --warn-soft:#352914; --info:#86B6E8; --info-soft:#17283A;
  --pend:#B9A2EE; --pend-soft:#2A2240;
  --uA:#4CC28B; --uB:#86B6E8; --uAI:#E5A95C;
  --plate-bg:#EEF2F0; --plate-fg:#155F3D; --plate-line:#8DA39A;
  --weekend:#1C2420; --holiday:#2C1D1C; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --sunk:#111915; --fg:#E4EBE8; --muted:#93A29C; --line:#28342F;
  --accent:#4CC28B; --accent-fg:#0B1A13; --accent-soft:#163326; --silver:#6F7C77;
  --err:#F07A70; --err-soft:#3A1C1A; --warn:#E5B252; --warn-soft:#352914; --info:#86B6E8; --info-soft:#17283A;
  --pend:#B9A2EE; --pend-soft:#2A2240;
  --uA:#4CC28B; --uB:#86B6E8; --uAI:#E5A95C;
  --plate-bg:#EEF2F0; --plate-fg:#155F3D; --plate-line:#8DA39A;
  --weekend:#1C2420; --holiday:#2C1D1C; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

.appbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.appbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-weight:700;font-size:15px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:16px;letter-spacing:.04em}
.brand small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
.spacer{flex:1}
.who{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap;font-weight:700;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-data);font-size:11px;padding:0 6px;border-radius:999px;background:var(--err);color:#fff;line-height:18px}

main{padding-block:20px 48px}
.view{display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:15px;margin:0 0 10px;letter-spacing:.03em}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:0;color:var(--muted);font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.muted{color:var(--muted)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;border-left:5px solid var(--silver)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.kpi .v{font-family:var(--f-data);font-size:30px;font-weight:700;line-height:1.2}
.kpi .s{font-size:11px;color:var(--muted)}
.kpi.ok{border-left-color:var(--accent)} .kpi.err{border-left-color:var(--err)} .kpi.err .v{color:var(--err)}
.kpi.warn{border-left-color:var(--warn)} .kpi.warn .v{color:var(--warn)} .kpi.pend{border-left-color:var(--pend)} .kpi.pend .v{color:var(--pend)}
.kpi:hover{border-color:var(--accent)}

/* unit cards */
.units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--u)}
.ucard .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ucard .t b{font-size:14px}
.ustats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ustats div{display:flex;flex-direction:column}
.ustats span{font-size:11px;color:var(--muted)}
.ustats strong{font-family:var(--f-data);font-size:22px;line-height:1.2}
.ustats .neg{color:var(--err)}
.ucard .sub{font-size:11px;color:var(--muted)}
.utag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;white-space:nowrap;color:var(--u)}
.utag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--u)}
.u-A{--u:var(--uA)} .u-B{--u:var(--uB)} .u-AI{--u:var(--uAI)} .u-none{--u:var(--silver)}

.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.meta dt{color:var(--muted)} .meta dd{margin:0}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.log li:last-child{border-bottom:0}
.log time{font-family:var(--f-data);color:var(--muted)}

.plate{display:inline-flex;flex-direction:column;align-items:center;background:var(--plate-bg);color:var(--plate-fg);border:1.5px solid var(--plate-line);border-radius:4px;padding:1px 8px 2px;line-height:1.15;font-family:var(--f-data);min-width:96px;font-weight:700}
.plate .pt{font-size:10px;letter-spacing:.06em}
.plate .pb{font-size:15px;letter-spacing:.04em;display:flex;align-items:baseline;gap:5px}
.plate .pb i{font-style:normal;font-size:11px}
.plate.bad{border-color:var(--err)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--accent);background:var(--accent-soft)}
.pill.err{color:var(--err);background:var(--err-soft)}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.pend{color:var(--pend);background:var(--pend-soft)}
.pill.ex,.pill.skip,.pill.ns{color:var(--muted);background:var(--sunk)}
.nc{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .num{margin-left:4px;opacity:.75}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.search{flex:1;min-width:180px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:13px}
th{font-size:11px;color:var(--muted);letter-spacing:.06em;background:var(--sunk);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.list tbody tr{cursor:pointer}
.list tbody tr:hover{background:var(--accent-soft)}
.list{min-width:900px}
td.reason{color:var(--muted);font-size:12px;max-width:300px}
td.reason b{color:var(--fg)}
tr.r-err td:first-child{box-shadow:inset 4px 0 0 var(--err)}
tr.r-warn td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
tr.r-pend td:first-child{box-shadow:inset 4px 0 0 var(--pend)}
tr.r-ex td{opacity:.55}
.empty{padding:28px;text-align:center;color:var(--muted)}

.rgroup{display:flex;flex-direction:column;gap:10px}
.rgroup h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--silver)}
.rcard.err{border-top-color:var(--err)} .rcard.warn{border-top-color:var(--warn)} .rcard.pend{border-top-color:var(--pend)}
.rcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issues li{font-size:12px;padding:6px 10px;border-radius:6px;line-height:1.5}
.issues li.err{background:var(--err-soft)} .issues li.warn{background:var(--warn-soft)} .issues li.info{background:var(--info-soft)} .issues li.pend{background:var(--pend-soft)}
.issues li b{display:block;font-size:11px;letter-spacing:.04em}
.issues li.err b{color:var(--err)} .issues li.warn b{color:var(--warn)} .issues li.info b{color:var(--info)} .issues li.pend b{color:var(--pend)}
.issues li.acked{opacity:.6}
.done{display:flex;align-items:center;gap:10px;padding:18px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700}

/* documents */
.docbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.fileline{font-size:12px;color:var(--muted)}
.fileline b{color:var(--fg)}
.sheettabs{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end}
.stab{border:1px solid var(--line);border-bottom:0;background:var(--sunk);padding:6px 12px;border-radius:8px 8px 0 0;font-size:12px;font-weight:700;color:var(--muted);border-top:3px solid var(--u)}
.stab[aria-selected="true"]{background:var(--surface);color:var(--fg)}
.cal{min-width:760px}
.cal th,.cal td{padding:6px 8px;border-right:1px solid var(--line);font-size:12px}
.cal td.d{font-family:var(--f-data);font-weight:700;white-space:nowrap}
.cal td.w{text-align:center;width:36px}
.cal td.c{font-family:var(--f-data);text-align:right;width:64px;font-weight:700}
.cal td.c.attn{background:var(--warn-soft);color:var(--warn)}
.cal td.c.neg{background:var(--err-soft);color:var(--err)}
.cal td.p{font-family:var(--f-data);white-space:nowrap;min-width:118px}
.cal tr.we td{background:var(--weekend)}
.cal tr.ho td{background:var(--holiday)}
.cal tr.we td.w,.cal tr.ho td.w{color:var(--err)}
.cal tr.sat td.w{color:var(--info)}
.cal tr.carry td{background:var(--sunk);font-weight:700}
.cal tfoot td{font-weight:700;background:var(--sunk);border-top:2px solid var(--fg)}
.cnt{min-width:520px}
.lockbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice{font-size:12px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--fg);border-left:4px solid var(--warn)}
.notice.ok{background:var(--accent-soft);border-left-color:var(--accent)}
.notice.info{background:var(--info-soft);border-left-color:var(--info)}
.report{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;border-top:4px solid var(--u);display:flex;flex-direction:column;gap:10px}
.rp dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:13px}
.rp dt{color:var(--muted)} .rp dd{margin:0;font-family:var(--f-data);font-weight:700;text-align:right}
.rp dd.big{font-size:20px}

/* receipts */
.rcpt-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.form{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-direction:column;gap:6px}
.row label,.row .lbl{font-weight:700;font-size:13px}
.row .hint{font-size:12px;color:var(--muted)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline .field{flex:1;min-width:180px}
tr.cancel td{text-decoration:line-through;color:var(--muted)}
tr.cancel td:last-child{text-decoration:none}

/* settings */
.settings-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.check{font-size:12px;padding:8px 12px;border-radius:8px}
.check.ok{background:var(--accent-soft)} .check.ng{background:var(--err-soft);color:var(--err)}
.switch{display:flex;align-items:center;gap:10px;font-size:13px}
.switch input{width:40px;height:22px;accent-color:var(--accent)}
.folder{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.folder .ft{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.areas{display:flex;flex-direction:column;gap:8px;font-size:13px}
.areas div{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.areas .tagx{font-family:var(--f-data);font-size:12px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;background:var(--sunk)}
.rule{font-size:12px;border-collapse:collapse;width:100%}
.rule td,.rule th{padding:6px 8px;font-size:12px}
.carrygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.users{display:flex;flex-direction:column;gap:6px}
.user{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;flex-wrap:wrap}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1000px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.dbody{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px}
.dfoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap;align-items:center}
.doc{background:#FFFFFF;color:#1B1B1B;border:1px solid var(--line);border-radius:4px;padding:18px 16px;font-family:var(--f-data);font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.doc h3{text-align:center;font-size:14px;letter-spacing:.3em;margin:0 0 4px}
.doc .sub{text-align:center;font-size:9px;color:#666;margin-bottom:12px}
.doc table{border:1px solid #444}
.doc td{border:1px solid #999;padding:5px 6px;font-size:10.5px;color:#1B1B1B}
.doc td.k{background:#F1F1F1;width:34%;font-size:9.5px}
.doc mark{background:#FFE79A;color:#1B1B1B;padding:0 2px;outline:2px solid #E2B100}
.doc .foot{margin-top:10px;font-size:9px;color:#666;display:flex;justify-content:space-between}
.doc .qr{width:46px;height:46px;background:repeating-conic-gradient(#222 0 25%,#fff 0 50%) 0 0/8px 8px;border:3px solid #fff;outline:1px solid #222}
.editor{display:flex;flex-direction:column;gap:14px}
.plategrid{display:grid;grid-template-columns:1.4fr 1fr .8fr 1.2fr;gap:8px}
.plategrid .field{width:100%;font-family:var(--f-data);font-size:15px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f span{font-size:11px;color:var(--muted);font-weight:700}
.f .field.bad{border-color:var(--err);background:var(--err-soft)}
.derived{font-size:12px;padding:8px 10px;border-radius:8px;background:var(--sunk);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:0;font-size:12px;display:flex;flex-direction:column;gap:6px}
.hist li{padding:6px 10px;background:var(--sunk);border-radius:6px}
.hist time{font-family:var(--f-data);color:var(--muted);margin-right:6px}
.exbox{display:flex;gap:8px;flex-wrap:wrap;width:100%;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;z-index:60;box-shadow:var(--shadow)}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .units,.grid2,.settings-grid,.rcpt-grid,.dbody{grid-template-columns:minmax(0,1fr)}
  .plategrid{grid-template-columns:1fr 1fr}
  .who{display:none}
}
@media (max-width:480px){ .kpi .v{font-size:24px} .carrygrid{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:no-preference){ .drawer{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px);opacity:.6}} }

/* ---- 追加：通信・読み込み・エラー表示 ---- */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;overflow:hidden;pointer-events:none}
.progress::before{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){ .progress::before{animation:prog 1.1s ease-in-out infinite} @keyframes prog{to{left:100%}} }
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px 16px;color:var(--muted);font-weight:700}
.loading.sm{padding:16px;font-size:13px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);flex:none}
@media (prefers-reduced-motion:no-preference){ .spin{animation:spin .8s linear infinite} @keyframes spin{to{transform:rotate(360deg)}} }
.btn .spin{width:14px;height:14px;border-width:2px}
.errbox{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:18px;border-radius:10px;background:var(--err-soft);border-left:4px solid var(--err)}
.errbox b{color:var(--err)}
