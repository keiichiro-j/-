<script>
  var MAX_VEHICLES = 19;
  var INITIAL_VEHICLE_ROWS = 3;
  var rowSeq = 0;

  // サーバー側 Constants.gs の値と合わせる(クライアントは google.script.run を介さずこの値を直接使う)
  var SUBMISSION_STATUS_CANCELLED_ = '取消';

  function createVehicleRow() {
    rowSeq++;
    var tr = document.createElement('tr');
    tr.className = 'vehicleRow';
    tr.innerHTML =
      '<td class="cell-no"></td>' +
      '<td class="cell-regdate"><input type="date" class="v-indivRegDate"></td>' +
      '<td class="cell-username"><input type="text" class="v-userName" list="dl-usernames" autocomplete="off"></td>' +
      brandCell_() +
      '<td><input type="text" class="v-chassis" maxlength="4" inputmode="numeric" title="半角数字4桁で入力してください"></td>' +
      '<td><input type="text" class="v-model"></td>' +
      '<td><input type="text" class="v-classNum"></td>' +
      '<td><input type="number" class="v-autoTax" min="0" step="1" title="0以上の整数で入力してください（空欄可）"></td>' +
      '<td><input type="number" class="v-envTax" min="0" step="1" title="0以上の整数で入力してください（空欄可）"></td>' +
      '<td><input type="number" class="v-weightTax" min="0" step="1" title="0以上の整数で入力してください（空欄可）"></td>' +
      selectCell_('v-hopeNum') +
      selectCell_('v-yobi') +
      selectCell_('v-honken') +
      selectCell_('v-shinsho') +
      '<td><input type="text" class="v-person" list="dl-persons" autocomplete="off"></td>' +
      '<td><button type="button" class="btnRemoveRow" title="この行を削除" aria-label="この行を削除">&times;</button></td>';
    return tr;
  }

  function selectCell_(cls) {
    return '<td><select class="' + cls + '"><option value=""></option><option value="〇">〇</option></select></td>';
  }

  function brandCell_() {
    return '<td><select class="v-brand"><option value=""></option><option value="MB">MB</option><option value="AU">AU</option></select></td>';
  }

  function renumberRows() {
    var rows = document.querySelectorAll('#vehicleTableBody .vehicleRow');
    rows.forEach(function (tr, i) {
      tr.querySelector('.cell-no').textContent = i + 1;
    });
    updateVehicleCountBadge_();
    updateScrollShadow_(document.querySelector('#vehicleTable').closest('.tableScroll'));
  }

  function updateVehicleCountBadge_() {
    var count = document.querySelectorAll('#vehicleTableBody .vehicleRow').length;
    var badge = document.getElementById('vehicleCountBadge');
    if (badge) setCountBadge_(badge, count, ' / ' + MAX_VEHICLES + ' 台');
  }

  function addVehicleRow() {
    var body = document.getElementById('vehicleTableBody');
    if (body.querySelectorAll('.vehicleRow').length >= MAX_VEHICLES) return;
    body.appendChild(createVehicleRow());
    renumberRows();
    updateAddRowButtonState();
  }

  function updateAddRowButtonState() {
    var count = document.querySelectorAll('#vehicleTableBody .vehicleRow').length;
    var btn = document.getElementById('btnAddRow');
    btn.disabled = count >= MAX_VEHICLES;
    btn.textContent = count >= MAX_VEHICLES ? '最大' + MAX_VEHICLES + '台まで入力できます' : '＋ 行を追加';
  }

  document.getElementById('vehicleTableBody').addEventListener('click', function (e) {
    if (e.target.classList.contains('btnRemoveRow')) {
      var body = document.getElementById('vehicleTableBody');
      if (body.querySelectorAll('.vehicleRow').length <= 1) return;
      e.target.closest('tr').remove();
      renumberRows();
      updateAddRowButtonState();
    }
  });

  document.getElementById('btnAddRow').addEventListener('click', addVehicleRow);

  // OSSと紙で「登録日」の入力方法を切り替える
  function toggleRegDateMode() {
    var type = document.getElementById('type').value;
    var isOss = type === 'OSS';

    document.getElementById('commonRegDateField').style.display = isOss ? 'none' : '';
    document.getElementById('regDateCommon').required = !isOss;

    document.querySelectorAll('.colRegDate, .cell-regdate').forEach(function (el) {
      el.classList.toggle('is-hidden', !isOss);
    });

    updateStickyOffsets_();
  }

  // 出力フォーマットのセグメントボタン(OSS/紙)を切り替える
  function setType(value) {
    document.getElementById('type').value = value;
    document.getElementById('segOss').classList.toggle('is-active', value === 'OSS');
    document.getElementById('segOss').setAttribute('aria-selected', value === 'OSS');
    document.getElementById('segPaper').classList.toggle('is-active', value === '紙');
    document.getElementById('segPaper').setAttribute('aria-selected', value === '紙');
    toggleRegDateMode();
  }
  document.getElementById('segOss').addEventListener('click', function () { setType('OSS'); });
  document.getElementById('segPaper').addEventListener('click', function () { setType('紙'); });

  function populateSuggestions(data) {
    fillDatalist_('dl-companies', data.companies);
    fillDatalist_('dl-managers', data.managers);
    fillDatalist_('dl-usernames', data.userNames);
    fillDatalist_('dl-persons', data.persons);
  }

  function fillDatalist_(id, values) {
    var dl = document.getElementById(id);
    dl.innerHTML = '';
    (values || []).forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v;
      dl.appendChild(opt);
    });
  }

  function collectVehicles_() {
    var rows = document.querySelectorAll('#vehicleTableBody .vehicleRow');
    var vehicles = [];
    rows.forEach(function (row) {
      vehicles.push({
        indivRegDate: row.querySelector('.v-indivRegDate').value,
        userName: row.querySelector('.v-userName').value.trim(),
        brand: row.querySelector('.v-brand').value,
        chassis: row.querySelector('.v-chassis').value.trim(),
        model: row.querySelector('.v-model').value.trim(),
        classNum: row.querySelector('.v-classNum').value.trim(),
        autoTax: row.querySelector('.v-autoTax').value,
        envTax: row.querySelector('.v-envTax').value,
        weightTax: row.querySelector('.v-weightTax').value,
        hopeNum: row.querySelector('.v-hopeNum').value,
        yobi: row.querySelector('.v-yobi').value,
        honken: row.querySelector('.v-honken').value,
        shinsho: row.querySelector('.v-shinsho').value,
        person: row.querySelector('.v-person').value.trim()
      });
    });
    return vehicles;
  }

  function clearInvalid_() {
    document.querySelectorAll('.is-invalid').forEach(function (el) { el.classList.remove('is-invalid'); });
  }

  function highlightRequired_() {
    var ok = true;
    ['company', 'manager', 'sendDate', 'sendBatch'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el.value.trim()) { el.classList.add('is-invalid'); ok = false; }
    });
    var regDateCommon = document.getElementById('regDateCommon');
    if (document.getElementById('type').value === '紙' && !regDateCommon.value) {
      regDateCommon.classList.add('is-invalid');
      ok = false;
    }
    return ok;
  }

  // 車台番号(数字4桁)・税額(0以上の整数)の形式エラーを、該当セルそのものをハイライトして知らせる。
  // サーバー側 ValidationService.gs の validateVehicle_ と同じルールをミラーしている。
  // 使用者名が空の行はサーバー側でも無視される(getActiveVehicles_)ため検証しない。
  function highlightVehicleErrors_(vehicles) {
    var ok = true;
    var rows = document.querySelectorAll('#vehicleTableBody .vehicleRow');
    rows.forEach(function (tr, i) {
      var car = vehicles[i];
      if (!car || car.userName === '') return;

      if (!/^\d{4}$/.test(car.chassis || '')) {
        tr.querySelector('.v-chassis').classList.add('is-invalid');
        ok = false;
      }

      ['autoTax', 'envTax', 'weightTax'].forEach(function (key) {
        var raw = car[key];
        if (raw === '' || raw === undefined || raw === null) return;
        var n = Number(raw);
        if (isNaN(n) || n < 0 || Math.floor(n) !== n) {
          tr.querySelector('.v-' + key).classList.add('is-invalid');
          ok = false;
        }
      });
    });
    return ok;
  }

  function setResult_(text, kind) {
    var el = document.getElementById('result');
    el.className = 'result' + (kind ? ' -' + kind : '');
    document.getElementById('resultText').innerHTML = text;
  }

  function setProcessing_(on) {
    document.getElementById('submitSpinner').classList.toggle('is-hidden', !on);
  }

  // 飛騨登録トグル: ONのときだけPDFの飛騨登録バッジが印字される(TemplateService.gs参照)
  var hidaOn = false;
  function setHidaFlag_(on) {
    hidaOn = on;
    var btn = document.getElementById('hidaToggle');
    btn.classList.toggle('is-active', on);
    btn.setAttribute('aria-pressed', on);
    btn.textContent = on ? '飛騨登録：対象' : '飛騨登録：対象外';
  }
  document.getElementById('hidaToggle').addEventListener('click', function () { setHidaFlag_(!hidaOn); });

  // ---------- 二重送信防止 ----------
  // ボタン連打やネットワーク遅延時の再送を防ぐため、送信ごとに使い捨てのトークンを発行し
  // サーバー側(Api.gs processFormData)で CacheService により同一トークンの再処理を弾く。
  // isSubmitting はボタン無効化がまだ反映されない一瞬の二重クリックを防ぐ、より即時のガード。
  var isSubmitting = false;
  function generateSubmissionToken_() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
  }
  var submissionToken_ = generateSubmissionToken_();

  function submitForm(e) {
    e.preventDefault();
    if (isSubmitting) return;
    clearInvalid_();

    var vehicles = collectVehicles_();
    var hasActiveVehicle = vehicles.some(function (v) { return v.userName !== ''; });
    var requiredOk = highlightRequired_();
    var vehiclesOk = highlightVehicleErrors_(vehicles);

    if (!requiredOk) {
      setResult_('必須項目が未入力です（赤枠の項目を確認してください）', 'error');
      return;
    }
    if (!hasActiveVehicle) {
      setResult_('車両データを1台以上入力してください（使用者名が必須です）', 'error');
      return;
    }
    if (!vehiclesOk) {
      setResult_('車両データにエラーがあります（赤枠のセルを確認してください）', 'error');
      return;
    }

    var formData = {
      type: document.getElementById('type').value,
      company: document.getElementById('company').value.trim(),
      manager: document.getElementById('manager').value.trim(),
      sendDate: document.getElementById('sendDate').value,
      sendBatch: document.getElementById('sendBatch').value,
      regDateCommon: document.getElementById('regDateCommon').value,
      hidaRegistration: hidaOn,
      submissionToken: submissionToken_,
      vehicles: vehicles
    };

    isSubmitting = true;
    var btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    hidePdfPreview_(document.getElementById('resultPdfPreview'), document.getElementById('resultPdfPreviewFrame'));
    setProcessing_(true);
    setResult_('処理中です。履歴に記録し、PDFを作成しています…', 'pending');

    google.script.run
      .withSuccessHandler(function (pdfUrl) {
        isSubmitting = false;
        btn.disabled = false;
        setProcessing_(false);
        historyHeader_ = []; // 次に履歴確認画面を開いたとき、今回の登録を含めて再取得させる
        submissionToken_ = generateSubmissionToken_(); // 次回送信用のトークンを発行し直す
        setResult_(
          '完了しました。PDFを自動で開きます。<br>開かない場合は <a href="' + pdfUrl + '" target="_blank">こちら</a> をクリックしてください。',
          'success'
        );
        document.getElementById('resultPdfPreviewFrame').src = buildPdfPreviewUrl_(pdfUrl);
        document.getElementById('resultPdfPreview').classList.remove('is-hidden');
        window.open(pdfUrl, '_blank');
        celebrateSubmission_();
        loadActivitySnapshot_(); // 送付が増えた直後の状況をすぐにライブ表示へ反映する
      })
      .withFailureHandler(function (error) {
        isSubmitting = false;
        btn.disabled = false;
        setProcessing_(false);
        setResult_('エラーが発生しました:\n' + error.message, 'error');
      })
      .processFormData(formData);
  }

  // 登録完了のお祝い演出。画面に一瞬だけ紙吹雪を降らせて自動的に消える。
  var CONFETTI_COLORS = ['var(--ink)', 'var(--accent)', 'var(--accent-dark)', 'var(--muted)'];
  function celebrateSubmission_() {
    var layer = document.getElementById('confettiLayer');
    if (!layer) return;
    for (var i = 0; i < 60; i++) {
      var piece = document.createElement('span');
      piece.className = 'confettiPiece';
      piece.style.left = (Math.random() * 100) + 'vw';
      piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      piece.style.animationDelay = (Math.random() * 0.3) + 's';
      piece.style.animationDuration = (1.1 + Math.random() * 0.6) + 's';
      layer.appendChild(piece);
    }
    setTimeout(function () { layer.innerHTML = ''; }, 2200);
  }

  document.getElementById('mainForm').addEventListener('submit', submitForm);

  document.getElementById('btnCloseResultPreview').addEventListener('click', function () {
    hidePdfPreview_(document.getElementById('resultPdfPreview'), document.getElementById('resultPdfPreviewFrame'));
  });

  // フォームを初期状態に戻す(車両行も INITIAL_VEHICLE_ROWS 件まで作り直す)
  function resetForm() {
    clearInvalid_();
    document.getElementById('mainForm').reset();
    setType('OSS');
    setHidaFlag_(false);
    document.getElementById('vehicleTableBody').innerHTML = '';
    for (var i = 0; i < INITIAL_VEHICLE_ROWS; i++) addVehicleRow();
    setResult_('', '');
    hidePdfPreview_(document.getElementById('resultPdfPreview'), document.getElementById('resultPdfPreviewFrame'));
    applyDefaultFormValues_();
  }
  document.getElementById('btnClear').addEventListener('click', resetForm);

  // ---------- 起動画面(ローディング画面) ----------
  // 画像・「Now Loading」表示はIndex.html側でページ生成時から表示済み。
  // window.onload(＝ページの初期描画が整ったタイミング)でフェードアウトさせるが、
  // 読み込みが速すぎると一瞬で消えてしまうため、最低でもLOADING_MIN_DISPLAY_MS_は表示し続ける。
  var LOADING_MIN_DISPLAY_MS_ = 2400;
  var loadingOverlayShownAt_ = (window.performance && performance.now) ? performance.now() : Date.now();

  function hideLoadingOverlay_() {
    var overlay = document.getElementById('loadingOverlay');
    if (!overlay) return;
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    var remaining = Math.max(0, LOADING_MIN_DISPLAY_MS_ - (now - loadingOverlayShownAt_));
    setTimeout(function () { overlay.classList.add('is-hidden'); }, remaining);
  }

  window.onload = function () {
    hideLoadingOverlay_();
    for (var i = 0; i < INITIAL_VEHICLE_ROWS; i++) addVehicleRow();
    toggleRegDateMode();
    initHistoryDefaultRange_();
    initPdfDefaultRange_();
    document.getElementById('mailSendDate').value = formatDateInput_(new Date());
    loadMailRecipients_();
    loadDefaultFormValues_();
    loadAutoMailStatus_();
    document.querySelectorAll('.tableScroll').forEach(function (el) {
      updateScrollShadow_(el);
      el.addEventListener('scroll', function () { updateScrollShadow_(el); });
    });
    window.addEventListener('resize', function () {
      updateStickyOffsets_();
      document.querySelectorAll('.tableScroll').forEach(updateScrollShadow_);
    });
    google.script.run.withSuccessHandler(populateSuggestions).getSuggestions();
    loadLogoUrl_();
    loadLoadingImagePreview_();

    // ---------- 画期的ビジュアル: ライブ演出の初期化 ----------
    initLiveClock_();
    loadActivitySnapshot_();
    setInterval(loadActivitySnapshot_, 3 * 60 * 1000); // 3分ごとに本日の送付状況を更新
    initRipple_();
  };

  // ---------- スマホ対応: 横スクロールする車両テーブルの操作性補助 ----------

  // 「No.」「使用者名」列を横スクロール時も画面に固定表示する(狭い画面向け、Stylesheet.htmlのメディアクエリで有効化)。
  // OSSのときだけ「登録日」列が表示されるため、その分「使用者名」列の左端位置(sticky left)がずれる。
  // 実際のレンダリング幅から動的に算出する。
  function updateStickyOffsets_() {
    var noEl = document.querySelector('#vehicleTable thead .colNo');
    var width = noEl ? noEl.getBoundingClientRect().width : 0;
    document.documentElement.style.setProperty('--sticky-username-left', width + 'px');
  }

  // 横スクロールできる余地がまだ右側にあるとき、その旨をうっすらとした影で示す(スマホでの見切れ対策)。
  function updateScrollShadow_(el) {
    if (!el) return;
    var hasMoreRight = el.scrollLeft + el.clientWidth < el.scrollWidth - 1;
    el.classList.toggle('has-overflow-right', hasMoreRight);
  }

  // ---------- PDFプレビュー共通ヘルパー ----------

  // file.getUrl() が返す "https://drive.google.com/file/d/<ID>/view?..." からファイルIDを取り出す。
  function driveFileIdFromUrl_(url) {
    var m = /\/d\/([^\/]+)/.exec(url || '');
    return m ? m[1] : null;
  }

  function buildPdfPreviewUrl_(url) {
    var id = driveFileIdFromUrl_(url);
    return id ? 'https://drive.google.com/file/d/' + id + '/preview' : url;
  }

  function hidePdfPreview_(pane, frame) {
    pane.classList.add('is-hidden');
    frame.src = '';
  }

  function escapeHtml_(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------- 画期的ビジュアル: 数値カウントアップ演出 ----------

  // バッジの数値が変わるとき、現在値から新しい値へ滑らかにカウントアップさせる。
  function animateCount_(el, to, formatter, duration) {
    if (!el) return;
    var from = parseInt(String(el.textContent).replace(/[^\d-]/g, ''), 10);
    if (isNaN(from)) from = to;
    if (from === to) { el.textContent = formatter(to); return; }
    duration = duration || 420;
    var start = (window.performance && performance.now) ? performance.now() : Date.now();

    function step(now) {
      var elapsed = ((window.performance && performance.now) ? performance.now() : Date.now()) - start;
      var t = Math.min(1, elapsed / duration);
      var eased = 1 - Math.pow(1 - t, 3);
      var val = Math.round(from + (to - from) * eased);
      el.textContent = formatter(val);
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function setCountBadge_(el, count, suffix) {
    animateCount_(el, count, function (v) { return v + suffix; });
  }

  // ---------- ボタンのリップル演出 ----------

  // ボタン押下位置を起点に波紋が広がる演出(.btnクラスすべてに共通、イベント委譲で1リスナーのみ)。
  function initRipple_() {
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.btn');
      if (!btn || btn.disabled) return;
      var rect = btn.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      var span = document.createElement('span');
      span.className = 'ripple';
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - rect.left - size / 2) + 'px';
      span.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(span);
      setTimeout(function () { span.remove(); }, 650);
    });
  }

  // ---------- 画期的ビジュアル: 生きた時計 / 常時アクティビティ表示 ----------

  // 時刻に応じたあいさつ文を返す(5-9時:朝、10-17時:日中、それ以外:夕方以降・早朝)。
  function getGreetingText_(hour) {
    if (hour >= 5 && hour < 10) return 'おはようございます';
    if (hour >= 10 && hour < 18) return '本日もよろしくお願いします';
    return 'お疲れ様です';
  }

  function initLiveClock_() {
    var statusClock = document.getElementById('statusClock');
    var activityClock = document.getElementById('activityClock');
    var statusGreeting = document.getElementById('statusGreeting');
    var lastGreetingHour_ = -1;
    function tick() {
      var d = new Date();
      var text = String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0') + ':' +
        String(d.getSeconds()).padStart(2, '0');
      if (statusClock) statusClock.textContent = text;
      if (activityClock) activityClock.textContent = text;
      if (statusGreeting && d.getHours() !== lastGreetingHour_) {
        lastGreetingHour_ = d.getHours();
        statusGreeting.textContent = getGreetingText_(lastGreetingHour_);
      }
    }
    tick();
    setInterval(tick, 1000);
  }

  // 画面上部のステータスバー・申請画面のアクティビティカードへ、本日の送付件数と
  // 直近の申請情報を反映する(HistoryService.gs の getActivitySnapshot_ 参照。
  // ダッシュボードのような集計画面ではなく、あくまで「動いている感」を出す軽量表示)。
  function loadActivitySnapshot_() {
    google.script.run
      .withSuccessHandler(function (snap) {
        var statusCountEl = document.getElementById('statusTodayCount');
        var activityCountEl = document.getElementById('activityTodayCount');
        if (statusCountEl) setCountBadge_(statusCountEl, snap.todayCount, '');
        if (activityCountEl) setCountBadge_(activityCountEl, snap.todayCount, '');

        var latestText = snap.latestCompany
          ? '最新: ' + snap.latestCompany + '（' + String(snap.latestSentAt).slice(11) + '）'
          : '本日はまだ送付がありません';
        var statusLatestEl = document.getElementById('statusLatest');
        var activityLatestEl = document.getElementById('activityLatest');
        if (statusLatestEl) statusLatestEl.textContent = latestText;
        if (activityLatestEl) activityLatestEl.textContent = latestText;
      })
      .withFailureHandler(function () {
        var statusLatestEl = document.getElementById('statusLatest');
        var activityLatestEl = document.getElementById('activityLatest');
        if (statusLatestEl) statusLatestEl.textContent = '状況を取得できませんでした';
        if (activityLatestEl) activityLatestEl.textContent = '状況を取得できませんでした';
      })
      .getActivitySnapshot();
  }

  // ---------- 画期的ビジュアル: コマンドパレット(Ctrl/Cmd + K) ----------

  var COMMANDS_ = [
    { label: '申請画面へ移動', hint: '新規に申請を作成', run: function () { document.getElementById('navForm').click(); } },
    { label: '履歴確認へ移動', hint: '過去の申請を検索・取消', run: function () { document.getElementById('navHistory').click(); } },
    { label: 'カレンダーへ移動', hint: '登録日を月別カレンダーで確認', run: function () { document.getElementById('navCalendar').click(); } },
    { label: '送付書PDFへ移動', hint: '発行済みPDFの確認・メール送信', run: function () { document.getElementById('navPdf').click(); } },
    { label: '設定へ移動', hint: 'メール宛先・自動送信・テーマなど', run: function () { document.getElementById('navSettings').click(); } },

  ];
  var cmdkFiltered_ = COMMANDS_;
  var cmdkSelectedIndex_ = 0;

  function openCmdk_() {
    var overlay = document.getElementById('cmdkOverlay');
    overlay.classList.remove('is-hidden');
    overlay.setAttribute('aria-hidden', 'false');
    var input = document.getElementById('cmdkInput');
    input.value = '';
    renderCmdkList_('');
    setTimeout(function () { input.focus(); }, 10);
  }

  function closeCmdk_() {
    var overlay = document.getElementById('cmdkOverlay');
    overlay.classList.add('is-hidden');
    overlay.setAttribute('aria-hidden', 'true');
  }

  function renderCmdkList_(query) {
    var q = query.trim().toLowerCase();
    cmdkFiltered_ = COMMANDS_.filter(function (c) {
      return !q || (c.label + c.hint).toLowerCase().indexOf(q) !== -1;
    });
    cmdkSelectedIndex_ = 0;

    var list = document.getElementById('cmdkList');
    list.innerHTML = '';
    cmdkFiltered_.forEach(function (c, i) {
      var item = document.createElement('div');
      item.className = 'cmdk__item' + (i === 0 ? ' is-selected' : '');
      item.setAttribute('role', 'option');
      item.innerHTML =
        '<span class="cmdk__itemLabel">' + escapeHtml_(c.label) + '</span>' +
        '<span class="cmdk__itemHint">' + escapeHtml_(c.hint) + '</span>';
      item.addEventListener('click', function () { runCmdkItem_(i); });
      list.appendChild(item);
    });

    document.getElementById('cmdkEmpty').classList.toggle('is-hidden', cmdkFiltered_.length > 0);
  }

  function runCmdkItem_(i) {
    var cmd = cmdkFiltered_[i];
    if (!cmd) return;
    closeCmdk_();
    cmd.run();
  }

  function moveCmdkSelection_(delta) {
    if (cmdkFiltered_.length === 0) return;
    cmdkSelectedIndex_ = (cmdkSelectedIndex_ + delta + cmdkFiltered_.length) % cmdkFiltered_.length;
    var items = document.querySelectorAll('#cmdkList .cmdk__item');
    items.forEach(function (el, i) { el.classList.toggle('is-selected', i === cmdkSelectedIndex_); });
    var sel = items[cmdkSelectedIndex_];
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }

  // クイック操作ボタンはIndex.html側にonclick="openCmdk_()"も直接付けている
  // (念のための二重の呼び出し口。openCmdk_は複数回呼ばれても安全)。
  var btnOpenCmdkEl_ = document.getElementById('btnOpenCmdk');
  if (btnOpenCmdkEl_) btnOpenCmdkEl_.addEventListener('click', openCmdk_);

  var cmdkOverlayEl_ = document.getElementById('cmdkOverlay');
  if (cmdkOverlayEl_) {
    cmdkOverlayEl_.addEventListener('click', function (e) {
      if (e.target.id === 'cmdkOverlay') closeCmdk_();
    });
  }

  var cmdkInputEl_ = document.getElementById('cmdkInput');
  if (cmdkInputEl_) {
    cmdkInputEl_.addEventListener('input', function (e) { renderCmdkList_(e.target.value); });
    cmdkInputEl_.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveCmdkSelection_(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveCmdkSelection_(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); runCmdkItem_(cmdkSelectedIndex_); }
      else if (e.key === 'Escape') { closeCmdk_(); }
    });
  }

  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      openCmdk_();
    } else if (e.key === 'Escape' && cmdkOverlayEl_ && !cmdkOverlayEl_.classList.contains('is-hidden')) {
      closeCmdk_();
    }
  });

  // ---------- 申請 / 履歴確認 / 送付書PDF 画面切り替え ----------

  var HISTORY_NUMERIC_COLUMNS = ['車両No.', '自動車税', '環境性能割', '重量税'];
  var HISTORY_HIDDEN_COLUMNS = ['submissionId']; // 内部管理用のUUIDは列としては表示しない(取消操作には使う)
  var HISTORY_SEARCH_COLUMN = '使用者名';
  var HISTORY_BRAND_COLUMN = 'ブランド';
  var historyHeader_ = [];
  var historyAllRows_ = [];

  function setView_(view) {
    document.getElementById('viewForm').classList.toggle('is-hidden', view !== 'form');
    document.getElementById('viewHistory').classList.toggle('is-hidden', view !== 'history');
    document.getElementById('viewCalendar').classList.toggle('is-hidden', view !== 'calendar');
    document.getElementById('viewPdf').classList.toggle('is-hidden', view !== 'pdf');
    document.getElementById('viewSettings').classList.toggle('is-hidden', view !== 'settings');
    document.getElementById('navForm').classList.toggle('is-active', view === 'form');
    document.getElementById('navForm').setAttribute('aria-selected', view === 'form');
    document.getElementById('navHistory').classList.toggle('is-active', view === 'history');
    document.getElementById('navHistory').setAttribute('aria-selected', view === 'history');
    document.getElementById('navCalendar').classList.toggle('is-active', view === 'calendar');
    document.getElementById('navCalendar').setAttribute('aria-selected', view === 'calendar');
    document.getElementById('navPdf').classList.toggle('is-active', view === 'pdf');
    document.getElementById('navPdf').setAttribute('aria-selected', view === 'pdf');
    document.getElementById('navSettings').classList.toggle('is-active', view === 'settings');
    document.getElementById('navSettings').setAttribute('aria-selected', view === 'settings');
    // 初回表示時、または新しい申請でデータが増えた後(historyHeader_をクリア済み)だけ取得し直す
    if (view === 'history' && historyHeader_.length === 0) loadHistoryData_();
    // カレンダーは月ごとの軽量な問い合わせのため、開くたびに最新状態を取得し直す
    if (view === 'calendar') loadCalendarMonth_();
  }
  document.getElementById('navForm').addEventListener('click', function () { setView_('form'); });
  document.getElementById('navHistory').addEventListener('click', function () { setView_('history'); });
  document.getElementById('navCalendar').addEventListener('click', function () { setView_('calendar'); });
  document.getElementById('navPdf').addEventListener('click', function () { setView_('pdf'); });
  document.getElementById('navSettings').addEventListener('click', function () { setView_('settings'); });
  document.getElementById('btnGoMailSettings').addEventListener('click', function () { setView_('settings'); });
  document.getElementById('btnHistoryRefresh').addEventListener('click', function () { loadHistoryData_(); });
  document.getElementById('historySearch').addEventListener('input', applyHistoryFilter_);
  document.getElementById('historyBrand').addEventListener('change', applyHistoryFilter_);

  function formatDateInput_(d) {
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  // 履歴確認画面の初期表示期間(今月1日〜今日)を設定する
  function initHistoryDefaultRange_() {
    var now = new Date();
    document.getElementById('historyFrom').value = formatDateInput_(new Date(now.getFullYear(), now.getMonth(), 1));
    document.getElementById('historyTo').value = formatDateInput_(now);
  }

  function loadHistoryData_() {
    var from = document.getElementById('historyFrom').value;
    var to = document.getElementById('historyTo').value;
    var includePending = document.getElementById('historyIncludePending').checked;

    var btn = document.getElementById('btnHistoryRefresh');
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        historyHeader_ = result.header;
        historyAllRows_ = result.rows;
        applyHistoryFilter_();
      })
      .withFailureHandler(function (error) {
        btn.disabled = false;
        historyHeader_ = [];
        historyAllRows_ = [];
        renderHistoryTable_([], [], 'この期間の履歴データはまだありません。');
        alert('履歴の取得に失敗しました:\n' + error.message);
      })
      .getHistoryEntriesByDateRange(from, to, includePending);
  }

  // 「使用者名で検索」「ブランド」の指定で historyAllRows_ を絞り込んで再描画する(クライアント側、再取得なし)
  function applyHistoryFilter_() {
    var rawKeyword = document.getElementById('historySearch').value.trim();
    var brand = document.getElementById('historyBrand').value;
    var keyword = rawKeyword.toLowerCase();
    var nameColIndex = historyHeader_.indexOf(HISTORY_SEARCH_COLUMN);
    var brandColIndex = historyHeader_.indexOf(HISTORY_BRAND_COLUMN);

    var filtered = historyAllRows_.filter(function (row) {
      if (brand && (brandColIndex === -1 || row[brandColIndex] !== brand)) return false;
      if (rawKeyword && (nameColIndex === -1 || String(row[nameColIndex]).toLowerCase().indexOf(keyword) === -1)) return false;
      return true;
    });

    var emptyMessage = (rawKeyword || brand)
      ? '条件に一致する履歴が見つかりませんでした。'
      : 'この期間の履歴データはまだありません。';
    renderHistoryTable_(historyHeader_, filtered, emptyMessage);
  }

  function renderHistoryTable_(header, rows, emptyMessage) {
    var head = document.getElementById('historyTableHead');
    var body = document.getElementById('historyTableBody');
    head.innerHTML = '';
    body.innerHTML = '';

    var submissionIdCol = header.indexOf('submissionId');
    var pdfUrlCol = header.indexOf('送付書PDF');
    var statusCol = header.indexOf('状態');
    var visibleCols = [];

    header.forEach(function (label, i) {
      if (HISTORY_HIDDEN_COLUMNS.indexOf(label) !== -1) return;
      visibleCols.push(i);
      var th = document.createElement('th');
      th.textContent = label;
      if (HISTORY_NUMERIC_COLUMNS.indexOf(label) !== -1) th.classList.add('numCol');
      head.appendChild(th);
    });
    if (submissionIdCol !== -1) {
      var thAction = document.createElement('th');
      thAction.textContent = '操作';
      head.appendChild(thAction);
    }

    rows.forEach(function (row) {
      var tr = document.createElement('tr');
      var status = statusCol !== -1 ? row[statusCol] : '';
      if (status === SUBMISSION_STATUS_CANCELLED_) tr.classList.add('is-cancelled');

      visibleCols.forEach(function (i) {
        var td = document.createElement('td');
        var label = header[i];
        if (i === pdfUrlCol) {
          if (row[i]) {
            var a = document.createElement('a');
            a.href = row[i];
            a.target = '_blank';
            a.rel = 'noopener';
            a.className = 'pdfLink';
            a.textContent = '開く';
            td.appendChild(a);
          } else {
            td.textContent = '-';
          }
        } else {
          td.textContent = row[i];
          if (HISTORY_NUMERIC_COLUMNS.indexOf(label) !== -1) td.classList.add('numCol');
        }
        tr.appendChild(td);
      });

      if (submissionIdCol !== -1) {
        var tdAction = document.createElement('td');
        var id = row[submissionIdCol];
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn--ghost btn--sm';
        if (status === SUBMISSION_STATUS_CANCELLED_) {
          btn.textContent = '取消済み';
          btn.disabled = true;
        } else {
          btn.textContent = '取消';
          btn.addEventListener('click', function () { cancelSubmissionRow_(id, btn); });
        }
        tdAction.appendChild(btn);
        tr.appendChild(tdAction);
      }

      body.appendChild(tr);
    });

    setCountBadge_(document.getElementById('historyCountBadge'), rows.length, ' 件');
    document.getElementById('historyEmptyMsg').textContent = emptyMessage || 'この期間の履歴データはまだありません。';
    document.getElementById('historyEmptyMsg').style.display = rows.length === 0 ? '' : 'none';
  }

  // 誤入力の修正・取消: 該当submissionIdの全行(複数車両・複数タブにまたがる場合を含む)を取消状態にする。
  // 訂正が必要な場合は、この取消操作の後、フォームから改めて正しい内容で再送信してもらう運用とする。
  function cancelSubmissionRow_(submissionId, btn) {
    if (!confirm('この申請を取消しますか？\n(複数台の申請の場合、含まれる車両すべてが取消対象になります)')) return;
    btn.disabled = true;
    btn.textContent = '処理中…';

    google.script.run
      .withSuccessHandler(function () {
        historyHeader_ = []; // 最新状態を反映するため再取得させる
        loadHistoryData_();
      })
      .withFailureHandler(function (error) {
        btn.disabled = false;
        btn.textContent = '取消';
        alert('取消処理に失敗しました:\n' + error.message);
      })
      .cancelSubmission(submissionId);
  }

  // ---------- カレンダー画面(登録日ベース) ----------
  // 履歴確認画面と同じ getHistoryEntriesByDateRange を月初〜月末の範囲で呼び出して流用する
  // (「登録日」列はOSSなら車両ごとの登録日、紙なら共通の登録日がすでに正しく入っている)。
  // 履歴確認と違い直近状態を優先したい画面のため、キャッシュはせずタブを開くたびに取得し直す。

  var CALENDAR_WEEKDAY_LABELS_ = ['日', '月', '火', '水', '木', '金', '土'];
  var calendarYear_ = null;
  var calendarMonth_ = null; // 0-11

  function initCalendarState_() {
    var now = new Date();
    calendarYear_ = now.getFullYear();
    calendarMonth_ = now.getMonth();
  }
  initCalendarState_();

  function shiftCalendarMonth_(delta) {
    var d = new Date(calendarYear_, calendarMonth_ + delta, 1);
    calendarYear_ = d.getFullYear();
    calendarMonth_ = d.getMonth();
    loadCalendarMonth_();
  }
  document.getElementById('btnCalPrev').addEventListener('click', function () { shiftCalendarMonth_(-1); });
  document.getElementById('btnCalNext').addEventListener('click', function () { shiftCalendarMonth_(1); });
  document.getElementById('btnCalToday').addEventListener('click', function () { initCalendarState_(); loadCalendarMonth_(); });

  function loadCalendarMonth_() {
    document.getElementById('calendarTitle').textContent = calendarYear_ + '年' + (calendarMonth_ + 1) + '月';
    var monthStart = formatDateInput_(new Date(calendarYear_, calendarMonth_, 1));
    var monthEnd = formatDateInput_(new Date(calendarYear_, calendarMonth_ + 1, 0));

    google.script.run
      .withSuccessHandler(function (result) {
        renderCalendar_(result.header, result.rows);
      })
      .withFailureHandler(function (error) {
        renderCalendar_([], []);
        alert('カレンダーの取得に失敗しました:\n' + error.message);
      })
      .getHistoryEntriesByDateRange(monthStart, monthEnd, false);
  }

  function renderCalendar_(header, rows) {
    var idx = {
      regDate: header.indexOf('登録日'),
      type: header.indexOf('種別'),
      userName: header.indexOf('使用者名'),
      brand: header.indexOf('ブランド'),
      person: header.indexOf('担当者'),
      status: header.indexOf('状態'),
      pdfUrl: header.indexOf('送付書PDF')
    };

    var byDate = {};
    rows.forEach(function (row) {
      var dateStr = row[idx.regDate];
      if (!dateStr) return;
      if (!byDate[dateStr]) byDate[dateStr] = [];
      byDate[dateStr].push({
        type: row[idx.type],
        userName: row[idx.userName],
        brand: row[idx.brand],
        person: row[idx.person],
        cancelled: row[idx.status] === SUBMISSION_STATUS_CANCELLED_,
        pdfUrl: row[idx.pdfUrl] || ''
      });
    });

    var grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    CALENDAR_WEEKDAY_LABELS_.forEach(function (label, i) {
      var el = document.createElement('div');
      el.className = 'calendarGrid__weekday' + (i === 0 ? ' is-sun' : i === 6 ? ' is-sat' : '');
      el.textContent = label;
      grid.appendChild(el);
    });

    var firstOfMonth = new Date(calendarYear_, calendarMonth_, 1);
    var daysInMonth = new Date(calendarYear_, calendarMonth_ + 1, 0).getDate();
    var startWeekday = firstOfMonth.getDay(); // 0=日曜
    var totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
    var todayStr = formatDateInput_(new Date());
    var totalCount = 0;

    for (var cellIndex = 0; cellIndex < totalCells; cellIndex++) {
      var dayNum = cellIndex - startWeekday + 1;
      var inMonth = dayNum >= 1 && dayNum <= daysInMonth;
      var dateStr = inMonth ? formatDateInput_(new Date(calendarYear_, calendarMonth_, dayNum)) : '';

      var cell = document.createElement('div');
      cell.className = 'calDay' + (inMonth ? '' : ' is-otherMonth') + (dateStr && dateStr === todayStr ? ' is-today' : '');

      var numEl = document.createElement('div');
      numEl.className = 'calDay__num';
      numEl.textContent = inMonth ? String(dayNum) : '';
      cell.appendChild(numEl);

      if (inMonth && byDate[dateStr]) {
        var listEl = document.createElement('div');
        listEl.className = 'calDay__list';
        byDate[dateStr].forEach(function (entry) {
          totalCount++;
          var hasPdf = !!entry.pdfUrl;
          var entryEl = document.createElement(hasPdf ? 'a' : 'div');
          entryEl.className = 'calEntry' + (hasPdf ? ' calEntry--link' : '') + (entry.cancelled ? ' is-cancelled' : '');
          if (hasPdf) {
            entryEl.href = entry.pdfUrl;
            entryEl.target = '_blank';
            entryEl.rel = 'noopener';
          }
          entryEl.title = (entry.type || '') + ' / ' + (entry.brand || 'ブランド未設定') +
            ' / 使用者名: ' + (entry.userName || '-') + ' / 担当者: ' + (entry.person || '-') +
            (entry.cancelled ? '（取消済み）' : '') +
            (hasPdf ? ' — クリックで送付書PDFを開く' : '');

          var typeEl = document.createElement('span');
          typeEl.className = 'calEntry__type' + (entry.type === 'OSS' ? ' is-oss' : ' is-paper');
          typeEl.textContent = entry.type || '';
          entryEl.appendChild(typeEl);

          if (entry.brand) {
            var brandEl = document.createElement('span');
            brandEl.className = 'calEntry__brand';
            brandEl.textContent = entry.brand;
            entryEl.appendChild(brandEl);
          }

          var nameEl = document.createElement('span');
          nameEl.className = 'calEntry__name';
          nameEl.textContent = entry.userName || '-';
          entryEl.appendChild(nameEl);

          if (entry.person) {
            var personEl = document.createElement('span');
            personEl.className = 'calEntry__person';
            personEl.textContent = '（' + entry.person + '）';
            entryEl.appendChild(personEl);
          }

          listEl.appendChild(entryEl);
        });
        cell.appendChild(listEl);
      }

      grid.appendChild(cell);
    }

    setCountBadge_(document.getElementById('calendarCountBadge'), totalCount, ' 件');
    document.getElementById('calendarEmptyMsg').style.display = totalCount === 0 ? '' : 'none';
    updateScrollShadow_(grid.closest('.tableScroll'));
  }

  document.getElementById('btnPdfRefresh').addEventListener('click', loadPdfList_);

  // PDF確認画面の初期表示期間(今月1日〜今日)を設定する
  function initPdfDefaultRange_() {
    var now = new Date();
    document.getElementById('pdfFrom').value = formatDateInput_(new Date(now.getFullYear(), now.getMonth(), 1));
    document.getElementById('pdfTo').value = formatDateInput_(now);
  }

  function loadPdfList_() {
    var from = document.getElementById('pdfFrom').value;
    var to = document.getElementById('pdfTo').value;
    var sendBatch = document.getElementById('pdfSendBatch').value;

    var btn = document.getElementById('btnPdfRefresh');
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(function (list) {
        btn.disabled = false;
        pdfAllList_ = list;
        applyPdfFilter_();
      })
      .withFailureHandler(function (error) {
        btn.disabled = false;
        pdfAllList_ = [];
        renderPdfList_([], '送付書PDFの取得に失敗しました。');
        alert('送付書PDFの取得に失敗しました:\n' + error.message);
      })
      .getPdfsBySendDate(from, to, sendBatch);

  // 「使用者名で検索」の指定で pdfAllList_ を絞り込んで再描画する(クライアント側、再取得なし)
  function applyPdfFilter_() {
    var rawKeyword = document.getElementById('pdfSearch').value.trim();
    var keyword = rawKeyword.toLowerCase();

    var filtered = pdfAllList_.filter(function (item) {
      if (!rawKeyword) return true;
      return (item.userNames || []).some(function (n) { return String(n).toLowerCase().indexOf(keyword) !== -1; });
    });

    var emptyMessage = rawKeyword
      ? '条件に一致する送付書PDFが見つかりませんでした。'
      : '該当する送付書PDFが見つかりませんでした。';
    renderPdfList_(filtered, emptyMessage);
  }

  function renderPdfList_(list, emptyMessage) {
    var container = document.getElementById('pdfList');
    container.innerHTML = '';
    setCountBadge_(document.getElementById('pdfCountBadge'), list.length, ' 件');
    document.getElementById('pdfEmptyMsg').textContent = emptyMessage || '該当する送付書PDFが見つかりませんでした。';
    document.getElementById('pdfEmptyMsg').style.display = list.length === 0 ? '' : 'none';

    list.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'pdfRow' + (item.status === SUBMISSION_STATUS_CANCELLED_ ? ' is-cancelled' : '');

      var main = document.createElement('div');
      main.className = 'pdfRow__main';
      var userNamesText = (item.userNames || []).join('、');
      var metaParts = [escapeHtml_(item.type), escapeHtml_(item.sendBatch || ''), item.vehicleCount + '台', escapeHtml_(item.manager)];
      if (item.status === SUBMISSION_STATUS_CANCELLED_) metaParts.push('<span class="pdfRow__cancelled">取消済み</span>');
      main.innerHTML =
        '<span class="pdfRow__company">' + escapeHtml_(item.company) + '</span>' +
        '<span class="pdfRow__meta">' + metaParts.join(' ・ ') + '</span>' +
        '<span class="pdfRow__users">使用者名: ' + escapeHtml_(userNamesText || '-') + '</span>';
      row.appendChild(main);

      var actions = document.createElement('div');
      actions.className = 'pdfRow__actions';
      if (item.pdfUrl) {
        var btnView = document.createElement('button');
        btnView.type = 'button';
        btnView.className = 'btn btn--ghost btn--sm';
        btnView.textContent = 'プレビュー';
        btnView.addEventListener('click', function () { openPdfPreview_(item.pdfUrl, item.company); });
        actions.appendChild(btnView);

        var a = document.createElement('a');
        a.href = item.pdfUrl;
        a.target = '_blank';
        a.rel = 'noopener';
        a.className = 'btn btn--ghost btn--sm';
        a.textContent = '新しいタブで開く';
        actions.appendChild(a);
      }
      row.appendChild(actions);
      container.appendChild(row);
    });
  }

  function openPdfPreview_(url, label) {
    var pane = document.getElementById('pdfPreviewPane');
    document.getElementById('pdfPreviewTitle').textContent = label || '';
    document.getElementById('pdfPreviewFrame').src = buildPdfPreviewUrl_(url);
    pane.classList.remove('is-hidden');
    pane.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ---------- 送付書PDF: メール送信 ----------

  var MAIL_RECIPIENT_IDS = ['mailTo1', 'mailTo2', 'mailTo3', 'mailTo4'];

  function collectMailRecipients_() {
    return MAIL_RECIPIENT_IDS
      .map(function (id) { return document.getElementById(id).value.trim(); })
      .filter(function (v) { return v !== ''; });
  }

  // 前回送信時の宛先を読み込んで、4つの入力欄にあらかじめ入れておく(毎回の入力の手間を減らす)
  function loadMailRecipients_() {
    google.script.run
      .withSuccessHandler(function (recipients) {
        (recipients || []).forEach(function (addr, i) {
          var id = MAIL_RECIPIENT_IDS[i];
          if (id) document.getElementById(id).value = addr;
        });
      })
      .getMailRecipients();
  }

  function setMailResult_(text, kind) {
    var el = document.getElementById('mailResult');
    el.className = 'result' + (kind ? ' -' + kind : '');
    document.getElementById('mailResultText').innerHTML = text;
  }

  function setMailProcessing_(on) {
    document.getElementById('mailSpinner').classList.toggle('is-hidden', !on);
  }

  document.getElementById('btnSendMail').addEventListener('click', function () {
    var sendDate = document.getElementById('mailSendDate').value;
    if (!sendDate) {
      setMailResult_('送付日を指定してください', 'error');
      return;
    }
    var recipients = collectMailRecipients_();
    if (recipients.length === 0) {
      setMailResult_('送信先メールアドレスが未設定です。「設定」タブで宛先を保存してください。', 'error');
      return;
    }

    var btn = document.getElementById('btnSendMail');
    btn.disabled = true;
    setMailProcessing_(true);
    setMailResult_('送信しています…', 'pending');

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        setMailProcessing_(false);
        setMailResult_('送信しました（PDF ' + result.sentCount + '件 / 宛先 ' + result.recipientCount + '件）', 'success');
      })
      .withFailureHandler(function (error) {
        btn.disabled = false;
        setMailProcessing_(false);
        setMailResult_('送信に失敗しました:\n' + error.message, 'error');
      })
      .sendPdfsByEmail(sendDate, recipients);
  });

  // ---------- 設定画面: メール送信先の保存 ----------

  function setMailSettingsResult_(text, kind) {
    var el = document.getElementById('mailSettingsResult');
    el.className = 'result' + (kind ? ' -' + kind : '');
    document.getElementById('mailSettingsResultText').innerHTML = text;
  }

  function setMailSettingsProcessing_(on) {
    document.getElementById('mailSettingsSpinner').classList.toggle('is-hidden', !on);
  }

  document.getElementById('btnSaveMailRecipients').addEventListener('click', function () {
    var recipients = collectMailRecipients_();
    var btn = document.getElementById('btnSaveMailRecipients');
    btn.disabled = true;
    setMailSettingsProcessing_(true);
    setMailSettingsResult_('保存しています…', 'pending');

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        setMailSettingsProcessing_(false);
        setMailSettingsResult_('保存しました（' + result.recipientCount + '件）', 'success');
      })
      .withFailureHandler(function (error) {
        btn.disabled = false;
        setMailSettingsProcessing_(false);
        setMailSettingsResult_('保存に失敗しました:\n' + error.message, 'error');
      })
      .saveMailRecipients(recipients);
  });

  // ---------- 設定画面: 自動メール送信のON/OFF ----------

  function setAutoMailToggle_(on) {
    var btn = document.getElementById('autoMailToggle');
    var label = document.getElementById('autoMailStatusLabel');
    btn.classList.toggle('is-active', on);
    btn.setAttribute('aria-checked', on);
    label.classList.toggle('is-on', on);
    label.classList.toggle('is-off', !on);
    document.getElementById('autoMailStatusText').textContent = on ? 'ON（毎日17時台に自動送信）' : 'OFF（自動送信は停止中）';
  }

  function setAutoMailResult_(text, kind) {
    var el = document.getElementById('autoMailResult');
    el.className = 'result' + (kind ? ' -' + kind : '');
    document.getElementById('autoMailResultText').innerHTML = text;
  }

  function setAutoMailProcessing_(on) {
    document.getElementById('autoMailSpinner').classList.toggle('is-hidden', !on);
  }

  function loadAutoMailStatus_() {
    google.script.run
      .withSuccessHandler(function (enabled) { setAutoMailToggle_(!!enabled); })
      .withFailureHandler(function () { setAutoMailToggle_(false); })
      .getDailyMailTriggerStatus();
  }

  document.getElementById('autoMailToggle').addEventListener('click', function () {
    var btn = document.getElementById('autoMailToggle');
    var next = !btn.classList.contains('is-active');
    btn.disabled = true;
    setAutoMailProcessing_(true);
    setAutoMailResult_('切り替えています…', 'pending');

    google.script.run
      .withSuccessHandler(function (enabled) {
        btn.disabled = false;
        setAutoMailProcessing_(false);
        setAutoMailToggle_(enabled);
        setAutoMailResult_(enabled ? '保存しました（自動送信：ON）' : '保存しました（自動送信：OFF）', 'success');
      })
      .withFailureHandler(function (error) {
        btn.disabled = false;
        setAutoMailProcessing_(false);
        setAutoMailResult_('切り替えに失敗しました:\n' + error.message, 'error');
        // ONにしようとして失敗した場合(主に宛先未登録)は、見落とさないようポップアップでも案内する
        if (next) alert(error.message);
      })
      .setDailyMailTriggerEnabled(next);
  });

  // ---------- 設定画面: 申請フォームの既定値 ----------

  var defaultFormValues_ = { company: '', manager: '' };

  // 申請フォームの依頼会社名・担当責任者が空欄のときだけ、既定値を差し込む(既存の入力を上書きしない)
  function applyDefaultFormValues_() {
    var companyEl = document.getElementById('company');
    var managerEl = document.getElementById('manager');
    if (defaultFormValues_.company && !companyEl.value) companyEl.value = defaultFormValues_.company;
    if (defaultFormValues_.manager && !managerEl.value) managerEl.value = defaultFormValues_.manager;
  }

  function loadDefaultFormValues_() {
    google.script.run
      .withSuccessHandler(function (values) {
        defaultFormValues_ = values || { company: '', manager: '' };
        document.getElementById('defaultCompany').value = defaultFormValues_.company;
        document.getElementById('defaultManager').value = defaultFormValues_.manager;
        applyDefaultFormValues_();
      })
      .getDefaultFormValues();
  }

  function setDefaultsResult_(text, kind) {
    var el = document.getElementById('defaultsResult');
    el.className = 'result' + (kind ? ' -' + kind : '');
    document.getElementById('defaultsResultText').innerHTML = text;
  }

  function setDefaultsProcessing_(on) {
    document.getElementById('defaultsSpinner').classList.toggle('is-hidden', !on);
  }

  document.getElementById('btnSaveDefaults').addEventListener('click', function () {
    var values = {
      company: document.getElementById('defaultCompany').value.trim(),
      manager: document.getElementById('defaultManager').value.trim()
    };
    var btn = document.getElementById('btnSaveDefaults');
    btn.disabled = true;
    setDefaultsProcessing_(true);
    setDefaultsResult_('保存しています…', 'pending');

    google.script.run
      .withSuccessHandler(function (saved) {
        btn.disabled = false;
        setDefaultsProcessing_(false);
        defaultFormValues_ = saved;
        setDefaultsResult_('保存しました', 'success');
      })
      .withFailureHandler(function (error) {
        btn.disabled = false;
        setDefaultsProcessing_(false);
        setDefaultsResult_('保存に失敗しました:\n' + error.message, 'error');
      })
      .saveDefaultFormValues(values);
  });

  // ---------- 設定画面: ロゴ画像 ----------

  // Googleドライブの「共有」リンク(.../file/d/<ID>/view?... や .../open?id=<ID>)は画像そのものではなく
  // ビューアー画面のURLのため<img>タグでは表示できない。ファイルIDを取り出し、画像として直接表示できる
  // サムネイルURLに変換する(サーバー側 SettingsService.gs の同名関数と同じロジック。保存前のプレビュー用)。
  function normalizeDriveImageUrl_(url) {
    var trimmed = String(url || '').trim();
    var m = /^https?:\/\/drive\.google\.com\/file\/d\/([^\/]+)/i.exec(trimmed) ||
      /^https?:\/\/drive\.google\.com\/open\?id=([^&]+)/i.exec(trimmed);
    return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1000' : trimmed;
  }

  // ヘッダー(masthead)のロゴを表示/非表示にする。urlが空ならロゴなしの状態に戻す。
  function applyMastheadLogo_(url) {
    var img = document.getElementById('mastheadLogo');
    if (!img) return;
    if (url) {
      img.src = url;
      img.classList.remove('is-hidden');
    } else {
      img.removeAttribute('src');
      img.classList.add('is-hidden');
    }
  }

  // 設定画面内のプレビュー欄を更新する(保存前でも入力中の見た目を確認できるように)。
  function updateLogoPreview_(url) {
    var img = document.getElementById('logoPreviewImg');
    var empty = document.getElementById('logoPreviewEmpty');
    if (!img || !empty) return;
    if (url) {
      img.src = url;
      img.classList.remove('is-hidden');
      empty.classList.add('is-hidden');
    } else {
      img.removeAttribute('src');
      img.classList.add('is-hidden');
      empty.classList.remove('is-hidden');
    }
  }

  function loadLogoUrl_() {
    google.script.run
      .withSuccessHandler(function (url) {
        document.getElementById('logoUrlInput').value = url || '';
        updateLogoPreview_(url);
        applyMastheadLogo_(url);
      })
      .getLogoUrl();
  }

  document.getElementById('logoUrlInput').addEventListener('input', function (e) {
    updateLogoPreview_(normalizeDriveImageUrl_(e.target.value.trim()));
  });

  function setLogoResult_(text, kind) {
    var el = document.getElementById('logoResult');
    el.className = 'result' + (kind ? ' -' + kind : '');
    document.getElementById('logoResultText').innerHTML = text;
  }

  function setLogoProcessing_(on) {
    document.getElementById('logoSpinner').classList.toggle('is-hidden', !on);
  }

  document.getElementById('btnSaveLogo').addEventListener('click', function () {
    var url = document.getElementById('logoUrlInput').value.trim();
    var btn = document.getElementById('btnSaveLogo');
    btn.disabled = true;
    setLogoProcessing_(true);
    setLogoResult_('保存しています…', 'pending');

    google.script.run
      .withSuccessHandler(function (saved) {
        btn.disabled = false;
        setLogoProcessing_(false);
        document.getElementById('logoUrlInput').value = saved || '';
        applyMastheadLogo_(saved);
        updateLogoPreview_(saved);
        setLogoResult_(saved ? '保存しました（ロゴを表示します）' : '保存しました（ロゴを非表示にしました）', 'success');
      })
      .withFailureHandler(function (error) {
        btn.disabled = false;
        setLogoProcessing_(false);
        setLogoResult_('保存に失敗しました:\n' + error.message, 'error');
      })
      .saveLogoUrl(url);
  });

  // ---------- 設定画面: 起動画面(ローディング画面)の画像 ----------

  var LOADING_IMAGE_MAX_BYTES_ = 5 * 1024 * 1024;
  var loadingImageBase64_ = '';
  var loadingImageMimeType_ = '';
  var loadingImageFileName_ = '';

  function updateLoadingImagePreview_(url) {
    var img = document.getElementById('loadingImagePreviewImg');
    var empty = document.getElementById('loadingImagePreviewEmpty');
    if (!img || !empty) return;
    if (url) {
      img.src = url;
      img.classList.remove('is-hidden');
      empty.classList.add('is-hidden');
    } else {
      img.removeAttribute('src');
      img.classList.add('is-hidden');
      empty.classList.remove('is-hidden');
    }
  }

  function loadLoadingImagePreview_() {
    google.script.run
      .withSuccessHandler(function (url) { updateLoadingImagePreview_(url); })
      .getLoadingImageUrl();
  }

  function setLoadingImageResult_(text, kind) {
    var el = document.getElementById('loadingImageResult');
    el.className = 'result' + (kind ? ' -' + kind : '');
    document.getElementById('loadingImageResultText').innerHTML = text;
  }

  function setLoadingImageProcessing_(on) {
    document.getElementById('loadingImageSpinner').classList.toggle('is-hidden', !on);
  }

  // 選択直後にブラウザ側でプレビューを表示する(アップロード完了を待たなくても見た目を確認できるように)。
  document.getElementById('loadingImageInput').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    loadingImageBase64_ = '';
    loadingImageMimeType_ = '';
    loadingImageFileName_ = '';
    if (!file) return;

    if (!/^image\//.test(file.type)) {
      setLoadingImageResult_('画像ファイルを選択してください', 'error');
      e.target.value = '';
      return;
    }
    if (file.size > LOADING_IMAGE_MAX_BYTES_) {
      setLoadingImageResult_('画像サイズが大きすぎます（5MB以内にしてください）', 'error');
      e.target.value = '';
      return;
    }

    setLoadingImageResult_('', '');
    var reader = new FileReader();
    reader.onload = function () {
      var dataUrl = String(reader.result);
      loadingImageBase64_ = dataUrl.split(',')[1] || '';
      loadingImageMimeType_ = file.type;
      loadingImageFileName_ = file.name;
      updateLoadingImagePreview_(dataUrl);
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('btnSaveLoadingImage').addEventListener('click', function () {
    if (!loadingImageBase64_) {
      setLoadingImageResult_('画像を選択してください', 'error');
      return;
    }
    var btn = document.getElementById('btnSaveLoadingImage');
    btn.disabled = true;
    setLoadingImageProcessing_(true);
    setLoadingImageResult_('アップロードしています…', 'pending');

    google.script.run
      .withSuccessHandler(function (url) {
        btn.disabled = false;
        setLoadingImageProcessing_(false);
        document.getElementById('loadingImageInput').value = '';
        loadingImageBase64_ = '';
        updateLoadingImagePreview_(url);
        setLoadingImageResult_('保存しました（次回の起動時から表示されます）', 'success');
      })
      .withFailureHandler(function (error) {
        btn.disabled = false;
        setLoadingImageProcessing_(false);
        setLoadingImageResult_('保存に失敗しました:\n' + error.message, 'error');
      })
      .saveLoadingImage(loadingImageBase64_, loadingImageMimeType_, loadingImageFileName_);
  });

  document.getElementById('btnClearLoadingImage').addEventListener('click', function () {
    if (!confirm('現在設定されている起動画面の画像を削除しますか？')) return;
    var btn = document.getElementById('btnClearLoadingImage');
    btn.disabled = true;
    setLoadingImageProcessing_(true);
    setLoadingImageResult_('削除しています…', 'pending');

    google.script.run
      .withSuccessHandler(function () {
        btn.disabled = false;
        setLoadingImageProcessing_(false);
        document.getElementById('loadingImageInput').value = '';
        loadingImageBase64_ = '';
        updateLoadingImagePreview_('');
        setLoadingImageResult_('削除しました', 'success');
      })
      .withFailureHandler(function (error) {
        btn.disabled = false;
        setLoadingImageProcessing_(false);
        setLoadingImageResult_('削除に失敗しました:\n' + error.message, 'error');
      })
      .clearLoadingImage();
  });

  // ---------- 設定画面: テーマ(ライト/ダーク/自動 + 春夏秋冬) ----------

  var THEME_STORAGE_KEY = 'vrfsThemePreference';
  var THEME_BUTTON_IDS = ['themeLight', 'themeDark', 'themeSystem', 'themeSpring', 'themeSummer', 'themeAutumn', 'themeWinter'];
  // data-theme属性として実際に設定する値(「自動」はdata-theme属性なしでOS設定に従うため含まない)。
  var THEME_DATA_VALUES_ = ['light', 'dark', 'spring', 'summer', 'autumn', 'winter'];

  function applyTheme_(theme) {
    var root = document.documentElement;
    if (THEME_DATA_VALUES_.indexOf(theme) !== -1) {
      root.setAttribute('data-theme', theme);
    } else {
      root.removeAttribute('data-theme');
      theme = 'system';
    }
    THEME_BUTTON_IDS.forEach(function (id) {
      var btn = document.getElementById(id);
      var isActive = btn.dataset.themeValue === theme;
      btn.classList.toggle('is-active', isActive);
      btn.setAttribute('aria-selected', isActive);
    });
  }

  function setTheme_(theme) {
    localStorage.setItem(THEME_STORAGE_KEY, theme);
    applyTheme_(theme);
  }

  function initTheme_() {
    var saved = localStorage.getItem(THEME_STORAGE_KEY) || 'light';
    applyTheme_(saved);
  }

  THEME_BUTTON_IDS.forEach(function (id) {
    document.getElementById(id).addEventListener('click', function () {
      setTheme_(document.getElementById(id).dataset.themeValue);
    });
  });
  initTheme_(); // ページ読み込み直後(window.onloadを待たず)に適用し、ちらつきを抑える
</script>
