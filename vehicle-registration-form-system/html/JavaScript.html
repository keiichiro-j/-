<script>
  var MAX_VEHICLES = 20;
  var INITIAL_VEHICLE_ROWS = 3;
  var rowSeq = 0;

  function createVehicleRow() {
    rowSeq++;
    var tr = document.createElement('tr');
    tr.className = 'vehicleRow';
    tr.innerHTML =
      '<td class="cell-no"></td>' +
      '<td class="cell-regdate"><input type="date" class="v-indivRegDate"></td>' +
      '<td><input type="text" class="v-userName" list="dl-usernames" autocomplete="off"></td>' +
      brandCell_() +
      '<td><input type="text" class="v-chassis" maxlength="4" inputmode="numeric"></td>' +
      '<td><input type="text" class="v-model"></td>' +
      '<td><input type="text" class="v-classNum"></td>' +
      '<td><input type="number" class="v-autoTax" min="0" step="1"></td>' +
      '<td><input type="number" class="v-envTax" min="0" step="1"></td>' +
      '<td><input type="number" class="v-weightTax" min="0" step="1"></td>' +
      selectCell_('v-hopeNum') +
      selectCell_('v-yobi') +
      selectCell_('v-honken') +
      selectCell_('v-shinsho') +
      '<td><input type="text" class="v-person" list="dl-persons" autocomplete="off"></td>' +
      '<td><button type="button" class="btnRemoveRow" title="この行を削除" aria-label="この行を削除">&times;</button></td>';
    return tr;
  }

  function selectCell_(cls) {
    return '<td><select class="' + cls + '"><option value=""></option><option value="〇">〇</option></select></td>';
  }

  function brandCell_() {
    return '<td><select class="v-brand"><option value=""></option><option value="MB">MB</option><option value="AU">AU</option></select></td>';
  }

  function renumberRows() {
    var rows = document.querySelectorAll('#vehicleTableBody .vehicleRow');
    rows.forEach(function (tr, i) {
      tr.querySelector('.cell-no').textContent = i + 1;
    });
    updateVehicleCountBadge_();
  }

  function updateVehicleCountBadge_() {
    var count = document.querySelectorAll('#vehicleTableBody .vehicleRow').length;
    var badge = document.getElementById('vehicleCountBadge');
    if (badge) badge.textContent = count + ' / ' + MAX_VEHICLES + ' 台';
  }

  function addVehicleRow() {
    var body = document.getElementById('vehicleTableBody');
    if (body.querySelectorAll('.vehicleRow').length >= MAX_VEHICLES) return;
    body.appendChild(createVehicleRow());
    renumberRows();
    updateAddRowButtonState();
  }

  function updateAddRowButtonState() {
    var count = document.querySelectorAll('#vehicleTableBody .vehicleRow').length;
    var btn = document.getElementById('btnAddRow');
    btn.disabled = count >= MAX_VEHICLES;
    btn.textContent = count >= MAX_VEHICLES ? '最大' + MAX_VEHICLES + '台まで入力できます' : '＋ 行を追加';
  }

  document.getElementById('vehicleTableBody').addEventListener('click', function (e) {
    if (e.target.classList.contains('btnRemoveRow')) {
      var body = document.getElementById('vehicleTableBody');
      if (body.querySelectorAll('.vehicleRow').length <= 1) return;
      e.target.closest('tr').remove();
      renumberRows();
      updateAddRowButtonState();
    }
  });

  document.getElementById('btnAddRow').addEventListener('click', addVehicleRow);

  // OSSと紙で「登録日」の入力方法を切り替える
  function toggleRegDateMode() {
    var type = document.getElementById('type').value;
    var isOss = type === 'OSS';

    document.getElementById('commonRegDateField').style.display = isOss ? 'none' : '';
    document.getElementById('regDateCommon').required = !isOss;

    document.querySelectorAll('.colRegDate, .cell-regdate').forEach(function (el) {
      el.classList.toggle('is-hidden', !isOss);
    });
  }

  // 出力フォーマットのセグメントボタン(OSS/紙)を切り替える
  function setType(value) {
    document.getElementById('type').value = value;
    document.getElementById('segOss').classList.toggle('is-active', value === 'OSS');
    document.getElementById('segOss').setAttribute('aria-selected', value === 'OSS');
    document.getElementById('segPaper').classList.toggle('is-active', value === '紙');
    document.getElementById('segPaper').setAttribute('aria-selected', value === '紙');
    toggleRegDateMode();
  }
  document.getElementById('segOss').addEventListener('click', function () { setType('OSS'); });
  document.getElementById('segPaper').addEventListener('click', function () { setType('紙'); });

  function populateSuggestions(data) {
    fillDatalist_('dl-companies', data.companies);
    fillDatalist_('dl-managers', data.managers);
    fillDatalist_('dl-usernames', data.userNames);
    fillDatalist_('dl-persons', data.persons);
  }

  function fillDatalist_(id, values) {
    var dl = document.getElementById(id);
    dl.innerHTML = '';
    (values || []).forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v;
      dl.appendChild(opt);
    });
  }

  function collectVehicles_() {
    var rows = document.querySelectorAll('#vehicleTableBody .vehicleRow');
    var vehicles = [];
    rows.forEach(function (row) {
      vehicles.push({
        indivRegDate: row.querySelector('.v-indivRegDate').value,
        userName: row.querySelector('.v-userName').value.trim(),
        brand: row.querySelector('.v-brand').value,
        chassis: row.querySelector('.v-chassis').value.trim(),
        model: row.querySelector('.v-model').value.trim(),
        classNum: row.querySelector('.v-classNum').value.trim(),
        autoTax: row.querySelector('.v-autoTax').value,
        envTax: row.querySelector('.v-envTax').value,
        weightTax: row.querySelector('.v-weightTax').value,
        hopeNum: row.querySelector('.v-hopeNum').value,
        yobi: row.querySelector('.v-yobi').value,
        honken: row.querySelector('.v-honken').value,
        shinsho: row.querySelector('.v-shinsho').value,
        person: row.querySelector('.v-person').value.trim()
      });
    });
    return vehicles;
  }

  function clearInvalid_() {
    document.querySelectorAll('.is-invalid').forEach(function (el) { el.classList.remove('is-invalid'); });
  }

  function highlightRequired_() {
    var ok = true;
    ['company', 'manager', 'sendDate', 'sendBatch'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el.value.trim()) { el.classList.add('is-invalid'); ok = false; }
    });
    var regDateCommon = document.getElementById('regDateCommon');
    if (document.getElementById('type').value === '紙' && !regDateCommon.value) {
      regDateCommon.classList.add('is-invalid');
      ok = false;
    }
    return ok;
  }

  function setResult_(text, kind) {
    var el = document.getElementById('result');
    el.className = 'result' + (kind ? ' -' + kind : '');
    el.innerHTML = text;
  }

  function submitForm(e) {
    e.preventDefault();
    clearInvalid_();

    var hasActiveVehicle = collectVehicles_().some(function (v) { return v.userName !== ''; });
    var requiredOk = highlightRequired_();
    if (!requiredOk) {
      setResult_('必須項目が未入力です（赤枠の項目を確認してください）', 'error');
      return;
    }
    if (!hasActiveVehicle) {
      setResult_('車両データを1台以上入力してください（使用車名が必須です）', 'error');
      return;
    }

    var formData = {
      type: document.getElementById('type').value,
      company: document.getElementById('company').value.trim(),
      manager: document.getElementById('manager').value.trim(),
      sendDate: document.getElementById('sendDate').value,
      sendBatch: document.getElementById('sendBatch').value,
      regDateCommon: document.getElementById('regDateCommon').value,
      vehicles: collectVehicles_()
    };

    var btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    setResult_('処理中です。履歴に記録し、PDFを作成しています…', 'pending');

    google.script.run
      .withSuccessHandler(function (pdfUrl) {
        btn.disabled = false;
        setResult_(
          '完了しました。PDFを自動で開きます。<br>開かない場合は <a href="' + pdfUrl + '" target="_blank">こちら</a> をクリックしてください。',
          'success'
        );
        window.open(pdfUrl, '_blank');
      })
      .withFailureHandler(function (error) {
        btn.disabled = false;
        setResult_('エラーが発生しました:\n' + error.message, 'error');
      })
      .processFormData(formData);
  }

  document.getElementById('mainForm').addEventListener('submit', submitForm);

  // フォームを初期状態に戻す(車両行も INITIAL_VEHICLE_ROWS 件まで作り直す)
  function resetForm() {
    clearInvalid_();
    document.getElementById('mainForm').reset();
    setType('OSS');
    document.getElementById('vehicleTableBody').innerHTML = '';
    for (var i = 0; i < INITIAL_VEHICLE_ROWS; i++) addVehicleRow();
    setResult_('', '');
  }
  document.getElementById('btnClear').addEventListener('click', resetForm);

  window.onload = function () {
    for (var i = 0; i < INITIAL_VEHICLE_ROWS; i++) addVehicleRow();
    toggleRegDateMode();
    google.script.run.withSuccessHandler(populateSuggestions).getSuggestions();
  };

  // ---------- 申請 / 履歴確認 画面切り替え ----------

  var HISTORY_NUMERIC_COLUMNS = ['車両No.', '自動車税', '環境性能割', '重量税'];

  function setView_(view) {
    var isForm = view === 'form';
    document.getElementById('viewForm').classList.toggle('is-hidden', !isForm);
    document.getElementById('viewHistory').classList.toggle('is-hidden', isForm);
    document.getElementById('navForm').classList.toggle('is-active', isForm);
    document.getElementById('navForm').setAttribute('aria-selected', isForm);
    document.getElementById('navHistory').classList.toggle('is-active', !isForm);
    document.getElementById('navHistory').setAttribute('aria-selected', !isForm);
    if (!isForm) loadHistoryTabs_();
  }
  document.getElementById('navForm').addEventListener('click', function () { setView_('form'); });
  document.getElementById('navHistory').addEventListener('click', function () { setView_('history'); });
  document.getElementById('btnHistoryRefresh').addEventListener('click', function () { loadHistoryTabs_(); });
  document.getElementById('historyMonth').addEventListener('change', function () {
    document.getElementById('historySearch').value = '';
    loadHistoryEntries_(this.value);
  });
  document.getElementById('historySearch').addEventListener('input', applyHistoryFilter_);

  // "YYYY-MM" は "YYYY年MM月" に、それ以外(「登録日未定」)はそのまま表示する
  function formatHistoryMonthLabel_(name) {
    var m = /^(\d{4})-(\d{2})$/.exec(name);
    return m ? (m[1] + '年' + m[2] + '月') : name;
  }

  var HISTORY_SEARCH_COLUMN = '使用車名';
  var historyHeader_ = [];
  var historyAllRows_ = [];

  function loadHistoryTabs_() {
    var sel = document.getElementById('historyMonth');
    sel.disabled = true;
    google.script.run
      .withSuccessHandler(function (tabNames) {
        sel.disabled = false;
        sel.innerHTML = '';
        if (!tabNames || tabNames.length === 0) {
          historyHeader_ = [];
          historyAllRows_ = [];
          renderHistoryTable_([], [], '履歴データはまだありません。');
          return;
        }
        tabNames.forEach(function (name) {
          var opt = document.createElement('option');
          opt.value = name;
          opt.textContent = formatHistoryMonthLabel_(name);
          sel.appendChild(opt);
        });
        loadHistoryEntries_(sel.value);
      })
      .withFailureHandler(function (error) {
        sel.disabled = false;
        alert('対象月の取得に失敗しました:\n' + error.message);
      })
      .getHistoryTabNames();
  }

  function loadHistoryEntries_(tabName) {
    if (!tabName) {
      historyHeader_ = [];
      historyAllRows_ = [];
      renderHistoryTable_([], [], 'この月の履歴データはまだありません。');
      return;
    }
    google.script.run
      .withSuccessHandler(function (result) {
        historyHeader_ = result.header;
        historyAllRows_ = result.rows;
        applyHistoryFilter_();
      })
      .withFailureHandler(function (error) {
        historyHeader_ = [];
        historyAllRows_ = [];
        renderHistoryTable_([], [], 'この月の履歴データはまだありません。');
        alert('履歴の取得に失敗しました:\n' + error.message);
      })
      .getHistoryEntries(tabName);
  }

  // 「使用者名で検索」欄の入力値で historyAllRows_ を絞り込んで再描画する
  function applyHistoryFilter_() {
    var rawKeyword = document.getElementById('historySearch').value.trim();
    if (!rawKeyword) {
      renderHistoryTable_(historyHeader_, historyAllRows_, 'この月の履歴データはまだありません。');
      return;
    }

    var keyword = rawKeyword.toLowerCase();
    var colIndex = historyHeader_.indexOf(HISTORY_SEARCH_COLUMN);
    var filtered = historyAllRows_.filter(function (row) {
      return colIndex !== -1 && String(row[colIndex]).toLowerCase().indexOf(keyword) !== -1;
    });
    renderHistoryTable_(historyHeader_, filtered, '「' + rawKeyword + '」に一致する履歴が見つかりませんでした。');
  }

  function renderHistoryTable_(header, rows, emptyMessage) {
    var head = document.getElementById('historyTableHead');
    var body = document.getElementById('historyTableBody');
    head.innerHTML = '';
    body.innerHTML = '';

    header.forEach(function (label) {
      var th = document.createElement('th');
      th.textContent = label;
      if (HISTORY_NUMERIC_COLUMNS.indexOf(label) !== -1) th.classList.add('numCol');
      head.appendChild(th);
    });

    rows.forEach(function (row) {
      var tr = document.createElement('tr');
      row.forEach(function (cell, i) {
        var td = document.createElement('td');
        td.textContent = cell;
        if (HISTORY_NUMERIC_COLUMNS.indexOf(header[i]) !== -1) td.classList.add('numCol');
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });

    document.getElementById('historyCountBadge').textContent = rows.length + ' 件';
    document.getElementById('historyEmptyMsg').textContent = emptyMessage || 'この月の履歴データはまだありません。';
    document.getElementById('historyEmptyMsg').style.display = rows.length === 0 ? '' : 'none';
  }
</script>
