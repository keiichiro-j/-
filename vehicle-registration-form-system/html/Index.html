<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <?!= include('html/Stylesheet'); ?>
</head>
<body>
  <header class="masthead">
    <div class="masthead__inner">
      <p class="eyebrow">Vehicle Registration Request</p>
      <h1>新車新規登録依頼書 発行システム</h1>
      <p class="lead">紙登録・OSS登録の依頼内容を入力すると、履歴に記録した上でPDFを発行します。</p>
    </div>
  </header>

  <div class="page">
    <form id="mainForm" novalidate>
      <section class="card">
        <div class="card__head">
          <h2>基本情報</h2>
          <p class="muted">依頼の基本情報を入力してください。</p>
        </div>

        <div class="fieldRow">
          <div class="field">
            <label>出力フォーマット</label>
            <div class="segmented" role="tablist" aria-label="出力フォーマット">
              <button type="button" class="segBtn is-active" id="segOss" role="tab" aria-selected="true">OSS（電子申請）</button>
              <button type="button" class="segBtn" id="segPaper" role="tab" aria-selected="false">紙（従来申請）</button>
            </div>
            <input type="hidden" id="type" value="OSS">
          </div>
          <div class="field">
            <label for="company">依頼会社名 <span class="req">必須</span></label>
            <input type="text" id="company" list="dl-companies" autocomplete="off" required>
            <datalist id="dl-companies"></datalist>
          </div>
          <div class="field">
            <label for="manager">担当責任者 <span class="req">必須</span></label>
            <input type="text" id="manager" list="dl-managers" autocomplete="off" required>
            <datalist id="dl-managers"></datalist>
          </div>
        </div>

        <div class="fieldRow">
          <div class="field">
            <label for="sendDate">送付日 <span class="req">必須</span></label>
            <input type="date" id="sendDate" required>
          </div>
          <div class="field" id="commonRegDateField">
            <label for="regDateCommon">登録日（全体） <span class="req">必須</span></label>
            <input type="date" id="regDateCommon">
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card__head card__head--split">
          <div>
            <h2>車両データ</h2>
            <p class="muted">最大10台まで。1行につき1台。使用車名が未入力の行は無視されます。</p>
          </div>
          <span class="badge" id="vehicleCountBadge">0 / 10 台</span>
        </div>

        <div class="tableScroll">
          <table id="vehicleTable">
            <thead>
              <tr>
                <th class="colNo">No.</th>
                <th class="colRegDate">登録日<br><span class="muted">(OSS用)</span></th>
                <th class="colWide">使用車名</th>
                <th>車台番号<br><span class="muted">(下4桁)</span></th>
                <th>型式</th>
                <th>類別番号</th>
                <th>自動車税</th>
                <th>環境性能割</th>
                <th>重量税</th>
                <th>希望<br>ナンバー</th>
                <th>予備検<br>登録車</th>
                <th>本検<br>登録車</th>
                <th>身障者<br>減免車</th>
                <th>担当者</th>
                <th class="colDel"></th>
              </tr>
            </thead>
            <tbody id="vehicleTableBody"></tbody>
          </table>
        </div>

        <button type="button" id="btnAddRow" class="btn btn--ghost">＋ 行を追加</button>
        <datalist id="dl-usernames"></datalist>
        <datalist id="dl-persons"></datalist>
      </section>

      <div class="submitBar">
        <button type="submit" id="btnSubmit" class="btn btn--primary">登録してPDFを発行する</button>
        <div id="result" class="result" role="status" aria-live="polite"></div>
      </div>
    </form>
  </div>

  <?!= include('html/JavaScript'); ?>
</body>
</html>
