<style>
  :root {
    color-scheme: light;

    /* ---------- Design tokens: "Editorial Monochrome"(YANASE公式サイトの雰囲気を参考) ---------- */
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-alt: #F4F4F5;

    --ink: #1A1A1A;
    --ink-soft: #55565B;
    --muted: #8B8C92;

    --accent: #1A56DB;
    --accent-dark: #123F9E;
    --accent-soft: #EAF1FE;

    --success: #22A06B;
    --success-soft: #E7F6EF;
    --warning: #B5790A;
    --warning-soft: #FBF2DF;
    --warning-ink: #7A5B12;
    --shu: #D0342C;
    --shu-soft: #FCEAEA;

    --line: #E3E4E7;
    --line-soft: #EFEFF1;

    --r-xs: 4px;
    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 10px;
    --r-pill: 999px;

    --ease: cubic-bezier(0.4, 0, 0.2, 1);

    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow-md: 0 4px 16px rgba(16, 24, 40, 0.08);

    /* 「黒地に白文字」の強いコントラストのボタン・アクティブ状態用(ダークテーマでは白地に黒文字へ反転させる) */
    --solid-bg: #1A1A1A;
    --solid-bg-hover: #000000;
    --solid-ink: #FFFFFF;
    --solid-ripple: rgba(255, 255, 255, 0.35);
  }

  /* ---------- ダークテーマ(設定画面から切り替え。html/JavaScript.htmlのapplyTheme_参照) ---------- */

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121214;
    --surface: #1C1C1F;
    --surface-alt: #242427;
    --ink: #F2F2F3;
    --ink-soft: #B4B5BA;
    --muted: #797A80;
    --accent: #5B8DF7;
    --accent-dark: #82ABFA;
    --accent-soft: rgba(91, 141, 247, 0.18);
    --success: #34C98C;
    --success-soft: rgba(52, 201, 140, 0.16);
    --warning: #E3AC4C;
    --warning-soft: rgba(227, 172, 76, 0.16);
    --warning-ink: #FFD98A;
    --shu: #F17272;
    --shu-soft: rgba(241, 114, 114, 0.16);
    --line: #303034;
    --line-soft: #28282B;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);

    --solid-bg: #F2F2F3;
    --solid-bg-hover: #FFFFFF;
    --solid-ink: #121214;
    --solid-ripple: rgba(0, 0, 0, 0.18);
  }

  /* 「自動」選択時(data-theme属性なし)は端末のダークモード設定に従う */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --bg: #121214;
      --surface: #1C1C1F;
      --surface-alt: #242427;
      --ink: #F2F2F3;
      --ink-soft: #B4B5BA;
      --muted: #797A80;
      --accent: #5B8DF7;
      --accent-dark: #82ABFA;
      --accent-soft: rgba(91, 141, 247, 0.18);
      --success: #34C98C;
      --success-soft: rgba(52, 201, 140, 0.16);
      --warning: #E3AC4C;
      --warning-soft: rgba(227, 172, 76, 0.16);
      --warning-ink: #FFD98A;
      --shu: #F17272;
      --shu-soft: rgba(241, 114, 114, 0.16);
      --line: #303034;
      --line-soft: #28282B;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);

      --solid-bg: #F2F2F3;
      --solid-bg-hover: #FFFFFF;
      --solid-ink: #121214;
      --solid-ripple: rgba(0, 0, 0, 0.18);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  ::selection { background: var(--accent-soft); color: var(--ink); }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.7;
    font-feature-settings: "tnum" 1;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  img { max-width: 100%; height: auto; }

  /* ---------- masthead(白地・太字ロゴタイプ・下線アクセント。YANASE公式サイトのヘッダーを参考) ---------- */

  .masthead {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .masthead__inner { max-width: 1120px; margin: 0 auto; padding: 34px 24px; }
  .masthead__row { display: flex; align-items: center; gap: 22px; }
  .masthead__logo { flex: none; height: 48px; width: auto; max-width: 180px; object-fit: contain; border-radius: var(--r-xs); }
  .masthead__text { flex: 1; min-width: 0; }
  @media (max-width: 700px) {
    .masthead__logo { height: 36px; max-width: 120px; }
  }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
  }
  h1 {
    font-size: clamp(19px, 4.6vw, 25px);
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
    overflow-wrap: break-word;
  }
  h1::after {
    content: "";
    display: block;
    width: 44px;
    height: 3px;
    background: var(--ink);
    margin-top: 12px;
  }
  .lead {
    margin: 0;
    color: var(--ink-soft);
    font-size: 13.5px;
    max-width: 58ch;
    overflow-wrap: break-word;
  }

  /* ---------- layout ---------- */

  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 24px 88px;
  }

  .is-hidden { display: none !important; }

  /* ---------- 常時アクティビティ表示バー(全画面共通・スクロール追従) ---------- */

  .statusBar {
    position: sticky;
    top: 10px;
    z-index: 60;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 9px 10px 9px 18px;
    margin: 20px 0;
    font-size: 12px;
    color: var(--ink-soft);
    box-shadow: var(--shadow-sm);
    min-width: 0;
  }
  .statusBar__item { display: inline-flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
  .statusBar__item strong { color: var(--ink); font-weight: 700; }
  .statusBar__clock {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .statusBar__sep { color: var(--line); }
  .liveDot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    flex: none;
    animation: liveDotPulse 2s infinite;
  }
  @keyframes liveDotPulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 160, 107, 0.5); }
    70% { box-shadow: 0 0 0 6px rgba(34, 160, 107, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 160, 107, 0); }
  }
  .statusBar__cmdk {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 6px 10px;
    cursor: pointer;
    transition: color 0.15s var(--ease), border-color 0.15s var(--ease), transform 0.1s var(--ease);
  }
  .statusBar__cmdk:hover { color: var(--accent); border-color: var(--accent); }
  .statusBar__cmdk:active { transform: scale(0.96); }
  .statusBar__cmdk kbd {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    background: var(--surface-alt);
    border-radius: 4px;
    padding: 1px 5px;
  }
  @media (max-width: 700px) {
    .statusBar { font-size: 11px; padding: 8px 8px 8px 14px; }
    .statusBar__cmdk span.statusBar__cmdkLabel { display: none; }
  }

  /* ---------- 画面切り替え(申請 / 履歴確認 / 送付書PDF / 設定) ---------- */

  .viewSwitch {
    display: flex;
    flex-wrap: wrap;
    border-bottom: 2px solid var(--ink);
    gap: 2px;
    margin-bottom: 24px;
  }
  .viewSwitchBtn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: var(--r-sm) var(--r-sm) 0 0;
    padding: 11px 22px;
    cursor: pointer;
    transition: background-color 0.15s var(--ease), color 0.15s var(--ease);
  }
  .viewSwitchBtn:hover:not(.is-active) { color: var(--ink); background: var(--surface-alt); }
  .viewSwitchBtn.is-active {
    background: var(--solid-bg);
    color: var(--solid-ink);
  }
  .viewSwitchBtn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  @media (max-width: 560px) {
    .viewSwitchBtn { padding: 10px 14px; font-size: 12px; }
  }

  /* ---------- ベントグリッド ---------- */

  .bento {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 20px;
    margin-bottom: 20px;
  }
  .bento > .card { margin-bottom: 0; }
  .bento--span-12 { grid-column: span 12; }
  .bento--span-8 { grid-column: span 8; }
  .bento--span-6 { grid-column: span 6; }
  .bento--span-4 { grid-column: span 4; }
  @media (max-width: 860px) {
    .bento > * { grid-column: span 12 !important; }
  }

  /* ---------- カード(白地・細罫線。装飾を抑えたフラットなデザイン) ---------- */

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    padding: 32px;
    margin-bottom: 20px;
    position: relative;
    min-width: 0;
    transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  .card:hover {
    border-color: var(--muted);
    box-shadow: var(--shadow-md);
  }

  .card__head { margin-bottom: 22px; }
  .card__head--split { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card__head h2 {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 8px;
    padding-bottom: 8px;
    color: var(--ink);
    border-bottom: 2px solid var(--ink);
  }
  .muted { color: var(--ink-soft); font-size: 12px; margin: 0; overflow-wrap: break-word; }

  .badge {
    flex: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink);
    background: var(--surface-alt);
    border: 1px solid var(--line);
    padding: 4px 12px;
    border-radius: var(--r-pill);
    white-space: nowrap;
  }

  /* ---------- アクティビティカード(申請画面のベントレイアウト右側) ---------- */

  .activityCard { display: flex; flex-direction: column; gap: 16px; height: 100%; }
  .activityCard__row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .activityCard__label { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .activityCard__value { font-size: 28px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .activityCard__clock { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 20px; font-weight: 700; color: var(--accent); }
  .activityCard__latest { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; padding-top: 8px; border-top: 1px dashed var(--line); overflow-wrap: anywhere; }
  .activityCard__foot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--success); font-weight: 700; margin-top: auto; }

  .fieldRow {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 4px;
  }
  .field { flex: 1; min-width: 200px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field .req { color: var(--shu); font-weight: 700; font-size: 10px; letter-spacing: 0; text-transform: none; }

  /* ---------- 入力ヒントアイコン(車台番号・税額欄の見出しに付ける軽いツールチップ) ---------- */

  .hintIcon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--line);
    color: var(--surface);
    font-size: 9px;
    font-weight: 700;
    font-style: normal;
    text-transform: none;
    letter-spacing: 0;
    cursor: help;
    vertical-align: middle;
    transition: background-color 0.15s var(--ease);
  }
  .hintIcon:hover { background: var(--accent); }

  /* ---------- セグメントコントロール(出力フォーマット選択) ---------- */

  .segmented {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 4px;
    gap: 2px;
    width: 100%;
  }
  .segBtn {
    flex: 1;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: var(--r-sm);
    padding: 9px 10px;
    cursor: pointer;
    transition: background-color 0.15s var(--ease), color 0.15s var(--ease);
  }
  .segBtn:hover:not(.is-active) { color: var(--ink); background: var(--surface-alt); }
  .segBtn.is-active {
    background: var(--solid-bg);
    color: var(--solid-ink);
    font-weight: 700;
  }
  .segBtn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ---------- 入力欄 ---------- */

  input, select {
    width: 100%;
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  input::placeholder { color: var(--muted); opacity: 1; }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input.is-invalid, select.is-invalid {
    border-color: var(--shu);
    box-shadow: 0 0 0 3px var(--shu-soft);
  }

  /* ---------- 飛騨登録トグルボタン ---------- */

  .toggleBtn {
    width: 100%;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
  }
  .toggleBtn:hover { border-color: var(--muted); color: var(--ink); }
  .toggleBtn.is-active {
    background: var(--warning-soft);
    border-color: var(--warning);
    color: var(--warning-ink);
  }

  /* ---------- ON/OFFスイッチ(自動メール送信など) ---------- */

  .switchRow { display: flex; align-items: center; gap: 12px; }
  .switch {
    flex: none;
    width: 44px;
    height: 26px;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
  }
  .switch:disabled { cursor: not-allowed; opacity: 0.6; }
  .switch__track {
    display: block;
    width: 44px;
    height: 26px;
    border-radius: var(--r-pill);
    background: var(--line);
    border: 1px solid var(--line);
    position: relative;
    transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .switch__knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--surface);
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.25);
    transition: transform 0.15s var(--ease);
  }
  .switch.is-active .switch__track { background: var(--success); border-color: var(--success); }
  .switch.is-active .switch__knob { transform: translateX(18px); }
  .switch:focus-visible .switch__track { box-shadow: 0 0 0 3px var(--accent-soft); }

  .switchRow__label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }
  .switchRow__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .switchRow__label.is-on { color: var(--success); }
  .switchRow__label.is-on .switchRow__dot { background: var(--success); }
  .switchRow__label.is-off { color: var(--ink-soft); }
  .switchRow__label.is-off .switchRow__dot { background: var(--muted); }

  /* ---------- 車両テーブル ---------- */

  .tableScroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
  }
  table { width: 100%; border-collapse: collapse; min-width: 1280px; }
  th, td {
    padding: 10px 6px;
    text-align: center;
    font-size: 12.5px;
    border-bottom: 1px solid var(--line-soft);
  }
  thead th {
    background: var(--surface-alt);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 1;
    box-shadow: inset 0 -1px 0 var(--line);
  }
  tbody tr { transition: background-color 0.12s var(--ease); }
  tbody tr:hover td { background: var(--surface-alt); }
  td input, td select {
    padding: 6px;
    font-size: 12.5px;
    text-align: center;
    border: 1px solid transparent;
    border-radius: var(--r-xs);
  }
  td input:focus, td select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .v-autoTax, .v-envTax, .v-weightTax { text-align: right; }
  .colNo { width: 28px; color: var(--muted); }
  .colWide { min-width: 140px; }
  .colRegDate { min-width: 110px; }
  .colBrand { min-width: 76px; }
  .colDel { width: 32px; }
  .v-brand { min-width: 60px; padding: 6px 4px; font-size: 11px; }
  .colRegDate.is-hidden, td.cell-regdate.is-hidden { display: none; }

  /* 「〇」選択欄(希望ナンバー・予備検登録車・本検登録車・身障者減免車)は
     選択後の文字+プルダウン矢印が見切れないよう最低幅を確保する */
  .v-hopeNum, .v-yobi, .v-honken, .v-shinsho { min-width: 58px; padding: 6px 20px 6px 8px; }

  /* 横スクロールできる余地がまだ右にあることを示す影(スマホでの見切れ対策) */
  .tableScroll { position: relative; }
  .tableScroll.has-overflow-right { box-shadow: inset -14px 0 10px -10px rgba(16, 24, 40, 0.14); }

  /* スマホ幅では「No.」「使用者名」列を横スクロール時も画面に固定表示する */
  @media (max-width: 900px) {
    thead .colNo, tbody .cell-no {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--surface-alt);
    }
    thead .colWide, tbody .cell-username {
      position: sticky;
      left: var(--sticky-username-left, 28px);
      z-index: 2;
      background: var(--surface);
      box-shadow: 2px 0 4px rgba(16, 24, 40, 0.08);
    }
    tbody tr:hover .cell-no, tbody tr:hover .cell-username { background: var(--surface-alt); }
  }

  /* ---------- 履歴確認: フィルターツールバー ---------- */

  .filterBar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 18px;
    background: var(--surface-alt);
    border: 1px solid var(--line-soft);
    border-radius: var(--r-md);
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .filterGroup { display: flex; flex-direction: column; gap: 7px; }
  .filterGroup--grow { flex: 1; min-width: 180px; }
  .filterGroup__label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .filterGroup__row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filterGroup__row input[type="date"] { width: 150px; max-width: 100%; background: var(--surface); }
  .filterBar__sep { color: var(--muted); font-size: 12px; }
  .filterBar select { background: var(--surface); }
  .filterCheck {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
