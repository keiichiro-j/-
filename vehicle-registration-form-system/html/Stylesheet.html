<style>
  :root {
    color-scheme: light; /* Chromeの「Webコンテンツの自動ダークモード」による強制変換を無効化する */
    --page-bg: #EEF1F5;
    --surface: #FFFFFF;
    --surface-alt: #F4F6F9;
    --line: #DFE3E9;
    --ink: #1B222C;
    --ink-soft: #626C7A;
    --accent: #2F6FED;
    --accent-soft: #DCE7FF;
    --shu: #D0332B;
    --success: #1E7A46;
    --r-lg: 18px;
    --r-md: 12px;
    --r-sm: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Yu Gothic Medium", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    line-height: 1.7;
  }

  /* ---------- 共通のカード面(通常の影1つだけの、単純で確実なスタイル) ---------- */

  .masthead,
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 20px rgba(16, 24, 40, 0.05);
  }

  /* ---------- masthead ---------- */

  .masthead {
    max-width: 1080px;
    margin: 36px auto 24px;
  }
  .masthead__inner { padding: 38px 40px 34px; }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  h1 {
    font-size: 25px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .lead {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 56ch;
  }

  /* ---------- layout ---------- */

  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  .card {
    padding: 26px;
    margin-bottom: 22px;
  }
  .card__head { margin-bottom: 18px; }
  .card__head h2 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .muted { color: var(--ink-soft); font-size: 12.5px; margin: 0; }

  .fieldRow {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-bottom: 4px;
  }
  .field { flex: 1; min-width: 200px; }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 9px;
  }
  .field .req { color: var(--shu); font-weight: 700; font-size: 10.5px; letter-spacing: 0; text-transform: none; }

  /* ---------- 入力欄(白地+ボーダーのみ。影は使わない) ---------- */

  input, select {
    width: 100%;
    padding: 11px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
  }
  input::placeholder { color: var(--ink-soft); opacity: 0.8; }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input.is-invalid {
    border-color: var(--shu);
    box-shadow: 0 0 0 3px rgba(208, 51, 43, 0.15);
  }

  /* ---------- 車両テーブル ---------- */

  .tableScroll {
    overflow-x: auto;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
  }
  table { width: 100%; border-collapse: collapse; min-width: 1280px; }
  th, td {
    padding: 8px 6px;
    text-align: center;
    font-size: 12.5px;
    border-bottom: 1px solid var(--line);
  }
  thead th {
    background: var(--surface-alt);
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  tbody tr:hover td { background: var(--accent-soft); }
  td input, td select {
    padding: 6px;
    font-size: 12.5px;
    text-align: center;
    border: 1px solid transparent;
    border-radius: 6px;
  }
  td input:focus, td select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .colNo { width: 28px; color: var(--ink-soft); }
  .colWide { min-width: 140px; }
  .colRegDate { min-width: 110px; }
  .colDel { width: 32px; }
  .colRegDate.is-hidden, td.cell-regdate.is-hidden { display: none; }

  .btnRemoveRow {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .btnRemoveRow:hover { color: var(--shu); }

  /* ---------- ボタン ---------- */

  .btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 12px 20px;
    border-radius: var(--r-md);
    cursor: pointer;
  }
  .btn--ghost {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .btn--ghost:hover { border-color: var(--accent); color: var(--accent); }

  .btn--primary {
    background: var(--accent);
    color: #FFFFFF;
    width: 100%;
    padding: 17px 20px;
    font-size: 14.5px;
    border-radius: var(--r-lg);
    border: 1px solid var(--accent);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 20px rgba(47, 111, 237, 0.25);
  }
  .btn--primary:hover { background: #2A63D9; }
  .btn--primary:disabled {
    background: var(--surface-alt);
    color: var(--ink-soft);
    border-color: var(--line);
    box-shadow: none;
    cursor: not-allowed;
  }

  .submitBar { margin-top: 4px; }
  .result {
    margin-top: 16px;
    font-size: 13.5px;
    text-align: center;
  }
  .result.-pending { color: var(--accent); }
  .result.-success { color: var(--success); }
  .result.-error { color: var(--shu); white-space: pre-line; }
  .result a { color: var(--accent); }

  @media (max-width: 700px) {
    .masthead { margin: 20px auto 16px; }
    .masthead__inner { padding: 28px 24px 24px; }
    .page { padding: 0 16px 60px; }
    .card { padding: 20px; }
  }
</style>
