<style>
  :root {
    color-scheme: light; /* Chromeの「Webコンテンツの自動ダークモード」による強制変換を無効化する */
    /* 配色はGoogleの実際のデザイントークン値を採用(Google Blue等) */
    --page-bg: #F1F3F4;
    --surface: #FFFFFF;
    --surface-alt: #F1F3F4;
    --line: #DADCE0;
    --ink: #202124;
    --ink-soft: #5F6368;
    --accent: #1A73E8;
    --accent-dark: #174EA6;
    --accent-soft: #E8F0FE;
    --shu: #D93025;
    --success: #188038;
    --r-lg: 24px;
    --r-md: 12px;
    --r-sm: 4px;
    --r-pill: 999px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Yu Gothic Medium", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    line-height: 1.7;
    font-feature-settings: "tnum" 1;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- masthead(Google BlueのApp Bar風) ---------- */

  .masthead {
    max-width: 1080px;
    margin: 32px auto 20px;
    background: var(--accent);
    border-radius: var(--r-lg);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08), 0 12px 28px rgba(26, 115, 232, 0.28);
  }
  .masthead__inner { padding: 34px 36px 30px; }

  .dotRow { display: flex; gap: 7px; margin-bottom: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot--blue { background: #4285F4; }
  .dot--red { background: #EA4335; }
  .dot--yellow { background: #FBBC04; }
  .dot--green { background: #34A853; }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #D2E3FC;
    margin: 0 0 10px;
  }
  h1 {
    font-size: 25px;
    font-weight: 700;
    color: #FFFFFF;
    margin: 0 0 8px;
    letter-spacing: -0.005em;
  }
  .lead {
    margin: 0;
    color: #E8F0FE;
    font-size: 13.5px;
    max-width: 56ch;
  }

  /* ---------- layout ---------- */

  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  .is-hidden { display: none !important; }

  /* ---------- 画面切り替え(申請 / 履歴確認) ---------- */

  .viewSwitch {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 3px;
    gap: 2px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  .viewSwitchBtn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: var(--r-pill);
    padding: 10px 24px;
    cursor: pointer;
  }
  .viewSwitchBtn.is-active {
    background: var(--accent);
    color: #FFFFFF;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08), 0 6px 14px rgba(26, 115, 232, 0.25);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 20px rgba(16, 24, 40, 0.05);
    padding: 26px;
    margin-bottom: 20px;
  }
  .card__head { margin-bottom: 18px; }
  .card__head--split { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card__head h2 {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    margin: 0 0 4px;
    color: var(--accent);
  }
  .muted { color: var(--ink-soft); font-size: 12px; margin: 0; }

  .badge {
    flex: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 12px;
    border-radius: var(--r-pill);
    white-space: nowrap;
  }

  .fieldRow {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 4px;
  }
  .field { flex: 1; min-width: 200px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .field .req { color: var(--shu); font-weight: 700; font-size: 10px; letter-spacing: 0; text-transform: none; }

  /* ---------- セグメントコントロール(出力フォーマット選択、Materialの"Segmented Buttons"風) ---------- */

  .segmented {
    display: inline-flex;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 3px;
    gap: 2px;
    width: 100%;
  }
  .segBtn {
    flex: 1;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: var(--r-pill);
    padding: 9px 10px;
    cursor: pointer;
  }
  .segBtn.is-active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.12);
  }

  /* ---------- 入力欄(Materialのoutlined text field風。角丸は小さめ) ---------- */

  input, select {
    width: 100%;
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
  }
  input::placeholder { color: var(--ink-soft); opacity: 0.8; }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input.is-invalid, select.is-invalid {
    border-color: var(--shu);
    box-shadow: 0 0 0 3px rgba(217, 48, 37, 0.15);
  }

  /* ---------- 車両テーブル ---------- */

  .tableScroll {
    overflow-x: auto;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
  }
  table { width: 100%; border-collapse: collapse; min-width: 1280px; }
  th, td {
    padding: 8px 6px;
    text-align: center;
    font-size: 12.5px;
    border-bottom: 1px solid var(--line);
  }
  thead th {
    background: var(--surface-alt);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  tbody tr:hover td { background: var(--accent-soft); }
  td input, td select {
    padding: 6px;
    font-size: 12.5px;
    text-align: center;
    border: 1px solid transparent;
    border-radius: 6px;
  }
  td input:focus, td select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .v-autoTax, .v-envTax, .v-weightTax { text-align: right; }
  .colNo { width: 28px; color: var(--ink-soft); }
  .colWide { min-width: 140px; }
  .colRegDate { min-width: 110px; }
  .colDel { width: 32px; }
  .colRegDate.is-hidden, td.cell-regdate.is-hidden { display: none; }

  /* ---------- 履歴確認テーブル ---------- */

  #historyTable { min-width: 1600px; }
  #historyTable .numCol { text-align: right; }
  #historyTable td { color: var(--ink); }
  .historyRefreshField { flex: none; display: flex; flex-direction: column; justify-content: flex-end; }
  .historyRefreshField .btn { width: 100%; }
  .historyEmptyMsg { text-align: center; padding: 20px 0 4px; }

  .btnRemoveRow {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .btnRemoveRow:hover { color: var(--shu); }

  /* ---------- ボタン(Materialのpill形ボタン) ---------- */

  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 11px 22px;
    border-radius: var(--r-pill);
    cursor: pointer;
  }
  .btn--ghost {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--accent);
  }
  .btn--ghost:hover { background: var(--accent-soft); border-color: var(--accent); }

  .btn--primary {
    background: var(--accent);
    color: #FFFFFF;
    padding: 15px 24px;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid var(--accent);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 20px rgba(26, 115, 232, 0.28);
  }
  .btn--primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn--primary:disabled {
    background: var(--surface-alt);
    color: var(--ink-soft);
    border-color: var(--line);
    box-shadow: none;
    cursor: not-allowed;
  }

  .submitBar { margin-top: 4px; }
  .submitBar__row { display: flex; gap: 12px; }
  .submitBar__row .btn--primary { flex: 1; }
  .submitBar__row .btn--ghost { flex: none; padding: 15px 24px; }
  .result {
    margin-top: 16px;
    font-size: 13px;
    text-align: center;
  }
  .result.-pending { color: var(--accent); }
  .result.-success { color: var(--success); }
  .result.-error { color: var(--shu); white-space: pre-line; }
  .result a { color: var(--accent); }

  @media (max-width: 700px) {
    .masthead { margin: 20px auto 16px; }
    .masthead__inner { padding: 26px 22px 22px; }
    .page { padding: 0 16px 60px; }
    .card { padding: 18px; }
    .submitBar__row { flex-direction: column-reverse; }
    .submitBar__row .btn--ghost { width: 100%; }
  }
</style>
