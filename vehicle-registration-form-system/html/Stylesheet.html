<style>
  :root {
    color-scheme: light; /* Chromeの「Webコンテンツの自動ダークモード」による強制変換を無効化する */

    /* ---------- Design tokens: "Quiet Intelligence" ---------- */
    --bg: #F8F9FB;
    --surface: #FFFFFF;
    --surface-alt: #F1F3F5;

    --ink: #17181A;
    --ink-soft: #6B7280;
    --muted: #9CA3AF;

    --accent: #4F6BFF;
    --accent-dark: #3B4FDB;
    --accent-soft: #EEF1FF;

    --success: #22A06B;
    --success-soft: #E7F6EF;
    --warning: #D99A24;
    --warning-soft: #FBF2DF;
    --shu: #E05252;
    --shu-soft: #FCEAEA;

    --au-color: #6E56CF;
    --paper-color: #C98A1E;

    --line: #E6E8EC;
    --line-soft: #EFF1F4;

    --r-xs: 6px;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-pill: 999px;

    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  ::selection { background: var(--accent-soft); color: var(--ink); }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.7;
    font-feature-settings: "tnum" 1;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- masthead(白基調・控えめなアクセントラインのみ) ---------- */

  .masthead {
    max-width: 1080px;
    margin: 40px auto 32px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent);
    border-radius: var(--r-lg);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.03), 0 6px 16px rgba(16, 24, 40, 0.04);
  }
  .masthead__inner { padding: 40px 44px; }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 10px;
    letter-spacing: -0.015em;
  }
  .lead {
    margin: 0;
    color: var(--ink-soft);
    font-size: 13.5px;
    max-width: 58ch;
  }

  /* ---------- layout ---------- */

  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 88px;
  }

  .is-hidden { display: none !important; }

  /* ---------- 画面切り替え(申請 / 履歴確認) ---------- */

  .viewSwitch {
    display: inline-flex;
    background: var(--surface-alt);
    border: 1px solid var(--line-soft);
    border-radius: var(--r-md);
    padding: 4px;
    gap: 2px;
    margin-bottom: 24px;
  }
  .viewSwitchBtn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: var(--r-sm);
    padding: 9px 22px;
    cursor: pointer;
    transition: background-color 0.15s var(--ease), color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .viewSwitchBtn:hover:not(.is-active) { color: var(--ink); background: rgba(23, 24, 26, 0.04); }
  .viewSwitchBtn.is-active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 1px rgba(16, 24, 40, 0.04);
  }
  .viewSwitchBtn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  @media (max-width: 560px) {
    .viewSwitchBtn { padding: 9px 14px; font-size: 12px; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.03), 0 4px 12px rgba(16, 24, 40, 0.04);
    padding: 32px;
    margin-bottom: 24px;
    transition: box-shadow 0.2s var(--ease);
  }
  .card:hover {
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 20px rgba(16, 24, 40, 0.06);
  }
  .card__head { margin-bottom: 22px; }
  .card__head--split { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card__head h2 {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .muted { color: var(--ink-soft); font-size: 12px; margin: 0; }

  .badge {
    flex: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 12px;
    border-radius: var(--r-pill);
    white-space: nowrap;
  }

  .fieldRow {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 4px;
  }
  .field { flex: 1; min-width: 200px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field .req { color: var(--shu); font-weight: 700; font-size: 10px; letter-spacing: 0; text-transform: none; }

  /* ---------- 入力ヒントアイコン(車台番号・税額欄の見出しに付ける軽いツールチップ) ---------- */

  .hintIcon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--line);
    color: var(--surface);
    font-size: 9px;
    font-weight: 700;
    font-style: normal;
    text-transform: none;
    letter-spacing: 0;
    cursor: help;
    vertical-align: middle;
    transition: background-color 0.15s var(--ease);
  }
  .hintIcon:hover { background: var(--accent); }

  /* ---------- セグメントコントロール(出力フォーマット選択) ---------- */

  .segmented {
    display: inline-flex;
    background: var(--surface-alt);
    border: 1px solid var(--line-soft);
    border-radius: var(--r-md);
    padding: 4px;
    gap: 2px;
    width: 100%;
  }
  .segBtn {
    flex: 1;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: var(--r-sm);
    padding: 9px 10px;
    cursor: pointer;
    transition: background-color 0.15s var(--ease), color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .segBtn:hover:not(.is-active) { color: var(--ink); }
  .segBtn.is-active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
  }
  .segBtn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ---------- 入力欄 ---------- */

  input, select {
    width: 100%;
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  input::placeholder { color: var(--muted); opacity: 1; }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input.is-invalid, select.is-invalid {
    border-color: var(--shu);
    box-shadow: 0 0 0 3px var(--shu-soft);
  }

  /* ---------- 飛騨登録トグルボタン ---------- */

  .toggleBtn {
    width: 100%;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
  }
  .toggleBtn:hover { border-color: var(--muted); color: var(--ink); }
  .toggleBtn.is-active {
    background: var(--warning-soft);
    border-color: var(--warning);
    color: #7A5B12;
  }

  /* ---------- 車両テーブル ---------- */

  .tableScroll {
    overflow-x: auto;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
  }
  table { width: 100%; border-collapse: collapse; min-width: 1280px; }
  th, td {
    padding: 10px 6px;
    text-align: center;
    font-size: 12.5px;
    border-bottom: 1px solid var(--line-soft);
  }
  thead th {
    background: var(--surface-alt);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 1;
    box-shadow: inset 0 -1px 0 var(--line);
  }
  tbody tr { transition: background-color 0.12s var(--ease); }
  tbody tr:hover td { background: rgba(79, 107, 255, 0.035); }
  td input, td select {
    padding: 6px;
    font-size: 12.5px;
    text-align: center;
    border: 1px solid transparent;
    border-radius: var(--r-xs);
  }
  td input:focus, td select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .v-autoTax, .v-envTax, .v-weightTax { text-align: right; }
  .colNo { width: 28px; color: var(--muted); }
  .colWide { min-width: 140px; }
  .colRegDate { min-width: 110px; }
  .colBrand { min-width: 76px; }
  .colDel { width: 32px; }
  .v-brand { min-width: 60px; padding: 6px 4px; font-size: 11px; }
  .colRegDate.is-hidden, td.cell-regdate.is-hidden { display: none; }

  /* 「〇」選択欄(希望ナンバー・予備検登録車・本検登録車・身障者減免車)は
     選択後の文字+プルダウン矢印が見切れないよう最低幅を確保する */
  .v-hopeNum, .v-yobi, .v-honken, .v-shinsho { min-width: 58px; padding: 6px 20px 6px 8px; }

  /* 横スクロールできる余地がまだ右にあることを示す影(スマホでの見切れ対策) */
  .tableScroll { position: relative; }
  .tableScroll.has-overflow-right { box-shadow: inset -14px 0 10px -10px rgba(16, 24, 40, 0.14); }

  /* スマホ幅では「No.」「使用者名」列を横スクロール時も画面に固定表示する */
  @media (max-width: 900px) {
    thead .colNo, tbody .cell-no {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--surface-alt);
    }
    thead .colWide, tbody .cell-username {
      position: sticky;
      left: var(--sticky-username-left, 28px);
      z-index: 2;
      background: var(--surface);
      box-shadow: 2px 0 4px rgba(16, 24, 40, 0.08);
    }
    tbody tr:hover .cell-no, tbody tr:hover .cell-username { background: rgba(79, 107, 255, 0.035); }
  }

  /* ---------- 履歴確認: フィルターツールバー ---------- */

  .filterBar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 18px;
    background: var(--surface-alt);
    border: 1px solid var(--line-soft);
    border-radius: var(--r-md);
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .filterGroup { display: flex; flex-direction: column; gap: 7px; }
  .filterGroup--grow { flex: 1; min-width: 180px; }
  .filterGroup__label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .filterGroup__row { display: flex; align-items: center; gap: 8px; }
  .filterGroup__row input[type="date"] { width: 150px; background: var(--surface); }
  .filterBar__sep { color: var(--muted); font-size: 12px; }
  .filterBar select { background: var(--surface); }
  .filterCheck {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    padding-bottom: 11px;
    white-space: nowrap;
  }
  .filterCheck input { width: auto; accent-color: var(--accent); cursor: pointer; }
  .filterBar__submit { flex: none; padding: 10px 26px; }

  /* ---------- 履歴確認テーブル ---------- */

  .tableScroll--history { max-height: 560px; overflow-y: auto; }
  #historyTable { min-width: 1700px; }
  #historyTable .numCol { text-align: right; }
  #historyTable td { color: var(--ink); }
  #historyTable tbody tr:nth-child(even) td { background: var(--surface-alt); }
  #historyTable tbody tr:hover td { background: rgba(79, 107, 255, 0.045); }
  .historyEmptyMsg { text-align: center; padding: 20px 0 4px; }

  /* 取消済みの申請は打ち消し線+ミュートカラーで一目でわかるようにする */
  #historyTable tbody tr.is-cancelled td { color: var(--muted); text-decoration: line-through; }
  #historyTable tbody tr.is-cancelled td a.pdfLink { text-decoration: line-through; }

  .pdfLink {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  .pdfLink:hover { text-decoration: underline; }

  .btn--sm { padding: 6px 14px; font-size: 12px; }

  @media (max-width: 700px) {
    .filterBar { flex-direction: column; align-items: stretch; }
    .filterBar__submit { width: 100%; }
  }

  .btnRemoveRow {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
    transition: color 0.15s var(--ease);
  }
  .btnRemoveRow:hover { color: var(--shu); }

  /* ---------- ボタン ---------- */

  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 11px 22px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), transform 0.1s var(--ease);
  }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn--ghost {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .btn--ghost:hover { background: var(--surface-alt); border-color: var(--muted); }

  .btn--primary {
    background: var(--accent);
    color: #FFFFFF;
    padding: 14px 24px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid var(--accent);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 4px 10px rgba(79, 107, 255, 0.18);
  }
  .btn--primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 6px 14px rgba(79, 107, 255, 0.24); }
  .btn--primary:disabled {
    background: var(--surface-alt);
    color: var(--muted);
    border-color: var(--line);
    box-shadow: none;
    cursor: not-allowed;
  }

  .submitBar { margin-top: 4px; }
  .submitBar__row { display: flex; gap: 12px; }
  .submitBar__row .btn--primary { flex: 1; }
  .submitBar__row .btn--ghost { flex: none; padding: 14px 24px; }
  .result {
    margin-top: 16px;
    font-size: 13px;
    text-align: center;
  }
  .result.-pending { color: var(--accent); }
  .result.-success { color: var(--success); }
  .result.-error { color: var(--shu); white-space: pre-line; }
  .result a { color: var(--accent); }

  /* ---------- 処理中インジケーター(送信ボタン押下後) ---------- */

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 8px;
    vertical-align: -2px;
    border: 2px solid var(--accent-soft);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- PDFプレビュー(発行直後 / 履歴確認・送付書PDF画面共通) ---------- */

  .pdfPreviewPane {
    margin-top: 18px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    overflow: hidden;
    background: var(--surface-alt);
  }
  .pdfPreviewPane__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .pdfPreviewFrame {
    display: block;
    width: 100%;
    height: 70vh;
    min-height: 420px;
    border: none;
    background: var(--surface);
  }

  /* ---------- 送付書PDF画面: 申請単位の一覧 ---------- */

  .pdfList { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }
  .pdfRow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--line-soft);
    border-radius: var(--r-md);
    background: var(--surface-alt);
    transition: border-color 0.15s var(--ease);
  }
  .pdfRow:hover { border-color: var(--line); }
  .pdfRow.is-cancelled { opacity: 0.6; }
  .pdfRow__main { display: flex; flex-direction: column; gap: 4px; min-width: 220px; }
  .pdfRow__company { font-size: 14px; font-weight: 700; color: var(--ink); }
  .pdfRow__meta { font-size: 12px; color: var(--ink-soft); }
  .pdfRow__users { font-size: 12px; color: var(--ink-soft); }
  .pdfRow__cancelled { color: var(--shu); font-weight: 700; }
  .pdfRow__actions { display: flex; gap: 8px; flex: none; }

  /* ---------- 送付書PDF画面: メール送信 ---------- */

  .mailRecipients { margin: 4px 0 18px; }
  .mailRecipients__grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 8px;
  }
  .mailSendBtn { width: 100%; }

  /* ---------- ダッシュボード画面 ---------- */

  .dashStats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-top: 24px;
  }
  .statTile {
    background: var(--surface-alt);
    border: 1px solid var(--line-soft);
    border-left: 3px solid var(--muted);
    border-radius: var(--r-md);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .statTile__value { font-size: 25px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .statTile__label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .statTile--mb { border-left-color: var(--accent); }
  .statTile--au { border-left-color: var(--au-color); }
  .statTile--oss { border-left-color: var(--success); }
  .statTile--paper { border-left-color: var(--paper-color); }
  .statTile--cancelled { border-left-color: var(--shu); }

  .dashGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  .dashChartCard { margin-bottom: 24px; }
  .dashGrid .dashChartCard { margin-bottom: 0; }
  .dashChartCard__title {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink);
    margin: 0 0 18px;
  }

  .barChart { display: flex; flex-direction: column; gap: 14px; }
  .barRow { display: grid; grid-template-columns: 56px 1fr 40px; align-items: center; gap: 10px; }
  .barRow__label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .barRow__track {
    background: var(--surface-alt);
    border-radius: var(--r-pill);
    height: 10px;
    overflow: hidden;
  }
  .barRow__fill {
    display: block;
    height: 100%;
    border-radius: var(--r-pill);
    background: var(--muted);
    transition: width 0.4s var(--ease);
  }
  .barRow__fill--mb { background: var(--accent); }
  .barRow__fill--au { background: var(--au-color); }
  .barRow__fill--oss { background: var(--success); }
  .barRow__fill--paper { background: var(--paper-color); }
  .barRow__fill--muted { background: var(--line); }
  .barRow__value { font-size: 13px; font-weight: 700; text-align: right; color: var(--ink); }

  #dashMatrixTable { min-width: 0; width: 100%; }
  #dashMatrixBody th {
    text-align: left;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
  }
  .dashMatrixTotal { font-weight: 700; }
  .dashMatrixTotalRow td, .dashMatrixTotalRow th { background: var(--surface-alt); font-weight: 700; }

  .trendChart { margin-top: 4px; }
  .trendSvg { width: 100%; height: auto; display: block; }
  .trendBar { fill: url(#dashTrendGradient); transition: opacity 0.15s var(--ease); }
  .trendBar--empty { fill: var(--surface-alt); }
  .trendBar:hover { opacity: 0.75; }
  .trendLabel { font-size: 9px; fill: var(--muted); }
