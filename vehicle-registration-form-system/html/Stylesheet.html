<style>
  :root {
    color-scheme: light; /* Chromeの「Webコンテンツの自動ダークモード」による強制変換を無効化する */
    /* 配色はGoogleの実際のデザイントークン値を採用(Google Blue等) */
    --page-bg: #F1F3F4;
    --surface: #FFFFFF;
    --surface-alt: #F1F3F4;
    --line: #DADCE0;
    --ink: #202124;
    --ink-soft: #5F6368;
    --accent: #1A73E8;
    --accent-dark: #174EA6;
    --accent-soft: #E8F0FE;
    --shu: #D93025;
    --success: #188038;
    --r-lg: 24px;
    --r-md: 12px;
    --r-sm: 4px;
    --r-pill: 999px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Yu Gothic Medium", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    line-height: 1.7;
    font-feature-settings: "tnum" 1;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- masthead(Google BlueのApp Bar風) ---------- */

  .masthead {
    max-width: 1080px;
    margin: 32px auto 20px;
    background: var(--accent);
    border-radius: var(--r-lg);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08), 0 12px 28px rgba(26, 115, 232, 0.28);
  }
  .masthead__inner { padding: 34px 36px 30px; }

  .dotRow { display: flex; gap: 7px; margin-bottom: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot--blue { background: #4285F4; }
  .dot--red { background: #EA4335; }
  .dot--yellow { background: #FBBC04; }
  .dot--green { background: #34A853; }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #D2E3FC;
    margin: 0 0 10px;
  }
  h1 {
    font-size: 25px;
    font-weight: 700;
    color: #FFFFFF;
    margin: 0 0 8px;
    letter-spacing: -0.005em;
  }
  .lead {
    margin: 0;
    color: #E8F0FE;
    font-size: 13.5px;
    max-width: 56ch;
  }

  /* ---------- layout ---------- */

  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  .is-hidden { display: none !important; }

  /* ---------- 画面切り替え(申請 / 履歴確認) ---------- */

  .viewSwitch {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 3px;
    gap: 2px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  .viewSwitchBtn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: var(--r-pill);
    padding: 10px 24px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }
  .viewSwitchBtn.is-active {
    background: var(--accent);
    color: #FFFFFF;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08), 0 6px 14px rgba(26, 115, 232, 0.25);
  }
  @media (max-width: 560px) {
    .viewSwitchBtn { padding: 9px 14px; font-size: 12px; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 20px rgba(16, 24, 40, 0.05);
    padding: 26px;
    margin-bottom: 20px;
    transition: box-shadow 0.2s ease;
  }
  .card:hover {
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 12px 28px rgba(16, 24, 40, 0.08);
  }
  .card__head { margin-bottom: 18px; }
  .card__head--split { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card__head h2 {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    margin: 0 0 4px;
    color: var(--accent);
  }
  .muted { color: var(--ink-soft); font-size: 12px; margin: 0; }

  .badge {
    flex: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 12px;
    border-radius: var(--r-pill);
    white-space: nowrap;
  }

  .fieldRow {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 4px;
  }
  .field { flex: 1; min-width: 200px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .field .req { color: var(--shu); font-weight: 700; font-size: 10px; letter-spacing: 0; text-transform: none; }

  /* ---------- 入力ヒントアイコン(車台番号・税額欄の見出しに付ける軽いツールチップ) ---------- */

  .hintIcon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--line);
    color: var(--surface);
    font-size: 9px;
    font-weight: 700;
    font-style: normal;
    text-transform: none;
    letter-spacing: 0;
    cursor: help;
    vertical-align: middle;
  }
  .hintIcon:hover { background: var(--accent); }

  /* ---------- セグメントコントロール(出力フォーマット選択、Materialの"Segmented Buttons"風) ---------- */

  .segmented {
    display: inline-flex;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 3px;
    gap: 2px;
    width: 100%;
  }
  .segBtn {
    flex: 1;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: var(--r-pill);
    padding: 9px 10px;
    cursor: pointer;
  }
  .segBtn.is-active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.12);
  }

  /* ---------- 入力欄(Materialのoutlined text field風。角丸は小さめ) ---------- */

  input, select {
    width: 100%;
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input::placeholder { color: var(--ink-soft); opacity: 0.8; }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input.is-invalid, select.is-invalid {
    border-color: var(--shu);
    box-shadow: 0 0 0 3px rgba(217, 48, 37, 0.15);
  }

  /* ---------- 飛騨登録トグルボタン(オンのとき、印字されるバッジと同系色にして予告する) ---------- */

  .toggleBtn {
    width: 100%;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .toggleBtn.is-active {
    background: #FEF7E0;
    border-color: #F9AB00;
    color: #7A5B00;
  }

  /* ---------- 車両テーブル ---------- */

  .tableScroll {
    overflow-x: auto;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
  }
  table { width: 100%; border-collapse: collapse; min-width: 1280px; }
  th, td {
    padding: 8px 6px;
    text-align: center;
    font-size: 12.5px;
    border-bottom: 1px solid var(--line);
  }
  thead th {
    background: var(--surface-alt);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 1;
    box-shadow: inset 0 -1px 0 var(--line);
  }
  tbody tr:hover td { background: var(--accent-soft); }
  td input, td select {
    padding: 6px;
    font-size: 12.5px;
    text-align: center;
    border: 1px solid transparent;
    border-radius: 6px;
  }
  td input:focus, td select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .v-autoTax, .v-envTax, .v-weightTax { text-align: right; }
  .colNo { width: 28px; color: var(--ink-soft); }
  .colWide { min-width: 140px; }
  .colRegDate { min-width: 110px; }
  .colBrand { min-width: 76px; }
  .colDel { width: 32px; }
  .v-brand { min-width: 60px; padding: 6px 4px; font-size: 11px; }
  .colRegDate.is-hidden, td.cell-regdate.is-hidden { display: none; }

  /* 「〇」選択欄(希望ナンバー・予備検登録車・本検登録車・身障者減免車)は
     選択後の文字+プルダウン矢印が見切れないよう最低幅を確保する */
  .v-hopeNum, .v-yobi, .v-honken, .v-shinsho { min-width: 58px; padding: 6px 20px 6px 8px; }

  /* 横スクロールできる余地がまだ右にあることを示す影(スマホでの見切れ対策) */
  .tableScroll { position: relative; }
  .tableScroll.has-overflow-right { box-shadow: inset -14px 0 10px -10px rgba(16, 24, 40, 0.18); }

  /* スマホ幅では「No.」「使用者名」列を横スクロール時も画面に固定表示する */
  @media (max-width: 900px) {
    thead .colNo, tbody .cell-no {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--surface-alt);
    }
    thead .colWide, tbody .cell-username {
      position: sticky;
      left: var(--sticky-username-left, 28px);
      z-index: 2;
      background: var(--surface);
      box-shadow: 2px 0 4px rgba(16, 24, 40, 0.1);
    }
    tbody tr:hover .cell-no, tbody tr:hover .cell-username { background: var(--accent-soft); }
  }

  /* ---------- 履歴確認: フィルターツールバー ---------- */

  .filterBar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 18px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .filterGroup { display: flex; flex-direction: column; gap: 7px; }
  .filterGroup--grow { flex: 1; min-width: 180px; }
  .filterGroup__label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .filterGroup__row { display: flex; align-items: center; gap: 8px; }
  .filterGroup__row input[type="date"] { width: 150px; background: var(--surface); }
  .filterBar__sep { color: var(--ink-soft); font-size: 12px; }
  .filterBar select { background: var(--surface); }
  .filterCheck {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    padding-bottom: 11px;
    white-space: nowrap;
  }
  .filterCheck input { width: auto; accent-color: var(--accent); cursor: pointer; }
  .filterBar__submit { flex: none; padding: 10px 26px; }

  /* ---------- 履歴確認テーブル ---------- */

  .tableScroll--history { max-height: 560px; overflow-y: auto; }
  #historyTable { min-width: 1700px; }
  #historyTable .numCol { text-align: right; }
  #historyTable td { color: var(--ink); }
  #historyTable tbody tr:nth-child(even) td { background: var(--surface-alt); }
  #historyTable tbody tr:hover td { background: var(--accent-soft); }
  .historyEmptyMsg { text-align: center; padding: 20px 0 4px; }

  /* 取消済みの申請は打ち消し線+ミュートカラーで一目でわかるようにする */
  #historyTable tbody tr.is-cancelled td { color: var(--ink-soft); text-decoration: line-through; }
  #historyTable tbody tr.is-cancelled td a.pdfLink { text-decoration: line-through; }

  .pdfLink {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  .pdfLink:hover { text-decoration: underline; }

  .btn--sm { padding: 6px 14px; font-size: 12px; }

  @media (max-width: 700px) {
    .filterBar { flex-direction: column; align-items: stretch; }
    .filterBar__submit { width: 100%; }
  }

  .btnRemoveRow {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .btnRemoveRow:hover { color: var(--shu); }

  /* ---------- ボタン(Materialのpill形ボタン) ---------- */

  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 11px 22px;
    border-radius: var(--r-pill);
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn--ghost {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--accent);
  }
  .btn--ghost:hover { background: var(--accent-soft); border-color: var(--accent); }

  .btn--primary {
    background: var(--accent);
    color: #FFFFFF;
    padding: 15px 24px;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid var(--accent);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 20px rgba(26, 115, 232, 0.28);
  }
  .btn--primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn--primary:disabled {
    background: var(--surface-alt);
    color: var(--ink-soft);
    border-color: var(--line);
    box-shadow: none;
    cursor: not-allowed;
  }

  .submitBar { margin-top: 4px; }
  .submitBar__row { display: flex; gap: 12px; }
  .submitBar__row .btn--primary { flex: 1; }
  .submitBar__row .btn--ghost { flex: none; padding: 15px 24px; }
  .result {
    margin-top: 16px;
    font-size: 13px;
    text-align: center;
  }
  .result.-pending { color: var(--accent); }
  .result.-success { color: var(--success); }
  .result.-error { color: var(--shu); white-space: pre-line; }
  .result a { color: var(--accent); }

  /* ---------- 処理中インジケーター(送信ボタン押下後) ---------- */

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 8px;
    vertical-align: -2px;
    border: 2px solid var(--accent-soft);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- PDFプレビュー(発行直後 / 履歴確認・送付書PDF画面共通) ---------- */

  .pdfPreviewPane {
    margin-top: 18px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    overflow: hidden;
    background: var(--surface-alt);
  }
  .pdfPreviewPane__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .pdfPreviewFrame {
    display: block;
    width: 100%;
    height: 70vh;
    min-height: 420px;
    border: none;
    background: var(--surface);
  }

  /* ---------- 送付書PDF画面: 申請単位の一覧 ---------- */

  .pdfList { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }
  .pdfRow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface-alt);
  }
  .pdfRow.is-cancelled { opacity: 0.6; }
  .pdfRow__main { display: flex; flex-direction: column; gap: 4px; min-width: 220px; }
  .pdfRow__company { font-size: 14px; font-weight: 700; color: var(--ink); }
  .pdfRow__meta { font-size: 12px; color: var(--ink-soft); }
  .pdfRow__users { font-size: 12px; color: var(--ink-soft); }
  .pdfRow__cancelled { color: var(--shu); font-weight: 700; }
  .pdfRow__actions { display: flex; gap: 8px; flex: none; }

  @media (max-width: 700px) {
    .masthead { margin: 20px auto 16px; }
    .masthead__inner { padding: 26px 22px 22px; }
    .page { padding: 0 16px 60px; }
    .card { padding: 18px; }
    .submitBar__row { flex-direction: column-reverse; }
    .submitBar__row .btn--ghost { width: 100%; }
    .pdfRow { flex-direction: column; align-items: stretch; }
    .pdfRow__actions { width: 100%; }
    .pdfRow__actions .btn { flex: 1; text-align: center; }
    .pdfPreviewFrame { height: 60vh; min-height: 320px; }
  }
</style>
