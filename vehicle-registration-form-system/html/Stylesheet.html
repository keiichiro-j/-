<style>
  :root {
    --surface: #E9EDF2;       /* ページ全体・カード・入力欄すべて同じ地色(モノクロマティックが原則) */
    --surface-alt: #E1E6ED;   /* テーブル内などごく僅かな階調差が欲しい箇所だけに使う */
    --shadow-dark: #B7C0CC;   /* 凹凸の暗い側 */
    --shadow-light: #FFFFFF;  /* 凹凸の明るい側 */
    --hairline: rgba(20, 30, 45, 0.07); /* シャドウが見えない環境でも輪郭が分かるよう保険で敷く薄い線 */
    --ink: #1B222C;
    --ink-soft: #626C7A;
    --accent: #2F6FED;
    --accent-soft: #DCE7FF;
    --shu: #D0332B;
    --success: #1E7A46;
    --r-lg: 22px;
    --r-md: 14px;
    --r-sm: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Yu Gothic Medium", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    line-height: 1.7;
  }

  /* ---------- 共通: 浮き出た面 / 沈み込んだ面 ---------- */
  /* シャドウが弱く見える環境でも輪郭が分かるよう、薄いborderを保険で常に敷く */

  .masthead,
  .card,
  .btn--ghost {
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
  }

  input, select, .tableScroll {
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
  }

  /* ---------- masthead ---------- */

  .masthead {
    max-width: 1080px;
    margin: 36px auto 24px;
    border-radius: var(--r-lg);
  }
  .masthead__inner { padding: 38px 40px 34px; }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  h1 {
    font-size: 25px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .lead {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 56ch;
  }

  /* ---------- layout ---------- */

  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  .card {
    border-radius: var(--r-lg);
    padding: 26px;
    margin-bottom: 22px;
  }
  .card__head { margin-bottom: 18px; }
  .card__head h2 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .muted { color: var(--ink-soft); font-size: 12.5px; margin: 0; }

  .fieldRow {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-bottom: 4px;
  }
  .field { flex: 1; min-width: 200px; }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 9px;
  }
  .field .req { color: var(--shu); font-weight: 700; font-size: 10.5px; letter-spacing: 0; text-transform: none; }

  /* ---------- 入力欄(沈み込んだ「くぼみ」として表現) ---------- */

  input, select {
    width: 100%;
    padding: 11px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    border-radius: var(--r-sm);
  }
  input::placeholder { color: var(--ink-soft); opacity: 0.8; }
  input:focus, select:focus {
    outline: none;
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light),
      0 0 0 3px var(--accent-soft);
  }
  input.is-invalid {
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light),
      0 0 0 3px rgba(208, 51, 43, 0.2);
  }

  /* ---------- 車両テーブル: 全体を1つの「くぼみ」で囲み、内側は控えめなフラット表示 ---------- */

  .tableScroll {
    overflow-x: auto;
    margin-bottom: 16px;
    border-radius: var(--r-md);
    padding: 4px;
  }
  table { width: 100%; border-collapse: collapse; min-width: 1280px; }
  th, td {
    padding: 8px 6px;
    text-align: center;
    font-size: 12.5px;
    border-bottom: 1px solid var(--hairline);
  }
  thead th {
    background: var(--surface-alt);
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
    border-radius: 8px;
  }
  tbody tr:hover td { background: var(--accent-soft); }
  td input, td select {
    padding: 6px;
    font-size: 12.5px;
    text-align: center;
    background: transparent;
    box-shadow: none;
    border: none;
    border-radius: 6px;
  }
  td input:focus, td select:focus { box-shadow: 0 0 0 2px var(--accent-soft); }
  .colNo { width: 28px; color: var(--ink-soft); }
  .colWide { min-width: 140px; }
  .colRegDate { min-width: 110px; }
  .colDel { width: 32px; }
  .colRegDate.is-hidden, td.cell-regdate.is-hidden { display: none; }

  .btnRemoveRow {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .btnRemoveRow:hover { color: var(--shu); }

  /* ---------- ボタン: 通常は浮き出て、押すと沈み込む ---------- */

  .btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 12px 20px;
    border-radius: var(--r-md);
    cursor: pointer;
  }
  .btn--ghost { color: var(--ink-soft); }
  .btn--ghost:hover { color: var(--accent); }
  .btn--ghost:active {
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
  }

  .btn--primary {
    background: var(--accent);
    color: #FFFFFF;
    width: 100%;
    padding: 17px 20px;
    font-size: 14.5px;
    border-radius: var(--r-lg);
    border: 1px solid var(--accent);
    box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
  }
  .btn--primary:active {
    box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.25), inset -4px -4px 8px rgba(255, 255, 255, 0.25);
  }
  .btn--primary:disabled {
    background: var(--surface-alt);
    color: var(--ink-soft);
    border-color: var(--hairline);
    box-shadow: none;
    cursor: not-allowed;
  }

  .submitBar { margin-top: 4px; }
  .result {
    margin-top: 16px;
    font-size: 13.5px;
    text-align: center;
  }
  .result.-pending { color: var(--accent); }
  .result.-success { color: var(--success); }
  .result.-error { color: var(--shu); white-space: pre-line; }
  .result a { color: var(--accent); }

  @media (max-width: 700px) {
    .masthead { margin: 20px auto 16px; }
    .masthead__inner { padding: 28px 24px 24px; }
    .page { padding: 0 16px 60px; }
    .card { padding: 20px; }
  }
</style>
