<style>
  :root {
    --charcoal: #14161A;
    --charcoal-soft: #22252B;
    --paper: #F4F5F7;
    --surface: #FFFFFF;
    --surface-alt: #ECEEF1;
    --ink: #14161A;
    --ink-soft: #5B6169;
    --line: #DADDE2;
    --accent: #2F6FED;
    --accent-soft: #E7EEFD;
    --shu: #D0332B;
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Yu Gothic Medium", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    line-height: 1.7;
  }

  /* ---------- masthead ---------- */

  .masthead {
    background: var(--charcoal);
    border-bottom: 3px solid var(--accent);
  }
  .masthead__inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 44px 24px 30px;
  }
  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  h1 {
    font-size: 25px;
    font-weight: 800;
    color: #FFFFFF;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .lead {
    margin: 0;
    color: rgba(255, 255, 255, 0.68);
    font-size: 14px;
    max-width: 56ch;
  }

  /* ---------- layout ---------- */

  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card__head { margin-bottom: 16px; }
  .card__head h2 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .muted { color: var(--ink-soft); font-size: 12.5px; margin: 0; }

  .fieldRow {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 4px;
  }
  .field { flex: 1; min-width: 200px; }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }
  .field .req { color: var(--shu); font-weight: 700; font-size: 10.5px; letter-spacing: 0; text-transform: none; }

  input, select {
    width: 100%;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input.is-invalid { border-color: var(--shu); background: #FBECEA; }

  .tableScroll { overflow-x: auto; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 3px; }
  table { width: 100%; border-collapse: collapse; min-width: 1280px; }
  th, td {
    border-bottom: 1px solid var(--line);
    padding: 7px 6px;
    text-align: center;
    font-size: 12.5px;
  }
  thead th {
    background: var(--charcoal);
    color: #FFFFFF;
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  thead th .muted { color: rgba(255, 255, 255, 0.55); }
  tbody tr:hover td { background: var(--accent-soft); }
  td input, td select { padding: 6px; font-size: 12.5px; text-align: center; }
  .colNo { width: 28px; }
  .colWide { min-width: 140px; }
  .colRegDate { min-width: 110px; }
  .colDel { width: 32px; }
  .colRegDate.is-hidden, td.cell-regdate.is-hidden { display: none; }

  .btnRemoveRow {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .btnRemoveRow:hover { color: var(--shu); }

  .btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 11px 18px;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn--ghost {
    background: var(--surface);
    border-color: var(--charcoal);
    color: var(--charcoal);
  }
  .btn--ghost:hover { background: var(--charcoal); color: #FFFFFF; }
  .btn--primary {
    background: var(--charcoal);
    color: #FFFFFF;
    width: 100%;
    padding: 16px 20px;
    font-size: 14.5px;
    border-radius: var(--radius);
    border-bottom: 3px solid var(--accent);
  }
  .btn--primary:hover { background: var(--charcoal-soft); }
  .btn--primary:disabled { background: #9AA1AC; border-bottom-color: transparent; cursor: not-allowed; }

  .submitBar { margin-top: 8px; }
  .result {
    margin-top: 14px;
    font-size: 13.5px;
    text-align: center;
  }
  .result.-pending { color: var(--accent); }
  .result.-success { color: #157A4A; }
  .result.-error { color: var(--shu); white-space: pre-line; }
  .result a { color: var(--accent); }

  @media (max-width: 700px) {
    .masthead__inner { padding: 32px 16px 24px; }
    .page { padding: 24px 16px 60px; }
    .card { padding: 18px; }
  }
</style>
