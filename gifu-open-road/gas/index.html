<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>GIFU OPEN ROAD 3D</title>
<style>* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1720; color: #fff; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
#app, #gl, #hud { position: fixed; inset: 0; }
#gl { width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; z-index: 2; }
#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f1720; z-index: 50; gap: 14px; }
#loading p { margin: 0; opacity: 0.85; }
.spinner { width: 42px; height: 42px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #ffd34a; border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#rotate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,16,24,0.96); z-index: 60; font-size: 18px; }
#rotate div { font-size: 54px; }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 40; }

#menus { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 30; background: rgba(5,10,18,0.55); }
.panel { background: rgba(18,26,38,0.96); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.panel.wide { width: min(760px, calc(100vw - 32px)); }
.panel.mapwrap { width: auto; max-width: calc(100vw - 16px); }
.panel.title { width: min(560px, calc(100vw - 32px)); background: linear-gradient(160deg, rgba(20,30,46,0.97), rgba(40,24,18,0.95)); }
.ptitle { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-weight: bold; font-size: 17px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.pbody { padding: 14px 16px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.x { background: none; border: 0; color: #fff; font-size: 24px; cursor: pointer; padding: 0 6px; }
.btn { display: inline-block; background: #2b3a50; color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 9px; padding: 10px 14px; margin: 4px 4px 4px 0; font-size: 15px; cursor: pointer; font-family: inherit; }
.btn:hover { background: #36506e; }
.btn.primary { background: #c7902a; border-color: #e8b04a; color: #111; font-weight: bold; }
.btn.danger { background: #a8352a; }
.col { display: flex; flex-direction: column; }
.col .btn { width: 100%; text-align: left; }
.row { display: flex; flex-wrap: wrap; gap: 4px; }
.lead { line-height: 1.7; opacity: 0.92; }
.note { font-size: 12.5px; opacity: 0.7; line-height: 1.6; }
.empty { padding: 10px; opacity: 0.5; }
.logo { font-weight: 900; font-size: 46px; letter-spacing: 2px; line-height: 1; color: #ffd34a; text-shadow: 0 3px 0 #7a4a10; margin: 4px 0 10px; }
.logo span { display: block; font-size: 28px; color: #fff; letter-spacing: 6px; text-shadow: 0 2px 0 #333; }
.logo small { font-size: 20px; color: #7ad0ff; }
.item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); flex-wrap: wrap; }
.item span { flex: 1; min-width: 120px; }
.item small { opacity: 0.6; font-size: 12px; }
.item em { opacity: 0.6; font-style: normal; font-size: 13px; }
.item .btn { padding: 6px 10px; font-size: 13px; }
h4 { margin: 14px 0 4px; color: #ffd34a; font-size: 14px; }
.money { font-weight: bold; color: #9dffa0; margin-bottom: 6px; }
.money.big { font-size: 20px; line-height: 1.6; }
.sw { display: inline-block; flex: 0 0 22px !important; min-width: 22px !important; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); }
.sw.big { flex: 0 0 44px !important; min-width: 44px !important; width: 44px; height: 44px; margin: 4px; cursor: pointer; padding: 0; }
.swatches { display: flex; flex-wrap: wrap; }
.settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.settings select, .settings input { background: #24324a; color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 5px; font-family: inherit; max-width: 60%; }
.keys td { padding: 3px 8px 3px 0; font-size: 13px; }
.key { background: #24324a; color: #fff; border: 1px solid #456; border-radius: 5px; min-width: 70px; padding: 4px; cursor: pointer; }
.help table td { vertical-align: top; padding: 4px 8px 4px 0; font-size: 13.5px; line-height: 1.6; }
.help td:first-child { white-space: nowrap; color: #ffd34a; }
.rank { width: 100%; border-collapse: collapse; font-size: 14px; }
.rank td, .rank th { padding: 5px; border-bottom: 1px solid rgba(255,255,255,0.08); text-align: left; }
.phone-panel { width: min(360px, calc(100vw - 32px)); }
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.app { background: #24324a; border: 0; border-radius: 14px; color: #fff; padding: 12px 4px; font-size: 12.5px; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.app span { font-size: 24px; }
.feed .post { border-bottom: 1px solid rgba(255,255,255,0.08); padding: 8px 0; }
.feed .post p { margin: 4px 0; }
.scan h3 { margin: 4px 0; color: #ffd34a; }
.warn { color: #ff8a6a; }
canvas.fullmap { display: block; border-radius: 8px; cursor: crosshair; max-width: 100%; }

#wheel { position: fixed; left: 50%; top: 50%; width: 380px; height: 380px; transform: translate(-50%, -50%); display: none; z-index: 25; pointer-events: auto; }
#wheel .wcenter { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px; border-radius: 50%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; }
#wheel .wslot { position: absolute; transform: translate(-50%, -50%); width: 96px; padding: 6px 4px; border-radius: 10px; background: rgba(10,16,26,0.82); border: 2px solid rgba(255,255,255,0.15); font-size: 12px; text-align: center; display: flex; flex-direction: column; }
#wheel .wslot b { color: #ffd34a; font-size: 10px; }
#wheel .wslot small { opacity: 0.7; }
#wheel .wslot.sel { border-color: #ffd34a; background: rgba(60,46,10,0.9); }

#touch { position: fixed; inset: 0; z-index: 5; display: none; }
#touch .stick { position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.08); display: none; pointer-events: none; }
#touch .knob { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.45); }
.tbtn { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: rgba(20,28,40,0.55); border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; text-align: center; line-height: 1.1; }
.tbtn.down, .tbtn.on { background: rgba(255,211,74,0.55); color: #111; }
.tbtn.dim { opacity: 0.3; }
.tbtn.big { width: 82px; height: 82px; font-size: 15px; }
.tbtn.small { width: 44px; height: 44px; font-size: 16px; }
.tbtn[data-id="attack"] { right: calc(16px + env(safe-area-inset-right)); bottom: 28px; }
.tbtn[data-id="aim"] { right: calc(110px + env(safe-area-inset-right)); bottom: 22px; }
.tbtn[data-id="jump"] { right: calc(28px + env(safe-area-inset-right)); bottom: 124px; }
.tbtn[data-id="enter"] { right: calc(110px + env(safe-area-inset-right)); bottom: 100px; }
.tbtn[data-id="interact"] { right: calc(188px + env(safe-area-inset-right)); bottom: 36px; }
.tbtn[data-id="weapon"] { right: calc(16px + env(safe-area-inset-right)); bottom: 204px; width: 86px; border-radius: 12px; height: 44px; font-size: 11px; }
.tbtn[data-id="phone"] { right: calc(180px + env(safe-area-inset-right)); top: 14px; }
.tbtn[data-id="pause"] { right: calc(232px + env(safe-area-inset-right)); top: 14px; }
.tbtn[data-id="cam"] { right: calc(284px + env(safe-area-inset-right)); top: 14px; font-size: 11px; }
</style>
