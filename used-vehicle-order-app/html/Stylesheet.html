     （ヘッダー・ボタン）にどう反映されるかは選択後でないとわからなかった。
     ヘッダー帯（上段、primaryDark）＋ボタン（下段中央、primary）を模した
     ミニプレビューにすることで、選ぶ時点で仕上がりが伝わるようにする
     （現場からの要望）。 */
  .themePreset__preview {
    width: 48px;
    height: 36px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--outline);
    display: flex;
    flex-direction: column;
  }
  .themePreset__previewBar { height: 11px; flex: none; }
  .themePreset__previewBody {
    flex: 1;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .themePreset__previewBtn { width: 24px; height: 8px; border-radius: 3px; }
  .themePreset.is-selected .themePreset__preview {
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--swatch);
  }
  /* 不具合修正: 名称（「ブリリアントブルー」等）は文字数が項目ごとに異なり、
     幅が狭いスマホでは単語の途中で強制的に2行に折り返される項目とされない
     項目が混在し、グリッドの高さが項目ごとにガタついて見えていた。
     折り返し方自体は変えず、2行ぶんのmin-heightを確保して縦位置を中央に
     揃えることで、1行で収まる項目も2行に折り返す項目も見た目の高さを揃える。 */
  .themePreset__name {
    text-align: center; line-height: 1.3; min-height: 2.6em;
    display: flex; align-items: center; justify-content: center;
  }
  @media (max-width: 480px) {
    .themePresetGrid { grid-template-columns: repeat(3, 1fr); }
    .themePreset__name { font-size: 11px; }
  }

  /* ===== ロゴ設定 ===== */
  .logoPreview {
    width: 72px; height: 72px; flex: none;
    border: 1px solid var(--outline); border-radius: 8px;
    background: var(--background);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .logoPreview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .logoPreview__placeholder { font-size: 11px; color: var(--on-surface-variant); text-align: center; }

  /* ===== ローディング画像設定のプレビュー =====
     ロゴ（.logoPreview、72×72の小さな正方形）と異なり、ローディング画像は
     全画面表示になり得る画像のため、プレビューも横長・大きめにして
     見え方を確認しやすくする。 */
  #settingsLoadingImagePreview { width: 100%; max-width: 320px; height: 160px; }

  /* ===== 設定タブの各種リスト共通: ドラッグハンドル（担当者・モデル写真・
     メール通知先で共通利用。JavaScript.htmlのmakeReorderable_参照） ===== */
  .dragHandle {
    flex: none;
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 32px;
    color: var(--on-surface-variant);
    font-size: 15px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    border-radius: 4px;
  }
  .dragHandle:hover { background: var(--background); color: var(--on-surface); }
  .dragHandle:active { cursor: grabbing; }
  [data-drag-index].is-dragging { opacity: .4; }
  [data-drag-index].is-drag-over {
    outline: 2px dashed var(--primary);
    outline-offset: 2px;
    border-radius: 8px;
  }

  /* ===== 担当者マスタ（折りたたみ式） =====
     人数が多いと3項目（名前・メールアドレス・拠点名）の入力欄が常に全部
     開いた状態になり縦に長くなりすぎるため、各行を折りたたみ式にしている。
     普段はstaffList__header（要約1行）だけが見え、タップするとstaffList__body
     （実際の入力欄）が開く（JavaScript.htmlのrenderStaffList参照）。 */
  .staffList { display: flex; flex-direction: column; gap: 6px; }
  .staffList__item { border: 1px solid var(--outline); border-radius: 8px; overflow: hidden; }
  .staffList__item.is-expanded { border-color: var(--primary); }
  .staffList__header { display: flex; align-items: center; gap: 4px; padding: 2px 4px; }
  .staffList__summary {
    flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px;
    background: none; border: none; padding: 8px 6px; text-align: left;
    font: inherit; color: inherit; cursor: pointer; border-radius: 6px;
  }
  .staffList__summary:hover { background: var(--background); }
  .staffList__summaryText { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .staffList__summaryName, .staffList__summarySub {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
  .staffList__summaryName { font-size: 13.5px; font-weight: 600; }
  .staffList__summarySub { font-size: 12px; color: var(--on-surface-variant); }
  .staffList__chevron { flex: none; font-size: 12px; color: var(--on-surface-variant); }
  .staffList__body { display: flex; gap: 8px; padding: 0 8px 10px; flex-wrap: wrap; }
  .staffList__body .input[data-staff-field="name"] { flex: 0 0 22%; min-width: 80px; }
  .staffList__body .input[data-staff-field="email"] { flex: 1 1 40%; min-width: 0; }
  .staffList__body .input[data-staff-field="location"] { flex: 0 0 22%; min-width: 90px; }
  .staffList__empty { font-size: 13px; color: var(--on-surface-variant); }

  /* 車両画像リスト（#modelPhotoList）も担当者マスタと同じ.staffList/.staffList__body
     を再利用する。フィールド数が多いため、写真URLを最も広く取り、残りを均等割りにする。 */
  .staffList__body .input[data-photo-field="photoUrl"] { flex: 1 1 45%; min-width: 160px; }
  .staffList__body .input[data-photo-field="model"] { flex: 0 0 16%; min-width: 90px; }
  .staffList__body .input[data-photo-field="gradePrefix"] { flex: 0 0 12%; min-width: 70px; }
  .staffList__body .input[data-photo-field="gradeMarker"] { flex: 0 0 12%; min-width: 70px; }
  .staffList__body select[data-photo-field="bodyType"] { flex: 0 0 16%; min-width: 110px; }

  /* ===== メール通知先（Hold時／受注確定時／システムエラー通知） =====
     以前は「,区切りの1テキスト欄」だったが、担当者マスタと統一した
     「1行1件・追加/削除/ドラッグ並び替え」のリスト形式に変更した。 */
  .mailList { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .mailList__row { display: flex; gap: 8px; align-items: center; }
  .mailList__row .input { flex: 1 1 auto; min-width: 0; }
  .mailList__empty { font-size: 13px; color: var(--on-surface-variant); margin-bottom: 4px; }

  /* ===== 左レールの表示切替 =====
     アイコンのみの左レール（.rail、基本スタイルはファイル冒頭のレイアウト
     セクション参照）はPCビュー（901px以上）でのみ表示する。901px未満は
     .tabbar（画面下固定のアイコン＋ラベルのタブバー）に切り替える
     （下の@media(max-width: 900px)ブロック参照）。 */
  @media (min-width: 901px) {
    .rail { display: flex; }
  }

  /* ===== リード番号入力（「L-」固定接頭辞＋数字。Google×Tesla風の見出し扱いにする） ===== */
  .leadNumberField {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--outline);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .leadNumberField:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg); }
  .leadNumberField__prefix {
    display: flex;
    align-items: center;
    padding: 0 14px;
    background: var(--primary-bg);
    color: var(--primary-text);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .03em;
    border-right: 1px solid var(--outline);
  }
  .leadNumberField__input { border: none; border-radius: 0; flex: 1; min-width: 0; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .leadNumberField .leadNumberField__input:focus { outline: none; }

  /* ===== 担当者表示（ログイン中のアカウントから自動判定・読み取り専用） ===== */
  .staffDisplay {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--background);
    font-size: 14px;
  }
  .staffDisplay__email { font-size: 12px; color: var(--on-surface-variant); }
  .staffDisplay__warn { font-size: 13px; color: var(--danger); }

  /* ===== モーダル =====
     不具合修正（スマホでHold登録・受注確定の入力中に項目がキーボードの裏に
     隠れる問題）: 最初、.modal自身のtop・heightをvisualViewportの実測値に
     ダイレクトに書き換える方式を試したが、iOS Safariではposition: fixed要素の
     位置・高さをJSから動的に書き換えると、キーボード開閉のタイミングによって
     レイアウトが崩れて表示されてしまう（ステップ見出しや他の入力欄が消え、
     ボタンの下に不自然な空白ができる）不具合があった。
     そこで、.modal自身のtop/left/right/bottom（inset: 0）はそのままレイアウト
     ビューポート基準で固定し、代わりに下方向のpaddingにキーボードの高さぶんを
     動的に足す方式に変えた。スマホ幅ではモーダルを画面下端に固定したボトム
     シートにしている（下の@media (max-width: 600px)参照。align-items:
     flex-end）ため、.modal自身の下端パディングが広がるとパネルの下端はその
     パディングの上、つまりキーボードのすぐ上に押し上げられる。.modal自体の
     位置・高さの計算方法は変えないため、position: fixedのレイアウトが崩れる
     心配がない。 */
  .modal {
    position: fixed; inset: 0; background: rgba(32, 33, 36, .5);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    padding: 16px 16px calc(16px + var(--app-keyboard-inset, 0px));
    /* 開閉が一切アニメーションせず一瞬でポップ／消失していたのを、背景の
       フェード＋パネルのフェード＆わずかな拡大・縮小に差し替える（自然な出現・
       消失に見せるため）。閉じる際はJS（openModal/closeModal）が.is-closingを
       付けてからdisplay: noneのタイミングを遅らせることで、消えるアニメーションも
       再生されるようにしている。 */
    animation: modalOverlayIn .18s var(--ease-out);
  }
  .modal.is-closing { animation: modalOverlayOut .16s var(--ease) forwards; }
  .modal .modal__panel { animation: modalPanelIn .24s var(--ease-out); }
  .modal.is-closing .modal__panel { animation: modalPanelOut .16s var(--ease) forwards; }
  @keyframes modalOverlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalOverlayOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes modalPanelIn {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes modalPanelOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(8px) scale(.98); }
  }
  /* ヘッダー・ステップ進捗・フッターは固定し、modal__bodyだけをスクロール
     させる（display: flex; flex-direction: columnで、modal__bodyのみ
     flex: 1 1 auto; overflow-y: autoにする）。以前はmodal__panel自体を
     スクロールさせていたため、内容が長いモーダルではタイトルや「Hold登録」
     等の見出しごとスクロールして見えなくなっていた。 */
  .modal__panel {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-elevated);
    width: 100%; max-width: 460px;
    /* キーボード表示中はその高さぶんも差し引く（.modalの下方向パディングと
       あわせて、パネルがキーボードの裏まではみ出さないようにする）。 */
    max-height: calc(90vh - var(--app-keyboard-inset, 0px));
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal__panel--wide { max-width: 640px; }
  .modal__header { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--outline); }
  .modal__header h2 { font-size: 17px; font-weight: 500; margin: 0; display: flex; align-items: center; }

  /* Hold登録はオレンジ、受注確定はブルーで、操作の種類が一目で
     分かるようにする（Hold中バッジ＝オレンジ、受注確定ボタン＝ブルー、と既存の
     配色ルールに合わせている）。 */
  .modal__panel--hold { border-top: 4px solid var(--warning); }
  .modal__panel--hold .modal__header { background: var(--warning-bg); }
  .modal__panel--hold .modal__header h2::before { background: var(--warning); }
  .modal__panel--hold #btnActionSubmit { background: var(--warning); border-color: var(--warning); }
  .modal__panel--hold #btnActionSubmit:hover { background: #c98423; border-color: #c98423; }

  .modal__panel--order { border-top: 4px solid var(--primary); }
  .modal__panel--order .modal__header { background: var(--primary-bg); }
  .modal__panel--order .modal__header h2::before { background: var(--primary); }

  .modal__panel--hold .modal__header h2::before,
  .modal__panel--order .modal__header h2::before {
    content: '';
    width: 9px;
    height: 9px;
    border-radius: 2px;
    margin-right: 9px;
    flex: none;
  }
  .modal__body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }

  /* ===== 車両情報ポップアップ（#inventoryDetailModal）のPC・タブレット幅レイアウト =====
     スマホ幅（900px以下）は他のモーダルと同じ縦長パネル（max-width: 460px）の
     ままで、.card（display: flex; flex-direction: column）の中の3つの
     card__detailColが単純に縦積みされる（以前の見た目のまま）。
     PC・タブレット幅では、画面全体よりひと回り小さい横長の長方形にし、
     3つのcard__detailColをCSS Gridの列として横に並べる（現場からの要望
     「車両情報のポップアップは縦長ではなく横長で見やすく」）。各カラムは
     必要な場合のみ内部スクロールし、ポップアップ全体（.modal__body）は
     スクロールさせない（.card自体の高さをモーダルの高さいっぱいに固定する
     ため）。 */
  @media (min-width: 901px) {
    .modal__panel--vehicle {
      max-width: min(90vw, 1160px);
      width: 100%;
      height: min(82vh, 700px);
    }
    .modal__panel--vehicle .modal__body { overflow: hidden; }
    /* 不具合修正: 「空欄（余白）が多い」という現場からの指摘を受け、3カラムとも
       内側の余白・行間・文字サイズを広げてスペースをきちんと使う密度に調整した
       （下のcard__metaGrid・card__detailCol関連の上書きを参照）。Hold状況列
       （--hold）は内容が短い割に一番狭い配分だったため、他の2列と同程度の
       幅まで広げている（顧客名等が省略されず1行で収まりやすくするため）。 */
    .modal__panel--vehicle .card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr) minmax(0, .95fr);
      gap: 0;
      height: 100%;
      overflow: hidden;
    }
    .modal__panel--vehicle .card__detailCol { overflow-y: auto; padding: 0 26px; gap: 18px; }
    .modal__panel--vehicle .card__detailCol--overview { padding-left: 0; border-right: 1px solid var(--outline); }
    .modal__panel--vehicle .card__detailCol--spec { border-right: 1px solid var(--outline); }
    .modal__panel--vehicle .card__detailCol--hold { padding-right: 0; display: flex; flex-direction: column; }
    /* Hold未登録時のプレースホルダーは、以前は上寄せで下に大きな空白が残って
       いた。flex: 1で列の残り高さいっぱいまで広げ、既存のalign-items/
       justify-content: centerと合わせて列の中央に来るようにする（現場からの
       要望「Hold情報もスペースに空きがあるので見やすいように」）。 */
    .modal__panel--vehicle .card__holdArea--empty { flex: 1; }
    .modal__panel--vehicle .card__metaGrid { gap: 16px 20px; }
    .modal__panel--vehicle .card__metaGrid dt { font-size: 11px; }
    .modal__panel--vehicle .card__metaGrid dd { font-size: 15.5px; }
    .modal__panel--vehicle .card__model { font-size: 23px; }
    .modal__panel--vehicle .card__holdInfo { font-size: 14.5px; padding: 14px 16px; }
    /* 不具合修正: 顧客名・担当者名・拠点名は、狭い一覧カード
       （.card__holdArea、高さ150px固定）向けにnowrap＋省略記号にしていたが、
       この横長ポップアップのHold列は幅に余裕があるため、省略せず全文表示する
       （現場からの要望「HOLD情報は折り返しをせず見やすく」）。card__detailColに
       overflow-y: autoを指定している都合上、nowrapのままoverflow: visibleに
       しても水平方向は自動的にauto（＝右にはみ出た分が見えないままスクロール
       扱いになる不具合）になってしまうため、white-space: normalに変更して
       折り返しの可否自体をブラウザに委ねる。名前の文字数が列幅に収まる
       通常のケースでは、そもそも折り返しが起きる幅ではないため実質1行のまま
       表示され、極端に長い場合のみ折り返す（見えなくなるよりは折り返して
       全文読めるほうを優先）。 */
    .modal__panel--vehicle .card__holdInfo__row { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: break-word; }
  }

  /* 予約（Hold/受注）入力モーダルは2列グリッドにして、デスクトップでは
     スクロールなしで全項目を入力できるようにする。 */
  .modal__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 20px; }
  .formField--span2 { grid-column: 1 / -1; }

  /* ===== 予約モーダルのステップ進捗（顧客情報→契約内容の2ステップ）=====
     スマホでの入力ミスを減らすため、8項目を一度に出さず2ステップに分ける。
     担当者はログインアカウントから自動判定済みのため、ステップが増えても
     入力の手間自体は増えない。 */
  .modal__stepBar { flex: none; padding: 12px 20px 0; }
  .modal__stepBar__track { height: 4px; border-radius: 3px; background: var(--outline); overflow: hidden; }
  .modal__stepBar__fill { height: 100%; width: 50%; background: var(--primary); border-radius: 3px; transition: width .2s var(--ease); }
  .modal__panel--hold .modal__stepBar__fill { background: var(--warning); }
  .modal__stepBar__label { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); }
  .modal__footer { flex: none; display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--outline); }
  .modal__error { color: var(--danger); font-size: 13px; }
  .modal__desc { margin: 0; font-size: 13px; color: var(--on-surface-variant); line-height: 1.6; }
  .modal__requiredNote { margin: 0 0 4px; font-size: 12px; color: var(--on-surface-variant); }
  .req { color: var(--danger); margin-left: 2px; }
  .modal__hint { margin: 10px 0 0; font-size: 12.5px; color: var(--on-surface-variant); line-height: 1.6; }

  /* ===== Hold種別選択（管理者権限を持つ担当者が「Hold」タップ時のみ表示）=====
     通常のHold／業販HOLDの2択。業販HOLDは専用の
     特別色（--hold-special）でボタンの左罫線を色分けし、選ぶ前から見分けやすくする。 */
  .actionTypePick__intro { margin: 0 0 14px; font-size: 13.5px; color: var(--on-surface-variant); }
  .actionTypePick { display: flex; flex-direction: column; gap: 10px; }
  .actionTypePick__btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    border: 1px solid var(--outline);
    border-left: 4px solid var(--warning);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: box-shadow .15s var(--ease), transform .15s var(--ease);
  }
  .actionTypePick__btn:hover { box-shadow: var(--shadow-elevated); transform: translateY(-1px); }
  .actionTypePick__btn--wholesale { border-left-color: var(--hold-special); }
  .actionTypePick__btnTitle { font-size: 15px; font-weight: 700; }
  .actionTypePick__btnDesc { font-size: 12.5px; color: var(--on-surface-variant); }

  /* ===== トースト ===== */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    /* ネイビーサブ（比較バーのメインネイビーより少し明るく、奥行きを付ける）。 */
    background: #243b53; border: 1px solid rgba(255, 255, 255, .14); color: #fff; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; box-shadow: var(--shadow-elevated); z-index: 200;
    /* 表示・非表示が一瞬で切り替わっていたのを、下からわずかに浮かび上がる／
       沈んで消えるフェードに差し替える（JS側showToastが表示時はクラスの
       再設定でこのanimationを再生させ、消える際は.is-closingを付けてから
       hiddenを付与するタイミングを遅らせる）。 */
    animation: toastIn .2s var(--ease-out);
  }
  .toast.is-closing { animation: toastOut .16s var(--ease) forwards; }
  .toast--error { background: var(--danger); }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateX(-50%) translateY(0); }
    to { opacity: 0; transform: translateX(-50%) translateY(10px); }
  }

  /* ===== 受注確定時の紙吹雪演出（文字・カードなし。紙吹雪のみ盛大に降らせる） ===== */
  .confettiLayer { position: fixed; inset: 0; z-index: 310; overflow: hidden; pointer-events: none; }
  /* 受注確定の瞬間だけ、ごく短時間だけ画面中央を明るく光らせる「フラッシュ」を
     重ねる（文字・カードは出さない方針は維持し、あくまで光の演出のみ）。 */
  .confettiLayer::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 60%);
    opacity: 0;
    transition: opacity .5s var(--ease);
  }
  .confettiLayer.is-flashing::before { opacity: 1; }
  .confettiPiece {
    position: absolute;
    top: -24px;
    opacity: .95;
    will-change: transform;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--drift, 0), 112vh) rotate(var(--rot, 720deg)); opacity: .85; }
  }

  /* ===== Hold登録・受注確定 完了時の演出 =====
     showCelebration_（JavaScript.html）が、固定の案内メッセージ（.celebrationBanner）と
     アクションごとに専用のド派手な演出（.celebrationLayerにCSSで描いた図形
     パーツ・発光エフェクトを生成）を組み合わせて表示する。絵文字はフォント・
     OSによって見た目が大きく異なる（機種依存文字の再現性が低い）ため使わず、
     色付きの図形（丸・四角・リボン・星）と発光・拡大・回転などのCSS
     アニメーションのみで演出する（GAS/HTML Serviceのみで完結する）。 */
  .celebrationLayer { position: fixed; inset: 0; z-index: 311; overflow: hidden; pointer-events: none; }
  .celebParticle {
    position: absolute;
    bottom: -60px;
    will-change: transform, opacity;
  }
  .celebParticle--circle { border-radius: 50%; }
  .celebParticle--square { border-radius: 3px; }
  .celebParticle--ribbon {
    border-radius: 2px;
    clip-path: polygon(0 0, 100% 0, 100% 68%, 50% 100%, 0 68%);
  }
  .celebParticle--star {
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .celebParticle--rise { animation: celebRise linear forwards; }
  .celebParticle--fall { top: -60px; bottom: auto; animation: celebFall linear forwards; }
  .celebParticle--burst {
    left: 50%;
    top: 50%;
    bottom: auto;
    animation: celebBurst .9s cubic-bezier(.2, .8, .3, 1) forwards;
  }
  @keyframes celebRise {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translate(var(--drift, 0), -112vh) rotate(var(--rot, 0deg)); opacity: .9; }
  }
  @keyframes celebFall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translate(var(--drift, 0), 112vh) rotate(var(--rot, 0deg)); opacity: .9; }
  }
  @keyframes celebBurst {
    0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx, 0)), calc(-50% + var(--ty, 0))) scale(1); opacity: 0; }
  }
  /* Hold登録の演出: 画面中央を一瞬だけ明るく光らせる「閃光」（打ち上げ花火の
     起点のイメージ）。 */
  .celebFlash {
    position: fixed;
    inset: 0;
    z-index: 313;
    pointer-events: none;
    background: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .95), rgba(255, 199, 60, .55) 45%, rgba(255, 199, 60, 0) 72%);
    opacity: 0;
    animation: celebFlashPulse .6s ease-out forwards;
  }
  @keyframes celebFlashPulse {
    0% { opacity: 0; }
    18% { opacity: 1; }
    100% { opacity: 0; }
  }
  /* Hold登録の演出: 画面中央から発光しながら拡大して消えるリング（衝撃波）。
     打ち上げ花火が開いた瞬間のような「ドン」という手応えを付ける。 */
