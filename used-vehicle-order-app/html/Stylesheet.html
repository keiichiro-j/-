<style>
  /* ===== カラーパレット：コーポレートネイビー =====
     指定されたカラーパレット（メインネイビー#102A43／ダークネイビー#0B1F33／
     ネイビーサブ#243B53／ブランドブルー#2F6FAE／ライトブルー#DCEAF7／ページ背景
     #F4F7FA／カード#FFFFFF／ボーダー#D8E1E8／メイン文字#1F2933／サブ文字#6B7785）
     に基づく配色（旧「ウォームアイボリー」から変更）。--primary / --on-surface は
     テーマ設定（設定タブ）でユーザーが上書きできるため、実際の値はJS
     （applyTheme、JavaScript.html参照）が document.documentElement.style.setProperty
     で書き換える。ここでの値は未設定時の初期表示・THEME_PRESETSのDEFAULT_THEME_KEY
     （Constants.gs、'steel'プリセットをこのパレットのブランドブルーに合わせている）
     と揃えてある。
     --success / --warning / --danger、8種のテーマプリセットの primaryText
     （Constants.gs）は、白背景に対してWCAG AA（コントラスト比4.5:1以上）を
     確保できる明度まで暗く調整し直している（旧配色は暗い背景向けに明るく
     調整されていたため、そのままでは白背景で読みにくくなるため）。各色の
     背景ウォッシュ（--success-bg 等）は元の明るい色調のまま、文字色
     （--success 等）だけを暗くすることで、淡い背景色＋読みやすい濃い文字の
     組み合わせにしている。 */
  :root {
    /* --primary はボタン塗り・境界線・アクセント用（白文字とのコントラスト比
       ≒5.2:1を確保できる明度に調整済み）。リンクやアイコンなど、背景の上に
       「文字として」使う場合は --primary-text（白背景とのコントラスト比≒5.2:1）
       を使うこと（purpose別に分けている理由はJavaScript.htmlのapplyTheme参照）。
       --primary-dark（ホバー時等）はメインネイビー#102A43をそのまま使う。 */
    --primary: #2f6fae;
    --primary-dark: #102a43;
    --primary-text: #2f6fae;
    --on-primary: #ffffff;
    --surface: #ffffff;
    --background: #f4f7fa;
    --on-surface: #1f2933;
    --on-surface-variant: #6b7785;
    --outline: #d8e1e8;
    --success: #188649;
    --success-bg: rgba(61, 220, 132, .16);
    --warning: #a5670b;
    --warning-bg: rgba(242, 169, 60, .16);
    --danger: #ec0000;
    --danger-bg: rgba(255, 107, 107, .16);
    --primary-bg: #dceaf7;
    /* 管理者権限を持つ担当者のみ登録できる業販HOLD専用の特別色。
       通常のHold（--warning・アンバー）とは重ならない紫系にし、テーマ設定
       （着せ替え）の影響を受けない固定色にする（業販HOLDである、という
       見分けやすさを最優先するため）。 */
    --hold-special: #6d28d9;
    --hold-special-bg: rgba(124, 58, 237, .14);
    /* 中古車サイトに掲載中（カーセンサー・グーネットのいずれか）の車両を、
       在庫あり／Hold中等のステータス色（border-left-color）とは独立して
       ひと目で区別するための背景色（is-listed、Stylesheet.html内の
       .card.is-listedルール参照。詳細モーダル専用）。ステータス色（成功の
       緑・警告のアンバー・業販HOLDの紫）と重ならないティール系にする。 */
    --listed-bg: rgba(20, 184, 166, .14);
    --shadow: 0 1px 2px rgba(16, 31, 51, .10);
    --shadow-elevated: 0 16px 40px rgba(16, 31, 51, .16);
    /* 公式サイトはカードの角丸をあまり強調しないフラットな見た目のため、
       従来の14pxより控えめな角丸にして「エンジニアリングされた精密さ」を出す。 */
    --radius: 8px;
    /* 起動時ローディング画面（.appLoading）専用の背景色。テーマ設定（表示設定）で
       選んだテーマのprimaryDarkに、JS実行後applyTheme（JavaScript.html参照）が
       都度合わせる。ここでの値はJS実行前（テーマ切替前）の初期表示専用で、
       以前はDEFAULT_THEME_KEY「steel」のprimaryDark（ネイビー#102a43）に揃えて
       いたが、選んだテーマに関わらず起動直後の一瞬は常に黒で統一してほしいという
       要望を受け、黒に固定した（JS実行後、選んだテーマの色に上書きされる一瞬までの
       表示専用のため、この値自体はテーマ設定の影響を受けない）。 */
    --loading-bg: #000000;
    /* コントロールパネル（.topbar、ブランド行＋水平タブの2段）の高さ。中身に
       応じて変わらない固定値にしておくことで、.commandbar側のposition: sticky
       （top: var(--topbar-h)）をJSでの実測無しに正しく重ねられる（以前の
       position: fixed＋JS実測スペーサー方式は使わない。Stylesheet.html内の
       .topbar・.commandbar参照）。901px以上はボタン・ロゴを一回り大きくする分、
       高さも合わせて変える。 */
    --topbar-h: 106px;
    /* コントロールパネル（.topbar）の背景色。JS実行前（テーマ適用前）の初期値で、
       以前の「コントロールパネル」時代と同じダークネイビー（<meta name="theme-color">とも
       合わせてある）。JS実行後は、選択中のテーマプリセットのprimaryDarkに
       書き換わる（applyTheme、JavaScript.html参照。テーマの効果がヘッダー・
       ホーム画面にも及ぶようにするため。不具合修正: 以前はテーマの影響を
       受けない固定色だった）。 */
    --topbar-bg: #0b1f33;
    --on-topbar: #ffffff;
    --dark-ui-outline: rgba(255, 255, 255, .14);
    /* ソフトウェアキーボードが画面下側を覆っている高さ。JS
       （syncKeyboardInset_）がwindow.visualViewportで実測し、キーボード表示中は
       その高さに更新する（.modal参照。キーボードが無い間は0のまま）。 */
    --app-keyboard-inset: 0px;
    /* UI全体のモーション（ホバー・出現アニメーション等）で共通して使うイージング。
       --easeはCSS標準のease相当の滑らかな加減速だが減速側をやや強めにし、状態変化
       （ホバー時の色・影の変化等）が唐突に止まらず自然に収まるようにする。--ease-outは
       モーダル・トースト等の「出現」アニメーション専用で、勢いよく現れて滑らかに
       収まる、より減速を強調したカーブにする。速度そのもの（duration）は既存のまま
       残し、カーブだけ統一している。 */
    --ease: cubic-bezier(.4, 0, .2, 1);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Barlow', 'Roboto', 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: var(--background);
    color: var(--on-surface);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }
  /* モーダル表示中は背景（在庫リスト・受注リスト等）がスクロールされないようにする
   （openModal/closeModal、JavaScript.html参照）。 */
  body.modal-open { overflow: hidden; }

  /* ===== ミニマルな線画アイコン（Google/Tesla調。絵文字アイコンの代わりに使う） ===== */
  .icon {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
    vertical-align: -5px;
  }
  .icon--inline { width: 14px; height: 14px; vertical-align: -2px; }

  /* ===== レイアウト全体：コントロールパネル（上部）＋コンテンツ =====
     ロゴ・アプリ名・画面切替タブ・担当者情報を1本の帯（.topbar）にまとめた
     「コントロールパネル」に統一する（アイコンのみの左レール・下タブバーは
     廃止。以前ホーム画面があった頃の構成に戻した）。PC・タブレット・スマホ
     すべて同じ1つの帯で、画面切替は水平タブ（.tabs）の横スクロールに対応する。
     position: sticky＋固定の高さ変数（--topbar-h、:root参照）で、以前の
     position: fixed＋JS実測スペーサー方式（syncFixedBars_）は使わない。 */
  #app { display: block; }

  /* ===== コントロールパネル（.topbar） =====
     背景色は選択中のテーマ（表示設定）に連動する（--topbar-bg、:root・
     applyTheme参照）。ブランド行（戻る／更新ボタン・ロゴ＋アプリ名・担当者情報）と、
     その下の水平タブ行の2段構成。 */
  .topbar {
    background: var(--topbar-bg);
    color: var(--on-topbar);
    position: sticky;
    top: 0;
    z-index: 15;
  }
  .topbar__brandRow {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 20px;
  }
  .topbar__left { display: flex; align-items: center; gap: 8px; flex: none; }
  .topbar__navBtn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; padding: 0; flex: none;
    background: transparent; border: 1px solid var(--dark-ui-outline); border-radius: 50%;
    color: var(--on-topbar); cursor: pointer;
  }
  .topbar__navBtn:hover { background: rgba(255, 255, 255, .08); }
  .topbar__navBtn:disabled { opacity: .3; cursor: default; }
  .topbar__navBtn:disabled:hover { background: transparent; }
  .topbar__navBtn--refresh.is-spinning .icon { animation: navRefreshSpin .8s linear infinite; }
  @keyframes navRefreshSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  /* アプリ名表記。左右のボタン・ユーザー情報の幅に関わらず画面中央に来るよう、
     .topbar__brandRow（position: relative）を基準にposition: absoluteで
     中央配置する。 */
  .topbar__brand {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    max-width: calc(100% - 190px);
  }
  .topbar__logo { height: 26px; max-width: 140px; width: auto; object-fit: contain; flex: none; }
  .topbar__markIcon { width: 22px; height: 22px; flex: none; }
  .topbar__brandText {
    font-size: 14px; font-weight: 700; letter-spacing: .08em; color: var(--on-topbar);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .topbar__user {
    flex: none; text-align: right; font-size: 12px; line-height: 1.5; white-space: nowrap;
    max-width: 140px; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar__userName { display: block; font-weight: 600; }
  .topbar__userEmail { display: block; opacity: .75; font-size: 10.5px; }
  .topbar__userWarn { display: block; color: #ffd479; font-size: 11px; }

  /* ===== 画面切替：水平タブ（ブランド行の下、中央寄せの下線タブ） =====
     塗りつぶしのピル型ではなく、テキスト＋アクティブ時の下線のミニマルな
     ナビにする。6項目が並ぶ幅の狭い画面では折り返さず横スクロールする。
     不具合修正: justify-content: centerのままだと、内容が幅からはみ出した際に
     先頭（ホーム）側が画面外に隠れ、スクロールしても戻れないことがあった
     （center揃えのオーバーフローはブラウザにより両端が均等に見切れる）。
     safe centerにすることで、はみ出す場合だけ自動的に先頭揃えにフォールバック
     させ、常に最初のタブから確実にスクロールで辿り着けるようにする。 */
  .tabs {
    display: flex;
    justify-content: safe center;
    gap: 24px;
    padding: 0 20px 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs__item {
    flex: none;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--on-topbar);
    opacity: .62;
    padding: 6px 1px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .06em;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .15s var(--ease), border-color .15s var(--ease);
  }
  .tabs__item:hover { opacity: .85; }
  .tabs__item.is-active { opacity: 1; border-bottom-color: #ffffff; }

  @media (min-width: 901px) {
    /* ブランド行・タブ行のpaddingを広げる分、.commandbar側のsticky offset
       （top: var(--topbar-h)）もこの実測値に合わせて更新する（ズレると
       スクロール時に隙間または重なりが出る）。 */
    :root { --topbar-h: 128px; }
    .topbar__brandRow { padding: 20px 32px; }
    .topbar__navBtn { width: 42px; height: 42px; }
    .topbar__logo { height: 30px; max-width: 160px; }
    .topbar__brandText { font-size: 16px; }
    .topbar__user { font-size: 13px; max-width: 220px; }
    .topbar__userEmail { font-size: 11.5px; }
    .tabs { gap: 32px; padding: 0 32px 14px; }
    .tabs__item { font-size: 13px; }
  }

  /* ===== 起動時ローディング画面 =====
     初回データ取得（reloadAll_）が終わるまでの空白時間を埋める全画面オーバーレイ。
     is-hiddenでフェードアウトしてからpointer-events: noneにする（フェード中も
     クリックを奪わないよう、visibility: hiddenではなくopacityのみで消す）。
     背景色は固定のダークネイビーではなく--loading-bgを使う。これはテーマ
     プリセットのprimaryDarkから計算する値で（applyTheme、JavaScript.html参照）、
     設定タブでテーマ（表示設定）を切り替えると、ローディング画面の背景色も
     連動して変わる（現場からの要望）。JS実行前の初期値は:rootで定義する
     既定テーマ相当の色にしておく。 */
  .appLoading {
    position: fixed;
    inset: 0;
    z-index: 400;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--loading-bg);
    color: #eaf1f8;
    transition: opacity .3s var(--ease), background-color .3s var(--ease);
  }
  .appLoading.is-hidden { opacity: 0; pointer-events: none; }
  /* 管理者が設定タブから登録した画像（任意。#appLoadingImage、
     applyLoadingImage_・JavaScript.html参照）。スピナー・「読み込み中…」の文字は
     表示せず、画像だけを大きめに表示する（現場からの要望）。読み込み（onload）が
     完了するまではopacity: 0のままにしておき、is-visibleが付いたタイミングで
     ゆっくり（1.1秒かけて）フェードインさせる。「うっすら現れる」演出は画像自身の
     フェードインで、「うっすら消える」演出は画面全体（.appLoading.is-hidden）の
     フェードアウトで実現しており、２つの独立したopacity遷移の組み合わせになる。
     画像が未設定の場合はテーマカラーの背景だけになる。 */
  .appLoading__image {
    max-width: min(88vw, 640px);
    max-height: 70vh;
    width: auto;
    height: auto;
    border-radius: 12px;
    opacity: 0;
    transition: opacity 1.1s var(--ease);
  }
  .appLoading__image.is-visible { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .appLoading { transition: none; }
    .appLoading__image { transition: none; }
  }

  /* ===== 在庫データ整合性チェックの警告バナー（アプリ起動時、問題があれば表示） =====
     .topbarの子要素として置く（コントロールパネルの一部）。 */
  .integrityBanner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--warning);
    color: #fff;
    padding: 9px 20px;
    font-size: 13.5px;
    font-weight: 500;
  }
  .integrityBanner__toggle, .integrityBanner__close {
    background: rgba(255, 255, 255, .18);
    border: none;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  .integrityBanner__toggle { padding: 4px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500; flex: none; }
  .integrityBanner__toggle:hover { background: rgba(255, 255, 255, .3); }
  .integrityBanner__close { width: 26px; height: 26px; border-radius: 8px; font-size: 16px; line-height: 1; flex: none; }
  .integrityBanner__close:hover { background: rgba(255, 255, 255, .3); }
  .integrityBanner__list {
    list-style: none;
    margin: 0;
    padding: 10px 20px 12px;
    background: rgba(0, 0, 0, .1);
    color: #fff;
    font-size: 13px;
  }
  .integrityBanner__list li { padding: 3px 0; }

  /* main.viewはコントロールパネルの下に続く各画面。検索・絞り込みサイドバーを
     持つ在庫・受注・業販受注リストは.view--listを併記し、コマンドバー・
     一覧行を画面幅いっぱいに使えるよう左右のパディングを0にする（マイページ・
     設定はカード状のUIのため、通常どおり左右の余白を持たせる）。 */
  main.view { max-width: 1680px; margin: 0 auto; padding: 16px; }
  main.view.view--list { max-width: none; margin: 0; padding: 0; }
  /* 不具合修正: ホーム画面は#view-home自身に固定のsticky commandbarを
     持つが、main.viewの上パディング（16px）ぶん、コマンドバーが本来の
     固定位置（--topbar-hぴったり）より下にずれた位置から始まっていた。
     スクロール開始直後にこの16px分だけ一瞬で追いつくため、ヘッダーが
     画面のスクロールにつられて少し動くように見えていた（現場からの指摘）。
     .view--listと同じくpaddingを0にし、コマンドバーを最初からtopbarの
     直下（--topbar-h）に固定することで、スクロール量に関わらずヘッダーが
     一切動かないようにする（内側の要素はcommandbar・homeGrid自身が
     必要な余白を持っているため、外側のpaddingが無くても見た目は崩れない）。 */
  main.view#view-home { max-width: none; margin: 0; padding: 0; }
  .view { display: none; }
  /* タブ切替時、瞬間的にコンテンツが入れ替わるだけだと素っ気ないため、
     切替後の画面にごく軽いフェードイン（+わずかな上方向スライド）を付ける。
     display: noneからの復帰にtransitionは効かないため、animationを使う
     （animationは要素が描画された瞬間から再生されるため、display: none明けでも
     機能する）。 */
  .view.is-active { display: block; animation: viewFadeIn .24s var(--ease-out); }
  @keyframes viewFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== コマンドバー：検索＋クイック状態タブ =====
     詳細な絞り込み項目は左サイドバー（.filterSidebar）にまとめ、ここには
     自由検索とクイック状態タブだけを置く。コントロールパネル（.topbar）の
     真下にposition: stickyで重ね、スクロール中も検索・状態タブが見えた
     ままにする（--topbar-h、:root参照。JSでの高さ実測は不要）。 */
  .commandbar {
    position: sticky;
    top: var(--topbar-h);
    z-index: 12;
    background: var(--surface);
    border-bottom: 1px solid var(--outline);
    padding: 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .searchrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .searchbox {
    flex: 1 1 320px;
    display: flex;
    align-items: center;
    gap: 9px;
    border: 1px solid var(--outline);
    border-radius: 10px;
    padding: 9px 14px;
    background: var(--surface);
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .searchbox:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg); }
  /* 受注リスト・業販受注リストの絞り込みサイドバーは、自由検索欄を
     .filterSidebar__field（display: flex; flex-direction: column）の中に置く。
     .searchboxのflex: 1 1 320pxはコマンドバー内の横並びレイアウト前提の値
     のため、縦方向のflexコンテナ内ではflex-basis（320px）が高さの基準に
     なってしまい、検索欄が縦に間延びする不具合が起きる。サイドバー内では
     打ち消して自然な高さにする。 */
  .filterSidebar .searchbox { flex: none; width: 100%; }
  .searchbox .icon--inline { flex: none; color: var(--on-surface-variant); }
  .searchbox input {
    border: none; outline: none; background: none; width: 100%;
    font-size: 16px; color: var(--on-surface);
  }
  .searchbox input::placeholder { color: var(--on-surface-variant); }

  /* 検索・状態タブの行は、項目数が多い場合でも折り返さず横スクロールにする
     （スマホ幅でも縦に場所を取らないようにするため。スクロールバー自体は
     視覚的にじゃまなので隠す）。 */
  .scroller {
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .scroller::-webkit-scrollbar { display: none; }

  /* ===== ホーム・在庫リストのクイックナビ（型／ボディタイプ） =====
     ホーム画面の型クイックナビ、在庫リストのボディタイプクイックナビが共通で
     使う見た目。グリッド自体はauto-fillでPC・タブレット・スマホすべて同じ
     CSSのまま列数だけ自然に変わる。 */
  .homeTypeNav__item {
    flex: none;
    background: var(--surface);
    border: 1px solid var(--outline);
    /* 現場からの要望: ピル型（フル丸め）ではなく、わずかな丸みだけを残した
       四角寄りの形にする（アプリ全体の他のボタン・カードと同じ--radiusに揃える）。 */
    border-radius: var(--radius);
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--on-surface-variant);
    cursor: pointer;
    white-space: nowrap;
  }
  .homeTypeNav__item:hover { border-color: var(--primary); color: var(--on-surface); }
  .homeTypeNav__item.is-active { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

  /* お知らせ（#homeAnnouncement）。管理者が設定タブから登録した案内文を、
     ホーム画面の一番上に目立たせて表示する（未設定時は要素ごとhidden）。型
     クイックナビ（.homeTypeNav）と同じ.commandbar（position: sticky）の中に
     置くことで、スクロールしても常に画面上部に固定表示されるようにしている
     （現場からの要望「お知らせも型選択と同様に固定してほしい」）。 */
  .homeAnnouncement {
    background: var(--primary-bg);
    color: var(--primary-text);
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    padding: 8px 16px;
    border-radius: 8px;
  }

  /* 写真を小さくし、PC幅では横一列に4枚並ぶ固定4列グリッドにする（現場からの
     要望）。タブレット・スマホ幅は列数を段階的に減らし、写真は小さくても
     欠けずに見えるようauto-fillで自然に折り返す。 */
  .homeGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
    padding: 4px 24px 24px;
  }
  @media (min-width: 481px) {
    .homeGrid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  }
  @media (min-width: 901px) {
    .homeGrid { grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 16px 24px 24px; }
  }
  .homeCard {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 0;
    transition: box-shadow .18s var(--ease), transform .18s var(--ease);
  }
  .homeCard--clickable { cursor: pointer; }
  .homeCard--clickable:hover { box-shadow: var(--shadow-elevated); transform: translateY(-2px); }
  /* 車両画像枠にも選択中のテーマ（表示設定）を反映する。写真自体（img）は
     object-fit: coverで枠いっぱいに敷き詰められるため、テーマカラーの縁取りを
     枠の内側に描き、写真の外周に「テーマカラーの額縁」が見えるようにする
     （現場からの要望「ホームの車両画像枠にもテーマを反映させてほしい」。
     *{box-sizing:border-box}のため、borderぶんimgが内側に収まる）。 */
  .homeCard__photo { position: relative; aspect-ratio: 4 / 3; background: var(--background); overflow: hidden; border: 3px solid var(--primary); }
  .homeCard__photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .homeCard__photo--clickable { cursor: pointer; }
  .homeCard__stock {
    position: absolute; top: 6px; right: 6px;
    background: var(--success-bg); color: var(--success);
    font-size: 10px; padding: 3px 8px;
  }
  .homeCard__stock.badge--stock--zero { background: rgba(31, 41, 51, .55); color: var(--surface); }
  .homeCard__body { padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
  .homeCard__headRow { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .homeCard__model { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .homeCard__type { flex: none; font-size: 10px; font-weight: 600; color: var(--on-surface-variant); border: 1px solid var(--outline); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
  .homeCard__gradeGrid { display: flex; flex-wrap: wrap; gap: 5px; }
  .homeCard__gradeChip {
    appearance: none; border: 1px solid var(--outline); background: var(--background);
    border-radius: 7px; padding: 4px 7px; display: flex; flex-direction: column; gap: 1px;
    cursor: pointer; font-family: inherit; text-align: left;
  }
  .homeCard__gradeChip:hover { border-color: var(--primary); }
  .homeCard__gradeChip:disabled { opacity: .4; cursor: not-allowed; }
  .homeCard__gradeName { font-size: 10.5px; font-weight: 700; color: var(--on-surface); }
  .homeCard__gradeCount { font-size: 9.5px; color: var(--success); font-weight: 700; }
  .homeCard__gradeCount--zero { color: var(--on-surface-variant); }

  /* 設定タブの車両画像リストのサムネイル（.staffList__summaryをそのまま再利用し、
     要約テキストの前に小さなサムネイルだけ追加する）。 */
  .staffList__summaryThumb {
    flex: none; width: 36px; height: 36px; border-radius: 6px; overflow: hidden;
    background: var(--background); border: 1px solid var(--outline);
  }
  .staffList__summaryThumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ===== 絞り込みサイドバー（在庫リスト・受注リスト・業販受注リスト共通） =====
     タップで開くチップ＋ポップオーバー方式は廃止し、常時表示の左サイドバーに
     戻した（現場の要望）。項目・絞り込みロジック自体は変更していない。
     モバイル幅（下の@media (max-width: 900px)）ではサイドバー・一覧とも
     ページ本文と一緒に普通に縦スクロールする1カラムのシンプルな配置にする。
     PC・タブレット幅（下の@media (min-width: 901px)）では、サイドバーと一覧を
     ヘッダー・コマンドバーの下に固定した「アプリシェル」レイアウトにし、
     サイドバー自体は動かさず、一覧（.listBody__main）側だけが内部スクロールする
     （不具合修正: 以前はposition: sticky＋手計算のtopオフセットでサイドバーを
     浮かせていたが、コマンドバーの実際の高さとオフセットの数値がわずかに
     ズレており、スクロール開始時にサイドバーが少し画面につられて動いて
     見える不具合があった。「絞り込みバナーは固定にしてほしい」という現場からの
     要望を受け、オフセット計算に頼らない構造に変更した）。 */
  .listBody {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 16px;
    padding: 14px 16px 16px;
    min-width: 0;
  }
  .listBody__main { min-width: 0; }
  .filterSidebar {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  /* 見出し（条件検索）・該当台数は左寄せでひとまとまりにし、クリアボタンだけを
     margin-left: autoで右端に離す（現場からの要望「該当台数は見出しの右に」）。 */
  .filterSidebar__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filterSidebar__title { font-size: 14px; font-weight: 700; margin: 0; color: var(--on-surface); }
  .filterSidebar__count {
    font-size: 12px;
    font-weight: 700;
    color: var(--on-surface-variant);
    font-variant-numeric: tabular-nums;
  }
  .filterSidebar__rule { border: none; border-top: 1px solid var(--outline); margin: 0; }
  .filterSidebar__field { display: flex; flex-direction: column; gap: 8px; }
  .filterSidebar__groupLabel {
    font-size: 11px;
    font-weight: 700;
    color: var(--on-surface-variant);
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .filterSidebar select.input,
  .filterSidebar .input { width: 100%; }
  .filterSidebar__clearBtn {
    border: none;
    background: none;
    color: var(--on-surface-variant);
    font-size: 12.5px;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 0;
    flex: none;
    margin-left: auto;
  }
  .filterSidebar__clearBtn:hover { color: var(--on-surface); }

  /* ===== PC・タブレット幅: 在庫・受注・業販受注リストを「アプリシェル」化 =====
     コマンドバーの下（.listBody）を、ヘッダー・コマンドバーの高さぶんを差し引いた
     残り全部の高さを持つ、それ自体はスクロールしないボックスにし、その中の
     サイドバー（.filterSidebar）と一覧（.listBody__main）だけがそれぞれ独立して
     縦スクロールするようにする。不具合修正: 以前はposition: sticky＋手計算の
     topオフセットでサイドバーを浮かせていたが、実際のコマンドバーの高さと
     ズレて少し画面につられて動く不具合があったため、オフセット計算に頼らない
     この構造に変更した（「絞り込みバナーは固定・一覧だけスクロール」という
     現場からの要望）。900px以下（下の@media (max-width: 900px)参照）では、
     サイドバー・一覧とも通常のページスクロールに戻す1カラム表示のまま。 */
  @media (min-width: 901px) {
    main.view.view--list.is-active {
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--topbar-h));
    }
    .view--list .commandbar { position: static; flex: none; }
    .view--list .listBody {
      display: grid;
      /* minmax(0, 1fr)にする理由は.card__metaGrid等と同じ（1fr単独だと、内容が
         長い場合にトラック自体がその内容ぶんまで広がってしまうため）。 */
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 24px;
      padding: 20px 24px 24px;
      flex: 1 1 auto;
      min-height: 0;
    }
    .view--list .filterSidebar { height: 100%; overflow-y: auto; }
    .view--list .listBody__main { height: 100%; overflow-y: auto; }
  }

  .filterCheck { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--on-surface); cursor: pointer; padding: 3px 0; }
  .filterCheck input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); cursor: pointer; flex: none; }
  .filterCheck__cnt { margin-left: auto; font-size: 11.5px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }

  .toolbar2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px; flex-wrap: wrap; }
  .toolbar2__count { font-size: 13px; font-weight: 700; color: var(--on-surface-variant); }

  /* ===== 在庫リストのクイック行（ボディタイプのクイックナビ＋該当台数・並び替え） =====
     ホーム画面と同じ.homeTypeNav__itemのクイックナビを流用し、以前の状態タブ
     （.statusTabs、廃止）に代わって置く。右端に該当台数・並び替えをまとめる
     （現場からの要望「該当台数・並び替えはボディタイプの右端に」）。 */
  .quickRow { display: flex; align-items: center; gap: 16px; }
  .quickRow .scroller { flex: 1 1 auto; min-width: 0; }
  .quickRow__right { display: flex; align-items: center; gap: 16px; flex: none; }

  .input {
    border: 1px solid var(--outline);
    border-radius: 8px;
    padding: 9px 12px;
    /* 16px未満だとiOS Safari等がフォーカス時に自動でページ全体を拡大表示して
       しまう（入力欄だけでなく画面全体がズームされたように見える不具合の原因）。
       Hold登録・受注確定モーダルに限らず、すべての.input（検索欄・設定画面の
       各種入力欄を含む）が対象になるよう、基準値として16pxにしている。 */
    font-size: 16px;
    background: var(--surface);
    color: var(--on-surface);
  }
  .input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  .input--search { min-width: 220px; flex: 1 1 220px; }
  .input:disabled { background: var(--background); color: var(--on-surface-variant); cursor: not-allowed; }

  .checkboxField { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--on-surface-variant); }

  /* 大文字＋広めのレタースペーシングのCTAボタン（塗り／アウトラインどちらも
     同じ形状で統一）。角丸はフルピル（999px）ではなく、バッジ・アイコン
     ボタン等アプリ全体と揃えた控えめな角丸にしている（現場からの要望
     「ステータスアイコン含むアプリ全体のアイコンの丸みを抑えて」）。 */
  .btn {
    border: 1px solid var(--outline);
    background: var(--surface);
    color: var(--on-surface);
    border-radius: 8px;
    padding: 11px 22px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color .15s var(--ease), border-color .15s var(--ease);
  }
  /* アウトラインボタンは、公式サイトのCTAによくある「ホバーで反転（塗りつぶし）」
     の挙動にする。 */
  .btn:hover { background: var(--on-surface); border-color: var(--on-surface); color: var(--background); }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn--primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: var(--on-primary); }
  /* ロゴ削除等の添え書きリンクは、CTAボタンと区別できるよう大文字化・反転させない */
  .btn--text { border: none; background: none; color: var(--primary-text); padding: 8px 10px; text-transform: none; letter-spacing: normal; }
  .btn--text:hover { background: none; color: var(--primary-text); text-decoration: underline; }
  .btn--danger { color: var(--danger); border-color: var(--danger); }
  .btn--danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn--block { width: 100%; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  /* タップ領域は44x44px（モバイルの推奨最小タップサイズ）を確保しつつ、
     見た目上のアイコン自体は従来通り20pxのまま据え置く。 */
  .btn--icon {
    border: none; background: transparent; font-size: 20px; line-height: 1;
    width: 44px; height: 44px; border-radius: 12px; cursor: pointer; color: var(--on-surface-variant);
  }
  .btn--icon:hover { background: rgba(31, 41, 51, .06); }

  /* ===== フォーカスリング（キーボード操作時の視認性確保） =====
     マウス操作時には表示されず、キーボードでのTab移動時のみ表示される
     :focus-visible を使う。ブランドカラー（--primary-text）で統一する。 */
  .btn:focus-visible,
  .navBtn:focus-visible,
  .themePreset:focus-visible {
    outline: 2px solid var(--primary-text);
    outline-offset: 2px;
  }

  /* ===== マイページ: ログイン中の担当者本人がHold中／受注した車両だけの一覧 =====
     行自体は在庫リスト・受注リストと同じ.rowListをそのまま再利用する
     （見た目・操作感を統一するため、専用のデザインは作らない）。 */
  /* 不具合修正: 自由検索欄（.commandbar）のすぐ下に「Hold中の車両」の見出しが
     詰まって見えていたため、マイページ本体の先頭に上余白を設ける（現場からの
     要望）。 */
  #myPageContent { margin-top: 24px; }
  .myPageSection { margin-bottom: 32px; }
  .myPageSection__title {
    font-size: 15px;
    font-weight: 700;
    color: var(--on-surface);
    margin: 0 0 14px 2px;
  }
  .myPageSection__title span { color: var(--primary-text); font-weight: 700; }

  /* ===== グループ見出し ===== */
  .group { margin-bottom: 28px; }
  .group__title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--on-surface-variant);
    margin: 0 0 14px 2px;
  }
  .group__count {
    margin-left: 8px;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--primary-text);
  }
  .sortField { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--on-surface-variant); white-space: nowrap; }
  .sortField select { font-size: 13px; }

  .btn--small { padding: 6px 12px; font-size: 12.5px; }

  /* ===== 番号付き一覧行（在庫リスト・受注リスト・業販受注リスト・マイページ共通） =====
     カード／表の表示形式切り替えは廃止し、この1デザインに一本化する
     （ROUND H フェーズ2）。行の左端の色付き罫線はHold状況（在庫リストのみ）を
     表す。ラウンドFで確定した「文字を見切れさせない・行の高さは可変」の方針を
     そのまま踏襲する。 */
  .rowList { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--outline); border-radius: var(--radius); overflow: hidden; }
  .rowItem {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 22px;
    border-bottom: 1px solid var(--outline);
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: background-color .15s var(--ease);
  }
  .rowList > .rowItem:last-child { border-bottom: none; }
  .rowItem:hover { background: var(--background); }
  .rowItem--hold { border-left-color: var(--warning); }
  .rowItem--holdSpecial { border-left-color: var(--hold-special); }
  .rowItem__num {
    flex: 0 0 30px;
    font-size: 13px;
    font-weight: 600;
    color: var(--on-surface-variant);
    font-variant-numeric: tabular-nums;
  }
  .rowItem__main { flex: 1 1 auto; min-width: 0; }
  /* 状態バッジ・Hold要約は右側の専用列（.rowItem__status）に分離したため、
     見出し行はタグ・モデル名だけになった。flex-wrap: nowrapにして、モデル名
     だけが伸縮するflexアイテム（.rowItem__model、min-width: 0＋
     text-overflow: ellipsis）になるようにし、モデル名が極端に長い車両だけ
     見出し行が2行になって他の車両と行の高さが揃わない、という問題を避ける
     （現場からの要望「車両によってカードサイズが変わらないように」）。 */
  .rowItem__head { display: flex; align-items: center; gap: 9px; flex-wrap: nowrap; margin-bottom: 6px; min-width: 0; overflow: hidden; }
  .rowItem__model {
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: -.005em;
    flex: 1 1 auto;
    min-width: 40px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .02em;
    background: var(--background);
    color: var(--on-surface-variant);
    border: 1px solid var(--outline);
    border-radius: 5px;
    padding: 2px 7px;
    flex: none;
  }
  /* 参照UI「THE STUDY」のモデル名の下にある仕様サブテキスト（HSE／ディーゼル／
     4WD／AT等）と同じ位置に、外装色・内装色を表示する（現場からの要望
     「モデル名の横に内外装の色を配置したい」）。全車両で必ず1行増えるだけ
     なので、車両ごとに行の高さが変わることはない（現場からの要望
     「車両によってカードサイズが変わらないように」は引き続き有効）。 */
  .rowItem__colorSub {
    font-size: 12px;
    color: var(--on-surface-variant);
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* flex-wrap: nowrap＋overflow: hiddenにする理由は.rowItem__headと同じ
     （車両（登録番号や日付の桁数等）によって内容の長さが変わり、ある車両だけ
     このメタ行が2行に折り返って他の車両とカードサイズが揃わなくなっていた。
     現場からの要望「車両によってカードサイズが変わらないように」）。 */
  .rowItem__meta { font-size: 12.5px; color: var(--on-surface-variant); display: flex; align-items: center; flex-wrap: nowrap; overflow: hidden; gap: 8px; }
  /* コンテナ側をflex-wrap: nowrapにしただけでは、中の各span自体（年式の
     日付のハイフン等）が改行され得る場所で内部的に折り返ってしまい、行の
     高さが車両（日付・登録番号の文字数）によって変わってしまっていた。
     各span自体もnowrapにして、はみ出す分はコンテナのoverflow: hiddenで
     切り詰める。 */
  .rowItem__meta > span { white-space: nowrap; flex: none; }
  /* 年式・走行距離・登録番号は同じ車両情報のひとかたまりのため、「・」の
     文字ではなく縦罫線で区切り、データ表の列のように見た目をはっきり
     分ける（現場からの要望「区切りを入れたいのは車両情報」）。 */
  .rowItem__metaSep { flex: none; width: 1px; height: 11px; background: var(--outline); }
  /* 販売価格も車両情報（年式・走行距離・登録番号）と同じメタ情報行に含める
     （現場からの要望「価格も車両情報側に含めてほしい」）。色・太さも他の
     項目と揃え、目立たせる特別扱いはしない（現場からの要望「金額の色も
     他の車両情報と同じカラーにしてほしい」）。 */
  .rowItem__metaPrice { font-variant-numeric: tabular-nums; }
  .rowItem__sub { font-size: 11px; color: var(--on-surface-variant); margin-top: 5px; font-variant-numeric: tabular-nums; }
  /* ===== 状態列（.rowItem__status） =====
     以前は見出し行（タグ・モデル名）に状態バッジを詰め込んでいたため、
     モデル名が長い車両ほど圧迫されて見えていた。参照UI「THE STUDY」の
     ステータス列のように、状態は常に同じ幅の専用列に分離した（現場からの
     要望「Hold中の表示の仕方を根本から変えてほしい」）。Hold中も状態
     バッジのみを表示し、顧客名・担当者・残り時間は出さない（現場からの
     要望「HOLD状況はステータスのみで大丈夫、詳細情報にて担当者・顧客・
     残り時間がわかるようにしてほしい」）。これらは元々詳細モーダル
     （vehicleDetailHtml_のholdInfoBlockHtml_、full=true）に含まれている。 */
  .rowItem__status {
    flex: 0 0 168px;
    display: flex;
    align-items: center;
    min-width: 0;
  }
  .rowItem__price {
    flex: 0 0 auto;
    min-width: 110px;
    text-align: right;
    font-size: 16.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  /* 登録番号・走行距離等は既にラベル付きだが、金額だけラベルが無く何の数字か
     一目で分かりにくかったため、他の項目と同じく小さなラベルを添える
     （現場からの要望）。金額自体の見た目（サイズ・太さ・右寄せ）は変えない。 */
  .rowItem__priceLabel {
    display: block;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--on-surface-variant);
    letter-spacing: .03em;
  }
  /* .card__actions のボタン（.btn）は元々カード幅いっぱいに均等分割する
     flex: 1レイアウト（カード内で1行を専有）を前提にしているため、一覧行の
     ようにボタン列自体の幅が内容量ぶんしか無い（shrink-to-fit）場所に置くと、
     flex: 1のままではボタンが潰れて文字が省略されてしまう。一覧行では
     ボタンを内容量なりの自然な幅で並べるだけでよいため、flex: noneで
     打ち消す。ボタン自体もmin-widthを揃え、「Hold／受注」（在庫あり車両）と
     「解除／受注確定」（Hold中車両）とでラベルの文字数が違っても同じ幅になる
     ようにする（現場からの要望「受注確定やホールドなども綺麗に並べて
     ほしい」）。 */
  .rowItem .card__actions { flex: 0 0 auto; margin: 0; }
  .rowItem .card__actions .btn { flex: none; min-width: 82px; padding: 9px 12px; font-size: 12px; text-align: center; }
  /* Hold解除ボタンは.card__actions（受注確定ボタン）とは別に、行の直接の
     子要素として置く（vehicleRowItemHtml_参照）。同じ見た目・サイズに揃える。 */
  .rowItem__cancelHoldBtn { flex: none; min-width: 82px; padding: 9px 12px; font-size: 12px; text-align: center; }
  /* ===== 操作ボタン列（.rowItem__actions） =====
     状態列（.rowItem__status）と同じく、常に同じ幅の専用列にする。以前は
     解除ボタンの有無・ボタンの組み合わせによって操作ボタン列全体の幅が
     車両ごとに変わり、その手前にあるモデル名（flex: 1で余った幅を埋める
     .rowItem__main）の実際の幅も車両ごとに変わってしまっていた。これが、
     状態バッジの開始位置が車両によってズレて見えていた原因（現場からの
     指摘「ステータス列がバラバラ」）。操作ボタン列を固定幅にすることで、
     状態列・操作ボタン列とも車両やHold状態に関わらず必ず同じ位置に揃う。 */
  .rowItem__actions { flex: 0 0 190px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .rowItem__chev { flex: 0 0 16px; color: var(--on-surface-variant); font-size: 15px; text-align: center; }

  /* ===== 車両情報カード（詳細モーダル・#inventoryDetailModal専用） =====
     一覧の行（.rowItem）とは別に、行タップで開く詳細ポップアップの中身だけに
     使う。長いモデル名・コミッション等でもポップアップ自体が横に広がらないよう
     min-width: 0で折り返し・省略記号を優先する。 */
  .card {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid transparent;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
    transition: box-shadow .18s var(--ease), transform .18s var(--ease), border-color .18s var(--ease);
  }
  .card--available { border-left-color: var(--success); }
  /* Gクラス予約リストのカード用。在庫あり／Hold中のような実際の状態を持たない
     閲覧専用リストのため、状態色（--success等）ではなく選択中のテーマカラー
     （--primary）を装飾として使う（現場からの要望。テーマを切り替えると
     このカードの左罫線も連動して変わる）。 */
  .card--themed { border-left-color: var(--primary); }
  .card--hold { border-left-color: var(--warning); }
  /* 業販HOLDは、通常のHoldとひと目で見分けられるよう
     専用の特別色にする（管理者権限を持つ担当者のみ登録できる。HOLD_TYPE参照）。 */
  .card--holdSpecial { border-left-color: var(--hold-special); }
  /* 中古車サイトに掲載中の車両は、Hold状態の色（border-left-color）とは独立して
     背景色を変え、一覧上で一目で区別できるようにする（現場からの要望。
     isVehicleListed_、JavaScript.html参照）。border-left-colorによる状態色と
     衝突しないよう、変えるのはbackgroundのみにする。 */
  .card.is-listed { background: var(--listed-bg); }
  /* 【上枠】車種・ＯＣＮの行と、ステータス（＋掲載）バッジの行を常に別々の
     固定行にする。以前は1つのflex-wrapコンテナに全部まとめていたため、バッジの
     個数やモデル名・ＯＣＮの文字数の組み合わせによって折り返し方が変わり、
     カードの高さが揃わなかった。2行に固定することで、組み合わせに関わらず
     常に同じ高さになる。 */
  .card__top { display: flex; flex-direction: column; gap: 8px; }
  .card__topRow { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  /* モデル名・ＯＣＮを常に1行に収める（折り返し無し。現場からの要望）。
     直接の子要素（無名のdiv）は、flexアイテムの既定値min-width: autoのままだと
     内容ぶんの幅までしか縮まず、隣（比較ピン）を押し出したり右側でオーバーフロー
     したりするため、min-width: 0で縮小を許可し、ellipsisが実際に働くようにする。 */
  .card__topRow > div:first-child { min-width: 0; }
  .card__model, .card__commission { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card__model { font-size: 21px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
  .card__commission {
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: .03em;
    color: var(--on-surface-variant);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .01em;
    padding: 5px 12px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .badge__dot { width: 7px; height: 7px; border-radius: 2px; background: currentColor; flex: none; }
  .badge--available { background: var(--success-bg); color: var(--success); }
  .badge--hold { background: var(--warning-bg); color: var(--warning); }
  .badge--holdSpecial { background: var(--hold-special-bg); color: var(--hold-special); }
  /* 掲載バッジ（未掲載／片方のみ掲載／両方掲載）。ステータスバッジと並べて
     表示するため、行・カードの背景色（is-listed）と重ならないティール系にする
     （listedBadgeHtml_、JavaScript.html参照。未掲載の場合はバッジ自体を出さない）。 */
  .badge--listed { background: var(--listed-bg); color: #0f766e; }
  .badge--disclosed { background: var(--success-bg); color: var(--success); font-weight: 500; }
  .badge--undisclosed { background: rgba(31, 41, 51, .06); color: var(--on-surface-variant); font-weight: 500; }
  .badge--thisMonth { background: var(--primary-bg); color: var(--primary-text); font-weight: 500; }
  .badge--location { background: var(--primary-bg); color: var(--primary-text); font-weight: 500; }
  .card__badges { display: flex; gap: 6px; flex-wrap: wrap; }

  /* メタ情報は2列のミニグリッドで表示。ラベルは小さく大文字寄り・トラッキング広め、
     値は大きく太くというメリハリのある「テスラ風」の見出し表現で視認性を高める。 */
  .card__metaGrid {
    display: grid;
    /* minmax(0, 1fr)にする理由は.rowItemの折り返しと同じ（1fr単独だと、値が
       長い場合にトラック自体がその内容ぶんまで広がってしまい、下のdd（値）に
       指定したellipsisが効かず、カードの外へはみ出してしまう）。 */
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px 16px;
    margin: 0;
    padding: 12px 0 0;
  }
  /* 【下枠】（区分・カラー・販売価格・年式・走行距離・登録番号）は折りたたまず
     常に表示するため、card__topのすぐ下に独自の区切り線を持つ */
  .card__metaGrid--quick { border-top: 1px solid var(--outline); padding-top: 14px; }
  .card__metaGrid dt {
    color: var(--on-surface-variant);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 3px;
    white-space: nowrap;
  }
  .card__metaGrid dd {
    margin: 0; font-size: 14.5px; font-weight: 600; color: var(--on-surface); line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 在庫リストの詳細モーダル（vehicleDetailHtml_）の外装色・内装色専用。値が長い
     場合でも省略記号にせず、折り返してでも全文を読めるようにする（現場からの
     要望「在庫リストポップアップ表示時のみカラーを全て表示してほしい」。一覧の
     カード表示は他の項目と高さを揃えるため、これまでどおり省略記号のまま）。 */
  .card__metaGrid dd.is-fullText { white-space: normal; overflow: visible; text-overflow: clip; word-break: break-word; }
  /* オプション欄（vehicleSpecFieldsHtml_）専用。値の代わりにボタンを置くため、
     テキスト用の省略記号設定（white-space: nowrap等）を解除する。 */
  .card__metaGrid dd.dd--action { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1; }

  /* Hold状況エリアは高さ固定・内部スクロール。カード自体の高さは在庫あり／Hold中の
     どちらの状態でも常に一定に保たれる。想定を超える長さの内容が入った場合の
     保険として、内部スクロールも残す。 */
  .card__holdArea {
    height: 150px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  /* 詳細モーダル（vehicleDetailHtml_）は、カードグリッドの行の高さを揃える
     必要が無いため、高さ固定・内部スクロールにせず内容ぶんそのまま表示する。 */
  .card__holdArea--full { height: auto; overflow: visible; }
  .card__holdArea--empty {
    align-items: center;
    justify-content: center;
  }
  .card__holdArea__placeholder {
    font-size: 12.5px;
    color: var(--on-surface-variant);
    opacity: .7;
  }
  .card__holdInfo {
    flex: none;
    background: var(--background);
    border-radius: 10px;
    border-left: 3px solid var(--outline);
    padding: 10px 12px;
    font-size: 13.5px;
    color: var(--on-surface-variant);
    line-height: 1.6;
  }
  .card__holdInfo b { color: var(--on-surface); }
  .card__holdInfo__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  /* "HOLD"は縦に折り返さず常に横一列のまま表示する（現場からの
     要望）。省略記号（ellipsis）はあくまで、業販HOLDの「（業販HOLD）」suffix等で
     万一収まりきらない場合の保険。 */
  .card__holdInfo__label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-transform: uppercase;
    min-width: 0;
  }
  .card__holdInfo--hold { border-left-color: var(--warning); }
  .card__holdInfo--hold .card__holdInfo__label { color: var(--warning); }
  /* 業販HOLDはこの特別色で上書きする（--holdと同時に付与されるクラスのため、
     後に書くことで優先させる）。 */
  .card__holdInfo--special { border-left-color: var(--hold-special); background: var(--hold-special-bg); }
  .card__holdInfo--special .card__holdInfo__label { color: var(--hold-special); }
  /* 顧客名・担当者名・拠点名は現場の入力次第で長くなり得るため、折り返さず
     1行に収めて超過分は省略記号にする（現場からの要望。折り返すと、固定高さの
     .card__holdArea内で行数が増えるぶん縦スクロールが必要になる場面が増える）。 */
  .card__holdInfo__row { margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card__holdInfo__cancel {
    border: none;
    background: none;
    color: var(--danger);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    flex: none;
  }
  .card__holdInfo__cancel:hover { background: var(--danger-bg); }

  /* 詳細（リード番号・登録月・下取車等）は詳細モーダル（vehicleDetailHtml_）内でのみ
     表示する（card__holdInfo__detailsBody--flat）。カード表示側では表示しない。 */
  .card__holdInfo__detailsBody--flat {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--outline);
  }

  /* ===== Hold 72時間タイマー ===== */
  .holdTimer__bar {
    height: 5px;
    border-radius: 3px;
    background: var(--outline);
    overflow: hidden;
  }
  .holdTimer__barFill {
    height: 100%;
    width: 100%;
    border-radius: 3px;
    background: var(--primary);
    transition: width 1s linear;
  }
  .holdTimer--warning .holdTimer__barFill { background: var(--warning); }
  .holdTimer--expired .holdTimer__barFill { background: var(--danger); width: 0% !important; }
  /* 業販HOLDはHold期限が無期限のため、進捗バーは出さず「無期限」の
     固定表示のみにする（holdTimerHtml_、JavaScript.html参照）。 */
  .holdTimer--indefinite .holdTimer__text { margin-top: 0; color: var(--hold-special); font-weight: 700; }
  .holdTimer__text {
    margin-top: 4px;
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--on-surface-variant);
  }
  .holdTimer--warning .holdTimer__text { color: var(--warning); }
  .holdTimer--expired .holdTimer__text { color: var(--danger); }

  /* 「備考を見る」ボタン専用の行。card__actions（margin-top: autoでカード下部へ
     押し付ける）とは別物として扱う。詳細ポップアップ内でスペック情報とHold情報
     の間に置くだけの、ごく普通の余白付き行でよいため。 */
  .card__remarksRow { margin-top: 8px; }

  .card__actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
  /* 「受注確定」等、ボタン内の文言は横一列表示を維持したい
     （折り返して縦2行になると見づらいため）。flex: 1 の等分幅に対して
     文字が収まりきらないケースに備え、min-width: 0 で必要なら縮められる
     ようにしたうえで、白抜きなし（nowrap）＋ボタン内では省略記号を
     フォールバックとして設定する。横幅に余裕を持たせるためパディングと
     文字間隔（letter-spacing）も他のボタンよりやや詰めている。 */
  .card__actions .btn {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    padding-left: 10px;
    padding-right: 10px;
    font-size: 12.5px;
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .emptyState {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    color: var(--on-surface-variant);
    padding: 60px 20px;
    font-size: 14px;
  }
  .emptyState p { margin: 0; max-width: 46ch; line-height: 1.7; }
  /* 単なる文字だけの寂しい印象にならないよう、既存の線画アイコン一式から
     文脈に合うものを添える（新規アイコンライブラリは追加しない）。 */
  .emptyState__icon {
    width: 34px;
    height: 34px;
    stroke-width: 1.3;
    color: var(--outline);
  }

  /* ===== 受注カード（詳細モーダル・#orderDetailModal / #wholesaleOrderDetailModal
     専用） ===== 一覧の行（.rowItem）とは別に、行タップで開く詳細ポップアップの
     中身だけに使う。 */
  .orderCard {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid var(--primary);
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  /* 顧客名・担当者名・車種は現場の入力次第で長くなり得るため折り返さず、
     拠点バッジは常に右端に固定表示する（現場からの要望。折り返すとカードの
     高さが案件ごとにばらつく）。flex-wrap: nowrap＋左側（顧客名側）に
     min-width: 0を指定し、右側のバッジ（flex: none）を押し出さずに
     左側だけが縮んでellipsisになるようにする。 */
  .orderCard__top { display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 8px 10px; }
  .orderCard__top > div:first-child { min-width: 0; }
  .orderCard__top .card__badges { margin-left: auto; flex: none; }
  .orderCard__top .card__badges .badge { margin-left: 0; }
  .orderCard__model, .orderCard__staff, .orderCard__vehicle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .orderCard__model { font-size: 21px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
  .orderCard__staff { font-size: 13.5px; font-weight: 600; color: var(--on-surface-variant); margin-top: 3px; }
  /* 車種は「誰が・何を買ったか」をひと目で確認できるよう、常に表示する
     （契約内容の詳細は下の折りたたみへ）。 */
  .orderCard__vehicle {
    font-size: 14px;
    font-weight: 600;
    color: var(--on-surface);
    margin-top: 4px;
  }
  .orderCard__grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 16px;
    margin: 0;
    padding: 12px 0 0;
  }
  .orderCard__grid dt {
    color: var(--on-surface-variant);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .orderCard__grid dd { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--on-surface); line-height: 1.3; }

  /* ===== 発注リスト =====
     登録・編集・削除はいずれもアプリ画面からは行わず、スプレッドシートへ直接
     入力する運用の閲覧専用一覧（PurchaseOrderService.gs参照）。カード表示は
     受注リストの.orderCard（顧客名を主役にした見た目）と同じ考え方で統一し、
     「誰が発注したか」がひと目でわかるようにしている。 */
  .purchaseOrderList {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    align-items: start;
  }
  .purchaseOrderCard {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-left: 4px solid var(--primary);
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  /* orderCard__topと同じ考え方（顧客名・担当者・車種は折り返さず、拠点バッジは
     常に右端に固定。現場からの要望）。 */
  .purchaseOrderCard__top { display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 8px 10px; }
  .purchaseOrderCard__top > div:first-child { min-width: 0; }
  .purchaseOrderCard__top .badge { margin-left: auto; flex: none; }
  .purchaseOrderCard__customer, .purchaseOrderCard__staff, .purchaseOrderCard__vehicle, .purchaseOrderCard__sub {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .purchaseOrderCard__customer { font-size: 21px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
  .purchaseOrderCard__staff { font-size: 13.5px; font-weight: 600; color: var(--on-surface-variant); margin-top: 3px; }
  .purchaseOrderCard__vehicle { font-size: 14px; font-weight: 600; color: var(--on-surface); margin-top: 4px; }
  .purchaseOrderCard__sub { font-size: 12.5px; color: var(--on-surface-variant); }

  /* ===== 設定画面 =====
     項目ごとに独立したカード（島）に分け、Google/Teslaのカードデザインに寄せる
     （角丸・影・余白多め。1つの大きなカードに全項目を詰め込まない）。
     2列の段組み（masonry）レイアウトも試したが、カードの高さがまちまちだと
     列の合計高さがずれてしまい、次のカードとの間隔だけ広がって不揃いに見える
     問題が残るため、確実に隙間が一定になる1列の縦積みに統一している
     （Google/Teslaの設定画面も同様に1列でカードを並べるスタイル）。 */
  .settingsWrap {
    max-width: 760px;
    margin: 0 auto;
  }
  .settingsGrid {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  /* テーマ・システムマスタ等、設定タブ内の大分類見出し。カードの外側、
     グループの先頭に置く（カード自体の見出し＝settingsSection__titleとは別）。 */
  .settingsGroupTitle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--on-surface-variant);
    margin: 8px 2px -6px;
  }
  .settingsGroupTitle--admin { color: var(--on-surface); }
  .settingsGroupTitle__badge {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: none;
    background: var(--warning-bg);
    color: var(--warning);
    padding: 3px 10px;
    border-radius: 6px;
  }
  .settingsCard {
    background: var(--surface);
    border-radius: 10px;
    box-shadow: var(--shadow);
    border: 1px solid var(--outline);
    padding: 26px 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .settingsSection__title {
    font-size: 15.5px;
    font-weight: 700;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--on-surface);
  }
  .settingsSection__title .icon { color: var(--primary-text); }
  .settingsSection__desc {
    font-size: 12.5px;
    color: var(--on-surface-variant);
    margin: 0 0 14px;
    line-height: 1.6;
  }
  .settingsCard .formField + .formField { margin-top: 14px; }
  /* 不具合修正: .settingsActions（保存ボタン）は.settingsGrid（gap: 20pxでカード間の
     間隔を揃えている）の外側の兄弟要素のため、gapの対象外で直上のカードと詰まって
     見えていた（現場からの指摘）。カード同士の間隔と揃うよう、同じ20pxを
     margin-topで明示的に付ける。 */
  .settingsActions {
    background: var(--surface);
    border-radius: 10px;
    box-shadow: var(--shadow);
    border: 1px solid var(--outline);
    padding: 20px 28px;
    margin-top: 20px;
  }
  .formField { display: flex; flex-direction: column; gap: 6px; }
  .formField label { font-size: 13px; font-weight: 500; color: var(--on-surface-variant); }
  /* 発注リストの登録・編集モーダルなど、任意項目が混在するフォームで
     必須項目だけを明示するための小さなバッジ（.settingsGroupTitle__badgeと
     同じ「警告色の薄いピル」の見た目を流用）。 */
  .formField__required {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .02em;
    background: var(--warning-bg);
    color: var(--warning);
    padding: 2px 7px;
    border-radius: 6px;
    margin-left: 4px;
  }
  .formField .input { width: 100%; }
  .formField__hint { margin: 0; font-size: 12px; color: var(--on-surface-variant); }
  .formField.hidden { display: none; }

  /* ===== テーマ（着せ替え）プリセット選択 =====
     以前はカラーピッカーで自由に配色を指定できたが、組み合わせによって
     コントラスト比が不足する懸念があったため、視覚的に確認済みの11色＋
     ランダム（ログインのたび変化。renderThemePresets_参照）から選ぶスウォッチ
     形式に変更した（洋服・スマホケースの色を選ぶイメージ）。プリセット1つで
     ボタン・アクティブ状態の下線・アイコン等、アプリ全体の--primary系の
     配色が一括で切り替わる（ヘッダー・レール自体は中立色で固定のため、
     配色テーマの影響を受けない）。 */
  .themePresetGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .themePreset {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 8px;
    background: var(--background);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--on-surface-variant);
    font-size: 12px;
  }
  .themePreset:hover { border-color: var(--swatch); }
  .themePreset.is-selected { border-color: var(--swatch); background: rgba(31, 41, 51, .04); color: var(--on-surface); }
  .themePreset__swatch {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--swatch);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15);
  }
  .themePreset.is-selected .themePreset__swatch {
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15), 0 0 0 3px var(--surface), 0 0 0 5px var(--swatch);
  }
  .themePreset__name { text-align: center; line-height: 1.3; }
  @media (max-width: 480px) {
    .themePresetGrid { grid-template-columns: repeat(3, 1fr); }
  }

  /* ===== ロゴ設定 ===== */
  .logoPreview {
    width: 72px; height: 72px; flex: none;
    border: 1px solid var(--outline); border-radius: 8px;
    background: var(--background);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .logoPreview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .logoPreview__placeholder { font-size: 11px; color: var(--on-surface-variant); text-align: center; }

  /* ===== ローディング画像設定のプレビュー =====
     ロゴ（.logoPreview、72×72の小さな正方形）と異なり、ローディング画像は
     全画面表示になり得る画像のため、プレビューも横長・大きめにして
     見え方を確認しやすくする。 */
  #settingsLoadingImagePreview { width: 100%; max-width: 320px; height: 160px; }

  /* ===== 設定タブの各種リスト共通: ドラッグハンドル（担当者・モデル写真・
     メール通知先で共通利用。JavaScript.htmlのmakeReorderable_参照） ===== */
  .dragHandle {
    flex: none;
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 32px;
    color: var(--on-surface-variant);
    font-size: 15px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    border-radius: 4px;
  }
  .dragHandle:hover { background: var(--background); color: var(--on-surface); }
  .dragHandle:active { cursor: grabbing; }
  [data-drag-index].is-dragging { opacity: .4; }
  [data-drag-index].is-drag-over {
    outline: 2px dashed var(--primary);
    outline-offset: 2px;
    border-radius: 8px;
  }

  /* ===== 担当者マスタ（折りたたみ式） =====
     人数が多いと3項目（名前・メールアドレス・拠点名）の入力欄が常に全部
     開いた状態になり縦に長くなりすぎるため、各行を折りたたみ式にしている。
     普段はstaffList__header（要約1行）だけが見え、タップするとstaffList__body
     （実際の入力欄）が開く（JavaScript.htmlのrenderStaffList参照）。 */
  .staffList { display: flex; flex-direction: column; gap: 6px; }
  .staffList__item { border: 1px solid var(--outline); border-radius: 8px; overflow: hidden; }
  .staffList__item.is-expanded { border-color: var(--primary); }
  .staffList__header { display: flex; align-items: center; gap: 4px; padding: 2px 4px; }
  .staffList__summary {
    flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px;
    background: none; border: none; padding: 8px 6px; text-align: left;
    font: inherit; color: inherit; cursor: pointer; border-radius: 6px;
  }
  .staffList__summary:hover { background: var(--background); }
  .staffList__summaryText { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .staffList__summaryName, .staffList__summarySub {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
  .staffList__summaryName { font-size: 13.5px; font-weight: 600; }
  .staffList__summarySub { font-size: 12px; color: var(--on-surface-variant); }
  .staffList__chevron { flex: none; font-size: 12px; color: var(--on-surface-variant); }
  .staffList__body { display: flex; gap: 8px; padding: 0 8px 10px; flex-wrap: wrap; }
  .staffList__body .input[data-staff-field="name"] { flex: 0 0 22%; min-width: 80px; }
  .staffList__body .input[data-staff-field="email"] { flex: 1 1 40%; min-width: 0; }
  .staffList__body .input[data-staff-field="location"] { flex: 0 0 22%; min-width: 90px; }
  .staffList__empty { font-size: 13px; color: var(--on-surface-variant); }

  /* 車両画像リスト（#modelPhotoList）も担当者マスタと同じ.staffList/.staffList__body
     を再利用する。フィールド数が多いため、写真URLを最も広く取り、残りを均等割りにする。 */
  .staffList__body .input[data-photo-field="photoUrl"] { flex: 1 1 45%; min-width: 160px; }
  .staffList__body .input[data-photo-field="model"] { flex: 0 0 16%; min-width: 90px; }
  .staffList__body .input[data-photo-field="gradePrefix"] { flex: 0 0 12%; min-width: 70px; }
  .staffList__body .input[data-photo-field="gradeMarker"] { flex: 0 0 12%; min-width: 70px; }
  .staffList__body select[data-photo-field="bodyType"] { flex: 0 0 16%; min-width: 110px; }

  /* ===== メール通知先（Hold時／受注確定時／システムエラー通知） =====
     以前は「,区切りの1テキスト欄」だったが、担当者マスタと統一した
     「1行1件・追加/削除/ドラッグ並び替え」のリスト形式に変更した。 */
  .mailList { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .mailList__row { display: flex; gap: 8px; align-items: center; }
  .mailList__row .input { flex: 1 1 auto; min-width: 0; }
  .mailList__empty { font-size: 13px; color: var(--on-surface-variant); margin-bottom: 4px; }

  /* ===== 左レールの表示切替 =====
     アイコンのみの左レール（.rail、基本スタイルはファイル冒頭のレイアウト
     セクション参照）はPCビュー（901px以上）でのみ表示する。901px未満は
     .tabbar（画面下固定のアイコン＋ラベルのタブバー）に切り替える
     （下の@media(max-width: 900px)ブロック参照）。 */
  @media (min-width: 901px) {
    .rail { display: flex; }
  }

  /* ===== リード番号入力（「L-」固定接頭辞＋数字。Google×Tesla風の見出し扱いにする） ===== */
  .leadNumberField {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--outline);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .leadNumberField:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg); }
  .leadNumberField__prefix {
    display: flex;
    align-items: center;
    padding: 0 14px;
    background: var(--primary-bg);
    color: var(--primary-text);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .03em;
    border-right: 1px solid var(--outline);
  }
  .leadNumberField__input { border: none; border-radius: 0; flex: 1; min-width: 0; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .leadNumberField .leadNumberField__input:focus { outline: none; }

  /* ===== 担当者表示（ログイン中のアカウントから自動判定・読み取り専用） ===== */
  .staffDisplay {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--background);
    font-size: 14px;
  }
  .staffDisplay__email { font-size: 12px; color: var(--on-surface-variant); }
  .staffDisplay__warn { font-size: 13px; color: var(--danger); }

  /* ===== モーダル =====
     不具合修正（スマホでHold登録・受注確定の入力中に項目がキーボードの裏に
     隠れる問題）: 最初、.modal自身のtop・heightをvisualViewportの実測値に
     ダイレクトに書き換える方式を試したが、iOS Safariではposition: fixed要素の
     位置・高さをJSから動的に書き換えると、キーボード開閉のタイミングによって
     レイアウトが崩れて表示されてしまう（ステップ見出しや他の入力欄が消え、
     ボタンの下に不自然な空白ができる）不具合があった。
     そこで、.modal自身のtop/left/right/bottom（inset: 0）はそのままレイアウト
     ビューポート基準で固定し、代わりに下方向のpaddingにキーボードの高さぶんを
     動的に足す方式に変えた。スマホ幅ではモーダルを画面下端に固定したボトム
     シートにしている（下の@media (max-width: 600px)参照。align-items:
     flex-end）ため、.modal自身の下端パディングが広がるとパネルの下端はその
     パディングの上、つまりキーボードのすぐ上に押し上げられる。.modal自体の
     位置・高さの計算方法は変えないため、position: fixedのレイアウトが崩れる
     心配がない。 */
  .modal {
    position: fixed; inset: 0; background: rgba(32, 33, 36, .5);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    padding: 16px 16px calc(16px + var(--app-keyboard-inset, 0px));
    /* 開閉が一切アニメーションせず一瞬でポップ／消失していたのを、背景の
       フェード＋パネルのフェード＆わずかな拡大・縮小に差し替える（自然な出現・
       消失に見せるため）。閉じる際はJS（openModal/closeModal）が.is-closingを
       付けてからdisplay: noneのタイミングを遅らせることで、消えるアニメーションも
       再生されるようにしている。 */
    animation: modalOverlayIn .18s var(--ease-out);
  }
  .modal.is-closing { animation: modalOverlayOut .16s var(--ease) forwards; }
  .modal .modal__panel { animation: modalPanelIn .24s var(--ease-out); }
  .modal.is-closing .modal__panel { animation: modalPanelOut .16s var(--ease) forwards; }
  @keyframes modalOverlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalOverlayOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes modalPanelIn {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes modalPanelOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(8px) scale(.98); }
  }
  /* ヘッダー・ステップ進捗・フッターは固定し、modal__bodyだけをスクロール
     させる（display: flex; flex-direction: columnで、modal__bodyのみ
     flex: 1 1 auto; overflow-y: autoにする）。以前はmodal__panel自体を
     スクロールさせていたため、内容が長いモーダルではタイトルや「Hold登録」
     等の見出しごとスクロールして見えなくなっていた。 */
  .modal__panel {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-elevated);
    width: 100%; max-width: 460px;
    /* キーボード表示中はその高さぶんも差し引く（.modalの下方向パディングと
       あわせて、パネルがキーボードの裏まではみ出さないようにする）。 */
    max-height: calc(90vh - var(--app-keyboard-inset, 0px));
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal__panel--wide { max-width: 640px; }
  .modal__header { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--outline); }
  .modal__header h2 { font-size: 17px; font-weight: 500; margin: 0; display: flex; align-items: center; }

  /* Hold登録はオレンジ、受注確定はブルーで、操作の種類が一目で
     分かるようにする（Hold中バッジ＝オレンジ、受注確定ボタン＝ブルー、と既存の
     配色ルールに合わせている）。 */
  .modal__panel--hold { border-top: 4px solid var(--warning); }
  .modal__panel--hold .modal__header { background: var(--warning-bg); }
  .modal__panel--hold .modal__header h2::before { background: var(--warning); }
  .modal__panel--hold #btnActionSubmit { background: var(--warning); border-color: var(--warning); }
  .modal__panel--hold #btnActionSubmit:hover { background: #c98423; border-color: #c98423; }

  .modal__panel--order { border-top: 4px solid var(--primary); }
  .modal__panel--order .modal__header { background: var(--primary-bg); }
  .modal__panel--order .modal__header h2::before { background: var(--primary); }

  .modal__panel--hold .modal__header h2::before,
  .modal__panel--order .modal__header h2::before {
    content: '';
    width: 9px;
    height: 9px;
    border-radius: 2px;
    margin-right: 9px;
    flex: none;
  }
  .modal__body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  /* 予約（Hold/受注）入力モーダルは2列グリッドにして、デスクトップでは
     スクロールなしで全項目を入力できるようにする。 */
  .modal__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 20px; }
  .formField--span2 { grid-column: 1 / -1; }

  /* ===== 予約モーダルのステップ進捗（顧客情報→契約内容の2ステップ）=====
     スマホでの入力ミスを減らすため、8項目を一度に出さず2ステップに分ける。
     担当者はログインアカウントから自動判定済みのため、ステップが増えても
     入力の手間自体は増えない。 */
  .modal__stepBar { flex: none; padding: 12px 20px 0; }
  .modal__stepBar__track { height: 4px; border-radius: 3px; background: var(--outline); overflow: hidden; }
  .modal__stepBar__fill { height: 100%; width: 50%; background: var(--primary); border-radius: 3px; transition: width .2s var(--ease); }
  .modal__panel--hold .modal__stepBar__fill { background: var(--warning); }
  .modal__stepBar__label { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); }
  .modal__footer { flex: none; display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--outline); }
  .modal__error { color: var(--danger); font-size: 13px; }
  .modal__desc { margin: 0; font-size: 13px; color: var(--on-surface-variant); line-height: 1.6; }
  .modal__requiredNote { margin: 0 0 4px; font-size: 12px; color: var(--on-surface-variant); }
  .req { color: var(--danger); margin-left: 2px; }
  .modal__hint { margin: 10px 0 0; font-size: 12.5px; color: var(--on-surface-variant); line-height: 1.6; }
  /* 備考・オプションの全文表示ポップアップ（textInfoModal）の本文。備考は
     スプレッドシートに直接入力される自由記述のため、改行・連続スペースを
     そのまま見た目に反映する（white-space: pre-wrap）。長文でも折り返す
     （word-break）。 */
  .textInfoModal__body { margin: 0; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }

  /* ===== Hold種別選択（管理者権限を持つ担当者が「Hold」タップ時のみ表示）=====
     通常のHold／業販HOLDの2択。業販HOLDは専用の
     特別色（--hold-special）でボタンの左罫線を色分けし、選ぶ前から見分けやすくする。 */
  .actionTypePick__intro { margin: 0 0 14px; font-size: 13.5px; color: var(--on-surface-variant); }
  .actionTypePick { display: flex; flex-direction: column; gap: 10px; }
  .actionTypePick__btn {
    display: flex;

  .celebrationLayer { position: fixed; inset: 0; z-index: 311; overflow: hidden; pointer-events: none; }
