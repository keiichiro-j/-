<script>
(function () {
  'use strict';

  // 安全策: このスクリプトのどこかで想定外のエラーが起きても、起動時ローディング
  // 画面（#appLoading）だけは必ず消す。手作業でのファイル移行（Apps Scriptエディタへ
  // のコピー＆貼り付け）ではhtml/Index.htmlとhtml/JavaScript.htmlのバージョンが
  // 食い違う等の事故が起こり得るため、原因が何であれ「読み込み画面から進まない」と
  // いう一番困る症状にだけはならないようにする（html/Index.html側にも独立した
  // 保険のタイマーを別途置いているが、こちらは発生した瞬間に反応できる）。
  window.addEventListener('error', function (e) {
    console.error('[used-vehicle-order-app] 予期しないエラーが発生しました:', e.error || e.message);
    var loading = document.getElementById('appLoading');
    if (loading) loading.classList.add('is-hidden');
  });

  function safeLocalStorageGet_(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeLocalStorageSet_(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* 保存できない環境では無視する */ }
  }

  var state = {
    bootstrap: null,
    inventoryItems: [], // キーワード検索のみサーバー側で絞り込み済みの一覧（区分・状態等はrenderInventory側でさらに絞り込む）
    // 在庫リストの絞り込み条件（区分・掲載状況・年式・価格帯・走行距離・カラー）。
    // いずれも既存のスプレッドシート列から算出するだけで、新規列の追加はしていない
    // （ROUND H フェーズ2。キーワード検索はこれとは別にサーバー側searchInventoryで
    // 行うため、ここには含めない）。モデル・状態は、絞り込みサイドバーをシンプルに
    // するため専用の絞り込みUIを廃止した（モデルは上の自由検索で、状態は代わりに
    // 使わない方針。現場からの要望）。ボディタイプでの絞り込みも、以前は
    // inventoryBodyTypeFilterとしてここに持っていたが、現場からの要望「型検索は
    // 無くしてほしい」により廃止した（ホーム画面の型クイックナビ用の
    // homeBodyTypeFilterはそのまま残る）。
    inventoryFilters: { category: [], listed: [], location: [], color: '', yearBucket: '', priceBucket: '', mileageBucket: '' },
    inventorySort: '', // 並び替え（空文字は取得順のまま）
    ordersGroups: [],
    wholesaleOrdersGroups: [],
    // 受注リスト・業販受注リストの「現展示拠点」絞り込み（チェック式）用の状態。
    // キーワード・拠点（販売拠点）・担当者・販売先はこれまでどおりサーバー側で
    // 絞り込むが、現展示拠点だけは在庫リストと同じく取得済みの一覧（groups）を
    // クライアント側だけで絞り込み直す（現場からの要望「現展示拠点をチェック式で
    // 絞り込めるようにしてほしい。全リストに反映してほしい」）。
    ordersFilters: { currentDisplayLocation: [] },
    wholesaleOrdersFilters: { currentDisplayLocation: [] },
    demoCarListItems: [], // デモカーリスト（区分「デモカー」）。グループ化は行わないフラットな一覧
    serviceCarListItems: [], // サービス代車リスト（区分「サービス」）。同上
    // デモカーリスト・サービス代車リストの絞り込みサイドバー用の状態。在庫
    // リストと同じ考え方（カラー・初年度登録日・価格帯・走行距離）に加え、
    // Hold・掲載状況の概念が無い代わりに販売状況（saleStatus）で絞り込める
    // ようにする（区分・掲載状況は在庫リストのみに残すため持たない。現場からの
    // 要望「それぞれのページに適した条件検索を追加してほしい」「在庫リスト
    // 以外には掲載状況は不要」）。
    demoCarListFilters: { color: '', yearBucket: '', priceBucket: '', mileageBucket: '', status: [], location: [] },
    serviceCarListFilters: { color: '', yearBucket: '', priceBucket: '', mileageBucket: '', status: [], location: [] },
    action: null, // { type: 'hold' | 'order' | 'orderFromHold', commission }
    staffList: [], // 設定タブで編集中の担当者マスタ（作業用コピー）
    modelBodyTypeRules: [], // 設定タブで編集中のボディタイプ紐付けルール（作業用コピー）
    modelPhotos: [], // 設定タブで編集中の車両画像（作業用コピー）
    homeBodyTypeFilter: '', // ホーム画面の型クイックナビで選択中の型（空文字は「すべて」）
    // ホーム画面の車両プール（在庫リスト＋デモカーリスト＋サービス代車リストの3シートを
    // 束ねたもの。受注リストは対象外）。api_listHomeVehiclePool（Api.gs参照）で取得する。
    // 不具合修正: 以前は区分「在庫」の在庫リストの車両だけを対象にしていたが、デモカー
    // リスト・サービス代車リストが在庫リストの区分からの自動反映ではなく各シートへの
    // 直接入力に変わったことに合わせ、この3シート全体を対象にする（現場からの要望）。
    homeVehiclePool: [],
    // ホーム画面左の絞り込みサイドバー用の状態。在庫リストの絞り込みサイドバーと同じ
    // カラー・初年度登録日・価格帯・走行距離（区分・現展示拠点・掲載状況はホームには
    // 設けない）。グリッド（モデルカード）には即時反映されるライブ絞り込み。
    homeFilters: { color: '', yearBucket: '', priceBucket: '', mileageBucket: '', category: [], location: [], listed: [], saleStatus: [] },
    // ホームの検索結果ページ（#view-homeResults）用の検索条件。homeResultsKeywordは
    // 「検索」ボタン・Enterキーで確定した完全一致キーワード、homeModelFilterは
    // 画像タップ（カード・グレードチップ）で選んだ型番一覧（完全一致・複数可）。
    // いずれも空ならホームの絞り込みサイドバーの条件のみで一覧表示する
    // （goToHomeResultsPage_、JavaScript.html参照）。
    homeResultsKeyword: '',
    homeModelFilter: [],
    notifyHoldMailTo: [], // 設定タブで編集中のメール通知先（Hold時、作業用コピー）
    notifyOrderMailTo: [], // 設定タブで編集中のメール通知先（受注確定時、作業用コピー）
    notifyErrorMailTo: [], // 設定タブで編集中のメール通知先（システムエラー通知、作業用コピー）
    themeKey: null, // 設定タブで選択中のテーマ（着せ替え）プリセットキー。サイドバーの色もこれとセットで決まる（THEME_PRESETSのsidebarColor参照）
    navHistory: [], // 「戻る」ボタン用の画面履歴（タブ名のスタック）
    allInventoryItems: [], // マイページ（Hold中の車両一覧）専用。ツールバーの検索条件に左右されない全件
    allOrders: [] // マイページ集計専用（受注リストの検索・絞り込み条件に左右されない全件）
  };

  /**
   * サーバー側（Apps Script）で想定外の例外が起きると、err.messageに
   * 「Exception: You do not have permission to call ...」「TypeError: Cannot
   * read properties of undefined」のような、英語の技術的なエラーコード相当の
   * 文字列がそのまま入ってくることがある（GAS内部・Googleサービス側の例外や、
   * コード側の想定外のバグ）。一方、アプリが意図して投げているエラー
   * （HoldService.gs・OrderService.gs・SettingsService.gs等のthrow new Error(...)）は
   * すべて日本語のメッセージにしてある。この関数は、メッセージに日本語（ひらがな・
   * カタカナ・漢字）が含まれていればそのまま表示し、含まれていない（＝アプリが
   * 意図していない技術的なエラー）場合だけ、分かりやすい日本語の代替メッセージに
   * 差し替える。元の技術的なメッセージは開発者が追えるようconsole.errorに残す。
   */
  function translateErrorMessage_(rawMessage) {
    var message = rawMessage == null ? '' : String(rawMessage);
    if (/[぀-ヿ㐀-鿿]/.test(message)) return message;
    console.error('[used-vehicle-order-app] 想定外のエラーメッセージを日本語表示に置き換えました。元のメッセージ:', message);
    if (!message) return '不明なエラーが発生しました。もう一度お試しください。';
    var lower = message.toLowerCase();
    if (lower.indexOf('permission') !== -1 || lower.indexOf('authoriz') !== -1) {
      return 'この操作を行う権限がありません。心当たりがない場合は管理者にご確認ください。';
    }
    if (lower.indexOf('timeout') !== -1 || lower.indexOf('timed out') !== -1) {
      return '処理がタイムアウトしました。通信環境をご確認のうえ、もう一度お試しください。';
    }
    if (lower.indexOf('quota') !== -1 || lower.indexOf('limit exceeded') !== -1 || lower.indexOf('rate limit') !== -1) {
      return 'Googleサービスの利用上限に達しました。しばらくしてからもう一度お試しください。';
    }
    if (lower.indexOf('network') !== -1 || lower.indexOf('fetch') !== -1 || lower.indexOf('offline') !== -1 || lower.indexOf('failed to connect') !== -1) {
      return 'サーバーに接続できませんでした。通信環境をご確認のうえ、もう一度お試しください。';
    }
    if (lower.indexOf('not found') !== -1) {
      return '対象のデータが見つかりませんでした。画面を更新してもう一度お試しください。';
    }
    return '予期しないエラーが発生しました。しばらくしてから再度お試しください（解消しない場合は管理者にご連絡ください）。';
  }

  // ===== google.script.run を Promise 化するヘルパー =====
  // サーバー側が応答しない場合にボタンやモーダルが固まって見えないよう、
  // 一定時間で必ずエラーとして解決させるタイムアウトを設ける。
  var GAS_CALL_TIMEOUT_MS = 25000;

  function gasRun(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        reject(new Error('サーバーからの応答がありません。通信環境をご確認のうえ、もう一度お試しください。'));
      }, GAS_CALL_TIMEOUT_MS);

      google.script.run
        .withSuccessHandler(function (result) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(result);
        })
        .withFailureHandler(function (err) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          // すべてのサーバー呼び出しがこの1箇所を通るため、ここで日本語化しておけば
          // 呼び出し元（.catch(err => showToast(err.message))等）は何も意識せずに
          // 常に日本語メッセージだけを表示できる。
          reject(new Error(translateErrorMessage_(err && err.message ? err.message : err)));
        })
        [fnName].apply(null, args);
    });
  }

  // ===== ボタンの多重送信防止（処理中はラベルを差し替えて無効化） =====
  function setButtonBusy(btn, busy, busyLabel) {
    if (busy) {
      if (btn.dataset.originalLabel === undefined) btn.dataset.originalLabel = btn.textContent;
      btn.textContent = busyLabel || '処理中...';
      btn.disabled = true;
    } else {
      if (btn.dataset.originalLabel !== undefined) btn.textContent = btn.dataset.originalLabel;
      btn.disabled = false;
    }
  }

  function $(id) { return document.getElementById(id); }

  /**
   * $(id).addEventListener(...) を安全に行うヘルパー。手作業でのファイル移行
   * （Apps Scriptエディタへのコピー＆貼り付け）では、html/Index.html と
   * html/JavaScript.html のバージョンが食い違っていたり、貼り付けが途中で
   * 切れたりして、本来あるはずのIDの要素が見つからない事態が起こり得る。
   * addEventListenerをnullへ直接呼ぶとその場でスクリプト全体が停止してしまい
   * （このIIFEはトップレベルで多数のイベント登録を順番に実行するため、1つでも
   * 失敗すると以降の初期化処理・起動時ローディング画面を消す処理まで丸ごと
   * 止まってしまう）、アプリが読み込み画面から進まなくなる原因になる。
   * 要素が見つからない場合は、処理を止めずコンソールに警告を出すだけに留める。
   */
  function on(id, evt, handler) {
    var el = $(id);
    if (!el) {
      console.warn('[used-vehicle-order-app] 要素が見つからないためイベント登録をスキップしました: #' + id);
      return;
    }
    el.addEventListener(evt, handler);
  }

  /**
   * 横スクロール可能な行（画面切替タブ、型／ボディタイプのクイックナビ）に、
   * 「まだ左右に続きがある」ことを示す縁のフェードを付ける。
   * 不具合修正: 以前はフェードが一切なく、端で文字が中途半端に切れて
   * 終わっているように見えるだけだったため、特にスマホでマイページ・設定
   * タブや一部のボディタイプが横スクロールで隠れていることに気づきにくかった。
   * 背景色に色を重ねるのではなくCSSのmask-imageで実現しているため、テーマ
   * （表示設定）で背景色が変わっても常に正しく見える。要素自身に
   * --fade-l／--fade-rのCSS変数を持たせ、実際にその方向へスクロールできる
   * ときだけフェードさせる。
   */
  /**
   * ページが実際にスクロールされて先頭でなくなったときだけ、固定ヘッダー
   * （.topbar・.commandbar）に薄い影を足す（body.is-scrolled、Stylesheet.html
   * 参照）。PC・タブレット幅の在庫/受注/業販受注リストは「アプリシェル」化
   * されておりwindow自体はスクロールしないため、この場合は常にfalseのまま
   * （常に影なし）で問題ない。
   */
  function initScrollElevation_() {
    function sync() {
      document.body.classList.toggle('is-scrolled', window.scrollY > 0);
    }
    window.addEventListener('scroll', sync, { passive: true });
    sync();
  }

  function initScrollFade_(id) {
    var el = $(id);
    if (!el) return;
    // 不具合修正（ビジュアル担当チームからの指摘）: 縁のフェードだけでは
    // 「まだ続きがある」ことに気づきにくいタブ行（#topbarTabs）向けに、
    // 親の.tabs__wrapがあれば矢印表示用のクラスも同時に付け外しする
    // （.tabs__moreHint、Stylesheet.html参照）。.tabs__wrapを持たない
    // 他の.scrollerではこの部分は何もしない。
    var wrap = el.closest('.tabs__wrap');
    function sync() {
      var max = el.scrollWidth - el.clientWidth;
      var hasMoreLeft = el.scrollLeft > 2;
      var hasMoreRight = el.scrollLeft < max - 2;
      el.style.setProperty('--fade-l', hasMoreLeft ? '24px' : '0px');
      el.style.setProperty('--fade-r', hasMoreRight ? '24px' : '0px');
      if (wrap) {
        wrap.classList.toggle('has-more-left', hasMoreLeft);
        wrap.classList.toggle('has-more-right', hasMoreRight);
      }
    }
    el.addEventListener('scroll', sync, { passive: true });
    window.addEventListener('resize', sync);
    sync();
  }

  function showToast(message, isError) {
    var toast = $('toast');
    toast.textContent = message;
    // classNameを丸ごと入れ替えることでhidden・is-closingも一緒に外れ、
    // Stylesheet.htmlのtoastInアニメーションが表示のたびに再生される。
    toast.className = 'toast' + (isError ? ' toast--error' : '');
    clearTimeout(showToast._t);
    clearTimeout(showToast._closeT);
    showToast._t = setTimeout(function () {
      toast.classList.add('is-closing');
      showToast._closeT = setTimeout(function () {
        toast.classList.remove('is-closing');
        toast.classList.add('hidden');
      }, 160); // Stylesheet.htmlのtoastOutのdurationと合わせる
    }, 3200);
  }

  // ===== Hold登録・受注確定 完了時の演出 =====
  // いずれも固定の案内メッセージ（バナー、5秒間表示）と、文言にふさわしい
  // 専用のド派手な演出をセットで表示する（現場からの要望）。絵文字は機種依存
  // で見た目の再現性が低いため使わず、色付きのCSS図形・発光・ウェーブ等の
  // アニメーションのみで演出する（GAS/HTML Serviceのみで完結する）。
  // 案内メッセージ自体は固定だが、絵柄の演出はアクションごとにA〜D
  // 4種類ずつ用意しており、管理者は設定タブの「Hold・受注確定の演出」
  // カードから選べる（celebrationVariants、CELEBRATION_EFFECTS参照）。
  var CELEBRATION_MESSAGES = {
    hold: ['HOLD しました！', '頑張ってください！', 'HOLD内容はマイページで確認できます'],
    order: ['おめでとうございます！', '受注内容はマイページで確認できます']
  };

  /**
   * アクション（hold/order）×バリエーション（A〜D）ごとの演出関数
   * 一覧。ラベル（Constants.gsのCELEBRATION_VARIANT_LABELSと対応）:
   *   hold:  A=エール（既定） B=応援フラッグ C=ガッツポーズ D=全力エール
   *   order: A=紙吹雪＋風船（既定） B=花火 C=祝福シャワー D=祝賀フィナーレ
   * いずれも同じCSS図形パーツ（spawnParticleBurst_・spawnParticleWave_・
   * spawnShockwave_・triggerWideConfetti_等）の組み合わせ・
   * 発生位置・タイミングを変えることで演出ごとの個性を出しており、D は
   * どのアクションでも既存パーツを最も多く重ね掛けした最も派手な演出にしている。
   */
  var CELEBRATION_EFFECTS = {
    hold: { A: triggerHoldCelebrationA_, B: triggerHoldCelebrationB_, C: triggerHoldCelebrationC_, D: triggerHoldCelebrationD_ },
    order: { A: triggerOrderCelebrationA_, B: triggerOrderCelebrationB_, C: triggerOrderCelebrationC_, D: triggerOrderCelebrationD_ }
  };

  /**
   * Hold登録・受注確定の完了直後に呼ぶ（finishActionSubmit_参照）。
   * actionTypeは state.action.type（'hold' | 'order' | 'orderFromHold'）。
   * 'orderFromHold'（Hold中の車両の受注確定）も見た目上は'order'と同じ演出にする。
   * 演出は、設定タブ（管理者限定）で選んだバリエーション（state.bootstrap.settings.
   * celebrationVariants）に応じてCELEBRATION_EFFECTSから切り替える（未選択・
   * 不正な値はA、いずれの利用者の画面でも管理者が選んだバリエーションで統一表示される）。
   */
  function showCelebration_(actionType) {
    var key = actionType === 'orderFromHold' ? 'order' : actionType;
    var messageLines = CELEBRATION_MESSAGES[key];
    if (!messageLines) return;
    showCelebrationBanner_(messageLines);
    var variants = (state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.celebrationVariants) || {};
    var variantKey = variants[key] || 'A';
    var effect = (CELEBRATION_EFFECTS[key] && CELEBRATION_EFFECTS[key][variantKey]) || CELEBRATION_EFFECTS[key].A;
    effect();
  }

  function showCelebrationBanner_(lines) {
    var el = $('celebrationBanner');
    el.innerHTML = lines.map(function (line) { return '<p>' + escapeHtml(line) + '</p>'; }).join('');
    el.classList.remove('hidden');
    // is-activeを一度外して強制的にreflowしてから付け直すことで、連続して
    // 表示した場合でもCSSアニメーション（フェードイン→表示→フェードアウト）を
    // 必ず最初から再生させる。
    el.classList.remove('is-active');
    void el.offsetWidth;
    el.classList.add('is-active');
    clearTimeout(showCelebrationBanner_._t);
    showCelebrationBanner_._t = setTimeout(function () {
      el.classList.remove('is-active');
      setTimeout(function () { el.classList.add('hidden'); }, 400);
    }, 5000);
  }

  // ----- Hold登録の演出（A=エール／B=応援フラッグ／C=ガッツポーズ／D=全力エール） -----

  /**
   * A（既定）: エール。中央での閃光→発光する衝撃波（2回）→画面下の左右2箇所
   * から打ち上がるバースト→立ち上る火花の余韻、という4段構成にすることで、
   * 「1ST HOLDしました！頑張ってください！」という景気の良い文言にふさわしい
   * 打ち上げ花火のような演出にしている。
   */
  function triggerHoldCelebrationA_() {
    flashScreen_();
    spawnShockwave_();
    setTimeout(spawnShockwave_, 180);
    var shapes = ['star', 'circle', 'ribbon'];
    [24, 76].forEach(function (x, i) {
      setTimeout(function () { spawnParticleBurst_(shapes, 26, x, 62); }, i * 140);
    });
    spawnParticleWave_(shapes, 'rise', 30);
  }

  /**
   * B: 応援フラッグ。旗を振るイメージで、リボン形の図形を中心に画面上から
   * 2波に分けて降らせる（打ち上げ系のAとは逆に、降ってくる演出にすることで
   * 見分けやすくしている）。
   */
  function triggerHoldCelebrationB_() {

  /**

  function triggerHoldCelebrationC_() {

  function triggerHoldCelebrationD_() {

  // ----- 受注確定の演出（A=紙吹雪＋風船／B=花火／C=祝福シャワー／D=祝賀フィナーレ） -----

  /**

  function triggerOrderCelebrationB_() {

  function triggerOrderCelebrationC_() {

  function triggerOrderCelebrationD_() {

  /**
   * 中央を一瞬だけ明るく光らせる「閃光」。Hold登録の演出の起点として使う。
   */
  function flashScreen_() {
    var layer = $('celebrationLayer');

    el.className = 'celebFlash';
    layer.appendChild(el);
    setTimeout(function () { el.remove(); }, 650);
  }

  /**
   * 発光しながら拡大して消えるリング（衝撃波）を1つ生成する。
   * @param {number} [originLeftVw] 中心位置（横、vw）。省略時はCSS既定の50%（画面中央）。
   * @param {number} [originTopVh] 中心位置（縦、vh）。省略時はCSS既定の50%（画面中央）。
   */
  function spawnShockwave_(originLeftVw, originTopVh) {
    var layer = $('celebrationLayer');
    var el = document.createElement('div');
    el.className = 'celebShockwave';
    if (originLeftVw !== undefined) el.style.left = originLeftVw + 'vw';
    if (originTopVh !== undefined) el.style.top = originTopVh + 'vh';
    layer.appendChild(el);
    setTimeout(function () { el.remove(); }, 1200);
  }

  function randomCelebColor_() {
    return CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
  }

  /**
   * 画面下（rise）または画面上（fall）から、指定した図形をランダムな横位置・
   * ランダムな揺れ・回転で漂わせる（Hold登録の火花の余韻の
   * エンジン）。
   */
  function spawnParticleWave_(shapes, direction, count) {
    var layer = $('celebrationLayer');
    var pieces = [];
    for (var i = 0; i < count; i++) {
      var shape = shapes[Math.floor(Math.random() * shapes.length)];
      var el = document.createElement('span');
      el.className = 'celebParticle celebParticle--' + shape + ' celebParticle--' + direction;
      el.style.left = (Math.random() * 94 + 2) + 'vw';
      var size = 14 + Math.random() * 16;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.background = randomCelebColor_();
      el.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
      el.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
      el.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
      el.style.animationDelay = (Math.random() * .7) + 's';
      layer.appendChild(el);
      pieces.push(el);
    }
    setTimeout(function () { pieces.forEach(function (el) { el.remove(); }); }, 5200);
  }

  /**
   * 指定した位置（省略時は画面中央）から放射状に飛び散らせる（Hold登録の
   * 打ち上げバースト・受注確定のランダムバースト演出用）。
   * @param {number} [originLeftVw] バーストの中心位置（横、vw）。省略時はCSS既定の50%（画面中央）。
   * @param {number} [originTopVh] バーストの中心位置（縦、vh）。省略時はCSS既定の50%（画面中央）。
   */
  function spawnParticleBurst_(shapes, count, originLeftVw, originTopVh) {
    var layer = $('celebrationLayer');
    var pieces = [];
    for (var i = 0; i < count; i++) {
      var shape = shapes[Math.floor(Math.random() * shapes.length)];
      var el = document.createElement('span');
      el.className = 'celebParticle celebParticle--' + shape + ' celebParticle--burst';
      if (originLeftVw !== undefined) el.style.left = originLeftVw + 'vw';
      if (originTopVh !== undefined) el.style.top = originTopVh + 'vh';
      var angle = (i / count) * Math.PI * 2 + Math.random() * .4;
      var dist = 140 + Math.random() * 160;
      el.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
      el.style.setProperty('--ty', (Math.sin(angle) * dist) + 'px');
      var size = 14 + Math.random() * 14;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.background = randomCelebColor_();
      el.style.animationDelay = (Math.random() * .25) + 's';
      layer.appendChild(el);
      pieces.push(el);
    }
    setTimeout(function () { pieces.forEach(function (el) { el.remove(); }); }, 2200);
  }

  var CONFETTI_COLORS = ['#1a73e8', '#34a853', '#fbbc05', '#ea4335', '#a142f4', '#00bcd4'];

  /**
   * @param {number} minVw 出現位置の左端（vw）
   * @param {number} maxVw 出現位置の右端（vw）
   */
  function spawnConfettiBatch_(layer, pieces, count, minVw, maxVw) {
    for (var i = 0; i < count; i++) {
      var el = document.createElement('div');
      el.className = 'confettiPiece';
      el.style.left = (minVw + Math.random() * (maxVw - minVw)) + 'vw';
      el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      // 一部を細長い「リボン状」にすることで、丸・角の紙吹雪だけの単調さを避ける。
      var isStreamer = Math.random() < .2;
      el.style.width = (isStreamer ? 4 + Math.random() * 3 : 6 + Math.random() * 9) + 'px';
      el.style.height = (isStreamer ? 22 + Math.random() * 14 : 10 + Math.random() * 10) + 'px';
      el.style.borderRadius = isStreamer ? '2px' : (Math.random() < .5 ? '50%' : '2px');
      // 真下に一直線に落ちるだけだと単調なので、横方向の揺れ（--drift）と
      // 複数回転（--rot）をランダムに与え、ひらひら舞い散る動きにする。
      el.style.setProperty('--drift', (Math.random() * 220 - 110) + 'px');
      el.style.setProperty('--rot', (540 + Math.random() * 900) + 'deg');
      el.style.animationDuration = (2.6 + Math.random() * 2.4) + 's';
      el.style.animationDelay = (Math.random() * .6) + 's';
      layer.appendChild(el);
      pieces.push(el);
    }
  }

  /**
   * 受注確定の紙吹雪。画面を左右2つの半分に分け、それぞれから4波に分けて
   * 降らせることで、端だけでなく画面いっぱいに紙吹雪が舞う見た目にする
   * （「受注確定はより紙吹雪を左右から画面いっぱいに」という要望に対応）。
   */
  function triggerWideConfetti_() {
    var layer = $('confettiLayer');
    layer.classList.add('is-flashing');
    var pieces = [];
    [[0, 50], [50, 100]].forEach(function (range) {
      spawnConfettiBatch_(layer, pieces, 140, range[0], range[1]);
      setTimeout(function () { spawnConfettiBatch_(layer, pieces, 120, range[0], range[1]); }, 220);
      setTimeout(function () { spawnConfettiBatch_(layer, pieces, 100, range[0], range[1]); }, 460);
      setTimeout(function () { spawnConfettiBatch_(layer, pieces, 70, range[0], range[1]); }, 720);
    });
    setTimeout(function () { layer.classList.remove('is-flashing'); }, 700);
    setTimeout(function () {
      pieces.forEach(function (el) { el.remove(); });
    }, 6400);
  }

  /**
   * 受注確定の演出。画面中央からの単発バーストではなく、画面内のランダムな
   * 位置・ランダムなタイミングで複数回（5〜7箇所）バーストを起こす
   * （現場からの要望）。位置は画面の上端・下端（ナビ・モーダル操作の邪魔に
   * なりやすい）を避け、上半分〜中央寄りに限定している。
   */
  function triggerRandomBursts_() {
    var shapes = ['star', 'circle', 'square', 'ribbon'];
    var burstCount = 5 + Math.floor(Math.random() * 3);
    for (var i = 0; i < burstCount; i++) {
      (function () {
        var x = 12 + Math.random() * 76;
        var y = 14 + Math.random() * 55;
        var delay = Math.random() * 900;
        setTimeout(function () {
          spawnParticleBurst_(shapes, 14 + Math.floor(Math.random() * 10), x, y);
        }, delay);
      })();
    }
  }

  function fillOptions(select, options, includeBlank) {
    if (!select) return;
    select.innerHTML = '';
    if (includeBlank) select.appendChild(new Option('', ''));
    (options || []).forEach(function (o) { select.appendChild(new Option(o, o)); });
  }

  function currentYearMonth() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  /**
   * コミッションの比較は必ずこの関数を通す（=== での直接比較は禁止）。
   * サーバー側から届く車両データの commission は、スプレッドシートのコミッション
   * セルがまだ「書式なしテキスト」になっていない場合、文字列ではなく数値（例: 2004）に
   * なっていることがある（holdMatchesCommission_ 参照。同じ問題のクライアント版）。
   * 一方、HTML要素の data-compare 等の属性値は常に文字列になるため、===で比較すると
   * 型が一致せず「一致しないはずなのに一致しない」不具合になる（比較機能で
   * 「この車両の情報が見つからない」と表示されてしまっていた不具合の原因）。
   * 必ず文字列化してから比較することで、型の違いに影響されないようにする。
   */
  function commissionEquals_(a, b) {
    return String(a) === String(b);
  }

  function formatDateTime(epochMs) {
    if (!epochMs) return '-';
    var d = new Date(epochMs);
    return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') +
      ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // ===== タブ切替 =====
  // コントロールパネル（.topbar）の水平タブ（.navBtn、data-tab属性）が唯一の
  // 画面切替ナビ。起動時はIndex.html側で「ホーム」に.is-activeを付けてある
  // （アプリ起動時はホーム画面から始める、という仕様）。
  function currentActiveTab_() {
    var el = document.querySelector('.navBtn.is-active');
    return el ? el.dataset.tab : 'home';
  }

  // 「戻る」ボタン用の画面履歴（タブ名のみのスタック）。メインタブのクリックなど、
  // switchToTab_を経由するすべての画面遷移で自動的に記録される。opts.skipHistoryは
  // 「戻る」ボタン自身がswitchToTab_を呼ぶ際に、戻った先をさらに履歴に積んでしまわない
  // ようにするためのフラグ。
  function switchToTab_(tabName, opts) {
    opts = opts || {};
    var current = currentActiveTab_();
    if (!opts.skipHistory && current && current !== tabName) {
      state.navHistory.push(current);
      syncNavButtons_();
    }
    document.querySelectorAll('.navBtn').forEach(function (t) { t.classList.toggle('is-active', t.dataset.tab === tabName); });
    document.querySelectorAll('main.view').forEach(function (v) { v.classList.remove('is-active'); });
    $('view-' + tabName).classList.add('is-active');
    syncHomeAnnouncementVisibility_();
    resyncActiveTabTblBodyFades_();
    // 全タブは同じ1つのdocument上でdisplay: none/blockを切り替えているだけの
    // ため、スクロール位置はタブをまたいで共有されてしまう（例: 在庫リストで
    // スクロールした状態で他のタブへ移動すると、次のタブも同じスクロール
    // 位置のまま表示され、コマンドバー等が見えない状態で開いてしまう）。
    // タブ切替のたびに常に一番上から表示されるよう、ページ全体を先頭へ
    // スクロールする。
    window.scrollTo(0, 0);
  }

  // コントロールパネル（.topbar）の水平タブ。以前のホームがあった頃の
  // コントロールパネルと同じ、1本の水平ナビにまとめている（アイコンのみの
  // 左レール・下タブバーは廃止）。
  on('topbarTabs', 'click', function (e) {
    var btn = e.target.closest('[data-tab]');
    if (!btn) return;
    switchToTab_(btn.dataset.tab);
  });

  function syncNavButtons_() {
    var disabled = state.navHistory.length === 0;
    $('btnNavBack').disabled = disabled;
  }

  function handleNavBackClick_() {
    var prev = state.navHistory.pop();
    if (!prev) return;
    switchToTab_(prev, { skipHistory: true });
    syncNavButtons_();
  }
  on('btnNavBack','click', handleNavBackClick_);

  function handleRefreshClick_() {
    var btns = [$('btnRefresh')];
    btns.forEach(function (b) { b.disabled = true; b.classList.add('is-spinning'); });
    reloadAll_().then(function () {
      showToast('最新の情報に更新しました');
    }).catch(function (err) {
      showToast(err.message, true);
    }).then(function () {
      btns.forEach(function (b) { b.disabled = false; b.classList.remove('is-spinning'); });
    });
  }
  on('btnRefresh','click', handleRefreshClick_);

  // ===== モーダル共通 =====
  document.querySelectorAll('[data-close-modal]').forEach(function (btn) {
    btn.addEventListener('click', function () { closeModal(btn.closest('.modal')); });
  });
  document.querySelectorAll('.modal').forEach(function (modal) {
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(modal); });
  });
  // モーダル表示中は背景（在庫リスト・受注リスト等）がスクロールされないよう、
  // bodyのスクロールをロックする。複数のモーダルが続けて開閉される場合
  // （詳細モーダルを閉じてすぐHold登録モーダルを開く等）でも正しく機能するよう、
  // 開いているモーダルの数をカウントし、0件になったときだけロックを解除する。
  var openModalCount = 0;
  // モーダルを閉じる際、CSSのフェード＆縮小アニメーション（.is-closing、
  // Stylesheet.html参照）が最後まで再生されてからdisplay: noneにする（hiddenを
  // 付ける）ことで、消える瞬間も自然に見えるようにする。MODAL_CLOSE_ANIM_MSは
  // Stylesheet.htmlのmodalOverlayOut/modalPanelOutのdurationと合わせること。
  var MODAL_CLOSE_ANIM_MS = 160;
  function openModal(modal) {
    clearTimeout(modal._closeTimer);
    modal.classList.remove('is-closing');
    modal.classList.remove('hidden');
    openModalCount++;
    document.body.classList.add('modal-open');
  }
  function closeModal(modal) {
    if (modal.classList.contains('hidden')) return; // 既に閉じている
    modal.classList.add('is-closing');
    modal._closeTimer = setTimeout(function () {
      modal.classList.remove('is-closing');
      modal.classList.add('hidden');
    }, MODAL_CLOSE_ANIM_MS);
    openModalCount = Math.max(0, openModalCount - 1);
    if (openModalCount === 0) document.body.classList.remove('modal-open');
  }
  // Escapeキーで開いているモーダルを閉じる（×ボタン・背景クリックと同じ操作感を
  // キーボードでも提供する）。同時に複数開くことは無い想定だが、念のため開いている
  // ものをすべて閉じる。
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.modal:not(.hidden)').forEach(closeModal);
  });

  // ===== 在庫リスト =====
  // キーワード検索だけはこれまでどおりサーバー側（searchInventory）で絞り込む。
  // Hold中の車両を除外するかどうかは、以前は「Hold済みを含む」チェックボックス
  // だったが、区分・状態・掲載状況等と同じ絞り込みサイドバーにまとめたため、
  // includeHoldは常にtrueで取得し、状態（在庫あり／Hold中／業販HOLD中）の
  // 絞り込みはrenderInventory側でクライアントだけで行う（ROUND H フェーズ2）。
  function loadInventory() {
    var filters = {
      keyword: $('inventoryKeyword').value,
      includeHold: true
    };
    return gasRun('api_listInventory', filters).then(function (groups) {
      var items = (groups && groups[0] && groups[0].items) || [];
      state.inventoryItems = items;
      renderInventoryFilterSidebar_();
      renderInventory();
    }).catch(function (err) { showToast(err.message, true); });
  }

  // ----- 絞り込みサイドバーの各項目（区分・状態・掲載状況・年式・価格帯・
  //       走行距離）を判定する純粋関数。既存のスプレッドシート列だけを使い、
  //       新規列は追加しない。 -----
  function inventoryStatusOf_(v) {
    if (v.holdStatus !== 'hold') return 'available';
    return (v.holdHoldType && v.holdHoldType !== 'normal') ? 'wholesale' : 'hold';
  }
  function inventoryListedKeys_(v) {
    var keys = [];
    if (v.listedCarsensor) keys.push('carsensor');
    if (v.listedGoonet) keys.push('goonet');
    if (!keys.length) keys.push('unlisted');
    return keys;
  }
  function inventoryYearOf_(v) {
    var m = String(v.firstRegistrationDate || '').match(/(\d{4})/);
    return m ? Number(m[1]) : null;
  }
  var YEAR_BUCKET_OPTIONS = [
    { value: '', label: '指定なし' },
    { value: 'recent', label: '2年以内' },
    { value: 'mid', label: '3〜5年' },
    { value: 'old', label: '6〜10年' },
    { value: 'veryOld', label: '10年超' }
  ];
  function yearBucketOf_(v) {
    var y = inventoryYearOf_(v);
    if (y === null) return '';
    var age = new Date().getFullYear() - y;
    if (age <= 2) return 'recent';
    if (age <= 5) return 'mid';
    if (age <= 10) return 'old';
    return 'veryOld';
  }
  var PRICE_BUCKET_OPTIONS = [
    { value: '', label: '指定なし' },
    { value: 'p1', label: '300万円以下' },
    { value: 'p2', label: '300〜500万円' },
    { value: 'p3', label: '500〜800万円' },
    { value: 'p4', label: '800万円以上' }
  ];
  function priceBucketOf_(v) {
    var p = Number(v.salePrice);
    if (!p) return '';
    if (p <= 3000000) return 'p1';
    if (p <= 5000000) return 'p2';
    if (p <= 8000000) return 'p3';
    return 'p4';
  }
  var MILEAGE_BUCKET_OPTIONS = [
    { value: '', label: '指定なし' },
    { value: 'm1', label: '1万km以下' },
    { value: 'm2', label: '1〜3万km' },
    { value: 'm3', label: '3〜5万km' },
    { value: 'm4', label: '5万km以上' }
  ];
  function mileageBucketOf_(v) {
    var m = Number(v.mileage);
    if (isNaN(m)) return '';
    if (m <= 10000) return 'm1';
    if (m <= 30000) return 'm2';
    if (m <= 50000) return 'm3';
    return 'm4';
  }
  var INVENTORY_SORT_OPTIONS = [
    { value: '', label: '指定なし' },
    { value: 'priceAsc', label: '価格が安い順' },
    { value: 'priceDesc', label: '価格が高い順' },
    { value: 'yearDesc', label: '初年度登録日が新しい順' },
    { value: 'yearAsc', label: '初年度登録日が古い順' },
    { value: 'mileageAsc', label: '走行距離が少ない順' }
  ];

  // モデル名（v.model）に含まれるキーワードから、設定タブ（管理者限定）で
  // 登録済みのボディタイプ紐付けルール（state.bootstrap.settings.
  // modelBodyTypeRules、大文字小文字を区別せず部分一致）に基づいて該当する
  // ボディタイプ（複数可）を返す（純粋関数）。ルール未登録・一致無しなら
  // 空配列。
  function modelBodyTypesOf_(model) {
    var m = String(model || '').toLowerCase();
    var rules = (state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.modelBodyTypeRules) || [];
    var types = [];
    rules.forEach(function (r) {
      if (r && r.keyword && m.indexOf(String(r.keyword).toLowerCase()) !== -1 && types.indexOf(r.bodyType) === -1) {
        types.push(r.bodyType);
      }
    });
    return types;
  }

  /**
   * 型番（在庫リストのMODEL列の値。例:「C200」「C43T」「CLA18」「GLC2DC」）の
   * 先頭にあるアルファベットの連続部分だけを取り出す（純粋関数）。Mercedes系の
   * 型番は「クラス名（アルファベット）＋グレード番号（数字）＋任意のサフィックス」
   * という構成のため、これでクラス名部分（「C」「CLA」「GLC」等）を正確に切り出せる。
   */
  function leadingAlphaPrefix_(modelValue) {
    var m = String(modelValue || '').match(/^[A-Za-z]+/);
    return m ? m[0] : '';
  }

  /**
   * 在庫リストの「MODEL」列の値に対する、指定の車両画像エントリの自動判定条件の
   * 「具体性スコア」を計算する（純粋関数）。条件を満たさない場合は-1（不一致）。
   * gradePrefixは、型番先頭のアルファベット連続部分（leadingAlphaPrefix_）と
   * 「完全一致」（大文字小文字は区別しない）した場合のみ一致とする（単純な前方一致
   * にすると、gradePrefix「C」が「CLA18」まで拾ってしまい「C20」と「CLA18」を
   * 区別できなくなるため）。gradeMarker（含む文字列）は、プレフィックスを除いた
   * 残りの部分に「その文字列がどこかに含まれていれば」一致とする（大文字小文字は
   * 区別しない）。スコアは、gradeMarkerを設定していれば大きく加点したうえで
   * gradeMarkerの文字数も加える（gradeMarker設定済みのエントリを、同じgradePrefixを
   * 持つ未設定のエントリより優先し、gradeMarker同士では、より長い＝具体的な文字列を
   * 持つ方を優先する）。
   */
  function gradeRuleSpecificity_(modelValue, entry) {
    if (!entry.gradePrefix || !modelValue) return -1;
    if (leadingAlphaPrefix_(modelValue).toLowerCase() !== entry.gradePrefix.toLowerCase()) return -1;
    if (entry.gradeMarker) {
      var remainder = modelValue.slice(entry.gradePrefix.length);
      if (remainder.toLowerCase().indexOf(entry.gradeMarker.toLowerCase()) === -1) return -1;
      return 10000 + entry.gradePrefix.length + entry.gradeMarker.length;
    }
    return entry.gradePrefix.length;
  }

  /**
   * 在庫リストの「MODEL」列の値が、指定の車両画像エントリの自動判定条件に一致
   * するかどうかを判定する（純粋関数）。同じ値に複数のエントリの条件が一致しうる
   * 場合（例:「C18T」はgradePrefix「C」（gradeMarker無し・受け皿）の行にも、
   * gradePrefix「C」+gradeMarker「T」の行にも一致する）、gradeRuleSpecificity_で
   * 最もスコアの高い（＝最も具体的な条件の）エントリだけがその値を拾い、他の
   * エントリには重複してカウントされないようにする。
   */
  function matchesGradeRule_(modelValue, entry, allEntries) {
    var score = gradeRuleSpecificity_(modelValue, entry);
    if (score < 0) return false;
    var isMostSpecific = !(allEntries || []).some(function (other) {
      return other !== entry && gradeRuleSpecificity_(modelValue, other) > score;
    });
    return isMostSpecific;
  }

  /**
   * 車両画像1件分の在庫台数を集計する（純粋関数）。gradePrefixが設定されている
   * 場合は、在庫リストに実際にある型番のうちmatchesGradeRule_に一致するものを
   * 自動的に拾い集めて数える。gradePrefixが未設定の場合は、モデル表示名そのものを
   * 在庫リストのMODEL列と直接照合する（グレードの概念を使わない単一モデル向けの
   * フォールバック）。
   */
  function modelCountForEntry_(entry, allItems, allModelPhotos) {
    if (!entry.gradePrefix) {
      return allItems.filter(function (v) { return v.model === entry.model; }).length;
    }
    return allItems.filter(function (v) { return matchesGradeRule_(v.model, entry, allModelPhotos); }).length;
  }

  /**
   * 車両画像1件分（モデル・グレードまとめ）に一致する在庫の「販売価格」の
   * 最低額を返す（純粋関数、価格未入力の車両は対象外）。ホームのカードに
   * 価格の目安（最低価格〜）を表示するために使う（現場からの要望「ホームに
   * も価格の目安が欲しい」。在庫リスト・受注リスト等は従来どおり1台ごとの
   * 価格をそのまま列表示するため、ここはホーム専用）。1件も価格未入力なら
   * nullを返す。
   */
  function minSalePriceForEntry_(entry, allItems, allModelPhotos) {
    var matched = !entry.gradePrefix
      ? allItems.filter(function (v) { return v.model === entry.model; })
      : allItems.filter(function (v) { return matchesGradeRule_(v.model, entry, allModelPhotos); });
    var prices = matched.map(function (v) { return Number(v.salePrice); }).filter(function (n) { return !isNaN(n) && n > 0; });
    if (!prices.length) return null;
    return Math.min.apply(null, prices);
  }

  /**
   * 車両画像1件分の自動判定条件に一致する、在庫リストに実際にある型番の一覧を
   * 重複なく返す（純粋関数）。ホームのカード内のグレードチップ・クリック時の
   * 在庫リストへの絞り込みに使う。
   */
  function matchedModelsForEntry_(entry, allItems, allModelPhotos) {
    if (!entry.gradePrefix) return [entry.model];
    var seen = {};
    var result = [];
    allItems.forEach(function (v) {
      if (!matchesGradeRule_(v.model, entry, allModelPhotos)) return;
      if (seen[v.model]) return;
      seen[v.model] = true;
      result.push(v.model);
    });
    return result;
  }

  /**
   * 在庫リストのMODEL列にある値のうち、どの車両画像エントリの自動判定条件にも
   * 一致しないもの（＝代表写真がまだ登録されていないモデル）を、写真無しの
   * プレースホルダーエントリとして返す（純粋関数）。販売モデルの数が限られて
   * いるという運用前提（現場からの要望）のもと、写真の用意が追いついていない
   * モデルもホームから漏れなく見えるようにする。gradePrefixは持たせず、在庫
   * リストのMODEL値そのものをモデル名として直接照合する単一モデル扱いにする
   * （元の型番をそのまま表示名にする以上、意味のあるグレード分類はできないため）。
   */
  function unphotographedModelEntries_(allItems, allModelPhotos) {
    var seen = {};
    var result = [];
    allItems.forEach(function (v) {
      var model = v.model;
      if (!model || seen[model]) return;
      seen[model] = true;
      var covered = allModelPhotos.some(function (entry) {
        return entry.gradePrefix
          ? matchesGradeRule_(model, entry, allModelPhotos)
          : entry.model === model;
      });
      if (covered) return;
      result.push({ model: model, photoUrl: '', gradePrefix: '', gradeMarker: '', bodyType: '' });
    });
    return result;
  }

  /**
   * ホーム画面の在庫台数表示（純粋関数）。0台の場合は数字の「在庫0台」ではなく
   * 「在庫がありません」という文言にし、在庫が無いことをひと目でわかるようにする。
   */
  function homeStockCountText_(total) {
    return total === 0 ? '在庫がありません' : '在庫' + total + '台';
  }

  function applyInventoryFilters_(items) {
    var f = state.inventoryFilters;
    return items.filter(function (v) {
      if (f.category.length && f.category.indexOf(v.category || '') === -1) return false;
      if (f.location.length && f.location.indexOf(v.currentDisplayLocation || '') === -1) return false;
      if (f.listed.length) {
        var keys = inventoryListedKeys_(v);
        if (!keys.some(function (k) { return f.listed.indexOf(k) !== -1; })) return false;
      }
      if (f.color && (v.exteriorColor || '') !== f.color) return false;
      if (f.yearBucket && yearBucketOf_(v) !== f.yearBucket) return false;
      if (f.priceBucket && priceBucketOf_(v) !== f.priceBucket) return false;
      if (f.mileageBucket && mileageBucketOf_(v) !== f.mileageBucket) return false;
      return true;
    });
  }

  /**
   * 絞り込みサイドバーの「区分」「現展示拠点」等、実データから動的に選択肢を
   * 作るチェックボックス一覧（件数付き・ラベル昇順）のHTMLを組み立てる
   * （純粋関数）。在庫リスト・受注リスト・業販受注リスト・デモカーリスト・
   * サービス代車リストで共通して使う（現場からの要望「現展示拠点をチェック式で
   * 絞り込めるようにしてほしい。全リストに反映してほしい」）。
   */
  function checkboxFilterOptionsHtml_(items, fieldKey, checkedValues) {
    var counts = {};
    items.forEach(function (item) {
      // 不具合修正: 値（value属性）は空文字のまま集計し、表示ラベルだけ「未設定」に
      // する。以前は空文字を表示用の文字列「未設定」にまとめて集計していたため、
      // チェック時の絞り込み判定（applyInventoryFilters_等のv[fieldKey] || ''との
      // 比較）と値がずれ、「未設定」をチェックしても何も絞り込まれない不具合が
      // あった（ホームの「区分」はデモカー・サービス代車の車両がすべて未設定に
      // 該当するため、この不具合が顕在化しやすい）。
      var v = item[fieldKey] || '';
      counts[v] = (counts[v] || 0) + 1;
    });
    var values = Object.keys(counts).sort();
    return values.map(function (v) {
      var checked = checkedValues.indexOf(v) !== -1;
      var label = v || '未設定';
      return '<label class="filterCheck"><input type="checkbox" value="' + escapeHtml(v) + '"' + (checked ? ' checked' : '') + '> ' +
        escapeHtml(label) + '<span class="filterCheck__cnt">' + counts[v] + '</span></label>';
    }).join('');
  }

  /**
   * checkboxFilterOptionsHtml_で作ったチェックボックスの選択値（複数可）で
   * 一覧を絞り込む（純粋関数）。何もチェックされていなければ絞り込まない。
   * 受注リスト・業販受注リストの「現展示拠点」絞り込みで使う（在庫リスト・
   * デモカーリスト・サービス代車リストは既存のapplyInventoryFilters_・
   * applyCarTrackingFilters_に同じロジックを直接組み込み済み）。
   */
  function filterByCheckedValues_(items, fieldKey, checkedValues) {
    if (!checkedValues.length) return items;
    return items.filter(function (item) { return checkedValues.indexOf(item[fieldKey] || '') !== -1; });
  }

  // ===== 絞り込みサイドバーの行表示・サマリー（全リスト共通） =====
  // 現場からのデザイン案の選定を受けて適用した「改訂案1：ライン区切り」。
  // 各リストの絞り込みサイドバーは、項目を.filterSidebar__row（1列に1項目）で
  // 並べ、既存のセレクト・ラジオ・チェックボックス・テキスト入力はそのまま使う。
  // syncFilterRowsAndSummary_を各リストのrender関数の末尾から呼ぶだけで、
  // 行の強調表示（.is-active）と「絞り込み中」サマリー（.filterSidebar__activeBar）が
  // 自動的に同期される。

  /**
   * 値を変更したあと、そのコントロールに元々登録済みの'change'ハンドラ
   * （各リストの絞り込みロジック）をそのまま発火させる。'change'イベントは
   * 既定でバブリングするため、チェックボックス個別ではなくコンテナ単位で
   * 委譲登録しているハンドラ（区分・現展示拠点等）にも届く。
   */
  function dispatchChange_(el) {
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }

  /**
   * チェックボックス／ラジオの表示ラベルを取得する（純粋関数に近いDOM読み取り）。
   * 件数バッジ（.filterCheck__cnt）が付いていても、ラベル本文だけを取り出す。
   */
  function checkboxDisplayLabel_(input) {
    var label = input.closest('label');
    if (!label) return input.value;
    var clone = label.cloneNode(true);
    clone.querySelectorAll('input, .filterCheck__cnt').forEach(function (el) { el.remove(); });
    return clone.textContent.trim();
  }

  /**
   * 絞り込みサイドバーの行（.filterSidebar__row）1件分から、実際に効いている
   * 絞り込み条件を集める。select・ラジオ・チェックボックス・テキスト入力の
   * いずれにも対応する（在庫リストの区分・現展示拠点、受注リストのグループ化・
   * 担当者、業販受注リストの販売先等、全リストの行で共通して使う）。
   */
  function filterRowActiveEntries_(rowEl) {
    var entries = [];
    rowEl.querySelectorAll('select').forEach(function (sel) {
      if (!sel.value) return;
      entries.push({ label: sel.options[sel.selectedIndex].text, clear: function () { sel.value = ''; dispatchChange_(sel); } });
    });
    rowEl.querySelectorAll('input[type="radio"]:checked').forEach(function (r) {
      if (!r.value) return;
      entries.push({
        label: checkboxDisplayLabel_(r),
        clear: function () {
          var def = rowEl.querySelector('input[type="radio"][value=""]');
          if (def) { def.checked = true; dispatchChange_(def); }
        }
      });
    });
    rowEl.querySelectorAll('input[type="checkbox"]:checked').forEach(function (c) {
      entries.push({ label: checkboxDisplayLabel_(c), clear: function () { c.checked = false; dispatchChange_(c); } });
    });
    rowEl.querySelectorAll('input[type="text"], input[type="search"]').forEach(function (t) {
      if (!t.value.trim()) return;
      entries.push({ label: t.value.trim(), clear: function () { t.value = ''; dispatchChange_(t); } });
    });
    // ホームのタイプ・区分・現展示拠点・掲載状況・販売状況は、現場からの要望
    // 「現在の形式（セレクト）で全て選択肢をドロップ形式にしてほしい」を受けて
    // すべてselect／チェックボックス（.multiDropdown__panel内、折りたたまれていても
    // DOM上は存在する）に統一したため、上のselect・チェックボックスの判定だけで
    // 拾いきれる（専用の判定は不要）。
    return entries;
  }

  /**
   * 絞り込みサイドバー1枚分、行の強調表示（.is-active）と「絞り込み中」
   * サマリー（.filterSidebar__activeBar）をまとめて同期する。各リストの
   * 一覧再描画関数（renderInventory・renderOrders等）の末尾から呼ぶ。
   * @param {string} rowsContainerId .filterSidebar__rowsを持つ要素のID
   * @param {string} activeBarId .filterSidebar__activeBarのID
   * @param {string} clearBtnId 「すべてクリア」から呼ぶ、既存の「クリア」ボタンのID
   * @param {boolean=} collapseWhenEmpty 絞り込み中の項目が無いとき、「絞り込み
   *   条件はありません」の案内文を出す代わりにバー自体を非表示にする。ホームの
   *   絞り込みパネルは項目数が多く、画面の高さに収める必要があるため使う
   *   （現場からの要望「左コントロールパネル内は固定のサイズで、スライドなしに
   *   してほしい」）。他のリストは項目数が少なく収まるため、これまでどおり
   *   案内文を出す。
   */
  function syncFilterRowsAndSummary_(rowsContainerId, activeBarId, clearBtnId, collapseWhenEmpty) {
    var rowsContainer = $(rowsContainerId);
    var bar = $(activeBarId);
    if (!rowsContainer || !bar) return;
    var allEntries = [];
    rowsContainer.querySelectorAll('.filterSidebar__row').forEach(function (row) {
      var entries = filterRowActiveEntries_(row);
      row.classList.toggle('is-active', entries.length > 0);
      allEntries = allEntries.concat(entries);
    });
    if (!allEntries.length) {
      if (collapseWhenEmpty) {
        bar.innerHTML = '';
        bar.classList.add('hidden');
      } else {
        bar.classList.remove('hidden');
        bar.innerHTML = '<span class="filterSidebar__activeEmpty">絞り込み条件はありません</span>';
      }
      return;
    }
    bar.classList.remove('hidden');
    bar.innerHTML = allEntries.map(function (en, i) {
      return '<button type="button" class="filterSidebar__activeChip" data-idx="' + i + '"><span class="label">' + escapeHtml(en.label) + '</span><span class="x">×</span></button>';
    }).join('') + '<button type="button" class="filterSidebar__activeClearAll">すべてクリア</button>';
    bar.querySelectorAll('.filterSidebar__activeChip').forEach(function (chip, i) {
      chip.addEventListener('click', function () { allEntries[i].clear(); });
    });
    var clearAllBtn = bar.querySelector('.filterSidebar__activeClearAll');
    if (clearAllBtn) clearAllBtn.addEventListener('click', function () {
      var btn = $(clearBtnId);
      if (btn) btn.click();
    });
  }

  /**
   * デモカーリスト・サービス代車リストの絞り込みサイドバー用（純粋関数）。
   * 在庫リストと同じカラー・初年度登録日・価格帯・走行距離に加え、このリスト
   * 専用の販売状況（saleStatus、在庫中／販売済み）で絞り込む。Hold・掲載状況の
   * 概念は持たないため対象外（在庫リストのみに残す、現場からの要望）。
   */
  function applyCarTrackingFilters_(items, f) {
    return items.filter(function (v) {
      if (f.status.length && f.status.indexOf(v.saleStatus || '') === -1) return false;
      if (f.location.length && f.location.indexOf(v.currentDisplayLocation || '') === -1) return false;
      if (f.color && (v.exteriorColor || '') !== f.color) return false;
      if (f.yearBucket && yearBucketOf_(v) !== f.yearBucket) return false;
      if (f.priceBucket && priceBucketOf_(v) !== f.priceBucket) return false;
      if (f.mileageBucket && mileageBucketOf_(v) !== f.mileageBucket) return false;
      return true;
    });
  }

  /**
   * ホーム画面左の絞り込みサイドバー用（純粋関数）。在庫リストと同じカラー・
   * 初年度登録日・価格帯・走行距離で、3シート分の車両プール（在庫リスト＋
   * デモカーリスト＋サービス代車リスト）を絞り込む。不具合修正: キーワードは
   * ここでは扱わない（以前はここで部分一致のライブ絞り込みをしていたが、現場からの
   * 要望「検索ボタンは文字列の完全一致のみの検索にしてほしい」を受け、キーワードは
   * 「検索」ボタン押下時にhomeExactKeywordMatches_で完全一致検索し、専用の
   * 検索結果ページへ遷移する形に変更したため）。
   */
  function applyHomeFilters_(items) {
    var f = state.homeFilters;
    return items.filter(function (v) {
      if (f.color && (v.exteriorColor || '') !== f.color) return false;
      if (f.yearBucket && yearBucketOf_(v) !== f.yearBucket) return false;
      if (f.priceBucket && priceBucketOf_(v) !== f.priceBucket) return false;
      if (f.mileageBucket && mileageBucketOf_(v) !== f.mileageBucket) return false;
      // 区分・掲載状況は在庫リストの車両（'holdStatus' in v）にしか無い概念、
      // 販売状況はデモカー・サービス代車の車両にしか無い概念のため、チェックした
      // 場合はその概念を持たない方の車両が自動的に対象外になる（applyInventoryFilters_・
      // applyCarTrackingFilters_と同じ判定方法）。
      if (f.category.length && f.category.indexOf(v.category || '') === -1) return false;
      if (f.location.length && f.location.indexOf(v.currentDisplayLocation || '') === -1) return false;
      if (f.listed.length) {
        var keys = inventoryListedKeys_(v);
        if (!keys.some(function (k) { return f.listed.indexOf(k) !== -1; })) return false;
      }
      if (f.saleStatus.length && f.saleStatus.indexOf(v.saleStatus || '') === -1) return false;
      return true;
    });
  }

  /**
   * ホーム画面の絞り込みサイドバーの「カラー」選択肢を、取得済みの車両プールから
   * 動的に作り直す（在庫リストのrenderInventoryFilterSidebar_と同じ考え方。年式・
   * 価格帯・走行距離は固定の選択肢のためIndex.html側に直接書いている）。
   */
  function renderHomeFilterSidebar_() {
    var items = state.homeVehiclePool || [];
    // 区分・現展示拠点・掲載状況・販売状況（.multiDropdown）のボタンラベル・
    // ポップオーバーの中身を、取得済みの車両プールに合わせて作り直す
    // （setupHomeMultiDropdown_、本ファイル参照）。
    syncAllHomeMultiDropdowns_();
    var colors = [];
    items.forEach(function (v) { if (v.exteriorColor && colors.indexOf(v.exteriorColor) === -1) colors.push(v.exteriorColor); });
    colors.sort();
    var colorSelect = $('homeColorFilter');
    var currentColor = state.homeFilters.color;
    colorSelect.innerHTML = '<option value="">指定なし</option>' + colors.map(function (c) {
      return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>';
    }).join('');
    colorSelect.value = colors.indexOf(currentColor) !== -1 ? currentColor : '';
    if (colorSelect.value !== currentColor) state.homeFilters.color = colorSelect.value;
    syncHomeFilterClearVisibility_();
  }

  function syncHomeFilterClearVisibility_() {
    var f = state.homeFilters;
    var hasAny = !!f.color || !!f.yearBucket || !!f.priceBucket || !!f.mileageBucket ||
      f.category.length > 0 || f.location.length > 0 || f.listed.length > 0 || f.saleStatus.length > 0;
    $('btnHomeFilterClear').classList.toggle('hidden', !hasAny);
  }

  /**
   * ホームの「検索」ボタン（またはEnterキー）専用の、文字列の完全一致判定
   * （純粋関数）。不具合修正: 以前はmatchesAnyField_（部分一致）を使っていたが、
   * 現場からの要望「検索ボタンは文字列の完全一致のみの検索にしてほしい」を受けて
   * 専用の完全一致判定に変更した。登録番号は各マスのいずれかに完全一致、または
   * plateText_が組み立てる「地域 分類番号 かな 一連番号」形式の文字列全体への
   * 完全一致にも対応する（どちらを入力されても検索できるようにするため）。
   */
  function homeExactKeywordMatches_(v, keyword) {
    var kw = String(keyword || '').trim().toLowerCase();
    if (!kw) return true;
    var values = [v.model, v.commission, v.ocn, v.chassisNumberLast4,
      v.plateRegion, v.plateClass, v.plateKana, v.plateNumber, plateText_(v)];
    return values.some(function (val) { return String(val || '').toLowerCase() === kw; });
  }

  /**
   * 画像タップ（カード・グレードチップ）で選んだ型番（state.homeModelFilter、
   * 完全一致・複数可）で、検索結果一覧をさらに絞り込む（純粋関数）。何も
   * タップしていない場合（空配列）は絞り込まない。
   */
  function applyHomeModelFilter_(items) {
    if (!state.homeModelFilter.length) return items;
    return items.filter(function (v) { return state.homeModelFilter.indexOf(v.model) !== -1; });
  }

  /**
   * ホームの「検索結果」専用ページ（#view-homeResults。在庫リスト＋デモカーリスト＋
   * サービス代車リストを横断した個々の車両の一覧）。ホームの絞り込みサイドバー
   * （カラー・初年度登録日・価格帯・走行距離）の条件をまず適用し、そのうえで
   * state.homeResultsKeyword（完全一致キーワード、検索ボタンから）・
   * state.homeModelFilter（画像タップで選んだ型番）があればさらに絞り込む。
   */
  function renderHomeResultsPage_() {
    var pool = applyHomeFilters_(state.homeVehiclePool || []);
    if (state.homeResultsKeyword) {
      pool = pool.filter(function (v) { return homeExactKeywordMatches_(v, state.homeResultsKeyword); });
    }
    var filtered = applyHomeModelFilter_(pool);
    $('homeResultsEmpty').classList.toggle('hidden', filtered.length > 0);
    // 不具合修正（UX・情報設計担当からの指摘）: キーワード検索は完全一致のため、
    // 部分的に合っているだけでは0件になり「本当に在庫が無い」と誤解されやすい。
    // キーワード検索で0件のときだけ、完全一致である旨を添えた文言に差し替える
    // （画像タップ・絞り込み条件のみでの0件は従来どおりの文言のまま）。
    if (filtered.length === 0) {
      var emptyMsg = $('homeResultsEmpty').querySelector('p');
      if (emptyMsg) {
        emptyMsg.textContent = state.homeResultsKeyword
          ? '「' + state.homeResultsKeyword + '」に完全一致する車両が見つかりませんでした。入力した文字列の一部だけが合っている場合はヒットしません。'
          : '該当する車両がありません';
      }
    }
    $('homeResultsCount').textContent = filtered.length ? '該当 ' + filtered.length + '台' : '';
    $('homeResultsSearchDesc').textContent = homeResultsSearchDescText_();
    // 操作列（Hold・受注等）を持つため、tbl--cartrackではなくtbl--inventoryと
    // 同じ列幅構成（inventoryTableHeaderHtml_と同じ12列）を使う。
    $('homeResultsList').innerHTML = tableListHtml_('tbl--inventory', homeResultsTableHeaderHtml_(), filtered, homeResultRowHtml_);
    wireTableHeaderScrollSync_($('homeResultsList'));
    $('btnHomeModelFilterClear').classList.toggle('hidden', !state.homeModelFilter.length && !state.homeResultsKeyword);
  }

  /** 検索結果ページ上部に表示する、現在の検索条件の説明文（純粋関数）。 */
  function homeResultsSearchDescText_() {
    if (state.homeModelFilter.length) return '「' + state.homeModelFilter.join('」「') + '」の検索結果です。';
    if (state.homeResultsKeyword) return '「' + state.homeResultsKeyword + '」の検索結果です（完全一致）。';
    return 'ホームの絞り込み条件に一致する車両の一覧です。';
  }

  /**
   * ホームの検索結果ページへ遷移する。キーワード検索（検索ボタン・Enterキー）・
   * 画像タップ（カード・グレードチップ）のいずれもここを経由する。
   * @param {Object} opts { keyword: string, models: Array<string> }
   */
  function goToHomeResultsPage_(opts) {
    state.homeResultsKeyword = (opts && opts.keyword) || '';
    state.homeModelFilter = (opts && opts.models) || [];
    renderHomeResultsPage_();
    switchToTab_('homeResults');
  }

  function sortInventoryItems_(items) {
    var key = state.inventorySort;
    if (!key) return items;
    function priceOf(v) { var n = Number(v.salePrice); return isNaN(n) ? null : n; }
    function mileageOf(v) { var n = Number(v.mileage); return isNaN(n) ? null : n; }
    function cmp(a, b, dir) {
      if (a === null && b === null) return 0;
      if (a === null) return 1;
      if (b === null) return -1;
      return dir === 'asc' ? a - b : b - a;
    }
    var sorted = items.slice();
    sorted.sort(function (x, y) {
      switch (key) {
        case 'priceAsc': return cmp(priceOf(x), priceOf(y), 'asc');
        case 'priceDesc': return cmp(priceOf(x), priceOf(y), 'desc');
        case 'yearDesc': return cmp(inventoryYearOf_(x), inventoryYearOf_(y), 'desc');
        case 'yearAsc': return cmp(inventoryYearOf_(x), inventoryYearOf_(y), 'asc');
        case 'mileageAsc': return cmp(mileageOf(x), mileageOf(y), 'asc');
        default: return 0;
      }
    });
    return sorted;
  }

  /**
   * 絞り込みサイドバーのうち、実データから動的に選択肢を作る「区分」「現展示
   * 拠点」（チェックボックス・件数付き）を、在庫リスト取得のたびに作り直す。
   * 掲載状況・年式・価格帯・走行距離は固定の選択肢のためIndex.html側に直接
   * 書いており、ここでは触らない。モデル・ボディタイプの絞り込みはサイドバー
   * から廃止した（モデルは上の自由検索、ボディタイプは.commandbarのクイック
   * ナビへ移動。現場からの要望「サイドの絞り込みをシンプルにしてほしい」）。
   */
  function renderInventoryFilterSidebar_() {
    var items = state.inventoryItems || [];

    $('inventoryCategoryFilter').innerHTML = checkboxFilterOptionsHtml_(items, 'category', state.inventoryFilters.category);
    $('inventoryLocationFilter').innerHTML = checkboxFilterOptionsHtml_(items, 'currentDisplayLocation', state.inventoryFilters.location);

    var colors = [];
    items.forEach(function (v) { if (v.exteriorColor && colors.indexOf(v.exteriorColor) === -1) colors.push(v.exteriorColor); });
    colors.sort();
    var colorSelect = $('inventoryColorFilter');
    var currentColor = state.inventoryFilters.color;
    colorSelect.innerHTML = '<option value="">指定なし</option>' + colors.map(function (c) {
      return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>';
    }).join('');
    colorSelect.value = colors.indexOf(currentColor) !== -1 ? currentColor : '';
    if (colorSelect.value !== currentColor) state.inventoryFilters.color = colorSelect.value;

    syncInventoryFilterClearVisibility_();
  }

  // 「クリア」リンクの表示・非表示を、現在の絞り込み状態に合わせて更新する
  // （何か1つでも絞り込みが効いていれば表示する）。
  function syncInventoryFilterClearVisibility_() {
    var f = state.inventoryFilters;
    var hasAny = !!f.color || f.category.length > 0 || f.location.length > 0 ||
      f.listed.length > 0 || !!f.yearBucket || !!f.priceBucket || !!f.mileageBucket;
    $('btnInventoryFilterClear').classList.toggle('hidden', !hasAny);
  }

  function fillStaticSelectOptions_(id, options, current) {
    var select = $(id);
    select.innerHTML = options.map(function (o) {
      return '<option value="' + escapeHtml(o.value) + '">' + escapeHtml(o.label) + '</option>';
    }).join('');
    select.value = current || '';
  }
  fillStaticSelectOptions_('inventoryYearFilter', YEAR_BUCKET_OPTIONS, state.inventoryFilters.yearBucket);
  fillStaticSelectOptions_('inventoryPriceFilter', PRICE_BUCKET_OPTIONS, state.inventoryFilters.priceBucket);
  fillStaticSelectOptions_('inventoryMileageFilter', MILEAGE_BUCKET_OPTIONS, state.inventoryFilters.mileageBucket);
  fillStaticSelectOptions_('inventorySort', INVENTORY_SORT_OPTIONS, state.inventorySort);
  fillStaticSelectOptions_('homeYearFilter', YEAR_BUCKET_OPTIONS, state.homeFilters.yearBucket);
  fillStaticSelectOptions_('homePriceFilter', PRICE_BUCKET_OPTIONS, state.homeFilters.priceBucket);
  fillStaticSelectOptions_('homeMileageFilter', MILEAGE_BUCKET_OPTIONS, state.homeFilters.mileageBucket);

  // dd（値）はカード・詳細モーダルどちらでも折り返さず省略記号にする方針
  // （.card__metaGrid dd、Stylesheet.html参照。折り返すとカードごとに高さが
  // ばらつくため）。旧使用拠点・現展示拠点・オプション等、現場の入力次第で
  // 長くなり得る項目は省略記号で見えなくなった部分が確認できないままになって
  // しまうため、title属性でホバー時に全文を確認できるようにしておく。
  function metaRow_(label, value, extraClass) {
    var text = value || '-';
    var cls = extraClass ? ' class="' + extraClass + '"' : '';
    return '<div' + cls + '><dt>' + label + '</dt><dd title="' + escapeHtml(text) + '">' + escapeHtml(text) + '</dd></div>';
  }

  /**
   * 車検満了日が近い車両は、更新手続きの見落としを防ぐため、タイル・枠の色を
   * 変えて目立たせる（現場からの要望）。しきい値は業務上の目安として、満了日
   * まで30日以内（既に満了済みを含む）を赤（is-danger）、90日以内を黄
   * （is-warning）とし、それ以外は通常表示のまま（''）にする。しきい値を
   * 変更したい場合はこの関数だけ調整すればよい。
   */
  function inspectionExpiryTone_(dateStr) {
    if (!dateStr) return '';
    var expiry = new Date(dateStr);
    if (isNaN(expiry.getTime())) return '';
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    expiry.setHours(0, 0, 0, 0);
    var daysLeft = Math.round((expiry.getTime() - today.getTime()) / (24 * 60 * 60 * 1000));
    if (daysLeft <= 30) return 'is-danger';
    if (daysLeft <= 90) return 'is-warning';
    return '';
  }

  // metaRow_と異なり省略記号にせず、値を折り返してでも全文表示する
  // （在庫リストの詳細モーダルの外装色・内装色専用、Stylesheet.htmlの
  // .card__metaGrid dd.is-fullText参照。現場からの要望「在庫リストポップアップ
  // 表示時のみカラーを全て表示してほしい」）。
  function metaRowFull_(label, value) {
    var text = value || '-';
    return '<div><dt>' + label + '</dt><dd class="is-fullText" title="' + escapeHtml(text) + '">' + escapeHtml(text) + '</dd></div>';
  }

  /**
   * オプション・備考のような自由記述の長文項目専用のブロック（在庫リストの
   * 詳細モーダル・vehicleDetailHtml_専用）。不具合修正: 以前はこれらの項目を
   * ボタン表示にし、押した先の別ポップアップ（textInfoModal、廃止）で全文を
   * 確認する形だったが、詳細モーダル自体をPC幅で横長・3カラムに広げたことで
   * 十分な表示スペースが確保できるようになったため、ボタン＋別ポップアップを
   * やめてこの場で直接全文を表示する（現場からの要望「オプションや備考も
   * ボタンではなく、その場で綺麗に見えるようにしてほしい」）。折り返して
   * 全文表示する（.card__noteBlock__body、Stylesheet.html参照）。 */
  function noteBlockHtml_(label, text, emptyMessage) {
    return '<div class="card__noteBlock">' +
      '<p class="card__noteBlock__label">' + escapeHtml(label) + '</p>' +
      '<p class="card__noteBlock__body">' + escapeHtml(text || emptyMessage) + '</p>' +
      '</div>';
  }

  // ===== Hold種別（通常／業販HOLD）表示ヘルパー =====
  // 管理者権限を持つ担当者のみ登録できる業販HOLDは、通常のHoldとは
  // 見分けがつくよう、バッジ・カード左罫線・Hold詳細ブロックすべてに専用の特別色
  // （badge--holdSpecial 等）を使う（HoldService.gsのHOLD_TYPE参照）。
  var HOLD_TYPE_LABELS_FALLBACK_ = { normal: '通常のHOLD', wholesale: '業販HOLD' };
  function holdTypeLabel_(holdType) {
    var map = (state.bootstrap && state.bootstrap.holdTypeLabels) || HOLD_TYPE_LABELS_FALLBACK_;
    return map[holdType] || holdType;
  }

  // 中古車サイトへの掲載状況（カーセンサー／グーネットの2つのチェックボックス、
  // Constants.gsのVEHICLE_COLUMNS参照）から、未掲載／片方のみ掲載／両方掲載の
  // 3状態を判定する。
  function listedSiteCount_(v) {
    return (v.listedCarsensor ? 1 : 0) + (v.listedGoonet ? 1 : 0);
  }
  function isVehicleListed_(v) {
    return listedSiteCount_(v) > 0;
  }
  // 在庫リストの掲載欄（badge__badges内の掲載バッジ）に表示するテキスト。
  // 「片方のみ掲載」「両方掲載」ではどのサイトかが分からず現場が困るため、
  // 掲載中のサイト名をそのまま表示する（現場からの要望）。
  function listedStatusText_(v) {
    var sites = [];
    if (v.listedGoonet) sites.push('グーネット');
    if (v.listedCarsensor) sites.push('カーセンサー');
    return sites.length ? sites.join('・') + '掲載' : '未掲載';
  }
  function listedBadgeHtml_(v) {
    var count = listedSiteCount_(v);
    if (count === 0) return '';
    return '<span class="badge badge--listed"><span class="badge__dot"></span>' + escapeHtml(listedStatusText_(v)) + '</span>';
  }

  function vehicleCardTone_(v) {
    var isHold = v.holdStatus === 'hold';
    var isSpecialHold = isHold && !!(v.holdHoldType && v.holdHoldType !== 'normal');
    var tone = isSpecialHold ? 'card--holdSpecial' : (isHold ? 'card--hold' : 'card--available');
    return isVehicleListed_(v) ? tone + ' is-listed' : tone;
  }

  /**
   * includeListed=falseで掲載バッジ（listedBadgeHtml_）を省く。一覧行
   * （vehicleTableRowHtml_）では、状態バッジに加えてHold要約（顧客名・タイマー）も
   * 同じ見出し行の1行に収める必要があり、掲載バッジまで含めると車両（バッジの
   * 有無・文字数）によって行がはみ出したり折り返したりして、車両ごとに
   * カードサイズが揃わなくなってしまう（現場からの要望「Hold中もカードサイズが
   * 変わらないようにしてほしい」）。掲載状況は詳細モーダルで確認できるため、
   * 一覧行では省く。詳細モーダル（vehicleTopHtml_）では引き続き表示する
   * （呼び出し側で引数を省略、デフォルトtrue）。
   */
  function vehicleBadgesHtml_(v, includeListed) {
    var isHold = v.holdStatus === 'hold';
    var isSpecialHold = isHold && !!(v.holdHoldType && v.holdHoldType !== 'normal');
    var statusBadge;
    if (isSpecialHold) {
      statusBadge = '<span class="badge badge--holdSpecial"><span class="badge__dot"></span>' +
        escapeHtml(holdTypeLabel_(v.holdHoldType)) + '中</span>';
    } else if (isHold) {
      statusBadge = '<span class="badge badge--hold"><span class="badge__dot"></span>Hold中</span>';
    } else {
      statusBadge = '<span class="badge badge--available"><span class="badge__dot"></span>在庫あり</span>';
    }
    return statusBadge + (includeListed === false ? '' : listedBadgeHtml_(v));
  }

  /**
   * カード上部（【上枠】車種・ＯＣＮの行＋ステータスバッジの行）。2行に分けて
   * 固定することで、バッジの個数やモデル名・ＯＣＮの文字数によって折り返し方が
   * 変わり、カードごとに高さがバラつく問題を避ける（以前は1つのflex-wrapコンテナに
   * 全部まとめていたため、組み合わせによって1行に収まったり2行・3行になったりし、
   * カードの高さが揃わなかった）。
   */
  function vehicleTopHtml_(v) {
    return '<div class="card__top">' +
      '<div class="card__topRow">' +
      '<div><div class="card__model">' + escapeHtml(v.model) + '</div>' +
      '<div class="card__commission">ＯＣＮ ' + escapeHtml(v.ocn || '-') + '</div></div>' +
      '</div>' +
      '<div class="card__badges">' + vehicleBadgesHtml_(v) + '</div>' +
      '</div>';
  }

  function formatNumberUnit_(value, unit) {
    if (value === null || value === undefined || value === '') return '';
    var n = Number(value);
    return (isNaN(n) ? String(value) : n.toLocaleString()) + unit;
  }

  // 登録番号（ナンバープレート）は地域／分類番号／ひらがな／一連指定番号の4列に
  // 分けて管理しているが、表示上は「岐阜 303 た 1247」のように1行にまとめる。
  function plateText_(v) {
    var parts = [v.plateRegion, v.plateClass, v.plateKana, v.plateNumber].filter(function (p) { return p; });
    return parts.length ? parts.join(' ') : '';
  }

  // 【下枠】区分・カラー・販売価格・年式・走行距離・登録番号は折りたたまず常に
  // 表示する（2nd Hold廃止で空いたスペースを使い、詳細を見なくても年式・走行距離・
  // 登録番号が分かるようにしてほしいという現場からの要望）。
  // カラー（外装色・内装色）は、一覧のカード表示ではこれまでどおり「外装色 / 内装色」の
  // 1行・省略記号にしてカードの高さを揃えるが、詳細モーダル（vehicleDetailHtml_、
  // fullColors=true）では長い色名でも見切れないよう、外装色・内装色を別々の行
  // （上段が外装色・下段が内装色）にして全文表示する（現場からの要望「在庫リスト
  // ポップアップ表示時のみカラーを全て表示してほしい」）。
  function vehicleQuickMetaHtml_(v, fullColors) {
    var colorRowsHtml = fullColors
      ? metaRowFull_('外装色', v.exteriorColor) + metaRowFull_('内装色', v.interiorColor)
      : metaRow_('カラー', (v.exteriorColor || '-') + ' / ' + (v.interiorColor || '-'));
    // MPは「登録番号の右に表示してほしい」という現場からの要望を受け、登録番号の
    // 直後に置く（2列グリッドのため、登録番号が奇数番目＝左列に来た場合はその
    // 右隣に、偶数番目＝右列に来た場合は次の行の左列に並ぶ）。
    return '<dl class="card__metaGrid card__metaGrid--quick">' +
      metaRow_('区分', v.category) +
      colorRowsHtml +
      metaRow_('販売価格', formatNumberUnit_(v.salePrice, ' 円')) +
      metaRow_('初年度登録日', v.firstRegistrationDate) +
      metaRow_('走行距離', formatNumberUnit_(v.mileage, ' km')) +
      metaRow_('登録番号', plateText_(v)) +
      metaRow_('MP', v.mp) +
      '</dl>';
  }

  function vehicleSpecFieldsHtml_(v) {
    // ＯＣＮ・年式・走行距離・登録番号は【上枠】【下枠】（vehicleTopHtml_・
    // vehicleQuickMetaHtml_）で常に表示済みのため、ここでは重複させない。
    // オプションは複数の装備をまとめて自由記述するため長くなりがちで、他の項目と
    // 同じ省略記号（ellipsis）表示だと全文を確認しづらい（現場からの要望）。
    // 以前はボタンを押した先の別ポップアップで全文を確認する形だったが、
    // noteBlockHtml_（上記）に統一し、このグリッドの下にそのまま全文表示する。
    return '<dl class="card__metaGrid">' +
      metaRow_('ステア', v.steering) +

      metaRow_('車台番号下４桁', v.chassisNumberLast4) +
      metaRow_('車検満了日', v.inspectionExpiryDate, inspectionExpiryTone_(v.inspectionExpiryDate)) +
      metaRow_('ﾘｻｲｸﾙ料', formatNumberUnit_(v.recycleFee, ' 円')) +
      metaRow_('旧使用拠点', v.previousLocation) +
      metaRow_('CCC入庫日', v.cccArrivalDate) +
      metaRow_('経過月', formatNumberUnit_(v.elapsedMonths, ' ヶ月')) +
      metaRow_('現展示拠点', v.currentDisplayLocation) +
      metaRow_('現名義', v.currentOwnerName) +
      '</dl>' +
      noteBlockHtml_('オプション', v.option, 'オプションの登録はありません。');

  function vehicleActionsHtml_(v) {
    var isHold = v.holdStatus === 'hold';
    var html = '<div class="card__actions">';
    if (!isHold) {
      html += '<button class="btn" data-hold="' + escapeHtml(v.commission) + '">Hold</button>';
      html += '<button class="btn btn--primary" data-order="' + escapeHtml(v.commission) + '">受注</button>';
    } else {
      html += '<button class="btn btn--primary" data-order-from-hold="' + escapeHtml(v.commission) + '">受注確定</button>';
    }
    html += '</div>';

  function rowNum_(n) { return n < 10 ? '0' + n : String(n); }

  /**
   * 横一列テーブル表示（在庫リスト・受注リスト・業販受注リスト・デモカーリスト・
   * サービス代車リスト・マイページ）共通のラッパー。列見出し行（headerHtml）を
   * 常に先頭に1行だけ出す。1件も無いときは見出しごと何も表示しない（既存の
   * 空状態メッセージ#xxxEmptyに任せる）。
   * 不具合修正: 列見出し行（.tblHead）を固定表示する（現場からの要望「在庫
   * リストの項目名は固定してほしい」）にあたり、データ行は列見出しとは別の
   * ラッパー（.tblBody）にまとめている。理由: 画面幅が足りず表が横スクロール
   * する場合（Stylesheet.html参照）、横スクロールの対象を.tblBody側だけに
   * 限定することで、.tblHead自体は横スクロールのコンテナにならずに済み、
   * position: stickyによる縦方向の固定が外側の一覧エリア（.listBody__main）
   * を基準に正しく効くようになる（CSSの仕様上、同じ要素にoverflow-xとtop:0の
   * stickyを両方効かせることはできないため）。.tblBodyが横スクロールした際は
   * wireTableHeaderScrollSync_で.tblHead側の表示位置も追従させ、列見出しと
   * データの横位置がずれないようにする。
   */
  function tableListHtml_(tableClass, headerHtml, items, renderRowFn) {
    if (!items.length) return '';
    return '<div class="tbl ' + tableClass + '">' + headerHtml +
      '<div class="tblBody">' + items.map(function (item, i) {
        return renderRowFn(item, i + 1);
      }).join('') + '</div>' +
      '</div>';
  }

  /**
   * tableListHtml_で作った.tbl内の.tblBodyを横スクロールしたとき、.tblHead
   * （列見出し行）の表示位置もその分ずらして追従させる。containerEl配下に
   * 複数の.tbl（受注リスト・業販受注リストの月ごとグループ等）があっても
   * まとめて配線する。各リストのrender関数で、innerHTML差し替え直後に毎回
   * 呼び出す（差し替えるたびに要素が作り直されるため、都度配線し直す必要が
   * ある）。
   */
  // 不具合修正（レスポンシブ・マルチデバイス担当からの指摘）: スマホ幅等で
  // 表が横スクロール可能なとき、タブ行・検索チップ行（.scroller／.tabs）には
  // 「続きがある」ことを示す縁のフェード（mask-image）が付いているのに、
  // .tblBodyには無く、右側にまだ列が隠れていることに気づきにくかった。
  // initScrollFade_（タブ行用）と同じmask-imageの仕組みを、.tblBodyにも
  // そのまま適用する（--fade-l／--fade-rはStylesheet.htmlの.scroller,
  // .tabsの定義を.tblBodyにも効かせているため、ここでは値の計算だけ行う）。
  function syncTblBodyFade_(body) {
    var max = body.scrollWidth - body.clientWidth;
    body.style.setProperty('--fade-l', body.scrollLeft > 2 ? '16px' : '0px');
    body.style.setProperty('--fade-r', body.scrollLeft < max - 2 ? '16px' : '0px');
  }

  function wireTableHeaderScrollSync_(containerEl) {
    containerEl.querySelectorAll('.tbl').forEach(function (tbl) {
      var head = tbl.querySelector('.tblHead');
      var body = tbl.querySelector('.tblBody');
      if (!head || !body) return;
      body.addEventListener('scroll', function () {
        head.scrollLeft = body.scrollLeft;
      });
      // 不具合修正: 一覧データは、そのタブを開く前（まだ非表示＝
      // display: noneの状態）に先行して描画されていることがあり、その時点で
      // scrollWidth／clientWidthを読んでもどちらも0になってしまうため、ここで
      // 1回だけ同期しても実際にタブを開いたときには値が正しくないままだった。
      // そのためタブが表示状態に切り替わるたび（switchToTab_参照）にも
      // 再同期する。.tblBodyは絞り込み・並べ替えのたびに作り直される
      // （本関数も都度呼び直す）ため、initScrollFade_と違いwindowのresizeには
      // 登録しない（古い要素への参照がリスナーとして溜まり続けるのを避ける
      // ため）。
      body.addEventListener('scroll', function () { syncTblBodyFade_(body); }, { passive: true });
      syncTblBodyFade_(body);
    });
  }

  /**
   * 今アクティブなタブの中にある.tblBodyだけ、横スクロールのフェード
   * （syncTblBodyFade_）を再同期する。タブは常に同じDOM上でdisplay: none/
   * blockを切り替えているだけのため、非表示のうちに描画されたテーブルは
   * scrollWidth等が0のまま--fade-rが正しく計算できていない。switchToTab_
   * （タブ切替の直後）から呼び、表示された瞬間に正しい値へ直す。
   */
  function resyncActiveTabTblBodyFades_() {
    document.querySelectorAll('main.view.is-active .tblBody').forEach(syncTblBodyFade_);
  }

  /**
   * 在庫リストタブ・マイページ「Hold中の車両」共通の一覧行見出し（列見出し行）。
   * 1件＝1行で横一列に表示するテーブル表示用（vehicleTableRowHtml_と列を揃える。

  function inventoryTableHeaderHtml_() {
    return '<div class="tblHead">' +
      '<div></div><div>区分</div><div>モデル</div><div>初年度登録日</div><div>走行距離</div>' +
      '<div>車検満了日</div><div>登録番号</div><div>現展示拠点</div><div>価格</div>' +
      '<div>ステータス</div><div>操作</div><div></div>' +

  }

  /**
   * 在庫リストタブ・マイページ「Hold中の車両」共通の一覧行（横一列テーブル表示）。
   * 1台分の情報をすべて1行に横並びで収める（現場からの要望「情報は横一列で
   * 表示してほしい」）。各項目を枠で囲まず、列見出し行と縦の罫線・1行おきの
   * 塗り分けだけで区切る（現場からの要望「各項目を一つずつ囲むのをやめたい」）。
   * 「現展示拠点」も列として常に表示する（現場からの要望）。操作列は
   * vehicleActionsHtml_が常に2つボタンを返すため（Hold中なら解除＋受注確定、

   * 常に同じ横幅に揃う。行タップ時の詳細表示はＯＣＮで検索する
   * （findVehicleByOcn_参照。コミッション未入力の車両でも開ける）。
   */
  function vehicleTableRowHtml_(v, num) {
    var isHold = v.holdStatus === 'hold';
    var isSpecialHold = isHold && !!(v.holdHoldType && v.holdHoldType !== 'normal');
    var rowTone = isSpecialHold ? 'tblRow--holdSpecial' : (isHold ? 'tblRow--hold' : '');
    var cancelHoldBtnHtml = isHold
      ? '<button type="button" class="btn btn--danger" data-cancel-hold="' + escapeHtml(v.commission) + '">解除</button>'
      : '';
    return '<div class="tblRow ' + rowTone + '" data-commission="' + escapeHtml(v.commission) + '" data-ocn="' + escapeHtml(v.ocn) + '">' +
      '<div class="tblCell tblCell--num">' + rowNum_(num) + '</div>' +
      '<div class="tblCell"><span class="tag">' + escapeHtml(v.category || '-') + '</span></div>' +
      '<div class="tblCell tblCell--strong" title="' + escapeHtml(v.model) + '">' + escapeHtml(v.model) + '</div>' +
      '<div class="tblCell">' + escapeHtml(v.firstRegistrationDate || '-') + '</div>' +

      '<div class="tblCell">' + escapeHtml(v.inspectionExpiryDate || '-') + '</div>' +
      '<div class="tblCell" title="' + escapeHtml(plateText_(v)) + '">' + escapeHtml(plateText_(v) || '-') + '</div>' +
      '<div class="tblCell tblCell--strong">' + escapeHtml(v.currentDisplayLocation || '-') + '</div>' +
      '<div class="tblCell">' + escapeHtml(formatNumberUnit_(v.salePrice, ' 円') || '-') + '</div>' +
      '<div class="tblCell tblCell--status">' + vehicleBadgesHtml_(v, false) + '</div>' +
      '<div class="tblCell tblCell--actions">' + cancelHoldBtnHtml + vehicleActionsHtml_(v) + '</div>' +
      '<div class="tblCell tblCell--chev">›</div>' +
      '</div>';

  /**
   * 「詳細を見る」タップ・表示形式「表」の行タップで開く、画面中央のモーダル
   * （#inventoryDetailModal）用のフル版。車両スペック・Holdの詳細（リード番号等）
   * も省略せずすべて表示する（openInventoryDetailModal_参照）。
   *
   * PC・タブレット幅（modal__panel--vehicle、Stylesheet.html内の
   * @media (min-width: 901px)参照）では、画面全体よりひと回り小さい横長の
   * 長方形ポップアップの中で、内容を「概要」「詳細スペック」「Hold状況・操作」の
   * 3カラムに分けて一度に見渡せるようにする（現場からの要望）。card__detailCol
   * の3つのdivがそのままCSS Gridの列になる。スマホ幅（900px以下）では、この
   * 3つのdivは単純に上から順に縦積みされるだけなので、以前の縦長モーダルと
   * 同じ表示順のまま変わらない。 */
  function vehicleDetailHtml_(v) {
    var isHold = v.holdStatus === 'hold';

    var holdInfoHtml = isHold
      ? '<div class="card__holdArea card__holdArea--full">' + holdInfoBlockHtml_('HOLD', v, 'hold', true) + '</div>'
      : '<div class="card__holdArea card__holdArea--empty card__holdArea--full">' +
        '<span class="card__holdArea__placeholder">現在Hold登録なし</span>' +
        '</div>';

    var cardTone = vehicleCardTone_(v);
    return '<div class="card ' + cardTone + '">' +
      '<div class="card__detailCol card__detailCol--overview">' +
      vehicleTopHtml_(v) +
      vehicleQuickMetaHtml_(v, true) +
      '</div>' +
      '<div class="card__detailCol card__detailCol--spec">' +
      vehicleSpecFieldsHtml_(v) +
      noteBlockHtml_('備考', v.remarks, '備考はありません。') +
      '</div>' +
      '<div class="card__detailCol card__detailCol--hold">' +
      holdInfoHtml +
      vehicleActionsHtml_(v) +
      '</div>' +
      '</div>';
  }

  /** 一覧行タップ・チェブロンタップのどちらでも、車両情報すべてを画面中央の
   * モーダルに表示する。コミッションが未入力の車両でも必ず開けるよう、

  function openInventoryDetailModal_(ocn) {
    var vehicle = findVehicleByOcn_(ocn);
    if (!vehicle) return;
    $('inventoryDetailBody').innerHTML = vehicleDetailHtml_(vehicle);
    openModal($('inventoryDetailModal'));
  }

  // vehicleDetailHtml_）を土台にしつつ、状態バッジ・操作ボタンはこの一覧専用の

  function carTrackingTableHeaderHtml_() {

  // ===== ホーム画面「検索結果」一覧（在庫リスト＋デモカーリスト＋サービス代車

  function homeResultRowHtml_(v, num) {

    var cancelHoldBtnHtml = isHold

    var actionsHtml = fromInventory ? (cancelHoldBtnHtml + vehicleActionsHtml_(v)) : '';
    return '<div class="tblRow ' + rowTone + '" data-commission="' + escapeHtml(v.commission || '') + '" data-ocn="' + escapeHtml(v.ocn) + '">' +
      '<div class="tblCell tblCell--num">' + rowNum_(num) + '</div>' +
