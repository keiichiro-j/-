      '<div class="tblCell tblCell--strong" title="' + escapeHtml(v.model) + '">' + escapeHtml(v.model) + '</div>' +
      '<div class="tblCell">' + escapeHtml(v.firstRegistrationDate || '-') + '</div>' +
      '<div class="tblCell">' + escapeHtml(formatNumberUnit_(v.mileage, ' km') || '-') + '</div>' +
      '<div class="tblCell">' + escapeHtml(v.inspectionExpiryDate || '-') + '</div>' +
      '<div class="tblCell" title="' + escapeHtml(plateText_(v)) + '">' + escapeHtml(plateText_(v) || '-') + '</div>' +
      '<div class="tblCell tblCell--strong">' + escapeHtml(v.currentDisplayLocation || '-') + '</div>' +
      '<div class="tblCell">' + escapeHtml(formatNumberUnit_(v.salePrice, ' 円') || '-') + '</div>' +
      '<div class="tblCell tblCell--status">' + statusHtml + '</div>' +
      '<div class="tblCell tblCell--actions">' + actionsHtml + '</div>' +
      '<div class="tblCell tblCell--chev">›</div>' +
      '</div>';
  }

  /**
   * ホーム画面「検索結果」一覧の行タップ時の詳細表示。在庫リスト由来の車両は
   * 既存のinventoryDetailModal（Hold・受注操作つき、state.inventoryItems /
   * state.allInventoryItems内から同じＯＣＮで検索）をそのまま開き、ホームからでも
   * Hold・受注確定ができるようにする。デモカーリスト・サービス代車リスト由来の
   * 車両は、Hold・受注の概念が無い閲覧専用のため、専用のhomeResultDetailModalに
   * carTrackingDetailHtml_を表示する。
   */
  function openHomeResultDetail_(ocn) {
    var v = (state.homeVehiclePool || []).find(function (item) { return String(item.ocn) === String(ocn); });
    if (!v) return;
    if (homeResultIsFromInventory_(v)) {
      openInventoryDetailModal_(ocn);
      return;
    }
    $('homeResultDetailBody').innerHTML = carTrackingDetailHtml_(v);
    openModal($('homeResultDetailModal'));
  }

  // Hold詳細ブロックは、常に見えている要約行（顧客・担当者・タイマー）と、
  // 折りたたみ式の詳細（リード番号・登録月・下取車・OSS・保険）に分ける。
  /**
   * full=false（表示形式「カード」のコンパクト版）ではリード番号等の詳細を省略し、
   * full=true（詳細モーダル・vehicleDetailHtml_）では折りたたまず常に表示する。
   */
  function holdInfoBlockHtml_(label, v, prefix, full) {
    var holdType = v[prefix + 'HoldType'] || 'normal';
    var isSpecial = holdType !== 'normal';
    var leadNumber = v[prefix + 'LeadNumber'];
    var staff = v[prefix + 'Staff'];
    var customer = v[prefix + 'Customer'];
    var salesLocation = v[prefix + 'SalesLocation'];
    var registeredMonth = v[prefix + 'RegisteredMonth'];
    var tradeIn = v[prefix + 'TradeIn'];
    var oss = v[prefix + 'Oss'];
    var insurance = v[prefix + 'Insurance'];
    var paymentMethod = v[prefix + 'PaymentMethod'];
    var salesStore = v[prefix + 'SalesStore'];
    var createdAt = v[prefix + 'CreatedAt'];
    var expiresAt = v[prefix + 'ExpiresAt'];

    var summaryHtml;
    var detailsHtml = '';
    if (holdType === 'wholesale') {
      summaryHtml = '<div class="card__holdInfo__row"><b>業販HOLD</b>（担当者 ' + escapeHtml(staff || '-') + '）</div>';
      if (full) {
        detailsHtml = '<div class="card__holdInfo__detailsBody card__holdInfo__detailsBody--flat">' +
          '販売先 ' + escapeHtml(salesStore || '-') +
          '</div>';
      }
    } else {
      summaryHtml = '<div class="card__holdInfo__row"><b>' + escapeHtml(customer || '-') + '</b>（担当者 ' + escapeHtml(staff || '-') + '・' + escapeHtml(salesLocation || '-') + '）</div>';
      detailsHtml = full
        ? '<div class="card__holdInfo__detailsBody card__holdInfo__detailsBody--flat">' +
          'リード番号 ' + escapeHtml(leadNumber || '-') +
          ' / 登録月 ' + escapeHtml(registeredMonth || '-') +
          ' / 下取車 ' + escapeHtml(tradeIn || '-') + ' / OSS ' + escapeHtml(oss || '-') +
          ' / 保険 ' + escapeHtml(insurance || '-') + ' / 支払方法 ' + escapeHtml(paymentMethod || '-') +
          '</div>'
        : '';
    }

    return '<div class="card__holdInfo card__holdInfo--hold' + (isSpecial ? ' card__holdInfo--special' : '') + '">' +
      '<div class="card__holdInfo__head">' +
      '<span class="card__holdInfo__label">' + label + (isSpecial ? '（' + escapeHtml(holdTypeLabel_(holdType)) + '）' : '') + '</span>' +
      '<button class="card__holdInfo__cancel" type="button" data-cancel-hold="' + escapeHtml(v.commission) + '">解除</button>' +
      '</div>' +
      summaryHtml +
      holdTimerHtml_(createdAt, expiresAt) +
      detailsHtml +
      '</div>';
  }

  // ===== Hold 72時間タイマー（視覚的なカウントダウン・進捗バー） =====
  // 業販HOLDは期限が無期限（expiresAtがfalsy）のため、進捗バーは出さず
  // 「無期限」の固定表示にする。updateHoldTimersは data-expires-at が空（falsy）の
  // 要素を毎秒の更新対象から除外するため、この初期表示のまま変化しない。
  function holdTimerHtml_(createdAt, expiresAt, extraClass) {
    var cls = 'holdTimer' + (extraClass ? ' ' + extraClass : '');
    if (!expiresAt) {
      return '<div class="' + cls + ' holdTimer--indefinite" data-created-at="' + (createdAt || '') + '" data-expires-at="">' +
        '<div class="holdTimer__text">無期限</div>' +
        '</div>';
    }
    return '<div class="' + cls + '" data-created-at="' + (createdAt || '') + '" data-expires-at="' + expiresAt + '">' +
      '<div class="holdTimer__bar"><div class="holdTimer__barFill"></div></div>' +
      '<div class="holdTimer__text">-</div>' +
      '</div>';
  }

  function formatDuration_(ms) {
    var totalSeconds = Math.max(0, Math.floor(ms / 1000));
    var hours = Math.floor(totalSeconds / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;
    return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }

  var HOLD_DURATION_MS_CLIENT = 72 * 60 * 60 * 1000; // サーバー側 HOLD_DURATION_MS と同じ値（表示用フォールバック）

  var expiredRefreshTimer = null;
  function scheduleExpiredRefresh_() {
    if (expiredRefreshTimer) return;
    expiredRefreshTimer = setTimeout(function () {
      expiredRefreshTimer = null;
      loadInventory();
    }, 15000);
  }

  function updateHoldTimers() {
    var now = Date.now();
    var anyExpired = false;
    document.querySelectorAll('.holdTimer').forEach(function (el) {
      var expiresAt = Number(el.dataset.expiresAt);
      if (!expiresAt) return;
      var createdAt = Number(el.dataset.createdAt) || expiresAt - HOLD_DURATION_MS_CLIENT;
      var fill = el.querySelector('.holdTimer__barFill');
      var text = el.querySelector('.holdTimer__text');

      var total = expiresAt - createdAt;
      var remaining = expiresAt - now;
      if (remaining <= 0) {
        anyExpired = true;
        el.classList.add('holdTimer--expired');
        el.classList.remove('holdTimer--warning');
        fill.style.width = '0%';
        text.textContent = '期限切れ（まもなく自動更新されます）';
      } else {
        var pct = total > 0 ? Math.max(0, Math.min(100, (remaining / total) * 100)) : 0;
        fill.style.width = pct + '%';
        el.classList.toggle('holdTimer--warning', remaining < 6 * 60 * 60 * 1000);
        el.classList.remove('holdTimer--expired');
        text.textContent = '残り ' + formatDuration_(remaining);
      }
    });
    if (anyExpired) scheduleExpiredRefresh_();
  }

  setInterval(updateHoldTimers, 1000);

  // 不具合修正: 在庫リストの「型（ボディタイプ）」でのクイックナビ絞り込みは
  // 現場からの要望「型検索は無くしてほしい」により廃止した。区分・掲載状況・
  // 年式・価格帯・走行距離は引き続き左の絞り込みサイドバーで扱う（ホーム画面の
  // 型クイックナビ・renderHomeTypeNav_はこの変更の影響を受けず、従来どおり）。
  function renderInventory() {
    var container = $('inventoryList');
    var all = state.inventoryItems || [];
    var filtered = sortInventoryItems_(applyInventoryFilters_(all));
    $('inventoryEmpty').classList.toggle('hidden', filtered.length > 0);
    // 該当台数は絞り込みサイドバー（条件検索）見出しの右にのみ表示する
    // （不具合修正: 以前はクイックナビ行の右側にも同じ情報を重複表示していた）。
    $('inventoryFilterCount').textContent = all.length ? '該当 ' + filtered.length + '台 ／ 全' + all.length + '台' : '';
    container.innerHTML = tableListHtml_('tbl--inventory', inventoryTableHeaderHtml_(), filtered, vehicleTableRowHtml_);
    wireTableHeaderScrollSync_(container);
    syncInventoryFilterClearVisibility_();
    syncFilterRowsAndSummary_('inventoryFilterRows', 'inventoryActiveBar', 'btnInventoryFilterClear');
  }

  // 在庫リストの行タップ操作（Hold・受注・詳細）。マイページの
  // 「Hold中の車両」一覧（#myPageHoldList）も在庫リストと同じ横一列テーブル
  // 表示（vehicleTableRowHtml_）を使っており、data-commission属性を見て
  // 操作対象を判定する処理自体は同じため、引き続きこのハンドラを共有する
  // （on('myPageHoldList', ...)参照）。
  /**
   * Hold・受注・受注確定・Hold解除ボタンのdata属性からコミッションを
   * 取り出す。コミッション列は任意入力（Constants.gsのVEHICLE_COLUMNS参照）の
   * ため、値が空欄の車両ではボタン自体は表示されてもdata属性の値が空文字になり、
   * クリックしてもエラーも出ないまま無反応になっていた不具合があった（現場からの
   * 指摘）。呼び出し側は`'hold' in target.dataset`のように属性の「有無」でボタンが
   * クリックされたかどうかを判定したうえでこの関数を呼び、値が空ならここで
   * 分かりやすいエラーを表示する。
   */
  function requireActionCommission_(commission) {
    if (commission) return commission;
    showToast('この車両は「コミッション」が未入力のため操作できません。スプレッドシートでコミッションを入力してから、画面を更新してもう一度お試しください。', true);
    return null;
  }

  function handleInventoryListClick_(e) {
    var target = e.target;
    var commission;
    if ('hold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.hold))) openActionModal('hold', commission); }
    else if ('order' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.order))) openActionModal('order', commission); }
    else if ('orderFromHold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.orderFromHold))) openActionModal('orderFromHold', commission); }
    else if ('cancelHold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.cancelHold))) openCancelHoldModal(commission); }
    else {
      // 一覧行タップ（ボタン・入力・ラベル以外の箇所）で車両情報の詳細モーダルを開く。
      // 不具合修正: コミッション（任意入力）ではなく、必須入力のＯＣＮで検索する
      // ことで、コミッション未入力の車両でも詳細を確認できるようにする。
      var tappable = target.closest('[data-ocn]');
      if (tappable && !target.closest('button, input, label')) {
        openInventoryDetailModal_(tappable.dataset.ocn);
      }
    }
  }

  on('inventoryList','click', handleInventoryListClick_);

  // 詳細モーダル内のHold/受注等のボタンも、在庫リストと同じ操作ができるようにする。
  // 操作系のボタン（Hold・受注・受注確定・Hold解除）を押した場合は、
  // 続けて別のモーダル（Hold登録等）を開く前に、この詳細モーダル自体は閉じておく。
  on('inventoryDetailModal','click', function (e) {
    var target = e.target;
    var commission;
    if ('hold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.hold))) { closeModal($('inventoryDetailModal')); openActionModal('hold', commission); } }
    else if ('order' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.order))) { closeModal($('inventoryDetailModal')); openActionModal('order', commission); } }
    else if ('orderFromHold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.orderFromHold))) { closeModal($('inventoryDetailModal')); openActionModal('orderFromHold', commission); } }
    else if ('cancelHold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.cancelHold))) { closeModal($('inventoryDetailModal')); openCancelHoldModal(commission); } }
  });

  on('inventoryKeyword', 'input', debounce(loadInventory, 250));

  // ----- 絞り込みサイドバーの各項目（区分・現展示拠点・掲載状況・年式・価格帯・
  //       走行距離）は、キーワードと異なりサーバーへ問い合わせず、既に取得済みの
  //       一覧（state.inventoryItems）をクライアントだけで絞り込み直す
  //       （renderInventory参照。即座に反映されるため操作感が良い）。 -----
  function bindInventoryCheckboxFilter_(containerId, filterKey) {
    on(containerId, 'change', function (e) {
      if (e.target.type !== 'checkbox') return;
      var checked = Array.prototype.slice.call($(containerId).querySelectorAll('input[type="checkbox"]:checked'))
        .map(function (el) { return el.value; });
      state.inventoryFilters[filterKey] = checked;
      renderInventory();
    });
  }
  bindInventoryCheckboxFilter_('inventoryCategoryFilter', 'category');
  bindInventoryCheckboxFilter_('inventoryLocationFilter', 'location');
  bindInventoryCheckboxFilter_('inventoryListedFilter', 'listed');

  [['inventoryColorFilter', 'color'], ['inventoryYearFilter', 'yearBucket'], ['inventoryPriceFilter', 'priceBucket'], ['inventoryMileageFilter', 'mileageBucket']].forEach(function (pair) {
    on(pair[0], 'change', function () {
      state.inventoryFilters[pair[1]] = this.value;
      renderInventory();
    });
  });

  on('inventorySort', 'change', function () {
    state.inventorySort = this.value;
    renderInventory();
  });

  on('btnInventoryFilterClear', 'click', function () {
    state.inventoryFilters = { category: [], listed: [], location: [], color: '', yearBucket: '', priceBucket: '', mileageBucket: '' };
    state.inventorySort = '';
    $('inventoryKeyword').value = '';
    ['inventoryColorFilter', 'inventoryYearFilter', 'inventoryPriceFilter', 'inventoryMileageFilter', 'inventorySort'].forEach(function (id) { $(id).value = ''; });
    document.querySelectorAll('#inventoryCategoryFilter input, #inventoryLocationFilter input, #inventoryListedFilter input').forEach(function (el) { el.checked = false; });
    loadInventory();
  });

  // ----- ホーム画面の絞り込みサイドバー（在庫リストと同じ考え方で、カラー・
  //       初年度登録日・価格帯・走行距離はホームのモデルカードグリッドへ即時
  //       反映する。キーワードはライブ絞り込みにせず、下の「検索」ボタン・
  //       Enterキーで確定したときだけ検索結果ページへ遷移する） -----
  [['homeColorFilter', 'color'], ['homeYearFilter', 'yearBucket'], ['homePriceFilter', 'priceBucket'], ['homeMileageFilter', 'mileageBucket']].forEach(function (pair) {
    on(pair[0], 'change', function () {
      state.homeFilters[pair[1]] = this.value;
      renderHomeGallery_();
    });
  });

  // 区分・現展示拠点・掲載状況・販売状況（現場からの要望「ホーム絞り込み機能に
  // 各リストで追加した機能を搭載してほしい（在庫保管位置など）」を受けて追加）。
  // 複数選択のため<select multiple>ではなく、セレクトと同じ見た目のボタンを
  // 押すとチェックボックス一覧がポップオーバーで開く独自のドロップダウンにする
  // （現場からの要望「現在の形式（セレクト）で全て選択肢をドロップ形式に
  // すれば綺麗に収まる」。閉じている間は行の高さがボタン1行ぶんで固定される
  // ため、いくつ選んでもパネル全体の高さに影響しない）。
  var homeMultiDropdowns_ = [];
  function homeMultiDropdownLabel_(values, labelMap) {
    if (!values.length) return '指定なし';
    var first = labelMap ? (labelMap[values[0]] || values[0]) : (values[0] || '未設定');
    return values.length === 1 ? first : (first + ' 他' + (values.length - 1) + '件');
  }
  function closeAllHomeMultiDropdowns_() {
    homeMultiDropdowns_.forEach(function (d) { d.panel.classList.add('hidden'); });
  }
  // ポップオーバーの外側をクリックしたら閉じる（一般的なドロップダウンの挙動）。
  document.addEventListener('click', closeAllHomeMultiDropdowns_);

  function setupHomeMultiDropdown_(containerId, filterKey, renderOptionsHtml, labelMap) {
    var container = $(containerId);
    var btn = container.querySelector('.multiDropdown__btn');
    var panel = container.querySelector('.multiDropdown__panel');
    function sync() {
      btn.textContent = homeMultiDropdownLabel_(state.homeFilters[filterKey], labelMap);
      panel.innerHTML = renderOptionsHtml();
    }
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var willOpen = panel.classList.contains('hidden');
      closeAllHomeMultiDropdowns_();
      if (willOpen) { panel.innerHTML = renderOptionsHtml(); panel.classList.remove('hidden'); }
    });
    // ポップオーバー内のクリックがdocumentまでバブリングして自分自身を
    // 閉じてしまわないようにする。
    panel.addEventListener('click', function (e) { e.stopPropagation(); });
    panel.addEventListener('change', function (e) {
      if (e.target.type !== 'checkbox') return;
      state.homeFilters[filterKey] = Array.prototype.slice.call(panel.querySelectorAll('input[type="checkbox"]:checked'))
        .map(function (el) { return el.value; });
      btn.textContent = homeMultiDropdownLabel_(state.homeFilters[filterKey], labelMap);
      renderHomeGallery_();
      // 不具合修正: ここでpanel.innerHTMLを作り直すと、絞り込み中サマリー
      // （filterRowActiveEntries_）が個別解除ボタンのclear()内で参照している
      // チェックボックス要素がDOMから切り離され、サマリー側の「×」をクリック
      // しても絞り込みが解除されない不具合が起きていた（dispatchChange_が
      // 発火はするが、切り離された要素からはdocumentまでバブリングしない
      // ため）。件数（.filterCheck__cnt）はstate.homeVehiclePool全体から
      // 算出しており、同じ項目内の選択状態では変わらないため、パネルを開いた
      // とき（sync・ボタンクリック時）だけ作り直せば十分で、変更のたびに
      // 作り直す必要は無い。
    });
    homeMultiDropdowns_.push({ panel: panel, sync: sync });
    sync();
  }

  /** 掲載状況（カーセンサー／グーネット／未掲載）。在庫リストと同じ
   * inventoryListedKeys_の判定を使う（デモカー・サービス代車の車両は
   * listedCarsensor/listedGoonetを持たないため、常に「未掲載」に含まれる）。 */
  function homeListedDropdownOptionsHtml_() {
    var counts = { carsensor: 0, goonet: 0, unlisted: 0 };
    (state.homeVehiclePool || []).forEach(function (v) {
      inventoryListedKeys_(v).forEach(function (k) { counts[k] = (counts[k] || 0) + 1; });
    });
    var labels = { carsensor: 'カーセンサー掲載中', goonet: 'グーネット掲載中', unlisted: '未掲載' };
    var checkedValues = state.homeFilters.listed;
    return ['carsensor', 'goonet', 'unlisted'].map(function (k) {
      var checked = checkedValues.indexOf(k) !== -1;
      return '<label class="filterCheck"><input type="checkbox" value="' + k + '"' + (checked ? ' checked' : '') + '> ' +
        labels[k] + '<span class="filterCheck__cnt">' + counts[k] + '</span></label>';
    }).join('');
  }
  /** 販売状況（在庫中／販売済み）。デモカー・サービス代車の車両にしか無い
   * saleStatusで判定する（在庫リストの車両は対象外になる）。 */
  function homeSaleStatusDropdownOptionsHtml_() {
    var counts = { '在庫中': 0, '販売済み': 0 };
    (state.homeVehiclePool || []).forEach(function (v) {
      if (Object.prototype.hasOwnProperty.call(counts, v.saleStatus)) counts[v.saleStatus]++;
    });
    var checkedValues = state.homeFilters.saleStatus;
    return ['在庫中', '販売済み'].map(function (k) {
      var checked = checkedValues.indexOf(k) !== -1;
      return '<label class="filterCheck"><input type="checkbox" value="' + k + '"' + (checked ? ' checked' : '') + '> ' +
        k + '<span class="filterCheck__cnt">' + counts[k] + '</span></label>';
    }).join('');
  }

  setupHomeMultiDropdown_('homeCategoryFilter', 'category', function () {
    return checkboxFilterOptionsHtml_(state.homeVehiclePool || [], 'category', state.homeFilters.category);
  });
  setupHomeMultiDropdown_('homeLocationFilter', 'location', function () {
    return checkboxFilterOptionsHtml_(state.homeVehiclePool || [], 'currentDisplayLocation', state.homeFilters.location);
  });
  setupHomeMultiDropdown_('homeListedFilter', 'listed', homeListedDropdownOptionsHtml_,
    { carsensor: 'カーセンサー掲載中', goonet: 'グーネット掲載中', unlisted: '未掲載' });
  setupHomeMultiDropdown_('homeSaleStatusFilter', 'saleStatus', homeSaleStatusDropdownOptionsHtml_);

  function syncAllHomeMultiDropdowns_() {
    homeMultiDropdowns_.forEach(function (d) { d.sync(); });
  }

  on('btnHomeFilterClear', 'click', function () {
    state.homeFilters = { color: '', yearBucket: '', priceBucket: '', mileageBucket: '', category: [], location: [], listed: [], saleStatus: [] };
    // タイプ（型）も絞り込みパネルに統合した項目の1つのため、他の項目と
    // 一緒にクリアする（現場からの要望「型選択を絞り込み機能内に入れてほしい」）。
    state.homeBodyTypeFilter = '';
    $('homeKeyword').value = '';
    ['homeTypeFilter', 'homeColorFilter', 'homeYearFilter', 'homePriceFilter', 'homeMileageFilter'].forEach(function (id) { $(id).value = ''; });
    syncAllHomeMultiDropdowns_();
    renderHomeGallery_();
  });

  /**
   * ホームのEnterキーでの検索（現場からの要望「コントロールパネルの検索ボタンを
   * 無くしてほしい」によりボタンを廃止し、Enterキーのみの操作にした）。
   * キーワードを文字列の完全一致で検索結果ページへ遷移する（現場からの要望
   * 「検索ボタンは文字列の完全一致のみの検索にしてほしい」）。未入力の場合は
   * ホームの絞り込みサイドバー条件のみの一覧を表示する。
   */
  function handleHomeSearch_() {
    goToHomeResultsPage_({ keyword: $('homeKeyword').value.trim(), models: [] });
  }
  on('homeKeyword', 'keydown', function (e) {
    if (e.key === 'Enter') handleHomeSearch_();
  });

  // 検索結果ページ（#view-homeResults）側の操作。画像タップ（カード・グレード
  // チップ）・キーワード検索の絞り込みを解除し、ホームの絞り込みサイドバー条件
  // のみの一覧に戻す（ページ自体は移動しない）。
  on('btnHomeModelFilterClear', 'click', function () {
    state.homeModelFilter = [];
    state.homeResultsKeyword = '';
    renderHomeResultsPage_();
  });

  /**
   * ホームの検索結果一覧の行クリック。在庫リスト由来の車両（operationsHtml_が
   * Hold・受注・解除・受注確定ボタンを出している行）は、在庫リストの一覧
   * （handleInventoryListClick_）と同じくボタンのdata属性をそのまま見て直接
   * 操作できるようにする（現場からの要望「ホームの検索時もHOLD及び受注が
   * できるようにしてほしい」）。それ以外の箇所のタップは詳細モーダルを開く。
   */
  on('homeResultsList', 'click', function (e) {
    var target = e.target;
    var commission;
    if ('hold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.hold))) openActionModal('hold', commission); return; }
    if ('order' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.order))) openActionModal('order', commission); return; }
    if ('orderFromHold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.orderFromHold))) openActionModal('orderFromHold', commission); return; }
    if ('cancelHold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.cancelHold))) openCancelHoldModal(commission); return; }
    var tappable = target.closest('[data-ocn]');
    if (tappable && !target.closest('button, input, label')) openHomeResultDetail_(tappable.dataset.ocn);
  });

  // ===== Hold / 受注 共通モーダル =====
  var ACTION_LABELS = {
    hold: { title: 'Hold登録', button: 'Holdする', busyLabel: 'Hold登録中...', tone: 'hold' },
    order: { title: '受注確定', button: '受注確定する', busyLabel: '受注確定中...', tone: 'order' },
    orderFromHold: { title: '受注確定', button: '受注確定する', busyLabel: '受注確定中...', tone: 'order' }
  };
  var ORDER_TYPES = ['order', 'orderFromHold'];

  function actionFieldId_(key) {
    return 'action' + key.charAt(0).toUpperCase() + key.slice(1);
  }

  // ===== ログイン中のGoogleアカウントに紐づく担当者 =====
  // 担当者マスタ（設定タブ）にメールアドレスを登録しておくと、ログイン中のGoogleアカウントの
  // メールアドレスから自動的に担当者名が解決される（サーバー側 resolveStaffNameByEmail_ と
  // 同じ照合をAPI側で行い、bootstrap.currentStaffName として渡ってくる）。
  function currentStaffName_() {
    return state.bootstrap && state.bootstrap.currentStaffName;
  }

  // ログイン中の担当者が担当者マスタに登録している拠点名（未登録ならnull）。
  // Hold登録・受注確定モーダルの「販売拠点」欄の初期値に使う。
  function currentStaffLocation_() {
    return (state.bootstrap && state.bootstrap.currentStaffLocation) || '';
  }

  function currentUserEmail_() {
    return (state.bootstrap && state.bootstrap.currentUserEmail) || '';
  }

  // 本人確認は表示名ではなく必ずメールアドレスで行う（担当者マスタの表示名は
  // 後から変更され得るため、名前同士の比較だと表示名を変えただけで自分自身の
  // Holdを解除・受注確定できなくなる不具合の原因になる。サーバー側 canCancelHold_ /
  // canConfirmOrder_ も同様にメールアドレスで判定する）。
  function emailsMatch_(a, b) {
    return !!a && !!b && String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
  }

  function staffDisplayHtml_() {
    var name = currentStaffName_();
    var email = currentUserEmail_();
    if (name) {
      return '<b>' + escapeHtml(name) + '</b><span class="staffDisplay__email">' + escapeHtml(email) + '</span>';
    }
    return '<span class="staffDisplay__warn">担当者マスタ未登録（' + escapeHtml(email || '不明') + '）</span>';
  }

  // ログイン中の担当者情報を、コントロールパネル右端（#topbarUser）に
  // 氏名・メールアドレスのテキストとして表示する（以前のコントロールパネルと
  // 同じ見た目。アバター画像・ホバーツールチップは持たない簡易表示）。
  function renderTopbarUser() {
    var name = currentStaffName_();
    var email = currentUserEmail_();
    var infoHtml;
    if (name) {
      infoHtml = '<span class="topbar__userName">' + escapeHtml(name) + '</span>' +
        '<span class="topbar__userEmail">' + escapeHtml(email) + '</span>';
    } else if (email) {
      // メールアドレスは取得できているが、担当者マスタに未登録の場合。
      infoHtml = '<span class="topbar__userWarn">担当者未登録: ' + escapeHtml(email) + '</span>';
    } else {
      // メールアドレス自体が空の場合。ほとんどの場合、Webアプリのデプロイ設定
      // （「実行するユーザー」「アクセスできるユーザー」）が原因で
      // Session.getActiveUser().getEmail() が空文字を返している
      // （個人のGoogleアカウントで運用する場合、「アクセスできるユーザー」を
      // 「Googleアカウントを持つ全員」にする必要がある。「全員（匿名ユーザーを
      // 含む）」だとログイン自体が不要になり、アカウント情報を取得できない）。
      infoHtml = '<span class="topbar__userWarn" title="Webアプリのデプロイ設定（実行するユーザー・アクセスできるユーザー）をご確認ください">' +
        'ログイン情報を取得できません</span>';
    }
    $('topbarUser').innerHTML = infoHtml;
  }

  // ===== 在庫データ整合性チェック（アプリ起動時に1回だけ実行） =====
  // 在庫の追加・編集はスプレッドシートへ直接行う運用のため、コミッションの重複貼り付けや
  // モデル名の記入漏れ等、手作業ならではのミスが紛れ込むことがある。操作をブロックはせず、
  // 画面上部のバナーで気づけるようにするだけにとどめる。
  function checkIntegrity_() {
    gasRun('api_checkInventoryIntegrity').then(function (issues) {
      renderIntegrityBanner_(issues || []);
    }).catch(function () {
      // 整合性チェック自体の失敗は、通常の利用を妨げるべきではないため静かに無視する。
    });
  }

  function renderIntegrityBanner_(issues) {
    var banner = $('integrityBanner');
    if (!issues.length) {
      banner.classList.add('hidden');
      $('integrityBannerList').classList.add('hidden');
      return;
    }
    $('integrityBannerSummary').textContent = '在庫データに' + issues.length + '件の問題があります（スプレッドシートをご確認ください）';
    $('integrityBannerList').innerHTML = issues.map(function (issue) {
      return '<li>' + escapeHtml(issue.message) + '</li>';
    }).join('');
    banner.classList.remove('hidden');
  }

  on('btnIntegrityDetail','click', function () {
    $('integrityBannerList').classList.toggle('hidden');
  });

  on('btnIntegrityClose','click', function () {
    $('integrityBanner').classList.add('hidden');
    $('integrityBannerList').classList.add('hidden');
  });

  // ===== 予約モーダルのステップ進捗（顧客情報→契約内容） =====
  // スマホでの誤タップ・誤入力を減らすため、8項目を一度に出さず2ステップに分ける。
  var ACTION_STEP1_KEYS = ['salesLocation', 'leadNumber', 'customer'];

  /**
   * 管理者権限を持つ担当者がHoldをタップした場合、通常の顧客情報入力（step 1/2）の前に
   * Hold種別選択（'typePick'）を挟む。業販HOLD（'wholesale'）は通常の2ステップとは
   * 別の簡易フォーム1画面のみで完結する。業販HOLDが掛かっている車両から受注確定を
   * タップした場合は、typePickを経由せずいきなり'wholesaleOrder'（販売先・登録月の
   * みの簡易フォーム）へ入る（openActionModal参照）。
   * stepは 'typePick' | 1 | 2 | 'wholesale' | 'wholesaleOrder' のいずれか。
   */
  function goToActionStep_(step) {
    state.actionStep = step;
    var showTypePick = step === 'typePick';
    var showStep1 = step === 1;
    var showStep2 = step === 2;
    var showWholesale = step === 'wholesale';
    var showWholesaleOrder = step === 'wholesaleOrder';
    $('actionTypePickStep').classList.toggle('hidden', !showTypePick);
    $('actionStep1').classList.toggle('hidden', !showStep1);
    $('actionStep2').classList.toggle('hidden', !showStep2);
    $('actionStepWholesale').classList.toggle('hidden', !showWholesale);
    $('actionStepWholesaleOrder').classList.toggle('hidden', !showWholesaleOrder);

    var isNormalSteps = showStep1 || showStep2;
    $('actionStepFill').closest('.modal__stepBar').classList.toggle('hidden', !isNormalSteps);
    if (isNormalSteps) {
      $('actionStepFill').style.width = showStep1 ? '50%' : '100%';
      $('actionStepLabel').textContent = showStep1 ? 'ステップ 1/2　顧客情報' : 'ステップ 2/2　契約内容';
    }
    // ステップ2（契約内容）に入った直後は、先頭の「下取車の有無」に入力カーソルを
    // 合わせる（現場からの要望。スマホでは自動的にキーボード操作から続けられる）。
    if (showStep2) $('actionTradeIn').focus();
    // 「戻る」は、通常の2ステップ目からstep1へ、admin経由のstep1・業販HOLD簡易フォームからは
    // Hold種別選択画面へ戻れるようにする（それ以外・通常ユーザーのHold、業販HOLDからの
    // 受注確定では非表示のまま）。
    var canGoBack = showStep2 || showWholesale || (showStep1 && !!(state.action && state.action.adminHoldFlow));
    $('btnActionBack').classList.toggle('hidden', !canGoBack);
    $('btnActionNext').classList.toggle('hidden', !showStep1);
    $('btnActionSubmit').classList.toggle('hidden', !(showStep2 || showWholesale || showWholesaleOrder));
    $('actionModalError').classList.add('hidden');
  }

  on('btnActionNext','click', function () {
    var missing = missingRequiredFieldLabels_(ACTION_STEP1_KEYS);
    if (missing.length) {
      var errEl = $('actionModalError');
      errEl.textContent = '次の項目を入力してください: ' + missing.join('、');
      errEl.classList.remove('hidden');
      return;
    }
    goToActionStep_(2);
  });

  on('btnActionBack','click', function () {
    if (state.actionStep === 2) { goToActionStep_(1); }
    else if (state.actionStep === 1 || state.actionStep === 'wholesale') { goToActionStep_('typePick'); }
  });

  var ACTION_TYPE_PICK_TITLES = { normal: 'Hold登録', wholesale: '業販HOLD登録' };
  var ACTION_TYPE_PICK_BUTTONS = { normal: 'Holdする', wholesale: '業販HOLDする' };

  on('actionModal','click', function (e) {
    var btn = e.target.closest('[data-hold-type-pick]');
    if (!btn) return;
    var holdType = btn.dataset.holdTypePick;
    state.action.holdType = holdType;
    $('actionModalTitle').textContent = ACTION_TYPE_PICK_TITLES[holdType];
    $('btnActionSubmit').textContent = ACTION_TYPE_PICK_BUTTONS[holdType];
    if (holdType === 'normal') goToActionStep_(1);
    else goToActionStep_('wholesale');
  });

  // 管理者権限を持つ担当者（SYSTEM_ADMIN_EMAILS）のみ、通常のHoldに加えて業販HOLDを
  // 登録できる。設定タブのシステムマスタ表示・非表示（renderSettings）と
  // 同じ判定方法（state.bootstrap.isSystemAdmin）を使う。実際の権限チェックは
  // サーバー側 normalizeHoldType_ で行うため、ここでの判定はUI表示の制御のみ。
  function isSystemAdmin_() {
    return !!(state.bootstrap && state.bootstrap.isSystemAdmin);
  }

  function openActionModal(type, commission) {
    var currentStaff = currentStaffName_();
    if (!currentStaff) {
      showToast('担当者マスタに登録されていないため操作できません。設定タブでご自身のメールアドレスを登録してください（' + (currentUserEmail_() || '不明') + '）', true);
      return;
    }

    var vehicle = findVehicleByCommission(commission);
    var isOrderFromHold = type === 'orderFromHold' && vehicle;
    // 業販HOLD（HoldService.gsのHOLD_TYPE.WHOLESALE）が掛かっている車両からの
    // 受注確定は、通常の2ステップ・Hold種別選択を経由せず、「販売先」「登録月」の
    // みの簡易フォーム（'wholesaleOrder'）で完結する。
    var isWholesaleOrderFromHold = isOrderFromHold && vehicle.holdHoldType === 'wholesale';

    // 管理者権限を持つ担当者が「Hold」（1st Hold）をタップした場合のみ、通常のHoldに
    // 加えて業販HOLDを選べるHold種別選択画面を挟む。受注確定には
    // この選択画面は出さない（業販HOLDは1st Holdのみの機能のため）。
    var isAdminHoldPick = type === 'hold' && isSystemAdmin_();
    state.action = {
      type: type, commission: commission,
      holdType: isWholesaleOrderFromHold ? 'wholesale' : 'normal',
      adminHoldFlow: isAdminHoldPick
    };
    $('actionModalTitle').textContent = isWholesaleOrderFromHold ? '業販受注確定' : ACTION_LABELS[type].title;
    var submitBtn = $('btnActionSubmit');
    submitBtn.textContent = isWholesaleOrderFromHold ? '業販受注確定する' : ACTION_LABELS[type].button;
    delete submitBtn.dataset.originalLabel;
    // Hold系（hold）はオレンジ、受注系（order/orderFromHold）は青、と
    // 一目で操作の種類が分かるようモーダル全体の差し色を切り替える。
    var panel = document.querySelector('#actionModal .modal__panel');
    panel.classList.remove('modal__panel--hold', 'modal__panel--order');
    panel.classList.add('modal__panel--' + ACTION_LABELS[type].tone);
    submitBtn.disabled = false;
    $('actionModalError').classList.add('hidden');
    $('actionSalesStore').value = '';
    $('actionWholesaleSalesStore').value = '';
    $('actionWholesaleRegisteredMonth').value = '';

    if (isWholesaleOrderFromHold) {
      $('actionWholesaleSalesStore').value = vehicle.holdSalesStore || '';
      $('actionWholesaleRegisteredMonth').value = currentYearMonth();
      $('actionStaffDisplay').innerHTML = staffDisplayHtml_();
      // Hold中の車両は、業販HOLDを行った担当者のみ受注確定できる（通常の受注確定と
      // 同じ制約。canConfirmOrder_参照）。
      var wholesaleStaffMismatch = vehicle.holdStaffEmail && !emailsMatch_(vehicle.holdStaffEmail, currentUserEmail_());
      if (wholesaleStaffMismatch) {
        var wholesaleErrEl = $('actionModalError');
        wholesaleErrEl.textContent = 'このHoldの担当者は「' + vehicle.holdStaff + '」です。ログイン中の担当者（' + currentStaff + '）では受注確定できません。';
        wholesaleErrEl.classList.remove('hidden');
      }
      submitBtn.disabled = !!wholesaleStaffMismatch;
      goToActionStep_('wholesaleOrder');
      openModal($('actionModal'));
      return;
    }

    goToActionStep_(isAdminHoldPick ? 'typePick' : 1);

    var prefill;
    if (isOrderFromHold) {
      prefill = {
        // 入力欄には数字部分のみを表示する（「L-」は固定接頭辞として画面側に表示済み）
        leadNumber: String(vehicle.holdLeadNumber || '').replace(/^L-/i, ''),
        // 登録月はHold登録時点の月ではなく、受注確定を行う「今月」を既定値にする
        // （Holdからしばらく経ってから受注確定するケースがあるため）。
        registeredMonth: currentYearMonth(),
        customer: vehicle.holdCustomer,
        salesLocation: vehicle.holdSalesLocation,
        tradeIn: vehicle.holdTradeIn,
        oss: vehicle.holdOss,
        insurance: vehicle.holdInsurance,
        paymentMethod: vehicle.holdPaymentMethod
      };
    } else {
      // Hold登録・新規の受注確定は、担当者マスタに登録された
      // ログイン中の担当者本人の拠点名を販売拠点欄の初期値にする（編集可）。
      prefill = {
        leadNumber: '', registeredMonth: currentYearMonth(), customer: '',
        salesLocation: currentStaffLocation_(), tradeIn: '', oss: '', insurance: '', paymentMethod: ''
      };
    }

    $('actionStaffDisplay').innerHTML = staffDisplayHtml_();

    // Hold中の車両は、Holdを行った担当者のみ受注確定できる。ログイン中のメールアドレスが
    // Hold担当者のメールアドレスと異なる場合は、送信前に気づけるようここで警告し送信を
    // ブロックする（最終判定はサーバー側 canConfirmOrder_ で行う。表示名ではなく
    // メールアドレスで比較する — emailsMatch_ 参照）。
    var staffMismatch = isOrderFromHold && vehicle.holdStaffEmail && !emailsMatch_(vehicle.holdStaffEmail, currentUserEmail_());
    if (staffMismatch) {
      var errEl = $('actionModalError');
      errEl.textContent = 'このHoldの担当者は「' + vehicle.holdStaff + '」です。ログイン中の担当者（' + currentStaff + '）では受注確定できません。';
      errEl.classList.remove('hidden');
    }
    submitBtn.disabled = !!staffMismatch;

    $('actionSalesLocation').value = prefill.salesLocation || '';
    $('actionLeadNumber').value = prefill.leadNumber || '';
    $('actionRegisteredMonth').value = prefill.registeredMonth || currentYearMonth();
    $('actionCustomer').value = prefill.customer || '';
    $('actionTradeIn').value = prefill.tradeIn || '';
    $('actionOss').value = prefill.oss || '';
    $('actionInsurance').value = prefill.insurance || '';
    $('actionPaymentMethod').value = prefill.paymentMethod || '';

    openModal($('actionModal'));
  }

  // リード番号は「L-」固定接頭辞＋数字のみで扱う。入力欄には数字部分のみを
  // 持たせ、数字以外が入力されてもその場で取り除く。
  on('actionLeadNumber','input', function () {
    var digits = this.value.replace(/[^0-9]/g, '');
    if (this.value !== digits) this.value = digits;
  });

  function findVehicleByCommission(commission) {
    var found = (state.inventoryItems || []).find(function (v) { return commissionEquals_(v.commission, commission); });
    if (found) return found;
    // 在庫リストの検索・絞り込み条件で対象外になっていても（マイページ等、
    // 別画面のカードから操作した場合など）見つけられるよう、フィルタに
    // 左右されない全件キャッシュ（state.allInventoryItems）も探す。
    return (state.allInventoryItems || []).find(function (v) { return commissionEquals_(v.commission, commission); }) || null;
  }

  /**
   * ＯＣＮで車両を検索する（findVehicleByCommissionのＯＣＮ版）。一覧行タップ
   * での詳細表示は、こちらを使う（不具合修正: コミッションは任意入力のため
   * 未入力の車両が複数あると、コミッションでの検索では別の車両の詳細が
   * 開いてしまう・何も見つからず開かない、という事象があった。ＯＣＮは
   * 必須入力かつ一意のキー列のため、詳細表示の検索には常にこちらを使う。
   * Hold・受注等の操作自体は、これまでどおりコミッションをキーに行う
   * （HoldService.gs・OrderService.gs側の都合によるもので、ここでは
   * 変更していない）。
   */
  function findVehicleByOcn_(ocn) {
    var found = (state.inventoryItems || []).find(function (v) { return String(v.ocn) === String(ocn); });
    if (found) return found;
    return (state.allInventoryItems || []).find(function (v) { return String(v.ocn) === String(ocn); }) || null;
  }

  // ===== Hold解除 =====
  // 「解除しようとしているのは誰か」は、ログイン中のGoogleアカウントのメールアドレスと、
  // Hold登録時の担当者のメールアドレスが一致するかで判定する（表示名の比較ではない）。
  var cancelHoldState = null; // { commission }

  function openCancelHoldModal(commission) {
    var currentStaff = currentStaffName_();
    if (!currentStaff) {
      showToast('担当者マスタに登録されていないため操作できません。設定タブでご自身のメールアドレスを登録してください（' + (currentUserEmail_() || '不明') + '）', true);
      return;
    }
    var vehicle = findVehicleByCommission(commission);
    if (!vehicle) return;
    var holdStaff = vehicle.holdStaff;
    var holdStaffEmail = vehicle.holdStaffEmail;
    var holdCustomer = vehicle.holdCustomer;

    cancelHoldState = { commission: commission };
    $('cancelHoldModalTitle').textContent = 'HOLDの解除';
    $('cancelHoldModalDesc').textContent =
      'このHOLD（顧客: ' + (holdCustomer || '-') + '）を登録した担当者「' +
      (holdStaff || '-') + '」のみ解除できます。';
    $('cancelHoldStaffDisplay').innerHTML = staffDisplayHtml_();
    $('cancelHoldModalError').classList.add('hidden');

    var submitBtn = $('btnCancelHoldSubmit');
    delete submitBtn.dataset.originalLabel;
    var staffMismatch = holdStaffEmail && !emailsMatch_(holdStaffEmail, currentUserEmail_());
    if (staffMismatch) {
      var errEl = $('cancelHoldModalError');
      errEl.textContent = 'このHoldの担当者は「' + holdStaff + '」です。ログイン中の担当者（' + currentStaff + '）では解除できません。';
      errEl.classList.remove('hidden');
    }
    submitBtn.disabled = !!staffMismatch;
    openModal($('cancelHoldModal'));
  }

  on('btnCancelHoldSubmit','click', function () {
    if (this.disabled || !cancelHoldState) return;
    var btn = this;
    var errEl = $('cancelHoldModalError');
    errEl.classList.add('hidden');
    setButtonBusy(btn, true, '解除中...');
    gasRun('api_cancelHold', cancelHoldState.commission).then(function () {
      setButtonBusy(btn, false);
      closeModal($('cancelHoldModal'));
      showToast('Holdを解除しました');
      loadInventory();
      loadAllInventoryItems_();
      loadHomeVehiclePool_();
    }).catch(function (err) {
      setButtonBusy(btn, false);
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    });
  });

  // ===== 受注キャンセル（管理者限定） =====
  // 誤って受注確定してしまった場合等に、受注を取り消して在庫リストへ戻す訂正機能。
  // Hold解除（cancelHoldState・openCancelHoldModal）と異なり、対象の受注を
  // 確定した担当者が誰かは問わない（本人一致チェックは行わない）。管理者であれば、
  // 自分以外の担当者が確定した受注も含めてキャンセルできるため、ここでは
  // Hold解除のような担当者不一致の警告表示・送信ブロックは行わない。
  // 実際の権限チェックはサーバー側cancelOrder（OrderService.gs）で行うため、
  // ここでのisSystemAdmin_判定はボタンの表示・非表示のみを制御する。
  var cancelOrderState = null; // { commission }

  function openCancelOrderModal_(commission) {
    var order = findOrderByCommission_(commission);
    if (!order) return;
    cancelOrderState = { commission: commission };
    $('cancelOrderModalDesc').textContent =
      'この受注（顧客: ' + (order.customer || '-') + '・' + (order.model || '-') + '）を取り消し、' +
      '在庫リストへ「在庫あり」の状態で戻します。受注確定時のHold情報（担当者・期限等）は復元されません。';
    $('cancelOrderStaffDisplay').innerHTML = staffDisplayHtml_();
    $('cancelOrderModalError').classList.add('hidden');
    var submitBtn = $('btnCancelOrderSubmit');
    delete submitBtn.dataset.originalLabel;
    submitBtn.disabled = false;
    openModal($('cancelOrderModal'));
  }

  on('btnCancelOrderSubmit','click', function () {
    if (this.disabled || !cancelOrderState) return;
    var btn = this;
    var errEl = $('cancelOrderModalError');
    errEl.classList.add('hidden');
    setButtonBusy(btn, true, 'キャンセル中...');
    gasRun('api_cancelOrder', cancelOrderState.commission).then(function () {
      setButtonBusy(btn, false);
      closeModal($('cancelOrderModal'));
      showToast('受注をキャンセルし、在庫リストへ戻しました');
      loadInventory();
      loadOrders();
      loadAllInventoryItems_();
      loadHomeVehiclePool_();
    }).catch(function (err) {
      setButtonBusy(btn, false);
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    });
  });

  on('orderDetailModal','click', function (e) {
    var btn = e.target.closest('[data-order-cancel]');
    if (!btn) return;
    closeModal($('orderDetailModal'));
    openCancelOrderModal_(btn.dataset.orderCancel);
  });

  // ===== 業販受注キャンセル（管理者限定） =====
  // cancelOrderState・openCancelOrderModal_と同じパターン（業販受注リスト専用）。
  var cancelWholesaleOrderState = null; // { commission }

  function openCancelWholesaleOrderModal_(commission) {
    var order = findWholesaleOrderByCommission_(commission);
    if (!order) return;
    cancelWholesaleOrderState = { commission: commission };
    $('cancelWholesaleOrderModalDesc').textContent =
      'この業販受注（販売先: ' + (order.salesStore || '-') + '・' + (order.model || '-') + '）を取り消し、' +
      '在庫リストへ「在庫あり」の状態で戻します。受注確定時のHold情報（担当者・期限等）は復元されません。';
    $('cancelWholesaleOrderStaffDisplay').innerHTML = staffDisplayHtml_();
    $('cancelWholesaleOrderModalError').classList.add('hidden');
    var submitBtn = $('btnCancelWholesaleOrderSubmit');
    delete submitBtn.dataset.originalLabel;
    submitBtn.disabled = false;
    openModal($('cancelWholesaleOrderModal'));
  }

  on('btnCancelWholesaleOrderSubmit','click', function () {
    if (this.disabled || !cancelWholesaleOrderState) return;
    var btn = this;
    var errEl = $('cancelWholesaleOrderModalError');
    errEl.classList.add('hidden');
    setButtonBusy(btn, true, 'キャンセル中...');
    gasRun('api_cancelWholesaleOrder', cancelWholesaleOrderState.commission).then(function () {
      setButtonBusy(btn, false);
      closeModal($('cancelWholesaleOrderModal'));
      showToast('業販受注をキャンセルし、在庫リストへ戻しました');
      loadInventory();
      loadWholesaleOrders();
      loadAllInventoryItems_();
      loadHomeVehiclePool_();
    }).catch(function (err) {
      setButtonBusy(btn, false);
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    });
  });

  on('wholesaleOrderDetailModal','click', function (e) {
    var btn = e.target.closest('[data-wholesale-order-cancel]');
    if (!btn) return;
    closeModal($('wholesaleOrderDetailModal'));
    openCancelWholesaleOrderModal_(btn.dataset.wholesaleOrderCancel);
  });

  /**
   * Hold登録・受注確定は全項目（販売拠点を含む）の入力が必須。
   * 未入力の項目があればラベルを列挙して返す。担当者（staff）はログイン中の
   * Googleアカウントから自動設定されるため、ここでの入力必須チェックからは除外する
   * （openActionModalで別途チェック済み）。
   */
  function missingRequiredFieldLabels_(filterKeys) {
    var missing = [];
    var columns = (state.bootstrap && state.bootstrap.holdOrderInputColumns) || [];
    columns.forEach(function (c) {
      if (!c.required || c.key === 'staff') return;
      if (filterKeys && filterKeys.indexOf(c.key) === -1) return;
      var field = $(actionFieldId_(c.key));
      if (!field || !field.value || !String(field.value).trim()) missing.push(c.label);
    });
    return missing;
  }

  function validateActionForm_() {
    return missingRequiredFieldLabels_(null);
  }

  /**
   * Hold登録・受注確定完了後の共通後処理（成功トースト代わりの演出・一覧の再読込）。
   * 業販HOLD登録・業販受注確定（簡易フォーム）と、通常のHold・受注確定の
   * どちらの完了後も同じ処理でよいため共通化している。
   */
  function finishActionSubmit_(btn) {
    setButtonBusy(btn, false);
    closeModal($('actionModal'));
    showCelebration_(state.action.type);
    loadInventory();
    loadAllInventoryItems_();
    // 不具合修正: ホームの検索結果ページからもHold・受注ができるようになったため
    // （現場からの要望）、在庫リスト同様ここでも車両プールを取り直し、ホームの
    // ギャラリー・検索結果ページのステータス表示を最新化する。
    loadHomeVehiclePool_();
    if (ORDER_TYPES.indexOf(state.action.type) !== -1) loadOrders();
    if (state.action.type === 'orderFromHold' && state.action.holdType === 'wholesale') loadWholesaleOrders();
  }

  function handleActionSubmitError_(btn, err) {
    setButtonBusy(btn, false);
    var el = $('actionModalError');
    el.textContent = err.message;
    el.classList.remove('hidden');
  }

  on('btnActionSubmit','click', function () {
    if (this.disabled) return;
    var btn = this;
    var action = state.action;

    // 業販HOLDは、通常のHoldの入力項目（顧客・下取車の有無等）を一切要求しない
    // 簡易フォームのため、通常フローの必須チェック（validateActionForm_）は行わず
    // ここで完結させる（管理者のみ到達できる。openActionModal参照）。
    if (action.type === 'hold' && action.holdType === 'wholesale') {
      var wholesaleHoldInfo = { salesStore: $('actionSalesStore').value.trim() };
      $('actionModalError').classList.add('hidden');
      setButtonBusy(btn, true, '業販HOLD登録中...');
      gasRun('api_registerHold', action.commission, wholesaleHoldInfo, 'wholesale')
        .then(function () { finishActionSubmit_(btn); })
        .catch(function (err) { handleActionSubmitError_(btn, err); });
      return;
    }

    // 業販HOLDからの受注確定は、「販売先」「登録月」のみの簡易フォームのため、
    // 通常フローの必須チェック（validateActionForm_）とは別に、ここで完結させる
    // （openActionModal参照）。
    if (action.type === 'orderFromHold' && action.holdType === 'wholesale') {
      var wholesaleOrderInfo = {
        salesStore: $('actionWholesaleSalesStore').value.trim(),
        registeredMonth: $('actionWholesaleRegisteredMonth').value || ''
      };
      if (!wholesaleOrderInfo.salesStore || !wholesaleOrderInfo.registeredMonth) {
        var wholesaleOrderErrEl = $('actionModalError');
        wholesaleOrderErrEl.textContent = '次の項目を入力してください: 販売先、登録月';
        wholesaleOrderErrEl.classList.remove('hidden');
        return;
      }
      $('actionModalError').classList.add('hidden');
      setButtonBusy(btn, true, '業販受注確定中...');
      gasRun('api_confirmWholesaleOrder', action.commission, wholesaleOrderInfo)
        .then(function () { finishActionSubmit_(btn); })
        .catch(function (err) { handleActionSubmitError_(btn, err); });
      return;
    }

    var missing = validateActionForm_();
    if (missing.length) {
      var errEl = $('actionModalError');
      errEl.textContent = '次の項目を入力してください: ' + missing.join('、');
      errEl.classList.remove('hidden');
      return;
    }

    var info = {
      salesLocation: $('actionSalesLocation').value.trim(),
      // リード番号は「L-」固定接頭辞＋数字（入力欄には数字のみを持たせている）
      leadNumber: 'L-' + $('actionLeadNumber').value.trim().replace(/[^0-9]/g, ''),
      registeredMonth: $('actionRegisteredMonth').value,
      customer: $('actionCustomer').value.trim(),
      tradeIn: $('actionTradeIn').value,
      oss: $('actionOss').value,
      insurance: $('actionInsurance').value,
      paymentMethod: $('actionPaymentMethod').value
    };
    var apiCall;
    if (action.type === 'hold') apiCall = gasRun('api_registerHold', action.commission, info, 'normal');
    else apiCall = gasRun('api_confirmOrder', action.commission, info);

    $('actionModalError').classList.add('hidden');
    setButtonBusy(btn, true, ACTION_LABELS[action.type].busyLabel);

    apiCall.then(function () {
      finishActionSubmit_(btn);
    }).catch(function (err) {
      handleActionSubmitError_(btn, err);
    });
  });

  // ===== 受注リスト =====
  // ラジオボタン群（グループ化等、単一選択かつ「それぞれ項目を分けて配置」したい
  // 場合に使う。.filterCheckの見た目をそのままtype="radio"で流用する）から、
  // 選択中の値を取り出す。
  function checkedRadioValue_(containerId) {
    var el = document.querySelector('#' + containerId + ' input[type="radio"]:checked');
    return el ? el.value : '';
  }

  // 「クリア」の表示・非表示を、現在の拠点・担当者・現展示拠点の選択状態に合わせて更新する。
  function syncOrdersFilterClearVisibility_() {
    var hasLocation = !!$('ordersLocationFilter').value;
    var hasStaff = !!$('ordersStaffFilter').value;
    var hasDisplayLocation = state.ordersFilters.currentDisplayLocation.length > 0;
    $('btnOrdersFilterClear').classList.toggle('hidden', !(hasLocation || hasStaff || hasDisplayLocation));
  }
  // 「現展示拠点」の絞り込みチェックボックスを、取得済みの全グループの車両から
  // 動的に作り直す（在庫リストのrenderInventoryFilterSidebar_と同じ考え方）。
  function renderOrdersLocationFilterSidebar_() {
    var allItems = (state.ordersGroups || []).reduce(function (acc, g) { return acc.concat(g.items || []); }, []);
    $('ordersDisplayLocationFilter').innerHTML = checkboxFilterOptionsHtml_(allItems, 'currentDisplayLocation', state.ordersFilters.currentDisplayLocation);
  }
  function loadOrders() {
    var filters = {
      keyword: $('ordersKeyword').value,
      salesLocation: $('ordersLocationFilter').value,
      staff: $('ordersStaffFilter').value
    };
    var groupBy = checkedRadioValue_('ordersGroupByFilter');
    syncOrdersFilterClearVisibility_();
    return gasRun('api_listOrders', filters, groupBy).then(function (groups) {
      state.ordersGroups = groups || [];
      renderOrdersLocationFilterSidebar_();
      renderOrders();
    }).catch(function (err) { showToast(err.message, true); });
  }

  /**
   * 受注リストタブ・マイページ「受注した車両」共通の一覧行見出し。現場からの
   * 要望「在庫リスト・デモカーリスト・サービス代車リストと表示項目を統一して
   * ほしい」「受注リストは統一した項目にプラスして顧客名と登録月を記載して
   * ほしい」を受け、車両情報の列（区分・モデル・初年度登録日・走行距離・
   * 車検満了日・登録番号・現展示拠点・価格）は在庫リスト・デモカー
   * リスト・サービス代車リストと完全に同じ並びにし、末尾に受注リスト固有の
   * 「顧客名」「登録月」を追加する（orderTableRowHtml_と列を揃える。tbl--order、
   * Stylesheet.html参照）。以前あった「拠点」（販売拠点）・「担当」は列からは
   * 外したが、行タップで開く詳細ポップアップ（orderDetailHtml_）では引き続き
   * 確認できる。外装色・内装色も一覧行には出さず、詳細ポップアップにまとめる
   * （現場からの要望「外装色・内装色は詳細に戻してほしい。他の項目は省略せず
   * 全文表示にしてほしい」）。マイページの「受注した車両」も同じテーブル表示を
   * 使う（renderMyPageOrders_参照）。
   */
  function orderTableHeaderHtml_() {
    return '<div class="tblHead">' +
      '<div></div><div>区分</div><div>モデル</div><div>初年度登録日</div><div>走行距離</div>' +
      '<div>車検満了日</div><div>登録番号</div><div>現展示拠点</div><div>価格</div>' +
      '<div>顧客名</div><div>登録月</div><div></div>' +
      '</div>';
  }

  /**
   * 受注リストタブの一覧行（横一列テーブル表示）。orderTableHeaderHtml_参照。
   */
  function orderTableRowHtml_(o, num) {
    return '<div class="tblRow" data-commission="' + escapeHtml(o.commission) + '" data-ocn="' + escapeHtml(o.ocn) + '">' +
      '<div class="tblCell tblCell--num">' + rowNum_(num) + '</div>' +
      '<div class="tblCell"><span class="tag">' + escapeHtml(o.category || '-') + '</span></div>' +
      '<div class="tblCell tblCell--strong" title="' + escapeHtml(o.model) + '">' + escapeHtml(o.model) + '</div>' +
      '<div class="tblCell">' + escapeHtml(o.firstRegistrationDate || '-') + '</div>' +
      '<div class="tblCell">' + escapeHtml(formatNumberUnit_(o.mileage, ' km') || '-') + '</div>' +
      '<div class="tblCell">' + escapeHtml(o.inspectionExpiryDate || '-') + '</div>' +
      '<div class="tblCell" title="' + escapeHtml(plateText_(o)) + '">' + escapeHtml(plateText_(o) || '-') + '</div>' +
      '<div class="tblCell tblCell--strong">' + escapeHtml(o.currentDisplayLocation || '-') + '</div>' +
      '<div class="tblCell">' + escapeHtml(formatNumberUnit_(o.salePrice, ' 円') || '-') + '</div>' +
      '<div class="tblCell tblCell--strong" title="' + escapeHtml(o.customer || '-') + '">' + escapeHtml(o.customer || '-') + '</div>' +
      '<div class="tblCell">' + escapeHtml(o.registeredMonth || '-') + '</div>' +
      '<div class="tblCell tblCell--chev">›</div>' +
      '</div>';
  }

  /**
   * 受注情報の詳細ポップアップ。在庫リストの車両詳細モーダル（vehicleDetailHtml_）と
   * 同じ「概要／詳細スペック／受注状況」の3カラムレイアウトに統一する（現場からの
   * 要望「受注リストをタップした際も在庫リストのようなポップアップ形式にしてほしい」。
   * modal__panel--vehicleをorderDetailModalにも適用することでPC・タブレット幅の

   */
  function orderDetailHtml_(o) {
    return '<div class="card">' +
      '<div class="card__detailCol card__detailCol--overview">' +
      '<div class="card__top">' +
      '<div class="card__topRow">' +
      '<div><div class="card__model">' + escapeHtml(o.customer || '-') + '</div>' +
      '<div class="card__commission">担当者 ' + escapeHtml(o.staff || '-') + '</div></div>' +

      '<div class="card__badges"><span class="badge badge--location">' + escapeHtml(o.salesLocation || '-') + '</span></div>' +
      '</div>' +
      '<dl class="card__metaGrid card__metaGrid--quick">' +
      metaRow_('モデル', o.model) +
      metaRow_('ＯＣＮ', o.ocn) +
      metaRowFull_('外装色', o.exteriorColor) +
      metaRowFull_('内装色', o.interiorColor) +
      metaRow_('登録番号', plateText_(o)) +
      metaRow_('走行距離', formatNumberUnit_(o.mileage, ' km')) +
      metaRow_('販売価格', formatNumberUnit_(o.salePrice, ' 円')) +
      metaRow_('MP', o.mp) +
      '</dl>' +
      '</div>' +
      '<div class="card__detailCol card__detailCol--spec">' +
      '<dl class="card__metaGrid">' +
      metaRow_('区分', o.category) +
      metaRow_('型式', o.modelCode) +
      metaRow_('車台番号下４桁', o.chassisNumberLast4) +
      metaRow_('車検満了日', o.inspectionExpiryDate, inspectionExpiryTone_(o.inspectionExpiryDate)) +
      '</dl>' +
      noteBlockHtml_('オプション', o.option, 'オプションの登録はありません。') +
      '</div>' +
      '<div class="card__detailCol card__detailCol--hold">' +

      metaRow_('保険加入の有無', o.insurance) +

      (isSystemAdmin_()
        ? '<div class="card__actions"><button type="button" class="btn btn--danger" data-order-cancel="' + escapeHtml(o.commission) + '">受注キャンセル</button></div>'

  function findOrderByCommission_(commission) {
    var groups = state.ordersGroups || [];
    for (var i = 0; i < groups.length; i++) {
      var items = groups[i].items || [];
      for (var j = 0; j < items.length; j++) {
        if (commissionEquals_(items[j].commission, commission)) return items[j];
      }
    }
    // 受注リストの検索・絞り込み条件で対象外になっていても（マイページ等、
    // 別画面のカードから操作した場合など）見つけられるよう、フィルタに
    // 左右されない全件キャッシュ（state.allOrders）も探す。
    return (state.allOrders || []).find(function (o) { return commissionEquals_(o.commission, commission); }) || null;
  }

  /**
   * ＯＣＮで受注を検索する（findOrderByCommission_のＯＣＮ版）。一覧行タップ
   * での詳細表示は、こちらを使う（findVehicleByOcn_と同じ理由。受注キャンセル
   * 操作自体は、これまでどおりコミッションをキーに行う）。
   */
  function findOrderByOcn_(ocn) {
    var groups = state.ordersGroups || [];
    for (var i = 0; i < groups.length; i++) {
      var items = groups[i].items || [];
      for (var j = 0; j < items.length; j++) {
        if (String(items[j].ocn) === String(ocn)) return items[j];
      }
    }
    return (state.allOrders || []).find(function (o) { return String(o.ocn) === String(ocn); }) || null;
  }

  function openOrderDetailModal_(ocn) {
    var order = findOrderByOcn_(ocn);
    if (!order) return;
    $('orderDetailBody').innerHTML = orderDetailHtml_(order);
    openModal($('orderDetailModal'));
  }

  /**
   * 受注リスト上部の月別件数ナビ（#ordersMonthNav）用のチップHTMLを組み立てる
   * （純粋関数）。グループ化「月ごと」が使う受注確定月（orderedMonth。
   * api_listOrders、Api.gs参照。受注確定日時orderedAtから「2026-08」形式で
   * 算出される値で、現場が入力する「登録月」registeredMonthとは別の値）ごとの
   * 件数を、groupByField_（SearchService.gs）と同じ昇順（未設定は末尾）で
   * 並べる。グループ化が「月ごと」のときに画面に並ぶグループの順序と一致させる
   * ことで、チップの並び＝実際にスクロールする方向になり、直感的に対応づけ
   * られる（現場からの要望「受注リスト内上部に受注台数と月を表示する
   * （対象月までスクロール）ボタンを作成してほしい」）。
   */
  function ordersMonthChipsHtml_(items) {
    var counts = {};
    items.forEach(function (o) {
      var m = o.orderedMonth || '未設定';
      counts[m] = (counts[m] || 0) + 1;
    });
    var months = Object.keys(counts).sort(function (a, b) {
      if (a === '未設定') return 1;
      if (b === '未設定') return -1;
      return a < b ? -1 : a > b ? 1 : 0;
    });
    return months.map(function (m) {
      return '<button type="button" class="homeTypeNav__item" data-month-chip="' + escapeHtml(m) + '">' +
        escapeHtml(m) + '<span class="homeTypeNav__item__count">' + counts[m] + '台</span></button>';
    }).join('');
  }

  function renderOrders() {
    var container = $('ordersGroups');
    var rawGroups = state.ordersGroups || [];
    var locationFilter = state.ordersFilters.currentDisplayLocation;
    var groups = rawGroups
      .map(function (g) { return { key: g.key, items: filterByCheckedValues_(g.items, 'currentDisplayLocation', locationFilter) }; })
      .filter(function (g) { return !g.key || g.items.length > 0; });
    var totalItems = groups.reduce(function (n, g) { return n + g.items.length; }, 0);
    $('ordersEmpty').classList.toggle('hidden', totalItems > 0);
    $('ordersTotalCount').textContent = '該当 ' + totalItems + ' 台';
    var isMonthGrouped = checkedRadioValue_('ordersGroupByFilter') === 'orderedMonth';
    container.innerHTML = groups.map(function (g) {
      var heading = g.key
        ? '<h3 class="group__title">' + escapeHtml(g.key) + '<span class="group__count">' + g.items.length + '台</span></h3>'
        : '';
      var monthAttr = isMonthGrouped && g.key ? ' data-month-group="' + escapeHtml(g.key) + '"' : '';
      return '<div class="group"' + monthAttr + '>' + heading + tableListHtml_('tbl--order', orderTableHeaderHtml_(), g.items, orderTableRowHtml_) + '</div>';
    }).join('');
    $('ordersMonthNav').innerHTML = ordersMonthChipsHtml_(groups.reduce(function (acc, g) { return acc.concat(g.items); }, []));
    wireTableHeaderScrollSync_(container);
    syncFilterRowsAndSummary_('ordersFilterRows', 'ordersActiveBar', 'btnOrdersFilterClear');
  }

    var groups = state.wholesaleOrdersGroups || [];
    for (var i = 0; i < groups.length; i++) {

      for (var j = 0; j < items.length; j++) {

  function populateStaffFilter_(selectId) {
    var select = $(selectId);

    select.innerHTML = '';
    select.appendChild(new Option('担当者：すべて', ''));
    names.forEach(function (n) { select.appendChild(new Option(n, n)); });
    if (names.indexOf(current) !== -1) select.value = current;

  /**
   * 拠点フィルタの選択肢は、担当者マスタに登録済みの拠点名から動的に作る
   * （担当者マスタの拠点は、Hold登録・受注確定の「販売拠点」欄の初期値としても
   * 使われる同じ値のため、実際に使われうる拠点名の一覧として流用できる）。

  function populateLocationFilter_(selectId) {
    var select = $(selectId);
    var current = select.value;
    var locations = [];
    ((state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.staffList) || []).forEach(function (s) {
      var loc = s.location;
      if (loc && locations.indexOf(loc) === -1) locations.push(loc);

    select.appendChild(new Option('拠点：すべて', ''));
    locations.forEach(function (loc) { select.appendChild(new Option(loc, loc)); });
    if (locations.indexOf(current) !== -1) select.value = current;
  }

  // ===== デモカーリスト／サービス代車リスト =====
  // 在庫リストとは別の専用シートへ直接入力・編集する独立した一覧（CarTrackingService.gs
  // 参照）。以前は管理者権限を持つ担当者にのみタブ自体を表示していたが、現場からの
  // 要望「デモカー、サービス代車リストも全員が見れるようにしてほしい」を受け、
  // 全担当者に公開した（.navBtn--adminOnlyクラスを外している、Index.html参照。
  // サーバー側api_listDemoCarList・api_listServiceCarListも管理者判定は行わない）。
  // Hold・受注確定などの操作は行わない閲覧専用の一覧のため、
  // 区分・掲載状況の絞り込みは持たないが、在庫リストと同じカラー・初年度登録日・
  // 価格帯・走行距離に加え、このリスト専用の販売状況（在庫中／販売済み）を
  // 左の絞り込みサイドバーに持たせる（現場からの要望「それぞれのページに
  // 適した条件検索を追加してほしい」）。キーワード検索はサーバー側
  // （searchCarTracking相当のapi_listDemoCarList・api_listServiceCarList）、
  // それ以外のサイドバーの絞り込みは在庫リストと同じく取得済みの一覧を
  // クライアント側だけで絞り込み直す（applyCarTrackingFilters_参照）。
  // デモカーリスト・サービス代車リストはまったく同じ構造のため、
  // makeCarTrackingController_で共通のロード・描画・絞り込み・行クリック処理を
  // まとめて生成する（区分の値・要素IDだけが異なる）。
  function makeCarTrackingController_(opts) {
    function load() {
      var filters = { keyword: $(opts.keywordId).value };
      return gasRun(opts.apiFn, filters).then(function (items) {
        state[opts.stateKey] = items || [];
        renderFilterSidebar();
        render();
      }).catch(function (err) { showToast(err.message, true); });
    }

    function renderFilterSidebar() {
      var items = state[opts.stateKey] || [];
      var colors = [];
      items.forEach(function (v) { if (v.exteriorColor && colors.indexOf(v.exteriorColor) === -1) colors.push(v.exteriorColor); });
      colors.sort();
      var colorSelect = $(opts.colorFilterId);
      var f = state[opts.filtersKey];
      colorSelect.innerHTML = '<option value="">指定なし</option>' + colors.map(function (c) {
        return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>';
      }).join('');
      colorSelect.value = colors.indexOf(f.color) !== -1 ? f.color : '';
      if (colorSelect.value !== f.color) f.color = colorSelect.value;
      fillStaticSelectOptions_(opts.yearFilterId, YEAR_BUCKET_OPTIONS, f.yearBucket);
      fillStaticSelectOptions_(opts.priceFilterId, PRICE_BUCKET_OPTIONS, f.priceBucket);
      fillStaticSelectOptions_(opts.mileageFilterId, MILEAGE_BUCKET_OPTIONS, f.mileageBucket);
      $(opts.locationFilterId).innerHTML = checkboxFilterOptionsHtml_(items, 'currentDisplayLocation', f.location);
      syncClearVisibility();
    }

    function syncClearVisibility() {
      var f = state[opts.filtersKey];
      var hasAny = !!f.color || !!f.yearBucket || !!f.priceBucket || !!f.mileageBucket || f.status.length > 0 || f.location.length > 0;
      $(opts.clearBtnId).classList.toggle('hidden', !hasAny);
    }

    function render() {
      var all = state[opts.stateKey] || [];
      var filtered = applyCarTrackingFilters_(all, state[opts.filtersKey]);
      $(opts.emptyId).classList.toggle('hidden', filtered.length > 0);
      $(opts.countId).textContent = all.length ? '該当 ' + filtered.length + '台 ／ 全' + all.length + '台' : '';
      $(opts.bodyId).innerHTML = tableListHtml_('tbl--cartrack', carTrackingTableHeaderHtml_(), filtered, carTrackingTableRowHtml_);
      wireTableHeaderScrollSync_($(opts.bodyId));
      syncFilterRowsAndSummary_(opts.rowsId, opts.activeBarId, opts.clearBtnId);
    }

    function findByOcn(ocn) {
      return (state[opts.stateKey] || []).find(function (v) { return String(v.ocn) === String(ocn); }) || null;
    }

    function openDetail(ocn) {
      var v = findByOcn(ocn);
      if (!v) return;
      $(opts.detailBodyId).innerHTML = carTrackingDetailHtml_(v);
      openModal($(opts.detailModalId));
    }

    on(opts.bodyId, 'click', function (e) {
      var tappable = e.target.closest('[data-ocn]');
      if (tappable) openDetail(tappable.dataset.ocn);
    });
    on(opts.keywordId, 'input', debounce(load, 250));

    [[opts.colorFilterId, 'color'], [opts.yearFilterId, 'yearBucket'], [opts.priceFilterId, 'priceBucket'], [opts.mileageFilterId, 'mileageBucket']].forEach(function (pair) {
      on(pair[0], 'change', function () {
        state[opts.filtersKey][pair[1]] = this.value;
        render();
        syncClearVisibility();
      });
    });
    on(opts.statusFilterId, 'change', function (e) {
      if (e.target.type !== 'checkbox') return;
      state[opts.filtersKey].status = Array.prototype.slice.call($(opts.statusFilterId).querySelectorAll('input[type="checkbox"]:checked'))
        .map(function (el) { return el.value; });
      render();
      syncClearVisibility();
    });
    on(opts.locationFilterId, 'change', function (e) {
      if (e.target.type !== 'checkbox') return;
      state[opts.filtersKey].location = Array.prototype.slice.call($(opts.locationFilterId).querySelectorAll('input[type="checkbox"]:checked'))
        .map(function (el) { return el.value; });
      render();
      syncClearVisibility();
    });
    on(opts.clearBtnId, 'click', function () {
      state[opts.filtersKey] = { color: '', yearBucket: '', priceBucket: '', mileageBucket: '', status: [], location: [] };
      $(opts.keywordId).value = '';
      document.querySelectorAll('#' + opts.statusFilterId + ' input, #' + opts.locationFilterId + ' input').forEach(function (el) { el.checked = false; });
      load();
    });

    return { load: load };
  }

  var demoCarListController_ = makeCarTrackingController_({

    detailModalId: 'serviceCarListDetailModal', detailBodyId: 'serviceCarListDetailBody'
  });
  function loadDemoCarList() { return demoCarListController_.load(); }
  function loadServiceCarList() { return serviceCarListController_.load(); }

  // ===== 設定 =====
  function renderSettings(settings) {
    // システムマスタ（ロゴ・メール通知設定・担当者）は、コード上の
    // SYSTEM_ADMIN_EMAILS（Constants.gs）に登録された利用者のみに表示する。
    // サーバー側（Api.gs）でも非管理者の設定値は既に空にリダクトされているため
    // （ロゴは全利用者に表示する必要があるデータのため例外）、
    // ここではUI上の表示・非表示のみを制御する（実データの保護自体はサーバー側で行っている）。
    var isAdmin = !!(state.bootstrap && state.bootstrap.isSystemAdmin);

    $('systemMasterNotifyCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterStaffCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterBodyTypeCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterModelPhotoCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterAnnouncementCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterCelebrationCard').classList.toggle('hidden', !isAdmin);
    // 業販受注リスト・デモカーリスト・サービス代車リストのタブ（.navBtn--adminOnly）も、
    // システムマスタと同じく管理者権限を持つ担当者にのみ表示する。非管理者が

    document.querySelectorAll('.navBtn--adminOnly').forEach(function (el) { el.classList.toggle('hidden', !isAdmin); });
    renderCelebrationVariantSelects_(settings.celebrationVariants);

    // ランダムテーマの抽選結果（resolvedRandomThemePreset_）は、ここ
    // （renderSettingsは初回起動時・設定保存後の再取得時の両方で呼ばれる）では
    // クリアしない。「ログインのたび（＝ページを開き直すたび）に変わる」という
    // 仕様のため、同じページを開いている間（他の設定を保存した場合を含む）は
    // 同じ抽選結果を使い続ける必要がある（テーマを選び直した場合の再抽選は

    state.themeKey = settings.themeKey;

    applyAppTitle_(settings.appTitle);
    $('logoUrlMax').textContent = (state.bootstrap && state.bootstrap.logoUrlMax) || 1500;
    $('settingsLogoUrl').value = settings.logoUrl || '';
    state.notifyHoldMailTo = (settings.notifyHoldMailTo || []).slice();
    state.notifyOrderMailTo = (settings.notifyOrderMailTo || []).slice();
    state.notifyErrorMailTo = (settings.notifyErrorMailTo || []).slice();
    renderAllMailLists_();
    $('settingsChatWebhookUrl').value = settings.notifyChatWebhookUrl || '';
    applyTheme(settings.themeKey);
    applyLogo(settings.logoUrl);
    renderLogoPreview_(settings.logoUrl);
    $('loadingImageUrlMax').textContent = (state.bootstrap && state.bootstrap.loadingImageUrlMax) || 1500;
    $('settingsLoadingImageId').value = settings.loadingImageUrl || '';
    applyLoadingImage_(settings.loadingImageUrl);

    // _expandedは折りたたみ表示（renderStaffList参照）の開閉状態を持つ、画面表示専用の

    state.staffList = (settings.staffList || []).map(function (s) { return { name: s.name || '', email: s.email || '', location: s.location || '', _expanded: false }; });
    $('staffListMax').textContent = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    renderStaffList();
    state.modelBodyTypeRules = (settings.modelBodyTypeRules || []).map(function (r) { return { keyword: r.keyword || '', bodyType: r.bodyType || '' }; });
    $('modelBodyTypeRulesMax').textContent = (state.bootstrap && state.bootstrap.modelBodyTypeRulesMax) || 200;
    renderModelBodyTypeRuleList_();
    // _expandedは折りたたみ表示（renderModelPhotoList_参照）の開閉状態を持つ、
    // 画面表示専用のプロパティ。保存時（btnSaveSettingsのcleaned）には含めないため
    // サーバーへは送らない。
    state.modelPhotos = (settings.modelPhotos || []).map(function (p) {
      return { model: p.model || '', photoUrl: p.photoUrl || '', gradePrefix: p.gradePrefix || '', gradeMarker: p.gradeMarker || '', bodyType: p.bodyType || '', _expanded: false };
    });
    $('modelPhotosMax').textContent = (state.bootstrap && state.bootstrap.modelPhotosMax) || 40;
    renderModelPhotoList_();
    $('homeAnnouncementMax').textContent = (state.bootstrap && state.bootstrap.homeAnnouncementMax) || 60;
    $('settingsHomeAnnouncement').value = settings.homeAnnouncement || '';
    populateOrdersStaffFilter_();
    populateOrdersLocationFilter_();
    populateLocationFilter_('wholesaleOrdersLocationFilter');
  }

  /**
   * Hold登録・受注確定の演出バリエーション選択欄（設定タブ）を
   * 描画する。選択肢・ラベルはサーバー側の1箇所（Constants.gsのCELEBRATION_
   * VARIANT_OPTIONS/CELEBRATION_VARIANT_LABELS）から取得し、クライアント側では
   * 重複定義しない。
   */
  function renderCelebrationVariantSelects_(celebrationVariants) {
    var options = (state.bootstrap && state.bootstrap.celebrationVariantOptions) || ['A', 'B', 'C', 'D'];
    var labels = (state.bootstrap && state.bootstrap.celebrationVariantLabels) || {};
    var current = celebrationVariants || {};
    [
      ['celebrationVariantHold', 'hold'],
      ['celebrationVariantOrder', 'order']
    ].forEach(function (pair) {
      var select = $(pair[0]);
      var actionKey = pair[1];
      var actionLabels = labels[actionKey] || {};
      select.innerHTML = '';
      options.forEach(function (o) { select.appendChild(new Option(actionLabels[o] || o, o)); });
      select.value = current[actionKey] || 'A';
    });
  }

  /**
   * テーマ（着せ替え）プリセット一覧。Constants.gsのTHEME_PRESETSと同じ内容を
   * クライアント側にも持ち、選択UIの描画とプレビュー適用（保存前のリアルタイム反映）に使う。
   * primary/primaryDark/primaryTextはいずれもWCAG AA基準（ボタン塗り用途で白文字との
   * コントラスト比4.5:1以上、文字用途で背景とのコントラスト比4.6:1以上）を確認済み。
   * ヘッダー・レール自体は中立色（テーマの影響を受けない）のため、プリセットが
   * 変えるのはボタンの塗り・アクティブ状態の下線・アイコン等の--primary系のみ。
   */
  var THEME_PRESETS = [
    { key: 'steel', name: 'ブリリアントブルー', primary: '#2f6fae', primaryDark: '#102a43', primaryText: '#2f6fae' },
    { key: 'graphite', name: 'グラファイトグレー', primary: '#55606b', primaryDark: '#424b53', primaryText: '#687787' },
    { key: 'wine', name: 'ヒヤシンスレッド', primary: '#8c2f39', primaryDark: '#6d252c', primaryText: '#e32439' },
    { key: 'green', name: 'エメラルドグリーン', primary: '#1f6f4a', primaryDark: '#18573a', primaryText: '#258559' },
    { key: 'amber', name: 'カラハリゴールド', primary: '#a06a1f', primaryDark: '#7d5318', primaryText: '#9f6a1f' },
    { key: 'purple', name: 'アメジスト', primary: '#5b3a8c', primaryDark: '#472d6d', primaryText: '#904df5' },
    { key: 'petrol', name: 'カヴァンサイトブルー', primary: '#1f6f78', primaryDark: '#18575e', primaryText: '#24818a' },
    { key: 'mono', name: 'セレナイトグレー', primary: '#4a4e55', primaryDark: '#3a3d42', primaryText: '#6f7682' },
    { key: 'obsidian', name: 'オブシディアンブラック', primary: '#33383d', primaryDark: '#202327', primaryText: '#52585f' },
    { key: 'cardinal', name: 'カーディナルレッド', primary: '#b5222c', primaryDark: '#8c1a21', primaryText: '#b5222c' },
    { key: 'denim', name: 'デニムブルー', primary: '#3d6690', primaryDark: '#2c4d70', primaryText: '#3d6690' }
  ];
  var DEFAULT_THEME_KEY = 'steel';
  // 「ランダム（ログインのたび変化）」を表す特別なキー。THEME_PRESETSに実体を
  // 持たず、選択中はページを開く（＝ログインする）たびにresolveThemePresetForSession_が
  // THEME_PRESETSから毎回ランダムに1つ選ぶ（Constants.gsのRANDOM_THEME_KEYと同じ値）。
  var RANDOM_THEME_KEY = 'random';

  function themePresetByKey_(key) {
    return THEME_PRESETS.find(function (p) { return p.key === key; })
      || THEME_PRESETS.find(function (p) { return p.key === DEFAULT_THEME_KEY; });
  }

  // このページの読み込み（＝ログイン）中だけ有効なランダムテーマの抽選結果。
  // 毎回の再描画のたびに選び直すと画面遷移のたびに配色が変わってしまうため、
  // 1回だけ抽選してこの変数にキャッシュし、以降は同じ結果を使い続ける
  // （次にページを開き直した＝再ログインした時だけ再抽選される）。
  var resolvedRandomThemePreset_ = null;

  /**
   * 実際に適用するテーマプリセットを解決する（keyがRANDOM_THEME_KEYの場合は
   * THEME_PRESETSからランダムに1つ選ぶ）。純粋関数ではない（ランダム性・
   * セッション内キャッシュを持つ）ため、適用系（applyTheme）専用。
   */
  function resolveThemePresetForSession_(key) {
    if (key !== RANDOM_THEME_KEY) return themePresetByKey_(key);
    if (!resolvedRandomThemePreset_) {
      resolvedRandomThemePreset_ = THEME_PRESETS[Math.floor(Math.random() * THEME_PRESETS.length)];
    }
    return resolvedRandomThemePreset_;
  }

  /**
   * 設定タブのプリセット一覧（11色＋ランダム、計12マス）を描画する。
   * 不具合修正/現場からの要望「選んだ色が実際のUIにどう映るか、選ぶ時点で
   * わかるようにしたい」を受け、単色の丸いスウォッチではなく、ヘッダー帯
   * （primaryDark）＋ボタン（primary）を模したミニプレビューにした
   * （themePreset__preview、下のCSS参照）。ランダムのマスだけは単色ではなく、
   * 全プリセットのprimaryDark／primaryをそれぞれ並べたグラデーションにして
   * 「毎回変わる」ことを視覚的に示す。
   */
  /* 不具合修正（ビジュアル担当チームからの指摘）: テーマ名（カタカナの複合語）は
   * 空白を含まないため、幅が狭いとCSSの折り返し規則上どの文字の間でも改行されて
   * しまい、「ブリリアントブ／ルー」のように単語の途中で不自然に割れることが
   * あった。各名称の自然な意味の区切り（「ブリリアント｜ブルー」等）だけに
   * <wbr>（改行してよい場所の候補）を入れ、末尾側をnowrapで囲むことで、折り返す
   * ときは必ずこの区切りで割れるようにする（名称自体・ロジックで使うp.nameは
   * 変更せず、表示専用のテーブルで変換する）。
   */
  var THEME_NAME_BREAK_SUFFIX = {
    steel: 'ブルー', graphite: 'グレー', wine: 'レッド', green: 'グリーン',
    amber: 'ゴールド', petrol: 'ブルー', mono: 'グレー', obsidian: 'ブラック',
    cardinal: 'レッド', denim: 'ブルー'
  };
  function themeNameHtml_(p) {
    var suffix = THEME_NAME_BREAK_SUFFIX[p.key];
    if (!suffix || p.name.slice(-suffix.length) !== suffix) return escapeHtml(p.name);
    var prefix = p.name.slice(0, p.name.length - suffix.length);
    return escapeHtml(prefix) + '<wbr><span style="white-space:nowrap">' + escapeHtml(suffix) + '</span>';
  }

  function renderThemePresets_() {
    var container = $('themePresetGrid');
    var current = state.themeKey || DEFAULT_THEME_KEY;
    var presetTiles = THEME_PRESETS.map(function (p) {
      return '<button type="button" class="themePreset' + (p.key === current ? ' is-selected' : '') +
        '" data-theme-key="' + p.key + '" style="--swatch:' + p.primary + '" aria-pressed="' + (p.key === current) + '">' +
        '<span class="themePreset__preview">' +
        '<span class="themePreset__previewBar" style="background:' + p.primaryDark + '"></span>' +
        '<span class="themePreset__previewBody"><span class="themePreset__previewBtn" style="background:' + p.primary + '"></span></span>' +
        '</span>' +
        '<span class="themePreset__name">' + themeNameHtml_(p) + '</span>' +
        '</button>';
    }).join('');
    var darkGradient = THEME_PRESETS.map(function (p) { return p.primaryDark; }).join(', ');
    var gradient = THEME_PRESETS.map(function (p) { return p.primary; }).join(', ');
    var isRandom = current === RANDOM_THEME_KEY;
    var randomTile = '<button type="button" class="themePreset' + (isRandom ? ' is-selected' : '') +
      '" data-theme-key="' + RANDOM_THEME_KEY + '" style="--swatch:' + THEME_PRESETS[0].primary + '" aria-pressed="' + isRandom + '">' +
      '<span class="themePreset__preview">' +
      '<span class="themePreset__previewBar" style="background:conic-gradient(' + darkGradient + ')"></span>' +
      '<span class="themePreset__previewBody"><span class="themePreset__previewBtn" style="background:conic-gradient(' + gradient + ')"></span></span>' +
      '</span>' +
      '<span class="themePreset__name">ランダム</span>' +
      '</button>';
    container.innerHTML = presetTiles + randomTile;
  }

  on('themePresetGrid','click', function (e) {
    var btn = e.target.closest('[data-theme-key]');
    if (!btn) return;
    state.themeKey = btn.dataset.themeKey;
    // テーマを選び直した場合、ランダムの抽選結果は次回ログイン時のものを
    // 引きずらないよう都度クリアする（ランダムを選び直した場合は新しく抽選し直す）。
    resolvedRandomThemePreset_ = null;
    renderThemePresets_();
    applyTheme(state.themeKey);
  });

  /**
   * テーマプリセット（--primary系・--topbar-bg系）を一括で適用する。
   * 以前は1色から比率計算で派生色を導出していたが、色相・彩度によって必要な
   * 明暗の差が異なりコントラスト比を一定に保てなかったため、プリセットごとに
   * 個別にコントラスト比を検証済みの色を直接使う（Constants.gsのTHEME_PRESETS参照）。
   * keyがランダムの場合はresolveThemePresetForSession_が実際に使うプリセットを
   * 解決する（このページを開いている間は同じ結果を使い続ける）。
   * 不具合修正: 以前はコントロールパネル（.topbar、ヘッダー）が常に固定の
   * ダークネイビーで、テーマ（表示設定）を切り替えても見た目に反映される範囲が
   * ボタン・リンク等の--primary系だけに限られており、特にホーム画面はほとんど
   * 配色の変化を感じられなかった（現場からの要望「テーマが影響する範囲を
   * 拡大してほしい」）。ヘッダーの背景（--topbar-bg）もprimaryDarkに合わせて
   * 切り替わるようにする（各プリセットのprimaryDarkは、白文字（--on-topbar）との
   * コントラスト比を確保できる明度で統一されているため、どのテーマでも読みやすさは
   * 変わらない）。
   */
  function applyTheme(key) {
    var preset = resolveThemePresetForSession_(key);
    var root = document.documentElement.style;
    root.setProperty('--primary', preset.primary);
    root.setProperty('--primary-dark', preset.primaryDark);
    root.setProperty('--primary-text', preset.primaryText);
    var rgb = hexToRgb_(preset.primary);
    root.setProperty('--primary-bg', rgb ? 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',.18)' : preset.primary);
    // コントロールパネル（ヘッダー）の背景も選択中のテーマに連動させる
    // （ホーム画面を含むアプリ全体で、テーマの効果が感じられるようにするため）。
    root.setProperty('--topbar-bg', preset.primaryDark);
    // 起動時ローディング画面（.appLoading、Stylesheet.html参照）の背景も、選択中の
    // テーマのprimaryDarkに合わせる（現場からの要望で、テーマを切り替えると
    // ローディング画面の背景色も連動して変わるようにしている）。
    root.setProperty('--loading-bg', preset.primaryDark);
  }

  function hexToRgb_(hex) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
    return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : null;
  }

  // ----- アプリタイトル（ブラウザのタブ名・レールのツールチップ・コンテンツ
  //       ヘッダーの見出し上の小さなラベル） -----
  // サーバー側のDEFAULT_APP_TITLE（Constants.gs）と同じ既定値。Index.htmlの
  // テンプレート（<?= currentAppTitle_() ?>）で初回表示時から既にこの値
  // （または管理者が設定した値）になっているため、この関数は主に「設定タブで
  // 保存した直後に、ページを再読み込みしなくても即座に反映する」ために使う。
  var DEFAULT_APP_TITLE = '販売可能リスト';
  function applyAppTitle_(appTitle) {
    var title = appTitle || DEFAULT_APP_TITLE;
    document.title = title;
    var brand = $('topbarBrand');
    if (brand) brand.title = title;
    var text = $('topbarBrandText');
    if (text) text.textContent = title;
  }

  // ----- ロゴ設定（コントロールパネルのブランドマークに表示する画像。
  //       ローディング画像と同じく、ドライブID／共有リンク／外部URLの
  //       いずれかを直接入力する。変換はnormalizeLogoUrl_で保存時に
  //       サーバー側で行う） -----
  function applyLogo(logoUrl) {
    var img = $('topbarLogo');
    var icon = $('topbarMarkIcon');
    if (logoUrl) {
      img.src = logoUrl;
      img.classList.remove('hidden');
      icon.classList.add('hidden');
    } else {
      img.removeAttribute('src');
      img.classList.add('hidden');
      icon.classList.remove('hidden');
    }
  }

  /**
   * 設定タブのプレビュー。入力値がドライブIDのみの場合はそのままでは画像として
   * 表示できない（保存時にサーバー側でURLへ変換される）ため、読み込みに失敗した
   * 場合は「保存後に確認できます」という案内に差し替える（renderLoadingImagePreview_
   * と同じ考え方。壊れた画像アイコンのまま表示され続けるのを防ぐ）。
   */
  function renderLogoPreview_(url) {
    var el = $('settingsLogoPreview');
    if (!url) {
      el.innerHTML = '<span class="logoPreview__placeholder">ロゴなし</span>';
      return;
    }
    el.innerHTML = '<img alt="ロゴプレビュー">';
    var img = el.querySelector('img');
    img.onerror = function () {
      el.innerHTML = '<span class="logoPreview__placeholder">プレビューを表示できません（ドライブIDの場合、保存後に変換されて表示されます）</span>';
    };
    img.src = url;
  }

  // ----- 起動時ローディング画面（#appLoading）の画像設定 -----
  // ロゴ・モデル写真と異なり、管理者は「ドライブID」（ファイルIDのみの文字列）を
  // 直接入力できる（normalizeLoadingImageUrl_、SettingsService.gs参照。変換は
  // 保存時にサーバー側で行うため、設定タブの入力欄はドライブID／共有リンク／
  // 外部URLのいずれかをそのまま受け付け、保存・再読み込み後に変換済みURLへ
  // 置き換わる。ロゴ・モデル写真の設定項目と同じ「保存するまでは変換後の見た目を
  // 確認できない」仕様に揃えている）。
  function applyLoadingImage_(url) {
    var img = $('appLoadingImage');
    if (url) {
      img.onload = function () { img.classList.add('is-visible'); };
      img.onerror = function () { img.classList.remove('is-visible'); };
      img.src = url;
      img.classList.remove('hidden');
    } else {
      img.onload = null;
      img.onerror = null;
      img.removeAttribute('src');
      img.classList.remove('is-visible');
      img.classList.add('hidden');
    }
  }

  /**
   * 設定タブのプレビュー。入力値がドライブIDのみの場合はそのままでは画像として
   * 表示できない（保存時にサーバー側でURLへ変換される）ため、読み込みに失敗した
   * 場合は「保存後に確認できます」という案内に差し替える（壊れた画像アイコンの
   * まま表示され続けるのを防ぐ）。
   */
  function renderLoadingImagePreview_(url) {
    var el = $('settingsLoadingImagePreview');
    if (!url) {
      el.innerHTML = '<span class="logoPreview__placeholder">画像なし</span>';
      return;
    }
    el.innerHTML = '<img alt="ローディング画像プレビュー">';
    var img = el.querySelector('img');
    img.onerror = function () {
      el.innerHTML = '<span class="logoPreview__placeholder">プレビューを表示できません（ドライブIDの場合、保存後に変換されて表示されます）</span>';
    };
    img.src = url;
  }

  on('settingsLogoUrl','input', function () {
    renderLogoPreview_(this.value.trim());
  });

  on('settingsLoadingImageId','input', function () {
    renderLoadingImagePreview_(this.value.trim());
  });

  // ----- 設定タブの各種リスト（担当者・モデル写真・メール通知先）共通のドラッグ
  //       ハンドルによる並び替え。行のドラッグハンドル（⠿、data-drag-index="i"を持つ
  //       行の中にdraggable="true"で置く）を掴んでドロップすると、onReorder(from, to)を
  //       呼び出す。掴む対象をハンドルだけに絞ることで、行内の<input>でのテキスト選択・
  //       クリック操作とドラッグ操作が競合しないようにしている。 -----
  function makeReorderable_(containerEl, onReorder) {
    var dragIndex = null;
    function clearDragOver() {
      containerEl.querySelectorAll('.is-drag-over').forEach(function (el) { el.classList.remove('is-drag-over'); });
    }
    containerEl.addEventListener('dragstart', function (e) {
      var row = e.target.closest('[data-drag-index]');
      if (!row) return;
      dragIndex = Number(row.dataset.dragIndex);
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(dragIndex)); } catch (err) { /* Safari等での互換用、失敗しても無視 */ }
      row.classList.add('is-dragging');
    });
    containerEl.addEventListener('dragend', function (e) {
      var row = e.target.closest('[data-drag-index]');
      if (row) row.classList.remove('is-dragging');
      dragIndex = null;
      clearDragOver();
    });
    containerEl.addEventListener('dragover', function (e) {
      var row = e.target.closest('[data-drag-index]');
      if (!row || dragIndex === null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (!row.classList.contains('is-drag-over')) {
        clearDragOver();
        row.classList.add('is-drag-over');
      }
    });
    containerEl.addEventListener('drop', function (e) {
      var row = e.target.closest('[data-drag-index]');
      if (!row || dragIndex === null) return;
      e.preventDefault();
      var dropIndex = Number(row.dataset.dragIndex);
      clearDragOver();
      var from = dragIndex;
      dragIndex = null;
      if (dropIndex !== from) onReorder(from, dropIndex);
    });
  }

  // ----- 担当者マスタ（名前・メールアドレスの組。メールアドレスでログイン中の
  //       Googleアカウントと突き合わせ、担当者を自動判定する） -----
  // 担当者が多いと3項目（名前・メールアドレス・拠点名）×人数分の入力欄が
  // 常に全部開いた状態になり縦に長くなりすぎるため、各行を折りたたみ式にし、
  // 普段は名前・拠点・メールアドレスの要約1行だけを表示する（現場からの要望）。
  // 開閉状態はentry._expandedという画面表示専用のプロパティで持つ（保存時の
  // cleaned（btnSaveSettings参照）には含めないため、サーバーへは送らない）。
  function staffSummaryName_(entry) {
    return entry.name || entry.email || '（未入力）';
  }
  function staffSummarySub_(entry) {

          '<div class="staffList__header">' +
