      var actionKey = pair[1];
      var actionLabels = labels[actionKey] || {};
      select.innerHTML = '';
      options.forEach(function (o) { select.appendChild(new Option(actionLabels[o] || o, o)); });
      select.value = current[actionKey] || 'A';
    });
  }

  /**
   * テーマ（着せ替え）プリセット一覧。Constants.gsのTHEME_PRESETSと同じ内容を
   * クライアント側にも持ち、選択UIの描画とプレビュー適用（保存前のリアルタイム反映）に使う。
   * primary/primaryDark/primaryTextはいずれもWCAG AA基準（ボタン塗り用途で白文字との
   * コントラスト比4.5:1以上、文字用途で背景とのコントラスト比4.6:1以上）を確認済み。
   * ヘッダー・レール自体は中立色（テーマの影響を受けない）のため、プリセットが
   * 変えるのはボタンの塗り・アクティブ状態の下線・アイコン等の--primary系のみ。
   */
  var THEME_PRESETS = [
    { key: 'steel', name: 'ブリリアントブルー', primary: '#2f6fae', primaryDark: '#102a43', primaryText: '#2f6fae' },
    { key: 'graphite', name: 'グラファイトグレー', primary: '#55606b', primaryDark: '#424b53', primaryText: '#687787' },
    { key: 'wine', name: 'ヒヤシンスレッド', primary: '#8c2f39', primaryDark: '#6d252c', primaryText: '#e32439' },
    { key: 'green', name: 'エメラルドグリーン', primary: '#1f6f4a', primaryDark: '#18573a', primaryText: '#258559' },
    { key: 'amber', name: 'カラハリゴールド', primary: '#a06a1f', primaryDark: '#7d5318', primaryText: '#9f6a1f' },
    { key: 'purple', name: 'アメジスト', primary: '#5b3a8c', primaryDark: '#472d6d', primaryText: '#904df5' },
    { key: 'petrol', name: 'カヴァンサイトブルー', primary: '#1f6f78', primaryDark: '#18575e', primaryText: '#24818a' },
    { key: 'mono', name: 'セレナイトグレー', primary: '#4a4e55', primaryDark: '#3a3d42', primaryText: '#6f7682' },
    { key: 'obsidian', name: 'オブシディアンブラック', primary: '#33383d', primaryDark: '#202327', primaryText: '#52585f' },
    { key: 'cardinal', name: 'カーディナルレッド', primary: '#b5222c', primaryDark: '#8c1a21', primaryText: '#b5222c' },
    { key: 'denim', name: 'デニムブルー', primary: '#3d6690', primaryDark: '#2c4d70', primaryText: '#3d6690' }
  ];
  var DEFAULT_THEME_KEY = 'steel';
  // 「ランダム（ログインのたび変化）」を表す特別なキー。THEME_PRESETSに実体を
  // 持たず、選択中はページを開く（＝ログインする）たびにresolveThemePresetForSession_が
  // THEME_PRESETSから毎回ランダムに1つ選ぶ（Constants.gsのRANDOM_THEME_KEYと同じ値）。
  var RANDOM_THEME_KEY = 'random';

  function themePresetByKey_(key) {
    return THEME_PRESETS.find(function (p) { return p.key === key; })
      || THEME_PRESETS.find(function (p) { return p.key === DEFAULT_THEME_KEY; });
  }

  // このページの読み込み（＝ログイン）中だけ有効なランダムテーマの抽選結果。
  // 毎回の再描画のたびに選び直すと画面遷移のたびに配色が変わってしまうため、
  // 1回だけ抽選してこの変数にキャッシュし、以降は同じ結果を使い続ける
  // （次にページを開き直した＝再ログインした時だけ再抽選される）。
  var resolvedRandomThemePreset_ = null;

  /**
   * 実際に適用するテーマプリセットを解決する（keyがRANDOM_THEME_KEYの場合は
   * THEME_PRESETSからランダムに1つ選ぶ）。純粋関数ではない（ランダム性・
   * セッション内キャッシュを持つ）ため、適用系（applyTheme）専用。
   */
  function resolveThemePresetForSession_(key) {
    if (key !== RANDOM_THEME_KEY) return themePresetByKey_(key);
    if (!resolvedRandomThemePreset_) {
      resolvedRandomThemePreset_ = THEME_PRESETS[Math.floor(Math.random() * THEME_PRESETS.length)];
    }
    return resolvedRandomThemePreset_;
  }

  /**
   * 設定タブのプリセット一覧（11色＋ランダム、計12マス）を描画する。
   * 不具合修正/現場からの要望「選んだ色が実際のUIにどう映るか、選ぶ時点で
   * わかるようにしたい」を受け、単色の丸いスウォッチではなく、ヘッダー帯
   * （primaryDark）＋ボタン（primary）を模したミニプレビューにした
   * （themePreset__preview、下のCSS参照）。ランダムのマスだけは単色ではなく、
   * 全プリセットのprimaryDark／primaryをそれぞれ並べたグラデーションにして
   * 「毎回変わる」ことを視覚的に示す。
   */
  function renderThemePresets_() {
    var container = $('themePresetGrid');
    var current = state.themeKey || DEFAULT_THEME_KEY;
    var presetTiles = THEME_PRESETS.map(function (p) {
      return '<button type="button" class="themePreset' + (p.key === current ? ' is-selected' : '') +
        '" data-theme-key="' + p.key + '" style="--swatch:' + p.primary + '" aria-pressed="' + (p.key === current) + '">' +
        '<span class="themePreset__preview">' +
        '<span class="themePreset__previewBar" style="background:' + p.primaryDark + '"></span>' +
        '<span class="themePreset__previewBody"><span class="themePreset__previewBtn" style="background:' + p.primary + '"></span></span>' +
        '</span>' +
        '<span class="themePreset__name">' + escapeHtml(p.name) + '</span>' +
        '</button>';
    }).join('');
    var darkGradient = THEME_PRESETS.map(function (p) { return p.primaryDark; }).join(', ');
    var gradient = THEME_PRESETS.map(function (p) { return p.primary; }).join(', ');
    var isRandom = current === RANDOM_THEME_KEY;
    var randomTile = '<button type="button" class="themePreset' + (isRandom ? ' is-selected' : '') +
      '" data-theme-key="' + RANDOM_THEME_KEY + '" style="--swatch:' + THEME_PRESETS[0].primary + '" aria-pressed="' + isRandom + '">' +
      '<span class="themePreset__preview">' +
      '<span class="themePreset__previewBar" style="background:conic-gradient(' + darkGradient + ')"></span>' +
      '<span class="themePreset__previewBody"><span class="themePreset__previewBtn" style="background:conic-gradient(' + gradient + ')"></span></span>' +
      '</span>' +
      '<span class="themePreset__name">ランダム</span>' +
      '</button>';
    container.innerHTML = presetTiles + randomTile;
  }

  on('themePresetGrid','click', function (e) {
    var btn = e.target.closest('[data-theme-key]');
    if (!btn) return;
    state.themeKey = btn.dataset.themeKey;
    // テーマを選び直した場合、ランダムの抽選結果は次回ログイン時のものを
    // 引きずらないよう都度クリアする（ランダムを選び直した場合は新しく抽選し直す）。
    resolvedRandomThemePreset_ = null;
    renderThemePresets_();
    applyTheme(state.themeKey);
  });

  /**
   * テーマプリセット（--primary系・--topbar-bg系）を一括で適用する。
   * 以前は1色から比率計算で派生色を導出していたが、色相・彩度によって必要な
   * 明暗の差が異なりコントラスト比を一定に保てなかったため、プリセットごとに
   * 個別にコントラスト比を検証済みの色を直接使う（Constants.gsのTHEME_PRESETS参照）。
   * keyがランダムの場合はresolveThemePresetForSession_が実際に使うプリセットを
   * 解決する（このページを開いている間は同じ結果を使い続ける）。
   * 不具合修正: 以前はコントロールパネル（.topbar、ヘッダー）が常に固定の
   * ダークネイビーで、テーマ（表示設定）を切り替えても見た目に反映される範囲が
   * ボタン・リンク等の--primary系だけに限られており、特にホーム画面はほとんど
   * 配色の変化を感じられなかった（現場からの要望「テーマが影響する範囲を
   * 拡大してほしい」）。ヘッダーの背景（--topbar-bg）もprimaryDarkに合わせて
   * 切り替わるようにする（各プリセットのprimaryDarkは、白文字（--on-topbar）との
   * コントラスト比を確保できる明度で統一されているため、どのテーマでも読みやすさは
   * 変わらない）。
   */
  function applyTheme(key) {
    var preset = resolveThemePresetForSession_(key);
    var root = document.documentElement.style;
    root.setProperty('--primary', preset.primary);
    root.setProperty('--primary-dark', preset.primaryDark);
    root.setProperty('--primary-text', preset.primaryText);
    var rgb = hexToRgb_(preset.primary);
    root.setProperty('--primary-bg', rgb ? 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',.18)' : preset.primary);
    // コントロールパネル（ヘッダー）の背景も選択中のテーマに連動させる
    // （ホーム画面を含むアプリ全体で、テーマの効果が感じられるようにするため）。
    root.setProperty('--topbar-bg', preset.primaryDark);
    // 起動時ローディング画面（.appLoading、Stylesheet.html参照）の背景も、選択中の
    // テーマのprimaryDarkに合わせる（現場からの要望で、テーマを切り替えると
    // ローディング画面の背景色も連動して変わるようにしている）。
    root.setProperty('--loading-bg', preset.primaryDark);
  }

  function hexToRgb_(hex) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
    return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : null;
  }

  // ----- アプリタイトル（ブラウザのタブ名・レールのツールチップ・コンテンツ
  //       ヘッダーの見出し上の小さなラベル） -----
  // サーバー側のDEFAULT_APP_TITLE（Constants.gs）と同じ既定値。Index.htmlの
  // テンプレート（<?= currentAppTitle_() ?>）で初回表示時から既にこの値
  // （または管理者が設定した値）になっているため、この関数は主に「設定タブで
  // 保存した直後に、ページを再読み込みしなくても即座に反映する」ために使う。
  var DEFAULT_APP_TITLE = '販売可能リスト';
  function applyAppTitle_(appTitle) {
    var title = appTitle || DEFAULT_APP_TITLE;
    document.title = title;
    var brand = $('topbarBrand');
    if (brand) brand.title = title;
    var text = $('topbarBrandText');
    if (text) text.textContent = title;
  }

  // ----- ロゴ設定（コントロールパネルのブランドマークに表示する画像。
  //       ローディング画像と同じく、ドライブID／共有リンク／外部URLの
  //       いずれかを直接入力する。変換はnormalizeLogoUrl_で保存時に
  //       サーバー側で行う） -----
  function applyLogo(logoUrl) {
    var img = $('topbarLogo');
    var icon = $('topbarMarkIcon');
    if (logoUrl) {
      img.src = logoUrl;
      img.classList.remove('hidden');
      icon.classList.add('hidden');
    } else {
      img.removeAttribute('src');
      img.classList.add('hidden');
      icon.classList.remove('hidden');
    }
  }

  /**
   * 設定タブのプレビュー。入力値がドライブIDのみの場合はそのままでは画像として
   * 表示できない（保存時にサーバー側でURLへ変換される）ため、読み込みに失敗した
   * 場合は「保存後に確認できます」という案内に差し替える（renderLoadingImagePreview_
   * と同じ考え方。壊れた画像アイコンのまま表示され続けるのを防ぐ）。
   */
  function renderLogoPreview_(url) {
    var el = $('settingsLogoPreview');
    if (!url) {
      el.innerHTML = '<span class="logoPreview__placeholder">ロゴなし</span>';
      return;
    }
    el.innerHTML = '<img alt="ロゴプレビュー">';
    var img = el.querySelector('img');
    img.onerror = function () {
      el.innerHTML = '<span class="logoPreview__placeholder">プレビューを表示できません（ドライブIDの場合、保存後に変換されて表示されます）</span>';
    };
    img.src = url;
  }

  // ----- 起動時ローディング画面（#appLoading）の画像設定 -----
  // ロゴ・モデル写真と異なり、管理者は「ドライブID」（ファイルIDのみの文字列）を
  // 直接入力できる（normalizeLoadingImageUrl_、SettingsService.gs参照。変換は
  // 保存時にサーバー側で行うため、設定タブの入力欄はドライブID／共有リンク／
  // 外部URLのいずれかをそのまま受け付け、保存・再読み込み後に変換済みURLへ
  // 置き換わる。ロゴ・モデル写真の設定項目と同じ「保存するまでは変換後の見た目を
  // 確認できない」仕様に揃えている）。
  function applyLoadingImage_(url) {
    var img = $('appLoadingImage');
    if (url) {
      img.onload = function () { img.classList.add('is-visible'); };
      img.onerror = function () { img.classList.remove('is-visible'); };
      img.src = url;
      img.classList.remove('hidden');
    } else {
      img.onload = null;
      img.onerror = null;
      img.removeAttribute('src');
      img.classList.remove('is-visible');
      img.classList.add('hidden');
    }
  }

  /**
   * 設定タブのプレビュー。入力値がドライブIDのみの場合はそのままでは画像として
   * 表示できない（保存時にサーバー側でURLへ変換される）ため、読み込みに失敗した
   * 場合は「保存後に確認できます」という案内に差し替える（壊れた画像アイコンの
   * まま表示され続けるのを防ぐ）。
   */
  function renderLoadingImagePreview_(url) {
    var el = $('settingsLoadingImagePreview');
    if (!url) {
      el.innerHTML = '<span class="logoPreview__placeholder">画像なし</span>';
      return;
    }
    el.innerHTML = '<img alt="ローディング画像プレビュー">';
    var img = el.querySelector('img');
    img.onerror = function () {
      el.innerHTML = '<span class="logoPreview__placeholder">プレビューを表示できません（ドライブIDの場合、保存後に変換されて表示されます）</span>';
    };
    img.src = url;
  }

  on('settingsLogoUrl','input', function () {
    renderLogoPreview_(this.value.trim());
  });

  on('settingsLoadingImageId','input', function () {
    renderLoadingImagePreview_(this.value.trim());
  });

  // ----- 設定タブの各種リスト（担当者・モデル写真・メール通知先）共通のドラッグ
  //       ハンドルによる並び替え。行のドラッグハンドル（⠿、data-drag-index="i"を持つ
  //       行の中にdraggable="true"で置く）を掴んでドロップすると、onReorder(from, to)を
  //       呼び出す。掴む対象をハンドルだけに絞ることで、行内の<input>でのテキスト選択・
  //       クリック操作とドラッグ操作が競合しないようにしている。 -----
  function makeReorderable_(containerEl, onReorder) {
    var dragIndex = null;
    function clearDragOver() {
      containerEl.querySelectorAll('.is-drag-over').forEach(function (el) { el.classList.remove('is-drag-over'); });
    }
    containerEl.addEventListener('dragstart', function (e) {
      var row = e.target.closest('[data-drag-index]');
      if (!row) return;
      dragIndex = Number(row.dataset.dragIndex);
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(dragIndex)); } catch (err) { /* Safari等での互換用、失敗しても無視 */ }
      row.classList.add('is-dragging');
    });
    containerEl.addEventListener('dragend', function (e) {
      var row = e.target.closest('[data-drag-index]');
      if (row) row.classList.remove('is-dragging');
      dragIndex = null;
      clearDragOver();
    });
    containerEl.addEventListener('dragover', function (e) {
      var row = e.target.closest('[data-drag-index]');
      if (!row || dragIndex === null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (!row.classList.contains('is-drag-over')) {
        clearDragOver();
        row.classList.add('is-drag-over');
      }
    });
    containerEl.addEventListener('drop', function (e) {
      var row = e.target.closest('[data-drag-index]');
      if (!row || dragIndex === null) return;
      e.preventDefault();
      var dropIndex = Number(row.dataset.dragIndex);
      clearDragOver();
      var from = dragIndex;
      dragIndex = null;
      if (dropIndex !== from) onReorder(from, dropIndex);
    });
  }

  // ----- 担当者マスタ（名前・メールアドレスの組。メールアドレスでログイン中の
  //       Googleアカウントと突き合わせ、担当者を自動判定する） -----
  // 担当者が多いと3項目（名前・メールアドレス・拠点名）×人数分の入力欄が
  // 常に全部開いた状態になり縦に長くなりすぎるため、各行を折りたたみ式にし、
  // 普段は名前・拠点・メールアドレスの要約1行だけを表示する（現場からの要望）。
  // 開閉状態はentry._expandedという画面表示専用のプロパティで持つ（保存時の
  // cleaned（btnSaveSettings参照）には含めないため、サーバーへは送らない）。
  function staffSummaryName_(entry) {
    return entry.name || entry.email || '（未入力）';
  }
  function staffSummarySub_(entry) {
    return [entry.location, entry.email].filter(Boolean).join(' ・ ') || '未入力';
  }

  function renderStaffList() {
    var container = $('staffList');
    $('staffListCount').textContent = state.staffList.length;
    if (!state.staffList.length) {
      container.innerHTML = '<div class="staffList__empty">担当者が登録されていません</div>';
    } else {
      container.innerHTML = state.staffList.map(function (entry, i) {
        var isExpanded = !!entry._expanded;
        return '<div class="staffList__item' + (isExpanded ? ' is-expanded' : '') + '" data-drag-index="' + i + '">' +
          '<div class="staffList__header">' +
          '<span class="dragHandle" draggable="true" aria-label="ドラッグして並び替え">⠿</span>' +
          '<button type="button" class="staffList__summary" data-toggle-staff="' + i + '" aria-expanded="' + isExpanded + '">' +
          '<span class="staffList__summaryText">' +
          '<span class="staffList__summaryName">' + escapeHtml(staffSummaryName_(entry)) + '</span>' +
          '<span class="staffList__summarySub">' + escapeHtml(staffSummarySub_(entry)) + '</span>' +
          '</span>' +
          '<span class="staffList__chevron" aria-hidden="true">' + (isExpanded ? '▾' : '▸') + '</span>' +
          '</button>' +
          '<button class="btn btn--icon" data-remove-staff="' + i + '" type="button" aria-label="削除">&times;</button>' +
          '</div>' +
          '<div class="staffList__body' + (isExpanded ? '' : ' hidden') + '">' +
          '<input type="text" class="input" data-staff-index="' + i + '" data-staff-field="name" placeholder="名前" value="' + escapeHtml(entry.name || '') + '">' +
          '<input type="email" class="input" data-staff-index="' + i + '" data-staff-field="email" placeholder="メールアドレス" value="' + escapeHtml(entry.email || '') + '">' +
          '<input type="text" class="input" data-staff-index="' + i + '" data-staff-field="location" placeholder="拠点名" value="' + escapeHtml(entry.location || '') + '">' +
          '</div>' +
          '</div>';
      }).join('');
    }
    var max = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    $('btnAddStaff').disabled = state.staffList.length >= max;
  }

  // 要約行（折りたたみ中に見える名前・拠点・メールアドレス）は、入力のたびに
  // renderStaffList()を丸ごと呼び直すとinput要素が作り直されてフォーカス・
  // カーソル位置が失われるため、対象行の要約テキストだけをその場で書き換える。
  function updateStaffSummary_(index, entry) {
    var item = document.querySelector('#staffList [data-drag-index="' + index + '"]');
    if (!item) return;
    var nameEl = item.querySelector('.staffList__summaryName');
    var subEl = item.querySelector('.staffList__summarySub');
    if (nameEl) nameEl.textContent = staffSummaryName_(entry);
    if (subEl) subEl.textContent = staffSummarySub_(entry);
  }

  on('staffList','input', function (e) {
    var index = e.target.dataset.staffIndex;
    var field = e.target.dataset.staffField;
    if (index === undefined || !field) return;
    var entry = state.staffList[Number(index)];
    entry[field] = e.target.value;
    updateStaffSummary_(Number(index), entry);
  });

  on('staffList','click', function (e) {
    var removeBtn = e.target.closest('[data-remove-staff]');
    if (removeBtn) {
      state.staffList.splice(Number(removeBtn.dataset.removeStaff), 1);
      renderStaffList();
      return;
    }
    var toggleBtn = e.target.closest('[data-toggle-staff]');
    if (toggleBtn) {
      var entry = state.staffList[Number(toggleBtn.dataset.toggleStaff)];
      entry._expanded = !entry._expanded;
      renderStaffList();
    }
  });

  on('btnAddStaff','click', function () {
    var max = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    if (state.staffList.length >= max) return;
    // 追加直後は名前等が未入力で分かりにくいため、新規行だけは最初から開いておく。
    state.staffList.push({ name: '', email: '', location: '', _expanded: true });
    renderStaffList();
    var inputs = document.querySelectorAll('#staffList [data-staff-field="name"]');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  makeReorderable_($('staffList'), function (from, to) {
    var moved = state.staffList.splice(from, 1)[0];
    state.staffList.splice(to, 0, moved);
    renderStaffList();
  });

  // ----- メール通知先（Hold時／受注確定時／システムエラー通知の3項目）。
  //       以前は「,区切りの1つのテキスト欄」だったが、担当者マスタと
  //       同じ「1行1件のリスト形式（追加・削除・ドラッグでの並び替え）」に統一した。
  //       3項目とも見た目・挙動が同じため、フィールド名とDOM要素IDの組だけを
  //       MAIL_FIELDSに列挙し、共通の関数で描画・イベント登録する。 -----
  var MAIL_FIELDS = [
    { key: 'notifyHoldMailTo', listId: 'notifyHoldMailList', countId: 'notifyHoldMailCount', addBtnId: 'btnAddHoldMail' },
    { key: 'notifyOrderMailTo', listId: 'notifyOrderMailList', countId: 'notifyOrderMailCount', addBtnId: 'btnAddOrderMail' },
    { key: 'notifyErrorMailTo', listId: 'notifyErrorMailList', countId: 'notifyErrorMailCount', addBtnId: 'btnAddErrorMail' }
  ];

  function notifyMailListMax_() {
    return (state.bootstrap && state.bootstrap.notifyMailListMax) || 20;
  }

  function renderMailList_(field) {
    var container = $(field.listId);
    var list = state[field.key] || [];
    $(field.countId).textContent = list.length;
    if (!list.length) {
      container.innerHTML = '<div class="mailList__empty">宛先が登録されていません</div>';
    } else {
      container.innerHTML = list.map(function (email, i) {
        return '<div class="mailList__row" data-drag-index="' + i + '">' +
          '<span class="dragHandle" draggable="true" aria-label="ドラッグして並び替え">⠿</span>' +
          '<input type="email" class="input" data-mail-index="' + i + '" placeholder="例: staff@example.com" value="' + escapeHtml(email || '') + '">' +
          '<button class="btn btn--icon" data-remove-mail="' + i + '" type="button" aria-label="削除">&times;</button>' +
          '</div>';
      }).join('');
    }
    $(field.addBtnId).disabled = list.length >= notifyMailListMax_();
  }

  MAIL_FIELDS.forEach(function (field) {
    var container = $(field.listId);
    if (!container) {
      console.warn('[used-vehicle-order-app] 要素が見つからないためイベント登録をスキップしました: #' + field.listId);
      return;
    }
    container.addEventListener('input', function (e) {
      var index = e.target.dataset.mailIndex;
      if (index === undefined) return;
      state[field.key][Number(index)] = e.target.value;
    });
    container.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-remove-mail]');
      if (!btn) return;
      state[field.key].splice(Number(btn.dataset.removeMail), 1);
      renderMailList_(field);
    });
    makeReorderable_(container, function (from, to) {
      var moved = state[field.key].splice(from, 1)[0];
      state[field.key].splice(to, 0, moved);
      renderMailList_(field);
    });
    on(field.addBtnId, 'click', function () {
      if (state[field.key].length >= notifyMailListMax_()) return;
      state[field.key].push('');
      renderMailList_(field);
      var inputs = container.querySelectorAll('[data-mail-index]');
      if (inputs.length) inputs[inputs.length - 1].focus();
    });
  });

  function renderAllMailLists_() {
    MAIL_FIELDS.forEach(renderMailList_);
  }

  // ----- ボディタイプの紐付けルール（設定タブ、管理者限定）。メール通知先と
  //       見た目・構造はほぼ同じ「1行1件のリスト」だが、1行あたりキーワード
  //       （テキスト）とボディタイプ（プルダウン）の2つの入力欄を持つ点が異なる。
  //       並び順自体は絞り込み結果に影響しないため、ドラッグ並び替えは付けない。 -----
  function modelBodyTypeRulesMax_() {
    return (state.bootstrap && state.bootstrap.modelBodyTypeRulesMax) || 200;
  }

  function renderModelBodyTypeRuleList_() {
    var container = $('modelBodyTypeRuleList');
    var list = state.modelBodyTypeRules || [];
    var options = (state.bootstrap && state.bootstrap.modelBodyTypeOptions) || [];
    $('modelBodyTypeRulesCount').textContent = list.length;
    if (!list.length) {
      container.innerHTML = '<div class="mailList__empty">ルールが登録されていません</div>';
    } else {
      container.innerHTML = list.map(function (rule, i) {
        return '<div class="mailList__row">' +
          '<input type="text" class="input" data-rule-index="' + i + '" data-rule-field="keyword" placeholder="例: GLC" value="' + escapeHtml(rule.keyword || '') + '">' +
          '<select class="input" data-rule-index="' + i + '" data-rule-field="bodyType">' +
          options.map(function (o) { return '<option value="' + escapeHtml(o) + '"' + (rule.bodyType === o ? ' selected' : '') + '>' + escapeHtml(o) + '</option>'; }).join('') +
          '</select>' +
          '<button class="btn btn--icon" data-remove-rule="' + i + '" type="button" aria-label="削除">&times;</button>' +
          '</div>';
      }).join('');
    }
    $('btnAddModelBodyTypeRule').disabled = list.length >= modelBodyTypeRulesMax_();
  }

  on('modelBodyTypeRuleList', 'input', function (e) {
    var index = e.target.dataset.ruleIndex;
    if (index === undefined) return;
    state.modelBodyTypeRules[Number(index)].keyword = e.target.value;
  });
  on('modelBodyTypeRuleList', 'change', function (e) {
    var index = e.target.dataset.ruleIndex;
    if (index === undefined || e.target.dataset.ruleField !== 'bodyType') return;
    state.modelBodyTypeRules[Number(index)].bodyType = e.target.value;
  });
  on('modelBodyTypeRuleList', 'click', function (e) {
    var btn = e.target.closest('[data-remove-rule]');
    if (!btn) return;
    state.modelBodyTypeRules.splice(Number(btn.dataset.removeRule), 1);
    renderModelBodyTypeRuleList_();
  });
  on('btnAddModelBodyTypeRule', 'click', function () {
    if (state.modelBodyTypeRules.length >= modelBodyTypeRulesMax_()) return;
    var options = (state.bootstrap && state.bootstrap.modelBodyTypeOptions) || [];
    state.modelBodyTypeRules.push({ keyword: '', bodyType: options[0] || '' });
    renderModelBodyTypeRuleList_();
    var inputs = $('modelBodyTypeRuleList').querySelectorAll('[data-rule-field="keyword"]');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  // ----- 車両画像（ホーム画面のギャラリーに表示する写真）。担当者マスタ・
  //       modelBodyTypeRuleListと同じく折りたたみ式の行にし、普段は写真
  //       サムネイル・モデル名・自動判定条件の要約1行だけを表示する。 -----
  function modelPhotosMax_() {
    return (state.bootstrap && state.bootstrap.modelPhotosMax) || 40;
  }
  function photoSummaryName_(entry) {
    return entry.model || '（未入力）';
  }
  function photoSummarySub_(entry) {
    var parts = [];
    if (entry.gradePrefix) {
      parts.push('先頭「' + entry.gradePrefix + '」' + (entry.gradeMarker ? ' ・含む「' + entry.gradeMarker + '」' : ''));
    } else {
      parts.push('個別登録（モデル名で照合）');
    }
    if (entry.bodyType) parts.push(entry.bodyType);
    return parts.join(' ・ ');
  }

  function renderModelPhotoList_() {
    var container = $('modelPhotoList');
    var options = (state.bootstrap && state.bootstrap.modelBodyTypeOptions) || [];
    $('modelPhotosCount').textContent = state.modelPhotos.length;
    if (!state.modelPhotos.length) {
      container.innerHTML = '<div class="staffList__empty">車両画像が登録されていません</div>';
    } else {
      container.innerHTML = state.modelPhotos.map(function (entry, i) {
        var isExpanded = !!entry._expanded;
        var thumbHtml = entry.photoUrl
          ? '<span class="staffList__summaryThumb"><img src="' + escapeHtml(entry.photoUrl) + '" alt="" loading="lazy"></span>'
          : '<span class="staffList__summaryThumb"></span>';
        return '<div class="staffList__item' + (isExpanded ? ' is-expanded' : '') + '" data-drag-index="' + i + '">' +
          '<div class="staffList__header">' +
          '<button type="button" class="staffList__summary" data-toggle-photo="' + i + '" aria-expanded="' + isExpanded + '">' +
          thumbHtml +
          '<span class="staffList__summaryText">' +
          '<span class="staffList__summaryName">' + escapeHtml(photoSummaryName_(entry)) + '</span>' +
          '<span class="staffList__summarySub">' + escapeHtml(photoSummarySub_(entry)) + '</span>' +
          '</span>' +
          '<span class="staffList__chevron" aria-hidden="true">' + (isExpanded ? '▾' : '▸') + '</span>' +
          '</button>' +
          '<button class="btn btn--icon" data-remove-photo="' + i + '" type="button" aria-label="削除">&times;</button>' +
          '</div>' +
          '<div class="staffList__body' + (isExpanded ? '' : ' hidden') + '">' +
          '<input type="text" class="input" data-photo-index="' + i + '" data-photo-field="photoUrl" placeholder="写真：ドライブID または 画像URL" value="' + escapeHtml(entry.photoUrl || '') + '">' +
          '<input type="text" class="input" data-photo-index="' + i + '" data-photo-field="model" placeholder="モデル表示名（例: Cクラス）" value="' + escapeHtml(entry.model || '') + '">' +
          '<input type="text" class="input" data-photo-index="' + i + '" data-photo-field="gradePrefix" placeholder="先頭の文字列（例: C）" value="' + escapeHtml(entry.gradePrefix || '') + '">' +
          '<input type="text" class="input" data-photo-index="' + i + '" data-photo-field="gradeMarker" placeholder="含む文字列（例: T）" value="' + escapeHtml(entry.gradeMarker || '') + '">' +
          '<select class="input" data-photo-index="' + i + '" data-photo-field="bodyType">' +
          '<option value="">型を選択しない</option>' +
          options.map(function (o) { return '<option value="' + escapeHtml(o) + '"' + (entry.bodyType === o ? ' selected' : '') + '>' + escapeHtml(o) + '</option>'; }).join('') +
          '</select>' +
          '</div>' +
          '</div>';
      }).join('');
    }
    $('btnAddModelPhoto').disabled = state.modelPhotos.length >= modelPhotosMax_();
  }

  function updatePhotoSummary_(index, entry) {
    var item = document.querySelector('#modelPhotoList [data-drag-index="' + index + '"]');
    if (!item) return;
    var nameEl = item.querySelector('.staffList__summaryName');
    var subEl = item.querySelector('.staffList__summarySub');
    var thumbEl = item.querySelector('.staffList__summaryThumb');
    if (nameEl) nameEl.textContent = photoSummaryName_(entry);
    if (subEl) subEl.textContent = photoSummarySub_(entry);
    if (thumbEl) thumbEl.innerHTML = entry.photoUrl ? '<img src="' + escapeHtml(entry.photoUrl) + '" alt="" loading="lazy">' : '';
  }

  on('modelPhotoList', 'input', function (e) {
    var index = e.target.dataset.photoIndex;
    var field = e.target.dataset.photoField;
    if (index === undefined || !field) return;
    var entry = state.modelPhotos[Number(index)];
    entry[field] = e.target.value;
    updatePhotoSummary_(Number(index), entry);
  });
  on('modelPhotoList', 'change', function (e) {
    var index = e.target.dataset.photoIndex;
    if (index === undefined || e.target.dataset.photoField !== 'bodyType') return;
    var entry = state.modelPhotos[Number(index)];
    entry.bodyType = e.target.value;
    updatePhotoSummary_(Number(index), entry);
  });
  on('modelPhotoList', 'click', function (e) {
    var removeBtn = e.target.closest('[data-remove-photo]');
    if (removeBtn) {
      state.modelPhotos.splice(Number(removeBtn.dataset.removePhoto), 1);
      renderModelPhotoList_();
      return;
    }
    var toggleBtn = e.target.closest('[data-toggle-photo]');
    if (toggleBtn) {
      var entry = state.modelPhotos[Number(toggleBtn.dataset.togglePhoto)];
      entry._expanded = !entry._expanded;
      renderModelPhotoList_();
    }
  });
  on('btnAddModelPhoto', 'click', function () {
    if (state.modelPhotos.length >= modelPhotosMax_()) return;
    state.modelPhotos.push({ model: '', photoUrl: '', gradePrefix: '', gradeMarker: '', bodyType: '', _expanded: true });
    renderModelPhotoList_();
    var inputs = $('modelPhotoList').querySelectorAll('[data-photo-field="model"]');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  /**
   * マイページ（Hold中の車両一覧）専用に、フィルタ無しで在庫リストを取得する。
   * 在庫リストのツールバー（検索キーワード等）の状態に関わらず、常に全件から
   * Hold中の車両を拾えるようにするため、state.inventoryItems（ツールバーの
   * 検索条件に連動）とは別に保持する。補助的な表示のため、取得に失敗しても
   * トースト等では知らせず、表示を省略するに留める。
   */
  function loadAllInventoryItems_() {
    return gasRun('api_listInventory', { keyword: '', includeHold: true }).then(function (groups) {
      state.allInventoryItems = (groups && groups[0] && groups[0].items) || [];
      renderMyPageHolds_();
      renderHomeGallery_();
    }).catch(function (err) {
      // 補助的な表示のためトースト等では知らせないが、原因調査ができるよう
      // コンソールには必ず残す（以前はここで完全にエラーを握りつぶしていたため、
      // マイページのHold中車両一覧が表示されない不具合の原因がまったく分からなかった）。
      console.error('[used-vehicle-order-app] 在庫全件の取得でエラーが発生しました:', err);
    });
  }

  /**
   * ホーム画面上部の型クイックナビ（#homeTypeNav）。「すべて」＋設定タブの車両画像で
   * 選べる型（MODEL_BODY_TYPE_OPTIONS、Constants.gs）を、登録状況に関わらず常に
   * 同じ並びで表示する（型を1件も割り当てていない運用開始直後でも迷わないよう、
   * 固定の選択肢にしている）。クリックするとstate.homeBodyTypeFilterを更新し、
   * renderHomeGallery_を呼び直してカード一覧を絞り込む。
   */
  function renderHomeTypeNav_() {
    var options = (state.bootstrap && state.bootstrap.modelBodyTypeOptions) || [];
    var current = state.homeBodyTypeFilter;
    var itemsHtml = '<button type="button" class="homeTypeNav__item' + (!current ? ' is-active' : '') +
      '" data-home-type="">すべて</button>' +
      options.map(function (t) {
        return '<button type="button" class="homeTypeNav__item' + (current === t ? ' is-active' : '') +
          '" data-home-type="' + escapeHtml(t) + '">' + escapeHtml(t) + '</button>';
      }).join('');
    $('homeTypeNav').innerHTML = itemsHtml;
  }

  on('homeTypeNav', 'click', function (e) {
    var btn = e.target.closest('[data-home-type]');
    if (!btn) return;
    state.homeBodyTypeFilter = btn.dataset.homeType || '';
    renderHomeGallery_();
  });

  /**
   * ホーム画面カード1件分のHTML。写真・モデル名・在庫台数バッジをタップ・
   * クリックなしでカード自体に表示する。
   * グレード（gradePrefix・gradeMarker）で複数の型番をまとめて登録している場合は、
   * 型番ごとの在庫数を横並びのチップ（.homeCard__gradeGrid）で表示し、チップ単体を
   * クリックするとその型番だけに絞り込んだ在庫リストへ遷移する（data-home-grade）。
   * この場合、カード全体ではなく写真をクリックしたときに、そのモデルの全グレードへ
   * 絞り込んだ在庫リストへ遷移する（data-home-model）。gradePrefix未設定（グレードと
   * いう概念自体を使わない、1台ずつ個別登録したモデル）の場合は、チップの一覧を
   * 出さず、従来どおりカード全体をクリック対象にする。対象の在庫が0台の場合は
   * （在庫のないモデル・グレードを押しても在庫リストへ遷移してしまわないよう）
   * クリック対象にしない。
   */
  function homeModelCardHtml_(p, allItems, allModelPhotos) {
    var grades = matchedModelsForEntry_(p, allItems, allModelPhotos);
    var total = modelCountForEntry_(p, allItems, allModelPhotos);
    var hasGrades = !!p.gradePrefix && grades.length > 0;
    var canNavigateAll = total > 0;
    var stockClass = 'badge homeCard__stock' + (total === 0 ? ' badge--stock--zero' : '');
    var stockHtml = '<span class="' + stockClass + '">' + homeStockCountText_(total) + '</span>';

    var gradeGridHtml = '';
    if (hasGrades) {
      gradeGridHtml = '<div class="homeCard__gradeGrid">' + grades.map(function (gradeModel) {
        var count = allItems.filter(function (v) { return v.model === gradeModel; }).length;
        var zero = count === 0;
        return '<button type="button" class="homeCard__gradeChip"' +
          (zero ? ' disabled' : ' data-home-grade="' + escapeHtml(gradeModel) + '"') + '>' +
          '<span class="homeCard__gradeName">' + escapeHtml(gradeModel) + '</span>' +
          '<span class="homeCard__gradeCount' + (zero ? ' homeCard__gradeCount--zero' : '') + '">' + count + '台</span>' +
          '</button>';
      }).join('') + '</div>';
    }

    // 厳選された代表写真を「ふわっと」表示する演出（Stylesheet.htmlの
    // .homeCard__photo img参照）。読み込み完了（またはURL誤り等での失敗）で
    // is-loadedを付け、キャッシュ済み・低速回線のどちらでも画像が消えたままに
    // ならないようにする。HTML属性内のためJS文字列リテラルの引用符（'）は
    // 文字実体参照（&#39;）で書く。
    // photoUrlが無い場合（unphotographedModelEntries_で追加した、代表写真が
    // まだ登録されていないモデル）は、壊れた画像として見えてしまう<img>では
    // なく、専用のプレースホルダー（写真アイコン＋「写真未登録」）を出す
    // （現場からの要望：写真が無くても在庫があるモデルはホームから漏れなく
    // 見えるようにしたい）。
    var photoInner = p.photoUrl
      ? '<img src="' + escapeHtml(p.photoUrl) + '" alt="' + escapeHtml(p.model) +
        '" loading="lazy" onload="this.classList.add(&#39;is-loaded&#39;)" onerror="this.classList.add(&#39;is-loaded&#39;)">' + stockHtml
      : '<div class="homeCard__photoMissing">' +
        '<svg class="icon homeCard__photoMissingIcon"><use href="#icon-image"></use></svg>' +
        '<span class="homeCard__photoMissingLabel">写真未登録</span>' +
        '</div>' + stockHtml;
    var photoClass = 'homeCard__photo' + (p.photoUrl ? '' : ' homeCard__photo--empty');
    var photoHtml;
    if (hasGrades) {
      photoHtml = canNavigateAll
        ? '<div class="' + photoClass + ' homeCard__photo--clickable" role="button" tabindex="0" data-home-model="' + escapeHtml(p.model) + '">' + photoInner + '</div>'
        : '<div class="' + photoClass + '">' + photoInner + '</div>';
    } else {
      photoHtml = '<div class="' + photoClass + '">' + photoInner + '</div>';
    }

    var cardClickable = !hasGrades && canNavigateAll;
    var cardClass = 'homeCard' + (cardClickable ? ' homeCard--clickable' : '');
    var cardAttrs = cardClickable ? ' role="button" tabindex="0" data-home-model="' + escapeHtml(p.model) + '"' : '';

    var typeHtml = p.bodyType ? '<span class="homeCard__type">' + escapeHtml(p.bodyType) + '</span>' : '';

    return '<div class="' + cardClass + '"' + cardAttrs + '>' +
      photoHtml +
      '<div class="homeCard__body">' +
      '<div class="homeCard__headRow"><span class="homeCard__model">' + escapeHtml(p.model) + '</span>' + typeHtml + '</div>' +
      gradeGridHtml +
      '</div>' +
      '</div>';
  }

  /**
   * ホーム画面本体。中古車は1台ごとに個体差があるため、グレードタブへの展開は
   * 行わず、登録された車両画像をそのままカードグリッドに並べるだけのシンプルな
   * 構成にしている（PC・タブレット・スマホともに同じ#homeGrid・.homeCardをCSSの
   * auto-fillだけで列数を変える。旧実装にあったPC/スマホでHTML構造を出し分ける
   * 仕組みは廃止）。上部の型クイックナビ（renderHomeTypeNav_、
   * state.homeBodyTypeFilter）で型を選択している場合は、その型（bodyType）が
   * 一致する車両画像だけに絞り込む（1件もカード（登録済み写真＋写真未登録の
   * プレースホルダー）が無い場合は#homeEmptyを、型は登録されているが選択した
   * 型に一致するカードが無い場合は#homeTypeEmptyを表示する）。
   * 代表写真が未登録でも在庫があるモデルは、unphotographedModelEntries_で
   * 生成したプレースホルダーエントリとして末尾に追加し、漏れなく見えるように
   * する（現場からの要望。管理者が写真を用意し次第、通常のカードに切り替わる）。
   */
  function renderHomeGallery_() {
    var allModelPhotos = (state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.modelPhotos) || [];
    renderHomeTypeNav_();
    var allItems = state.allInventoryItems || [];
    var allEntries = allModelPhotos.concat(unphotographedModelEntries_(allItems, allModelPhotos));
    var entries = state.homeBodyTypeFilter
      ? allEntries.filter(function (p) { return p.bodyType === state.homeBodyTypeFilter; })
      : allEntries;
    $('homeEmpty').classList.toggle('hidden', allEntries.length > 0);
    $('homeTypeEmpty').classList.toggle('hidden', !(allEntries.length > 0 && entries.length === 0));
    $('homeGrid').innerHTML = entries
      .map(function (p) { return homeModelCardHtml_(p, allItems, allModelPhotos); })
      .join('');
    renderHomeAnnouncement_((state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.homeAnnouncement) || '');
  }

  /**
   * ホーム画面の一番上に表示するお知らせ（管理者が設定タブから入力する自由記述の
   * 案内文、例:「限定車在庫3台あり」）。全利用者に表示する（設定の編集自体は
   * 管理者限定だが、値はredactSystemMasterSettings_で非管理者にも渡される。
   * SettingsService.gs参照）。未設定（空文字）の場合は要素ごと非表示にする。
   */
  function renderHomeAnnouncement_(text) {
    var el = $('homeAnnouncement');
    var value = String(text || '').trim();
    el.textContent = value;
    el.classList.toggle('hidden', !value);
  }

  /**
   * ホーム画面のカード（またはグレードチップ）クリック時、その車両画像の自動判定
   * 条件に一致する車両のキーワードで在庫リストへ遷移する。在庫リストのキーワード
   * 検索欄はサーバー側searchInventoryでモデル名の部分一致に対応済みのため、
   * gradePrefix（クラス名）をそのままキーワードとして渡せば、そのクラスに属する
   * すべての型番がまとめてヒットする。在庫リスト自体の絞り込み・検索の仕組みは
   * 変更していない。
   */
  function navigateHomeToInventory_(keyword) {
    $('inventoryKeyword').value = keyword;
    switchToTab_('inventory');
    loadInventory();
  }

  on('homeGrid', 'click', function (e) {
    var gradeBtn = e.target.closest('[data-home-grade]');
    if (gradeBtn) {
      navigateHomeToInventory_(gradeBtn.dataset.homeGrade);
      return;
    }
    var modelEl = e.target.closest('[data-home-model]');
    if (modelEl) {
      var allModelPhotos = (state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.modelPhotos) || [];
      var entry = allModelPhotos.filter(function (p) { return p.model === modelEl.dataset.homeModel; })[0];
      navigateHomeToInventory_(entry && entry.gradePrefix ? entry.gradePrefix : modelEl.dataset.homeModel);
    }
  });

  /**
   * マイページ用に、受注リストの検索・絞り込み条件に左右されない全件を取得する
   * （loadAllInventoryItems_が在庫についてやっているのと同じ考え方）。
   */
  function loadMyPageOrders_() {
    return gasRun('api_listOrders', {}, '').then(function (groups) {
      state.allOrders = (groups && groups[0] && groups[0].items) || [];
      renderMyPageOrders_();
    }).catch(function (err) {
      console.error('[used-vehicle-order-app] マイページ用の受注データ取得でエラーが発生しました:', err);
    });
  }

  /**
   * マイページ: ログイン中のGoogleアカウント（担当者メールアドレス）に紐づく
   * Hold中の車両・受注した車両・発注リスト・Gクラス予約リストだけを抜き出して
   * 表示する。担当者マスタに未登録のアカウントの場合は、担当者を特定できず
   * 突き合わせようがないため、案内メッセージのみ表示する。
   */
  function renderMyPageNoStaffState_() {
    var hasStaff = !!currentStaffName_();
    $('myPageNoStaff').classList.toggle('hidden', hasStaff);
    $('myPageContent').classList.toggle('hidden', !hasStaff);
    return hasStaff;
  }

  // ===== マイページの自由検索 =====
  // 在庫リスト・受注リストと同じ番号付き一覧デザインに統一する（ROUND H
  // フェーズ2、カード／表の切り替えは廃止）。マイページ全体（Hold中の車両・
  // 受注した車両）に一括で適用する。自分の案件だけで件数が多くなりすぎない
  // 想定のため、検索はサーバーへ都度問い合わせず、各セクションが既に持っている
  // 全件キャッシュ（state.allInventoryItems / state.allOrders）をクライアント側で
  // 絞り込む。
  function myPageKeyword_() {
    return $('myPageKeyword').value;
  }

  function matchesAnyField_(values, keyword) {
    if (!keyword) return true;
    var kw = keyword.trim().toLowerCase();
    if (!kw) return true;
    return values.some(function (v) { return String(v || '').toLowerCase().indexOf(kw) !== -1; });
  }

  function myPageVehicleMatchesKeyword_(v, keyword) {
    return matchesAnyField_([v.model, v.commission, v.holdCustomer], keyword);
  }

  function myPageOrderMatchesKeyword_(o, keyword) {
    return matchesAnyField_([o.model, o.commission, o.customer, o.leadNumber, o.salesLocation], keyword);
  }

  on('myPageKeyword','input', debounce(renderMyPageAll_, 200));

  /**
   * Hold中の車両は、在庫リストのvehicleRowItemHtml_をそのまま再利用する。
   * ボタン操作（openActionModal / openCancelHoldModal の各lookup）は
   * 在庫リストの検索・絞り込み条件に左右されない全件キャッシュ
   * （state.allInventoryItems）へもフォールバックするようfindVehicleByCommission側で
   * 対応済みのため、マイページの行から操作しても在庫リスト側の絞り込み状態に
   * 関わらず正しく動作する。
   */
  function renderMyPageHolds_() {
    if (!renderMyPageNoStaffState_()) return;
    var email = currentUserEmail_();
    var keyword = myPageKeyword_();
    var items = (state.allInventoryItems || []).filter(function (v) {
      if (v.holdStatus !== 'hold') return false;
      if (!emailsMatch_(v.holdStaffEmail, email)) return false;
      return myPageVehicleMatchesKeyword_(v, keyword);
    });
    $('myPageHoldCount').textContent = items.length;
    $('myPageHoldEmpty').classList.toggle('hidden', items.length > 0);
    $('myPageHoldList').innerHTML = rowListHtml_(items, vehicleRowItemHtml_);
  }

  /**
   * 受注した車両は、受注リストのorderRowItemHtml_をそのまま再利用する
   * （行タップのlookupはfindOrderByCommission_側でフォールバック対応済み）。
   */
  function renderMyPageOrders_() {
    if (!renderMyPageNoStaffState_()) return;
    var email = currentUserEmail_();
    var keyword = myPageKeyword_();
    var items = (state.allOrders || []).filter(function (o) {
      return emailsMatch_(o.staffEmail, email) && myPageOrderMatchesKeyword_(o, keyword);
    });
    $('myPageOrderCount').textContent = items.length;
    $('myPageOrderEmpty').classList.toggle('hidden', items.length > 0);
    $('myPageOrderList').innerHTML = rowListHtml_(items, orderRowItemHtml_);
  }

  /**
   * マイページ全体（Hold中の車両・受注した車両）をまとめて再描画する。
   * 自由検索キーワードの入力のたびに呼ぶ。
   */
  function renderMyPageAll_() {
    renderMyPageHolds_();
    renderMyPageOrders_();
  }

  on('myPageHoldList','click', handleInventoryListClick_);
  on('myPageOrderList','click', function (e) {
    var rowEl = e.target.closest('.rowItem[data-commission]');
    if (rowEl && !e.target.closest('button, input, label')) {
      openOrderDetailModal_(rowEl.dataset.commission);
    }
  });

  // スプレッドシート自体のタイトル（Googleドライブ上のファイル名）の変更は、
  // 他の設定項目（保存ボタンでまとめて保存、Script Propertiesへの書き込み）とは
  // 別の専用ボタン・専用API（api_renameSpreadsheet）で即座に反映する
  // （Api.gs参照）。
  on('btnRenameSpreadsheet','click', function () {
    if (this.disabled) return;
    var btn = this;
    var errEl = $('settingsSpreadsheetTitleError');
    errEl.classList.add('hidden');
    var title = $('settingsSpreadsheetTitle').value.trim();
    var max = (state.bootstrap && state.bootstrap.spreadsheetTitleMax) || 100;
    if (!title) {
      errEl.textContent = 'スプレッドシートのタイトルを入力してください。';
      errEl.classList.remove('hidden');
      return;
    }
    if (title.length > max) {
      errEl.textContent = 'タイトルは最大' + max + '文字までです（現在' + title.length + '文字）';
      errEl.classList.remove('hidden');
      return;
    }
    setButtonBusy(btn, true, '変更中...');
    gasRun('api_renameSpreadsheet', title).then(function (savedTitle) {
      setButtonBusy(btn, false);
      state.bootstrap.spreadsheetTitle = savedTitle;
      $('settingsSpreadsheetTitle').value = savedTitle;
      showToast('スプレッドシートのタイトルを変更しました');
    }).catch(function (err) {
      setButtonBusy(btn, false);
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    });
  });

  on('btnSaveSettings','click', function () {
    if (this.disabled) return;
    var btn = this;
    var max = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    var cleaned = state.staffList
      .map(function (s) {
        return {
          name: String((s && s.name) || '').trim(),
          email: String((s && s.email) || '').trim().toLowerCase(),
          location: String((s && s.location) || '').trim()
        };
      })
      .filter(function (s) { return s.name && s.email; });
    var seenEmails = {};
    var uniqueStaffList = cleaned.filter(function (s) {
      if (seenEmails[s.email]) return false;
      seenEmails[s.email] = true;
      return true;
    });

    $('settingsError').textContent = '';
    if (uniqueStaffList.length > max) {
      $('settingsError').textContent = '担当者マスタは最大' + max + '人までです（現在' + uniqueStaffList.length + '人）';
      return;
    }

    // メール通知先3項目も、担当者マスタと同様に空欄除去・大文字小文字を
    // 無視した重複除去・最大件数チェックをクライアント側でも行う（サーバー側の
    // normalizeMailList_と同じ規則。保存前にエラーメッセージで気づけるようにするため）。
    var maxMails = notifyMailListMax_();
    var mailFieldLabels = { notifyHoldMailTo: 'Hold時', notifyOrderMailTo: '受注確定時', notifyErrorMailTo: 'システムエラー通知先' };
    var cleanedMailLists = {};
    for (var mi = 0; mi < MAIL_FIELDS.length; mi++) {
      var mailKey = MAIL_FIELDS[mi].key;
      var seenMails = {};
      var uniqueMails = (state[mailKey] || [])
        .map(function (m) { return String(m || '').trim(); })
        .filter(function (m) { return m; })
        .filter(function (m) {
          var lower = m.toLowerCase();
          if (seenMails[lower]) return false;
          seenMails[lower] = true;
          return true;
        });
      if (uniqueMails.length > maxMails) {
        $('settingsError').textContent = 'メール通知先（' + mailFieldLabels[mailKey] + '）は最大' + maxMails + '件までです（現在' + uniqueMails.length + '件）';
        return;
      }
      cleanedMailLists[mailKey] = uniqueMails;
    }

    // Google ChatのWebhook URLも、サーバー側のvalidateChatWebhookUrl_（SettingsService.gs）
    // と同じ規則を保存前にクライアント側でもチェックし、往復せずにエラーへ気づけるようにする。
    var chatWebhookUrl = $('settingsChatWebhookUrl').value.trim();
    if (chatWebhookUrl && chatWebhookUrl.indexOf('https://') !== 0) {
      $('settingsError').textContent = 'Google ChatのWebhook URLは https:// から始まるURLを指定してください。';
      return;
    }

    // アプリタイトルも、サーバー側のvalidateAppTitle_（SettingsService.gs）と
    // 同じ規則を保存前にクライアント側でもチェックする。
    var appTitle = $('settingsAppTitle').value.trim();
    var maxAppTitle = (state.bootstrap && state.bootstrap.appTitleMax) || 40;
    if (appTitle.length > maxAppTitle) {
      $('settingsError').textContent = 'タイトルは最大' + maxAppTitle + '文字までです（現在' + appTitle.length + '文字）';
      return;
    }

    // ロゴ・ローディング画像も、サーバー側のvalidateLogoUrl_・validateLoadingImageUrl_
    // （SettingsService.gs）と同じ規則（変換後URLの最大文字数）を保存前にクライアント
    // 側でもチェックする。ドライブID・共有リンクを指定した場合、変換後は必ず短い
    // 固定形式のURLになるため、ここでの入力値（変換前）の文字数チェックで実質的に
    // 十分カバーできる（長すぎる外部URLを直接貼り付けた場合のみ引っかかる）。
    var logoUrlInput = $('settingsLogoUrl').value.trim();
    var maxLogoUrl = (state.bootstrap && state.bootstrap.logoUrlMax) || 1500;
    if (logoUrlInput.length > maxLogoUrl) {
      $('settingsError').textContent = 'ロゴ画像のURLが長すぎます（' + logoUrlInput.length + '文字）';
      return;
    }
    var loadingImageId = $('settingsLoadingImageId').value.trim();
    var maxLoadingImage = (state.bootstrap && state.bootstrap.loadingImageUrlMax) || 1500;
    if (loadingImageId.length > maxLoadingImage) {
      $('settingsError').textContent = 'ローディング画像のURLが長すぎます（' + loadingImageId.length + '文字）';
      return;
    }

    // ボディタイプの紐付けルールも、サーバー側のnormalizeModelBodyTypeRules_
    // （SettingsService.gs）と同じ規則（キーワード空欄の行を除去・
    // キーワード×ボディタイプの組で重複除去・最大件数チェック）を保存前に
    // クライアント側でも行う。
    var bodyTypeOptions = (state.bootstrap && state.bootstrap.modelBodyTypeOptions) || [];
    var seenRules = {};
    var uniqueBodyTypeRules = (state.modelBodyTypeRules || [])
      .map(function (r) { return { keyword: String((r && r.keyword) || '').trim(), bodyType: String((r && r.bodyType) || '').trim() }; })
      .filter(function (r) { return r.keyword && bodyTypeOptions.indexOf(r.bodyType) !== -1; })
      .filter(function (r) {
        var key = r.keyword.toLowerCase() + '␀' + r.bodyType;
        if (seenRules[key]) return false;
        seenRules[key] = true;
        return true;
      });
    var maxBodyTypeRules = modelBodyTypeRulesMax_();
    if (uniqueBodyTypeRules.length > maxBodyTypeRules) {
      $('settingsError').textContent = 'ボディタイプの紐付けは最大' + maxBodyTypeRules + '件までです（現在' + uniqueBodyTypeRules.length + '件）';
      return;
    }

    // 車両画像も、サーバー側のnormalizeModelPhotos_（SettingsService.gs）と同じ
    // 規則（モデル名・写真URLがともに入力されている行のみ残す・モデル名で重複
    // 除去・最大件数チェック）を保存前にクライアント側でも行う。gradePrefix・
    // gradeMarkerの文字数上限は往復してもエラーが分かりやすいため、サーバー側の
    // チェックにまかせる。
    var seenPhotoModels = {};
    var uniqueModelPhotos = (state.modelPhotos || [])
      .map(function (p) {
        return {
          model: String((p && p.model) || '').trim(),
          photoUrl: String((p && p.photoUrl) || '').trim(),
          gradePrefix: String((p && p.gradePrefix) || '').trim(),
          gradeMarker: String((p && p.gradeMarker) || '').trim(),
          bodyType: String((p && p.bodyType) || '').trim()
        };
      })
      .filter(function (p) { return p.model && p.photoUrl; })
      .filter(function (p) {
        if (seenPhotoModels[p.model]) return false;
        seenPhotoModels[p.model] = true;
        return true;
      });
    var maxModelPhotos = modelPhotosMax_();
    if (uniqueModelPhotos.length > maxModelPhotos) {
      $('settingsError').textContent = '車両画像は最大' + maxModelPhotos + '件までです（現在' + uniqueModelPhotos.length + '件）';
      return;
    }

    // お知らせも、サーバー側のvalidateHomeAnnouncement_（SettingsService.gs）と
    // 同じ規則（最大文字数）を保存前にクライアント側でもチェックする。
    var homeAnnouncement = $('settingsHomeAnnouncement').value.trim();
    var maxHomeAnnouncement = (state.bootstrap && state.bootstrap.homeAnnouncementMax) || 60;
    if (homeAnnouncement.length > maxHomeAnnouncement) {
      $('settingsError').textContent = 'お知らせは最大' + maxHomeAnnouncement + '文字までです（現在' + homeAnnouncement.length + '文字）';
      return;
    }

    var settings = {
      themeKey: state.themeKey || DEFAULT_THEME_KEY,
      appTitle: appTitle,
      logoUrl: logoUrlInput,
      loadingImageUrl: loadingImageId,
      notifyHoldMailTo: cleanedMailLists.notifyHoldMailTo,
      notifyOrderMailTo: cleanedMailLists.notifyOrderMailTo,
      notifyErrorMailTo: cleanedMailLists.notifyErrorMailTo,
      notifyChatWebhookUrl: chatWebhookUrl,
      staffList: uniqueStaffList,
      modelBodyTypeRules: uniqueBodyTypeRules,
      modelPhotos: uniqueModelPhotos,
      homeAnnouncement: homeAnnouncement,
      celebrationVariants: {
        hold: $('celebrationVariantHold').value,
        order: $('celebrationVariantOrder').value
      }
    };
    setButtonBusy(btn, true, '保存中...');
    gasRun('api_saveSettings', settings).then(function (saved) {
      state.bootstrap.settings = saved;
      // 担当者マスタが変わった可能性があるため、ログイン中のアカウントに対応する
      // 担当者名（currentStaffName）を再取得してトップバー表示等に反映する。
      return gasRun('api_getBootstrapData');
    }).then(function (bootstrap) {
      setButtonBusy(btn, false);
      state.bootstrap = bootstrap;
      renderSettings(bootstrap.settings);
      renderTopbarUser();
      renderHomeGallery_();
      showToast('設定を保存しました');
    }).catch(function (err) {
      setButtonBusy(btn, false);
      $('settingsError').textContent = err.message;
    });
  });

  // ===== ユーティリティ =====
  function debounce(fn, wait) {
    var timer = null;
    return function () {
      clearTimeout(timer);
      var args = arguments;
      timer = setTimeout(function () { fn.apply(null, args); }, wait);
    };
  }

  // ===== モーダルをソフトウェアキーボードの上に収める =====
  // 不具合修正: スマホでHold登録・受注確定モーダルの入力欄をタップすると、
  // ソフトウェアキーボードが開いた分だけ画面下側が隠れ、モーダル（特に画面
  // 下端に固定したボトムシート）の下側にある入力中の項目が見えなくなって
  // しまっていた。100vh・window.innerHeightはレイアウトビューポート基準の
  // ため、iOS Safari等ではキーボードが開いても値が変わらず、CSS側だけでは
  // キーボードの高さを考慮できない。window.visualViewport（対応ブラウザ）は
  // キーボード表示中の「実際に見えている」高さを返すため、レイアウト
  // ビューポートの高さ（window.innerHeight）との差＝キーボードの高さを
  // 都度測ってCSS変数（--app-keyboard-inset、Stylesheet.htmlの.modal参照）に
  // 反映し、モーダルの下方向パディングに足すことでキーボードの上に押し
  // 上げる。
  // 不具合修正（前回試した方式の反省）: 最初は.modal自身のtop・heightを
  // visualViewportの実測値に直接書き換える方式を試したが、iOS Safariでは
  // position: fixed要素の位置・高さをJSから動的に書き換えるとレイアウトが
  // 崩れて表示される不具合があった。.modal自体の位置・高さの計算方法は
  // 変えず、paddingの増減だけで対応することで、この崩れを避けている。
  function syncKeyboardInset_() {
    var vv = window.visualViewport;
    // キーボードが無い間は0（visualViewport非対応環境も常に0のまま＝
    // 従来どおりレイアウトビューポート基準の表示になる）。
    var inset = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
    document.documentElement.style.setProperty('--app-keyboard-inset', inset + 'px');
  }
  if (window.visualViewport) {
    syncKeyboardInset_();
    // resizeはキーボードの開閉・端末回転で、scrollはキーボード表示中に
    // ページがわずかにスクロールされた場合（visualViewportのoffsetTopが
    // 変化する）で、それぞれ発火する。
    window.visualViewport.addEventListener('resize', syncKeyboardInset_);
    window.visualViewport.addEventListener('scroll', syncKeyboardInset_);
  }

  // モーダルの高さ自体をキーボードの上に収めても、.modal__body内部の
  // スクロール位置までは追従しないことがあるため、モーダル内の入力欄に
  // フォーカスが移ったら、キーボードの開閉アニメーションが落ち着く頃合いを
  // 見て明示的にscrollIntoViewする（保険。visualViewport非対応環境でも
  // 効果がある）。
  document.addEventListener('focusin', function (e) {
    var target = e.target;
    if (!/^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName)) return;
    var modal = target.closest('.modal:not(.hidden)');
    if (!modal) return;
    setTimeout(function () {
      target.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 300);
  });

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ===== 初期化・更新 =====
  // 起動時の読み込みと、「更新」ボタン（btnRefresh）による再読み込みの両方から呼ぶ
  // 共通処理。設定・担当者判定・整合性チェック・在庫/受注/ホームの一覧をすべて
  // サーバーから最新の状態に取り直す。
  /**
   * bootstrap取得後の各初期化ステップを、1つずつ独立してtry/catchする。
   * これらは互いに無関係な画面（設定タブ・トップバー・整合性チェック）の描画のため、
   * 例えば設定タブの描画だけが何か（要素の食い違い等）で失敗しても、それが原因で
   * 在庫リスト・受注リスト・ホーム画面の読み込み（最後のPromise.all）まで
   * 巻き込んで止まってしまう、という事態を避ける（1箇所の不具合がアプリ全体を
   * 道連れにしないようにするための防御的な実装）。失敗した処理はコンソールに
   * エラーを出すだけに留め、他の処理は影響を受けず続行する。
   */
  function runInitStep_(label, fn) {
    try {
      fn();
    } catch (e) {
      console.error('[used-vehicle-order-app] ' + label + ' の処理でエラーが発生しました:', e);
    }
  }

  /**
   * bootstrap（設定・担当者判定・ログインアカウント情報）の取得・反映と、
   * 在庫リスト・受注リスト・ホーム画面・マイページのデータ取得は、互いに独立した
   * 別々のサーバー呼び出しであり、本来どちらかがどちらかを待つ理由が無い。
   * 以前はbootstrap取得が完了する（.then内で）まで在庫等の読み込みを一切
   * 開始しない直列構造になっており、bootstrap側（api_getBootstrapData自体の
   * 失敗・タイムアウト等）が何か1つでも失敗すると、在庫・受注・
   * マイページ・ログインアカウント表示のすべてが道連れで真っ白になっていた。
   * 両者を最初から並行して走らせることで、片方が失敗してももう片方は
   * 影響を受けず表示できるようにする。
   */
  function reloadAll_() {
    var bootstrapPromise = gasRun('api_getBootstrapData').then(function (bootstrap) {
      state.bootstrap = bootstrap;
      runInitStep_('契約条件の選択肢の初期化', function () {
        fillOptions($('actionTradeIn'), bootstrap.yesNoOptions, true);
        fillOptions($('actionOss'), bootstrap.ossOptions, true);
        fillOptions($('actionInsurance'), bootstrap.yesNoOptions, true);
        fillOptions($('actionPaymentMethod'), bootstrap.paymentMethodOptions, true);
      });
      runInitStep_('設定タブの描画', function () { renderSettings(bootstrap.settings); });
      runInitStep_('ユーザー情報の描画', renderTopbarUser);
      runInitStep_('ホーム画面の描画', renderHomeGallery_);
      runInitStep_('在庫データの整合性チェック', checkIntegrity_);
    }).catch(function (err) {
      console.error('[used-vehicle-order-app] 起動時データ（設定・ログインアカウント情報）の取得に失敗しました:', err);
      showToast('起動時データの取得に失敗しました: ' + err.message, true);
    });
    return Promise.all([bootstrapPromise, loadInventory(), loadOrders(), loadWholesaleOrders(), loadAllInventoryItems_(), loadMyPageOrders_()]);
  }

  function init() {
    syncNavButtons_();
    initScrollFade_('topbarTabs');
    initScrollElevation_();
    reloadAll_().catch(function (err) { showToast(err.message, true); }).then(function () {
      // 起動時ローディング画面は初回の読み込み完了時のみフェードアウトする
      // （更新ボタンからの再読み込みは、ボタン自体の回転アイコンで十分なため
      // 全画面オーバーレイは出さない）。
      var loading = $('appLoading');
      if (loading) loading.classList.add('is-hidden');
      // 型／ボディタイプのクイックナビはreloadAll_内のrender*_で中身が
      // 入った後でないと横幅（scrollWidth）が確定しないため、ここで初期化する。
      initScrollFade_('homeTypeNav');
      initScrollFade_('inventoryBodyTypeNav');
    });
  }

  // PWA対応：Service Workerを登録する（未対応ブラウザでは何もしない）。
  // オフラインキャッシュは行わず、「ホーム画面に追加」の条件を満たすためだけの
  // 最小限の登録（PwaService.gs参照）。Googleサイトへの埋め込み表示など、
  // このページがiframe内にある場合はホーム画面への追加自体が機能しないため、
  // 登録に失敗しても静かに無視する。
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('?resource=sw').catch(function () { /* 埋め込み表示等では失敗し得るため無視する */ });
  }

  try {
    init();
  } catch (e) {
    console.error('[used-vehicle-order-app] 初期化中にエラーが発生しました:', e);
    var loadingEl = document.getElementById('appLoading');
    if (loadingEl) loadingEl.classList.add('is-hidden');
  }
})();
</script>
