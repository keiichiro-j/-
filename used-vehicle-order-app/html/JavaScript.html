          '<button type="button" class="staffList__summary" data-toggle-staff="' + i + '" aria-expanded="' + isExpanded + '">' +
          '<span class="staffList__summaryText">' +
          '<span class="staffList__summaryName">' + escapeHtml(staffSummaryName_(entry)) + '</span>' +
          '<span class="staffList__summarySub">' + escapeHtml(staffSummarySub_(entry)) + '</span>' +
          '</span>' +
          '<span class="staffList__chevron" aria-hidden="true">' + (isExpanded ? '▾' : '▸') + '</span>' +
          '</button>' +
          '<button class="btn btn--icon" data-remove-staff="' + i + '" type="button" aria-label="削除">&times;</button>' +
          '</div>' +
          '<div class="staffList__body' + (isExpanded ? '' : ' hidden') + '">' +
          '<input type="text" class="input" data-staff-index="' + i + '" data-staff-field="name" placeholder="名前" value="' + escapeHtml(entry.name || '') + '">' +
          '<input type="email" class="input" data-staff-index="' + i + '" data-staff-field="email" placeholder="メールアドレス" value="' + escapeHtml(entry.email || '') + '">' +
          '<input type="text" class="input" data-staff-index="' + i + '" data-staff-field="location" placeholder="拠点名" value="' + escapeHtml(entry.location || '') + '">' +

  // 要約行（折りたたみ中に見える名前・拠点・メールアドレス）は、入力のたびに
  // renderStaffList()を丸ごと呼び直すとinput要素が作り直されてフォーカス・
  // カーソル位置が失われるため、対象行の要約テキストだけをその場で書き換える。
  function updateStaffSummary_(index, entry) {
    var item = document.querySelector('#staffList [data-drag-index="' + index + '"]');

  on('staffList','input', function (e) {

    updateStaffSummary_(Number(index), entry);

  on('staffList','click', function (e) {
    var removeBtn = e.target.closest('[data-remove-staff]');
    if (removeBtn) {
      state.staffList.splice(Number(removeBtn.dataset.removeStaff), 1);

  on('btnAddStaff','click', function () {
    var max = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    if (state.staffList.length >= max) return;

    state.staffList.push({ name: '', email: '', location: '', _expanded: true });

  //       以前は「,区切りの1つのテキスト欄」だったが、担当者マスタと

  var MAIL_FIELDS = [

      if (inputs.length) inputs[inputs.length - 1].focus();

  // ----- 車両画像（ホーム画面のギャラリーに表示する写真）。担当者マスタ・

  function renderHomeTypeNav_() {

    sel.innerHTML = '<option value="">すべて</option>' + options.map(function (t) {
      return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>';
    }).join('');
    sel.value = options.indexOf(current) !== -1 ? current : '';
    if (sel.value !== current) state.homeBodyTypeFilter = sel.value;
  }

  on('homeTypeFilter', 'change', function () {
    state.homeBodyTypeFilter = this.value;
    renderHomeGallery_();
  });

  /**
   * ホーム画面カード1件分のHTML。写真・モデル名・在庫台数バッジをタップ・
   * クリックなしでカード自体に表示する。
   * グレード（gradePrefix・gradeMarker）で複数の型番をまとめて登録している場合は、
   * 型番ごとの在庫数を横並びのチップ（.homeCard__gradeGrid）で表示し、チップ単体を
   * クリックするとその型番だけに絞り込んだ在庫リストへ遷移する（data-home-grade）。
   * この場合、カード全体ではなく写真をクリックしたときに、そのモデルの全グレードへ
   * 絞り込んだ在庫リストへ遷移する（data-home-model）。gradePrefix未設定（グレードと
   * いう概念自体を使わない、1台ずつ個別登録したモデル）の場合は、チップの一覧を
   * 出さず、従来どおりカード全体をクリック対象にする。対象の在庫が0台の場合は
   * （在庫のないモデル・グレードを押しても在庫リストへ遷移してしまわないよう）
   * クリック対象にしない。
   */
  function homeModelCardHtml_(p, allItems, allModelPhotos) {
    var grades = matchedModelsForEntry_(p, allItems, allModelPhotos);
    var total = modelCountForEntry_(p, allItems, allModelPhotos);
    var hasGrades = !!p.gradePrefix && grades.length > 0;
    var canNavigateAll = total > 0;
    var stockClass = 'badge homeCard__stock' + (total === 0 ? ' badge--stock--zero' : '');
    var stockHtml = '<span class="' + stockClass + '">' + homeStockCountText_(total) + '</span>';

    // 不具合修正（ビジュアル担当チームからの指摘）: 在庫リスト・受注リストには
    // 「価格」列が常設されているのに、ホームのカードだけ価格が一切分からず、
    // 画面間で情報の一貫性に欠けていた。モデル（グレードまとめ）単位のカードの
    // ため1台の確定額ではなく、一致する在庫の最低価格を「〜円から」の目安として
    // 添える（価格未入力の車両しかない場合は表示しない）。
    var minPrice = minSalePriceForEntry_(p, allItems, allModelPhotos);
    var priceHtml = minPrice !== null
      ? '<span class="homeCard__price">' + formatNumberUnit_(minPrice, ' 円〜') + '</span>'
      : '';

    var gradeGridHtml = '';
    if (hasGrades) {
      gradeGridHtml = '<div class="homeCard__gradeGrid">' + grades.map(function (gradeModel) {
        var count = allItems.filter(function (v) { return v.model === gradeModel; }).length;
        var zero = count === 0;
        return '<button type="button" class="homeCard__gradeChip"' +
          (zero ? ' disabled' : ' data-home-grade="' + escapeHtml(gradeModel) + '"') + '>' +
          '<span class="homeCard__gradeName">' + escapeHtml(gradeModel) + '</span>' +
          '<span class="homeCard__gradeCount' + (zero ? ' homeCard__gradeCount--zero' : '') + '">' + count + '台</span>' +
          '</button>';
      }).join('') + '</div>';
    }

    // 厳選された代表写真を「ふわっと」表示する演出（Stylesheet.htmlの
    // .homeCard__photo img参照）。読み込み完了（またはURL誤り等での失敗）で
    // is-loadedを付け、キャッシュ済み・低速回線のどちらでも画像が消えたままに
    // ならないようにする。HTML属性内のためJS文字列リテラルの引用符（'）は
    // 文字実体参照（&#39;）で書く。
    // photoUrlが無い場合（unphotographedModelEntries_で追加した、代表写真が
    // まだ登録されていないモデル）は、壊れた画像として見えてしまう<img>では
    // なく、専用のプレースホルダー（写真アイコン＋「写真未登録」）を出す
    // （現場からの要望：写真が無くても在庫があるモデルはホームから漏れなく
    // 見えるようにしたい）。
    var photoInner = p.photoUrl
      ? '<img src="' + escapeHtml(p.photoUrl) + '" alt="' + escapeHtml(p.model) +
        '" loading="lazy" onload="this.classList.add(&#39;is-loaded&#39;)" onerror="this.classList.add(&#39;is-loaded&#39;)">' + stockHtml
      : '<div class="homeCard__photoMissing">' +
        '<svg class="icon homeCard__photoMissingIcon"><use href="#icon-image"></use></svg>' +
        '<span class="homeCard__photoMissingLabel">写真未登録</span>' +
        '</div>' + stockHtml;
    var photoClass = 'homeCard__photo' + (p.photoUrl ? '' : ' homeCard__photo--empty');
    var photoHtml;
    if (hasGrades) {
      photoHtml = canNavigateAll
        ? '<div class="' + photoClass + ' homeCard__photo--clickable" role="button" tabindex="0" data-home-model="' + escapeHtml(p.model) + '">' + photoInner + '</div>'
        : '<div class="' + photoClass + '">' + photoInner + '</div>';
    } else {
      photoHtml = '<div class="' + photoClass + '">' + photoInner + '</div>';
    }

    var cardClickable = !hasGrades && canNavigateAll;
    var cardClass = 'homeCard' + (cardClickable ? ' homeCard--clickable' : '');
    var cardAttrs = cardClickable ? ' role="button" tabindex="0" data-home-model="' + escapeHtml(p.model) + '"' : '';

    var typeHtml = p.bodyType ? '<span class="homeCard__type">' + escapeHtml(p.bodyType) + '</span>' : '';

    return '<div class="' + cardClass + '"' + cardAttrs + '>' +
      photoHtml +
      '<div class="homeCard__body">' +
      '<div class="homeCard__headRow"><span class="homeCard__model">' + escapeHtml(p.model) + '</span>' + typeHtml + '</div>' +
      priceHtml +
      gradeGridHtml +
      '</div>' +
      '</div>';
  }

  /**
   * ホーム画面本体。中古車は1台ごとに個体差があるため、グレードタブへの展開は
   * 行わず、登録された車両画像をそのままカードグリッドに並べるだけのシンプルな
   * 構成にしている（PC・タブレット・スマホともに同じ#homeGrid・.homeCardをCSSの
   * auto-fillだけで列数を変える。旧実装にあったPC/スマホでHTML構造を出し分ける
   * 仕組みは廃止）。上部の型クイックナビ（renderHomeTypeNav_、
   * state.homeBodyTypeFilter）で型を選択している場合は、その型（bodyType）が
   * 一致する車両画像だけに絞り込む（1件もカード（登録済み写真＋写真未登録の
   * プレースホルダー）が無い場合は#homeEmptyを、型は登録されているが選択した
   * 型に一致するカードが無い場合は#homeTypeEmptyを表示する）。
   * 代表写真が未登録でも在庫があるモデルは、unphotographedModelEntries_で
   * 生成したプレースホルダーエントリとして末尾に追加し、漏れなく見えるように
   * する（現場からの要望。管理者が写真を用意し次第、通常のカードに切り替わる）。
   */
  function renderHomeGallery_() {
    var allModelPhotos = (state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.modelPhotos) || [];
    renderHomeTypeNav_();
    // 不具合修正: 以前は在庫リストの区分「在庫」の車両だけを集計対象にしていたが、
    // デモカーリスト・サービス代車リストが在庫リストの区分からの自動反映ではなく
    // 各シートへの直接入力に変わったことに合わせ（CarTrackingService.gs参照）、
    // 在庫リスト＋デモカーリスト＋サービス代車リストの3シート全体（受注リストは
    // 対象外）を集計・絞り込みの対象にする（現場からの要望）。左の絞り込み
    // サイドバー（カラー・初年度登録日・価格帯・走行距離）も、この3シート分の
    // 車両プールに対して適用する（applyHomeFilters_参照。キーワードはここでは
    // 扱わない。「検索」ボタンから専用の検索結果ページへ遷移する形に変更した）。
    var pool = applyHomeFilters_(state.homeVehiclePool || []);
    var allEntries = allModelPhotos.concat(unphotographedModelEntries_(pool, allModelPhotos));
    var entries = state.homeBodyTypeFilter
      ? allEntries.filter(function (p) { return p.bodyType === state.homeBodyTypeFilter; })
      : allEntries;
    $('homeEmpty').classList.toggle('hidden', allEntries.length > 0);
    $('homeTypeEmpty').classList.toggle('hidden', !(allEntries.length > 0 && entries.length === 0));
    $('homeGrid').innerHTML = entries
      .map(function (p) { return homeModelCardHtml_(p, pool, allModelPhotos); })
      .join('');
    var allCount = (state.homeVehiclePool || []).length;
    $('homeFilterCount').textContent = allCount ? '該当 ' + pool.length + '台 ／ 全' + allCount + '台' : '';
    syncHomeFilterClearVisibility_();
    syncFilterRowsAndSummary_('homeFilterRows', 'homeActiveBar', 'btnHomeFilterClear', true);
    renderHomeAnnouncement_((state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.homeAnnouncement) || '');
  }

  /**
   * ホーム画面の一番上に表示するお知らせ（管理者が設定タブから入力する自由記述の
   * 案内文、例:「限定車在庫3台あり」）。全利用者に表示する（設定の編集自体は
   * 管理者限定だが、値はredactSystemMasterSettings_で非管理者にも渡される。
   * SettingsService.gs参照）。未設定（空文字）の場合は要素ごと非表示にする。
   */
  function renderHomeAnnouncement_(text) {
    var el = $('homeAnnouncement');
    var value = String(text || '').trim();
    el.textContent = value;
    el.dataset.text = value;
    syncHomeAnnouncementVisibility_();
  }

  /**
   * お知らせ（#homeAnnouncement）は、タイトル・タブと同じ囲い（.topbar__group、
   * 全画面共通のヘッダー）の中に表示するが、内容自体はホーム画面専用のため、
   * ホームタブを選んでいるときだけ表示する。表示・非表示に応じてbody.has-
   * announcementを切り替え、--topbar-h（Stylesheet.html参照）もその分の高さを
   * 含めた値に切り替わるようにする（switchToTab_・renderHomeAnnouncement_の
   * 両方から呼ぶ）。
   */
  function syncHomeAnnouncementVisibility_() {
    var el = $('homeAnnouncement');
    var hasText = !!(el.dataset.text || '').trim();
    var show = hasText && currentActiveTab_() === 'home';
    el.classList.toggle('hidden', !show);
    document.body.classList.toggle('has-announcement', show);
  }

  /**
   * ホーム画面のカード（またはグレードチップ）クリック時、専用の検索結果ページ
   * （#view-homeResults、在庫リスト＋デモカーリスト＋サービス代車リストを横断）へ
   * 遷移し、その型番（複数可・完全一致）だけに絞り込んで一覧表示する。不具合修正:
   * 以前は在庫リストタブへ画面遷移していたため在庫リストシートの車両しか出てこ
   * なかった問題（現場からの指摘「画像検索も在庫、デモカー、サービス代車を横断
   * して一覧表示してほしい」）に続き、専用の一覧ページへ飛ぶようにした（現場からの
   * 要望「モデル画像を選ぶと下に表示するのではなく専用のリストページに飛んで
   * ほしい」。以前はホーム画面内の結果一覧までスクロールするだけだった）。
   */
  on('homeGrid', 'click', function (e) {
    var gradeBtn = e.target.closest('[data-home-grade]');
    if (gradeBtn) {
      goToHomeResultsPage_({ models: [gradeBtn.dataset.homeGrade] });
      return;
    }
    var modelEl = e.target.closest('[data-home-model]');
    if (modelEl) {
      var allModelPhotos = (state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.modelPhotos) || [];
      var entry = allModelPhotos.filter(function (p) { return p.model === modelEl.dataset.homeModel; })[0];
      var pool = applyHomeFilters_(state.homeVehiclePool || []);
      var models = entry ? matchedModelsForEntry_(entry, pool, allModelPhotos) : [modelEl.dataset.homeModel];
      goToHomeResultsPage_({ models: models });
    }
  });

  /**
   * マイページ用に、受注リストの検索・絞り込み条件に左右されない全件を取得する
   * （loadAllInventoryItems_が在庫についてやっているのと同じ考え方）。
   */
  function loadMyPageOrders_() {
    return gasRun('api_listOrders', {}, '').then(function (groups) {
      state.allOrders = (groups && groups[0] && groups[0].items) || [];
      renderMyPageOrders_();
    }).catch(function (err) {
      console.error('[used-vehicle-order-app] マイページ用の受注データ取得でエラーが発生しました:', err);
    });
  }

  /**
   * マイページ: ログイン中のGoogleアカウント（担当者メールアドレス）に紐づく
   * Hold中の車両・受注した車両・発注リスト・Gクラス予約リストだけを抜き出して
   * 表示する。担当者マスタに未登録のアカウントの場合は、担当者を特定できず
   * 突き合わせようがないため、案内メッセージのみ表示する。
   */
  function renderMyPageNoStaffState_() {
    var hasStaff = !!currentStaffName_();
    $('myPageNoStaff').classList.toggle('hidden', hasStaff);
    $('myPageContent').classList.toggle('hidden', !hasStaff);
    return hasStaff;
  }

  // ===== マイページの自由検索 =====
  // 在庫リスト・受注リストと同じ番号付き一覧デザインに統一する（ROUND H
  // フェーズ2、カード／表の切り替えは廃止）。マイページ全体（Hold中の車両・
  // 受注した車両）に一括で適用する。自分の案件だけで件数が多くなりすぎない
  // 想定のため、検索はサーバーへ都度問い合わせず、各セクションが既に持っている
  // 全件キャッシュ（state.allInventoryItems / state.allOrders）をクライアント側で
  // 絞り込む。
  function myPageKeyword_() {
    return $('myPageKeyword').value;
  }

  function matchesAnyField_(values, keyword) {
    if (!keyword) return true;
    var kw = keyword.trim().toLowerCase();
    if (!kw) return true;
    return values.some(function (v) { return String(v || '').toLowerCase().indexOf(kw) !== -1; });
  }

  function myPageVehicleMatchesKeyword_(v, keyword) {
    return matchesAnyField_([v.model, v.commission, v.holdCustomer], keyword);
  }

  function myPageOrderMatchesKeyword_(o, keyword) {
    return matchesAnyField_([o.model, o.commission, o.customer, o.leadNumber, o.salesLocation], keyword);
  }

  on('myPageKeyword','input', debounce(renderMyPageAll_, 200));

  /**
   * Hold中の車両は、在庫リストと同じ横一列テーブル表示（vehicleTableRowHtml_）を
   * 再利用する（現場からの要望「マイページも受注リストと同様に表示してほしい」）。
   * ボタン操作（openActionModal / openCancelHoldModal の各lookup）は
   * 在庫リストの検索・絞り込み条件に左右されない全件キャッシュ
   * （state.allInventoryItems）へもフォールバックするようfindVehicleByCommission側で
   * 対応済みのため、マイページの行から操作しても在庫リスト側の絞り込み状態に
   * 関わらず正しく動作する。
   */
  function renderMyPageHolds_() {
    if (!renderMyPageNoStaffState_()) return;
    var email = currentUserEmail_();
    var keyword = myPageKeyword_();
    var items = (state.allInventoryItems || []).filter(function (v) {
      if (v.holdStatus !== 'hold') return false;
      if (!emailsMatch_(v.holdStaffEmail, email)) return false;
      return myPageVehicleMatchesKeyword_(v, keyword);
    });
    $('myPageHoldCount').textContent = items.length;
    $('myPageHoldEmpty').classList.toggle('hidden', items.length > 0);
    var holdListEl = $('myPageHoldList');
    holdListEl.innerHTML = tableListHtml_('tbl--inventory', inventoryTableHeaderHtml_(), items, vehicleTableRowHtml_);
    wireTableHeaderScrollSync_(holdListEl);
  }

  /**
   * 受注した車両は、受注リストと同じ横一列テーブル表示（orderTableRowHtml_）を
   * 再利用する（現場からの要望「マイページも受注リストと同様に表示してほしい」）。
   */
  function renderMyPageOrders_() {
    if (!renderMyPageNoStaffState_()) return;
    var email = currentUserEmail_();
    var keyword = myPageKeyword_();
    var items = (state.allOrders || []).filter(function (o) {
      return emailsMatch_(o.staffEmail, email) && myPageOrderMatchesKeyword_(o, keyword);
    });
    $('myPageOrderCount').textContent = items.length;
    $('myPageOrderEmpty').classList.toggle('hidden', items.length > 0);
    var orderListEl = $('myPageOrderList');
    orderListEl.innerHTML = tableListHtml_('tbl--order', orderTableHeaderHtml_(), items, orderTableRowHtml_);
    wireTableHeaderScrollSync_(orderListEl);
  }

  /**
   * マイページ全体（Hold中の車両・受注した車両）をまとめて再描画する。
   * 自由検索キーワードの入力のたびに呼ぶ。
   */
  function renderMyPageAll_() {
    renderMyPageHolds_();
    renderMyPageOrders_();
  }

  on('myPageHoldList','click', handleInventoryListClick_);
  on('myPageOrderList','click', function (e) {
    var rowEl = e.target.closest('[data-ocn]');
    if (rowEl && !e.target.closest('button, input, label')) {
      openOrderDetailModal_(rowEl.dataset.ocn);
    }
  });

  // スプレッドシート自体のタイトル（Googleドライブ上のファイル名）の変更は、
  // 他の設定項目（保存ボタンでまとめて保存、Script Propertiesへの書き込み）とは
  // 別の専用ボタン・専用API（api_renameSpreadsheet）で即座に反映する
  // （Api.gs参照）。
  on('btnRenameSpreadsheet','click', function () {
    if (this.disabled) return;
    var btn = this;
    var errEl = $('settingsSpreadsheetTitleError');
    errEl.classList.add('hidden');
    var title = $('settingsSpreadsheetTitle').value.trim();
    var max = (state.bootstrap && state.bootstrap.spreadsheetTitleMax) || 100;
    if (!title) {
      errEl.textContent = 'スプレッドシートのタイトルを入力してください。';
      errEl.classList.remove('hidden');
      return;
    }
    if (title.length > max) {
      errEl.textContent = 'タイトルは最大' + max + '文字までです（現在' + title.length + '文字）';
      errEl.classList.remove('hidden');
      return;
    }
    setButtonBusy(btn, true, '変更中...');
    gasRun('api_renameSpreadsheet', title).then(function (savedTitle) {
      setButtonBusy(btn, false);
      state.bootstrap.spreadsheetTitle = savedTitle;
      $('settingsSpreadsheetTitle').value = savedTitle;
      showToast('スプレッドシートのタイトルを変更しました');
    }).catch(function (err) {
      setButtonBusy(btn, false);
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    });
  });

  on('btnSaveSettings','click', function () {
    if (this.disabled) return;
    var btn = this;
    var max = (state.bootstrap && state.bootstrap.staffListMax) || 30;
    var cleaned = state.staffList
      .map(function (s) {
        return {
          name: String((s && s.name) || '').trim(),
          email: String((s && s.email) || '').trim().toLowerCase(),
          location: String((s && s.location) || '').trim()
        };
      })
      .filter(function (s) { return s.name && s.email; });
    var seenEmails = {};
    var uniqueStaffList = cleaned.filter(function (s) {
      if (seenEmails[s.email]) return false;
      seenEmails[s.email] = true;
      return true;
    });

    $('settingsError').textContent = '';
    if (uniqueStaffList.length > max) {
      $('settingsError').textContent = '担当者マスタは最大' + max + '人までです（現在' + uniqueStaffList.length + '人）';
      return;
    }

    // メール通知先3項目も、担当者マスタと同様に空欄除去・大文字小文字を
    // 無視した重複除去・最大件数チェックをクライアント側でも行う（サーバー側の
    // normalizeMailList_と同じ規則。保存前にエラーメッセージで気づけるようにするため）。
    var maxMails = notifyMailListMax_();
    var mailFieldLabels = { notifyHoldMailTo: 'Hold時', notifyOrderMailTo: '受注確定時', notifyErrorMailTo: 'システムエラー通知先' };
    var cleanedMailLists = {};
    for (var mi = 0; mi < MAIL_FIELDS.length; mi++) {
      var mailKey = MAIL_FIELDS[mi].key;
      var seenMails = {};
      var uniqueMails = (state[mailKey] || [])
        .map(function (m) { return String(m || '').trim(); })
        .filter(function (m) { return m; })
        .filter(function (m) {
          var lower = m.toLowerCase();
          if (seenMails[lower]) return false;
          seenMails[lower] = true;
          return true;
        });
      if (uniqueMails.length > maxMails) {
        $('settingsError').textContent = 'メール通知先（' + mailFieldLabels[mailKey] + '）は最大' + maxMails + '件までです（現在' + uniqueMails.length + '件）';
        return;
      }
      cleanedMailLists[mailKey] = uniqueMails;
    }

    // Google ChatのWebhook URLも、サーバー側のvalidateChatWebhookUrl_（SettingsService.gs）
    // と同じ規則を保存前にクライアント側でもチェックし、往復せずにエラーへ気づけるようにする。
    var chatWebhookUrl = $('settingsChatWebhookUrl').value.trim();
    if (chatWebhookUrl && chatWebhookUrl.indexOf('https://') !== 0) {
      $('settingsError').textContent = 'Google ChatのWebhook URLは https:// から始まるURLを指定してください。';
      return;
    }

    // アプリタイトルも、サーバー側のvalidateAppTitle_（SettingsService.gs）と
    // 同じ規則を保存前にクライアント側でもチェックする。
    var appTitle = $('settingsAppTitle').value.trim();
    var maxAppTitle = (state.bootstrap && state.bootstrap.appTitleMax) || 40;
    if (appTitle.length > maxAppTitle) {
      $('settingsError').textContent = 'タイトルは最大' + maxAppTitle + '文字までです（現在' + appTitle.length + '文字）';
      return;
    }

    // ロゴ・ローディング画像も、サーバー側のvalidateLogoUrl_・validateLoadingImageUrl_
    // （SettingsService.gs）と同じ規則（変換後URLの最大文字数）を保存前にクライアント
    // 側でもチェックする。ドライブID・共有リンクを指定した場合、変換後は必ず短い
    // 固定形式のURLになるため、ここでの入力値（変換前）の文字数チェックで実質的に
    // 十分カバーできる（長すぎる外部URLを直接貼り付けた場合のみ引っかかる）。
    var logoUrlInput = $('settingsLogoUrl').value.trim();
    var maxLogoUrl = (state.bootstrap && state.bootstrap.logoUrlMax) || 1500;
    if (logoUrlInput.length > maxLogoUrl) {
      $('settingsError').textContent = 'ロゴ画像のURLが長すぎます（' + logoUrlInput.length + '文字）';
      return;
    }
    var loadingImageId = $('settingsLoadingImageId').value.trim();
    var maxLoadingImage = (state.bootstrap && state.bootstrap.loadingImageUrlMax) || 1500;
    if (loadingImageId.length > maxLoadingImage) {
      $('settingsError').textContent = 'ローディング画像のURLが長すぎます（' + loadingImageId.length + '文字）';
      return;
    }

    // ボディタイプの紐付けルールも、サーバー側のnormalizeModelBodyTypeRules_
    // （SettingsService.gs）と同じ規則（キーワード空欄の行を除去・
    // キーワード×ボディタイプの組で重複除去・最大件数チェック）を保存前に
    // クライアント側でも行う。
    var bodyTypeOptions = (state.bootstrap && state.bootstrap.modelBodyTypeOptions) || [];
    var seenRules = {};
    var uniqueBodyTypeRules = (state.modelBodyTypeRules || [])
      .map(function (r) { return { keyword: String((r && r.keyword) || '').trim(), bodyType: String((r && r.bodyType) || '').trim() }; })
      .filter(function (r) { return r.keyword && bodyTypeOptions.indexOf(r.bodyType) !== -1; })
      .filter(function (r) {
        var key = r.keyword.toLowerCase() + '\u0000' + r.bodyType;
        if (seenRules[key]) return false;
        seenRules[key] = true;
        return true;
      });
    var maxBodyTypeRules = modelBodyTypeRulesMax_();
    if (uniqueBodyTypeRules.length > maxBodyTypeRules) {
      $('settingsError').textContent = 'ボディタイプの紐付けは最大' + maxBodyTypeRules + '件までです（現在' + uniqueBodyTypeRules.length + '件）';
      return;
    }

    // 車両画像も、サーバー側のnormalizeModelPhotos_（SettingsService.gs）と同じ
    // 規則（モデル名・写真URLがともに入力されている行のみ残す・モデル名で重複
    // 除去・最大件数チェック）を保存前にクライアント側でも行う。gradePrefix・
    // gradeMarkerの文字数上限は往復してもエラーが分かりやすいため、サーバー側の
    // チェックにまかせる。
    var seenPhotoModels = {};
    var uniqueModelPhotos = (state.modelPhotos || [])
      .map(function (p) {
        return {
          model: String((p && p.model) || '').trim(),
          photoUrl: String((p && p.photoUrl) || '').trim(),
          gradePrefix: String((p && p.gradePrefix) || '').trim(),
          gradeMarker: String((p && p.gradeMarker) || '').trim(),
          bodyType: String((p && p.bodyType) || '').trim()
        };
      })
      .filter(function (p) { return p.model && p.photoUrl; })
      .filter(function (p) {
        if (seenPhotoModels[p.model]) return false;
        seenPhotoModels[p.model] = true;
        return true;
      });
    var maxModelPhotos = modelPhotosMax_();
    if (uniqueModelPhotos.length > maxModelPhotos) {
      $('settingsError').textContent = '車両画像は最大' + maxModelPhotos + '件までです（現在' + uniqueModelPhotos.length + '件）';
      return;
    }

    // お知らせも、サーバー側のvalidateHomeAnnouncement_（SettingsService.gs）と
    // 同じ規則（最大文字数）を保存前にクライアント側でもチェックする。
    var homeAnnouncement = $('settingsHomeAnnouncement').value.trim();
    var maxHomeAnnouncement = (state.bootstrap && state.bootstrap.homeAnnouncementMax) || 60;
    if (homeAnnouncement.length > maxHomeAnnouncement) {
      $('settingsError').textContent = 'お知らせは最大' + maxHomeAnnouncement + '文字までです（現在' + homeAnnouncement.length + '文字）';
      return;
    }

    var settings = {
      themeKey: state.themeKey || DEFAULT_THEME_KEY,
      appTitle: appTitle,
      logoUrl: logoUrlInput,
      loadingImageUrl: loadingImageId,
      notifyHoldMailTo: cleanedMailLists.notifyHoldMailTo,
      notifyOrderMailTo: cleanedMailLists.notifyOrderMailTo,
      notifyErrorMailTo: cleanedMailLists.notifyErrorMailTo,
      notifyChatWebhookUrl: chatWebhookUrl,
      staffList: uniqueStaffList,
      modelBodyTypeRules: uniqueBodyTypeRules,
      modelPhotos: uniqueModelPhotos,
      homeAnnouncement: homeAnnouncement,
      celebrationVariants: {
        hold: $('celebrationVariantHold').value,
        order: $('celebrationVariantOrder').value
      }
    };
    setButtonBusy(btn, true, '保存中...');
    gasRun('api_saveSettings', settings).then(function (saved) {
      state.bootstrap.settings = saved;
      // 担当者マスタが変わった可能性があるため、ログイン中のアカウントに対応する
      // 担当者名（currentStaffName）を再取得してトップバー表示等に反映する。
      return gasRun('api_getBootstrapData');
    }).then(function (bootstrap) {
      setButtonBusy(btn, false);
      state.bootstrap = bootstrap;
      renderSettings(bootstrap.settings);
      renderTopbarUser();
      renderHomeGallery_();
      showToast('設定を保存しました');
    }).catch(function (err) {
      setButtonBusy(btn, false);
      $('settingsError').textContent = err.message;
    });
  });

  // ===== ユーティリティ =====
  function debounce(fn, wait) {
    var timer = null;
    return function () {
      clearTimeout(timer);
      var args = arguments;
      timer = setTimeout(function () { fn.apply(null, args); }, wait);
    };
  }

  // ===== モーダルをソフトウェアキーボードの上に収める =====
  // 不具合修正: スマホでHold登録・受注確定モーダルの入力欄をタップすると、
  // ソフトウェアキーボードが開いた分だけ画面下側が隠れ、モーダル（特に画面
  // 下端に固定したボトムシート）の下側にある入力中の項目が見えなくなって
  // しまっていた。100vh・window.innerHeightはレイアウトビューポート基準の
  // ため、iOS Safari等ではキーボードが開いても値が変わらず、CSS側だけでは
  // キーボードの高さを考慮できない。window.visualViewport（対応ブラウザ）は
  // キーボード表示中の「実際に見えている」高さを返すため、レイアウト
  // ビューポートの高さ（window.innerHeight）との差＝キーボードの高さを
  // 都度測ってCSS変数（--app-keyboard-inset、Stylesheet.htmlの.modal参照）に
  // 反映し、モーダルの下方向パディングに足すことでキーボードの上に押し
  // 上げる。
  // 不具合修正（前回試した方式の反省）: 最初は.modal自身のtop・heightを
  // visualViewportの実測値に直接書き換える方式を試したが、iOS Safariでは
  // position: fixed要素の位置・高さをJSから動的に書き換えるとレイアウトが
  // 崩れて表示される不具合があった。.modal自体の位置・高さの計算方法は
  // 変えず、paddingの増減だけで対応することで、この崩れを避けている。
  function syncKeyboardInset_() {
    var vv = window.visualViewport;
    // キーボードが無い間は0（visualViewport非対応環境も常に0のまま＝
    // 従来どおりレイアウトビューポート基準の表示になる）。
    var inset = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
    document.documentElement.style.setProperty('--app-keyboard-inset', inset + 'px');
  }
  if (window.visualViewport) {
    syncKeyboardInset_();
    // resizeはキーボードの開閉・端末回転で、scrollはキーボード表示中に
    // ページがわずかにスクロールされた場合（visualViewportのoffsetTopが
    // 変化する）で、それぞれ発火する。
    window.visualViewport.addEventListener('resize', syncKeyboardInset_);
    window.visualViewport.addEventListener('scroll', syncKeyboardInset_);
  }

  // モーダルの高さ自体をキーボードの上に収めても、.modal__body内部の
  // スクロール位置までは追従しないことがあるため、モーダル内の入力欄に
  // フォーカスが移ったら、キーボードの開閉アニメーションが落ち着く頃合いを
  // 見て明示的にscrollIntoViewする（保険。visualViewport非対応環境でも
  // 効果がある）。
  document.addEventListener('focusin', function (e) {
    var target = e.target;
    if (!/^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName)) return;
    var modal = target.closest('.modal:not(.hidden)');
    if (!modal) return;
    setTimeout(function () {
      target.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 300);
  });

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ===== 初期化・更新 =====
  // 起動時の読み込みと、「更新」ボタン（btnRefresh）による再読み込みの両方から呼ぶ
  // 共通処理。設定・担当者判定・整合性チェック・在庫/受注/ホームの一覧をすべて
  // サーバーから最新の状態に取り直す。
  /**
   * bootstrap取得後の各初期化ステップを、1つずつ独立してtry/catchする。
   * これらは互いに無関係な画面（設定タブ・トップバー・整合性チェック）の描画のため、
   * 例えば設定タブの描画だけが何か（要素の食い違い等）で失敗しても、それが原因で
   * 在庫リスト・受注リスト・ホーム画面の読み込み（最後のPromise.all）まで
   * 巻き込んで止まってしまう、という事態を避ける（1箇所の不具合がアプリ全体を
   * 道連れにしないようにするための防御的な実装）。失敗した処理はコンソールに
   * エラーを出すだけに留め、他の処理は影響を受けず続行する。
   */
  function runInitStep_(label, fn) {
    try {
      fn();
    } catch (e) {
      console.error('[used-vehicle-order-app] ' + label + ' の処理でエラーが発生しました:', e);
    }
  }

  /**
   * bootstrap（設定・担当者判定・ログインアカウント情報）の取得・反映と、
   * 在庫リスト・受注リスト・ホーム画面・マイページのデータ取得は、互いに独立した
   * 別々のサーバー呼び出しであり、本来どちらかがどちらかを待つ理由が無い。
   * 以前はbootstrap取得が完了する（.then内で）まで在庫等の読み込みを一切
   * 開始しない直列構造になっており、bootstrap側（api_getBootstrapData自体の
   * 失敗・タイムアウト等）が何か1つでも失敗すると、在庫・受注・
   * マイページ・ログインアカウント表示のすべてが道連れで真っ白になっていた。
   * 両者を最初から並行して走らせることで、片方が失敗してももう片方は
   * 影響を受けず表示できるようにする。
   */
  function reloadAll_() {
    var bootstrapPromise = gasRun('api_getBootstrapData').then(function (bootstrap) {
      state.bootstrap = bootstrap;
      runInitStep_('契約条件の選択肢の初期化', function () {
        fillOptions($('actionTradeIn'), bootstrap.yesNoOptions, true);
        fillOptions($('actionOss'), bootstrap.ossOptions, true);
        fillOptions($('actionInsurance'), bootstrap.yesNoOptions, true);
        fillOptions($('actionPaymentMethod'), bootstrap.paymentMethodOptions, true);
      });
      runInitStep_('設定タブの描画', function () { renderSettings(bootstrap.settings); });
      runInitStep_('ユーザー情報の描画', renderTopbarUser);
      runInitStep_('ホーム画面の描画', renderHomeGallery_);
      runInitStep_('在庫データの整合性チェック', checkIntegrity_);
    }).catch(function (err) {
      console.error('[used-vehicle-order-app] 起動時データ（設定・ログインアカウント情報）の取得に失敗しました:', err);
      showToast('起動時データの取得に失敗しました: ' + err.message, true);
    });
    return Promise.all([
      bootstrapPromise, loadInventory(), loadOrders(), loadWholesaleOrders(),
      loadAllInventoryItems_(), loadMyPageOrders_(), loadDemoCarList(), loadServiceCarList(),
      loadHomeVehiclePool_()
    ]);
  }

  function init() {
    syncNavButtons_();
    initScrollFade_('topbarTabs');
    initScrollElevation_();
    reloadAll_().catch(function (err) { showToast(err.message, true); }).then(function () {
      // 起動時ローディング画面は初回の読み込み完了時のみフェードアウトする
      // （更新ボタンからの再読み込みは、ボタン自体の回転アイコンで十分なため
      // 全画面オーバーレイは出さない）。
      var loading = $('appLoading');
      if (loading) loading.classList.add('is-hidden');
    });
  }

  // PWA対応：Service Workerを登録する（未対応ブラウザでは何もしない）。
  // オフラインキャッシュは行わず、「ホーム画面に追加」の条件を満たすためだけの
  // 最小限の登録（PwaService.gs参照）。Googleサイトへの埋め込み表示など、
  // このページがiframe内にある場合はホーム画面への追加自体が機能しないため、
  // 登録に失敗しても静かに無視する。
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('?resource=sw').catch(function () { /* 埋め込み表示等では失敗し得るため無視する */ });
  }

  try {
    init();
  } catch (e) {
    console.error('[used-vehicle-order-app] 初期化中にエラーが発生しました:', e);
    var loadingEl = document.getElementById('appLoading');
    if (loadingEl) loadingEl.classList.add('is-hidden');
  }
})();
</script>
