  }

  function randomCelebColor_() {
    return CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
  }

  /**
   * 画面下（rise）または画面上（fall）から、指定した図形をランダムな横位置・
   * ランダムな揺れ・回転で漂わせる（Hold登録の火花の余韻の
   * エンジン）。
   */
  function spawnParticleWave_(shapes, direction, count) {
    var layer = $('celebrationLayer');
    var pieces = [];
    for (var i = 0; i < count; i++) {
      var shape = shapes[Math.floor(Math.random() * shapes.length)];
      var el = document.createElement('span');
      el.className = 'celebParticle celebParticle--' + shape + ' celebParticle--' + direction;
      el.style.left = (Math.random() * 94 + 2) + 'vw';
      var size = 14 + Math.random() * 16;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.background = randomCelebColor_();
      el.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
      el.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
      el.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
      el.style.animationDelay = (Math.random() * .7) + 's';
      layer.appendChild(el);
      pieces.push(el);
    }
    setTimeout(function () { pieces.forEach(function (el) { el.remove(); }); }, 5200);
  }

  /**
   * 指定した位置（省略時は画面中央）から放射状に飛び散らせる（Hold登録の
   * 打ち上げバースト・受注確定のランダムバースト演出用）。
   * @param {number} [originLeftVw] バーストの中心位置（横、vw）。省略時はCSS既定の50%（画面中央）。
   * @param {number} [originTopVh] バーストの中心位置（縦、vh）。省略時はCSS既定の50%（画面中央）。
   */
  function spawnParticleBurst_(shapes, count, originLeftVw, originTopVh) {
    var layer = $('celebrationLayer');
    var pieces = [];
    for (var i = 0; i < count; i++) {
      var shape = shapes[Math.floor(Math.random() * shapes.length)];
      var el = document.createElement('span');
      el.className = 'celebParticle celebParticle--' + shape + ' celebParticle--burst';
      if (originLeftVw !== undefined) el.style.left = originLeftVw + 'vw';
      if (originTopVh !== undefined) el.style.top = originTopVh + 'vh';
      var angle = (i / count) * Math.PI * 2 + Math.random() * .4;
      var dist = 140 + Math.random() * 160;
      el.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
      el.style.setProperty('--ty', (Math.sin(angle) * dist) + 'px');
      var size = 14 + Math.random() * 14;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.background = randomCelebColor_();
      el.style.animationDelay = (Math.random() * .25) + 's';
      layer.appendChild(el);
      pieces.push(el);
    }
    setTimeout(function () { pieces.forEach(function (el) { el.remove(); }); }, 2200);
  }

  var CONFETTI_COLORS = ['#1a73e8', '#34a853', '#fbbc05', '#ea4335', '#a142f4', '#00bcd4'];

  /**
   * @param {number} minVw 出現位置の左端（vw）
   * @param {number} maxVw 出現位置の右端（vw）
   */
  function spawnConfettiBatch_(layer, pieces, count, minVw, maxVw) {
    for (var i = 0; i < count; i++) {
      var el = document.createElement('div');
      el.className = 'confettiPiece';
      el.style.left = (minVw + Math.random() * (maxVw - minVw)) + 'vw';
      el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      // 一部を細長い「リボン状」にすることで、丸・角の紙吹雪だけの単調さを避ける。
      var isStreamer = Math.random() < .2;
      el.style.width = (isStreamer ? 4 + Math.random() * 3 : 6 + Math.random() * 9) + 'px';
      el.style.height = (isStreamer ? 22 + Math.random() * 14 : 10 + Math.random() * 10) + 'px';
      el.style.borderRadius = isStreamer ? '2px' : (Math.random() < .5 ? '50%' : '2px');
      // 真下に一直線に落ちるだけだと単調なので、横方向の揺れ（--drift）と
      // 複数回転（--rot）をランダムに与え、ひらひら舞い散る動きにする。
      el.style.setProperty('--drift', (Math.random() * 220 - 110) + 'px');
      el.style.setProperty('--rot', (540 + Math.random() * 900) + 'deg');
      el.style.animationDuration = (2.6 + Math.random() * 2.4) + 's';
      el.style.animationDelay = (Math.random() * .6) + 's';
      layer.appendChild(el);
      pieces.push(el);
    }
  }

  /**
   * 受注確定の紙吹雪。画面を左右2つの半分に分け、それぞれから4波に分けて
   * 降らせることで、端だけでなく画面いっぱいに紙吹雪が舞う見た目にする
   * （「受注確定はより紙吹雪を左右から画面いっぱいに」という要望に対応）。
   */
  function triggerWideConfetti_() {
    var layer = $('confettiLayer');
    layer.classList.add('is-flashing');
    var pieces = [];
    [[0, 50], [50, 100]].forEach(function (range) {
      spawnConfettiBatch_(layer, pieces, 140, range[0], range[1]);
      setTimeout(function () { spawnConfettiBatch_(layer, pieces, 120, range[0], range[1]); }, 220);
      setTimeout(function () { spawnConfettiBatch_(layer, pieces, 100, range[0], range[1]); }, 460);
      setTimeout(function () { spawnConfettiBatch_(layer, pieces, 70, range[0], range[1]); }, 720);
    });
    setTimeout(function () { layer.classList.remove('is-flashing'); }, 700);
    setTimeout(function () {
      pieces.forEach(function (el) { el.remove(); });
    }, 6400);
  }

  /**
   * 受注確定の演出。画面中央からの単発バーストではなく、画面内のランダムな
   * 位置・ランダムなタイミングで複数回（5〜7箇所）バーストを起こす
   * （現場からの要望）。位置は画面の上端・下端（ナビ・モーダル操作の邪魔に
   * なりやすい）を避け、上半分〜中央寄りに限定している。
   */
  function triggerRandomBursts_() {
    var shapes = ['star', 'circle', 'square', 'ribbon'];
    var burstCount = 5 + Math.floor(Math.random() * 3);
    for (var i = 0; i < burstCount; i++) {
      (function () {
        var x = 12 + Math.random() * 76;
        var y = 14 + Math.random() * 55;
        var delay = Math.random() * 900;
        setTimeout(function () {
          spawnParticleBurst_(shapes, 14 + Math.floor(Math.random() * 10), x, y);
        }, delay);
      })();
    }
  }

  function fillOptions(select, options, includeBlank) {
    if (!select) return;
    select.innerHTML = '';
    if (includeBlank) select.appendChild(new Option('', ''));
    (options || []).forEach(function (o) { select.appendChild(new Option(o, o)); });
  }

  function currentYearMonth() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  /**
   * コミッションの比較は必ずこの関数を通す（=== での直接比較は禁止）。
   * サーバー側から届く車両データの commission は、スプレッドシートのコミッション
   * セルがまだ「書式なしテキスト」になっていない場合、文字列ではなく数値（例: 2004）に
   * なっていることがある（holdMatchesCommission_ 参照。同じ問題のクライアント版）。
   * 一方、HTML要素の data-compare 等の属性値は常に文字列になるため、===で比較すると
   * 型が一致せず「一致しないはずなのに一致しない」不具合になる（比較機能で
   * 「この車両の情報が見つからない」と表示されてしまっていた不具合の原因）。
   * 必ず文字列化してから比較することで、型の違いに影響されないようにする。
   */
  function commissionEquals_(a, b) {
    return String(a) === String(b);
  }

  function formatDateTime(epochMs) {
    if (!epochMs) return '-';
    var d = new Date(epochMs);
    return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') +
      ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // ===== タブ切替 =====
  // コントロールパネル（.topbar）の水平タブ（.navBtn、data-tab属性）が唯一の
  // 画面切替ナビ。起動時はIndex.html側で「ホーム」に.is-activeを付けてある
  // （アプリ起動時はホーム画面から始める、という仕様）。
  function currentActiveTab_() {
    var el = document.querySelector('.navBtn.is-active');
    return el ? el.dataset.tab : 'home';
  }

  // 「戻る」ボタン用の画面履歴（タブ名のみのスタック）。メインタブのクリックなど、
  // switchToTab_を経由するすべての画面遷移で自動的に記録される。opts.skipHistoryは
  // 「戻る」ボタン自身がswitchToTab_を呼ぶ際に、戻った先をさらに履歴に積んでしまわない
  // ようにするためのフラグ。
  function switchToTab_(tabName, opts) {
    opts = opts || {};
    var current = currentActiveTab_();
    if (!opts.skipHistory && current && current !== tabName) {
      state.navHistory.push(current);
      syncNavButtons_();
    }
    document.querySelectorAll('.navBtn').forEach(function (t) { t.classList.toggle('is-active', t.dataset.tab === tabName); });
    document.querySelectorAll('main.view').forEach(function (v) { v.classList.remove('is-active'); });
    $('view-' + tabName).classList.add('is-active');
    // 全タブは同じ1つのdocument上でdisplay: none/blockを切り替えているだけの
    // ため、スクロール位置はタブをまたいで共有されてしまう（例: 在庫リストで
    // スクロールした状態で他のタブへ移動すると、次のタブも同じスクロール
    // 位置のまま表示され、コマンドバー等が見えない状態で開いてしまう）。
    // タブ切替のたびに常に一番上から表示されるよう、ページ全体を先頭へ
    // スクロールする。
    window.scrollTo(0, 0);
  }

  // コントロールパネル（.topbar）の水平タブ。以前のホームがあった頃の
  // コントロールパネルと同じ、1本の水平ナビにまとめている（アイコンのみの
  // 左レール・下タブバーは廃止）。
  on('topbarTabs', 'click', function (e) {
    var btn = e.target.closest('[data-tab]');
    if (!btn) return;
    switchToTab_(btn.dataset.tab);
  });

  function syncNavButtons_() {
    var disabled = state.navHistory.length === 0;
    $('btnNavBack').disabled = disabled;
  }

  function handleNavBackClick_() {
    var prev = state.navHistory.pop();
    if (!prev) return;
    switchToTab_(prev, { skipHistory: true });
    syncNavButtons_();
  }
  on('btnNavBack','click', handleNavBackClick_);

  function handleRefreshClick_() {
    var btns = [$('btnRefresh')];
    btns.forEach(function (b) { b.disabled = true; b.classList.add('is-spinning'); });
    reloadAll_().then(function () {
      showToast('最新の情報に更新しました');
    }).catch(function (err) {
      showToast(err.message, true);
    }).then(function () {
      btns.forEach(function (b) { b.disabled = false; b.classList.remove('is-spinning'); });
    });
  }
  on('btnRefresh','click', handleRefreshClick_);

  // ===== モーダル共通 =====
  document.querySelectorAll('[data-close-modal]').forEach(function (btn) {
    btn.addEventListener('click', function () { closeModal(btn.closest('.modal')); });
  });
  document.querySelectorAll('.modal').forEach(function (modal) {
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(modal); });
  });
  // モーダル表示中は背景（在庫リスト・受注リスト等）がスクロールされないよう、
  // bodyのスクロールをロックする。複数のモーダルが続けて開閉される場合
  // （詳細モーダルを閉じてすぐHold登録モーダルを開く等）でも正しく機能するよう、
  // 開いているモーダルの数をカウントし、0件になったときだけロックを解除する。
  var openModalCount = 0;
  // モーダルを閉じる際、CSSのフェード＆縮小アニメーション（.is-closing、
  // Stylesheet.html参照）が最後まで再生されてからdisplay: noneにする（hiddenを
  // 付ける）ことで、消える瞬間も自然に見えるようにする。MODAL_CLOSE_ANIM_MSは
  // Stylesheet.htmlのmodalOverlayOut/modalPanelOutのdurationと合わせること。
  var MODAL_CLOSE_ANIM_MS = 160;
  function openModal(modal) {
    clearTimeout(modal._closeTimer);
    modal.classList.remove('is-closing');
    modal.classList.remove('hidden');
    openModalCount++;
    document.body.classList.add('modal-open');
  }
  function closeModal(modal) {
    if (modal.classList.contains('hidden')) return; // 既に閉じている
    modal.classList.add('is-closing');
    modal._closeTimer = setTimeout(function () {
      modal.classList.remove('is-closing');
      modal.classList.add('hidden');
    }, MODAL_CLOSE_ANIM_MS);
    openModalCount = Math.max(0, openModalCount - 1);
    if (openModalCount === 0) document.body.classList.remove('modal-open');
  }
  // Escapeキーで開いているモーダルを閉じる（×ボタン・背景クリックと同じ操作感を
  // キーボードでも提供する）。同時に複数開くことは無い想定だが、念のため開いている
  // ものをすべて閉じる。
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.modal:not(.hidden)').forEach(closeModal);
  });

  // ===== 在庫リスト =====
  // キーワード検索だけはこれまでどおりサーバー側（searchInventory）で絞り込む。
  // Hold中の車両を除外するかどうかは、以前は「Hold済みを含む」チェックボックス
  // だったが、区分・状態・掲載状況等と同じ絞り込みサイドバーにまとめたため、
  // includeHoldは常にtrueで取得し、状態（在庫あり／Hold中／業販HOLD中）の
  // 絞り込みはrenderInventory側でクライアントだけで行う（ROUND H フェーズ2）。
  function loadInventory() {
    var filters = {
      keyword: $('inventoryKeyword').value,
      includeHold: true
    };
    return gasRun('api_listInventory', filters).then(function (groups) {
      var items = (groups && groups[0] && groups[0].items) || [];
      state.inventoryItems = items;
      renderInventoryFilterSidebar_();
      renderInventory();
    }).catch(function (err) { showToast(err.message, true); });
  }

  // ----- 絞り込みサイドバーの各項目（区分・状態・掲載状況・年式・価格帯・
  //       走行距離）を判定する純粋関数。既存のスプレッドシート列だけを使い、
  //       新規列は追加しない。 -----
  function inventoryStatusOf_(v) {
    if (v.holdStatus !== 'hold') return 'available';
    return (v.holdHoldType && v.holdHoldType !== 'normal') ? 'wholesale' : 'hold';
  }
  function inventoryListedKeys_(v) {
    var keys = [];
    if (v.listedCarsensor) keys.push('carsensor');
    if (v.listedGoonet) keys.push('goonet');
    if (!keys.length) keys.push('unlisted');
    return keys;
  }
  function inventoryYearOf_(v) {
    var m = String(v.firstRegistrationDate || '').match(/(\d{4})/);
    return m ? Number(m[1]) : null;
  }
  var YEAR_BUCKET_OPTIONS = [
    { value: '', label: '指定なし' },
    { value: 'recent', label: '2年以内' },
    { value: 'mid', label: '3〜5年' },
    { value: 'old', label: '6〜10年' },
    { value: 'veryOld', label: '10年超' }
  ];
  function yearBucketOf_(v) {
    var y = inventoryYearOf_(v);
    if (y === null) return '';
    var age = new Date().getFullYear() - y;
    if (age <= 2) return 'recent';
    if (age <= 5) return 'mid';
    if (age <= 10) return 'old';
    return 'veryOld';
  }
  var PRICE_BUCKET_OPTIONS = [
    { value: '', label: '指定なし' },
    { value: 'p1', label: '300万円以下' },
    { value: 'p2', label: '300〜500万円' },
    { value: 'p3', label: '500〜800万円' },
    { value: 'p4', label: '800万円以上' }
  ];
  function priceBucketOf_(v) {
    var p = Number(v.salePrice);
    if (!p) return '';
    if (p <= 3000000) return 'p1';
    if (p <= 5000000) return 'p2';
    if (p <= 8000000) return 'p3';
    return 'p4';
  }
  var MILEAGE_BUCKET_OPTIONS = [
    { value: '', label: '指定なし' },
    { value: 'm1', label: '1万km以下' },
    { value: 'm2', label: '1〜3万km' },
    { value: 'm3', label: '3〜5万km' },
    { value: 'm4', label: '5万km以上' }
  ];
  function mileageBucketOf_(v) {
    var m = Number(v.mileage);
    if (isNaN(m)) return '';
    if (m <= 10000) return 'm1';
    if (m <= 30000) return 'm2';
    if (m <= 50000) return 'm3';
    return 'm4';
  }
  var INVENTORY_SORT_OPTIONS = [
    { value: '', label: '指定なし' },
    { value: 'priceAsc', label: '価格が安い順' },
    { value: 'priceDesc', label: '価格が高い順' },
    { value: 'yearDesc', label: '年式が新しい順' },
    { value: 'yearAsc', label: '年式が古い順' },
    { value: 'mileageAsc', label: '走行距離が少ない順' }
  ];

  // モデル名（v.model）に含まれるキーワードから、設定タブ（管理者限定）で
  // 登録済みのボディタイプ紐付けルール（state.bootstrap.settings.
  // modelBodyTypeRules、大文字小文字を区別せず部分一致）に基づいて該当する
  // ボディタイプ（複数可）を返す（純粋関数）。ルール未登録・一致無しなら
  // 空配列。
  function modelBodyTypesOf_(model) {
    var m = String(model || '').toLowerCase();
    var rules = (state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.modelBodyTypeRules) || [];
    var types = [];
    rules.forEach(function (r) {
      if (r && r.keyword && m.indexOf(String(r.keyword).toLowerCase()) !== -1 && types.indexOf(r.bodyType) === -1) {
        types.push(r.bodyType);
      }
    });
    return types;
  }

  /**
   * 型番（在庫リストのMODEL列の値。例:「C200」「C43T」「CLA18」「GLC2DC」）の
   * 先頭にあるアルファベットの連続部分だけを取り出す（純粋関数）。Mercedes系の
   * 型番は「クラス名（アルファベット）＋グレード番号（数字）＋任意のサフィックス」
   * という構成のため、これでクラス名部分（「C」「CLA」「GLC」等）を正確に切り出せる。
   */
  function leadingAlphaPrefix_(modelValue) {
    var m = String(modelValue || '').match(/^[A-Za-z]+/);
    return m ? m[0] : '';
  }

  /**
   * 在庫リストの「MODEL」列の値に対する、指定の車両画像エントリの自動判定条件の
   * 「具体性スコア」を計算する（純粋関数）。条件を満たさない場合は-1（不一致）。
   * gradePrefixは、型番先頭のアルファベット連続部分（leadingAlphaPrefix_）と
   * 「完全一致」（大文字小文字は区別しない）した場合のみ一致とする（単純な前方一致
   * にすると、gradePrefix「C」が「CLA18」まで拾ってしまい「C20」と「CLA18」を
   * 区別できなくなるため）。gradeMarker（含む文字列）は、プレフィックスを除いた
   * 残りの部分に「その文字列がどこかに含まれていれば」一致とする（大文字小文字は
   * 区別しない）。スコアは、gradeMarkerを設定していれば大きく加点したうえで
   * gradeMarkerの文字数も加える（gradeMarker設定済みのエントリを、同じgradePrefixを
   * 持つ未設定のエントリより優先し、gradeMarker同士では、より長い＝具体的な文字列を
   * 持つ方を優先する）。
   */
  function gradeRuleSpecificity_(modelValue, entry) {
    if (!entry.gradePrefix || !modelValue) return -1;
    if (leadingAlphaPrefix_(modelValue).toLowerCase() !== entry.gradePrefix.toLowerCase()) return -1;
    if (entry.gradeMarker) {
      var remainder = modelValue.slice(entry.gradePrefix.length);
      if (remainder.toLowerCase().indexOf(entry.gradeMarker.toLowerCase()) === -1) return -1;
      return 10000 + entry.gradePrefix.length + entry.gradeMarker.length;
    }
    return entry.gradePrefix.length;
  }

  /**
   * 在庫リストの「MODEL」列の値が、指定の車両画像エントリの自動判定条件に一致
   * するかどうかを判定する（純粋関数）。同じ値に複数のエントリの条件が一致しうる
   * 場合（例:「C18T」はgradePrefix「C」（gradeMarker無し・受け皿）の行にも、
   * gradePrefix「C」+gradeMarker「T」の行にも一致する）、gradeRuleSpecificity_で
   * 最もスコアの高い（＝最も具体的な条件の）エントリだけがその値を拾い、他の
   * エントリには重複してカウントされないようにする。
   */
  function matchesGradeRule_(modelValue, entry, allEntries) {
    var score = gradeRuleSpecificity_(modelValue, entry);
    if (score < 0) return false;
    var isMostSpecific = !(allEntries || []).some(function (other) {
      return other !== entry && gradeRuleSpecificity_(modelValue, other) > score;
    });
    return isMostSpecific;
  }

  /**
   * 車両画像1件分の在庫台数を集計する（純粋関数）。gradePrefixが設定されている
   * 場合は、在庫リストに実際にある型番のうちmatchesGradeRule_に一致するものを
   * 自動的に拾い集めて数える。gradePrefixが未設定の場合は、モデル表示名そのものを
   * 在庫リストのMODEL列と直接照合する（グレードの概念を使わない単一モデル向けの
   * フォールバック）。
   */
  function modelCountForEntry_(entry, allItems, allModelPhotos) {
    if (!entry.gradePrefix) {
      return allItems.filter(function (v) { return v.model === entry.model; }).length;
    }
    return allItems.filter(function (v) { return matchesGradeRule_(v.model, entry, allModelPhotos); }).length;
  }

  /**
   * 車両画像1件分の自動判定条件に一致する、在庫リストに実際にある型番の一覧を
   * 重複なく返す（純粋関数）。ホームのカード内のグレードチップ・クリック時の
   * 在庫リストへの絞り込みに使う。
   */
  function matchedModelsForEntry_(entry, allItems, allModelPhotos) {
    if (!entry.gradePrefix) return [entry.model];
    var seen = {};
    var result = [];
    allItems.forEach(function (v) {
      if (!matchesGradeRule_(v.model, entry, allModelPhotos)) return;
      if (seen[v.model]) return;
      seen[v.model] = true;
      result.push(v.model);
    });
    return result;
  }

  /**
   * 在庫リストのMODEL列にある値のうち、どの車両画像エントリの自動判定条件にも
   * 一致しないもの（＝代表写真がまだ登録されていないモデル）を、写真無しの
   * プレースホルダーエントリとして返す（純粋関数）。販売モデルの数が限られて
   * いるという運用前提（現場からの要望）のもと、写真の用意が追いついていない
   * モデルもホームから漏れなく見えるようにする。gradePrefixは持たせず、在庫
   * リストのMODEL値そのものをモデル名として直接照合する単一モデル扱いにする
   * （元の型番をそのまま表示名にする以上、意味のあるグレード分類はできないため）。
   */
  function unphotographedModelEntries_(allItems, allModelPhotos) {
    var seen = {};
    var result = [];
    allItems.forEach(function (v) {
      var model = v.model;
      if (!model || seen[model]) return;
      seen[model] = true;
      var covered = allModelPhotos.some(function (entry) {
        return entry.gradePrefix
          ? matchesGradeRule_(model, entry, allModelPhotos)
          : entry.model === model;
      });
      if (covered) return;
      result.push({ model: model, photoUrl: '', gradePrefix: '', gradeMarker: '', bodyType: '' });
    });
    return result;
  }

  /**
   * ホーム画面の在庫台数表示（純粋関数）。0台の場合は数字の「在庫0台」ではなく
   * 「在庫がありません」という文言にし、在庫が無いことをひと目でわかるようにする。
   */
  function homeStockCountText_(total) {
    return total === 0 ? '在庫がありません' : '在庫' + total + '台';
  }

  function applyInventoryFilters_(items) {
    var f = state.inventoryFilters;
    var bodyType = state.inventoryBodyTypeFilter;
    return items.filter(function (v) {
      if (f.category.length && f.category.indexOf(v.category || '') === -1) return false;
      if (f.listed.length) {
        var keys = inventoryListedKeys_(v);
        if (!keys.some(function (k) { return f.listed.indexOf(k) !== -1; })) return false;
      }
      if (bodyType && modelBodyTypesOf_(v.model).indexOf(bodyType) === -1) return false;
      if (f.color && (v.exteriorColor || '') !== f.color) return false;
      if (f.yearBucket && yearBucketOf_(v) !== f.yearBucket) return false;
      if (f.priceBucket && priceBucketOf_(v) !== f.priceBucket) return false;
      if (f.mileageBucket && mileageBucketOf_(v) !== f.mileageBucket) return false;
      return true;
    });
  }

  function sortInventoryItems_(items) {
    var key = state.inventorySort;
    if (!key) return items;
    function priceOf(v) { var n = Number(v.salePrice); return isNaN(n) ? null : n; }
    function mileageOf(v) { var n = Number(v.mileage); return isNaN(n) ? null : n; }
    function cmp(a, b, dir) {
      if (a === null && b === null) return 0;
      if (a === null) return 1;
      if (b === null) return -1;
      return dir === 'asc' ? a - b : b - a;
    }
    var sorted = items.slice();
    sorted.sort(function (x, y) {
      switch (key) {
        case 'priceAsc': return cmp(priceOf(x), priceOf(y), 'asc');
        case 'priceDesc': return cmp(priceOf(x), priceOf(y), 'desc');
        case 'yearDesc': return cmp(inventoryYearOf_(x), inventoryYearOf_(y), 'desc');
        case 'yearAsc': return cmp(inventoryYearOf_(x), inventoryYearOf_(y), 'asc');
        case 'mileageAsc': return cmp(mileageOf(x), mileageOf(y), 'asc');
        default: return 0;
      }
    });
    return sorted;
  }

  /**
   * 絞り込みサイドバーのうち、実データから動的に選択肢を作る「区分」（チェック
   * ボックス・件数付き）を、在庫リスト取得のたびに作り直す。掲載状況・年式・
   * 価格帯・走行距離は固定の選択肢のためIndex.html側に直接書いており、ここでは
   * 触らない。モデル・ボディタイプの絞り込みはサイドバーから廃止した
   * （モデルは上の自由検索、ボディタイプは.commandbarのクイックナビへ移動。
   * 現場からの要望「サイドの絞り込みをシンプルにしてほしい」）。
   */
  function renderInventoryFilterSidebar_() {
    var items = state.inventoryItems || [];

    var categoryCounts = {};
    items.forEach(function (v) {
      var c = v.category || '未設定';
      categoryCounts[c] = (categoryCounts[c] || 0) + 1;
    });
    var categories = Object.keys(categoryCounts).sort();
    var checkedCategories = state.inventoryFilters.category;
    $('inventoryCategoryFilter').innerHTML = categories.map(function (c) {
      var checked = checkedCategories.indexOf(c) !== -1;
      return '<label class="filterCheck"><input type="checkbox" value="' + escapeHtml(c) + '"' + (checked ? ' checked' : '') + '> ' +
        escapeHtml(c) + '<span class="filterCheck__cnt">' + categoryCounts[c] + '</span></label>';
    }).join('');

    var colors = [];
    items.forEach(function (v) { if (v.exteriorColor && colors.indexOf(v.exteriorColor) === -1) colors.push(v.exteriorColor); });
    colors.sort();
    var colorSelect = $('inventoryColorFilter');
    var currentColor = state.inventoryFilters.color;
    colorSelect.innerHTML = '<option value="">指定なし</option>' + colors.map(function (c) {
      return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>';
    }).join('');
    colorSelect.value = colors.indexOf(currentColor) !== -1 ? currentColor : '';
    if (colorSelect.value !== currentColor) state.inventoryFilters.color = colorSelect.value;

    syncInventoryFilterClearVisibility_();
  }

  // 「クリア」リンクの表示・非表示を、現在の絞り込み状態に合わせて更新する
  // （何か1つでも絞り込みが効いていれば表示する）。
  function syncInventoryFilterClearVisibility_() {
    var f = state.inventoryFilters;
    var hasAny = !!state.inventoryBodyTypeFilter || !!f.color || f.category.length > 0 ||
      f.listed.length > 0 || !!f.yearBucket || !!f.priceBucket || !!f.mileageBucket;
    $('btnInventoryFilterClear').classList.toggle('hidden', !hasAny);
  }

  function fillStaticSelectOptions_(id, options, current) {
    var select = $(id);
    select.innerHTML = options.map(function (o) {
      return '<option value="' + escapeHtml(o.value) + '">' + escapeHtml(o.label) + '</option>';
    }).join('');
    select.value = current || '';
  }
  fillStaticSelectOptions_('inventoryYearFilter', YEAR_BUCKET_OPTIONS, state.inventoryFilters.yearBucket);
  fillStaticSelectOptions_('inventoryPriceFilter', PRICE_BUCKET_OPTIONS, state.inventoryFilters.priceBucket);
  fillStaticSelectOptions_('inventoryMileageFilter', MILEAGE_BUCKET_OPTIONS, state.inventoryFilters.mileageBucket);
  fillStaticSelectOptions_('inventorySort', INVENTORY_SORT_OPTIONS, state.inventorySort);

  // dd（値）はカード・詳細モーダルどちらでも折り返さず省略記号にする方針
  // （.card__metaGrid dd、Stylesheet.html参照。折り返すとカードごとに高さが
  // ばらつくため）。旧使用拠点・現展示拠点・オプション等、現場の入力次第で
  // 長くなり得る項目は省略記号で見えなくなった部分が確認できないままになって
  // しまうため、title属性でホバー時に全文を確認できるようにしておく。
  function metaRow_(label, value) {
    var text = value || '-';
    return '<div><dt>' + label + '</dt><dd title="' + escapeHtml(text) + '">' + escapeHtml(text) + '</dd></div>';
  }

  // metaRow_と異なり省略記号にせず、値を折り返してでも全文表示する
  // （在庫リストの詳細モーダルの外装色・内装色専用、Stylesheet.htmlの
  // .card__metaGrid dd.is-fullText参照。現場からの要望「在庫リストポップアップ
  // 表示時のみカラーを全て表示してほしい」）。
  function metaRowFull_(label, value) {
    var text = value || '-';
    return '<div><dt>' + label + '</dt><dd class="is-fullText" title="' + escapeHtml(text) + '">' + escapeHtml(text) + '</dd></div>';
  }

  /**
   * オプション・備考のような自由記述の長文項目専用のブロック（在庫リストの
   * 詳細モーダル・vehicleDetailHtml_専用）。不具合修正: 以前はこれらの項目を
   * ボタン表示にし、押した先の別ポップアップ（textInfoModal、廃止）で全文を
   * 確認する形だったが、詳細モーダル自体をPC幅で横長・3カラムに広げたことで
   * 十分な表示スペースが確保できるようになったため、ボタン＋別ポップアップを
   * やめてこの場で直接全文を表示する（現場からの要望「オプションや備考も
   * ボタンではなく、その場で綺麗に見えるようにしてほしい」）。折り返して
   * 全文表示する（.card__noteBlock__body、Stylesheet.html参照）。 */
  function noteBlockHtml_(label, text, emptyMessage) {
    return '<div class="card__noteBlock">' +
      '<p class="card__noteBlock__label">' + escapeHtml(label) + '</p>' +
      '<p class="card__noteBlock__body">' + escapeHtml(text || emptyMessage) + '</p>' +
      '</div>';
  }

  // ===== Hold種別（通常／業販HOLD）表示ヘルパー =====
  // 管理者権限を持つ担当者のみ登録できる業販HOLDは、通常のHoldとは
  // 見分けがつくよう、バッジ・カード左罫線・Hold詳細ブロックすべてに専用の特別色
  // （badge--holdSpecial 等）を使う（HoldService.gsのHOLD_TYPE参照）。
  var HOLD_TYPE_LABELS_FALLBACK_ = { normal: '通常のHOLD', wholesale: '業販HOLD' };
  function holdTypeLabel_(holdType) {
    var map = (state.bootstrap && state.bootstrap.holdTypeLabels) || HOLD_TYPE_LABELS_FALLBACK_;
    return map[holdType] || holdType;
  }

  // 中古車サイトへの掲載状況（カーセンサー／グーネットの2つのチェックボックス、
  // Constants.gsのVEHICLE_COLUMNS参照）から、未掲載／片方のみ掲載／両方掲載の
  // 3状態を判定する。
  function listedSiteCount_(v) {
    return (v.listedCarsensor ? 1 : 0) + (v.listedGoonet ? 1 : 0);
  }
  function isVehicleListed_(v) {
    return listedSiteCount_(v) > 0;
  }
  // 在庫リストの掲載欄（badge__badges内の掲載バッジ）に表示するテキスト。
  // 「片方のみ掲載」「両方掲載」ではどのサイトかが分からず現場が困るため、
  // 掲載中のサイト名をそのまま表示する（現場からの要望）。
  function listedStatusText_(v) {
    var sites = [];
    if (v.listedGoonet) sites.push('グーネット');
    if (v.listedCarsensor) sites.push('カーセンサー');
    return sites.length ? sites.join('・') + '掲載' : '未掲載';
  }
  function listedBadgeHtml_(v) {
    var count = listedSiteCount_(v);
    if (count === 0) return '';
    return '<span class="badge badge--listed"><span class="badge__dot"></span>' + escapeHtml(listedStatusText_(v)) + '</span>';
  }

  function vehicleCardTone_(v) {
    var isHold = v.holdStatus === 'hold';
    var isSpecialHold = isHold && !!(v.holdHoldType && v.holdHoldType !== 'normal');
    var tone = isSpecialHold ? 'card--holdSpecial' : (isHold ? 'card--hold' : 'card--available');
    return isVehicleListed_(v) ? tone + ' is-listed' : tone;
  }

  /**
   * includeListed=falseで掲載バッジ（listedBadgeHtml_）を省く。一覧行
   * （vehicleRowItemHtml_）では、状態バッジに加えてHold要約（顧客名・タイマー）も
   * 同じ見出し行の1行に収める必要があり、掲載バッジまで含めると車両（バッジの
   * 有無・文字数）によって行がはみ出したり折り返したりして、車両ごとに
   * カードサイズが揃わなくなってしまう（現場からの要望「Hold中もカードサイズが
   * 変わらないようにしてほしい」）。掲載状況は詳細モーダルで確認できるため、
   * 一覧行では省く。詳細モーダル（vehicleTopHtml_）では引き続き表示する
   * （呼び出し側で引数を省略、デフォルトtrue）。
   */
  function vehicleBadgesHtml_(v, includeListed) {
    var isHold = v.holdStatus === 'hold';
    var isSpecialHold = isHold && !!(v.holdHoldType && v.holdHoldType !== 'normal');
    var statusBadge;
    if (isSpecialHold) {
      statusBadge = '<span class="badge badge--holdSpecial"><span class="badge__dot"></span>' +
        escapeHtml(holdTypeLabel_(v.holdHoldType)) + '中</span>';
    } else if (isHold) {
      statusBadge = '<span class="badge badge--hold"><span class="badge__dot"></span>Hold中</span>';
    } else {
      statusBadge = '<span class="badge badge--available"><span class="badge__dot"></span>在庫あり</span>';
    }
    return statusBadge + (includeListed === false ? '' : listedBadgeHtml_(v));
  }

  /**
   * カード上部（【上枠】車種・ＯＣＮの行＋ステータスバッジの行）。2行に分けて
   * 固定することで、バッジの個数やモデル名・ＯＣＮの文字数によって折り返し方が
   * 変わり、カードごとに高さがバラつく問題を避ける（以前は1つのflex-wrapコンテナに
   * 全部まとめていたため、組み合わせによって1行に収まったり2行・3行になったりし、
   * カードの高さが揃わなかった）。
   */
  function vehicleTopHtml_(v) {
    return '<div class="card__top">' +
      '<div class="card__topRow">' +
      '<div><div class="card__model">' + escapeHtml(v.model) + '</div>' +
      '<div class="card__commission">ＯＣＮ ' + escapeHtml(v.ocn || '-') + '</div></div>' +
      '</div>' +
      '<div class="card__badges">' + vehicleBadgesHtml_(v) + '</div>' +
      '</div>';
  }

  function formatNumberUnit_(value, unit) {
    if (value === null || value === undefined || value === '') return '';
    var n = Number(value);
    return (isNaN(n) ? String(value) : n.toLocaleString()) + unit;
  }

  // 登録番号（ナンバープレート）は地域／分類番号／ひらがな／一連指定番号の4列に
  // 分けて管理しているが、表示上は「岐阜 303 た 1247」のように1行にまとめる。
  function plateText_(v) {
    var parts = [v.plateRegion, v.plateClass, v.plateKana, v.plateNumber].filter(function (p) { return p; });
    return parts.length ? parts.join(' ') : '';
  }

  // 【下枠】区分・カラー・販売価格・年式・走行距離・登録番号は折りたたまず常に
  // 表示する（2nd Hold廃止で空いたスペースを使い、詳細を見なくても年式・走行距離・
  // 登録番号が分かるようにしてほしいという現場からの要望）。
  // カラー（外装色・内装色）は、一覧のカード表示ではこれまでどおり「外装色 / 内装色」の
  // 1行・省略記号にしてカードの高さを揃えるが、詳細モーダル（vehicleDetailHtml_、
  // fullColors=true）では長い色名でも見切れないよう、外装色・内装色を別々の行
  // （上段が外装色・下段が内装色）にして全文表示する（現場からの要望「在庫リスト
  // ポップアップ表示時のみカラーを全て表示してほしい」）。
  function vehicleQuickMetaHtml_(v, fullColors) {
    var colorRowsHtml = fullColors
      ? metaRowFull_('外装色', v.exteriorColor) + metaRowFull_('内装色', v.interiorColor)
      : metaRow_('カラー', (v.exteriorColor || '-') + ' / ' + (v.interiorColor || '-'));
    return '<dl class="card__metaGrid card__metaGrid--quick">' +
      metaRow_('区分', v.category) +
      colorRowsHtml +
      metaRow_('販売価格', formatNumberUnit_(v.salePrice, ' 円')) +
      metaRow_('年式', v.firstRegistrationDate) +
      metaRow_('走行距離', formatNumberUnit_(v.mileage, ' km')) +
      metaRow_('登録番号', plateText_(v)) +
      '</dl>';
  }

  function vehicleSpecFieldsHtml_(v) {
    // ＯＣＮ・年式・走行距離・登録番号は【上枠】【下枠】（vehicleTopHtml_・
    // vehicleQuickMetaHtml_）で常に表示済みのため、ここでは重複させない。
    // オプションは複数の装備をまとめて自由記述するため長くなりがちで、他の項目と
    // 同じ省略記号（ellipsis）表示だと全文を確認しづらい（現場からの要望）。
    // 以前はボタンを押した先の別ポップアップで全文を確認する形だったが、
    // noteBlockHtml_（上記）に統一し、このグリッドの下にそのまま全文表示する。
    return '<dl class="card__metaGrid">' +
      metaRow_('ステア', v.steering) +
      metaRow_('型式', v.modelCode) +
      metaRow_('車台番号下４桁', v.chassisNumberLast4) +
      metaRow_('車検満了日', v.inspectionExpiryDate) +
      metaRow_('ﾘｻｲｸﾙ料', formatNumberUnit_(v.recycleFee, ' 円')) +
      metaRow_('旧使用拠点', v.previousLocation) +
      metaRow_('CCC入庫日', v.cccArrivalDate) +
      metaRow_('経過月', formatNumberUnit_(v.elapsedMonths, ' ヶ月')) +
      metaRow_('現展示拠点', v.currentDisplayLocation) +
      metaRow_('現名義', v.currentOwnerName) +
      '</dl>' +
      noteBlockHtml_('オプション', v.option, 'オプションの登録はありません。');
  }

  function vehicleActionsHtml_(v) {
    var isHold = v.holdStatus === 'hold';
    var html = '<div class="card__actions">';
    if (!isHold) {
      html += '<button class="btn" data-hold="' + escapeHtml(v.commission) + '">Hold</button>';
      html += '<button class="btn btn--primary" data-order="' + escapeHtml(v.commission) + '">受注</button>';
    } else {
      html += '<button class="btn btn--primary" data-order-from-hold="' + escapeHtml(v.commission) + '">受注確定</button>';
    }
    html += '</div>';
    return html;
  }

  /**
   * 番号付き一覧の共通ラッパー。在庫リスト・受注リスト・業販受注リスト・
   * マイページのいずれも、この1つのリストデザインに統一する（ROUND H フェーズ2、
   * カード／表の表示形式切り替えは廃止）。renderRowFnは各行のHTMLを返す関数
   * （第1引数に要素、第2引数に1始まりの連番を渡す）。
   */
  function rowListHtml_(items, renderRowFn) {
    if (!items.length) return '';
    return '<div class="rowList">' + items.map(function (item, i) {
      return renderRowFn(item, i + 1);
    }).join('') + '</div>';
  }
  function rowNum_(n) { return n < 10 ? '0' + n : String(n); }

  /**
   * 在庫リストの一覧行。見出し行は区分タグ・モデル名だけ、メタ情報行には
   * 年式・走行距離・登録番号・販売価格をまとめ、各項目の間には縦罫線
   * （rowItem__metaSep）を入れて区切る（現場からの要望「価格も車両情報側に
   * 含めてほしい」「区切りを入れたいのは車両情報の方」）。状態列
   * （rowItem__status、幅固定）にはHold中でも状態バッジのみを表示し、顧客名・
   * 担当者・残り時間は出さない（現場からの要望「HOLD状況はステータスのみで
   * 大丈夫、詳細情報にて担当者・顧客・残り時間がわかるようにしてほしい」）。
   * これらは元々詳細モーダル（vehicleDetailHtml_のholdInfoBlockHtml_、
   * full=true）に含まれているため、一覧行から削っても詳細は失われない。
   * カラー・ＯＣＮも同様に一覧行には出さず、詳細モーダルでのみ確認する
   * 形にしている（行タップ・チェブロンどちらでも同じモーダルを開く。
   * handleInventoryListClick_参照）。
   */
  function vehicleRowItemHtml_(v, num) {
    var isHold = v.holdStatus === 'hold';
    var isSpecialHold = isHold && !!(v.holdHoldType && v.holdHoldType !== 'normal');
    var rowTone = isSpecialHold ? 'rowItem--holdSpecial' : (isHold ? 'rowItem--hold' : '');

    // 解除（Hold取消）ボタンは行の操作ボタン列（受注確定の隣）に置く。
    var cancelHoldBtnHtml = isHold
      ? '<button type="button" class="btn btn--danger rowItem__cancelHoldBtn" data-cancel-hold="' + escapeHtml(v.commission) + '">解除</button>'
      : '';

    return '<div class="rowItem ' + rowTone + '" data-commission="' + escapeHtml(v.commission) + '">' +
      '<div class="rowItem__num">' + rowNum_(num) + '</div>' +
      '<div class="rowItem__main">' +
      '<div class="rowItem__head">' +
      '<span class="tag">' + escapeHtml(v.category || '-') + '</span>' +
      '<span class="rowItem__model" title="' + escapeHtml(v.model) + '">' + escapeHtml(v.model) + '</span>' +
      '</div>' +
      '<div class="rowItem__colorSub" title="' + escapeHtml((v.exteriorColor || '-') + ' / ' + (v.interiorColor || '-')) + '">' +
      escapeHtml((v.exteriorColor || '-') + ' / ' + (v.interiorColor || '-')) + '</div>' +
      '<div class="rowItem__meta">' +
      '<span>年式 ' + escapeHtml(v.firstRegistrationDate || '-') + '</span>' +
      '<span class="rowItem__metaSep"></span>' +
      '<span>走行距離 ' + escapeHtml(formatNumberUnit_(v.mileage, ' km') || '-') + '</span>' +
      '<span class="rowItem__metaSep"></span>' +
      '<span>登録番号 ' + escapeHtml(plateText_(v) || '-') + '</span>' +
      '<span class="rowItem__metaSep"></span>' +
      '<span class="rowItem__metaPrice">販売価格 ' + escapeHtml(formatNumberUnit_(v.salePrice, ' 円') || '-') + '</span>' +
      '</div>' +
      '</div>' +
      '<div class="rowItem__status">' + vehicleBadgesHtml_(v, false) + '</div>' +
      '<div class="rowItem__actions">' + cancelHoldBtnHtml + vehicleActionsHtml_(v) + '</div>' +
      '<div class="rowItem__chev">›</div>' +
      '</div>';
  }

  /**
   * 「詳細を見る」タップ・表示形式「表」の行タップで開く、画面中央のモーダル
   * （#inventoryDetailModal）用のフル版。車両スペック・Holdの詳細（リード番号等）
   * も省略せずすべて表示する（openInventoryDetailModal_参照）。
   *
   * PC・タブレット幅（modal__panel--vehicle、Stylesheet.html内の
   * @media (min-width: 901px)参照）では、画面全体よりひと回り小さい横長の
   * 長方形ポップアップの中で、内容を「概要」「詳細スペック」「Hold状況・操作」の
   * 3カラムに分けて一度に見渡せるようにする（現場からの要望）。card__detailCol
   * の3つのdivがそのままCSS Gridの列になる。スマホ幅（900px以下）では、この
   * 3つのdivは単純に上から順に縦積みされるだけなので、以前の縦長モーダルと
   * 同じ表示順のまま変わらない。 */
  function vehicleDetailHtml_(v) {
    var isHold = v.holdStatus === 'hold';

    var holdInfoHtml = isHold
      ? '<div class="card__holdArea card__holdArea--full">' + holdInfoBlockHtml_('HOLD', v, 'hold', true) + '</div>'
      : '<div class="card__holdArea card__holdArea--empty card__holdArea--full">' +
        '<span class="card__holdArea__placeholder">現在Hold登録なし</span>' +
        '</div>';

    var cardTone = vehicleCardTone_(v);
    return '<div class="card ' + cardTone + '">' +
      '<div class="card__detailCol card__detailCol--overview">' +
      vehicleTopHtml_(v) +
      vehicleQuickMetaHtml_(v, true) +
      '</div>' +
      '<div class="card__detailCol card__detailCol--spec">' +
      vehicleSpecFieldsHtml_(v) +
      noteBlockHtml_('備考', v.remarks, '備考はありません。') +
      '</div>' +
      '<div class="card__detailCol card__detailCol--hold">' +
      holdInfoHtml +
      vehicleActionsHtml_(v) +
      '</div>' +
      '</div>';
  }

  /** 一覧行タップ・チェブロンタップのどちらでも、車両情報すべてを画面中央の
   * モーダルに表示する。 */
  function openInventoryDetailModal_(commission) {
    var vehicle = findVehicleByCommission(commission);
    if (!vehicle) return;
    $('inventoryDetailBody').innerHTML = vehicleDetailHtml_(vehicle);
    openModal($('inventoryDetailModal'));
  }

  // Hold詳細ブロックは、常に見えている要約行（顧客・担当者・タイマー）と、
  // 折りたたみ式の詳細（リード番号・登録月・下取車・OSS・保険）に分ける。
  /**
   * full=false（表示形式「カード」のコンパクト版）ではリード番号等の詳細を省略し、
   * full=true（詳細モーダル・vehicleDetailHtml_）では折りたたまず常に表示する。
   */
  function holdInfoBlockHtml_(label, v, prefix, full) {
    var holdType = v[prefix + 'HoldType'] || 'normal';
    var isSpecial = holdType !== 'normal';
    var leadNumber = v[prefix + 'LeadNumber'];
    var staff = v[prefix + 'Staff'];
    var customer = v[prefix + 'Customer'];
    var salesLocation = v[prefix + 'SalesLocation'];
    var registeredMonth = v[prefix + 'RegisteredMonth'];
    var tradeIn = v[prefix + 'TradeIn'];
    var oss = v[prefix + 'Oss'];
    var insurance = v[prefix + 'Insurance'];
    var paymentMethod = v[prefix + 'PaymentMethod'];
    var salesStore = v[prefix + 'SalesStore'];
    var createdAt = v[prefix + 'CreatedAt'];
    var expiresAt = v[prefix + 'ExpiresAt'];

    var summaryHtml;
    var detailsHtml = '';
    if (holdType === 'wholesale') {
      summaryHtml = '<div class="card__holdInfo__row"><b>業販HOLD</b>（担当者 ' + escapeHtml(staff || '-') + '）</div>';
      if (full) {
        detailsHtml = '<div class="card__holdInfo__detailsBody card__holdInfo__detailsBody--flat">' +
          '販売先 ' + escapeHtml(salesStore || '-') +
          '</div>';
      }
    } else {
      summaryHtml = '<div class="card__holdInfo__row"><b>' + escapeHtml(customer || '-') + '</b>（担当者 ' + escapeHtml(staff || '-') + '・' + escapeHtml(salesLocation || '-') + '）</div>';
      detailsHtml = full
        ? '<div class="card__holdInfo__detailsBody card__holdInfo__detailsBody--flat">' +
          'リード番号 ' + escapeHtml(leadNumber || '-') +
          ' / 登録月 ' + escapeHtml(registeredMonth || '-') +
          ' / 下取車 ' + escapeHtml(tradeIn || '-') + ' / OSS ' + escapeHtml(oss || '-') +
          ' / 保険 ' + escapeHtml(insurance || '-') + ' / 支払方法 ' + escapeHtml(paymentMethod || '-') +
          '</div>'
        : '';
    }

    return '<div class="card__holdInfo card__holdInfo--hold' + (isSpecial ? ' card__holdInfo--special' : '') + '">' +
      '<div class="card__holdInfo__head">' +
      '<span class="card__holdInfo__label">' + label + (isSpecial ? '（' + escapeHtml(holdTypeLabel_(holdType)) + '）' : '') + '</span>' +
      '<button class="card__holdInfo__cancel" type="button" data-cancel-hold="' + escapeHtml(v.commission) + '">解除</button>' +
      '</div>' +
      summaryHtml +
      holdTimerHtml_(createdAt, expiresAt) +
      detailsHtml +
      '</div>';
  }

  // ===== Hold 72時間タイマー（視覚的なカウントダウン・進捗バー） =====
  // 業販HOLDは期限が無期限（expiresAtがfalsy）のため、進捗バーは出さず
  // 「無期限」の固定表示にする。updateHoldTimersは data-expires-at が空（falsy）の
  // 要素を毎秒の更新対象から除外するため、この初期表示のまま変化しない。
  function holdTimerHtml_(createdAt, expiresAt, extraClass) {
    var cls = 'holdTimer' + (extraClass ? ' ' + extraClass : '');
    if (!expiresAt) {
      return '<div class="' + cls + ' holdTimer--indefinite" data-created-at="' + (createdAt || '') + '" data-expires-at="">' +
        '<div class="holdTimer__text">無期限</div>' +
        '</div>';
    }
    return '<div class="' + cls + '" data-created-at="' + (createdAt || '') + '" data-expires-at="' + expiresAt + '">' +
      '<div class="holdTimer__bar"><div class="holdTimer__barFill"></div></div>' +
      '<div class="holdTimer__text">-</div>' +
      '</div>';
  }

  function formatDuration_(ms) {
    var totalSeconds = Math.max(0, Math.floor(ms / 1000));
    var hours = Math.floor(totalSeconds / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;
    return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }

  var HOLD_DURATION_MS_CLIENT = 72 * 60 * 60 * 1000; // サーバー側 HOLD_DURATION_MS と同じ値（表示用フォールバック）

  var expiredRefreshTimer = null;
  function scheduleExpiredRefresh_() {
    if (expiredRefreshTimer) return;
    expiredRefreshTimer = setTimeout(function () {
      expiredRefreshTimer = null;
      loadInventory();
    }, 15000);
  }

  function updateHoldTimers() {
    var now = Date.now();
    var anyExpired = false;
    document.querySelectorAll('.holdTimer').forEach(function (el) {
      var expiresAt = Number(el.dataset.expiresAt);
      if (!expiresAt) return;
      var createdAt = Number(el.dataset.createdAt) || expiresAt - HOLD_DURATION_MS_CLIENT;
      var fill = el.querySelector('.holdTimer__barFill');
      var text = el.querySelector('.holdTimer__text');

      var total = expiresAt - createdAt;
      var remaining = expiresAt - now;
      if (remaining <= 0) {
        anyExpired = true;
        el.classList.add('holdTimer--expired');
        el.classList.remove('holdTimer--warning');
        fill.style.width = '0%';
        text.textContent = '期限切れ（まもなく自動更新されます）';
      } else {
        var pct = total > 0 ? Math.max(0, Math.min(100, (remaining / total) * 100)) : 0;
        fill.style.width = pct + '%';
        el.classList.toggle('holdTimer--warning', remaining < 6 * 60 * 60 * 1000);
        el.classList.remove('holdTimer--expired');
        text.textContent = '残り ' + formatDuration_(remaining);
      }
    });
    if (anyExpired) scheduleExpiredRefresh_();
  }

  setInterval(updateHoldTimers, 1000);

  // 不具合修正: 以前は自由検索欄の下に「状態（在庫あり／Hold中／業販HOLD中）」の
  // クイックタブを置いていたが、現場からの要望でホーム画面と同じ「ボディタイプ」の
  // クイックナビ（単一選択、.homeTypeNav__itemを流用）に差し替えた。状態そのものの
  // 絞り込みは（ホームと同じ発想で）廃止し、区分・掲載状況・年式・価格帯・走行距離は
  // 引き続き左の絞り込みサイドバーで扱う。
  function renderInventoryBodyTypeNav_() {
    var options = (state.bootstrap && state.bootstrap.modelBodyTypeOptions) || [];
    var current = state.inventoryBodyTypeFilter;
    var itemsHtml = '<button type="button" class="homeTypeNav__item' + (!current ? ' is-active' : '') +
      '" data-inventory-body-type="">すべて</button>' +
      options.map(function (t) {
        return '<button type="button" class="homeTypeNav__item' + (current === t ? ' is-active' : '') +
          '" data-inventory-body-type="' + escapeHtml(t) + '">' + escapeHtml(t) + '</button>';
      }).join('');
    $('inventoryBodyTypeNav').innerHTML = itemsHtml;
  }

  on('inventoryBodyTypeNav', 'click', function (e) {
    var btn = e.target.closest('[data-inventory-body-type]');
    if (!btn) return;
    state.inventoryBodyTypeFilter = btn.dataset.inventoryBodyType || '';
    renderInventory();
  });

  function renderInventory() {
    var container = $('inventoryList');
    var all = state.inventoryItems || [];
    var filtered = sortInventoryItems_(applyInventoryFilters_(all));
    $('inventoryEmpty').classList.toggle('hidden', filtered.length > 0);
    // 該当台数は絞り込みサイドバー（条件検索）見出しの右にのみ表示する
    // （不具合修正: 以前はクイックナビ行の右側にも同じ情報を重複表示していた）。
    $('inventoryFilterCount').textContent = all.length ? '該当 ' + filtered.length + '台 ／ 全' + all.length + '台' : '';
    renderInventoryBodyTypeNav_();
    container.innerHTML = rowListHtml_(filtered, vehicleRowItemHtml_);
    syncInventoryFilterClearVisibility_();
  }

  // 在庫リストの行タップ操作（Hold・受注・詳細）。マイページの
  // 「Hold中の車両」一覧（#myPageHoldList）も同じ行（vehicleRowItemHtml_）を
  // 再利用しているため、同じ処理を共有できるよう名前付き関数にしている。
  /**
   * Hold・受注・受注確定・Hold解除ボタンのdata属性からコミッションを
   * 取り出す。コミッション列は任意入力（Constants.gsのVEHICLE_COLUMNS参照）の
   * ため、値が空欄の車両ではボタン自体は表示されてもdata属性の値が空文字になり、
   * クリックしてもエラーも出ないまま無反応になっていた不具合があった（現場からの
   * 指摘）。呼び出し側は`'hold' in target.dataset`のように属性の「有無」でボタンが
   * クリックされたかどうかを判定したうえでこの関数を呼び、値が空ならここで
   * 分かりやすいエラーを表示する。
   */
  function requireActionCommission_(commission) {
    if (commission) return commission;
    showToast('この車両は「コミッション」が未入力のため操作できません。スプレッドシートでコミッションを入力してから、画面を更新してもう一度お試しください。', true);
    return null;
  }

  function handleInventoryListClick_(e) {
    var target = e.target;
    var commission;
    if ('hold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.hold))) openActionModal('hold', commission); }
    else if ('order' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.order))) openActionModal('order', commission); }
    else if ('orderFromHold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.orderFromHold))) openActionModal('orderFromHold', commission); }
    else if ('cancelHold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.cancelHold))) openCancelHoldModal(commission); }
    else {
      // 一覧行タップ（ボタン・入力・ラベル以外の箇所）で車両情報の詳細モーダルを開く。
      var tappable = target.closest('.rowItem[data-commission]');
      if (tappable && !target.closest('button, input, label')) {
        openInventoryDetailModal_(tappable.dataset.commission);
      }
    }
  }

  on('inventoryList','click', handleInventoryListClick_);

  // 詳細モーダル内のHold/受注等のボタンも、在庫リストと同じ操作ができるようにする。
  // 操作系のボタン（Hold・受注・受注確定・Hold解除）を押した場合は、
  // 続けて別のモーダル（Hold登録等）を開く前に、この詳細モーダル自体は閉じておく。
  on('inventoryDetailModal','click', function (e) {
    var target = e.target;
    var commission;
    if ('hold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.hold))) { closeModal($('inventoryDetailModal')); openActionModal('hold', commission); } }
    else if ('order' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.order))) { closeModal($('inventoryDetailModal')); openActionModal('order', commission); } }
    else if ('orderFromHold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.orderFromHold))) { closeModal($('inventoryDetailModal')); openActionModal('orderFromHold', commission); } }
    else if ('cancelHold' in target.dataset) { if ((commission = requireActionCommission_(target.dataset.cancelHold))) { closeModal($('inventoryDetailModal')); openCancelHoldModal(commission); } }
  });

  on('inventoryKeyword', 'input', debounce(loadInventory, 250));

  // ----- 絞り込みサイドバーの各項目（区分・掲載状況・年式・価格帯・走行距離）は、
  //       キーワードと異なりサーバーへ問い合わせず、既に取得済みの一覧
  //       （state.inventoryItems）をクライアントだけで絞り込み直す
  //       （renderInventory参照。即座に反映されるため操作感が良い）。 -----
  function bindInventoryCheckboxFilter_(containerId, filterKey) {
    on(containerId, 'change', function (e) {
      if (e.target.type !== 'checkbox') return;
      var checked = Array.prototype.slice.call($(containerId).querySelectorAll('input[type="checkbox"]:checked'))
        .map(function (el) { return el.value; });
      state.inventoryFilters[filterKey] = checked;
      renderInventory();
    });
  }
  bindInventoryCheckboxFilter_('inventoryCategoryFilter', 'category');
  bindInventoryCheckboxFilter_('inventoryListedFilter', 'listed');

  [['inventoryColorFilter', 'color'], ['inventoryYearFilter', 'yearBucket'], ['inventoryPriceFilter', 'priceBucket'], ['inventoryMileageFilter', 'mileageBucket']].forEach(function (pair) {
    on(pair[0], 'change', function () {
      state.inventoryFilters[pair[1]] = this.value;
      renderInventory();
    });
  });

  on('inventorySort', 'change', function () {
    state.inventorySort = this.value;
    renderInventory();
  });

  on('btnInventoryFilterClear', 'click', function () {
    state.inventoryFilters = { category: [], listed: [], color: '', yearBucket: '', priceBucket: '', mileageBucket: '' };
    state.inventoryBodyTypeFilter = '';
    state.inventorySort = '';
    $('inventoryKeyword').value = '';
    ['inventoryColorFilter', 'inventoryYearFilter', 'inventoryPriceFilter', 'inventoryMileageFilter', 'inventorySort'].forEach(function (id) { $(id).value = ''; });
    document.querySelectorAll('#inventoryCategoryFilter input, #inventoryListedFilter input').forEach(function (el) { el.checked = false; });
    loadInventory();
  });

  // ===== Hold / 受注 共通モーダル =====
  var ACTION_LABELS = {
    hold: { title: 'Hold登録', button: 'Holdする', busyLabel: 'Hold登録中...', tone: 'hold' },
    order: { title: '受注確定', button: '受注確定する', busyLabel: '受注確定中...', tone: 'order' },
    orderFromHold: { title: '受注確定', button: '受注確定する', busyLabel: '受注確定中...', tone: 'order' }
  };
  var ORDER_TYPES = ['order', 'orderFromHold'];

  function actionFieldId_(key) {
    return 'action' + key.charAt(0).toUpperCase() + key.slice(1);
  }

  // ===== ログイン中のGoogleアカウントに紐づく担当者 =====
  // 担当者マスタ（設定タブ）にメールアドレスを登録しておくと、ログイン中のGoogleアカウントの
  // メールアドレスから自動的に担当者名が解決される（サーバー側 resolveStaffNameByEmail_ と
  // 同じ照合をAPI側で行い、bootstrap.currentStaffName として渡ってくる）。
  function currentStaffName_() {
    return state.bootstrap && state.bootstrap.currentStaffName;
  }

  // ログイン中の担当者が担当者マスタに登録している拠点名（未登録ならnull）。
  // Hold登録・受注確定モーダルの「販売拠点」欄の初期値に使う。
  function currentStaffLocation_() {
    return (state.bootstrap && state.bootstrap.currentStaffLocation) || '';
  }

  function currentUserEmail_() {
    return (state.bootstrap && state.bootstrap.currentUserEmail) || '';
  }

  // 本人確認は表示名ではなく必ずメールアドレスで行う（担当者マスタの表示名は
  // 後から変更され得るため、名前同士の比較だと表示名を変えただけで自分自身の
  // Holdを解除・受注確定できなくなる不具合の原因になる。サーバー側 canCancelHold_ /
  // canConfirmOrder_ も同様にメールアドレスで判定する）。
  function emailsMatch_(a, b) {
    return !!a && !!b && String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
  }

  function staffDisplayHtml_() {
    var name = currentStaffName_();
    var email = currentUserEmail_();
    if (name) {
      return '<b>' + escapeHtml(name) + '</b><span class="staffDisplay__email">' + escapeHtml(email) + '</span>';
    }
    return '<span class="staffDisplay__warn">担当者マスタ未登録（' + escapeHtml(email || '不明') + '）</span>';
  }

  // ログイン中の担当者情報を、コントロールパネル右端（#topbarUser）に
  // 氏名・メールアドレスのテキストとして表示する（以前のコントロールパネルと
  // 同じ見た目。アバター画像・ホバーツールチップは持たない簡易表示）。
  function renderTopbarUser() {
    var name = currentStaffName_();
    var email = currentUserEmail_();
    var infoHtml;
    if (name) {
      infoHtml = '<span class="topbar__userName">' + escapeHtml(name) + '</span>' +
        '<span class="topbar__userEmail">' + escapeHtml(email) + '</span>';
    } else if (email) {
      // メールアドレスは取得できているが、担当者マスタに未登録の場合。
      infoHtml = '<span class="topbar__userWarn">担当者未登録: ' + escapeHtml(email) + '</span>';
    } else {
      // メールアドレス自体が空の場合。ほとんどの場合、Webアプリのデプロイ設定
      // （「実行するユーザー」「アクセスできるユーザー」）が原因で
      // Session.getActiveUser().getEmail() が空文字を返している
      // （個人のGoogleアカウントで運用する場合、「アクセスできるユーザー」を
      // 「Googleアカウントを持つ全員」にする必要がある。「全員（匿名ユーザーを
      // 含む）」だとログイン自体が不要になり、アカウント情報を取得できない）。
      infoHtml = '<span class="topbar__userWarn" title="Webアプリのデプロイ設定（実行するユーザー・アクセスできるユーザー）をご確認ください">' +
        'ログイン情報を取得できません</span>';
    }
    $('topbarUser').innerHTML = infoHtml;
  }

  // ===== 在庫データ整合性チェック（アプリ起動時に1回だけ実行） =====
  // 在庫の追加・編集はスプレッドシートへ直接行う運用のため、コミッションの重複貼り付けや
  // モデル名の記入漏れ等、手作業ならではのミスが紛れ込むことがある。操作をブロックはせず、
  // 画面上部のバナーで気づけるようにするだけにとどめる。
  function checkIntegrity_() {
    gasRun('api_checkInventoryIntegrity').then(function (issues) {
      renderIntegrityBanner_(issues || []);
    }).catch(function () {
      // 整合性チェック自体の失敗は、通常の利用を妨げるべきではないため静かに無視する。
    });
  }

  function renderIntegrityBanner_(issues) {
    var banner = $('integrityBanner');
    if (!issues.length) {
      banner.classList.add('hidden');
      $('integrityBannerList').classList.add('hidden');
      return;
    }
    $('integrityBannerSummary').textContent = '在庫データに' + issues.length + '件の問題があります（スプレッドシートをご確認ください）';
    $('integrityBannerList').innerHTML = issues.map(function (issue) {
      return '<li>' + escapeHtml(issue.message) + '</li>';
    }).join('');
    banner.classList.remove('hidden');
  }

  on('btnIntegrityDetail','click', function () {
    $('integrityBannerList').classList.toggle('hidden');
  });

  on('btnIntegrityClose','click', function () {
    $('integrityBanner').classList.add('hidden');
    $('integrityBannerList').classList.add('hidden');
  });

  // ===== 予約モーダルのステップ進捗（顧客情報→契約内容） =====
  // スマホでの誤タップ・誤入力を減らすため、8項目を一度に出さず2ステップに分ける。
  var ACTION_STEP1_KEYS = ['salesLocation', 'leadNumber', 'customer'];

  /**
   * 管理者権限を持つ担当者がHoldをタップした場合、通常の顧客情報入力（step 1/2）の前に
   * Hold種別選択（'typePick'）を挟む。業販HOLD（'wholesale'）は通常の2ステップとは
   * 別の簡易フォーム1画面のみで完結する。業販HOLDが掛かっている車両から受注確定を
   * タップした場合は、typePickを経由せずいきなり'wholesaleOrder'（販売先・登録月の
   * みの簡易フォーム）へ入る（openActionModal参照）。
   * stepは 'typePick' | 1 | 2 | 'wholesale' | 'wholesaleOrder' のいずれか。
   */
  function goToActionStep_(step) {
    state.actionStep = step;
    var showTypePick = step === 'typePick';
    var showStep1 = step === 1;
    var showStep2 = step === 2;
    var showWholesale = step === 'wholesale';
    var showWholesaleOrder = step === 'wholesaleOrder';
    $('actionTypePickStep').classList.toggle('hidden', !showTypePick);
    $('actionStep1').classList.toggle('hidden', !showStep1);
    $('actionStep2').classList.toggle('hidden', !showStep2);
    $('actionStepWholesale').classList.toggle('hidden', !showWholesale);
    $('actionStepWholesaleOrder').classList.toggle('hidden', !showWholesaleOrder);

    var isNormalSteps = showStep1 || showStep2;
    $('actionStepFill').closest('.modal__stepBar').classList.toggle('hidden', !isNormalSteps);
    if (isNormalSteps) {
      $('actionStepFill').style.width = showStep1 ? '50%' : '100%';
      $('actionStepLabel').textContent = showStep1 ? 'ステップ 1/2　顧客情報' : 'ステップ 2/2　契約内容';
    }
    // ステップ2（契約内容）に入った直後は、先頭の「下取車の有無」に入力カーソルを
    // 合わせる（現場からの要望。スマホでは自動的にキーボード操作から続けられる）。
    if (showStep2) $('actionTradeIn').focus();
    // 「戻る」は、通常の2ステップ目からstep1へ、admin経由のstep1・業販HOLD簡易フォームからは
    // Hold種別選択画面へ戻れるようにする（それ以外・通常ユーザーのHold、業販HOLDからの
    // 受注確定では非表示のまま）。
    var canGoBack = showStep2 || showWholesale || (showStep1 && !!(state.action && state.action.adminHoldFlow));
    $('btnActionBack').classList.toggle('hidden', !canGoBack);
    $('btnActionNext').classList.toggle('hidden', !showStep1);
    $('btnActionSubmit').classList.toggle('hidden', !(showStep2 || showWholesale || showWholesaleOrder));
    $('actionModalError').classList.add('hidden');
  }

  on('btnActionNext','click', function () {
    var missing = missingRequiredFieldLabels_(ACTION_STEP1_KEYS);
    if (missing.length) {
      var errEl = $('actionModalError');
      errEl.textContent = '次の項目を入力してください: ' + missing.join('、');
      errEl.classList.remove('hidden');
      return;
    }
    goToActionStep_(2);
  });

  on('btnActionBack','click', function () {
    if (state.actionStep === 2) { goToActionStep_(1); }
    else if (state.actionStep === 1 || state.actionStep === 'wholesale') { goToActionStep_('typePick'); }
  });

  var ACTION_TYPE_PICK_TITLES = { normal: 'Hold登録', wholesale: '業販HOLD登録' };
  var ACTION_TYPE_PICK_BUTTONS = { normal: 'Holdする', wholesale: '業販HOLDする' };

  on('actionModal','click', function (e) {
    var btn = e.target.closest('[data-hold-type-pick]');
    if (!btn) return;
    var holdType = btn.dataset.holdTypePick;
    state.action.holdType = holdType;
    $('actionModalTitle').textContent = ACTION_TYPE_PICK_TITLES[holdType];
    $('btnActionSubmit').textContent = ACTION_TYPE_PICK_BUTTONS[holdType];
    if (holdType === 'normal') goToActionStep_(1);
    else goToActionStep_('wholesale');
  });

  // 管理者権限を持つ担当者（SYSTEM_ADMIN_EMAILS）のみ、通常のHoldに加えて業販HOLDを
  // 登録できる。設定タブのシステムマスタ表示・非表示（renderSettings）と
  // 同じ判定方法（state.bootstrap.isSystemAdmin）を使う。実際の権限チェックは
  // サーバー側 normalizeHoldType_ で行うため、ここでの判定はUI表示の制御のみ。
  function isSystemAdmin_() {
    return !!(state.bootstrap && state.bootstrap.isSystemAdmin);
  }

  function openActionModal(type, commission) {
    var currentStaff = currentStaffName_();
    if (!currentStaff) {
      showToast('担当者マスタに登録されていないため操作できません。設定タブでご自身のメールアドレスを登録してください（' + (currentUserEmail_() || '不明') + '）', true);
      return;
    }

    var vehicle = findVehicleByCommission(commission);
    var isOrderFromHold = type === 'orderFromHold' && vehicle;
    // 業販HOLD（HoldService.gsのHOLD_TYPE.WHOLESALE）が掛かっている車両からの
    // 受注確定は、通常の2ステップ・Hold種別選択を経由せず、「販売先」「登録月」の
    // みの簡易フォーム（'wholesaleOrder'）で完結する。
    var isWholesaleOrderFromHold = isOrderFromHold && vehicle.holdHoldType === 'wholesale';

    // 管理者権限を持つ担当者が「Hold」（1st Hold）をタップした場合のみ、通常のHoldに
    // 加えて業販HOLDを選べるHold種別選択画面を挟む。受注確定には
    // この選択画面は出さない（業販HOLDは1st Holdのみの機能のため）。
    var isAdminHoldPick = type === 'hold' && isSystemAdmin_();
    state.action = {
      type: type, commission: commission,
      holdType: isWholesaleOrderFromHold ? 'wholesale' : 'normal',
      adminHoldFlow: isAdminHoldPick
    };
    $('actionModalTitle').textContent = isWholesaleOrderFromHold ? '業販受注確定' : ACTION_LABELS[type].title;
    var submitBtn = $('btnActionSubmit');
    submitBtn.textContent = isWholesaleOrderFromHold ? '業販受注確定する' : ACTION_LABELS[type].button;
    delete submitBtn.dataset.originalLabel;
    // Hold系（hold）はオレンジ、受注系（order/orderFromHold）は青、と
    // 一目で操作の種類が分かるようモーダル全体の差し色を切り替える。
    var panel = document.querySelector('#actionModal .modal__panel');
    panel.classList.remove('modal__panel--hold', 'modal__panel--order');
    panel.classList.add('modal__panel--' + ACTION_LABELS[type].tone);
    submitBtn.disabled = false;
    $('actionModalError').classList.add('hidden');
    $('actionSalesStore').value = '';
    $('actionWholesaleSalesStore').value = '';
    $('actionWholesaleRegisteredMonth').value = '';

    if (isWholesaleOrderFromHold) {
      $('actionWholesaleSalesStore').value = vehicle.holdSalesStore || '';
      $('actionWholesaleRegisteredMonth').value = currentYearMonth();
      $('actionStaffDisplay').innerHTML = staffDisplayHtml_();
      // Hold中の車両は、業販HOLDを行った担当者のみ受注確定できる（通常の受注確定と
      // 同じ制約。canConfirmOrder_参照）。
      var wholesaleStaffMismatch = vehicle.holdStaffEmail && !emailsMatch_(vehicle.holdStaffEmail, currentUserEmail_());
      if (wholesaleStaffMismatch) {
        var wholesaleErrEl = $('actionModalError');
        wholesaleErrEl.textContent = 'このHoldの担当者は「' + vehicle.holdStaff + '」です。ログイン中の担当者（' + currentStaff + '）では受注確定できません。';
        wholesaleErrEl.classList.remove('hidden');
      }
      submitBtn.disabled = !!wholesaleStaffMismatch;
      goToActionStep_('wholesaleOrder');
      openModal($('actionModal'));
      return;
    }

    goToActionStep_(isAdminHoldPick ? 'typePick' : 1);

    var prefill;
    if (isOrderFromHold) {
      prefill = {
        // 入力欄には数字部分のみを表示する（「L-」は固定接頭辞として画面側に表示済み）
        leadNumber: String(vehicle.holdLeadNumber || '').replace(/^L-/i, ''),
        // 登録月はHold登録時点の月ではなく、受注確定を行う「今月」を既定値にする
        // （Holdからしばらく経ってから受注確定するケースがあるため）。
        registeredMonth: currentYearMonth(),
        customer: vehicle.holdCustomer,
        salesLocation: vehicle.holdSalesLocation,
        tradeIn: vehicle.holdTradeIn,
        oss: vehicle.holdOss,
        insurance: vehicle.holdInsurance,
        paymentMethod: vehicle.holdPaymentMethod
      };
    } else {
      // Hold登録・新規の受注確定は、担当者マスタに登録された
      // ログイン中の担当者本人の拠点名を販売拠点欄の初期値にする（編集可）。
      prefill = {
        leadNumber: '', registeredMonth: currentYearMonth(), customer: '',
        salesLocation: currentStaffLocation_(), tradeIn: '', oss: '', insurance: '', paymentMethod: ''
      };
    }

    $('actionStaffDisplay').innerHTML = staffDisplayHtml_();

    // Hold中の車両は、Holdを行った担当者のみ受注確定できる。ログイン中のメールアドレスが
    // Hold担当者のメールアドレスと異なる場合は、送信前に気づけるようここで警告し送信を
    // ブロックする（最終判定はサーバー側 canConfirmOrder_ で行う。表示名ではなく
    // メールアドレスで比較する — emailsMatch_ 参照）。
    var staffMismatch = isOrderFromHold && vehicle.holdStaffEmail && !emailsMatch_(vehicle.holdStaffEmail, currentUserEmail_());
    if (staffMismatch) {
      var errEl = $('actionModalError');
      errEl.textContent = 'このHoldの担当者は「' + vehicle.holdStaff + '」です。ログイン中の担当者（' + currentStaff + '）では受注確定できません。';
      errEl.classList.remove('hidden');
    }
    submitBtn.disabled = !!staffMismatch;

    $('actionSalesLocation').value = prefill.salesLocation || '';
    $('actionLeadNumber').value = prefill.leadNumber || '';
    $('actionRegisteredMonth').value = prefill.registeredMonth || currentYearMonth();
    $('actionCustomer').value = prefill.customer || '';
    $('actionTradeIn').value = prefill.tradeIn || '';
    $('actionOss').value = prefill.oss || '';
    $('actionInsurance').value = prefill.insurance || '';
    $('actionPaymentMethod').value = prefill.paymentMethod || '';

    openModal($('actionModal'));
  }

  // リード番号は「L-」固定接頭辞＋数字のみで扱う。入力欄には数字部分のみを
  // 持たせ、数字以外が入力されてもその場で取り除く。
  on('actionLeadNumber','input', function () {
    var digits = this.value.replace(/[^0-9]/g, '');
    if (this.value !== digits) this.value = digits;
  });

  function findVehicleByCommission(commission) {
    var found = (state.inventoryItems || []).find(function (v) { return commissionEquals_(v.commission, commission); });
    if (found) return found;
    // 在庫リストの検索・絞り込み条件で対象外になっていても（マイページ等、
    // 別画面のカードから操作した場合など）見つけられるよう、フィルタに
    // 左右されない全件キャッシュ（state.allInventoryItems）も探す。
    return (state.allInventoryItems || []).find(function (v) { return commissionEquals_(v.commission, commission); }) || null;
  }

  // ===== Hold解除 =====
  // 「解除しようとしているのは誰か」は、ログイン中のGoogleアカウントのメールアドレスと、
  // Hold登録時の担当者のメールアドレスが一致するかで判定する（表示名の比較ではない）。
  var cancelHoldState = null; // { commission }

  function openCancelHoldModal(commission) {
    var currentStaff = currentStaffName_();
    if (!currentStaff) {
      showToast('担当者マスタに登録されていないため操作できません。設定タブでご自身のメールアドレスを登録してください（' + (currentUserEmail_() || '不明') + '）', true);
      return;
    }
    var vehicle = findVehicleByCommission(commission);
    if (!vehicle) return;
    var holdStaff = vehicle.holdStaff;
    var holdStaffEmail = vehicle.holdStaffEmail;
    var holdCustomer = vehicle.holdCustomer;

    cancelHoldState = { commission: commission };
    $('cancelHoldModalTitle').textContent = 'HOLDの解除';
    $('cancelHoldModalDesc').textContent =
      'このHOLD（顧客: ' + (holdCustomer || '-') + '）を登録した担当者「' +
      (holdStaff || '-') + '」のみ解除できます。';
    $('cancelHoldStaffDisplay').innerHTML = staffDisplayHtml_();
    $('cancelHoldModalError').classList.add('hidden');

    var submitBtn = $('btnCancelHoldSubmit');
    delete submitBtn.dataset.originalLabel;
    var staffMismatch = holdStaffEmail && !emailsMatch_(holdStaffEmail, currentUserEmail_());
    if (staffMismatch) {
      var errEl = $('cancelHoldModalError');
      errEl.textContent = 'このHoldの担当者は「' + holdStaff + '」です。ログイン中の担当者（' + currentStaff + '）では解除できません。';
      errEl.classList.remove('hidden');
    }
    submitBtn.disabled = !!staffMismatch;
    openModal($('cancelHoldModal'));
  }

  on('btnCancelHoldSubmit','click', function () {
    if (this.disabled || !cancelHoldState) return;
    var btn = this;
    var errEl = $('cancelHoldModalError');
    errEl.classList.add('hidden');
    setButtonBusy(btn, true, '解除中...');
    gasRun('api_cancelHold', cancelHoldState.commission).then(function () {
      setButtonBusy(btn, false);
      closeModal($('cancelHoldModal'));
      showToast('Holdを解除しました');
      loadInventory();
      loadAllInventoryItems_();
    }).catch(function (err) {
      setButtonBusy(btn, false);
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    });
  });

  // ===== 受注キャンセル（管理者限定） =====
  // 誤って受注確定してしまった場合等に、受注を取り消して在庫リストへ戻す訂正機能。
  // Hold解除（cancelHoldState・openCancelHoldModal）と異なり、対象の受注を
  // 確定した担当者が誰かは問わない（本人一致チェックは行わない）。管理者であれば、
  // 自分以外の担当者が確定した受注も含めてキャンセルできるため、ここでは
  // Hold解除のような担当者不一致の警告表示・送信ブロックは行わない。
  // 実際の権限チェックはサーバー側cancelOrder（OrderService.gs）で行うため、
  // ここでのisSystemAdmin_判定はボタンの表示・非表示のみを制御する。
  var cancelOrderState = null; // { commission }

  function openCancelOrderModal_(commission) {
    var order = findOrderByCommission_(commission);
    if (!order) return;
    cancelOrderState = { commission: commission };
    $('cancelOrderModalDesc').textContent =
      'この受注（顧客: ' + (order.customer || '-') + '・' + (order.model || '-') + '）を取り消し、' +
      '在庫リストへ「在庫あり」の状態で戻します。受注確定時のHold情報（担当者・期限等）は復元されません。';
    $('cancelOrderStaffDisplay').innerHTML = staffDisplayHtml_();
    $('cancelOrderModalError').classList.add('hidden');
    var submitBtn = $('btnCancelOrderSubmit');
    delete submitBtn.dataset.originalLabel;
    submitBtn.disabled = false;
    openModal($('cancelOrderModal'));
  }

  on('btnCancelOrderSubmit','click', function () {
    if (this.disabled || !cancelOrderState) return;
    var btn = this;
    var errEl = $('cancelOrderModalError');
    errEl.classList.add('hidden');
    setButtonBusy(btn, true, 'キャンセル中...');
    gasRun('api_cancelOrder', cancelOrderState.commission).then(function () {
      setButtonBusy(btn, false);
      closeModal($('cancelOrderModal'));
      showToast('受注をキャンセルし、在庫リストへ戻しました');
      loadInventory();
      loadOrders();
      loadAllInventoryItems_();
    }).catch(function (err) {
      setButtonBusy(btn, false);
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    });
  });

  on('orderDetailModal','click', function (e) {
    var btn = e.target.closest('[data-order-cancel]');
    if (!btn) return;
    closeModal($('orderDetailModal'));
    openCancelOrderModal_(btn.dataset.orderCancel);
  });

  // ===== 業販受注キャンセル（管理者限定） =====
  // cancelOrderState・openCancelOrderModal_と同じパターン（業販受注リスト専用）。
  var cancelWholesaleOrderState = null; // { commission }

  function openCancelWholesaleOrderModal_(commission) {
    var order = findWholesaleOrderByCommission_(commission);
    if (!order) return;
    cancelWholesaleOrderState = { commission: commission };
    $('cancelWholesaleOrderModalDesc').textContent =
      'この業販受注（販売先: ' + (order.salesStore || '-') + '・' + (order.model || '-') + '）を取り消し、' +
      '在庫リストへ「在庫あり」の状態で戻します。受注確定時のHold情報（担当者・期限等）は復元されません。';
    $('cancelWholesaleOrderStaffDisplay').innerHTML = staffDisplayHtml_();
    $('cancelWholesaleOrderModalError').classList.add('hidden');
    var submitBtn = $('btnCancelWholesaleOrderSubmit');
    delete submitBtn.dataset.originalLabel;
    submitBtn.disabled = false;
    openModal($('cancelWholesaleOrderModal'));
  }

  on('btnCancelWholesaleOrderSubmit','click', function () {
    if (this.disabled || !cancelWholesaleOrderState) return;
    var btn = this;
    var errEl = $('cancelWholesaleOrderModalError');
    errEl.classList.add('hidden');
    setButtonBusy(btn, true, 'キャンセル中...');
    gasRun('api_cancelWholesaleOrder', cancelWholesaleOrderState.commission).then(function () {
      setButtonBusy(btn, false);
      closeModal($('cancelWholesaleOrderModal'));
      showToast('業販受注をキャンセルし、在庫リストへ戻しました');
      loadInventory();
      loadWholesaleOrders();
      loadAllInventoryItems_();
    }).catch(function (err) {
      setButtonBusy(btn, false);
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    });
  });

  on('wholesaleOrderDetailModal','click', function (e) {
    var btn = e.target.closest('[data-wholesale-order-cancel]');
    if (!btn) return;
    closeModal($('wholesaleOrderDetailModal'));
    openCancelWholesaleOrderModal_(btn.dataset.wholesaleOrderCancel);
  });

  /**
   * Hold登録・受注確定は全項目（販売拠点を含む）の入力が必須。
   * 未入力の項目があればラベルを列挙して返す。担当者（staff）はログイン中の
   * Googleアカウントから自動設定されるため、ここでの入力必須チェックからは除外する
   * （openActionModalで別途チェック済み）。
   */
  function missingRequiredFieldLabels_(filterKeys) {
    var missing = [];
    var columns = (state.bootstrap && state.bootstrap.holdOrderInputColumns) || [];
    columns.forEach(function (c) {
      if (!c.required || c.key === 'staff') return;
      if (filterKeys && filterKeys.indexOf(c.key) === -1) return;
      var field = $(actionFieldId_(c.key));
      if (!field || !field.value || !String(field.value).trim()) missing.push(c.label);
    });
    return missing;
  }

  function validateActionForm_() {
    return missingRequiredFieldLabels_(null);
  }

  /**
   * Hold登録・受注確定完了後の共通後処理（成功トースト代わりの演出・一覧の再読込）。
   * 業販HOLD登録・業販受注確定（簡易フォーム）と、通常のHold・受注確定の
   * どちらの完了後も同じ処理でよいため共通化している。
   */
  function finishActionSubmit_(btn) {
    setButtonBusy(btn, false);
    closeModal($('actionModal'));
    showCelebration_(state.action.type);
    loadInventory();
    loadAllInventoryItems_();
    if (ORDER_TYPES.indexOf(state.action.type) !== -1) loadOrders();
    if (state.action.type === 'orderFromHold' && state.action.holdType === 'wholesale') loadWholesaleOrders();
  }

  function handleActionSubmitError_(btn, err) {
    setButtonBusy(btn, false);
    var el = $('actionModalError');
    el.textContent = err.message;
    el.classList.remove('hidden');
  }

  on('btnActionSubmit','click', function () {
    if (this.disabled) return;
    var btn = this;
    var action = state.action;

    // 業販HOLDは、通常のHoldの入力項目（顧客・下取車の有無等）を一切要求しない
    // 簡易フォームのため、通常フローの必須チェック（validateActionForm_）は行わず
    // ここで完結させる（管理者のみ到達できる。openActionModal参照）。
    if (action.type === 'hold' && action.holdType === 'wholesale') {
      var wholesaleHoldInfo = { salesStore: $('actionSalesStore').value.trim() };
      $('actionModalError').classList.add('hidden');
      setButtonBusy(btn, true, '業販HOLD登録中...');
      gasRun('api_registerHold', action.commission, wholesaleHoldInfo, 'wholesale')
        .then(function () { finishActionSubmit_(btn); })
        .catch(function (err) { handleActionSubmitError_(btn, err); });
      return;
    }

    // 業販HOLDからの受注確定は、「販売先」「登録月」のみの簡易フォームのため、
    // 通常フローの必須チェック（validateActionForm_）とは別に、ここで完結させる
    // （openActionModal参照）。
    if (action.type === 'orderFromHold' && action.holdType === 'wholesale') {
      var wholesaleOrderInfo = {
        salesStore: $('actionWholesaleSalesStore').value.trim(),
        registeredMonth: $('actionWholesaleRegisteredMonth').value || ''
      };
      if (!wholesaleOrderInfo.salesStore || !wholesaleOrderInfo.registeredMonth) {
        var wholesaleOrderErrEl = $('actionModalError');
        wholesaleOrderErrEl.textContent = '次の項目を入力してください: 販売先、登録月';
        wholesaleOrderErrEl.classList.remove('hidden');
        return;
      }
      $('actionModalError').classList.add('hidden');
      setButtonBusy(btn, true, '業販受注確定中...');
      gasRun('api_confirmWholesaleOrder', action.commission, wholesaleOrderInfo)
        .then(function () { finishActionSubmit_(btn); })
        .catch(function (err) { handleActionSubmitError_(btn, err); });
      return;
    }

    var missing = validateActionForm_();
    if (missing.length) {
      var errEl = $('actionModalError');
      errEl.textContent = '次の項目を入力してください: ' + missing.join('、');
      errEl.classList.remove('hidden');
      return;
    }

    var info = {
      salesLocation: $('actionSalesLocation').value.trim(),
      // リード番号は「L-」固定接頭辞＋数字（入力欄には数字のみを持たせている）
      leadNumber: 'L-' + $('actionLeadNumber').value.trim().replace(/[^0-9]/g, ''),
      registeredMonth: $('actionRegisteredMonth').value,
      customer: $('actionCustomer').value.trim(),
      tradeIn: $('actionTradeIn').value,
      oss: $('actionOss').value,
      insurance: $('actionInsurance').value,
      paymentMethod: $('actionPaymentMethod').value
    };
    var apiCall;
    if (action.type === 'hold') apiCall = gasRun('api_registerHold', action.commission, info, 'normal');
    else apiCall = gasRun('api_confirmOrder', action.commission, info);

    $('actionModalError').classList.add('hidden');
    setButtonBusy(btn, true, ACTION_LABELS[action.type].busyLabel);

    apiCall.then(function () {
      finishActionSubmit_(btn);
    }).catch(function (err) {
      handleActionSubmitError_(btn, err);
    });
  });

  function findOrderByCommission_(commission) {
    var groups = state.ordersGroups || [];
    for (var i = 0; i < groups.length; i++) {
      var items = groups[i].items || [];
      for (var j = 0; j < items.length; j++) {
        if (commissionEquals_(items[j].commission, commission)) return items[j];
      }
    }
    // 受注リストの検索・絞り込み条件で対象外になっていても（マイページ等、
    // 別画面のカードから操作した場合など）見つけられるよう、フィルタに
    // 左右されない全件キャッシュ（state.allOrders）も探す。
    return (state.allOrders || []).find(function (o) { return commissionEquals_(o.commission, commission); }) || null;

  function populateStaffFilter_(selectId) {
    var select = $(selectId);
    var current = select.value;
    var names = ((state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.staffList) || [])
      .map(function (s) { return s.name; })
      .filter(function (n) { return n; });
    select.innerHTML = '';
    select.appendChild(new Option('担当者：すべて', ''));
    names.forEach(function (n) { select.appendChild(new Option(n, n)); });
    if (names.indexOf(current) !== -1) select.value = current;
  }

  /**
   * 拠点フィルタの選択肢は、担当者マスタに登録済みの拠点名から動的に作る
   * （担当者マスタの拠点は、Hold登録・受注確定の「販売拠点」欄の初期値としても
   * 使われる同じ値のため、実際に使われうる拠点名の一覧として流用できる）。
   */
  function populateLocationFilter_(selectId) {
    var select = $(selectId);
    var current = select.value;
    var locations = [];
    ((state.bootstrap && state.bootstrap.settings && state.bootstrap.settings.staffList) || []).forEach(function (s) {
      var loc = s.location;
      if (loc && locations.indexOf(loc) === -1) locations.push(loc);
    });
    select.innerHTML = '';
    select.appendChild(new Option('拠点：すべて', ''));
    locations.forEach(function (loc) { select.appendChild(new Option(loc, loc)); });
    if (locations.indexOf(current) !== -1) select.value = current;
  }

  function renderSettings(settings) {
    // システムマスタ（ロゴ・メール通知設定・担当者）は、コード上の
    // SYSTEM_ADMIN_EMAILS（Constants.gs）に登録された利用者のみに表示する。
    // サーバー側（Api.gs）でも非管理者の設定値は既に空にリダクトされているため
    // （ロゴは全利用者に表示する必要があるデータのため例外）、
    // ここではUI上の表示・非表示のみを制御する（実データの保護自体はサーバー側で行っている）。
    var isAdmin = !!(state.bootstrap && state.bootstrap.isSystemAdmin);
    $('systemMasterGroupTitle').classList.toggle('hidden', !isAdmin);
    $('systemMasterSpreadsheetTitleCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterAppTitleCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterLogoCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterNotifyCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterStaffCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterBodyTypeCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterModelPhotoCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterAnnouncementCard').classList.toggle('hidden', !isAdmin);
    $('systemMasterCelebrationCard').classList.toggle('hidden', !isAdmin);
    // 業販受注リストのタブ（レール・下タブバーとも.navBtn--wholesale）も、
    // システムマスタと同じく管理者権限を持つ担当者にのみ表示する。非管理者が
    // タブ自体を切り替えられてしまうと、api_listWholesaleOrdersが空配列を
    // 返すだけの空の画面になって混乱するため、そもそもタブを見せない。
    document.querySelectorAll('.navBtn--wholesale').forEach(function (el) { el.classList.toggle('hidden', !isAdmin); });
    renderCelebrationVariantSelects_(settings.celebrationVariants);

    // ランダムテーマの抽選結果（resolvedRandomThemePreset_）は、ここ
    // （renderSettingsは初回起動時・設定保存後の再取得時の両方で呼ばれる）では
    // クリアしない。「ログインのたび（＝ページを開き直すたび）に変わる」という
    // 仕様のため、同じページを開いている間（他の設定を保存した場合を含む）は
    // 同じ抽選結果を使い続ける必要がある（テーマを選び直した場合の再抽選は
    // #themePresetGridのクリックハンドラ側で行う）。
    state.themeKey = settings.themeKey;
    renderThemePresets_();
    $('spreadsheetTitleMax').textContent = (state.bootstrap && state.bootstrap.spreadsheetTitleMax) || 100;
    $('settingsSpreadsheetTitle').value = (state.bootstrap && state.bootstrap.spreadsheetTitle) || '';
    $('settingsSpreadsheetTitleError').classList.add('hidden');

    // _expandedは折りたたみ表示（renderStaffList参照）の開閉状態を持つ、画面表示専用の

    state.modelPhotos = (settings.modelPhotos || []).map(function (p) {

    });

    $('homeAnnouncementMax').textContent = (state.bootstrap && state.bootstrap.homeAnnouncementMax) || 60;
    $('settingsHomeAnnouncement').value = settings.homeAnnouncement || '';
    populateOrdersStaffFilter_();
    populateOrdersLocationFilter_();
    populateLocationFilter_('wholesaleOrdersLocationFilter');
  }

  /**
   * Hold登録・受注確定の演出バリエーション選択欄（設定タブ）を
   * 描画する。選択肢・ラベルはサーバー側の1箇所（Constants.gsのCELEBRATION_
   * VARIANT_OPTIONS/CELEBRATION_VARIANT_LABELS）から取得し、クライアント側では
   * 重複定義しない。
   */
  function renderCelebrationVariantSelects_(celebrationVariants) {
    var options = (state.bootstrap && state.bootstrap.celebrationVariantOptions) || ['A', 'B', 'C', 'D'];
    var labels = (state.bootstrap && state.bootstrap.celebrationVariantLabels) || {};
    var current = celebrationVariants || {};
    [
      ['celebrationVariantHold', 'hold'],
      ['celebrationVariantOrder', 'order']
    ].forEach(function (pair) {
